<!doctype html>
<html lang="en" data-brand="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>People Ops Desk · Northstar Labs</title>
<meta name="description" content="People Ops Desk — HR help desk, knowledge base and automation console for Northstar Labs: ticket queue with SLAs, agent workspace, smart deflection, approvals and service analytics. Concept prototype with illustrative data.">
<meta name="theme-color" content="#2563EB">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='13' fill='%232563EB'/%3E%3Ccircle cx='24' cy='24' r='13' fill='none' stroke='%23fff' stroke-width='3.2'/%3E%3Ccircle cx='24' cy='24' r='5.5' fill='none' stroke='%23fff' stroke-width='3.2'/%3E%3Cpath d='M15 15l4.5 4.5M33 15l-4.5 4.5M15 33l4.5-4.5M33 33l-4.5-4.5' stroke='%23fff' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/ns.css">
<script src="../shared/ns.js"></script>
<script src="../shared/ns-data.js"></script>
<style>
  /* ---- shared bits ---- */
  .tid{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);letter-spacing:.01em;white-space:nowrap}
  .sla{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .sla i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
  .sla.met{background:var(--ok-bg);color:var(--ok)}
  .sla.risk{background:var(--warn-bg);color:var(--warn)}
  .sla.breached{background:var(--bad-bg);color:var(--bad)}
  .sla.paused,.sla.done{background:var(--surface-3);color:var(--ink-3)}
  .sla.done{color:var(--ok)}
  .pri{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap}
  .pri i{width:8px;height:8px;border-radius:2px;flex:none;background:var(--neutral)}
  .pri.Low i{background:var(--ink-4)}.pri.Normal i{background:var(--info)}.pri.High i{background:var(--warn)}.pri.Urgent i{background:var(--bad)}
  .cat-dot{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
  .cat-dot .ns-icon-box{width:24px;height:24px;border-radius:7px}
  .cat-dot .ns-icon-box svg{width:13px;height:13px}
  .kpi-target{font-size:11px;color:var(--ink-4);margin-top:2px}
  .subject-cell{min-width:0}
  .subject-cell .s{font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
  @media (min-width:1600px){.subject-cell .s{max-width:420px}}
  .subject-cell .r{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px;margin-top:2px}
  .subject-cell .r .ns-avatar{--sz:18px;font-size:8px}
  .att-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2)}
  .att-row:last-child{border-bottom:0}
  .att-row .t{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .att-row .m{font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
  .view-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .bulkbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--brand-soft);border:1px solid var(--brand-line);margin-bottom:12px;font-size:13px}
  .bulkbar b{color:var(--brand-text)}
  /* ---- ticket workspace ---- */
  .tk-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
  .tk-side{display:grid;gap:16px;position:sticky;top:calc(var(--topbar-h) + 20px)}
  @media (max-width:1100px){.tk-layout{grid-template-columns:minmax(0,1fr)}.tk-side{position:static}}
  .tk-head h1{font-size:20px;line-height:1.3;margin:6px 0 8px;letter-spacing:-.01em}
  .tk-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .tk-timers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
  .timer{padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2)}
  .timer .l{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4)}
  .timer .v{font-size:15px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
  .timer .s{font-size:11.5px;color:var(--ink-3);margin-top:2px}
  .thread{display:grid;gap:14px}
  .msg{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start}
  .msg.mine{grid-template-columns:minmax(0,1fr) 32px}
  .msg.mine .ns-avatar{order:2}
  .msg .bub{padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.55;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-2);max-width:min(100%,640px);white-space:pre-wrap;overflow-wrap:anywhere}
  .msg.mine .bub{background:var(--brand-soft);border-color:var(--brand-line);justify-self:end;border-bottom-right-radius:4px}
  .msg:not(.mine) .bub{border-bottom-left-radius:4px}
  .msg.bot .bub{background:linear-gradient(135deg,var(--brand-soft),var(--surface-2));border-style:dashed}
  .msg.note .bub{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 30%,transparent);font-size:13px}
  .msg .who{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--ink-3);margin-bottom:4px;flex-wrap:wrap}
  .msg.mine .who{justify-content:flex-end}
  .msg .who b{color:var(--ink-2)}
  .msg .ns-avatar{--sz:32px;font-size:12px}
  .msg .art-chip{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:5px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--brand-text);text-decoration:none}
  .composer{border:1px solid var(--line-strong);border-radius:14px;background:var(--surface);overflow:hidden;transition:border-color var(--dur),box-shadow var(--dur)}
  .composer:focus-within{border-color:var(--brand);box-shadow:var(--focus)}
  .composer.note{border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:var(--warn-bg)}
  .composer textarea{width:100%;border:0;background:transparent;padding:12px 14px;font:inherit;font-size:13.5px;min-height:96px;resize:vertical;color:var(--ink);outline:none}
  .composer .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border-top:1px solid var(--line-2)}
  .prop-grid{display:grid;gap:10px}
  .prop-grid label{display:grid;gap:4px;font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
  .prop-grid .ns-select{font-size:13px;height:34px}
  .sim-row{display:grid;gap:2px;padding:8px 0;border-bottom:1px solid var(--line-2);text-decoration:none;color:inherit}
  .sim-row:last-child{border-bottom:0}
  .sim-row .t{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sim-row .m{font-size:11.5px;color:var(--ink-3);display:flex;gap:8px;align-items:center}
  .req-card{display:grid;gap:10px}
  .req-card .top{display:flex;gap:12px;align-items:center}
  .req-card .ns-dl{font-size:12.5px;gap:6px 14px}
  /* ---- raise a request ---- */
  .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .cat-card{display:grid;gap:8px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;transition:all var(--dur);cursor:pointer;font:inherit;color:inherit}
  .cat-card:hover{border-color:var(--ink-4);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
  .cat-card[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 1px var(--brand)}
  .cat-card b{font-size:13px;line-height:1.3}
  .cat-card span{font-size:11.5px;color:var(--ink-3)}
  .dyk{display:grid;gap:8px}
  .dyk a{display:grid;gap:4px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:inherit;transition:border-color var(--dur)}
  .dyk a:hover{border-color:var(--brand-line)}
  .dyk .t{font-weight:600;font-size:13px}
  .dyk .s{font-size:12px;color:var(--ink-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .urg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .urg button{padding:10px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);display:grid;gap:2px;justify-items:center;cursor:pointer}
  .urg button small{font-weight:500;color:var(--ink-4);font-size:11px}
  .urg button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-text)}
  @media (max-width:560px){.urg{grid-template-columns:repeat(2,1fr)}}
  /* ---- stars / approvals / rules / kb ---- */
  .stars{display:inline-flex;gap:4px}
  .stars button{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink-4);border:1px solid var(--line);background:var(--surface);cursor:pointer}
  .stars button svg{width:18px;height:18px}
  .stars button.on{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
  .appr{display:grid;gap:12px}
  .appr .hd{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .appr .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
  .appr .fact{padding:8px 10px;border-radius:10px;background:var(--surface-2);font-size:12.5px}
  .appr .fact b{display:block;font-size:11px;color:var(--ink-4);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
  .rule{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line-2)}
  .rule:last-child{border-bottom:0}
  .rule .nm{font-weight:600;font-size:13.5px}
  .rule .desc{font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .rule .stats{display:flex;gap:18px;font-size:12px;color:var(--ink-3);flex-wrap:wrap;margin-top:8px}
  .rule .stats b{color:var(--ink);font-variant-numeric:tabular-nums}
  .rule.off{opacity:.55}
  @media (max-width:640px){.rule{grid-template-columns:auto minmax(0,1fr)}.rule > :last-child{grid-column:1/-1;justify-self:start}}
  .kb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .kb-card{display:grid;gap:8px;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:inherit;transition:all var(--dur);align-content:start}
  .kb-card:hover{border-color:var(--brand-line);box-shadow:var(--shadow);transform:translateY(-1px)}
  .kb-card .t{font-weight:600;font-size:14px;line-height:1.35}
  .kb-card .s{font-size:12.5px;color:var(--ink-3);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .kb-card .f{display:flex;gap:12px;font-size:11.5px;color:var(--ink-4);margin-top:auto;flex-wrap:wrap}
  .kb-body{font-size:14.5px;line-height:1.7;color:var(--ink-2);max-width:72ch}
  .kb-body p{margin:0 0 14px}
  .kb-body h4{font-size:14px;margin:18px 0 6px;color:var(--ink)}
  .helpful{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-radius:12px;background:var(--surface-2)}
  .gap-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px}
  .gap-row:last-child{border-bottom:0}
  .hours-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .hours-grid label{display:grid;justify-items:center;gap:6px;padding:8px 4px;border-radius:10px;border:1px solid var(--line);font-size:12px;cursor:pointer}
  .hours-grid label.on{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-text);font-weight:600}
  .sla-table input{width:70px;text-align:right}
  .ins-list{display:grid;gap:8px}
  .ins{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:12.5px}
  .ins svg{width:15px;height:15px;flex:none;margin-top:2px;color:var(--brand)}
  .ins b{display:block;font-size:13px}
  .badge-status{white-space:nowrap}
  /* ---- completion layer ---- */
  [hidden]{display:none!important}
  .kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
  .kpis .ns-stat .val{font-size:24px}
  @media (max-width:1320px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis .ns-stat .val{font-size:21px}}
  .bot-av{background:var(--brand-soft)!important;color:var(--brand-text)!important}
  .bot-av svg{width:58%;height:58%}
  .att-row.clickable,a.att-row{cursor:pointer;margin:0 -10px;padding:10px;border-radius:10px;transition:background var(--dur)}
  .att-row.clickable:hover,a.att-row:hover{background:var(--surface-2)}
  .att-row > svg{width:16px;height:16px;color:var(--ink-4)}
  .row-breach td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
  .rowchk{width:16px;height:16px;accent-color:var(--brand);cursor:pointer;vertical-align:middle;margin:0}
  td.selcell{cursor:pointer}
  .hero-search{position:relative;max-width:580px}
  .hero-search .ns-input{height:46px;font-size:15px;background:#fff;color:#0f172a;border-color:transparent;box-shadow:0 10px 30px -12px rgba(0,0,0,.45)}
  .hero-search .ns-input-wrap > svg{color:#64748b}
  .hero-res{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;display:grid;max-height:380px;overflow:auto}
  .hero-res a{display:grid;gap:2px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink)}
  .hero-res a:hover{background:var(--surface-2)}
  .hero-res a b{font-size:13.5px;color:var(--ink)}
  .hero-res a span{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hero-res .more{color:var(--brand-text);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;border-top:1px solid var(--line-2);border-radius:0 0 10px 10px}
  .hero-res .none{padding:12px;font-size:13px;color:var(--ink-2)}
  .dyk .dyk-item{display:grid;gap:8px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
  .dyk .dyk-item a{padding:0;border:0;background:none;border-radius:0}
  .dyk .dyk-item .ns-btn,.dyk .dyk-item .ns-badge{justify-self:start}
  .dyk .dyk-item.done{border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-bg)}
  .dropzone{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px dashed var(--line-strong);border-radius:12px;font-size:13px;color:var(--ink-3);cursor:pointer;transition:all var(--dur)}
  .dropzone:hover{border-color:var(--brand);color:var(--brand-text)}
  .dropzone svg{width:16px;height:16px;flex:none}
  .flow-step{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--surface-2);font-size:13px;margin-bottom:6px}
  .flow-step svg{width:15px;height:15px;color:var(--brand);flex:none}
  .flow-step .n{width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;display:grid;place-items:center;flex:none}
  .rule-spark{width:84px;height:28px;display:block}
  .rule-spark svg{width:100%;height:100%}
  @media (max-width:640px){.rule-spark{display:none}}
  .draft-box{min-height:180px;max-height:320px;overflow:auto;padding:12px 14px;border:1px solid var(--line-strong);border-radius:12px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;background:var(--surface);color:var(--ink);outline:none}
  .draft-box:focus{border-color:var(--brand);box-shadow:var(--focus)}
  .kb-title{font-size:26px;line-height:1.25;letter-spacing:-.015em;margin:12px 0 8px}
  .kb-lead{font-size:16px;line-height:1.6;color:var(--ink);margin:16px 0 18px;padding-bottom:16px;border-bottom:1px solid var(--line-2);max-width:72ch}
  .flip svg{transform:scaleY(-1)}
  .csat-card .stars button{width:40px;height:40px}
  .ns-card-head h3 > svg{width:16px;height:16px;vertical-align:-3px;color:var(--warn);margin-right:2px}
  .hours-grid label .xs{font-weight:500;opacity:.75}
  @media (max-width:560px){.hours-grid{grid-template-columns:repeat(4,1fr)}}
  .gap-row .truncate{min-width:0}
  .timer .v.muted{color:var(--ink-3)}
  .tk-titlebar{display:flex;gap:10px 16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .tk-titlebar h1{flex:1 1 320px;min-width:0}
  .tk-titlebar > div{margin-top:8px}
  @media (max-width:720px){.tk-head h1{font-size:18px}.kb-title{font-size:22px}}
</style>
</head>
<body>
<script>
(function () {
  'use strict';
  const D = NSData, U = NS.util, F = NS.fmt, raw = NS.raw, ic = NS.ic; const html = (st, ...v) => st.reduce((a, x, i) => a + x + (i < v.length ? (Array.isArray(v[i]) ? v[i].map(NS.str).join('') : NS.str(v[i] == null || v[i] === false ? '' : v[i])) : ''), '');
  const store = NS.store('people-ops-desk');
  const NOW = new Date('2026-09-24T10:00:00');
  const HOUR = 3600000, DAY = 86400000;
  let CLOCK = 0; // simulated minutes since NOW — every persisted action advances the desk clock a little
  const nowMs = () => NOW.getTime() + CLOCK * 60000;
  const iso = (d) => new Date(d).toISOString();
  const addH = (d, h) => new Date(new Date(d).getTime() + h * HOUR);
  const ago = (d) => { const s = Math.round((nowMs() - new Date(d)) / 1000); const a = Math.abs(s), fut = s < 0; const f = (n, u) => `${fut ? 'in ' : ''}${n} ${u}${n === 1 ? '' : 's'}${fut ? '' : ' ago'}`; if (a < 60) return 'just now'; if (a < 3600) return f(Math.round(a / 60), 'min'); if (a < DAY / 1000) return f(Math.round(a / 3600), 'hour'); if (a < 30 * DAY / 1000) return f(Math.round(a / 86400), 'day'); return f(Math.round(a / (30 * 86400)), 'month'); };
  const dur = (ms) => { const a = Math.abs(ms); if (a < HOUR) return `${Math.max(1, Math.round(a / 60000))}m`; if (a < DAY) { const h = Math.floor(a / HOUR), m = Math.round((a % HOUR) / 60000); return m ? `${h}h ${m}m` : `${h}h`; } const d = Math.floor(a / DAY), h = Math.round((a % DAY) / HOUR); return h ? `${d}d ${h}h` : `${d}d`; };
  const hrs = (h) => (h < 1 ? `${Math.round(h * 60)} min` : h < 24 ? `${U.round(h, 1)} h` : `${U.round(h / 24, 1)} d`);
  const when = (d) => `${F.date(d, 'short')} · ${F.time(d)}`;

  /* ------------------------------------------------------------------ */
  /* 1. Domain content                                                   */
  /* ------------------------------------------------------------------ */
  const CATS = [
    { id: 'payroll', name: 'Payroll', icon: 'banknote', color: 'var(--viz-1)', w: 16, hint: 'Payslips, tax forms, salary' },
    { id: 'leave', name: 'Leave & time off', icon: 'calendar', color: 'var(--viz-2)', w: 18, hint: 'Balances, requests, holidays' },
    { id: 'benefits', name: 'Benefits', icon: 'heart-pulse', color: 'var(--viz-3)', w: 10, hint: 'Insurance, enrolment, wellness' },
    { id: 'letters', name: 'Letters & documents', icon: 'file-text', color: 'var(--viz-4)', w: 12, hint: 'Employment, visa, bank letters' },
    { id: 'onboarding', name: 'Onboarding', icon: 'user-plus', color: 'var(--viz-5)', w: 8, hint: 'New joiners, equipment, day one' },

  const KB = [
    ['KB-101', 'payroll', 'Where to find your payslips and tax documents', 'Payslips are published under Pay → Documents on the first working day after pay day; annual tax statements appear in Tax documents each April.', ['Every payslip is stored in the HRIS under Pay → Documents. They are published once the payroll batch is signed off, which is the first working day after pay day — so a payslip for a salary credited on the 31st usually appears on the 1st or 2nd.', 'Annual tax statements and employer certificates are generated in the first week of April for the previous financial year and appear under Pay → Tax documents. They are final unless a correction run is issued, in which case you are notified by email.', 'If a document is missing more than two working days after pay day, raise a Payroll request with the month in the subject. Please do not email screenshots of payslips — they contain personal data and the desk can see your record directly.']],
    ['KB-102', 'payroll', 'Payroll calendar and cutoff dates', 'Changes submitted before the 20th are reflected in the same month; later changes roll to the next run. Off-cycle runs happen on the last day of the month.', ['Payroll locks on the 20th of each month at 18:00 in the payroll entity’s time zone. Anything approved after lock — overtime, allowances, bank changes, new joiners — is processed in the next regular run.', 'An off-cycle run on the last working day catches approved corrections that would otherwise wait a full month. It is limited to corrections and final settlements; new recurring elements always start in a regular run.', 'Pay day is the last working day of the month in every country. Where local banking holidays interfere, the credit is brought forward, never delayed.']],
    ['KB-103', 'payroll', 'Changing your bank account for salary', 'Use the guided bank-change form; it validates account details live and applies to the same month if submitted before the 20th.', ['Bank changes are self-service. Go to Pay → Bank details → Change and follow the guided form. The form validates the account number and bank code with the bank network while you type, which removes the most common reason for a rejected credit.', 'You will receive a confirmation email with a 24-hour window to reverse the change — a safeguard against fraudulent requests. No cheque or letter is required; a screenshot of the account header is enough if the name differs from your HRIS record.', 'Submissions before the 20th apply to the same month. If you change accounts after the cutoff, the current month is still paid to the old account, so keep it open until the first credit lands in the new one.']],
    ['KB-104', 'leave', 'Annual leave: accrual, carry-over and expiry', 'Annual leave accrues monthly, up to 5 unused days carry over and expire on 31 March. Your live balance is on the HRIS home card.', ['Annual leave accrues on the first of each month at one-twelfth of your annual entitlement, pro-rated in your joining and leaving months. Leave taken in advance of accrual is allowed up to 5 days with manager approval.', 'Up to 5 unused days carry over into the next calendar year and must be used by 31 March. Days above the cap are forfeited unless a statutory rule in your country says otherwise, in which case the local rule wins.', 'Your live balance, including approved future leave, is on the HRIS home card and in the Time-off tool. Balances recalculate overnight, so a request approved this afternoon shows tomorrow morning.', 'Leave keeps accruing during parental leave, sick leave and sabbaticals of up to three months. If your balance drops after returning from any of these, raise a Leave request and the desk will recalculate it.']],
    ['KB-105', 'leave', 'Sick leave and medical certificates', 'Log sick days within 10 days; a medical certificate is needed from the fourth consecutive day. Entitlement resets each January.', ['Sick leave is logged in the Time-off tool under “Sick”, ideally on the day itself and at the latest within 10 days. Your manager is notified automatically — a separate message is courteous but not required.', 'A medical certificate is required from the fourth consecutive working day and is uploaded to the same request. Certificates are visible only to People Operations, never to your manager.', 'Paid sick leave entitlement follows your country’s policy and resets on 1 January. If you exhaust it, the desk will talk you through income protection and unpaid options before anything changes on your payslip.']],
    ['KB-106', 'leave', 'Compassionate and emergency leave', 'Up to 5 paid days for a bereavement or family emergency, no documentation required. Extensions are agreed with your HRBP.', ['You can take up to 5 working days of paid compassionate leave for a bereavement or serious family emergency. Log them under “Compassionate” in the Time-off tool; nothing else is needed.', 'If you need more time, talk to your manager or your HR Business Partner — extensions of unpaid leave or a phased return are agreed case by case and quickly.', 'The employee assistance programme is available around the clock for you and your household. It is confidential and independent of the company.']],
    ['KB-107', 'leave', 'Public holiday calendars by office', 'Your holiday calendar follows your work location in the HRIS. Transfers switch calendars from the effective date.', ['Each office has its own public holiday calendar, maintained by People Operations and loaded into the Time-off tool a year in advance. You follow the calendar of the work location on your HRIS profile.', 'When you transfer between offices, the calendar switches on the effective date of the transfer. Holidays already taken under the old calendar are not clawed back.', 'Remote employees follow the calendar of the legal entity that employs them. If you regularly work from another country, see the working-from-abroad guide.']],
    ['KB-108', 'benefits', 'Open enrolment 2026: dates and what you can change', 'Open enrolment runs 15 September to 6 October; changes take effect 1 November. Outside the window only life events unlock changes.', ['Open enrolment is the once-a-year window to change your medical, dental and vision tiers, add or remove dependants and adjust voluntary cover. This year it runs from 15 September to 6 October.', 'Changes take effect on 1 November. If you do nothing, your current elections roll over unchanged, except where a plan has been discontinued — in which case you are mapped to the closest equivalent and told by email.', 'Outside the window, elections can only change after a qualifying life event: marriage, birth or adoption, a partner losing cover, or a relocation. You have 30 days from the event.']],
    ['KB-109', 'benefits', 'Adding a dependant after a life event', 'Add a spouse, partner or child within 30 days of the event under Benefits → Life events. Cover starts from the event date.', ['Go to Benefits → Life events, choose the event and upload the supporting document (marriage certificate, birth certificate or proof of the partner’s loss of cover). Cover for the new dependant starts from the event date, not the upload date.', 'You have 30 days from the event. After that, the next chance is open enrolment, so set a reminder even if the paperwork takes time — you can submit the event first and attach documents later.', 'Adding a dependant changes your contribution from the next payroll. The premium table for each tier is on the benefits portal.']],
    ['KB-110', 'benefits', 'Wellness allowance: what qualifies', 'Gyms, yoga studios, sports clubs and mental-health apps qualify up to the annual cap; equipment and clothing do not.', ['The wellness allowance reimburses recurring fitness and wellbeing costs: gym and studio memberships (including yoga and climbing), sports club fees, swimming passes and subscriptions to approved mental-health or meditation apps.', 'It does not cover equipment, clothing, one-off events or medical treatment. Home-office equipment has its own budget.', 'Claim through the wellness card in the benefits portal with the monthly invoice. The cap is 600 in local currency per calendar year and resets on 1 January.']],
    ['KB-111', 'benefits', 'Employee stock purchase plan basics', 'Enrol in the equity portal during the quarterly window; contribute 1–10% of base salary and buy shares at a 15% discount.', ['The ESPP lets you buy company shares through payroll deductions at a 15% discount to the lower of the price at the start or end of each six-month offering period.', 'Enrolment windows open on the first two weeks of every quarter in the equity portal, which is separate from the benefits portal. You choose a contribution between 1% and 10% of base salary.', 'You can lower or stop contributions at any time; increases take effect at the next window. Talk to a tax adviser about the treatment in your country — the desk can explain the mechanics but not give tax advice.']],
    ['KB-112', 'letters', 'Requesting employment and visa letters', 'Standard letters are generated from your HRIS record and e-signed within one business day. Choose the template in Documents → Request a letter.', ['Six standard letters are available on demand: employment verification, visa support (with salary and travel dates), address confirmation, salary breakdown, experience letter and probation confirmation. Request them under Documents → Request a letter.', 'The letter is generated from your HRIS record, so check your title, address and salary details first. It is e-signed by the People Operations Lead and delivered to My documents within one business day — usually within the hour.', 'Non-standard wording — an embassy’s specific format, a bank’s template — is handled by the desk. Raise a Letters request and attach the format you were given.']],
    ['KB-113', 'letters', 'Salary and bank loan letters', 'Banks usually need a salary breakdown letter plus your last three payslips. Both are self-service.', ['The salary breakdown letter lists basic pay, fixed allowances and target variable pay on company letterhead. Request it from Documents → Request a letter; it is signed and delivered the same day.', 'Most lenders also ask for the last three payslips and sometimes the annual tax statement — all under Pay → Documents. Some ask the employer to fill their own form; attach it to a Letters request and the desk completes it within two business days.', 'The desk never confirms salary details to a third party over the phone. Lenders who call are directed to the letter you provide.']],
    ['KB-114', 'onboarding', 'Your first week: the onboarding checklist explained', 'The checklist covers contracts, accounts, equipment and intros. Items turn amber three days before they are due and remind you automatically.', ['Your onboarding checklist opens the day you sign and runs to the end of your first month. Each item has an owner — you, your manager, your buddy or a support team — and a due date relative to your start.', 'Items turn amber three days before they are due and the desk assistant sends one reminder. Overdue items open a ticket automatically so a human can help; you do not need to chase anyone.', 'Your buddy is a peer outside your reporting line who helps with the unwritten things. If the buddy field is empty a week before your start, your manager gets a nudge.', 'Policy acknowledgements (Code of Conduct, Acceptable Use, Data handling) must be signed before you receive system access on day one.']],
    ['KB-115', 'onboarding', 'Equipment delivery and IT setup before day one', 'Laptops ship 7 days before your start date; tracking appears in your checklist. Accounts activate at 08:00 local time on day one.', ['IT ships your laptop and peripherals seven days before your start date to the address on your offer. A tracking link appears on the checklist the moment it leaves the warehouse.', 'If the shipment slips, tell the desk as soon as you know: local offices keep loaners, and remote joiners can be moved to a next-day courier.', 'Accounts — SSO, email, HRIS, chat — activate at 08:00 local time on your start date. Logging in earlier from another time zone shows the account as inactive; that is expected.']],
    ['KB-116', 'onboarding', 'Background verification: what to expect', 'Verification covers identity, education and the last two employers and usually completes in 5–10 working days. It never delays your start.', ['Our verification partner checks identity documents, highest qualification and the last two employers. You receive a link to upload documents the day after you sign; most cases complete within 5–10 working days.', 'Delays are almost always a previous employer not responding. The partner chases three times; if there is still no answer, payslips or a relieving letter from that employer are accepted instead.', 'A pending verification never delays your start date. If a check comes back with a discrepancy, People Operations talks to you first, confidentially, before anything else happens.']],
    ['KB-117', 'offboarding', 'Leaving Northstar: notice, handover and final pay', 'Resign in the HRIS to start the clock. Final pay, including unused leave, is paid in the run after your last day.', ['Resignations are submitted in the HRIS under My employment → Resign; that timestamp starts your notice period. Your manager confirms the last working day and the offboarding checklist opens.', 'Full and final settlement is paid in the regular payroll run after your last day and includes salary to date, encashment of unused annual leave and any pro-rated bonus you are eligible for. Deductions cover outstanding advances or unreturned equipment.', 'Your relieving and experience letters are issued once equipment is returned and the checklist is complete, normally within three working days of your last day.', 'Exit interviews are voluntary and can be held with someone outside your reporting line — just say so when booking.']],
    ['KB-118', 'offboarding', 'Returning equipment when you leave', 'Office-based leavers return kit to the local IT desk; remote leavers get a prepaid courier pickup. Reset devices only after IT confirms backup.', ['If you work from an office, return your laptop, peripherals and badge to the local IT desk on your last day. Remote leavers receive a prepaid courier label and a pickup slot in the week of their last day.', 'Do not factory-reset the laptop until IT confirms the backup of any work data — IT messages you on the checklist when it is safe.', 'Unreturned equipment is deducted from the final settlement at depreciated value, so keep the courier receipt until the checklist item closes.']],
    ['KB-119', 'policy', 'Working from abroad: the 30-day rule', 'You can work from an approved country for up to 30 days a year with manager approval. Request it two weeks ahead.', ['Short-term work from another country is allowed for up to 30 calendar days per year, as long as the country is on the approved list and you have your manager’s approval. Submit the request under Time & Location → Work from abroad at least two weeks before you travel.', 'The 30-day limit exists because longer stays can create tax and social-security obligations for you and the company. Requests beyond 30 days are reviewed by People Operations and Legal case by case.', 'You remain employed by your home entity, keep your local benefits and follow your home public holiday calendar while abroad.']],
    ['KB-120', 'policy', 'Notice periods by level and country', 'Notice is set in your contract: typically 30–60 days for individual contributors and 90 days for senior levels and managers.', ['Your contract states your notice period and takes precedence over anything written here. As a guide, individual contributors up to P3 have 30 days in North America and Europe and 60 days in India; P4 and above and all people managers have 90 days everywhere.', 'Notice can be shortened by agreement with your manager, particularly when the handover is complete. Garden leave is used only in specific circumstances agreed with Legal.', 'During notice you keep full pay and benefits and continue to accrue leave.']],
    ['KB-121', 'policy', 'Employee referral programme', 'Refer through the careers portal; the bonus pays out after the hire completes 90 days. Re-hires qualify after a 12-month gap.', ['Submit referrals through the careers portal so the candidate is linked to you from the start. Referrals made after a candidate has already applied cannot be linked retroactively.', 'The referral bonus depends on the role level and is paid through payroll after the new hire completes 90 days. You must still be employed at that point.', 'Re-hires qualify if the person left more than 12 months ago. Hiring managers, interviewers on the panel and People team members are not eligible for a bonus on roles they influence.']],
    ['KB-122', 'policy', 'Probation and confirmation', 'Probation is six months and confirmation is automatic unless an extension is raised before the end date.', ['New employees have a six-month probation period (three months in some countries, as stated in your contract). Your manager holds check-ins at 30, 60 and 90 days and a final review in month five.', 'Confirmation is automatic on the end date unless your manager raises an extension beforehand. Extensions are for a maximum of three months and always come with a written development plan.', 'A confirmation letter is generated automatically and stored under My documents on the day after your probation ends.']],
    ['KB-123', 'hris', 'Updating your personal details in the HRIS', 'Address, phone, emergency contacts and pronouns are self-service under Profile. Legal name and date of birth changes need a document.', ['Most personal details are self-service under Profile → Personal: home address, phone numbers, emergency contacts, preferred name and pronouns. Changes save immediately and sync to payroll and benefits overnight.', 'Legal name, date of birth and nationality changes require a supporting document and are reviewed by People Operations within one business day.', 'Address changes made before the 20th are reflected in the same month’s payroll and tax record. The guided address form also updates your insurance and courier addresses.']],
    ['KB-124', 'hris', 'Manager access and reporting lines', 'Manager dashboards unlock when the reporting-line change is approved. Approvals route to the new manager from the effective date.', ['Manager features — the team dashboard, leave approvals, expense approvals and compensation visibility — are granted automatically when the HRIS shows at least one direct report.', 'A reporting-line change needs approval from the outgoing manager (or their manager) and takes effect on the date in the transaction. Until then, approvals continue to route to the previous manager.', 'If you have reports but no dashboard, the change is probably pending approval; raise an HRIS access request and the desk will chase it.']],
    ['KB-125', 'hris', 'Resetting HRIS two-factor authentication', 'Lost your device? Use a recovery code, or verify your identity with the desk on a short video call to reset two-factor.', ['If you still have your recovery codes, use one at the two-factor prompt and re-enrol a new device from Profile → Security.', 'Without recovery codes, raise an HRIS access request. The desk verifies your identity on a short video call (never by email or chat) and resets two-factor; you re-enrol on your next login.', 'Store new recovery codes in the company password manager so a lost phone is a five-minute fix next time.']],
    ['KB-126', 'relocation', 'Relocation packages: what is covered', 'Packages include flights, 30 days of temporary housing, shipping, a settling-in allowance and immigration support, scaled by move type.', ['Every company-initiated relocation includes one-way flights for you and your family, 30 days of temporary housing, shipping of household goods, a settling-in allowance and full immigration support through our partner.', 'Employee-initiated moves receive a lighter package (flights, 14 days of housing and immigration support). Your relocation agreement lists exactly what applies to you.', 'Temporary housing can be extended when delays are outside your control, such as a landlord slipping a handover date. Ask the desk before the 30 days end.', 'Relocation costs are subject to a 12-month repayment clause if you resign voluntarily within a year of the move.']],
    ['KB-127', 'relocation', 'Visa sponsorship and renewals', 'The company sponsors work visas and renewals in full through our immigration partner. Renewals start three months before expiry.', ['Work visas for sponsored roles are handled end to end by our immigration partner, including dependants. You upload documents to the partner portal and attend biometrics; the partner and the desk handle the rest.', 'Renewals start three months before expiry. The desk opens the case automatically from the expiry date in your HRIS record, so make sure it is correct.', 'Business visas for travel are arranged by the travel desk, not by People Operations — start with the travel portal.']],
    ['KB-128', 'expenses', 'Expense policy essentials: receipts, limits, approvals', 'Submit within 60 days with itemised receipts; claims above the single-approval limit need a second approver.', ['Expenses must be submitted within 60 days of the spend with itemised receipts. Small items below the receipt threshold can be claimed with a missing-receipt declaration.', 'Your manager approves claims up to the single-approval limit; larger claims route to a second approver in Finance automatically, which is the usual reason a report stays “awaiting approval” after your manager has approved it.', 'Approved claims are reimbursed with the weekly payment run every Friday, to the bank account on your HRIS record.']],
    ['KB-129', 'expenses', 'Travel per diems and corporate cards', 'Per diems follow city tiers and replace meal receipts. Client entertainment is claimed separately with attendee names.', ['Per diems are paid per travel day according to the destination’s tier in the travel policy and replace individual meal receipts. Days with company-provided meals are reduced proportionally.', 'Client entertainment is not covered by per diems — claim it as entertainment with the names and companies of attendees.', 'Corporate cards have a monthly limit that includes flights booked through the travel tool. If a card is declined on a trip, pay personally, keep the receipt and claim it as out-of-pocket; the desk can raise the limit for future travel months.']],
    ['KB-130', 'learning', 'Using your learning budget', 'Everyone has an annual learning budget for courses, certifications, books and conferences. Requests are approved by your manager in the learning tool.', ['Your annual learning budget covers external courses, certification exams, books and conference tickets. It resets each January and unused budget does not carry over.', 'Request spend under Learning → External courses. Your manager approves; invoices from approved providers are paid directly, otherwise you claim the receipt as an expense.', 'Conference travel and hotels come from the team travel budget, not your learning budget. Mandatory compliance training is always free and outside the budget.']],
    ['KB-131', 'other', 'Employee assistance programme', 'Confidential 24/7 counselling and practical support for you and your household, independent of the company.', ['The employee assistance programme gives you and everyone in your household confidential access to counsellors, legal and financial guidance and practical support, 24 hours a day.', 'It is run by an independent provider. The company only sees anonymous usage totals — never who used the service or why.', 'Up to six counselling sessions per issue are included, in person or by video, in most languages spoken across our offices.']],
    ['KB-132', 'other', 'Legal name and pronoun changes', 'Update pronouns yourself under Profile; legal name changes need a certificate and flow to payroll, insurance and your email alias.', ['Pronouns and preferred name are self-service under Profile → About me and sync to the directory and chat tools overnight.', 'Legal name changes require a marriage certificate, deed poll or court order and are processed by the desk within one business day. Payroll, insurance, equity and your email address follow from the HRIS record.', 'Your old email address remains an alias for 12 months so nothing gets lost.']],
  ];
  const ARTICLES = KB.map(([id, c, title, summary, body]) => ({ id, cat: c, title, summary, body }));
  const article = (id) => ARTICLES.find((a) => a.id === id);
  const artsFor = (c) => ARTICLES.filter((a) => a.cat === c);

  /* ------------------------------------------------------------------ */
  /* 2. People, policy & mappings                                        */
  /* ------------------------------------------------------------------ */
  const AG_IDS = ['NS-1910', 'NS-2706', 'NS-2707', 'NS-2708', 'NS-2709'];
  const AGENTS = AG_IDS.map((id) => D.byId(id));
  const ME_AGENT = 'NS-1910', HRBP_ID = 'NS-1902', HRBP_ORGS = ['Platform', 'Core Services', 'Data & ML'];
  const BOT = { id: 'bot', name: 'Desk assistant', first: 'Desk assistant', title: 'Automation', hue: 4 };
  const who = (id) => (id === 'bot' ? BOT : D.byId(id)) || BOT;
  const DEF_SLA = { Low: { fr: 24, res: 120 }, Normal: { fr: 8, res: 72 }, High: { fr: 4, res: 24 }, Urgent: { fr: 1, res: 4 } };
  const DEF_ROUTE = { payroll: 'NS-2706', leave: 'NS-2708', benefits: 'NS-2709', letters: 'NS-2706', onboarding: 'NS-2707', offboarding: 'NS-2707', policy: 'NS-1910', hris: 'NS-2708', relocation: 'NS-2709', expenses: 'NS-2706', learning: 'NS-2707', other: 'NS-1910' };
  // linked knowledge article per subject template (0 = no article → knowledge gap)
  const KBMAP = { payroll: [101, 101, 103, 102, 103, 0], leave: [104, 104, 105, 0, 107, 106], benefits: [109, 108, 0, 110, 0, 111], letters: [112, 112, 112, 113, 112, 0], onboarding: [115, 114, 114, 116, 115, 0], offboarding: [117, 117, 117, 118, 117, 117], policy: [119, 120, 121, 0, 0, 122], hris: [123, 124, 125, 0, 123, 124], relocation: [127, 126, 0, 127, 126, 127], expenses: [128, 129, 0, 0, 129, 128], learning: [130, 0, 130, 0, 126, 0], other: [132, 0, 0, 0, 131, 132] };
  const RULE_RX = { payslip: /payslip|pay slip|tax (form|statement|document)|salary slip/i, balance: /balance|how many (leave|days)|leave days|carry[- ]?over|public holiday/i, letters: /letter|verification|certificate|proof of/i, bank: /bank|account detail|home address|change (my )?address|emergency contact/i, benefits: /enrol|benefit|insurance|dependant|dependent|newborn|gym|wellness|stock purchase|espp/i };
  const RULE_META = { payslip: { icon: 'banknote', kb: 'KB-101', short: 'Payslips & tax' }, balance: { icon: 'calendar', kb: 'KB-104', short: 'Leave balance' }, letters: { icon: 'file-text', kb: 'KB-112', short: 'Letters' }, bank: { icon: 'key', kb: 'KB-103', short: 'Address & bank' }, benefits: { icon: 'heart-pulse', kb: 'KB-108', short: 'Benefits FAQ' }, onboard: { icon: 'user-plus', kb: 'KB-114', short: 'Onboarding' }, offboard: { icon: 'user-minus', kb: 'KB-117', short: 'Offboarding' } };
  const FLOW_W = { payslip: 26, balance: 30, letters: 8, bank: 14, benefits: 22, onboard: 0, offboard: 0 };

  /* ------------------------------------------------------------------ */
  /* 3. Ticket generator (deterministic)                                 */
  /* ------------------------------------------------------------------ */
  const rng = NS.rng(4381);
  const R_ = (a, b) => NS.between(rng, a, b);
  const pick = (arr) => NS.pick(rng, arr);
  const wpick = (pairs) => { const tot = pairs.reduce((a, p) => a + p[1], 0); let r = rng() * tot; for (const p of pairs) { r -= p[1]; if (r <= 0) return p[0]; } return pairs[pairs.length - 1][0]; };
  const fill = (s, o) => String(s).replace(/\{(\w+)\}/g, (m, k) => (o[k] != null ? o[k] : m));
  const POOL = D.people.filter((p) => p.status === 'Active' && !AG_IDS.includes(p.id) && !['NS-1207', 'NS-1180', HRBP_ID].includes(p.id));
  const HOUR_W = [0, 0, 0, 0, 0, 0, 1, 3, 6, 10, 12, 11, 8, 9, 11, 10, 8, 6, 4, 3, 2, 1, 0, 0].map((w, h) => [h, w]);
  const CSAT_GOOD = [[5, 60], [4, 27], [3, 8], [2, 3], [1, 2]], CSAT_BAD = [[5, 22], [4, 30], [3, 26], [2, 13], [1, 9]];
  const WINDOW = 84, WEEKS_N = 12, NOWT = NOW.getTime();
  const orgPeople = (org) => D.people.filter((p) => p.org === org && p.status === 'Active' && !p.isManager);

  const RULE_CATS = CATS.filter((x) => SUBJ[x.id].some((y) => y[1]));
  const makeTicket = (sp = {}) => {
    const created = sp.age != null ? NOWT - sp.age * HOUR : sp.created;
    const c = sp.cat || wpick((sp.auto ? RULE_CATS : CATS).map((x) => [x.id, x.w]));
    const list = SUBJ[c];
    let si = sp.s;
    if (si == null) { const ri = [], hi = []; list.forEach((x, i) => (x[1] ? ri : hi).push(i)); si = sp.auto || !hi.length || rng() < 0.1 ? pick(ri.length ? ri : hi) : pick(hi); }
    const [subject, rule, opener, resol] = list[si];
    const auto = !!sp.auto && !!rule;
    const sys = rule === 'onboard' || rule === 'offboard';
    const ch = sp.ch || (sys && auto ? 'Automation' : wpick([['Portal', 55], ['Email', 25], ['Chat', 20]]));
    const pri = sp.pri || (rule === 'offboard' ? 'High' : auto ? wpick([['Low', 30], ['Normal', 62], ['High', 8]]) : wpick(Object.entries(PRI_W)));
    const req = sp.req || pick(POOL).id; const rp = D.byId(req);
    const kb = KBMAP[c][si] ? 'KB-' + KBMAP[c][si] : '';
    const t = { cat: c, si, subject, rule: rule || '', auto, ch, pri, req, raisedBy: '', kb, created, asg: '', esc: '', csat: null, wait: 0, frAt: null, resAt: null, status: 'New', thread: [] };
    const first = rp.first, n = Math.round(R_(8, 21)), ageH = (NOWT - created) / HOUR;
    const res = fill(resol, { n });
    if (auto) {
      const at = created + R_(1, 4) * 60000; t.frAt = at; t.resAt = at;
      t.thread.push({ by: sys ? 'bot' : req, role: sys ? 'bot' : 'req', text: opener, at: created });
      t.thread.push({ by: 'bot', role: 'bot', text: sys ? res : fill(pick(BOT_OPEN), { first, res, kb: kb ? article(kb).title : 'People Ops' }), at, kb });
      if (!sys && rng() < 0.4) t.thread.push({ by: req, role: 'req', text: fill(pick(THANKS), { agent: 'team' }), at: at + R_(8, 90) * 60000 });
      t.status = sp.status || (NOWT - at > 3 * DAY ? 'Closed' : 'Resolved');
    } else {
      const ag = sp.asg != null ? sp.asg : rng() < 0.72 ? DEF_ROUTE[c] : pick(AG_IDS);
      const tg = DEF_SLA[pri];
      const complex = sp.complex != null ? sp.complex : ['relocation', 'offboarding', 'onboarding', 'other', 'policy'].includes(c) ? rng() < 0.46 : rng() < 0.2;
      const ask = sp.status === 'Waiting on requester' || complex || rng() < 0.25;
      const waitH = complex ? R_(48, 260) : ask ? R_(3, 26) : 0;
      const workH = tg.res * 0.4 * Math.exp(NS.gauss(rng) * 0.66);
      const frH = Math.min(tg.fr * 0.3 * Math.exp(NS.gauss(rng) * 0.65), workH * 0.6);
      let st = sp.status;
      if (!st) st = ageH < frH ? 'New' : ageH < workH + waitH ? (ask && rng() < 0.8 ? 'Waiting on requester' : 'Open') : 'Resolved';
      t.thread.push({ by: req, role: 'req', text: opener, at: created });
      t.asg = st === 'New' && sp.asg == null && rng() < 0.65 ? '' : ag;
      if (st !== 'New') {
        const fr = created + Math.min(frH, ageH * 0.45) * HOUR; t.frAt = fr;
        const agent = t.asg || ag || DEF_ROUTE[c]; t.asg = agent;
        t.thread.push({ by: agent, role: 'agent', text: fill(ask ? pick(ASKS) : pick(ACKS), { first }), at: fr });
        if (rng() < 0.42) t.thread.push({ by: agent, role: 'note', text: fill(pick(NOTES), { ref: 'PD-' + Math.round(R_(4090, 4360)) }), at: fr + R_(10, 90) * 60000 });
        if (st === 'Waiting on requester') t.wait = NOWT - fr;

    root.querySelectorAll('[data-prop]').forEach((s) => s.onchange = () => { const k = s.dataset.prop, v = s.value, o = { [k]: v }; const lbl = { status: 'Status', pri: 'Priority', cat: 'Category', asg: 'Assignee' }[k]; if (k === 'status' && v === 'Resolved' && !t.resAt) { o.resAt = P.nowMs(); o.frAt = t.frAt || o.resAt; } if (k === 'status' && isOpen({ status: v }) && t.resAt) { o.resAt = null; } if (k === 'asg' && v && t.status === 'New') o.status = 'Open'; const shown = k === 'cat' ? cat(v).name : k === 'asg' ? (v ? who(v).name : 'Unassigned') : v; patch(t.id, o, `${lbl} → ${shown}`); NS.toast(`${lbl} updated`, { desc: `${t.id} · ${shown}` }); NS.refresh(); });
    root.querySelector('[data-linkkb]').onclick = (e) => NS.dropdown(e.currentTarget, { items: [{ head: 'Link an article' }, ...searchKB(t.subject, t.cat, 5).concat(allArticles().filter((a) => a.cat === t.cat)).filter((a, i, arr) => arr.indexOf(a) === i).slice(0, 7).map((a) => ({ label: a.title, sub: a.id, checked: a.id === t.kb, onClick: () => { patch(t.id, { kb: a.id }, `Linked ${a.id}`); NS.toast('Article linked', { desc: a.title }); NS.refresh(); } }))] });
    const act = (k) => root.querySelector(`[data-act="${k}"]`);
    if (act('resolve')) act('resolve').onclick = () => resolveModal(c, t);
    if (act('reopen')) act('reopen').onclick = () => { patch(t.id, { status: 'Open', resAt: null }, 'Reopened'); NS.toast(`${t.id} reopened`); NS.refresh(); };
    if (act('escalate')) act('escalate').onclick = () => { const rp = who(t.req), inOrgs = HRBP_ORGS.includes(rp.org); const hrbps = D.people.filter((p) => p.team === 'People Partners' && p.status === 'Active'); NS.modal({ title: `Escalate ${t.id} to an HR Business Partner`, sub: 'The HRBP gets the full thread and internal notes. You stay on the ticket until it closes.', body: `<label class="ns-field"><span class="ns-label">HR Business Partner</span><select class="ns-select" id="escTo">${hrbps.map((p) => `<option value="${p.id}" ${p.id === HRBP_ID && inOrgs ? 'selected' : ''}>${NS.esc(p.name)}${p.id === HRBP_ID ? ` · ${HRBP_ORGS.join(', ')}` : ''}</option>`).join('')}</select></label><label class="ns-field mt-3"><span class="ns-label">Why does this need an HRBP?</span><textarea class="ns-textarea" id="escWhy" rows="3" placeholder="e.g. Manager conflict mentioned in the thread; needs a confidential conversation"></textarea></label>`, actions: [{ label: 'Cancel' }, { label: 'Escalate', cls: 'primary', icon: 'flag', onClick: (m) => { const to = m.el.querySelector('#escTo').value, why = m.el.querySelector('#escWhy').value.trim(); if (!why) { m.el.querySelector('#escWhy').focus(); return false; } addMsg(t.id, { by: c.persona.personId, role: 'note', text: `Escalated to ${who(to).name}: ${why}` }); patch(t.id, { esc: to }, `Escalated to ${who(to).name}`); NS.toast('Escalated', { desc: `${t.id} → ${who(to).name}` }); NS.refresh(); } }] }); };
    if (act('return')) act('return').onclick = () => { addMsg(t.id, { by: c.persona.personId, role: 'note', text: 'Handing back to People Ops — spoke with the requester and their manager; nothing further needed from the HRBP side.' }); patch(t.id, { esc: '' }, `Handed back by ${who(c.persona.personId).name}`); NS.toast('Handed back to People Ops', { desc: t.id }); NS.go('/queue', { view: 'esc' }); };
    if (act('merge')) act('merge').onclick = () => { const cands = U.sortBy(T.filter((x) => x.id !== t.id && x.status !== 'Closed' && (x.req === t.req || (x.cat === t.cat && x.si === t.si))), 'updated', -1).slice(0, 8); NS.modal({ title: `Merge ${t.id} into…`, sub: 'The conversation is copied into the target ticket and this one closes.', body: cands.length ? `<div class="grid gap-2">${cands.map((x, i) => `<label class="ns-check" style="padding:10px 12px;border:1px solid var(--line);border-radius:10px;width:100%"><input type="radio" name="mg" value="${x.id}" ${i === 0 ? 'checked' : ''}><span class="min-w-0"><b class="sm">${x.id} · ${NS.esc(x.subject)}</b><div class="xs muted">${NS.esc(who(x.req).name)} · ${x.status} · ${ago(x.updated)}</div></span></label>`).join('')}</div>` : NS.empty({ icon: 'git-branch', title: 'Nothing to merge with', body: 'No open tickets from this requester or with the same subject.' }), actions: cands.length ? [{ label: 'Cancel' }, { label: 'Merge', cls: 'primary', onClick: (m) => { const to = m.el.querySelector('input[name=mg]:checked').value; addMsg(to, { by: c.persona.personId, role: 'note', text: `Merged ${t.id} (“${t.subject}”) into this ticket.` }); addMsg(t.id, { by: c.persona.personId, role: 'note', text: `Merged into ${to}.` }); patch(t.id, { status: 'Closed', merged: to, resAt: t.resAt || P.nowMs() }, `Merged into ${to}`); NS.toast(`Merged ${t.id} into ${to}`, { desc: 'Requester notified · this ticket is closed' }); NS.go('/ticket/' + to); } }] : [{ label: 'Close' }] }); };
  };
  const hrOnly = (c) => c.persona.id === 'hrbp';
  const mountReqTicket = (c, root, t) => {
    root.querySelectorAll('[data-rate]').forEach((b) => { b.onmouseenter = () => root.querySelectorAll('[data-rate]').forEach((x) => x.classList.toggle('on', +x.dataset.rate <= +b.dataset.rate)); b.onclick = () => { const n = +b.dataset.rate, note = (root.querySelector('#csatNote') || {}).value || ''; patch(t.id, { csat: n, csatNote: note }, `CSAT ${n}/5 received`); NS.toast('Thanks for the rating', { desc: `${t.id} · ${n} of 5${note ? ' · comment shared with the team' : ''}` }); NS.refresh(); }; });
    const f = root.querySelector('#rFile'); let file = ''; if (f) f.onchange = () => { file = f.files[0] ? f.files[0].name : ''; root.querySelector('#rFileLbl').textContent = file || 'Attach file'; };
    const s = root.querySelector('#rSend'); if (s) s.onclick = () => { const ta = root.querySelector('#rReply'), txt = ta.value.trim(); if (!txt) { ta.focus(); return; } const wasOpen = isOpen(t); addMsg(t.id, { by: c.persona.personId, role: 'req', text: txt, file }); const o = {}; if (t.status === 'Waiting on requester') { o.status = 'Open'; const lastAsk = [...t.thread].reverse().find((m) => m.role === 'agent'); o.wait = lastAsk ? P.nowMs() - lastAsk.at : t.wait || 0; } if (!wasOpen) { o.status = 'Open'; o.resAt = null; } if (Object.keys(o).length) patch(t.id, o, !wasOpen ? `Reopened by ${who(c.persona.personId).first}` : 'Requester replied · SLA clock resumed'); NS.toast(wasOpen ? 'Reply sent' : 'Request reopened', { desc: `${t.id} · ${t.asg ? who(t.asg).first + ' will pick it up' : 'the team will pick it up'}` }); NS.refresh(); };
    const w = root.querySelector('[data-withdraw]'); if (w) w.onclick = async () => { if (await NS.confirm({ title: 'Close this request?', body: 'We’ll mark it resolved. You can reply within 7 days to reopen it.', confirmLabel: 'Close request' })) { addMsg(t.id, { by: c.persona.personId, role: 'req', text: 'Found what I needed — closing this. Thanks!' }); patch(t.id, { status: 'Resolved', resAt: P.nowMs(), frAt: t.frAt || P.nowMs() }, `Closed by ${who(c.persona.personId).first}`); NS.toast('Request closed', { desc: t.id }); NS.refresh(); } };
  };
  R['/ticket/:id'] = {
    title: (c) => c.params.id, nav: (c) => (isAgent(c) ? (c.persona.id === 'hrbp' ? 'queue' : 'queue') : 'my'),
    crumbs: (c) => [isAgent(c) ? { label: c.persona.id === 'hrbp' ? 'Escalations' : 'Queue', href: NS.link('/queue') } : { label: 'My requests', href: NS.link('/my') }, { label: c.params.id }],
    render: (c) => { const t = tk(c.params.id); if (!t) return NS.empty({ icon: 'search', title: `${c.params.id} not found`, body: 'It may have been merged or the link is mistyped.', action: `<a class="ns-btn secondary" href="${NS.link('/home')}">Back home</a>` }); if (!canSee(c.persona, t)) return NS.empty({ icon: 'lock', title: 'You don’t have access to this request', body: 'Requests are visible to the requester, their manager (status only) and People Ops.', action: `<a class="ns-btn secondary" href="${NS.link('/home')}">Back home</a>` }); return isAgent(c) ? agentTicket(c, t) : reqTicket(c, t); },
    mounted: (c, root) => { const t = tk(c.params.id); if (!t || !canSee(c.persona, t)) return; if (isAgent(c)) mountAgentTicket(c, root, t); else mountReqTicket(c, root, t); },
  };
  Object.assign(P, { canSee, events, tile, homeAgent });
})();
</script>
<script>
(function () {
  'use strict';
  const P = window.__PD;
  const { D, U, F, raw, ic, html, S, T, HOUR, DAY, NOWT, ago, dur, hrs, when, fill, CATS, cat, PRIS, STATUSES, SUBJ, RULES, RULE_META, AG_IDS, ME_AGENT, HRBP_ID, HRBP_ORGS, who, isOpen, human, slaOf, slaT, kpis, weekly, WEEKS, WEEK_LABELS, weekOf, priBadge, stBadge, catChip, av, botAv, asgCell, slaBadge, slaSort, csv, meOf, visible, mine, eta, stars, starText, tk, patch, addMsg, findArticle, allArticles, kbStats, searchKB, ruleStats, coverage, ruleOn, allRules, APPROVALS, APPR_HISTORY, AP_TYPES, pc, R, store } = P;
  const save = P.save;
  const tlink = (t) => NS.link('/ticket/' + t.id);
  const catOn = (id) => !S.settings.cats[id] || S.settings.cats[id].on !== false;

  /* NEW REQUEST --------------------------------------------------------- */
  let NEWF = { cat: '', subject: '', details: '', pri: 'Normal', file: '', behalf: '', done: {}, sig: '' };
  const URG = [['Low', 'Whenever', 'No rush'], ['Normal', 'This week', 'Most requests'], ['High', 'Blocking me', 'Work is stuck'], ['Urgent', 'Pay or access down', 'Today, please']];
  const etaLine = (pri) => { const tg = slaT(pri), n = P.nowMs(); return `First reply by <b>${F.date(n + tg.fr * HOUR, 'short')}, ${F.time(n + tg.fr * HOUR)}</b> · resolved within <b>${hrs(tg.res)}</b> (${F.date(n + tg.res * HOUR, 'short')})`; };
  const dykHtml = () => {
    const q = (NEWF.subject + ' ' + NEWF.details).trim();
    const hits = q.length >= 3 ? searchKB(q, NEWF.cat, 3) : NEWF.cat ? P.artsFor(NEWF.cat).slice(0, 3) : U.sortBy(allArticles(), (a) => kbStats(a).views, -1).slice(0, 3);
    const any = Object.keys(NEWF.done).length;
    return `${any ? `<div class="ns-alert ok">${NS.icon('check-circle')}<div><b>Glad that helped</b><p>Nothing was submitted — you can close this page. We counted it as self-served.</p></div></div>` : ''}${hits.length ? hits.map((a) => `<div class="dyk-item ${NEWF.done[a.id] ? 'done' : ''}"><a href="${NS.link('/knowledge/' + a.id)}"><span class="t">${NS.esc(a.title)}</span><span class="s">${NS.esc(a.summary)}</span></a>${NEWF.done[a.id] ? `<span class="ns-badge ok sq">${NS.icon('check', { size: 12 })} Answered</span>` : `<button class="ns-btn xs secondary" data-defl="${a.id}">${NS.icon('thumbs-up')}This answers my question</button>`}</div>`).join('') : `<div class="sm muted">No close match yet — keep typing, or send it to a person.</div>`}`;
  };
  R['/new'] = {
    title: 'Raise a request', personas: ['employee', 'manager'],
    render: (c) => {
      const sig = JSON.stringify(c.query); if (sig !== NEWF.sig && Object.keys(c.query).length) { NEWF.sig = sig; if (c.query.cat) NEWF.cat = c.query.cat; if (c.query.subject) NEWF.subject = c.query.subject; }
      const me = meOf(c.persona), reports = c.persona.id === 'manager' ? D.reports(me.id) : [];
      const ag = NEWF.cat ? who(S.settings.route[NEWF.cat]) : null;
      return html`${raw(NS.pageHead({ eyebrow: 'People Ops Desk', title: 'Raise a request', sub: 'Tell us what you need. Answers appear as you type — if one fits, you’re done in seconds. If not, a person on the team picks it up.' }))}
        <div class="ns-grid main-side">
          <div class="ns-card"><div class="ns-card-body grid gap-5">
            <div><div class="ns-label mb-2">1 · What is it about?</div><div class="cat-grid">${raw(CATS.filter((x) => catOn(x.id)).map((x) => `<button type="button" class="cat-card" data-cat="${x.id}" aria-pressed="${NEWF.cat === x.id}">${catChip(x.id, { icon: true })}<b>${NS.esc(x.name)}</b><span>${NS.esc(x.hint)}</span></button>`).join(''))}</div></div>
            ${reports.length ? raw(`<label class="ns-field"><span class="ns-label">Who is this for?</span><select class="ns-select" id="nBehalf"><option value="">Myself</option>${reports.map((p) => `<option value="${p.id}" ${NEWF.behalf === p.id ? 'selected' : ''}>${NS.esc(p.name)} · ${NS.esc(p.title)}</option>`).join('')}</select><span class="xs muted">Raising on behalf of a report copies them on every update.</span></label>`) : ''}
            <label class="ns-field"><span class="ns-label">2 · Subject</span><input class="ns-input" id="nSub" maxlength="120" placeholder="e.g. Employment letter for my visa application" value="${NS.esc(NEWF.subject)}"></label>
            <label class="ns-field"><span class="ns-label">Details <span class="opt">optional, but it helps</span></span><textarea class="ns-textarea" id="nDet" rows="4" placeholder="Dates, amounts, what you’ve already tried…">${NS.esc(NEWF.details)}</textarea></label>
            <div class="ns-field"><span class="ns-label">3 · How urgent is it?</span><div class="urg">${raw(URG.map(([p, l, s]) => `<button type="button" data-urg="${p}" aria-pressed="${NEWF.pri === p}">${l}<small>${s}</small></button>`).join(''))}</div><div class="xs muted mt-2" id="nEta">${raw(etaLine(NEWF.pri))}</div></div>
            <label class="dropzone">${ic('paperclip')}<span id="nFileLbl">${NEWF.file ? NS.esc(NEWF.file) : 'Attach a screenshot or document (optional)'}</span><input type="file" id="nFile" hidden></label>
            <div class="ns-alert bad" id="nErr" hidden>${ic('alert-circle')}<div><b>A topic and a subject are needed</b><p>Pick what it’s about and write a short subject so we can route it.</p></div></div>
            <div class="flex gap-2 wrap items-center"><button class="ns-btn primary" id="nSubmit">${ic('send')}Submit request</button><a class="ns-btn ghost" href="${NS.link('/home')}">Cancel</a><span class="grow"></span><span class="xs muted" id="nRoute">${ag ? raw(`Goes to <b>${NS.esc(ag.name)}</b> · ${NS.esc(cat(NEWF.cat).name)}`) : ''}</span></div>
          </div></div>
          <div class="grid gap-4 min-w-0">
            ${raw(NS.card({ title: `${ic('lightbulb')} Did you know?`, sub: 'Answers that match what you’re typing', body: `<div class="dyk" id="dyk">${dykHtml()}</div>` }))}
            ${raw(NS.card({ title: 'What happens next', body: `<div class="ns-timeline"><div class="ns-tl-item done"><span class="pt">${NS.icon('zap')}</span><div><div class="ttl">Instant check</div><div class="sub">Automation answers standard questions — payslips, balances, letters — in under a minute.</div></div></div><div class="ns-tl-item"><span class="pt">${NS.icon('user-check')}</span><div><div class="ttl">Routed to a person</div><div class="sub">Everything else goes to the right specialist on People Operations.</div></div></div><div class="ns-tl-item"><span class="pt">${NS.icon('clock')}</span><div><div class="ttl">Reply within the SLA</div><div class="sub">You’ll see the promised time on your request.</div></div></div><div class="ns-tl-item"><span class="pt">${NS.icon('star')}</span><div><div class="ttl">Rate the answer</div><div class="sub">One tap. It decides what we automate next.</div></div></div></div>` }))}
          </div>
        </div>`;
    },
    mounted: (c, root) => {
      const dyk = root.querySelector('#dyk');
      const bindDyk = () => dyk.querySelectorAll('[data-defl]').forEach((b) => b.onclick = () => { const id = b.dataset.defl; S.defl[id] = (S.defl[id] || 0) + 1; save(); NEWF.done[id] = true; NS.toast('Glad that helped', { desc: `Counted as self-served — no ticket needed. ${findArticle(id).title}` }); dyk.innerHTML = dykHtml(); bindDyk(); });
      bindDyk();
      const upd = U.debounce(() => { dyk.innerHTML = dykHtml(); bindDyk(); }, 160);
      const sub = root.querySelector('#nSub'), det = root.querySelector('#nDet');
      sub.oninput = () => { NEWF.subject = sub.value; upd(); }; det.oninput = () => { NEWF.details = det.value; upd(); };
      root.querySelectorAll('[data-cat]').forEach((b) => b.onclick = () => { NEWF.cat = b.dataset.cat; root.querySelectorAll('[data-cat]').forEach((x) => x.setAttribute('aria-pressed', x === b)); const ag = who(S.settings.route[NEWF.cat]); root.querySelector('#nRoute').innerHTML = `Goes to <b>${NS.esc(ag.name)}</b> · ${NS.esc(cat(NEWF.cat).name)}`; if (!NEWF.pri || NEWF.pri === 'Normal') { NEWF.pri = (S.settings.cats[NEWF.cat] || {}).pri || 'Normal'; root.querySelectorAll('[data-urg]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.urg === NEWF.pri)); root.querySelector('#nEta').innerHTML = etaLine(NEWF.pri); } upd(); sub.focus(); });
      root.querySelectorAll('[data-urg]').forEach((b) => b.onclick = () => { NEWF.pri = b.dataset.urg; root.querySelectorAll('[data-urg]').forEach((x) => x.setAttribute('aria-pressed', x === b)); root.querySelector('#nEta').innerHTML = etaLine(NEWF.pri); });
      const bh = root.querySelector('#nBehalf'); if (bh) bh.onchange = () => (NEWF.behalf = bh.value);
      const f = root.querySelector('#nFile'); f.onchange = () => { NEWF.file = f.files[0] ? f.files[0].name : ''; root.querySelector('#nFileLbl').textContent = NEWF.file || 'Attach a screenshot or document (optional)'; };
      root.querySelector('#nSubmit').onclick = () => {
        if (!NEWF.cat || NEWF.subject.trim().length < 5) { root.querySelector('#nErr').hidden = false; (NEWF.cat ? sub : root.querySelector('.cat-card')).focus(); return; }
        const me = c.persona.personId, t = P.createTicket({ req: NEWF.behalf || me, raisedBy: NEWF.behalf ? me : '', cat: NEWF.cat, pri: NEWF.pri, subject: NEWF.subject.trim(), details: NEWF.details.trim(), file: NEWF.file });
        if (t.auto) NS.toast('Answered instantly', { desc: `${t.id} resolved by automation · ${P.ruleName(t.rule)}` });
        else NS.toast(`Request ${t.id} raised`, { desc: `${who(t.asg).first} on People Ops will reply by ${F.time(t.created + slaT(t.pri).fr * HOUR)}, ${F.date(t.created + slaT(t.pri).fr * HOUR, 'short')}` });
        NEWF = { cat: '', subject: '', details: '', pri: 'Normal', file: '', behalf: '', done: {}, sig: NEWF.sig };
        NS.go('/ticket/' + t.id);
      };
    },
  };

  /* MY REQUESTS ---------------------------------------------------------- */
  R['/my'] = {
    title: 'My requests', personas: ['employee', 'manager'],
    render: (c) => {
      const mgr = c.persona.id === 'manager', tab = mgr ? c.query.tab || 'mine' : 'mine', my = mine(c.persona), team = T.filter((t) => P.teamIds(c.persona.personId).includes(t.req));
      const L = tab === 'team' ? team : my;
      return html`${raw(NS.pageHead({ eyebrow: 'People Ops Desk', title: tab === 'team' ? 'Team requests' : 'My requests', sub: tab === 'team' ? 'Status of requests raised by your reports. Conversations stay private between them and People Ops.' : 'Everything you’ve asked People Operations, with the promised response times.', actions: `<a class="ns-btn primary" href="${NS.link('/new')}">${ic('plus')}New request</a>` }))}
        ${mgr ? raw(NS.tabs([{ id: 'mine', label: 'Mine', n: my.length }, { id: 'team', label: 'My team', n: team.length }], tab)) : ''}
        <div class="ns-stats mb-4">${raw(P.tile({ label: 'Open', value: L.filter(isOpen).length, icon: 'inbox', sub: L.filter(isOpen)[0] ? eta(U.sortBy(L.filter(isOpen), 'created', -1)[0]) : 'nothing in progress' }))}${raw(P.tile({ label: tab === 'team' ? 'Waiting on your team' : 'Waiting on you', value: L.filter((t) => t.status === 'Waiting on requester').length, icon: 'hourglass', sub: 'People Ops asked a question' }))}${raw(P.tile({ label: 'Answered instantly', value: L.filter((t) => t.auto).length, icon: 'bot', sub: `of ${L.length} in 12 weeks` }))}${raw(P.tile({ label: 'Average rating', value: L.filter((t) => t.csat).length ? F.num(U.avg(L.filter((t) => t.csat), 'csat'), 1) : '—', unit: L.filter((t) => t.csat).length ? '/ 5' : '', icon: 'star', sub: `${L.filter((t) => t.resAt && !t.csat && t.status === 'Resolved').length} waiting for a rating` }))}</div>
        <div id="myTable"></div>`;
    },
    mounted: (c, root) => {
      const tab = c.persona.id === 'manager' ? c.query.tab || 'mine' : 'mine';
      const L = tab === 'team' ? T.filter((t) => P.teamIds(c.persona.personId).includes(t.req)) : mine(c.persona);
      NS.table(root.querySelector('#myTable'), { rows: L, rowKey: 'id', pageSize: 12, sort: { key: 'updated', dir: -1 }, searchKeys: ['id', 'subject'], columns: [
        { key: 'id', label: 'Request', render: (t) => `<span class="tid">${t.id}</span>`, sort: (t) => t.n },
        { key: 'subject', label: 'Subject', render: (t) => `<div class="subject-cell"><div class="s">${NS.esc(t.subject)}</div><div class="r">${tab === 'team' ? `${NS.avatar(who(t.req), { size: 'xs' })}${NS.esc(who(t.req).name)} · ` : ''}${NS.esc(cat(t.cat).name)}${t.raisedBy && t.raisedBy !== t.req ? ` · raised by ${NS.esc(who(t.raisedBy).first)}` : ''}</div></div>`, sort: (t) => t.subject },
        { key: 'status', label: 'Status', render: (t) => stBadge(t.status), sort: (t) => STATUSES.indexOf(t.status) },
        { key: 'eta', label: 'Promised', render: (t) => `<span class="sm ${isOpen(t) && slaOf(t).st === 'breached' ? 'bad-text' : ''}">${eta(t)}</span>`, sort: (t) => (isOpen(t) ? slaOf(t).due || 0 : 9e15) },
        { key: 'by', label: 'Handled by', render: asgCell, sort: (t) => (t.asg ? who(t.asg).name : 'zz') },
        { key: 'updated', label: 'Last update', render: (t) => `<span class="xs muted nowrap">${ago(t.updated)}</span>`, sort: (t) => t.updated },
        { key: 'csat', label: 'Rating', align: 'right', render: (t) => (t.csat ? starText(t.csat) : t.resAt && t.status === 'Resolved' && tab !== 'team' ? `<a class="ns-btn xs secondary" href="${tlink(t)}">Rate</a>` : '<span class="faint">—</span>'), sort: (t) => t.csat || 0 },
      ], onRow: (t) => NS.go('/ticket/' + t.id), empty: { icon: 'inbox', title: 'No requests yet', body: 'When you raise one it shows up here with its promised response time.' } });
    },
  };

  const decide = (a, d, reason) => { S.appr[a.id] = { d, reason: reason || '', at: P.stamp() }; save(); NS.toast(d === 'Approved' ? 'Approved' : 'Declined', { desc: `${a.title} · ${who(a.req).first} has been notified`, type: d === 'Approved' ? 'ok' : 'info', action: { label: 'Undo', onClick: () => { delete S.appr[a.id]; save(); NS.refresh(); } } }); NS.refresh(); };

  const ARTICLE_IDS = new Set(P.ARTICLES.map((a) => a.id));

  /* SLA & ANALYTICS ------------------------------------------------------ */
  R['/sla'] = {
    title: 'Service analytics', personas: ['peopleops', 'hrbp'],
    render: (c) => {
      const hr = c.persona.id === 'hrbp', scope = c.query.scope || (hr ? 'orgs' : 'all'), L = scope === 'orgs' ? P.hrbpList() : T, k = kpis(L, 8, WEEKS - 1, scope === 'all'), pv = kpis(L, 4, 7, scope === 'all');

        <div class="kpis">${raw([
          P.tile({ label: 'Resolution SLA met', value: pc(k.compliance, 1), icon: 'timer', sub: `${NS.delta(U.round((k.compliance - pv.compliance) * 100, 1), { suf: ' pts' })} vs prior 4 wks` }),
          P.tile({ label: 'First response met', value: pc(k.frComp, 1), icon: 'send', sub: 'resolved tickets · 4 wks' }),
          P.tile({ label: 'Median first response', value: dur(k.frMed), icon: 'clock', sub: 'human-handled' }),
          P.tile({ label: 'Median resolution', value: dur(k.resMed), icon: 'check-circle', sub: 'excl. waiting on requester' }),
          P.tile({ label: 'CSAT', value: F.num(k.csat, 2), unit: '/ 5', icon: 'smile', sub: `${k.csatN} ratings · ${pc(k.csatRate)} response` }),

        ].join(''))}</div>
        <div class="ns-grid c2 mt-4">

          ${raw(NS.card({ title: 'CSAT by agent', sub: 'Average rating · number of ratings', body: '<div id="csatAg"></div>' }))}
          ${raw(NS.card({ title: 'When questions arrive', sub: 'Tickets by weekday and hour (desk time)', body: '<div id="heat"></div>' }))}
          ${raw(NS.card({ title: 'Time to first response', sub: 'Tickets by bucket — automation answers in minutes', body: '<div id="frDist"></div>' }))}

    },
  };

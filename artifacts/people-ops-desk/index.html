  /* ------------------------------------------------------------------ */
  const personas = [
    { ...D.personas.peopleops, note: 'Queue, automations, knowledge, SLAs' },
    { ...D.personas.employee, note: 'Raise requests and find answers' },
    { ...D.personas.manager, note: 'Approvals and team requests' },
    { ...D.personas.hrbp, note: 'Escalations and analytics for her orgs' },
  ];
  const dueToday = () => { const end = new Date(NOWT); end.setHours(23, 59, 59, 999); return T.filter((t) => isOpen(t) && t.status !== 'Waiting on requester' && slaOf(t).due <= end.getTime()); };
  NS.app({
    id: 'people-ops-desk', name: 'People Ops Desk', sub: 'Northstar Labs', brand: 'blue', version: '2.0',
    mark: ic('life-buoy', { size: 20 }),
    about: { tagline: 'Every people question answered — most of them instantly.', description: 'A help desk for People Operations built around deflection: employees get answers from the knowledge base and automation rules while they type, and only the questions that need judgement reach a person. Agents work a dense queue with SLA countdowns, macros, internal notes and HRBP escalation; managers approve leave, equipment, letters and relocations; People Partners see escalations and themes for their orgs.', highlights: [{ icon: 'bot', title: 'Automation first', body: 'Seven rules resolve payslip, leave-balance, letter and benefits questions in about a minute.' }, { icon: 'lightbulb', title: 'Smart deflection', body: 'Matching articles appear as you type a request; “this answers my question” counts as self-served.' }, { icon: 'timer', title: 'Live SLAs', body: 'Editable targets per priority, paused while waiting, with at-risk and breach flags.' }, { icon: 'book-open', title: 'Knowledge gaps', body: 'Repeat questions without an article become AI-drafted articles in one click.' }] },
    personas, defaultPersona: 'peopleops',
    nav: (p) => p.id === 'employee' ? [{ group: 'Help', items: [{ id: 'home', label: 'Home', icon: 'home' }, { id: 'new', label: 'Raise a request', icon: 'plus' }, { id: 'my', label: 'My requests', icon: 'inbox', badge: mine(p).filter(isOpen).length || '' }, { id: 'knowledge', label: 'Knowledge base', icon: 'book-open' }] }]
      : p.id === 'manager' ? [{ group: 'Manager', items: [{ id: 'home', label: 'Home', icon: 'home' }, { id: 'approvals', label: 'Approvals', icon: 'clipboard-check', badge: P.pendingAppr().length || '' }, { id: 'my', label: 'Requests', icon: 'inbox', badge: mine(p).filter(isOpen).length || '' }] }, { group: 'Help', items: [{ id: 'new', label: 'Raise a request', icon: 'plus' }, { id: 'knowledge', label: 'Knowledge base', icon: 'book-open' }] }]
      : p.id === 'hrbp' ? [{ group: 'Partner desk', items: [{ id: 'home', label: 'Home', icon: 'home' }, { id: 'queue', label: 'Escalations', icon: 'flag', badge: T.filter((t) => t.esc === HRBP_ID && isOpen(t)).length || '' }, { id: 'sla', label: 'Analytics', icon: 'bar-chart' }, { id: 'knowledge', label: 'Knowledge base', icon: 'book-open' }] }]
      : [{ group: 'Service desk', items: [{ id: 'home', label: 'Home', icon: 'home' }, { id: 'queue', label: 'Queue', icon: 'inbox', badge: T.filter(isOpen).length || '' }, { id: 'automations', label: 'Automations', icon: 'zap' }, { id: 'knowledge', label: 'Knowledge base', icon: 'book-open' }] }, { group: 'Insights', items: [{ id: 'sla', label: 'SLAs & analytics', icon: 'bar-chart' }] }, { group: 'Administration', items: [{ id: 'settings', label: 'Settings', icon: 'settings' }] }],
    promo: (p) => p.id === 'peopleops' ? (() => { const d = dueToday(), r = T.filter((t) => isOpen(t) && ['risk', 'breached'].includes(slaOf(t).st)).length; return { title: `${d.length} tickets due today`, body: `${r} at risk or breached · ${T.filter((t) => isOpen(t) && !t.asg && !t.auto).length} unassigned`, progress: Math.round(kpis(T).cov * 100), cta: { label: 'Work the queue', route: '/queue?view=risk' } }; })()
      : p.id === 'employee' ? { title: 'Open enrolment closes 6 Oct', body: 'Change tiers or add dependants — effective 1 November.', cta: { label: 'What you can change', route: '/knowledge/KB-108' } }
      : p.id === 'manager' ? { title: `${P.pendingAppr().length} approvals waiting`, body: 'Leave, equipment, a letter and a relocation from your team.', cta: { label: 'Review', route: '/approvals' } }
      : { title: `${T.filter((t) => t.esc === HRBP_ID && isOpen(t)).length} escalations open`, body: `Across ${HRBP_ORGS.join(', ')}.`, cta: { label: 'Open escalations', route: '/queue?view=esc' } },
    notifications: [
      { icon: 'timer', title: 'PD-4381 SLA at risk (Urgent)', body: 'Relieving letter not received — first response due in 30 min.', time: '2 min ago', route: '/ticket/PD-4381' },
      { icon: 'bot', title: 'Automation coverage hit 90% this week', body: 'Rules and articles answered 9 in 10 questions without a person.', time: '1 hour ago', route: '/automations' },
      { icon: 'clipboard-check', title: 'New approval: leave request from Rohan', body: 'Annual leave · 13–17 Oct · 5 days.', time: '5 hours ago', route: '/approvals' },
      { icon: 'lightbulb', title: 'Knowledge gap detected', body: '“Offer letter shows the wrong start date” was asked 8 times with no article.', time: 'Yesterday', route: '/knowledge?tab=gaps' },
      { icon: 'star', title: 'New 5★ rating', body: '“Perfect, thanks for the quick turnaround.” — PD-4371', time: 'Yesterday', route: '/queue?view=all' },
    ],
    routes: R, default: '/home',
    commands: (p) => (p.id === 'peopleops' ? [{ label: 'Work at-risk tickets', icon: 'timer', group: 'Actions', run: () => NS.go('/queue', { view: 'risk' }) }, { label: 'Create automation rule', icon: 'zap', group: 'Actions', run: () => NS.go('/automations', { new: 1 }) }, { label: 'Review knowledge gaps', icon: 'lightbulb', group: 'Actions', run: () => NS.go('/knowledge', { tab: 'gaps' }) }, { label: 'Edit SLA policy', icon: 'settings', group: 'Actions', run: () => NS.go('/settings') }] : p.id === 'hrbp' ? [{ label: 'Open escalations', icon: 'flag', group: 'Actions', run: () => NS.go('/queue', { view: 'esc' }) }, { label: 'Analytics for my orgs', icon: 'bar-chart', group: 'Actions', run: () => NS.go('/sla', { scope: 'orgs' }) }] : [{ label: 'Raise a request', icon: 'plus', group: 'Actions', run: () => NS.go('/new') }, { label: 'Where is my payslip?', icon: 'banknote', group: 'Answers', run: () => NS.go('/knowledge/KB-101') }, { label: 'Request an employment letter', icon: 'file-text', group: 'Answers', run: () => NS.go('/knowledge/KB-112') }, ...(p.id === 'manager' ? [{ label: 'Review approvals', icon: 'clipboard-check', group: 'Actions', run: () => NS.go('/approvals') }] : [])]),
    search: (q) => { if (q.length < 2) return []; const s = q.toLowerCase(), p = NS.persona; const tix = (P.isAgent({ persona: p }) ? visible(p) : visible(p)).filter((t) => t.id.toLowerCase().includes(s) || t.subject.toLowerCase().includes(s)).slice(0, 5).map((t) => ({ group: 'Tickets', label: `${t.id} · ${t.subject}`, hint: t.status, run: () => NS.go('/ticket/' + t.id) })); const arts = searchKB(q, null, 5).map((a) => ({ group: 'Knowledge base', label: a.title, hint: a.id, run: () => NS.go('/knowledge/' + a.id) })); return tix.concat(arts); },
    onReset: () => store.clear(),
  });
})();
</script>

        </div>
        <div class="grid gap-4">
          ${NS.card({ title: 'Reminder rules', sub: 'Set by People Partners', body: `<div class="grid gap-2 sm">${[['Automatic nudge 3 days before close', S.settings.reminders.d3], ['Final nudge on the last day', S.settings.reminders.d1], ['Weekly manager digest (counts only)', S.settings.reminders.digest]].map(([t, on]) => `<div class="flex justify-between gap-3"><span>${t}</span>${on ? NS.badge('On', 'ok') : NS.badge('Off', 'neutral')}</div>`).join('')}<div class="xs muted mt-2">Channel: ${NS.esc(S.settings.reminders.channel)} · one manual reminder per day.</div></div>` })}
          ${NS.card({ title: 'Reminder history', body: logs.length ? `<div class="grid gap-2">${logs.map((x) => `<div class="flex justify-between gap-3 sm"><span class="ink2">${NS.esc(x.msg)}</span><span class="xs faint nowrap">${F.rel(x.t)}</span></div>`).join('')}</div>` : '<div class="sm muted">No manual reminders yet this pulse. Automatic nudges went out on 20 Sept.</div>' })}
          ${NS.card({ title: 'Why no names?', body: '<p class="sm ink2">People answer honestly when they know they can’t be singled out. Participation is shown as a count, results appear only above the anonymity threshold, and comments reach you as themes. Reminders go to everyone who hasn’t answered — you never learn who that is.</p>' })}
        </div>
      </div>`;
  };
  const mountSurveyManager = (c, root) => {
    const team = teamPeople(MY_TEAM), weeks = [0, 0, 0, 0]; team.filter((p) => resp[p.id]).forEach((p) => { weeks[p.id === EMP ? 3 : weekOf(p)]++; });
    NS.chart.bars(root.querySelector('#wkBars'), { labels: WEEKS, series: [{ name: 'Responses', values: weeks, color: 'var(--viz-1)' }], height: 190, showValues: true, yFormat: (v) => String(Math.round(v)) });
    const orgAll = P.filter((p) => p.org === MY_ORG), eng = P.filter((p) => p.dept === 'Engineering');
    NS.chart.hbars(root.querySelector('#cmpPart'), { items: [{ label: MY_TEAM, value: pct(liveResp(MY_TEAM), team.length), color: 'var(--viz-1)', sub: 'Your team' }, { label: MY_ORG, value: pct(orgAll.filter((p) => resp[p.id]).length, orgAll.length), color: 'var(--ink-4)', sub: 'Org' }, { label: 'Engineering', value: pct(eng.filter((p) => resp[p.id]).length, eng.length), color: 'var(--ink-4)', sub: 'Department' }, { label: 'Northstar', value: pct(P.filter((p) => resp[p.id]).length, P.length), color: 'var(--ink-4)', sub: 'Company' }], max: 100, format: (v) => v + '%', valueLabel: 'Participation' });
    NS.chart.line(root.querySelector('#partHist'), { labels: MONTHS6, series: [{ name: MY_TEAM, values: [89, 100, 89, 100, 89, pct(liveResp(MY_TEAM), team.length)] }, { name: 'Company', values: [86, 88, 87, 89, 89, pct(P.filter((p) => resp[p.id]).length, P.length)], dashed: true, color: 'var(--ink-4)' }], yMin: 50, yMax: 100, height: 200, endLabels: true, yFormat: (v) => v + '%' });
    const rb = root.querySelector('#remind'); if (rb) rb.onclick = () => remindTeam(c.persona);
  };

  const cumCurve = (end, days, total, tau = 5.2) => U.range(days).map((i) => Math.round(end * (1 - Math.exp(-(i + 1) / tau)) / (1 - Math.exp(-total / tau))));
  const surveyHr = (c) => {
    const liveAll = P.filter((p) => resp[p.id]).length, below = TEAMS.filter((t) => pct(liveResp(t.name), teamPeople(t.name).length) < 85);
    return html`
      ${NS.pageHead({ eyebrow: 'September pulse', title: 'Participation', sub: `Opened 1 Sep · closes ${closeLbl()} · ${activeQuestions().length} driver questions + eNPS + one open comment`, actions: `<button class="ns-btn secondary" id="partCsv">${ic('download')}Export</button><button class="ns-btn primary" id="nudgeAll">${ic('megaphone')}Nudge ${below.filter((t) => !S.nudged[t.name]).length} managers</button>` })}
      <div class="ns-stats">
        ${NS.stat({ label: 'Participation', value: pct(liveAll, P.length), unit: '%', delta: NS.delta(pct(liveAll, P.length) - 89, { suf: ' pts vs Aug', d: 0 }), sub: `${F.int(liveAll)} of ${F.int(P.length)} employees` })}
        ${NS.stat({ label: 'Closes in', value: daysLeft(), unit: 'days', icon: 'clock', sub: `${closeLbl()} · 18:00 local time` })}
        ${NS.stat({ label: 'Teams below 85%', value: below.length, unit: `of ${TEAMS.length}`, icon: 'alert-triangle', sub: `${Object.keys(S.nudged).length} managers nudged this pulse` })}
        ${NS.stat({ label: 'Open comments', value: sepC().length, icon: 'message-square', sub: `${pct(sepC().length, COMPANY.n)}% of respondents left one` })}
      </div>
      <div class="ns-grid c2 mt-4">
        ${NS.card({ title: 'Response curve', sub: 'Cumulative participation by day · September vs August · target 85%', body: '<div id="cumLine"></div>' })}
        ${NS.card({ title: 'By department', sub: 'Participation rate · lowest first', body: '<div id="deptPart"></div>' })}
      </div>
      <div class="mt-4">${NS.card({ title: 'Teams by participation', sub: 'Counts only — individual response status is never stored against a name', actions: '<div class="ns-input-wrap">' + ic('search') + '<input class="ns-input" id="teamQ" placeholder="Search teams or managers…"></div>', bodyCls: 'flush', body: '<div id="partTable"></div>' })}</div>`;
  };
  const mountSurveyHr = (c, root) => {
    const aug = cumCurve(89, 24, 27, 7), sep = cumCurve(pct(P.filter((p) => resp[p.id]).length, P.length), 24, 24, 3.4);
    NS.chart.line(root.querySelector('#cumLine'), { labels: U.range(24).map((i) => `${i + 1} Sep`), series: [{ name: 'September', values: sep }, { name: 'August (same day)', values: aug, dashed: true, color: 'var(--ink-4)' }], yMin: 0, yMax: 100, height: 330, yFormat: (v) => v + '%' });
    NS.chart.hbars(root.querySelector('#deptPart'), { items: D.departments.map((d) => { const ps = P.filter((p) => p.dept === d.name), n = ps.filter((p) => resp[p.id]).length; return { label: d.name, value: pct(n, ps.length), sub: `${n} of ${ps.length}`, color: pct(n, ps.length) < 85 ? 'var(--viz-warn)' : 'var(--viz-1)' }; }).sort((a, b) => a.value - b.value), max: 100, format: (v) => v + '%', valueLabel: 'Participation' });
    const rows = TEAMS.map((t) => { const size = teamPeople(t.name).length, n = liveResp(t.name); return { name: t.name, org: t.org, mgr: t.mgr, n, size, part: pct(n, size) }; });
    const el = root.querySelector('#partTable');
    const tbl = NS.table(el, { rows, rowKey: 'name', pageSize: 10, sort: { key: 'part', dir: 1 }, searchKeys: ['name', 'org', (r) => r.mgr.name], columns: [
      { key: 'name', label: 'Team', render: (r) => `<b>${NS.esc(r.name)}</b><div class="xs muted">${NS.esc(r.org)}</div>` },
      { key: 'mgr', label: 'Manager', sort: (r) => r.mgr.name, render: (r) => `<span class="flex items-center gap-2">${NS.avatar(r.mgr, { size: 'xs' })}<span class="truncate">${NS.esc(r.mgr.name)}</span></span>` },
      { key: 'n', label: 'Responded', align: 'right', render: (r) => `${r.n} / ${r.size}` },
      { key: 'part', label: 'Rate', align: 'right', width: '150px', render: (r) => `<div class="pct-cell"><b class="tnum">${r.part}%</b>${NS.progress(r.part, { cls: r.part < 85 ? 'warn' : '' })}</div>` },
      { key: 'vis', label: 'Results', sort: (r) => (r.n >= thr() ? 1 : 0), render: (r) => (teamR(r.name).length >= thr() ? NS.badge('Visible', 'ok') : NS.badge('Below threshold', 'neutral')) },
      { key: 'act', label: '', sort: false, align: 'right', render: (r) => (S.nudged[r.name] ? `<span class="xs muted nowrap">${ic('check', { size: 12 })} Nudged</span>` : r.part < 100 ? `<button class="ns-btn xs secondary" data-nudge="${NS.esc(r.name)}">${ic('bell')}Nudge</button>` : '') },
    ] });
    const nudge = (names) => { names.forEach((n) => { S.nudged[n] = '2026-09-24'; }); save(); log(`Nudged ${F.plural(names.length, 'manager')} about participation`); tbl.refresh(); };
    el.addEventListener('click', (e) => { const b = e.target.closest('[data-nudge]'); if (!b) return; const t = teamByName[b.dataset.nudge]; nudge([t.name]); NS.toast(`Nudge sent to ${t.mgr.name}`, { desc: `${t.name}: ${liveResp(t.name)} of ${teamPeople(t.name).length} responded · the manager sees counts only`, type: 'ok' }); });
    root.querySelector('#teamQ').oninput = U.debounce((e) => tbl.setSearch(e.target.value), 150);
    root.querySelector('#nudgeAll').onclick = () => { const names = TEAMS.filter((t) => pct(liveResp(t.name), teamPeople(t.name).length) < 85 && !S.nudged[t.name]).map((t) => t.name); if (!names.length) { NS.toast('Every low-participation manager has been nudged', { type: 'info' }); return; } nudge(names); NS.toast(`${F.plural(names.length, 'manager')} nudged`, { desc: 'Each gets their own team’s count and a one-click reminder.', type: 'ok' }); NS.refresh(); };
    root.querySelector('#partCsv').onclick = () => downloadCsv('pulse-participation-sep.csv', [['Team', 'Org', 'Manager', 'Responded', 'Team size', 'Rate %', 'Nudged'], ...rows.map((r) => [r.name, r.org, r.mgr.name, r.n, r.size, r.part, S.nudged[r.name] ? 'yes' : 'no'])]);
  };

  /* ------------------------------------------------------------------ */
  /* DRIVERS — deep-dive                                                 */
  /* ------------------------------------------------------------------ */
  const groupScores = (groups, keyFn, k) => groups.map((g) => { const ps = RS.filter((p) => keyFn(p) === g); return { label: g, n: ps.length, value: ps.length >= thr() ? dscore(ps, k) : null }; });
  const driverKda = () => { const vis = visTeams(); return DRIVERS.map((d) => ({ d, r: pearson(vis.map((s) => ({ x: s.scores[d.id], y: s.enps }))) })).sort((a, b) => b.r.r - a.r.r); };
  const rWord = (r) => (Math.abs(r) >= 0.7 ? 'strong' : Math.abs(r) >= 0.4 ? 'moderate' : Math.abs(r) >= 0.2 ? 'weak' : 'no meaningful');
  const drivers = (c) => {
    const k = DM[c.query.d] ? c.query.d : 'workload', d = DM[k], isMgr = c.persona.id === 'manager';
    const score = dscore(RS, k), fv = fav(RS, k), kda = driverKda(), mine = kda.find((x) => x.d.id === k), rank = kda.indexOf(mine) + 1;
    const qs = QUESTIONS.filter((q) => q.driver === k), tpls = TEMPLATES.filter((t) => t.driver === k);
    const low = visTeams().filter((s) => s.scores[k] < 3.6).sort((a, b) => a.scores[k] - b.scores[k]).slice(0, 6);
    const my = teamStats(MY_TEAM), orgPs = RS.filter((p) => p.org === MY_ORG);
    return html`
      ${NS.pageHead({ eyebrow: 'Driver deep-dive', title: `${ic(d.icon, { size: 22 })} ${d.name}`, sub: `${NS.esc(d.desc)} · ${qs.length} question${qs.length === 1 ? '' : 's'} in the bank`, actions: `<button class="ns-btn secondary" id="drvCsv">${ic('download')}Export</button>` })}
      <div class="ns-chips mb-4">${DRIVERS.map((x) => `<a class="ns-chip" href="${NS.link('/drivers', { d: x.id })}" aria-pressed="${x.id === k}">${ic(x.icon)}${x.name}</a>`).join('')}</div>
      <div class="ns-stats">
        ${NS.stat({ label: 'Company score', value: f1(score), unit: '/5', delta: NS.delta(SCORE_DELTA[k], { d: 2, suf: '', fmt: (v) => v.toFixed(2) }), sub: 'Change vs August pulse' })}
        ${NS.stat({ label: 'Favourable', value: fv, unit: '%', icon: 'thumbs-up', sub: `Agree or strongly agree · ${F.int(RS.length)} respondents` })}
        ${NS.stat({ label: 'vs tech median', value: signed(score - d.bench, 1), icon: 'scale', sub: `Median ${d.bench.toFixed(1)} · ${score - d.bench >= 0.3 ? 'clearly ahead' : score >= d.bench ? 'slightly ahead' : 'behind'}` })}
        ${NS.stat({ label: 'Impact on eNPS', value: 'r = ' + mine.r.r.toFixed(2), icon: 'zap', sub: `#${rank} of 7 drivers · ${rWord(mine.r.r)} link at team level` })}
      </div>
      ${isMgr ? `<div class="mt-4">${NS.card({ title: `${NS.esc(MY_TEAM)} on ${d.name.toLowerCase()}`, sub: my.visible ? `${my.n} responses` : 'Below threshold', body: my.visible ? `<div class="mini-stats"><div><span>Your team</span><b>${f1(my.scores[k])}</b><span>${my.fav[k]}% favourable</span></div><div><span>${NS.esc(MY_ORG)} org</span><b>${f1(dscore(orgPs, k))}</b><span>${fav(orgPs, k)}% favourable</span></div><div><span>Company</span><b>${f1(score)}</b><span>${fv}% favourable</span></div></div><div class="mt-3">${questionRows(qs, RS.filter((p) => p.team === MY_TEAM && p.id !== MGR))}</div>` : masked(my.n) })}</div>` : ''}
      <div class="ns-grid c2 mt-4">
        <div class="grid gap-4" style="align-content:start">${NS.card({ title: 'Score distribution', sub: 'Respondents by rounded driver score', body: '<div id="dDist"></div>' })}${NS.card({ title: 'Questions in this driver', sub: 'Company mean score (1–5)', body: questionRows(qs, RS) })}</div>
        ${NS.card({ title: 'By organisation', sub: 'Engineering orgs and other departments', body: '<div id="dOrg"></div>' })}
      </div>
      <div class="ns-grid c2 mt-4">
        <div class="grid gap-4" style="align-content:start">${NS.card({ title: 'By tenure', body: '<div id="dTen"></div>' })}${NS.card({ title: 'By level', body: '<div id="dLvl"></div>' })}</div>
        ${NS.card({ title: 'By location', body: '<div id="dLoc"></div>' })}
      </div>
      <div class="ns-grid main-side mt-4">
        ${NS.card({ title: `Driver impact on eNPS`, sub: `Each dot is a team at ${thr()}+ responses · ${d.name.toLowerCase()} score vs team eNPS`, body: `<div id="dScatter"></div><div class="ns-alert info mt-3">${ic('info')}<div><b>r = ${mine.r.r.toFixed(2)} · ${rWord(mine.r.r)} relationship</b><p>${Math.abs(mine.r.r) >= 0.2 ? `Teams scoring 0.5 higher on ${d.name.toLowerCase()} have eNPS about ${enpsFmt(mine.r.slope * 0.5)} points higher on average.` : `Team eNPS barely moves with ${d.name.toLowerCase()} — it is a hygiene factor here: fix it where it is low, but it will not lift advocacy on its own.`} Correlation, not causation — use it to prioritise, then test with a plan.</p></div></div>` })}
        <div class="grid gap-4" style="align-content:start">${NS.card({ title: 'Key driver ranking', sub: 'Correlation of each driver with team eNPS · click to switch', body: '<div id="dKda"></div>' })}${NS.card({ title: 'Lowest teams', sub: `Below 3.6 on ${d.name.toLowerCase()} · teams at ${thr()}+ responses`, body: isMgr ? '<div class="sm muted">Other teams’ results are visible to HR and leadership only. Your own team is shown above.</div>' : low.length ? low.map((s) => { const pl = S.plans.find((p) => p.team === s.name && p.status !== 'done'); return `<div class="mover pointer" data-team="${NS.esc(s.name)}"><div class="min-w-0"><div class="t truncate">${NS.esc(s.name)}</div><div class="s">${NS.esc(s.team.org)} · ${pl ? `${NS.esc(pl.title)} (${DM[pl.driver].name.toLowerCase()})` : 'no active plan'}</div></div><b class="tnum">${f1(s.scores[k])}</b></div>`; }).join('') : NS.empty({ icon: 'check-circle', title: 'No team below 3.6', body: `Every reporting team scores 3.6 or more on ${d.name.toLowerCase()}.` }) })}</div>
      </div>
      <div class="ns-section-title"><div><h2>What works for ${d.name.toLowerCase()}</h2><p>Playbooks from earlier pulses, with the lift they produced</p></div></div>
      <div class="ns-grid c3">${tpls.map((t) => `<div class="tpl"><b>${ic('wand', { size: 14 })} ${NS.esc(t.title)}</b><p>${NS.esc(t.body)}</p><ul>${t.steps.map((x) => `<li>${NS.esc(x)}</li>`).join('')}</ul><div class="xs brand-text semibold">${ic('trending-up', { size: 12 })} ${NS.esc(t.evidence)}</div>${c.persona.id !== 'cpo' ? `<button class="ns-btn xs secondary" data-usetpl="${t.id}">${ic('plus')}Use in a plan</button>` : ''}</div>`).join('')}</div>`;
  };
  const useTemplate = (tplId, persona) => { const t = TEMPLATES.find((x) => x.id === tplId); const isMgr = persona.id === 'manager'; planModal(null, { driver: t.driver, team: isMgr ? MY_TEAM : '', lockTeam: isMgr }); setTimeout(() => { const b = document.querySelector(`.ns-modal [data-tpl="${t.id}"]`); if (b) b.click(); }, 40); };
  const mountDrivers = (c, root) => {
    const k = DM[c.query.d] ? c.query.d : 'workload', d = DM[k], isMgr = c.persona.id === 'manager';
    const dist = [1, 2, 3, 4, 5].map((v) => RS.filter((p) => Math.round(p.drivers[k]) === v).length);
    NS.chart.bars(root.querySelector('#dDist'), { labels: ['1 · Strongly disagree', '2', '3 · Neutral', '4', '5 · Strongly agree'], series: [{ name: 'Respondents', values: dist }], colorByIndex: true, colors: ['var(--viz-critical)', 'var(--viz-serious)', 'var(--ink-4)', 'var(--viz-good)', 'var(--viz-good)'], height: 220, showValues: true, yFormat: (v) => F.int(v) });
    NS.chart.hbars(root.querySelector('#dOrg'), { items: UNITS.map((u) => ({ label: u.label, value: dscore(u.people(), k), color: d.color, tip: `<div class="faint xs">${u.sub} · ${u.people().length} respondents</div>` })).sort((a, b) => b.value - a.value), min: 0, max: 5, format: (v) => s1(v), valueLabel: `${d.name} score`, gap: 6, thickness: 8 });
    const hb = (el, items) => NS.chart.hbars(el, { items: items.map((x) => ({ label: x.label, value: x.value == null ? 0 : x.value, sub: x.value == null ? `n/a · fewer than ${thr()}` : `${F.int(x.n)} people`, color: d.color })), max: 5, format: (v) => (v ? s1(v) : 'n/a'), valueLabel: `${d.name} score`, thickness: 8, labelWidth: 'minmax(110px,46%)' });
    hb(root.querySelector('#dTen'), groupScores(TENURE_BANDS, tenureBand, k));
    hb(root.querySelector('#dLvl'), groupScores(LEVEL_BANDS, levelBand, k));
    hb(root.querySelector('#dLoc'), groupScores(D.locations.map((l) => l.city), (p) => p.city, k).sort((a, b) => (b.value || 0) - (a.value || 0)));
    const vis = visTeams();
    NS.chart.scatter(root.querySelector('#dScatter'), { points: vis.map((s) => ({ x: s.scores[k], y: s.enps, label: isMgr && s.name !== MY_TEAM ? `A team in ${FAMILY(s.team.dept)}` : s.name, sub: isMgr && s.name !== MY_TEAM ? 'Team names are visible to HR only' : `${s.team.org} · ${s.n} responses`, group: FAMILY(s.team.dept), r: isMgr && s.name === MY_TEAM ? 8 : 5, team: s.name })), groups: FAMILIES, xLabel: `${d.name} score`, yLabel: 'Team eNPS', xFormat: (v) => Number(v).toFixed(1), yFormat: (v) => enpsFmt(v), yMin: -60, yMax: 100, height: 300, onPoint: isMgr ? null : (p) => openTeam(p.team, c.persona) });
    NS.chart.hbars(root.querySelector('#dKda'), { items: driverKda().map((x) => ({ label: x.d.name, value: x.r.r, sub: Math.abs(x.r.r) >= 0.7 ? 'Strong' : Math.abs(x.r.r) >= 0.4 ? 'Moderate' : Math.abs(x.r.r) >= 0.2 ? 'Weak' : 'No clear link', color: x.d.id === k ? d.color : 'var(--ink-4)', id: x.d.id })), max: 1, format: (v) => v.toFixed(2), valueLabel: 'Correlation with eNPS', onItem: (it) => NS.go('/drivers', { d: it.id }) });
    root.querySelectorAll('[data-team]').forEach((el) => el.onclick = () => openTeam(el.dataset.team, c.persona));
    root.querySelectorAll('[data-usetpl]').forEach((b) => b.onclick = () => useTemplate(b.dataset.usetpl, c.persona));
    root.querySelector('#drvCsv').onclick = () => downloadCsv(`pulse-driver-${k}-sep.csv`, [['Cut', 'Group', 'Respondents', `${d.name} score`], ...UNITS.map((u) => ['Organisation', u.label, u.people().length, dscore(u.people(), k)]), ...groupScores(TENURE_BANDS, tenureBand, k).map((x) => ['Tenure', x.label, x.n, x.value ?? 'n/a']), ...groupScores(LEVEL_BANDS, levelBand, k).map((x) => ['Level', x.label, x.n, x.value ?? 'n/a']), ...groupScores(D.locations.map((l) => l.city), (p) => p.city, k).map((x) => ['Location', x.label, x.n, x.value ?? 'n/a'])]);
  };

  /* ------------------------------------------------------------------ */
  /* TEAMS — explorer with anonymity masking                             */
  /* ------------------------------------------------------------------ */
  const teams = (c) => {
    const u = UNITS.find((x) => x.id === c.query.u);
    const inScope = u ? TEAMS.filter((t) => (u.org ? t.org === u.org : t.dept === u.dept)) : TEAMS;
    const stats = inScope.map((t) => teamStats(t.name)), vis = stats.filter((s) => s.visible), hidden = stats.length - vis.length;
    const withPlan = inScope.filter((t) => S.plans.some((p) => p.team === t.name && p.status !== 'done')).length;
    const opt = (x) => `<option value="${NS.esc(x.id)}" ${u && u.id === x.id ? 'selected' : ''}>${NS.esc(x.label)}</option>`;
    return html`
      ${NS.pageHead({ eyebrow: 'Team explorer', title: u ? NS.esc(u.label) : 'All organisations', sub: u ? `${inScope.length} teams · ${u.sub} · teams under ${thr()} responses are masked` : `${UNITS.length} organisations and departments · pick one to see its teams`, actions: `<select class="ns-select" id="fUnit" style="width:auto;max-width:240px"><option value="">All organisations</option><optgroup label="Engineering orgs">${UNITS.filter((x) => x.org).map(opt).join('')}</optgroup><optgroup label="Departments">${UNITS.filter((x) => !x.org).map(opt).join('')}</optgroup></select>` })}
      <div class="ns-stats">
        ${NS.stat({ label: 'Teams reporting', value: vis.length, unit: `of ${stats.length}`, icon: 'users', sub: `${hidden} below the ${thr()}-response threshold` })}
        ${NS.stat({ label: 'Median team eNPS', value: vis.length ? enpsFmt(U.median(vis.map((s) => s.enps))) : 'n/a', icon: 'heart', sub: `Company ${enpsFmt(COMPANY.enps)}` })}
        ${NS.stat({ label: 'Median participation', value: stats.length ? Math.round(U.median(inScope.map((t) => pct(liveResp(t.name), teamPeople(t.name).length)))) : 0, unit: '%', icon: 'activity', sub: 'Counts are visible for every team' })}
        ${NS.stat({ label: 'Active action plans', value: withPlan, unit: `of ${inScope.length}`, icon: 'clipboard-check', sub: 'Teams with a live or draft plan' })}

    '/drivers': { title: 'Drivers', personas: ['hrbp', 'manager', 'cpo'], render: drivers, mounted: mountDrivers },
    '/teams': { title: 'Teams', personas: ANALYSTS, render: teams, mounted: mountTeams },
    '/comments': { title: (c) => (c.persona.id === 'manager' ? 'Team themes' : 'Comments'), personas: ['hrbp', 'manager', 'cpo'], render: comments, mounted: mountComments },
    '/actions': { title: 'Action plans', render: actions, mounted: mountActions },
    '/lifecycle': { title: 'Lifecycle', personas: ANALYSTS, render: lifecycle, mounted: mountLifecycle },
    '/settings': { title: 'Settings', personas: ['hrbp'], render: settings, mounted: mountSettings },
  };
  const personas = [
    { ...D.personas.hrbp, note: 'All analytics, comments, plans & settings' },
    { ...D.personas.manager, note: 'Team results, participation & plan' },
    { ...D.personas.employee, note: 'Takes the September pulse' },
    { ...D.personas.cpo, note: 'Company view & board framing' },
  ];
  const overdueN = () => S.plans.flatMap((p) => p.actions).filter((a) => a.status !== 'done' && new Date(a.due) < TODAY).length;
  const navFor = (persona) => persona.id === 'employee'
      ? [{ group: 'My pulse', items: [{ id: 'home', label: 'Home', icon: 'home' }, { id: 'survey', label: 'My pulse', icon: 'heart-pulse', badge: S.survey.submitted ? '' : 'Open' }, { id: 'actions', label: 'Team action plan', icon: 'clipboard-check' }] }]
      : persona.id === 'manager'
        ? [{ group: 'My team', items: [{ id: 'home', label: 'Team results', icon: 'home' }, { id: 'survey', label: 'Participation', icon: 'activity', badge: `${liveResp(MY_TEAM)}/${teamPeople(MY_TEAM).length}` }, { id: 'comments', label: 'Team themes', icon: 'message-square' }, { id: 'actions', label: 'Action plan', icon: 'clipboard-check' }] }, { group: 'Explore', items: [{ id: 'drivers', label: 'Drivers', icon: 'radar' }] }]
        : [{ group: 'Listen', items: [{ id: 'home', label: 'Overview', icon: 'home' }, { id: 'survey', label: 'Participation', icon: 'activity', personas: ['hrbp'] }, { id: 'comments', label: 'Comments', icon: 'message-square', badge: sepC().length }] }, { group: 'Understand', items: [{ id: 'drivers', label: 'Drivers', icon: 'radar' }, { id: 'teams', label: 'Teams', icon: 'grid' }, { id: 'lifecycle', label: 'Lifecycle', icon: 'route' }] }, { group: 'Act', items: [{ id: 'actions', label: 'Action plans', icon: 'clipboard-check', badge: overdueN() || '' }] }, { group: 'Administration', items: [{ id: 'settings', label: 'Settings', icon: 'settings', personas: ['hrbp'] }] }];
  const promoFor = (persona) => persona.id === 'employee'
      ? (S.survey.submitted ? { title: 'Pulse submitted', body: 'Thank you. Next pulse opens Oct 1.', cta: { label: 'See how you compare', route: '/survey' } } : { title: 'September pulse is open', body: `${activeQuestions().length + 2} questions · about 3 minutes · closes ${closeLbl()}`, progress: Math.round((answeredCount() / (activeQuestions().length + 2)) * 100), cta: { label: answeredCount() ? 'Continue' : 'Start now', route: '/survey' } })
      : persona.id === 'manager'
        ? { title: `${MY_TEAM} · ${liveResp(MY_TEAM)} of ${teamPeople(MY_TEAM).length}`, body: `Team participation ${pct(liveResp(MY_TEAM), teamPeople(MY_TEAM).length)}% · closes ${closeLbl()}`, progress: pct(liveResp(MY_TEAM), teamPeople(MY_TEAM).length), cta: { label: 'Participation', route: '/survey' } }
        : { title: `September pulse · ${COMPANY.part}% participation`, body: `${F.int(COMPANY.n)} responses · closes ${closeLbl()}`, progress: COMPANY.part, cta: persona.id === 'hrbp' ? { label: 'Track participation', route: '/survey' } : { label: 'Overview', route: '/home' } };
  const refreshChrome = (persona) => {
    try {
      navFor(persona).forEach((g) => g.items.forEach((it) => { const a = document.querySelector(`.ns-nav-item[data-nav="${it.id}"]`); if (!a) return; let b = a.querySelector('.ns-nav-badge'); const v = it.badge != null && it.badge !== '' ? String(it.badge) : ''; if (!v && b) b.remove(); else if (v) { if (!b) { b = document.createElement('span'); b.className = 'ns-nav-badge'; a.appendChild(b); } if (b.textContent !== v) b.textContent = v; } }));
      const pr = document.querySelector('.ns-sidebar-promo'), pm = promoFor(persona);
      if (pr && pm) { const next = `<b>${NS.esc(pm.title)}</b><p>${NS.esc(pm.body || '')}</p>${pm.progress != null ? NS.progress(pm.progress) : ''}${pm.cta ? `<a class="ns-btn sm" href="${NS.link(pm.cta.route)}">${NS.esc(pm.cta.label)} →</a>` : ''}`; if (pr.dataset.sig !== next) { pr.innerHTML = next; pr.dataset.sig = next; } }
    } catch (e) { /* sidebar refresh is cosmetic */ }
  };
  NS.app({
    id: 'pulse', name: 'Pulse', sub: 'Northstar Labs', brand: 'pink', version: '2.0',
    mark: ic('heart-pulse', { size: 20 }),
    about: { tagline: 'Listen continuously. Act visibly.', description: 'Pulse is an always-on listening platform: a three-minute monthly pulse and a semi-annual engagement survey, seven engagement drivers benchmarked against the tech industry, anonymised comment themes, and team action plans that close the loop. Over three years it took Northstar’s eNPS from +31 to +67 by making every result somebody’s next action.', highlights: [{ icon: 'heart-pulse', title: 'Three-minute monthly pulse', body: 'Twelve driver questions, eNPS and one open comment — card by card, autosaved.' }, { icon: 'shield-check', title: 'Anonymity by design', body: 'Results only at 5+ responses; comments attributed to teams, never people.' }, { icon: 'radar', title: 'Driver analytics', body: 'Benchmarks, heatmaps and each driver’s measured impact on eNPS.' }, { icon: 'list-checks', title: 'Action plans that stick', body: 'Team plans, company initiatives and a what-works library with evidence.' }] },
    personas, defaultPersona: 'hrbp',
    nav: navFor,
    promo: promoFor,
    onRoute: (c) => refreshChrome(c.persona),
    notifications: [
      { icon: 'clock', title: 'September pulse closes in 3 days', body: `${COMPANY.part}% participation so far · automatic nudges go out tomorrow.`, time: 'Today', route: '/survey' },
      { icon: 'trending-down', title: 'Billing Platform dropped 9 pts on workload', body: 'Two departures, no backfill yet. An on-call rebalance plan is open.', time: 'Yesterday', route: '/actions' },
      { icon: 'clipboard-check', title: 'New action plan: Search team', body: 'Interrupt triage rota · 3 actions · target +0.4 on workload.', time: '3 days ago', route: '/actions' },
      { icon: 'award', title: 'Security Operations +8 on manager', body: 'Six months after the 1:1 reset — the biggest gain this pulse.', time: '4 days ago', route: '/home' },
    ],
    routes: R, default: '/home',
    commands: (persona) => persona.id === 'employee'
      ? [{ label: S.survey.submitted ? 'See how you compare' : 'Take the September pulse', icon: 'heart-pulse', group: 'Actions', run: () => NS.go('/survey') }, { label: 'Comment on the team action plan', icon: 'message-square', group: 'Actions', run: () => NS.go('/actions') }]
      : persona.id === 'manager'
        ? [{ label: 'Remind my team to respond', icon: 'megaphone', group: 'Actions', run: () => remindTeam(persona) }, { label: 'New action plan for my team', icon: 'plus', group: 'Actions', run: () => planModal(null, { team: MY_TEAM, driver: teamStats(MY_TEAM).lowest || 'pay', lockTeam: true }) }, { label: 'Team comment themes', icon: 'message-square', group: 'Go to', run: () => NS.go('/comments') }]
        : [...(persona.id === 'hrbp' ? [{ label: 'New action plan', icon: 'plus', group: 'Actions', run: () => planModal(null) }, { label: 'Nudge low-participation managers', icon: 'megaphone', group: 'Actions', run: () => NS.go('/survey') }, { label: 'Change the anonymity threshold', icon: 'shield-check', group: 'Actions', run: () => NS.go('/settings') }] : [{ label: 'Copy board summary', icon: 'copy', group: 'Actions', run: () => copyText(boardText(), 'Board summary') }]), { label: 'Export September comments (CSV)', icon: 'download', group: 'Actions', run: () => downloadCsv('pulse-comments-sep.csv', [['Date', 'Theme', 'Sentiment', 'Team / org', 'Comment'], ...sepC().map((x) => [x.date, themeOf(x.theme).name, x.sent, scopeOf(x), x.text])]) }, { label: 'Negative workload comments', icon: 'filter', group: 'Go to', run: () => { Object.assign(CF, { theme: 'workload', sent: 'neg', org: '', period: '', q: '', flagged: false, limit: 20 }); NS.go('/comments'); } }],
    search: (q) => {
      if (q.length < 2) return [];
      const ql = q.toLowerCase(), per = NS.persona || personas[0], out = [];
      if (per.id !== 'employee') DRIVERS.filter((d) => d.name.toLowerCase().includes(ql) || d.desc.toLowerCase().includes(ql)).forEach((d) => out.push({ group: 'Drivers', label: d.name, hint: d.desc, run: () => NS.go('/drivers', { d: d.id }) }));
      if (ANALYSTS.includes(per.id)) {
        TEAMS.filter((t) => t.name.toLowerCase().includes(ql) || t.mgr.name.toLowerCase().includes(ql)).slice(0, 6).forEach((t) => out.push({ group: 'Teams', label: t.name, hint: `${t.org} · ${t.mgr.name}`, avatar: NS.avatar(t.mgr, { size: 'xs' }), run: () => openTeam(t.name, per) }));
        const cm = COMMENTS.filter((x) => x.text.toLowerCase().includes(ql)).length;
        if (cm) out.push({ group: 'Comments', label: `Search comments for “${q}”`, hint: F.plural(cm, 'match', 'matches'), run: () => { Object.assign(CF, { q, theme: '', sent: '', org: '', period: '', flagged: false, limit: 20 }); if (NS.route && NS.route.path === '/comments') NS.refresh(); else NS.go('/comments'); } });
      }
      QUESTIONS.filter((x) => x.text.toLowerCase().includes(ql)).slice(0, 3).forEach((x) => out.push({ group: 'Questions', label: x.text, hint: DM[x.driver].name, run: () => NS.go(per.id === 'employee' ? '/survey' : '/drivers', per.id === 'employee' ? {} : { d: x.driver }) }));
      return out;
    },
    onReset: () => { try { C.store.del('state'); } catch (e) { /* ignore */ } },
  });
})();
</script>
</body>
</html>

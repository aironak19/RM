          ${raw(NS.card({ title: 'Offer acceptance trend', sub: 'Trailing three months · target 85%', body: '<div id="aAcc"></div>' }))}
          ${raw(NS.card({ title: 'Source effectiveness', sub: 'Applied → hired conversion by source · FY26 YTD', body: `<div id="aSrc"></div><table class="ns-table dense mt-4"><thead><tr><th>Source</th><th class="num">Applied</th><th class="num">Hired</th><th class="num">Conversion</th><th class="num">Share of hires</th></tr></thead><tbody>${Object.entries(YTD.bySource).map(([s, [a, h]]) => `<tr><td>${NS.esc(s)}</td><td class="num">${F.int(a)}</td><td class="num">${h}</td><td class="num"><b>${F.pct((h / a) * 100, 1)}</b></td><td class="num">${F.pct((h / fn[7]) * 100, 0)}</td></tr>`).join('')}</tbody></table>` }))}
          ${raw(NS.card({ title: 'Interviewer load · September', sub: `Interviews run or booked this month · ${over ? `${over} over the 8-per-month cap` : 'everyone under the 8-per-month cap'}`, body: '<div id="aLoad"></div>' }))}
          ${raw(NS.card({ title: 'Pass-through parity by gender', sub: 'Share of each stage’s candidates · open and paused reqs, aggregate only', body: `<div id="aPar"></div><div class="ns-alert ${Math.abs(gap) <= 5 ? 'ok' : 'warn'} mt-3">${ic(Math.abs(gap) <= 5 ? 'check-circle' : 'alert-triangle')}<div><b>Pass-through parity ${Math.abs(gap) <= 5 ? 'holds' : 'needs a look'}</b><p>Women are ${w0}% of applicants and ${w5}% of candidates reaching Hiring manager (${gap >= 0 ? '+' : ''}${gap} pts). We flag any stage that drifts more than 5 points from the applicant share — small groups are noisy, so read alongside the counts.</p></div></div>` }))}
          ${raw(NS.card({ title: 'Candidate experience', sub: 'Post-interview NPS by month · what candidates said', body: `<div id="aNps"></div><div class="grid gap-2 mt-3">${['“Every interviewer knew what they were assessing — first loop where I got the same questions as the rubric said.”', '“Fast: screen to offer in 19 days, with a decision within 48 hours of each round.”', '“System design ran over and the last interviewer had to rush. Would have liked more time for questions.”'].map((q) => `<div class="ns-quote" style="font-size:12.5px">${NS.esc(q)}</div>`).join('')}</div>` }))}
        </div>`;
    },
    mounted: (c, root) => {
      const fn = YTD.funnel, act = S.cands.filter((x) => x.status === 'active' && jobById(x.jobId).status === 'Open');
      NS.chart.bars(root.querySelector('#aConv'), { labels: ['App→Scr', 'Scr→Tech', 'Tech→Des', 'Des→Val', 'Val→HM', 'HM→Offer', 'Offer→Hire'], series: [{ name: 'Conversion', values: fn.slice(1).map((v, i) => Math.round((v / fn[i]) * 100)) }], yFormat: (v) => v + '%', yMax: 100, height: 230, showValues: true });
      NS.chart.hbars(root.querySelector('#aDays'), { items: SIDS.slice(0, 7).map((s) => { const l = act.filter((x) => x.stage === s), m = l.length ? U.median(l, (x) => daysIn(x)) : 0, sla = stageDef(s).sla; return { label: stageLabel(s), sub: `${l.length} active · SLA ${sla}d`, value: m, color: m > sla ? 'var(--viz-warn)' : 'var(--brand)' }; }), format: (v) => F.num(v, v % 1 ? 1 : 0) + ' d', valueLabel: 'Median days' });
      NS.chart.bars(root.querySelector('#aTtf'), { labels: YTD.ttf.map((x) => x[0].replace('Infrastructure & SRE', 'Infra & SRE').replace('Developer Experience', 'DevEx').replace('Engineering management', 'Eng mgmt')), series: [{ name: 'FY25', values: YTD.ttf.map((x) => x[1]), color: 'var(--ink-4)' }, { name: 'FY26 YTD', values: YTD.ttf.map((x) => x[2]), color: 'var(--brand)' }], height: 240, yFormat: (v) => v + 'd' });
      NS.chart.line(root.querySelector('#aAcc'), { labels: PLAN.months.slice(0, 9), series: [{ name: 'Offer acceptance', values: YTD.acceptance }], yFormat: (v) => v + '%', yMin: 70, yMax: 95, height: 220, threshold: { value: 85, label: 'Target 85%' }, endLabels: true });
      NS.chart.hbars(root.querySelector('#aSrc'), { items: Object.entries(YTD.bySource).map(([s, [a, h]]) => ({ label: s, sub: `${h} hires from ${F.int(a)}`, value: U.round((h / a) * 100, 2) })).sort((a, b) => b.value - a.value), format: (v) => v.toFixed(2) + '%', valueLabel: 'Applied → hired' });
      NS.chart.hbars(root.querySelector('#aLoad'), { items: loadOf().slice(0, 10).map((x) => ({ label: person(x.id).name, sub: person(x.id).team, value: x.n, color: x.n > 8 ? 'var(--viz-warn)' : 'var(--brand)' })), max: 12, format: (v) => F.int(v), valueLabel: 'Interviews' });
      P.parityChart(root.querySelector('#aPar'), 240);
      NS.chart.line(root.querySelector('#aNps'), { labels: PLAN.months.slice(1, 9), series: [{ name: 'Candidate NPS', values: YTD.nps }], yFormat: (v) => '+' + v, yMin: 30, yMax: 70, height: 180, threshold: { value: 60, label: 'Goal +60' }, endLabels: true });
      root.querySelector('[data-export]').onclick = () => downloadCsv('pipeline-funnel-FY26.csv', [['Stage', 'Reached', 'Conversion from previous'], ...SIDS.map((s, i) => [stageLabel(s), fn[i], i ? ((fn[i] / fn[i - 1]) * 100).toFixed(1) + '%' : ''])]);
    },
  };

  /* ------------------------------------------------------------------ */
  /* 12. Settings                                                        */
  /* ------------------------------------------------------------------ */
  R['/settings'] = {
    title: 'Settings', personas: ['recruiter', 'hrbp'],
    render: (c) => {
      const st = S.settings;
      return html`${raw(NS.pageHead({ eyebrow: 'Administration', title: 'Hiring settings', sub: 'The structure every requisition inherits: stages and SLAs, the scorecard rubric, competencies, sources and the guardrails that keep hiring fair.', actions: `<button class="ns-btn secondary" data-reset>${ic('undo')}Restore defaults</button><button class="ns-btn primary" data-save>${ic('save')}Save changes</button>` }))}
        <div class="ns-grid c2">
          ${raw(NS.card({ title: 'Stages & SLAs', sub: 'Days a candidate may wait in each stage before it shows as a breach', body: `<div class="grid gap-1"><div class="set-row xs muted semibold"><span>Stage name</span><span>SLA (days)</span></div>${st.stages.map((s, i) => `<div class="set-row"><div class="flex items-center gap-2"><span class="plan-num" style="width:24px;height:24px;font-size:11px">${i + 1}</span><input class="ns-input sm" data-stage="${s.id}" value="${NS.esc(s.label)}"></div>${s.id === 'hired' ? '<span class="xs muted">—</span>' : `<input class="ns-input sm" type="number" min="1" max="30" data-sla="${s.id}" value="${s.sla}">`}</div>`).join('')}</div>` }))}
          ${raw(NS.card({ title: 'Scorecard rubric', sub: 'Four points, no neutral middle — interviewers must take a position', body: `<div class="grid gap-3">${st.rubric.map((r) => `<div class="grid gap-2" style="grid-template-columns:96px minmax(0,1fr)"><div>${recBadge(r.v)}<input class="ns-input sm mt-2" data-rl="${r.v}" value="${NS.esc(r.label)}"></div><textarea class="ns-textarea" style="min-height:62px;font-size:12.5px" data-rd="${r.v}">${NS.esc(r.desc)}</textarea></div>`).join('')}</div>` }))}
          ${raw(NS.card({ title: 'Competencies', sub: 'Aligned with the engineering competency framework, plus Values', body: `<div>${st.comps.map((x, i) => `<div class="set-comp"><label class="ns-switch"><input type="checkbox" data-comp="${i}" ${x.on ? 'checked' : ''}><i></i></label><div class="min-w-0"><b class="sm">${NS.esc(x.name)}</b><div class="xs muted">${NS.esc(x.desc)}</div></div></div>`).join('')}</div><div class="flex gap-2 mt-3"><input class="ns-input sm" id="newComp" placeholder="Add a competency, e.g. Customer empathy"><button class="ns-btn sm secondary" data-add-comp>${ic('plus')}Add</button></div>` }))}
          <div class="grid gap-4">
            ${raw(NS.card({ title: 'Structured-hiring guardrails', body: `<div class="grid gap-3">${[['independent', 'Independent scoring', 'Interviewers see others’ feedback only after submitting their own scorecard.'], ['langCheck', 'Language check on scorecards', 'Flags vague or coded words like “culture fit”, “overqualified” or “gut feeling”.'], ['structuredQs', 'Show structured questions', 'Every interviewer sees the stage’s questions in the scorecard.'], ['anonymize', 'Anonymised résumé review', 'Hide names and photos while candidates are in Applied.']].map(([k, t, d]) => `<label class="ns-switch"><input type="checkbox" data-guard="${k}" ${st[k] ? 'checked' : ''}><i></i><span><b class="sm">${t}</b><div class="xs muted">${d}</div></span></label>`).join('')}</div>` }))}
            ${raw(NS.card({ title: 'Sources', sub: 'Options offered when adding a candidate', body: `<div class="grid gap-2">${st.sources.map((s, i) => `<label class="ns-switch"><input type="checkbox" data-src="${i}" ${s.on ? 'checked' : ''}><i></i><span class="sm">${NS.esc(s.name)}</span></label>`).join('')}</div><div class="flex gap-2 mt-3"><input class="ns-input sm" id="newSrc" placeholder="e.g. Open-source community"><button class="ns-btn sm secondary" data-add-src>${ic('plus')}Add</button></div>` }))}
            ${raw(NS.card({ title: 'Recent activity', sub: 'Changes made in this prototype', body: S.log.length ? `<div class="grid gap-2">${S.log.slice(0, 8).map((a) => `<div class="flex justify-between gap-3 sm"><span class="ink2 truncate">${NS.esc(a.msg)}</span><span class="xs faint nowrap">${relDay(a.at)}</span></div>`).join('')}</div>` : '<div class="sm muted">Nothing yet — move a candidate or submit a scorecard.</div>' }))}
          </div>
        </div>`;
    },
    mounted: (c, root) => {
      const st = S.settings;
      root.querySelector('[data-save]').onclick = () => { root.querySelectorAll('[data-stage]').forEach((i) => { const s = st.stages.find((x) => x.id === i.dataset.stage); if (i.value.trim()) s.label = i.value.trim(); }); root.querySelectorAll('[data-sla]').forEach((i) => { st.stages.find((x) => x.id === i.dataset.sla).sla = U.clamp(+i.value || 1, 1, 30); }); root.querySelectorAll('[data-rl]').forEach((i) => { st.rubric[+i.dataset.rl - 1].label = i.value.trim() || RUBRIC[+i.dataset.rl - 1].label; }); root.querySelectorAll('[data-rd]').forEach((i) => { st.rubric[+i.dataset.rd - 1].desc = i.value.trim() || RUBRIC[+i.dataset.rd - 1].desc; }); root.querySelectorAll('[data-comp]').forEach((i) => { st.comps[+i.dataset.comp].on = i.checked; }); root.querySelectorAll('[data-src]').forEach((i) => { st.sources[+i.dataset.src].on = i.checked; }); root.querySelectorAll('[data-guard]').forEach((i) => { st[i.dataset.guard] = i.checked; }); log('Updated hiring settings'); save(); NS.toast('Settings saved', { desc: `${st.comps.filter((x) => x.on).length} competencies · independent scoring ${st.independent ? 'on' : 'off'} · SLAs applied to every req` }); NS.refresh(); };
      root.querySelector('[data-reset]').onclick = async () => { if (await NS.confirm({ title: 'Restore default settings?', body: 'Stages, SLAs, rubric wording, competencies, sources and guardrails return to the Northstar defaults. Candidates and scorecards are untouched.', confirmLabel: 'Restore' })) { Object.assign(st, { stages: STAGES.map((s) => ({ id: s.id, label: s.label, sla: s.sla })), rubric: RUBRIC.map((x) => ({ v: x.v, label: x.label, desc: x.desc })), comps: COMPS.map((x) => ({ ...x, on: true })), sources: SOURCES.map((s) => ({ name: s, on: true })), independent: true, langCheck: true, anonymize: false, structuredQs: true }); log('Restored default hiring settings'); save(); NS.toast('Defaults restored', { type: 'info' }); NS.refresh(); } };
      root.querySelector('[data-add-comp]').onclick = () => { const v = root.querySelector('#newComp').value.trim(); if (v.length < 3) { NS.toast('Name the competency', { type: 'warn' }); return; } st.comps.push({ id: 'c' + (st.comps.length + 1), name: v, desc: 'Custom competency — add it to a stage in the interview plan.', icon: 'star', on: true }); log(`Added competency ${v}`); save(); NS.toast('Competency added', { desc: 'Add it to a stage from any job’s Interview plan tab.' }); NS.refresh(); };
      root.querySelector('[data-add-src]').onclick = () => { const v = root.querySelector('#newSrc').value.trim(); if (v.length < 3) { NS.toast('Name the source', { type: 'warn' }); return; } st.sources.push({ name: v, on: true }); log(`Added source ${v}`); save(); NS.toast('Source added'); NS.refresh(); };
    },
  };

  /* ------------------------------------------------------------------ */
  /* 13. Boot                                                            */
  /* ------------------------------------------------------------------ */
  const store = NS.store('pipeline-ats');
  const personas = [
    { ...D.personas.recruiter, note: 'Runs every req end to end' },
    { ...D.personas.manager, label: 'Hiring manager', note: 'Two open roles on Identity & Access' },
    { ...D.personas.hrbp, note: 'Band checks, analytics, settings' },
    { ...D.personas.exec, note: 'Hiring plan & above-band approvals' },
  ];
  const nPend = (id) => P.pendingFor(id).length || '';
  const nAppr = (p) => S.offers.filter((o) => P.canApprove(o, p)).length || '';
  NS.app({
    id: 'pipeline-ats', name: 'Pipeline', sub: 'Northstar Labs', brand: 'orange', version: '2.0',
    mark: ic('git-branch', { size: 20 }),
    about: { tagline: 'Structured hiring, from req to offer — with the evidence in the room.', description: 'An applicant-tracking system with an opinion: every requisition carries its plan line, a structured interview loop with named competencies and a pay band. Candidates move across a drag-and-drop pipeline; interviewers score independently on a four-point rubric with a language check; offers are validated against the band for level and location and routed to the right approvers; and analytics watch speed, source quality and pass-through parity — in aggregate only.', highlights: [{ icon: 'kanban', title: 'Pipeline board', body: 'Drag candidates between stages; rejections need a reason, offers get a band check.' }, { icon: 'clipboard-check', title: 'Independent scorecards', body: 'Four-point rubric, structured questions, feedback unlocked after you submit.' }, { icon: 'scale', title: 'Offers against bands', body: 'Compa-ratio, above-band flags and a HM → HRBP → VP approval chain.' }, { icon: 'shield-check', title: 'Bias-aware by default', body: 'Language check, anonymised review option and pass-through parity tracking.' }] },
    personas, defaultPersona: 'recruiter',
    nav: (p) => p.id === 'manager' ? [{ group: 'Hiring manager', items: [{ id: 'home', label: 'Home', icon: 'home' }, { id: 'jobs', label: 'My jobs', icon: 'briefcase' }, { id: 'candidates', label: 'My candidates', icon: 'users' }, { id: 'interviews', label: 'My interviews', icon: 'calendar', badge: nPend('NS-1180') }, { id: 'offers', label: 'Offer approvals', icon: 'handshake', badge: nAppr(p) }] }]
      : p.id === 'hrbp' ? [{ group: 'People partner', items: [{ id: 'home', label: 'Home', icon: 'home' }, { id: 'offers', label: 'Offer approvals', icon: 'handshake', badge: nAppr(p) }, { id: 'analytics', label: 'Analytics', icon: 'bar-chart' }] }, { group: 'Administration', items: [{ id: 'settings', label: 'Hiring settings', icon: 'settings' }] }]
        : p.id === 'exec' ? [{ group: 'Engineering', items: [{ id: 'home', label: 'Hiring plan', icon: 'flag' }, { id: 'offers', label: 'Approvals', icon: 'handshake', badge: nAppr(p) }] }]
          : [{ group: 'Hiring', items: [{ id: 'home', label: 'Home', icon: 'home' }, { id: 'jobs', label: 'Jobs', icon: 'briefcase', badge: openJobs().length }, { id: 'candidates', label: 'Candidates', icon: 'users' }, { id: 'interviews', label: 'Interviews', icon: 'calendar', badge: nPend('NS-1920') }, { id: 'offers', label: 'Offers', icon: 'handshake', badge: S.offers.filter((o) => o.status === 'Awaiting approval' || o.status === 'Approved').length || '' }] }, { group: 'Insights', items: [{ id: 'analytics', label: 'Analytics', icon: 'bar-chart' }, { id: 'settings', label: 'Settings', icon: 'settings' }] }],
    promo: (p) => { if (p.id === 'recruiter' || p.id === 'manager') { const n = P.pendingFor(meId(p)).length; return n ? { title: 'Scorecards', body: `${n} scorecard${n > 1 ? 's' : ''} waiting on you — due within 24 hours of each interview.`, cta: { label: 'Fill them in', route: '/interviews?f=pending' } } : { title: 'All caught up', body: 'Every interview you ran has a scorecard.', cta: { label: 'Interviews', route: '/interviews' } }; } const n = S.offers.filter((o) => P.canApprove(o, p)).length; return { title: 'Approvals', body: n ? `${n} offer${n > 1 ? 's' : ''} waiting on your sign-off.` : 'No offers waiting on you.', cta: { label: 'Open queue', route: '/offers' } }; },
    notifications: [{ icon: 'clipboard-list', title: 'Scorecard pending: Nadia Rahman — System design', body: 'Kavya Nair and Aditya Kulkarni interviewed her yesterday at 15:00.', time: 'Today', route: '/interviews?f=pending' }, { icon: 'check-circle', title: 'Offer approved: Principal Engineer, Berlin', body: 'VP Engineering signed off the above-band offer on Storage. Ready to extend.', time: 'Yesterday', route: '/offers?f=Approved' }, { icon: 'alert-triangle', title: '3 roles aging past 45 days', body: 'Senior SRE (London), Senior Security Engineer (New York) and Engineering Manager (Austin).', time: '2 days ago', route: '/jobs?age=45' }, { icon: 'handshake', title: 'Offer extended to a Senior Data Engineer', body: 'Data Pipelines · Pune · expires 30 Sep.', time: '2 days ago', route: '/offers?f=Extended' }],
    routes: R, default: '/home',
    commands: (p) => [...(p.id === 'recruiter' ? [{ label: 'New requisition', icon: 'plus', group: 'Actions', run: () => { NS.go('/jobs'); setTimeout(() => P.jobModal(), 60); } }, { label: 'Export candidates (CSV)', icon: 'download', group: 'Actions', run: () => NS.go('/candidates') }] : []), ...(p.id === 'recruiter' || p.id === 'manager' ? [{ label: 'Scorecards waiting on me', icon: 'clipboard-list', group: 'Actions', run: () => NS.go('/interviews', { f: 'pending' }) }, { label: 'Open Nadia Rahman', icon: 'user', group: 'Actions', run: () => NS.go('/candidates/' + (S.cands.find((x) => x.name === 'Nadia Rahman') || {}).id) }] : []), { label: 'Offers needing approval', icon: 'handshake', group: 'Actions', run: () => NS.go('/offers', { f: p.id === 'recruiter' ? 'Awaiting approval' : 'mine' }) }],
    search: (q) => { if (q.length < 2) return []; const p = NS.persona; if (p.id === 'exec' || p.id === 'hrbp') return S.offers.filter((o) => candById(o.candId).name.toLowerCase().includes(q.toLowerCase())).slice(0, 5).map((o) => ({ group: 'Offers', label: candById(o.candId).name, hint: `${o.id} · ${o.status}`, avatar: NS.avatar(candById(o.candId).name, { size: 'xs' }), run: () => NS.go('/offers', { f: 'all', open: o.id }) })); const s = q.toLowerCase(); const jobs = S.jobs.filter((j) => canSeeJob(p, j) && `${j.role} ${j.team} ${j.id} ${j.city}`.toLowerCase().includes(s)).slice(0, 4).map((j) => ({ group: 'Jobs', label: jobTitle(j), hint: `${j.team} · ${j.city}`, icon: 'briefcase', run: () => NS.go('/jobs/' + j.id) })); const cs = S.cands.filter((x) => canSeeJob(p, jobById(x.jobId)) && `${x.name} ${x.skills.join(' ')} ${x.company}`.toLowerCase().includes(s)).slice(0, 6).map((x) => ({ group: 'Candidates', label: cName(x), hint: `${P.statusLabel(x)} · ${jobById(x.jobId).role}`, avatar: cAvatar(x, 'xs'), run: () => NS.go('/candidates/' + x.id) })); return [...jobs, ...cs]; },
    onReset: () => store.clear(),
  });
})();
</script>
</body>
</html>

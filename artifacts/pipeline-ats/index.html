<!doctype html>
<html lang="en" data-brand="orange">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pipeline · Northstar Labs</title>
<meta name="description" content="Pipeline — structured hiring for Northstar Labs: requisitions, a drag-and-drop candidate pipeline, structured interviews and scorecards, offers checked against pay bands, and hiring analytics. Concept prototype with illustrative data, designed by Ronak Mehta.">
<meta name="theme-color" content="#EA580C">

<script src="../shared/ns.js"></script>
<script src="../shared/ns-data.js"></script>
<style id="pl-identity">
  /* ======================================================================
     Pipeline · "The hiring board" — product identity on Northstar v5.
     Sora for display and numerals, Inter for UI. Warm white canvas, an
     orange accent, and one stage colour sequence used everywhere a stage
     appears: warm at the top of the funnel, cooling as people near a hire.
     ====================================================================== */
  :root{
    --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-display:"Sora","Inter",-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

    --bg:#FCFBF9;--bg-2:#F6F3EE;
    --surface:#FFFFFF;--surface-2:#FAF8F5;--surface-3:#F4F1EC;--surface-4:#E9E4DD;
    --line:#ECE6DE;--line-2:#F2EDE7;--line-strong:#D8CFC4;
    --ink:#1C1917;--ink-2:#3F3A35;--ink-3:#6B635B;--ink-4:#9C9389;--ink-inverse:#FFFFFF;

    /* action colour = Pipeline orange (burnt step for AA on white text) */
    --np:#C2410C;--np-hover:#9A3412;--np-active:#7C2D12;--np-text:#C2410C;--np-soft:#FFF4EB;--np-soft-2:#FFE6D2;--np-line:#FDC9A3;
    --info:#0369A1;--info-bg:#EEF7FC;--info-line:#B9DDF0;
    --discovery:#9A3412;--discovery-bg:#FFF6EE;

    /* the stage sequence */
    --st-applied:#A1978C;--st-screen:#D99A06;--st-tech:#EA580C;--st-design:#DB2777;
    --st-values:#A855C7;--st-hm:#6366F1;--st-offer:#0891B2;--st-hired:#16A34A;--st-out:#A8A29E;

    --viz-1:#EA580C;--viz-2:#0891B2;--viz-3:#6366F1;--viz-4:#D99A06;--viz-5:#DB2777;--viz-7:#A855C7;
    --viz-grid:#F1ECE6;--viz-axis:#DED6CC;

    --shadow-xs:0 1px 1px rgba(68,40,20,.04);
    --shadow-sm:0 1px 2px rgba(68,40,20,.07),0 1px 1px rgba(68,40,20,.03);
    --shadow:0 4px 10px -3px rgba(68,40,20,.10),0 1px 2px rgba(68,40,20,.05);
    --shadow-lg:0 14px 30px -8px rgba(68,40,20,.18),0 3px 8px -2px rgba(68,40,20,.06);
    --shadow-xl:0 30px 64px -14px rgba(68,40,20,.30),0 6px 14px -4px rgba(68,40,20,.08);
    --glass:rgba(252,251,249,.88);

    --r-xs:4px;--r-sm:7px;--r:9px;--r-lg:12px;--r-xl:16px;
    --header-h:56px;--sidebar-w:244px;--content-max:1480px;
  }
  :root[data-theme="dark"]{
    --bg:#121010;--bg-2:#171413;
    --surface:#1A1716;--surface-2:#1E1B19;--surface-3:#26221F;--surface-4:#312C28;
    --line:#2E2926;--line-2:#25211F;--line-strong:#443D37;
    --ink:#F6F1EB;--ink-2:#D3CABF;--ink-3:#A79D92;--ink-4:#7A7067;--ink-inverse:#121010;
    --np:#F97316;--np-hover:#FB8A3C;--np-active:#EA580C;--np-text:#FDA766;--np-soft:rgba(249,115,22,.13);--np-soft-2:rgba(249,115,22,.22);--np-line:rgba(249,115,22,.42);
    --info:#67C6EE;--info-bg:rgba(56,189,248,.12);--info-line:rgba(56,189,248,.34);
    --discovery:#FDA766;--discovery-bg:rgba(249,115,22,.10);
    --st-applied:#A8A29E;--st-screen:#FBBF24;--st-tech:#FB923C;--st-design:#F472B6;
    --st-values:#D08AE8;--st-hm:#8B8FF8;--st-offer:#22D3EE;--st-hired:#4ADE80;--st-out:#6F6862;
    --viz-1:#FB923C;--viz-2:#22D3EE;--viz-3:#8B8FF8;--viz-4:#FBBF24;--viz-5:#F472B6;--viz-7:#D08AE8;
    --viz-grid:#262220;--viz-axis:#3A3430;
    --shadow-xs:0 1px 1px rgba(0,0,0,.35);--shadow-sm:0 1px 2px rgba(0,0,0,.45);
    --shadow:0 4px 12px -2px rgba(0,0,0,.5);
    --shadow-lg:0 16px 34px -8px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.04);
    --glass:rgba(26,23,22,.9);
  }
  :root[data-theme="dark"] .ns-btn.primary{color:#1C0F06}
  ::selection{background:color-mix(in srgb,#EA580C 22%,transparent)}

  /* ---- type ---- */
  h1,h2,.ns-hero h1,.ns-section-title h2{font-family:var(--font-display);letter-spacing:-.025em}
  h1{font-size:27px;line-height:34px;font-weight:600}
  .ns-card-head h3{font-family:var(--font-display);font-size:14.5px;font-weight:600;letter-spacing:-.012em}
  .ns-stat .val,.ns-ring .c b,.ns-hero-num{font-family:var(--font-display);font-weight:600;letter-spacing:-.03em}

  /* ---- global header ---- */
  .ns-gh{background:var(--surface);border-bottom:1px solid var(--line)}
  .ns-gh-product{font-family:var(--font-display);font-weight:600;letter-spacing:-.02em;font-size:15px}
  .ns-gh-product .ns-brand-mark,.ns-brand-mark{background:#EA580C;box-shadow:inset 0 -2px 0 rgba(0,0,0,.14)}
  .ns-search-btn{background:var(--surface-3);border-radius:10px}
  .ns-search-btn:hover{border-color:var(--line-strong)}
  .ns-create{border-radius:999px;padding:0 14px 0 11px}
  .ns-tenant{border-radius:999px}

  /* ---- sidebar: a sand rail, the current view lifts like a card ---- */
  .ns-sidebar{background:var(--bg-2);border-right:1px solid var(--line)}
  :root[data-theme="dark"] .ns-sidebar{background:#151211}
  .ns-brand-name{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:-.02em}
  .ns-persona-chip{border-radius:10px;background:var(--surface)}
  .ns-nav-group{font-size:10.5px;letter-spacing:.09em;color:var(--ink-4);padding:18px 10px 6px}
  .ns-nav-item{height:34px;border-radius:9px;color:var(--ink-2)}
  .ns-nav-item:hover{background:color-mix(in srgb,var(--surface) 70%,transparent)}
  .ns-nav-item[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm),0 0 0 1px var(--line)}
  .ns-nav-item[aria-current="page"] svg{color:#EA580C}
  :root[data-theme="dark"] .ns-nav-item[aria-current="page"] svg{color:var(--np)}
  .ns-nav-item[aria-current="page"]::before{display:none}
  .ns-nav-badge{background:var(--surface-4);color:var(--ink-2)}
  .ns-nav-item[aria-current="page"] .ns-nav-badge{background:var(--np-soft-2);color:var(--np-text)}
  .ns-sidebar-promo{border-radius:12px;background:var(--surface);box-shadow:var(--shadow-xs)}
  .ns-sidebar-promo::before{color:var(--np-text)}

  /* ---- page ---- */
  .ns-topbar{background:color-mix(in srgb,var(--bg) 90%,transparent)}
  .ns-content{padding:6px 32px 72px}
  .ns-page-head{border-bottom:0;padding:10px 0 4px;margin-bottom:22px;align-items:flex-end}
  .ns-eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--np-text)}
  .ns-page-head p{color:var(--ink-3);font-size:14px;margin-top:8px}
  .ns-page-head + .ns-tabs{margin-top:-6px}
  .ns-section-title h2{font-size:17px}

  /* ---- surfaces ---- */
  .ns-card{border-radius:var(--r-lg);border-color:var(--line)}
  .ns-card-foot{border-radius:0 0 var(--r-lg) var(--r-lg)}
  .ns-stat{border-radius:var(--r-lg);padding:15px 18px 14px}
  .ns-stat .lbl{font-size:12.5px}
  .ns-stat .val{font-size:27px}
  .ns-stat .ic{border-radius:9px;background:var(--np-soft);color:var(--np-text)}
  .ns-stat .ic svg{color:var(--np-text)}
  .ns-ai{border-color:var(--np-line);background:linear-gradient(180deg,var(--np-soft),var(--surface) 72%)}
  .ns-ai-head{color:var(--np-text)}
  .ns-ai .typing i{background:var(--np)}

  /* ---- controls ---- */
  .ns-btn{border-radius:8px;font-weight:600}
  .ns-btn.primary{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(124,45,18,.25)}
  .ns-btn.secondary{border-color:var(--line-strong)}
  .ns-btn.xs{border-radius:6px}
  .ns-badge{border-radius:999px;padding:0 8px}
  .ns-badge.sq{border-radius:5px}
  .ns-tag{border-radius:6px}
  .ns-tab{font-weight:550}
  .ns-tab[aria-selected="true"]{color:var(--ink);border-color:#EA580C}
  :root[data-theme="dark"] .ns-tab[aria-selected="true"]{border-color:var(--np)}
  .ns-tab[aria-selected="true"] svg{color:var(--np-text)}
  .ns-table th{background:var(--surface-2);font-size:11.5px;letter-spacing:.02em;color:var(--ink-3)}
  .ns-table tbody tr:hover td{background:color-mix(in srgb,var(--np-soft) 55%,var(--surface))}
  .ns-progress > i{background:#EA580C}
  :root[data-theme="dark"] .ns-progress > i{background:var(--np)}
  .ns-avatar{font-family:var(--font-display);font-weight:600}
  .ns-step.done .pt,.ns-tl-item.done .pt{background:var(--ink);border-color:var(--ink);color:var(--surface)}
  .ns-step.done::before,.ns-step.done::after,.ns-step.now::before{background:var(--ink-3)}

  /* ---- stage language: a dot + name, coloured by stage ---- */
  .stg{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px 0 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;color:var(--ink);background:color-mix(in srgb,var(--sc) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--sc) 30%,transparent);line-height:1}
  .stg::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc);flex:none}
  .stg.lg{height:26px;font-size:12.5px;padding:0 11px 0 10px}
  .stg.out{--sc:var(--st-out);color:var(--ink-3)}
  .stg.out::before{background:transparent;border:1.5px solid var(--ink-4);width:6px;height:6px}
</style>
<style>
  /* Pipeline — app components on Northstar v5 tokens. No hardcoded colours, radii ≤ 14px. */
  /* Page scaffolding */
  .pl-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
  .pl-kpis .ns-stat .sub{line-height:1.35}
  .pl-kpis .ns-delta{white-space:nowrap;flex:none}
  @media (max-width:1600px){.pl-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (max-width:720px){.pl-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .pl-sec{margin-top:16px}
  .ns-page-head .ns-eyebrow .sep{color:var(--ink-4);font-weight:400}
  .pl-head-meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin-top:8px}
  .pl-head-meta span{display:inline-flex;align-items:center;gap:5px}
  .pl-head-meta svg{width:13px;height:13px;color:var(--ink-4)}
  /* Needs-attention task list */
  .pl-task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-2)}
  .pl-task:last-child{border-bottom:0}
  .pl-task .ttl{font-size:13.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pl-task .sub{font-size:12.5px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl-task .cnt{font-variant-numeric:tabular-nums;font-weight:650;font-size:15px;color:var(--ink);min-width:22px;text-align:right}
  .pl-task .act{display:flex;align-items:center;gap:10px}
  /* Table card: toolbar + table + footer in one surface */
  .pl-tcard{overflow:hidden}
  .pl-tbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px}
  .pl-tbar .ns-input-wrap{flex:1 1 200px;max-width:240px;min-width:180px}
  .pl-tbar .ns-input{height:30px}
  .pl-tbar .grow{flex:1}
  .pl-filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .pl-filters .ns-select{height:30px;width:auto;max-width:170px;font-size:13px;padding-left:9px}
  .pl-filters .ns-select.set{border-color:var(--np-line);background-color:var(--np-soft);color:var(--np-text);font-weight:550}
  .pl-active{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 16px 12px;font-size:12.5px;color:var(--ink-3)}
  .pl-active:empty{display:none}
  .pl-fchip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 6px 0 9px;border-radius:var(--r-sm);background:var(--np-soft);color:var(--np-text);font-size:12px;font-weight:550;border:1px solid var(--np-line)}
  .pl-fchip svg{width:12px;height:12px}
  .pl-fchip:hover{background:var(--np-soft-2)}
  .pl-clear{font-size:12px;font-weight:550;color:var(--np-text);padding:0 4px}
  .pl-clear:hover{text-decoration:underline}
  .pl-tcard .ns-table-wrap{border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none;max-height:min(74vh,820px)}
  .pl-tcard .ns-table-foot{position:sticky;bottom:0}
  .pl-tcard .ns-table td,.pl-tcard .ns-table th{padding-left:10px;padding-right:10px}
  .pl-tcard .ns-table td:first-child,.pl-tcard .ns-table th:first-child{padding-left:16px}
  .pl-tcard .ns-table td:last-child,.pl-tcard .ns-table th:last-child{padding-right:12px}
  .pl-rng{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;border:1px solid var(--line-strong);border-radius:var(--r-sm);font-size:13px;color:var(--ink-2);white-space:nowrap;background:var(--surface)}
  .pl-rng input{width:72px}
  .pl-rng b{min-width:32px;font-variant-numeric:tabular-nums;color:var(--ink)}
  .row-more{width:28px;height:28px;border-radius:var(--r-sm);display:inline-grid;place-items:center;color:var(--ink-3)}
  .row-more:hover{background:var(--surface-3);color:var(--ink)}
  .row-more svg{width:16px;height:16px}
  .tbl-sub{font-size:12px;color:var(--ink-3)}
  .cell-2{display:grid;gap:1px;min-width:0}
  .cell-2 .a{font-size:13.5px;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell-2 .b{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ns-table td .ns-person .nm{font-weight:600}
  .ns-card-body.pl-flush{padding:12px 0 0}
  .pl-flush .ns-table-wrap{border-top:1px solid var(--line);border-radius:0 0 var(--r-lg) var(--r-lg)}
  /* Kanban */
  .kb{grid-auto-columns:minmax(248px,1fr);align-items:stretch}
  .kb .ns-kanban-col{min-height:260px;align-content:start;background:var(--surface-2)}
  .kb .ns-kanban-head{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:600;color:var(--ink-2);padding:4px 4px 6px}
  .kb-col.rej{background:var(--surface-3)}
  .kb-col.rej .ns-kcard{opacity:.8;cursor:default}
  .kb-col .ns-kanban-head .sla{font-size:11.5px;font-weight:500;color:var(--ink-4)}
  .kb-empty{font-size:12px;color:var(--ink-4);text-align:center;padding:18px 8px;border:1px dashed var(--line-strong);border-radius:var(--r)}
  .ns-kcard{gap:7px;padding:10px 12px}
  .kc-top{display:flex;align-items:center;gap:8px;min-width:0}
  .kc-top .ns-avatar{--sz:24px;font-size:10px}
  .kc-top a.ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);text-decoration:none}
  .kc-top a.ttl:hover{color:var(--np-text);text-decoration:underline}
  .kc-sub{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kc-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3)}
  .kc-meta .ns-tag{height:20px;font-size:11px;padding:0 6px}
  .kc-next{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);padding-top:7px;border-top:1px solid var(--line-2);min-width:0}
  .kc-next span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kc-next svg{width:12px;height:12px;flex:none}
  .kc-next.warn{color:var(--warn)}.kc-next.bad{color:var(--bad)}.kc-next.ok{color:var(--ok)}
  .kc-more{width:24px;height:24px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink-3);flex:none}
  .kc-more:hover{background:var(--surface-3);color:var(--ink)}
  .kc-more svg{width:14px;height:14px}
  .kb-note{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);margin:0 0 10px}
  .kb-note svg{width:13px;height:13px}
  /* Match score lozenge */
  .match{display:inline-flex;align-items:center;height:20px;font-size:11.5px;font-weight:600;padding:0 6px;border-radius:4px;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
  .match.hi{background:var(--ok-bg);color:var(--ok)}.match.mid{background:var(--info-bg);color:var(--info)}.match.lo{background:var(--warn-bg);color:var(--warn)}.match.vlo{background:var(--neutral-bg);color:var(--neutral)}
  /* Mini pipeline + legend */
  .pipe{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--surface-4);min-width:110px;gap:1px}
  .pipe i{display:block;height:100%}
  .pipe-leg{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3)}
  .pipe-leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
  /* Pay band bar */
  .bandbar{position:relative;height:8px;border-radius:99px;background:var(--surface-4);margin:12px 0 6px}
  .bandbar .rng{position:absolute;top:0;bottom:0;left:15%;right:15%;background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:99px}
  .bandbar .mid{position:absolute;top:-3px;bottom:-3px;left:50%;width:2px;margin-left:-1px;background:var(--brand-line);border-radius:2px}
  .bandbar .mk{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--brand);border:2px solid var(--surface);transform:translate(-50%,-50%);box-shadow:var(--shadow-xs)}
  .bandbar .mk.over{background:var(--warn)}.bandbar .mk.under{background:var(--info)}
  .bandbar.sm{height:6px;margin:7px 0 3px;min-width:120px}.bandbar.sm .mk{width:11px;height:11px}.bandbar.sm .mid{top:-2px;bottom:-2px}
  .band-lbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding:0 11%}
  /* Scorecard rubric */
  .rub{display:inline-flex;gap:6px;flex-wrap:wrap}
  .rub button{height:30px;padding:0 11px;border-radius:var(--r-sm);border:1px solid var(--line-strong);font-size:12.5px;font-weight:550;color:var(--ink-2);background:var(--surface);transition:background var(--dur),border-color var(--dur),color var(--dur)}
  .rub button:hover{border-color:var(--ink-4);color:var(--ink)}
  .rub button[aria-pressed="true"][data-v="1"]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
  .rub button[aria-pressed="true"][data-v="2"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
  .rub button[aria-pressed="true"][data-v="3"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
  .rub button[aria-pressed="true"][data-v="4"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
  .sc-comp{padding:12px 0;border-bottom:1px solid var(--line-2);display:grid;gap:8px}
  .sc-comp:last-child{border-bottom:0}

        <div class="ns-section-title"><div><h2>Sources and capacity</h2><p>Which channels convert, and who is carrying the interview load</p></div></div>
        <div class="ns-grid c2">
          ${raw(NS.card({ title: 'Source effectiveness', sub: 'Applied → hired conversion by source · FY26 YTD', body: `<div id="aSrc"></div><table class="ns-table dense mt-4"><thead><tr><th>Source</th><th class="num">Applied</th><th class="num">Hired</th><th class="num">Conversion</th><th class="num">Share of hires</th></tr></thead><tbody>${Object.entries(YTD.bySource).map(([s, [a, h]]) => `<tr><td>${NS.esc(s)}</td><td class="num">${F.int(a)}</td><td class="num">${h}</td><td class="num"><b>${F.pct((h / a) * 100, 1)}</b></td><td class="num">${F.pct((h / fn[7]) * 100, 0)}</td></tr>`).join('')}</tbody></table>` }))}
          ${raw(NS.card({ title: 'Interviewer load · September', sub: `Interviews run or booked this month · ${over ? `${over} over the 8-per-month cap` : 'everyone under the 8-per-month cap'}`, body: '<div id="aLoad"></div>' }))}
        </div>
        <div class="ns-section-title"><div><h2>Fairness and candidate experience</h2><p>Aggregate pass-through by gender and post-interview sentiment</p></div></div>
        <div class="ns-grid c2">
          ${raw(NS.card({ title: 'Pass-through parity by gender', sub: 'Share of each stage’s candidates · open and paused reqs, aggregate only', body: `<div id="aPar"></div><div class="ns-alert ${Math.abs(gap) <= 5 ? 'ok' : 'warn'} mt-3">${ic(Math.abs(gap) <= 5 ? 'check-circle' : 'alert-triangle')}<div><b>Pass-through parity ${Math.abs(gap) <= 5 ? 'holds' : 'needs a look'}</b><p>Women are ${w0}% of applicants and ${w5}% of candidates reaching Hiring manager (${gap >= 0 ? '+' : ''}${gap} pts). We flag any stage that drifts more than 5 points from the applicant share — small groups are noisy, so read alongside the counts.</p></div></div>` }))}
          ${raw(NS.card({ title: 'Candidate experience', sub: 'Post-interview NPS by month · what candidates said', body: `<div id="aNps"></div><div class="grid gap-2 mt-3">${['“Every interviewer knew what they were assessing — first loop where I got the same questions as the rubric said.”', '“Fast: screen to offer in 19 days, with a decision within 48 hours of each round.”', '“System design ran over and the last interviewer had to rush. Would have liked more time for questions.”'].map((q) => `<div class="ns-quote" style="font-size:12.5px">${NS.esc(q)}</div>`).join('')}</div>` }))}
        </div>`;
    },
    mounted: (c, root) => {
      const fn = YTD.funnel, act = S.cands.filter((x) => x.status === 'active' && jobById(x.jobId).status === 'Open');
      P.barsAll(root.querySelector('#aConv'), { labels: ['App→Scr', 'Scr→Tech', 'Tech→Des', 'Des→Val', 'Val→HM', 'HM→Offer', 'Offer→Hire'], series: [{ name: 'Conversion', values: fn.slice(1).map((v, i) => Math.round((v / fn[i]) * 100)) }], yFormat: (v) => v + '%', yMax: 100, height: 230, showValues: true });
      NS.chart.hbars(root.querySelector('#aDays'), { items: SIDS.slice(0, 7).map((s) => { const l = act.filter((x) => x.stage === s), m = l.length ? U.median(l, (x) => daysIn(x)) : 0, sla = stageDef(s).sla; return { label: stageLabel(s), sub: `${l.length} active · SLA ${sla}d`, value: m, color: m > sla ? 'var(--viz-warn)' : 'var(--brand)' }; }), format: (v) => F.num(v, v % 1 ? 1 : 0) + ' d', valueLabel: 'Median days' });
      P.barsAll(root.querySelector('#aTtf'), { labels: YTD.ttf.map((x) => x[0].replace('Infrastructure & SRE', 'Infra & SRE').replace('Developer Experience', 'DevEx').replace('Engineering management', 'Eng mgmt')), series: [{ name: 'FY25', values: YTD.ttf.map((x) => x[1]), color: 'var(--ink-4)' }, { name: 'FY26 YTD', values: YTD.ttf.map((x) => x[2]), color: 'var(--brand)' }], height: 240, yFormat: (v) => v + 'd' });
      NS.chart.line(root.querySelector('#aAcc'), { labels: PLAN.months.slice(0, 9), series: [{ name: 'Offer acceptance', values: YTD.acceptance }], yFormat: (v) => v + '%', yMin: 70, yMax: 95, height: 220, threshold: { value: 85, label: 'Target 85%' }, endLabels: true });
      NS.chart.hbars(root.querySelector('#aSrc'), { items: Object.entries(YTD.bySource).map(([s, [a, h]]) => ({ label: s, sub: `${h} hires from ${F.int(a)}`, value: U.round((h / a) * 100, 2) })).sort((a, b) => b.value - a.value), format: (v) => v.toFixed(2) + '%', valueLabel: 'Applied → hired' });
      NS.chart.hbars(root.querySelector('#aLoad'), { items: loadOf().slice(0, 10).map((x) => ({ label: person(x.id).name, sub: person(x.id).team, value: x.n, color: x.n > 8 ? 'var(--viz-warn)' : 'var(--brand)' })), max: 12, format: (v) => F.int(v), valueLabel: 'Interviews' });
      P.parityChart(root.querySelector('#aPar'), 240);
      NS.chart.line(root.querySelector('#aNps'), { labels: PLAN.months.slice(1, 9), series: [{ name: 'Candidate NPS', values: YTD.nps }], yFormat: (v) => '+' + v, yMin: 30, yMax: 70, height: 180, threshold: { value: 60, label: 'Goal +60' }, endLabels: true });
      root.querySelector('[data-export]').onclick = () => downloadCsv('pipeline-funnel-FY26.csv', [['Stage', 'Reached', 'Conversion from previous'], ...SIDS.map((s, i) => [stageLabel(s), fn[i], i ? ((fn[i] / fn[i - 1]) * 100).toFixed(1) + '%' : ''])]);
    },
  };

  /* ------------------------------------------------------------------ */
  /* 12. Settings                                                        */
  /* ------------------------------------------------------------------ */
  R['/settings'] = {
    title: 'Settings', personas: ['recruiter', 'hrbp'],
    render: (c) => {
      const st = S.settings;
      return html`${raw(NS.pageHead({ eyebrow: 'Administration · applies to every Engineering requisition', title: 'Hiring settings', sub: 'The structure every requisition inherits: stages and SLAs, the scorecard rubric, competencies, sources and the guardrails that keep hiring fair.' }))}
        <div class="ns-grid c2">
          ${raw(NS.card({ title: 'Stages & SLAs', sub: 'Days a candidate may wait in each stage before it shows as a breach', body: `<div class="grid gap-1"><div class="set-row sm muted medium"><span>Stage name</span><span>SLA in days</span></div>${st.stages.map((s, i) => `<div class="set-row"><div class="flex items-center gap-2"><span class="plan-num stn" style="width:24px;height:24px;font-size:11px;--sc:${STC(s.id)}">${i + 1}</span><input class="ns-input sm" data-stage="${s.id}" value="${NS.esc(s.label)}"></div>${s.id === 'hired' ? '<span class="xs muted">—</span>' : `<input class="ns-input sm" type="number" min="1" max="30" data-sla="${s.id}" value="${s.sla}">`}</div>`).join('')}</div>` }))}
          ${raw(NS.card({ title: 'Scorecard rubric', sub: 'Four points, no neutral middle — interviewers must take a position', body: `<div class="grid gap-3">${st.rubric.map((r) => `<div class="grid gap-2" style="grid-template-columns:96px minmax(0,1fr)"><div>${recBadge(r.v)}<input class="ns-input sm mt-2" data-rl="${r.v}" value="${NS.esc(r.label)}"></div><textarea class="ns-textarea" style="min-height:62px;font-size:12.5px" data-rd="${r.v}">${NS.esc(r.desc)}</textarea></div>`).join('')}</div>` }))}
          ${raw(NS.card({ title: 'Competencies', sub: 'Aligned with the engineering competency framework, plus Values', body: `<div>${st.comps.map((x, i) => `<div class="set-comp"><label class="ns-switch"><input type="checkbox" data-comp="${i}" ${x.on ? 'checked' : ''}><i></i></label><div class="min-w-0"><b class="sm">${NS.esc(x.name)}</b><div class="xs muted">${NS.esc(x.desc)}</div></div></div>`).join('')}</div><div class="flex gap-2 mt-3"><input class="ns-input sm" id="newComp" placeholder="Add a competency, e.g. Customer empathy"><button class="ns-btn sm secondary" data-add-comp>${ic('plus')}Add</button></div>` }))}
          <div class="grid gap-4">
            ${raw(NS.card({ title: 'Structured-hiring guardrails', body: `<div class="grid gap-3">${[['independent', 'Independent scoring', 'Interviewers see others’ feedback only after submitting their own scorecard.'], ['langCheck', 'Language check on scorecards', 'Flags vague or coded words like “culture fit”, “overqualified” or “gut feeling”.'], ['structuredQs', 'Show structured questions', 'Every interviewer sees the stage’s questions in the scorecard.'], ['anonymize', 'Anonymised résumé review', 'Hide names and photos while candidates are in Applied.']].map(([k, t, d]) => `<label class="ns-switch"><input type="checkbox" data-guard="${k}" ${st[k] ? 'checked' : ''}><i></i><span><b class="sm">${t}</b><div class="xs muted">${d}</div></span></label>`).join('')}</div>` }))}
            ${raw(NS.card({ title: 'Sources', sub: 'Options offered when adding a candidate', body: `<div class="grid gap-2">${st.sources.map((s, i) => `<label class="ns-switch"><input type="checkbox" data-src="${i}" ${s.on ? 'checked' : ''}><i></i><span class="sm">${NS.esc(s.name)}</span></label>`).join('')}</div><div class="flex gap-2 mt-3"><input class="ns-input sm" id="newSrc" placeholder="e.g. Open-source community"><button class="ns-btn sm secondary" data-add-src>${ic('plus')}Add</button></div>` }))}
            ${raw(NS.card({ title: 'Recent activity', sub: 'Changes made in this session', body: S.log.length ? `<div class="grid gap-2">${S.log.slice(0, 8).map((a) => `<div class="flex justify-between gap-3 sm"><span class="ink2 truncate">${NS.esc(a.msg)}</span><span class="xs faint nowrap">${relDay(a.at)}</span></div>`).join('')}</div>` : '<div class="sm muted">Nothing yet — move a candidate or submit a scorecard.</div>' }))}
          </div>
        </div>
        <div class="pl-savebar"><span class="sm">Changes apply to every open requisition when you save. Candidates and scorecards are not changed.</span><div class="flex gap-2"><button class="ns-btn secondary" data-reset>${ic('undo')}Restore defaults</button><button class="ns-btn primary" data-save>${ic('save')}Save changes</button></div></div>`;
    },
    mounted: (c, root) => {
      const st = S.settings;
      root.querySelector('[data-save]').onclick = () => { root.querySelectorAll('[data-stage]').forEach((i) => { const s = st.stages.find((x) => x.id === i.dataset.stage); if (i.value.trim()) s.label = i.value.trim(); }); root.querySelectorAll('[data-sla]').forEach((i) => { st.stages.find((x) => x.id === i.dataset.sla).sla = U.clamp(+i.value || 1, 1, 30); }); root.querySelectorAll('[data-rl]').forEach((i) => { st.rubric[+i.dataset.rl - 1].label = i.value.trim() || RUBRIC[+i.dataset.rl - 1].label; }); root.querySelectorAll('[data-rd]').forEach((i) => { st.rubric[+i.dataset.rd - 1].desc = i.value.trim() || RUBRIC[+i.dataset.rd - 1].desc; }); root.querySelectorAll('[data-comp]').forEach((i) => { st.comps[+i.dataset.comp].on = i.checked; }); root.querySelectorAll('[data-src]').forEach((i) => { st.sources[+i.dataset.src].on = i.checked; }); root.querySelectorAll('[data-guard]').forEach((i) => { st[i.dataset.guard] = i.checked; }); log('Updated hiring settings'); save(); NS.toast('Settings saved', { desc: `${st.comps.filter((x) => x.on).length} competencies · independent scoring ${st.independent ? 'on' : 'off'} · SLAs applied to every req` }); NS.refresh(); };
      root.querySelector('[data-reset]').onclick = async () => { if (await NS.confirm({ title: 'Restore default settings?', body: 'Stages, SLAs, rubric wording, competencies, sources and guardrails return to the Northstar defaults. Candidates and scorecards are untouched.', confirmLabel: 'Restore' })) { Object.assign(st, { stages: STAGES.map((s) => ({ id: s.id, label: s.label, sla: s.sla })), rubric: RUBRIC.map((x) => ({ v: x.v, label: x.label, desc: x.desc })), comps: COMPS.map((x) => ({ ...x, on: true })), sources: SOURCES.map((s) => ({ name: s, on: true })), independent: true, langCheck: true, anonymize: false, structuredQs: true }); log('Restored default hiring settings'); save(); NS.toast('Defaults restored', { type: 'info' }); NS.refresh(); } };
      root.querySelector('[data-add-comp]').onclick = () => { const v = root.querySelector('#newComp').value.trim(); if (v.length < 3) { NS.toast('Name the competency', { type: 'warn' }); return; } st.comps.push({ id: 'c' + (st.comps.length + 1), name: v, desc: 'Custom competency — add it to a stage in the interview plan.', icon: 'star', on: true }); log(`Added competency ${v}`); save(); NS.toast('Competency added', { desc: 'Add it to a stage from any job’s Interview plan tab.' }); NS.refresh(); };
      root.querySelector('[data-add-src]').onclick = () => { const v = root.querySelector('#newSrc').value.trim(); if (v.length < 3) { NS.toast('Name the source', { type: 'warn' }); return; } st.sources.push({ name: v, on: true }); log(`Added source ${v}`); save(); NS.toast('Source added'); NS.refresh(); };
    },
  };

  /* ------------------------------------------------------------------ */
  /* 13. Boot                                                            */
  /* ------------------------------------------------------------------ */
  const store = NS.store('pipeline-ats');
  const personas = [
    { ...D.personas.recruiter, note: 'Runs every req end to end' },
    { ...D.personas.manager, label: 'Hiring manager', note: 'Two open roles on Identity & Access' },
    { ...D.personas.hrbp, note: 'Band checks, analytics, settings' },
    { ...D.personas.exec, note: 'Hiring plan & above-band approvals' },
  ];
  const nPend = (id) => P.pendingFor(id).length || '';
  const nAppr = (p) => S.offers.filter((o) => P.canApprove(o, p)).length || '';
  NS.app({
    id: 'pipeline-ats', name: 'Pipeline', sub: 'Northstar Labs', brand: 'orange', version: '2.0', category: 'Talent acquisition',
    mark: ic('git-branch', { size: 20 }),
    about: { tagline: 'Structured hiring, from req to offer — with the evidence in the room.', description: 'An applicant-tracking system with an opinion: every requisition carries its plan line, a structured interview loop with named competencies and a pay band. Candidates move across a drag-and-drop pipeline; interviewers score independently on a four-point rubric with a language check; offers are validated against the band for level and location and routed to the right approvers; and analytics watch speed, source quality and pass-through parity — in aggregate only.', highlights: [{ icon: 'kanban', title: 'Pipeline board', body: 'Drag candidates between stages; rejections need a reason, offers get a band check.' }, { icon: 'clipboard-check', title: 'Independent scorecards', body: 'Four-point rubric, structured questions, feedback unlocked after you submit.' }, { icon: 'scale', title: 'Offers against bands', body: 'Compa-ratio, above-band flags and a HM → HRBP → VP approval chain.' }, { icon: 'shield-check', title: 'Bias-aware by default', body: 'Language check, anonymised review option and pass-through parity tracking.' }] },
    personas, defaultPersona: 'recruiter',
    nav: (p) => p.id === 'manager' ? [{ group: 'Hiring manager', items: [{ id: 'home', label: 'Home', icon: 'home' }, { id: 'jobs', label: 'My jobs', icon: 'briefcase' }, { id: 'candidates', label: 'My candidates', icon: 'users' }, { id: 'interviews', label: 'My interviews', icon: 'calendar', badge: nPend('NS-1180') }, { id: 'offers', label: 'Offer approvals', icon: 'handshake', badge: nAppr(p) }] }]
      : p.id === 'hrbp' ? [{ group: 'People partner', items: [{ id: 'home', label: 'Home', icon: 'home' }, { id: 'offers', label: 'Offer approvals', icon: 'handshake', badge: nAppr(p) }, { id: 'analytics', label: 'Analytics', icon: 'bar-chart' }] }, { group: 'Administration', items: [{ id: 'settings', label: 'Hiring settings', icon: 'settings' }] }]
        : p.id === 'exec' ? [{ group: 'Engineering', items: [{ id: 'home', label: 'Hiring plan', icon: 'flag' }, { id: 'offers', label: 'Approvals', icon: 'handshake', badge: nAppr(p) }] }]
          : [{ group: 'Hiring', items: [{ id: 'home', label: 'Home', icon: 'home' }, { id: 'jobs', label: 'Jobs', icon: 'briefcase', badge: openJobs().length }, { id: 'candidates', label: 'Candidates', icon: 'users' }, { id: 'interviews', label: 'Interviews', icon: 'calendar', badge: nPend('NS-1920') }, { id: 'offers', label: 'Offers', icon: 'handshake', badge: S.offers.filter((o) => o.status === 'Awaiting approval' || o.status === 'Approved').length || '' }] }, { group: 'Insights', items: [{ id: 'analytics', label: 'Analytics', icon: 'bar-chart' }, { id: 'settings', label: 'Settings', icon: 'settings' }] }],
    promo: (p) => { if (p.id === 'recruiter' || p.id === 'manager') { const n = P.pendingFor(meId(p)).length; return n ? { title: 'Scorecards', body: `${n} scorecard${n > 1 ? 's' : ''} waiting on you — due within 24 hours of each interview.`, cta: { label: 'Fill them in', route: '/interviews?f=pending' } } : { title: 'All caught up', body: 'Every interview you ran has a scorecard.', cta: { label: 'Interviews', route: '/interviews' } }; } const n = S.offers.filter((o) => P.canApprove(o, p)).length; return { title: 'Approvals', body: n ? `${n} offer${n > 1 ? 's' : ''} waiting on your sign-off.` : 'No offers waiting on you.', cta: { label: 'Open queue', route: '/offers' } }; },
    notifications: [{ icon: 'clipboard-list', title: 'Scorecard pending: Nadia Rahman — System design', body: 'Kavya Nair and Aditya Kulkarni interviewed her yesterday at 15:00.', time: 'Today', route: '/interviews?f=pending' }, { icon: 'check-circle', title: 'Offer approved: Principal Engineer, Berlin', body: 'VP Engineering signed off the above-band offer on Storage. Ready to extend.', time: 'Yesterday', route: '/offers?f=Approved' }, { icon: 'alert-triangle', title: '3 roles aging past 45 days', body: 'Senior SRE (London), Senior Security Engineer (New York) and Engineering Manager (Austin).', time: '2 days ago', route: '/jobs?age=45' }, { icon: 'handshake', title: 'Offer extended to a Senior Data Engineer', body: 'Data Pipelines · Pune · expires 30 Sep.', time: '2 days ago', route: '/offers?f=Extended' }],
    routes: R, default: '/home',
    commands: (p) => [...(p.id === 'recruiter' ? [{ label: 'New requisition', icon: 'plus', group: 'Actions', run: () => { NS.go('/jobs'); setTimeout(() => P.jobModal(), 60); } }, { label: 'Export candidates (CSV)', icon: 'download', group: 'Actions', run: () => NS.go('/candidates') }] : []), ...(p.id === 'recruiter' || p.id === 'manager' ? [{ label: 'Scorecards waiting on me', icon: 'clipboard-list', group: 'Actions', run: () => NS.go('/interviews', { f: 'pending' }) }, { label: 'Open Nadia Rahman', icon: 'user', group: 'Actions', run: () => NS.go('/candidates/' + (S.cands.find((x) => x.name === 'Nadia Rahman') || {}).id) }] : []), { label: 'Offers needing approval', icon: 'handshake', group: 'Actions', run: () => NS.go('/offers', { f: p.id === 'recruiter' ? 'Awaiting approval' : 'mine' }) }],
    search: (q) => { if (q.length < 2) return []; const p = NS.persona; if (p.id === 'exec' || p.id === 'hrbp') return S.offers.filter((o) => candById(o.candId).name.toLowerCase().includes(q.toLowerCase())).slice(0, 5).map((o) => ({ group: 'Offers', label: candById(o.candId).name, hint: `${o.id} · ${o.status}`, avatar: NS.avatar(candById(o.candId).name, { size: 'xs' }), run: () => NS.go('/offers', { f: 'all', open: o.id }) })); const s = q.toLowerCase(); const jobs = S.jobs.filter((j) => canSeeJob(p, j) && `${j.role} ${j.team} ${j.id} ${j.city}`.toLowerCase().includes(s)).slice(0, 4).map((j) => ({ group: 'Jobs', label: jobTitle(j), hint: `${j.team} · ${j.city}`, icon: 'briefcase', run: () => NS.go('/jobs/' + j.id) })); const cs = S.cands.filter((x) => canSeeJob(p, jobById(x.jobId)) && `${x.name} ${x.skills.join(' ')} ${x.company}`.toLowerCase().includes(s)).slice(0, 6).map((x) => ({ group: 'Candidates', label: cName(x), hint: `${P.statusLabel(x)} · ${jobById(x.jobId).role}`, avatar: cAvatar(x, 'xs'), run: () => NS.go('/candidates/' + x.id) })); return [...jobs, ...cs]; },
    onReset: () => store.clear(),
  });
})();
</script>
</body>
</html>

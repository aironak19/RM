  .dist-bars .b{display:grid;align-content:end;justify-items:center;gap:6px;height:100%}
  .dist-bars .b i{width:100%;max-width:56px;border-radius:6px 6px 0 0;background:var(--brand);min-height:2px;transition:height .5s var(--ease)}
  .dist-bars .b span{font-size:11px;color:var(--ink-3);text-align:center}

  .tl-mini{display:grid;gap:6px;font-size:12.5px}
  .status-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
  .gap-flag{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:2px 7px;border-radius:99px}
  .cal-person{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;cursor:grab;box-shadow:var(--shadow-xs)}

  .ratings-hist{display:flex;gap:6px;align-items:flex-end;height:44px}

<script>
(function () {
  'use strict';
  const P = window.__PN, D = NSData, U = NS.util, F = NS.fmt, raw = NS.raw, ic = NS.ic; const html = (st, ...v) => st.reduce((a, x, i) => a + x + (i < v.length ? (Array.isArray(v[i]) ? v[i].map(NS.str).join('') : NS.str(v[i] == null || v[i] === false ? '' : v[i])) : ''), '');
  const { S, save, R, STATUS, SCALE, COMPS, CATS, CAT_COLORS, goalScore, compScore, overall, completion, selfSections, statusOf, statusBadge, goalStatusBadge, ratingButtons, scaleLegend, goalCard, personLink, scoreCard, labelFor, clsFor, aiGoalText, aiSummary, biasCheck, teamOf, meFor, daysLeft, log, TODAY, YEAR_FRAC } = P;

      const compare = c.query.view === 'compare';
      return html`${raw(NS.pageHead({ eyebrow: 'Manager review', title: `<span class="flex items-center gap-3">${NS.avatar(p, { size: 'lg' })}<span>${NS.esc(p.name)}<div class="base medium muted" style="letter-spacing:0">${p.title} · ${D.levelLabel(p.level)} · ${p.city} · ${F.tenure(p.tenure)} tenure</div></span></span>`, actions: `${statusBadge(rv.status)}<a class="ns-btn secondary" href="${NS.link('/people/' + pid)}">${ic('id-card')}Profile</a><div class="ns-seg"><a class="ns-btn" style="height:30px;padding:0 12px;font-size:13px;border-radius:8px;${!compare ? 'background:var(--surface);box-shadow:var(--shadow-sm)' : 'color:var(--ink-3)'}" href="${NS.link('/review/' + pid)}">Review</a><a class="ns-btn" style="height:30px;padding:0 12px;font-size:13px;border-radius:8px;${compare ? 'background:var(--surface);box-shadow:var(--shadow-sm)' : 'color:var(--ink-3)'}" href="${NS.link('/review/' + pid, { view: 'compare' })}">Compare</a></div>` }))}
        ${done ? `<div class="ns-alert ok mb-4">${ic('check-circle')}<div><b>Submitted ${F.date(rv.manager.submittedAt)} · overall ${(overall(pid, 'manager') || 0).toFixed(1)} — ${labelFor(overall(pid, 'manager'))}</b><p>Ratings are provisional until calibration closes on ${F.date(S.settings.phases[4].end)}.</p></div></div>` : ''}
        ${compare ? compareView(p) : html`<div class="review-layout"><div class="grid gap-4">
          <div class="ns-section-title" style="margin-top:0"><h2>Goals <span class="muted medium">· ${P.weights().goals}% of overall</span></h2><span class="sm muted">Self ratings are shown for context — rate on evidence, not on the self score.</span></div>
          ${goals.map((g, i) => { const s = rv.self.goals[g.id] || {}, m = rv.manager.goals[g.id] || {}; const gap = s.rating && m.rating ? m.rating - s.rating : 0; return `<div class="ns-card"><div class="ns-card-body grid gap-3"><div class="goal-top"><div><div class="goal-meta"><span class="ns-badge ${CATS[g.cat]} sq">${g.cat}</span><span>Weight ${g.weight}%</span><span>·</span><span>${g.progress}% complete</span>${goalStatusBadge(g)}</div><div class="goal-title mt-2">${NS.esc(g.title)}</div></div><div class="right flex-none"><div class="xs muted">Self rating</div><div class="xl-text bold">${s.rating || '—'}<span class="sm muted">/5</span></div></div></div><div class="self-quote">${s.comment ? NS.esc(s.comment) : '<span class="faint">No self-comment provided.</span>'}</div><div class="kr" style="border-top:0;padding:0">${g.krs.map((k) => `<span class="xs muted">${ic('target', { size: 11 })} ${NS.esc(k.k)}: <b class="ink">${NS.esc(k.current)}</b> ${k.current === k.target ? '· met' : '→ ' + NS.esc(k.target)}</span>`).join('')}</div><div><div class="ns-label mb-2 flex items-center gap-2">Your assessment ${Math.abs(gap) >= 2 ? `<span class="gap-flag">${gap > 0 ? '+' : ''}${gap} vs self — add evidence</span>` : ''}</div><div class="rate-row">${done ? `<span class="ns-badge lg ${clsFor(m.rating)}">${m.rating} · ${SCALE[m.rating - 1].label}</span>` : ratingButtons('goal:' + g.id, m.rating)}<span class="rate-desc" data-rate-desc>${m.rating ? SCALE[m.rating - 1].desc : ''}</span></div></div>${done ? (m.comment ? `<p class="sm ink2">${NS.esc(m.comment)}</p>` : '') : `<textarea class="ns-textarea" data-comment="goal:${g.id}" placeholder="Specific, observable, tied to the key results. Avoid adjectives without evidence.">${NS.esc(m.comment || '')}</textarea><div class="flex gap-2 items-center wrap"><button class="ns-btn sm soft" data-ai="goal:${g.id}">${ic('sparkles')}AI draft from evidence</button><span class="xs faint">Uses the goal’s key results, check-ins and your rating.</span></div>`}</div></div>`; }).join('')}
          <div class="ns-section-title"><h2>Competencies <span class="muted medium">· ${P.weights().comps}% of overall</span></h2><span class="sm muted">Level: ${D.levelLabel(p.level)}</span></div>
          <div class="ns-card"><div class="ns-card-body grid gap-4">${COMPS.map((cp) => { const s = rv.self.comps[cp.id] || {}, m = rv.manager.comps[cp.id] || {}; return `<div class="grid gap-2" style="padding-bottom:14px;border-bottom:1px solid var(--line-2)"><div class="flex justify-between gap-3 items-start"><div class="flex gap-3 items-start"><span class="ns-icon-box sm">${ic(cp.icon)}</span><div><b class="md">${cp.name}</b><div class="xs muted">${cp.desc}</div></div></div><div class="right flex-none xs muted">Self <b class="ink base">${s.rating === 0 ? 'N/A' : s.rating || '—'}</b></div></div>${s.comment ? `<div class="self-quote">${NS.esc(s.comment)}</div>` : ''}<div class="rate-row">${done ? `<span class="ns-badge lg ${clsFor(m.rating)}">${m.rating === 0 ? 'N/A' : m.rating ? m.rating + ' · ' + SCALE[m.rating - 1].label : '—'}</span>` : ratingButtons('comp:' + cp.id, m.rating, { na: S.settings.allowNA })}</div></div>`; }).join('')}</div></div>
          <div class="ns-section-title"><h2>Overall</h2></div>
          <div class="ns-card"><div class="ns-card-body grid gap-4">
            <div class="ns-field"><span class="ns-label">Potential <span class="opt">for calibration — readiness for broader scope</span></span><div class="ns-seg" id="potential">${['Low', 'Medium', 'High'].map((l, i) => `<button data-pot="${i + 1}" aria-pressed="${rv.manager.potential === i + 1}" ${done ? 'disabled' : ''}>${l}</button>`).join('')}</div></div>
            <label class="ns-field"><span class="ns-label">Summary for the conversation</span>${done ? `<p class="md ink2">${NS.esc(rv.manager.summary)}</p>` : `<textarea class="ns-textarea" style="min-height:120px" data-summary placeholder="Three sentences: the headline, the evidence, the growth edge.">${NS.esc(rv.manager.summary || '')}</textarea>`}</label>
            ${done ? '' : `<div class="flex gap-2 wrap items-center"><button class="ns-btn sm soft" data-ai-summary>${ic('sparkles')}Draft summary from ratings</button><span class="xs faint">Synthesises goals, competencies and peer feedback.</span></div>`}
            <div id="biasbox">${flags.length ? `<div class="ns-alert warn">${ic('alert-triangle')}<div><b>Language check · ${flags.length} suggestion${flags.length > 1 ? 's' : ''}</b>${flags.map((f) => `<p>“${NS.esc(f.word)}” — ${f.msg}</p>`).join('')}</div></div>` : `<div class="ns-alert ok">${ic('check-circle')}<div><b>Language check passed</b><p>No vague, absolute or coded terms found in your comments.</p></div></div>`}</div>
            ${done ? '' : `<div class="flex gap-2 justify-end wrap"><button class="ns-btn secondary" data-save-draft>${ic('save')}Save draft</button><button class="ns-btn primary" data-submit-mgr>${ic('send')}Submit manager review</button></div>`}
          </div></div>
        </div>
        <div class="review-side">${scoreCard(pid, { who: 'manager' })}${NS.card({ title: 'Rating guide', body: scaleLegend() })}${NS.card({ title: 'Your ratings so far', sub: 'Across the team this cycle', body: distMini(meFor(c.persona)) })}</div></div>`}`;
    },
    mounted: (c, root) => {
      const p = D.byId(c.params.id); if (!p) return; const pid = p.id, rv = S.reviews[pid];
      root.querySelectorAll('[data-rate] button').forEach((b) => b.onclick = () => { const [kind, id] = b.closest('[data-rate]').dataset.rate.split(':'); const v = +b.dataset.v; const bag = kind === 'goal' ? rv.manager.goals : rv.manager.comps; bag[id] = { ...(bag[id] || {}), rating: v }; if (rv.status === 'self_submitted') rv.status = 'manager_in_progress'; save(); b.closest('[data-rate]').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b)); const d = b.closest('.rate-row').querySelector('[data-rate-desc]'); if (d) d.textContent = v === 0 ? 'Not applicable' : SCALE[v - 1].desc; const side = root.querySelector('.review-side'); if (side) side.firstElementChild.outerHTML = scoreCard(pid, { who: 'manager' }); });
      root.querySelectorAll('[data-comment]').forEach((t) => t.oninput = U.debounce(() => { const [, id] = t.dataset.comment.split(':'); rv.manager.goals[id] = { ...(rv.manager.goals[id] || {}), comment: t.value }; save(); refreshBias(root, rv); }, 200));
      const sum = root.querySelector('[data-summary]'); if (sum) sum.oninput = U.debounce(() => { rv.manager.summary = sum.value; save(); refreshBias(root, rv); }, 200);
      root.querySelectorAll('#potential button').forEach((b) => b.onclick = () => { rv.manager.potential = +b.dataset.pot; save(); root.querySelectorAll('#potential button').forEach((x) => x.setAttribute('aria-pressed', x === b)); });
      root.querySelectorAll('[data-ai]').forEach((b) => b.onclick = async () => { const [, id] = b.dataset.ai.split(':'); const g = S.goals[pid].find((x) => x.id === id); const m = rv.manager.goals[id]; if (!m || !m.rating) { NS.toast('Rate the goal first', { type: 'warn', desc: 'The draft is anchored to your rating.' }); return; } const ta = root.querySelector(`[data-comment="goal:${id}"]`); b.disabled = true; const text = aiGoalText(p, g, m.rating, 'manager'); await NS.aiTyping(ta, text, { delay: 500 }); ta.value = text; rv.manager.goals[id].comment = text; save(); b.disabled = false; b.innerHTML = ic('sparkles') + 'Regenerate'; refreshBias(root, rv); });
      const ais = root.querySelector('[data-ai-summary]'); if (ais) ais.onclick = async () => { if (!Object.keys(rv.manager.goals).length) { NS.toast('Rate at least one goal first', { type: 'warn' }); return; } const ta = root.querySelector('[data-summary]'); ais.disabled = true; const text = aiSummary(p, pid); await NS.aiTyping(ta, text, { delay: 600 }); ta.value = text; rv.manager.summary = text; save(); ais.disabled = false; refreshBias(root, rv); };
      const sd = root.querySelector('[data-save-draft]'); if (sd) sd.onclick = () => { if (rv.status === 'self_submitted') rv.status = 'manager_in_progress'; save(); NS.toast('Draft saved', { type: 'info' }); NS.refresh(); };
      const sm = root.querySelector('[data-submit-mgr]'); if (sm) sm.onclick = () => { const goals = S.goals[pid]; const missing = goals.filter((g) => !(rv.manager.goals[g.id] && rv.manager.goals[g.id].rating)).length + COMPS.filter((cp) => !(rv.manager.comps[cp.id] && rv.manager.comps[cp.id].rating != null)).length; if (missing) { NS.toast(`${missing} item${missing > 1 ? 's' : ''} still unrated`, { type: 'warn', desc: 'Every goal and competency needs a rating before you submit.' }); return; } if (!rv.manager.potential) { NS.toast('Set a potential rating', { type: 'warn' }); return; } const om = overall(pid, 'manager'); NS.modal({ title: `Submit review for ${p.first}?`, sub: 'Ratings stay provisional until calibration closes.', size: 'sm', body: `<div class="grid gap-2 sm ink2"><div class="flex justify-between"><span>Goals (weighted)</span><b>${goalScore(pid, 'manager').toFixed(1)}</b></div><div class="flex justify-between"><span>Competencies</span><b>${compScore(pid, 'manager').toFixed(1)}</b></div><div class="flex justify-between"><span>Overall</span><b>${om.toFixed(1)} · ${labelFor(om)}</b></div><div class="flex justify-between"><span>Potential</span><b>${['Low', 'Medium', 'High'][rv.manager.potential - 1]}</b></div></div>`, actions: [{ label: 'Keep editing' }, { label: 'Submit', cls: 'primary', onClick: () => { rv.status = 'manager_submitted'; rv.manager.submittedAt = TODAY.toISOString().slice(0, 10); save(); log(`Submitted manager review for ${p.name}`); NS.toast('Manager review submitted', { desc: `${p.first}’s rating is now in the calibration set.` }); NS.go('/team'); } }] }); };
    },
  };
  const refreshBias = (root, rv) => { const box = root.querySelector('#biasbox'); if (!box) return; const flags = biasCheck(Object.values(rv.manager.goals).map((x) => x.comment || '').join(' ') + ' ' + (rv.manager.summary || '')); box.innerHTML = flags.length ? `<div class="ns-alert warn">${ic('alert-triangle')}<div><b>Language check · ${flags.length} suggestion${flags.length > 1 ? 's' : ''}</b>${flags.map((f) => `<p>“${NS.esc(f.word)}” — ${f.msg}</p>`).join('')}</div></div>` : `<div class="ns-alert ok">${ic('check-circle')}<div><b>Language check passed</b><p>No vague, absolute or coded terms found in your comments.</p></div></div>`; };
  const distMini = (mgr) => { const team = teamOf(mgr.id); const counts = [0, 0, 0, 0, 0]; team.forEach((p) => { const o = overall(p.id, 'manager'); if (o != null) counts[U.clamp(Math.round(o), 1, 5) - 1]++; }); const max = Math.max(1, ...counts); return `<div class="dist-bars" style="height:96px">${counts.map((n, i) => `<div class="b"><b>${n}</b><i style="height:${(n / max) * 60}px"></i><span>${SCALE[i].short}</span></div>`).join('')}</div><div class="xs muted mt-2">Guideline: roughly 5 · 15 · 55 · 20 · 5 %. Skewed distributions get discussed in calibration — that’s fine if the evidence is there.</div>`; };
  const compareView = (p) => { const pid = p.id, rv = S.reviews[pid], goals = S.goals[pid]; const rows = [...goals.map((g) => ({ label: g.title, w: g.weight + '%', s: (rv.self.goals[g.id] || {}).rating, m: (rv.manager.goals[g.id] || {}).rating })), ...COMPS.map((cp) => ({ label: cp.name, w: 'comp', s: (rv.self.comps[cp.id] || {}).rating, m: (rv.manager.comps[cp.id] || {}).rating }))]; return html`<div class="ns-grid main-side"><div class="ns-card"><div class="ns-card-body flush"><table class="ns-table"><thead><tr><th>Item</th><th>Weight</th><th class="num">Self</th><th class="num">Manager</th><th class="num">Gap</th></tr></thead><tbody>${rows.map((r) => { const gap = r.s != null && r.m != null ? r.m - r.s : null; return `<tr><td><b>${NS.esc(r.label)}</b></td><td class="muted">${r.w}</td><td class="num">${r.s == null ? '—' : r.s === 0 ? 'N/A' : r.s}</td><td class="num">${r.m == null ? '—' : r.m === 0 ? 'N/A' : r.m}</td><td class="num">${gap == null ? '—' : `<span class="ns-badge ${Math.abs(gap) >= 2 ? 'warn' : gap === 0 ? 'neutral' : 'info'}">${gap > 0 ? '+' : ''}${gap}</span>`}</td></tr>`; }).join('')}</tbody></table></div></div><div class="grid gap-4">${scoreCard(pid, { who: 'manager' })}<div id="cmpRadar" class="ns-card"><div class="ns-card-head"><div><h3>Competency radar</h3><p>Self vs manager</p></div></div><div class="ns-card-body"><div id="radar"></div></div></div></div></div>`; };
  const origMgrMounted = R['/review/:id'].mounted;
  R['/review/:id'].mounted = (c, root) => { origMgrMounted(c, root); const el = root.querySelector('#radar'); if (el) { const rv = S.reviews[c.params.id]; NS.chart.radar(el, { axes: COMPS.map((x) => x.name.split(' ')[0]), series: [{ name: 'Self', values: COMPS.map((x) => (rv.self.comps[x.id] || {}).rating || 0) }, { name: 'Manager', values: COMPS.map((x) => (rv.manager.comps[x.id] || {}).rating || 0) }], max: 5, size: 300 }); } };

  const nudge = (ids) => { const names = ids.map((id) => D.byId(id).first); ids.forEach((id) => { S.nudges[id] = (S.nudges[id] || 0) + 1; }); save(); log(`Nudged ${names.join(', ')}`); NS.toast(`Nudge sent to ${names.length === 1 ? names[0] : names.length + ' people'}`, { desc: 'A friendly reminder with the deadline and a direct link.', type: 'info' }); };
  P.nudge = nudge; P.managerReviewIndex = managerReviewIndex;
  document.addEventListener('click', (e) => { const b = e.target.closest('[data-nudge]'); if (b) nudge([b.dataset.nudge]); });
})();
</script>
<script>
(function () {
  'use strict';
  const P = window.__PN, D = NSData, U = NS.util, F = NS.fmt, raw = NS.raw, ic = NS.ic; const html = (st, ...v) => st.reduce((a, x, i) => a + x + (i < v.length ? (Array.isArray(v[i]) ? v[i].map(NS.str).join('') : NS.str(v[i] == null || v[i] === false ? '' : v[i])) : ''), '');
  const { S, save, R, STATUS, SCALE, COMPS, CATS, CAT_COLORS, NINE, TRAPS, goalScore, compScore, overall, completion, statusOf, statusBadge, personLink, labelFor, clsFor, teamOf, meFor, daysLeft, log, TODAY, nudge, downloadCsv } = P;

  /* TEAM QUEUE --------------------------------------------------------- */
  R['/team'] = {
    title: 'Team reviews', personas: ['manager'],
    render: (c) => {
      const me = meFor(c.persona), team = teamOf(me.id);
      const counts = U.countBy(team, (p) => statusOf(p.id));
      const f = c.query.status || 'all';
      return html`${raw(NS.pageHead({ eyebrow: 'Manager review', title: 'Team reviews', sub: `${team.length} reports · self review closes ${F.date(D.cycle.selfReviewCloses)} · your review window ${F.date(S.settings.phases[3].start, 'short')} – ${F.date(S.settings.phases[3].end)}.`, actions: `<button class="ns-btn secondary" data-nudge-all>${ic('megaphone')}Nudge everyone not started</button><a class="ns-btn primary" href="${NS.link('/calibration')}">${ic('grid')}Calibration</a>` }))}
        <div class="ns-stats mb-4">${raw(NS.stat({ label: 'Ready for you', value: counts.self_submitted || 0, icon: 'inbox', sub: 'self reviews submitted' }))}${raw(NS.stat({ label: 'In progress', value: counts.manager_in_progress || 0, icon: 'pencil', sub: 'your drafts' }))}${raw(NS.stat({ label: 'Submitted', value: (counts.manager_submitted || 0) + (counts.calibrated || 0), icon: 'check-circle', sub: 'awaiting calibration' }))}${raw(NS.stat({ label: 'Waiting on employee', value: (counts.not_started || 0) + (counts.self_in_progress || 0), icon: 'hourglass', sub: `${counts.not_started || 0} not started` }))}</div>
        <div class="ns-toolbar"><div class="ns-chips">${[['all', 'All'], ['self_submitted', 'Ready'], ['manager_in_progress', 'In progress'], ['manager_submitted', 'Submitted'], ['self_in_progress', 'Employee drafting'], ['not_started', 'Not started']].map(([k, l]) => `<a class="ns-chip" aria-pressed="${f === k}" href="${NS.link('/team', { status: k === 'all' ? '' : k })}">${l} <span class="n">${k === 'all' ? team.length : counts[k] || 0}</span></a>`).join('')}</div></div>
        <div id="teamTable"></div>`;
    },
    mounted: (c, root) => {
      const me = meFor(c.persona), team = teamOf(me.id); const f = c.query.status;
      NS.table(root.querySelector('#teamTable'), { rows: team.filter((p) => !f || statusOf(p.id) === f), rowKey: 'id', pageSize: 12, sort: { key: 'status' }, columns: [
        { key: 'name', label: 'Person', render: (p) => personLink(p, `${D.levelLabel(p.level)} · ${p.city}`), sort: (p) => p.name },
        { key: 'status', label: 'Status', render: (p) => statusBadge(statusOf(p.id)), sort: (p) => -STATUS[statusOf(p.id)].step },
        { key: 'progress', label: 'Self review', render: (p) => { const cp = completion(p.id); return `<div style="min-width:120px"><div class="flex justify-between xs muted"><span>${cp.done}/${cp.total}</span><span>${cp.pct}%</span></div>${NS.progress(cp.pct, { cls: 'xs mt-1' })}</div>`; }, sort: (p) => completion(p.id).pct },
        { key: 'self', label: 'Self score', align: 'right', render: (p) => { const v = overall(p.id, 'self'); return v == null ? '<span class="faint">—</span>' : `<b>${v.toFixed(1)}</b>`; }, sort: (p) => overall(p.id, 'self') || 0 },
        { key: 'mgr', label: 'Your score', align: 'right', render: (p) => { const v = overall(p.id, 'manager'); return v == null ? '<span class="faint">—</span>' : `<b>${v.toFixed(1)}</b> <span class="xs muted">${labelFor(v)}</span>`; }, sort: (p) => overall(p.id, 'manager') || 0 },
        { key: 'goals', label: 'Goal progress', align: 'right', render: (p) => { const g = S.goals[p.id]; return `${Math.round(U.avg(g, 'progress'))}% <span class="xs muted">· ${g.filter((x) => x.status === 'behind' || x.status === 'risk').length} at risk</span>`; }, sort: (p) => U.avg(S.goals[p.id], 'progress') },
        { key: 'act', label: '', sort: false, align: 'right', render: (p) => { const st = statusOf(p.id); return st === 'self_submitted' || st === 'manager_in_progress' ? `<a class="ns-btn sm primary" href="${NS.link('/review/' + p.id)}">${st === 'self_submitted' ? 'Start review' : 'Continue'}</a>` : st === 'manager_submitted' || st === 'calibrated' ? `<a class="ns-btn sm secondary" href="${NS.link('/review/' + p.id)}">View</a>` : `<button class="ns-btn sm ghost" data-nudge="${p.id}">${ic('bell')}Nudge${S.nudges[p.id] ? ` (${S.nudges[p.id]})` : ''}</button>`; } },
      ], empty: { icon: 'inbox', title: 'No one in this state', body: 'Try another filter.' } });
      const na = root.querySelector('[data-nudge-all]'); if (na) na.onclick = () => { const ids = team.filter((p) => statusOf(p.id) === 'not_started' || statusOf(p.id) === 'self_in_progress').map((p) => p.id); if (!ids.length) { NS.toast('Everyone has submitted', { type: 'info' }); return; } nudge(ids); };
    },
  };

  /* CALIBRATION ------------------------------------------------------- */
  P.calRating = (pid) => (S.calib[pid] ? S.calib[pid].rating : overall(pid, 'manager'));
  P.calPotential = (pid) => (S.calib[pid] ? S.calib[pid].potential : S.reviews[pid].manager.potential);
  P.perfBucket = (pid) => { const v = P.calRating(pid); return v == null ? 1 : v < 2.5 ? 0 : v < 3.75 ? 1 : 2; };
  const engOrgs = () => U.uniq(D.people.filter((p) => p.dept === 'Engineering' && p.org !== 'Engineering Leadership').map((p) => p.org));
  R['/calibration'] = {

ctor('#k').value + ' ' + body.querySelector('#t').value; const flags = P.biasCheck(txt); coach.textContent = flags.length ? flags.map((f) => `“${f.word}” — ${f.msg}`).join(' ') : txt.length > 40 ? 'Reads specific and actionable. 👍' : 'Aim for a specific situation and its impact. Avoid personality labels.'; }, 250); body.querySelectorAll('textarea').forEach((t) => t.oninput = chk); } }); });

        { key: 'team', label: 'Team', render: (p) => `<div class="sm">${NS.esc(p.team)}</div><div class="xs muted">${NS.esc(p.dept)}</div>` },
        { key: 'manager', label: 'Manager', render: (p) => { const m = D.byId(p.managerId); return m ? `<div class="flex items-center gap-2">${NS.avatar(m, { size: 'xs' })}<span class="sm">${NS.esc(m.name)}</span></div>` : '—'; }, sort: (p) => (D.byId(p.managerId) || {}).name || '' },
        { key: 'status', label: 'Status', render: (p) => statusBadge(statusOf(p.id)), sort: (p) => STATUS[statusOf(p.id)].step },
        { key: 'self', label: 'Self', align: 'right', render: (p) => { const v = overall(p.id, 'self'); return v == null ? '<span class="faint">—</span>' : v.toFixed(1); }, sort: (p) => overall(p.id, 'self') || 0 },
        { key: 'mgr', label: 'Manager', align: 'right', render: (p) => { const v = overall(p.id, 'manager'); return v == null ? '<span class="faint">—</span>' : `<b>${v.toFixed(1)}</b>`; }, sort: (p) => overall(p.id, 'manager') || 0 },
        { key: 'nudges', label: 'Nudges', align: 'right', render: (p) => (S.nudges[p.id] ? `<span class="ns-badge warn">${S.nudges[p.id]}</span>` : '<span class="faint">0</span>'), sort: (p) => S.nudges[p.id] || 0 },
        { key: 'act', label: '', sort: false, align: 'right', render: (p) => (STATUS[statusOf(p.id)].step < 2 ? `<button class="ns-btn xs ghost" data-nudge="${p.id}">${ic('bell')}Nudge</button>` : `<a class="ns-btn xs ghost" href="${NS.link('/people/' + p.id)}">View</a>`) },
      ] });
      const applyFilters = () => { const dept = root.querySelector('#fDept').value, st = root.querySelector('#fStatus').value, rg = root.querySelector('#fRegion').value; tbl.setFilter((p) => (!dept || p.dept === dept) && (!st || statusOf(p.id) === st) && (!rg || p.region === rg)); };
      ['#fDept', '#fStatus', '#fRegion'].forEach((id) => root.querySelector(id).onchange = applyFilters);
      root.querySelector('#q').oninput = (e) => tbl.setSearch(e.target.value);
      root.addEventListener('change', (e) => { const cb = e.target.closest('[data-sel]'); if (cb) { if (cb.checked) sel.add(cb.dataset.sel); else sel.delete(cb.dataset.sel); updSel(); } });
      bulk.onclick = () => { nudge(Array.from(sel)); sel.clear(); updSel(); tbl.refresh(); };
      root.querySelector('[data-export]').onclick = () => downloadCsv('FY26-cycle-status.csv', [['Employee ID', 'Name', 'Title', 'Level', 'Department', 'Team', 'Location', 'Manager', 'Status', 'Self score', 'Manager score'], ...tbl.rows().map((p) => [p.id, p.name, p.title, p.level, p.dept, p.team, p.city, (D.byId(p.managerId) || {}).name || '', STATUS[statusOf(p.id)].label, overall(p.id, 'self') ? overall(p.id, 'self').toFixed(2) : '', overall(p.id, 'manager') ? overall(p.id, 'manager').toFixed(2) : ''])]);
      root.querySelector('[data-extend]').onclick = () => NS.modal({ title: 'Extend self-review deadline', sub: 'Applies to the selected scope only. Managers are notified automatically.', body: `<div class="grid gap-4"><label class="ns-field"><span class="ns-label">Scope</span><select class="ns-select" id="scope"><option>Sales — all teams</option><option>Customer Success — Technical Support</option><option>Everyone</option></select></label><label class="ns-field"><span class="ns-label">New deadline</span><input class="ns-input" type="date" id="dl" value="2026-10-06"></label><label class="ns-field"><span class="ns-label">Reason <span class="opt">shown to managers</span></span><input class="ns-input" id="why" value="Quarter-end close — field teams travelling"></label></div>`, actions: [{ label: 'Cancel' }, { label: 'Extend', cls: 'primary', onClick: (m) => { log(`Extended deadline for ${m.el.querySelector('#scope').value} to ${m.el.querySelector('#dl').value}`); NS.toast('Deadline extended', { desc: `${m.el.querySelector('#scope').value} · ${F.date(m.el.querySelector('#dl').value)}` }); } }] });
    },
  };

  /* SETTINGS (HRBP) --------------------------------------------------- */
  R['/settings'] = {
    title: 'Cycle settings', personas: ['hrbp'],
    render: (c) => { const st = S.settings; return html`${raw(NS.pageHead({ eyebrow: 'Administration', title: 'Cycle settings', sub: 'Configuration for the FY26 cycle. Changes apply to reviews that have not been submitted.', actions: `<button class="ns-btn primary" data-save-settings>${ic('save')}Save changes</button>` }))}
      <div class="ns-grid c2">
        ${raw(NS.card({ title: 'Scoring weights', sub: 'How the overall score is composed', body: `<label class="ns-field"><span class="ns-label">Goals <b id="wg">${st.weights.goals}%</b> · Competencies <b id="wc">${st.weights.comps}%</b></span><input type="range" class="ns-range" min="30" max="80" step="5" value="${st.weights.goals}" id="wslider" style="--p:${((st.weights.goals - 30) / 50) * 100}%"></label><div class="ns-alert info mt-3">${ic('info')}<div><b>Example</b><p id="wex">Goals 4.2 and competencies 3.6 → overall ${((4.2 * st.weights.goals + 3.6 * st.weights.comps) / 100).toFixed(2)}</p></div></div>` }))}
        ${raw(NS.card({ title: 'Options', body: `<div class="grid gap-3"><label class="ns-switch"><input type="checkbox" data-opt="anonymousPeer" ${st.anonymousPeer ? 'checked' : ''}><i></i><span><b class="sm">Anonymous peer feedback</b><div class="xs muted">Managers see themes, not names.</div></span></label><label class="ns-switch"><input type="checkbox" data-opt="allowNA" ${st.allowNA ? 'checked' : ''}><i></i><span><b class="sm">Allow “N/A” on competencies</b><div class="xs muted">Excluded from the competency average.</div></span></label><label class="ns-field"><span class="ns-label">Minimum peer responses for a summary</span><input class="ns-input sm" type="number" min="1" max="6" value="${st.minPeer}" data-opt-num="minPeer" style="width:100px"></label></div>` }))}
        ${raw(NS.card({ title: 'Cycle phases', sub: 'Dates drive countdowns, nudges and what each persona can do', body: `<div class="grid gap-2">${st.phases.map((p, i) => `<div class="grid" style="grid-template-columns:1fr auto auto;gap:8px;align-items:center"><span class="sm semibold">${p.label}</span><input class="ns-input sm" type="date" value="${p.start}" data-ph="${i}" data-k="start"><input class="ns-input sm" type="date" value="${p.end}" data-ph="${i}" data-k="end"></div>`).join('')}</div>` }))}
        ${raw(NS.card({ title: 'Rating scale', sub: 'Labels and descriptors shown to everyone', body: `<div class="grid gap-2">${SCALE.map((s) => `<div class="grid" style="grid-template-columns:32px 1fr;gap:10px;align-items:start"><span class="ns-badge ${s.v >= 4 ? 'ok' : s.v === 3 ? 'brand' : 'warn'} sq" style="justify-content:center">${s.v}</span><div><input class="ns-input sm" value="${NS.esc(s.label)}" data-scale="${s.v}" data-k="label"><textarea class="ns-textarea mt-1" style="min-height:52px;font-size:12.5px" data-scale="${s.v}" data-k="desc">${NS.esc(s.desc)}</textarea></div></div>`).join('')}</div>` }))}
        ${raw(NS.card({ title: 'Competency library', sub: 'Shared with the Competency Portal', body: `<div class="grid gap-2">${COMPS.map((cp) => `<div class="flex gap-3 items-start"><span class="ns-icon-box sm">${ic(cp.icon)}</span><div><b class="sm">${cp.name}</b><div class="xs muted">${cp.desc}</div></div></div>`).join('')}</div>` }))}
        ${raw(NS.card({ title: 'Activity log', sub: 'Recent actions in this prototype', body: S.activity.length ? `<div class="grid gap-2">${S.activity.slice(0, 10).map((a) => `<div class="flex justify-between gap-3 sm"><span class="ink2">${NS.esc(a.msg)}</span><span class="xs faint nowrap">${F.rel(a.t)}</span></div>`).join('')}</div>` : '<div class="sm muted">No activity yet.</div>' }))}
      </div>`; },
    mounted: (c, root) => {
      const st = S.settings; const sl = root.querySelector('#wslider');
      sl.oninput = () => { const g = +sl.value; root.querySelector('#wg').textContent = g + '%'; root.querySelector('#wc').textContent = (100 - g) + '%'; sl.style.setProperty('--p', ((g - 30) / 50) * 100 + '%'); root.querySelector('#wex').textContent = `Goals 4.2 and competencies 3.6 → overall ${((4.2 * g + 3.6 * (100 - g)) / 100).toFixed(2)}`; };
      root.querySelector('[data-save-settings]').onclick = () => { st.weights = { goals: +sl.value, comps: 100 - sl.value }; root.querySelectorAll('[data-opt]').forEach((i) => st[i.dataset.opt] = i.checked); root.querySelectorAll('[data-opt-num]').forEach((i) => st[i.dataset.optNum] = +i.value); root.querySelectorAll('[data-ph]').forEach((i) => st.phases[+i.dataset.ph][i.dataset.k] = i.value); root.querySelectorAll('[data-scale]').forEach((i) => { const s = SCALE[+i.dataset.scale - 1]; s[i.dataset.k] = i.value; }); save(); log('Updated cycle settings'); NS.toast('Settings saved', { desc: `Goals ${st.weights.goals}% · competencies ${st.weights.comps}%` }); };
    },
  };

  /* PEOPLE PROFILE ----------------------------------------------------- */
  R['/people/:id'] = {
    title: (c) => (D.byId(c.params.id) || {}).name || 'Person', nav: 'people',
    crumbs: (c) => [{ label: 'People' }, { label: (D.byId(c.params.id) || {}).name || '' }],
    render: (c) => { const p = D.byId(c.params.id); if (!p) return NS.empty({ title: 'Not found' }); const pid = p.id, rv = S.reviews[pid], goals = S.goals[pid], mgr = D.byId(p.managerId); const fb = fbFor(pid); const me = meFor(c.persona);
      return html`<div class="ns-card mb-4"><div class="ns-card-body flex gap-5 items-center wrap">${raw(NS.avatar(p, { size: 'xxl' }))}<div class="grow min-w-0"><div class="flex items-center gap-2 wrap"><h1 style="font-size:24px">${NS.esc(p.name)}</h1>${raw(statusBadge(statusOf(pid)))}</div><div class="md muted mt-1">${NS.esc(p.title)} · ${D.levelLabel(p.level)} · ${NS.esc(p.team)}</div><div class="flex gap-4 wrap mt-3 sm"><span class="flex items-center gap-2">${raw(ic('map-pin', { size: 14 }))}${p.city} · ${D.regions[p.region]}</span><span class="flex items-center gap-2">${raw(ic('calendar', { size: 14 }))}Joined ${F.date(p.hireDate, 'my')} · ${F.tenure(p.tenure)}</span>${mgr ? raw(`<span class="flex items-center gap-2">${ic('user', { size: 14 })}Reports to <a href="${NS.link('/people/' + mgr.id)}">${NS.esc(mgr.name)}</a></span>`) : ''}<span class="flex items-center gap-2">${raw(ic('mail', { size: 14 }))}${p.email}</span></div></div><div class="flex gap-2 wrap">${c.persona.id !== 'employee' && STATUS[statusOf(pid)].step >= 2 && p.managerId === me.id ? raw(`<a class="ns-btn primary" href="${NS.link('/review/' + pid)}">${ic('clipboard-check')}Open review</a>`) : ''}${raw(`<a class="ns-btn secondary" href="../competency-portal/index.html#/level/${p.level}" target="_blank" rel="noopener">${ic('layers')}Level expectations</a>`)}</div></div></div>
        <div class="ns-grid c3">
          ${raw(NS.card({ title: 'Rating history', sub: 'FY23 · FY24 · FY25', body: `<div class="flex items-end gap-4"><div class="ratings-hist grow">${p.ratings.map((r) => `<i style="height:${r ? r * 8 : 2}px;opacity:${r ? 1 : .3}" data-tip="${r ? SCALE[r - 1].label : 'No rating'}"></i>`).join('')}</div><div class="right"><div class="ns-hero-num" style="font-size:36px">${p.rating || '—'}</div><div class="xs muted">${p.rating ? SCALE[p.rating - 1].label : 'Not yet rated'}</div></div></div><div class="xs muted mt-3">Trend: ${p.trend === 'up' ? '↑ improving' : p.trend === 'down' ? '↓ declining' : '→ steady'} · time in level ${p.timeInLevel} yrs</div>` }))}
          ${raw(NS.card({ title: 'FY26 scorecard', sub: 'Provisional', body: (() => { const os = overall(pid, 'self'), om = overall(pid, 'manager'); return `<div class="grid gap-2 sm"><div class="flex justify-between"><span class="muted">Self overall</span><b>${os != null ? os.toFixed(1) : '—'}</b></div><div class="flex justify-between"><span class="muted">Manager overall</span><b>${om != null ? om.toFixed(1) + ' · ' + labelFor(om) : '—'}</b></div><div class="flex justify-between"><span class="muted">Potential</span><b>${rv.manager.potential ? ['Low', 'Medium', 'High'][rv.manager.potential - 1] : '—'}</b></div><div class="flex justify-between"><span class="muted">Goal progress</span><b>${Math.round(U.avg(goals, 'progress'))}%</b></div></div>`; })() }))}
          ${raw(NS.card({ title: 'Competency profile', sub: 'Self assessment (FY26)', body: '<div id="profRadar"></div>' }))}
          <div class="span-2">${raw(NS.card({ title: 'Goals', sub: `${goals.length} goals · weighted`, bodyCls: 'flush', body: `<table class="ns-table"><thead><tr><th>Goal</th><th>Category</th><th class="num">Weight</th><th class="num">Progress</th><th>Status</th></tr></thead><tbody>${goals.map((g) => `<tr><td><b>${NS.esc(g.title)}</b></td><td><span class="ns-badge ${CATS[g.cat]} sq">${g.cat}</span></td><td class="num">${g.weight}%</td><td class="num">${g.progress}%</td><td>${P.goalStatusBadge(g)}</td></tr>`).join('')}</tbody></table>` }))}</div>
          ${raw(NS.card({ title: 'Peer feedback themes', sub: `${fb.received.length} responses`, body: fb.received.length ? `<div class="ns-chips">${U.uniq(fb.received.flatMap((f) => f.tags || [])).map((t) => `<span class="ns-tag">${NS.esc(t)}</span>`).join('')}</div><p class="sm ink2 mt-3">“${NS.esc(fb.received[0].strengths)}”</p>` : '<div class="sm muted">No peer feedback collected yet.</div>' }))}
        </div>`; },
    mounted: (c, root) => { const rv = S.reviews[c.params.id]; const el = root.querySelector('#profRadar'); if (el && rv) NS.chart.radar(el, { axes: COMPS.map((x) => x.name.split(' ')[0]), series: [{ name: 'Self', values: COMPS.map((x) => (rv.self.comps[x.id] || {}).rating || 0) }], max: 5, size: 260, legend: false }); },
  };

  /* ------------------------------------------------------------------ */
  /* 5. Boot                                                             */
  /* ------------------------------------------------------------------ */
  const store = NS.store('performance-nexus');
  const personas = [
    { ...D.personas.employee, note: 'Self review, goals, feedback' },
    { ...D.personas.manager, note: 'Team reviews & calibration' },
    { ...D.personas.hrbp, note: 'Cycle console & insights' },
  ];
  const selfSub = () => D.people.filter((p) => STATUS[statusOf(p.id)].step >= 2).length;
  NS.app({
    id: 'performance-nexus', name: 'Performance Nexus', sub: 'Northstar Labs', brand: 'indigo', version: '3.0',
    mark: ic('target', { size: 20 }),
    about: { tagline: 'Goals, reviews and calibration that people actually finish.', description: 'A performance-management system designed around the review cycle as it really happens: goals with weighted key results and check-ins, a self review that autosaves and drafts evidence from your own data, a manager review with a live scorecard and a language check, drag-and-drop calibration against a guideline distribution, and a cycle console for the People team.', highlights: [{ icon: 'target', title: 'Weighted goals & KRs', body: 'Categories, weights and check-ins that feed the scorecard.' }, { icon: 'sparkles', title: 'Evidence-based AI drafts', body: 'Drafts anchored to ratings, key results and check-in notes.' }, { icon: 'grid', title: 'Calibration 9-box', body: 'Drag to propose, compare against the guideline curve, lock.' }, { icon: 'shield-check', title: 'Language check', body: 'Flags vague, absolute and coded words in manager comments.' }] },
    personas, defaultPersona: 'employee',
    nav: (persona) => persona.id === 'employee' ? [{ group: 'My cycle', items: [{ id: 'home', label: 'Home', icon: 'home' }, { id: 'goals', label: 'My goals', icon: 'target' }, { id: 'review', label: 'Self review', icon: 'clipboard-check', badge: (() => { const cp = completion('NS-1207'); return cp.pct < 100 ? `${cp.done}/${cp.total}` : ''; })() }, { id: 'feedback', label: 'Feedback', icon: 'message-square', badge: fbFor('NS-1207').toGive.filter((x) => x.status === 'pending').length || '' }] }, { group: 'Me', items: [{ id: 'people', label: 'My profile', icon: 'id-card', route: '/people/NS-1207' }] }]
      : persona.id === 'manager' ? [{ group: 'Team', items: [{ id: 'home', label: 'Home', icon: 'home' }, { id: 'team', label: 'Team reviews', icon: 'clipboard-list', badge: teamOf('NS-1180').filter((p) => statusOf(p.id) === 'self_submitted' || statusOf(p.id) === 'manager_in_progress').length || '' }, { id: 'goals', label: 'Team goals', icon: 'target' }, { id: 'calibration', label: 'Calibration', icon: 'grid' }, { id: 'feedback', label: 'Feedback', icon: 'message-square' }] }, { group: 'Analytics', items: [{ id: 'insights', label: 'Insights', icon: 'bar-chart' }] }]
      : [{ group: 'Cycle operations', items: [{ id: 'home', label: 'Cycle health', icon: 'home' }, { id: 'console', label: 'Cycle console', icon: 'table' }, { id: 'calibration', label: 'Calibration', icon: 'grid' }, { id: 'insights', label: 'Insights', icon: 'bar-chart' }] }, { group: 'Administration', items: [{ id: 'settings', label: 'Cycle settings', icon: 'settings' }] }],
    promo: (persona) => persona.id === 'employee' ? (() => { const cp = completion('NS-1207'); return cp.pct < 100 ? { title: 'Self review open', body: `${cp.done} of ${cp.total} sections complete · closes ${F.date(D.cycle.selfReviewCloses, 'short')}`, progress: cp.pct, cta: { label: 'Continue review', route: '/review' } } : null; })() : persona.id === 'manager' ? { title: 'Reviews waiting', body: `${teamOf('NS-1180').filter((p) => statusOf(p.id) === 'self_submitted').length} self reviews are ready for you.`, cta: { label: 'Open queue', route: '/team' } } : { title: 'Cycle health', body: `${Math.round(U.pctOf(selfSub(), D.people.length))}% of self reviews submitted.`, progress: Math.round(U.pctOf(selfSub(), D.people.length)), cta: { label: 'Console', route: '/console' } },
    notifications: [{ icon: 'clipboard-check', title: 'Self review closes in 8 days', body: 'Finish your remaining sections before Oct 2, 18:00 IST.', time: 'Today', route: '/review' }, { icon: 'message-square', title: 'New peer feedback received', body: '“The clearest ADR I read this year…”', time: 'Yesterday', route: '/feedback' }, { icon: 'target', title: 'Check-in reminder', body: 'No update on “Own the Q3 on-call reliability review” for 9 days.', time: '2 days ago', route: '/goals' }, { icon: 'calendar', title: 'Calibration roundtable scheduled', body: 'Platform org · Oct 22, 14:00 CET.', time: '3 days ago', route: '/calibration' }],
    routes: R, default: '/home',
    commands: (persona) => [{ label: 'New goal', icon: 'plus', group: 'Actions', run: () => NS.go('/goals') }, { label: 'Request peer feedback', icon: 'user-plus', group: 'Actions', run: () => NS.go('/feedback') }, ...(persona.id !== 'employee' ? [{ label: 'Export cycle status (CSV)', icon: 'download', group: 'Actions', run: () => NS.go('/console') }, { label: 'Nudge everyone not started', icon: 'megaphone', group: 'Actions', run: () => NS.go('/team') }] : [])],
    search: (q) => (q.length < 2 ? [] : D.people.filter((p) => p.name.toLowerCase().includes(q.toLowerCase())).slice(0, 6).map((p) => ({ group: 'People', label: p.name, hint: p.title, avatar: NS.avatar(p, { size: 'xs' }), run: () => NS.go('/people/' + p.id) }))),
    onReset: () => store.clear(),
  });
})();
</script>
</body>
</html>

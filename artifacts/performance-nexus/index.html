      const SCOPES = [['Sales — all teams', (p) => p.dept === 'Sales'], ['Customer Success — Technical Support', (p) => p.dept === 'Customer Success' && p.team === 'Technical Support'], ['Everyone', () => true]];
      const openExtend = () => NS.modal({ title: 'Extend self-review deadline', sub: `Currently closes ${F.date(D.cycle.selfReviewCloses)}, 18:00. Applies to the selected scope only; their managers are notified automatically.`, body: `<div class="grid gap-4"><label class="ns-field"><span class="ns-label">Scope</span><select class="ns-select" id="scope">${SCOPES.map(([l]) => `<option value="${l}">${l}</option>`).join('')}</select></label><div class="pn-impact" id="impact" aria-live="polite"></div><div class="ns-form-grid"><label class="ns-field"><span class="ns-label">New deadline</span><input class="ns-input" type="date" id="dl" value="2026-10-06" min="${D.cycle.selfReviewCloses.slice(0, 10)}"></label><div class="ns-field"><span class="ns-label">Knock-on</span><p class="sm muted" id="knock" style="margin-top:6px"></p></div></div><label class="ns-field"><span class="ns-label">Reason <span class="opt">shown to managers</span></span><input class="ns-input" id="why" value="Quarter-end close — field teams travelling"></label></div>`, actions: [{ label: 'Cancel' }, { label: 'Extend', cls: 'primary', onClick: (m) => { log(`Extended deadline for ${m.el.querySelector('#scope').value} to ${m.el.querySelector('#dl').value}`); NS.toast('Deadline extended', { desc: `${m.el.querySelector('#scope').value} · ${F.date(m.el.querySelector('#dl').value)}` }); } }], mounted: (body) => { const sc = body.querySelector('#scope'), dl = body.querySelector('#dl'); const upd = () => { const f = SCOPES.find((x) => x[0] === sc.value)[1]; const ps = all.filter(f); const open = ps.filter((p) => STATUS[statusOf(p.id)].step < 2).length; const mgrs = U.uniq(ps.map((p) => p.managerId)).length; body.querySelector('#impact').innerHTML = `<div><b>${F.int(ps.length)}</b><span>people in scope</span></div><div><b>${F.int(open)}</b><span>not yet submitted</span></div><div><b>${F.int(mgrs)}</b><span>managers notified</span></div>`; const mr = S.settings.phases.find((p) => p.id === 'manager'); const gap = mr ? Math.round((new Date(mr.start) - new Date(dl.value)) / 86400000) : null; body.querySelector('#knock').textContent = !dl.value ? 'Pick a date.' : gap == null ? '' : gap > 0 ? `${gap} day${gap === 1 ? '' : 's'} before manager review opens (${F.date(mr.start, 'short')}).` : `Overlaps manager review, which opens ${F.date(mr.start, 'short')}. Managers will rate on partial input.`; }; sc.onchange = upd; dl.oninput = upd; upd(); } });
      root.querySelector('[data-extend]').onclick = openExtend;
      if (c.query.extend) { history.replaceState(null, '', NS.link('/console')); openExtend(); }
    },
  };

  /* SETTINGS (HRBP) --------------------------------------------------- */
  R['/settings'] = {
    title: 'Cycle settings', personas: ['hrbp'],
    render: (c) => { const st = S.settings; return html`${raw(NS.pageHead({ eyebrow: `${D.cycle.name} · Administration`, title: 'Cycle settings', sub: 'Configuration for the FY26 cycle. Changes apply to reviews that have not been submitted yet.' }))}
      <div class="ns-grid main-side">
        <form class="ns-card" id="settingsForm" onsubmit="return false">
          <div class="settings-sec"><div><h3>Scoring weights</h3><p>How goals and competencies combine into the overall score.</p></div><div class="grid gap-3"><label class="ns-field"><span class="ns-label">Goals <b id="wg" class="tnum">${st.weights.goals}%</b> · competencies <b id="wc" class="tnum">${st.weights.comps}%</b></span><input type="range" class="ns-range" min="30" max="80" step="5" value="${st.weights.goals}" id="wslider" style="--p:${((st.weights.goals - 30) / 50) * 100}%" aria-label="Goals weight"><span class="ns-help">Between 30% and 80% in steps of 5. Competencies take the remainder.</span></label><div class="ns-alert info">${ic('info')}<div><b>Example</b><p id="wex">Goals 4.2 and competencies 3.6 → overall ${((4.2 * st.weights.goals + 3.6 * st.weights.comps) / 100).toFixed(2)}</p></div></div></div></div>
          <div class="settings-sec"><div><h3>Feedback and ratings</h3><p>Peer anonymity, N/A handling and the threshold for a peer summary.</p></div><div class="grid gap-4"><label class="ns-switch"><input type="checkbox" data-opt="anonymousPeer" ${st.anonymousPeer ? 'checked' : ''}><i></i><span><b class="sm">Anonymous peer feedback</b><div class="xs muted">Managers see themes, not names.</div></span></label><label class="ns-switch"><input type="checkbox" data-opt="allowNA" ${st.allowNA ? 'checked' : ''}><i></i><span><b class="sm">Allow “N/A” on competencies</b><div class="xs muted">Excluded from the competency average.</div></span></label><label class="ns-field" style="max-width:260px"><span class="ns-label">Minimum peer responses for a summary</span><input class="ns-input" type="number" min="1" max="6" value="${st.minPeer}" data-opt-num="minPeer" style="width:100px"><span class="ns-help">1 to 6. Fewer responses are shown individually.</span></label></div></div>
          <div class="settings-sec"><div><h3>Cycle phases</h3><p>Dates drive deadlines, nudges and what each persona can do.</p></div><div class="grid gap-2"><div class="phase-row head"><span>Phase</span><span>Start</span><span>End</span></div>${st.phases.map((p, i) => `<div class="phase-row"><span class="sm semibold">${p.label}</span><input class="ns-input sm" type="date" value="${p.start}" data-ph="${i}" data-k="start" aria-label="${p.label} start"><input class="ns-input sm" type="date" value="${p.end}" data-ph="${i}" data-k="end" aria-label="${p.label} end"></div>`).join('')}</div></div>
          <div class="settings-sec"><div><h3>Rating scale</h3><p>Labels and descriptors shown to everyone in the cycle.</p></div><div class="grid">${SCALE.map((s) => `<div class="scale-row"><span class="pn-rate r${s.v} bare" style="margin-top:5px"><i>${s.v}</i></span><div class="grid gap-1"><input class="ns-input sm" value="${NS.esc(s.label)}" data-scale="${s.v}" data-k="label" aria-label="Label for rating ${s.v}"><textarea class="ns-textarea" style="min-height:52px;font-size:12.5px" data-scale="${s.v}" data-k="desc" aria-label="Description for rating ${s.v}">${NS.esc(s.desc)}</textarea></div></div>`).join('')}</div></div>
          <div class="form-foot"><span class="grow">Saved settings apply to unsubmitted reviews.</span><button type="button" class="ns-btn secondary" data-discard>Discard changes</button><button type="button" class="ns-btn primary" data-save-settings>${ic('save')}Save changes</button></div>
        </form>
        <div class="grid gap-4">
          ${raw(NS.card({ title: 'Competency library', sub: `${COMPS.length} competencies · shared with the Competency Portal`, body: `<div class="grid gap-3">${COMPS.map((cp) => `<div class="flex gap-3 items-start"><span class="ns-icon-box sm">${ic(cp.icon)}</span><div class="min-w-0"><b class="sm">${cp.name}</b><div class="xs muted">${cp.desc}</div></div></div>`).join('')}</div>` }))}
          ${raw(NS.card({ title: 'Activity log', sub: 'Recent actions in this prototype', body: S.activity.length ? `<div class="ns-timeline">${S.activity.slice(0, 10).map((a) => `<div class="ns-tl-item" style="padding-bottom:12px"><span class="pt"></span><div><div class="sm ink2">${NS.esc(a.msg)}</div><div class="xs faint">${F.rel(a.t)}</div></div></div>`).join('')}</div>` : '<div class="sm muted">No activity yet.</div>' }))}
        </div>
      </div>`; },
    mounted: (c, root) => {
      const st = S.settings; const sl = root.querySelector('#wslider');
      sl.oninput = () => { const g = +sl.value; root.querySelector('#wg').textContent = g + '%'; root.querySelector('#wc').textContent = (100 - g) + '%'; sl.style.setProperty('--p', ((g - 30) / 50) * 100 + '%'); root.querySelector('#wex').textContent = `Goals 4.2 and competencies 3.6 → overall ${((4.2 * g + 3.6 * (100 - g)) / 100).toFixed(2)}`; };
      const dis = root.querySelector('[data-discard]'); if (dis) dis.onclick = () => { NS.refresh(); NS.toast('Changes discarded', { type: 'info' }); };
      root.querySelector('[data-save-settings]').onclick = () => { st.weights = { goals: +sl.value, comps: 100 - sl.value }; root.querySelectorAll('[data-opt]').forEach((i) => st[i.dataset.opt] = i.checked); root.querySelectorAll('[data-opt-num]').forEach((i) => st[i.dataset.optNum] = +i.value); root.querySelectorAll('[data-ph]').forEach((i) => st.phases[+i.dataset.ph][i.dataset.k] = i.value); root.querySelectorAll('[data-scale]').forEach((i) => { const s = SCALE[+i.dataset.scale - 1]; s[i.dataset.k] = i.value; }); save(); log('Updated cycle settings'); NS.toast('Settings saved', { desc: `Goals ${st.weights.goals}% · competencies ${st.weights.comps}%` }); NS.refresh(); };
    },
  };

  /* PEOPLE PROFILE ----------------------------------------------------- */
  R['/people/:id'] = {
    title: (c) => (D.byId(c.params.id) || {}).name || 'Person', nav: 'people',
    crumbs: (c) => [{ label: 'People' }, { label: (D.byId(c.params.id) || {}).name || 'Not found' }],
    render: (c) => { const p = D.byId(c.params.id); if (!p) return `<div class="ns-card">${NS.empty({ icon: 'user', title: 'Person not found', body: 'This profile does not exist in the FY26 cycle.' })}</div>`; const pid = p.id, rv = S.reviews[pid], goals = S.goals[pid], mgr = D.byId(p.managerId); const fb = fbFor(pid); const me = meFor(c.persona);
      const st = statusOf(pid), step = STATUS[st].step, ph = S.settings.phases;
      const os = overall(pid, 'self'), om = overall(pid, 'manager');
      const lastCheck = goals.flatMap((g) => g.checkins.map((x) => ({ ...x, g }))).sort((x, y) => (y.date > x.date ? 1 : -1))[0];
      const tl = [
        { t: 'Goals agreed', s: `${goals.length} goals · weights total ${U.sum(goals, 'weight')}%`, d: ph[0].end, st: 'done' },
        { t: 'Mid-year check-in', s: 'Progress reviewed with manager', d: ph[1].end, st: 'done' },
        ...(lastCheck ? [{ t: 'Latest goal check-in', s: lastCheck.g.title, d: lastCheck.date, st: 'done' }] : []),
        step >= 2 && rv.submittedAt ? { t: 'Self review submitted', s: os != null ? `Self score ${os.toFixed(1)}` : '', d: rv.submittedAt, st: 'done' } : { t: STATUS[st].label, s: `${completion(pid).done} of ${completion(pid).total} sections · due ${F.date(D.cycle.selfReviewCloses, 'short')}`, d: null, st: step === 1 ? 'now' : '' },
        rv.manager.submittedAt ? { t: 'Manager review submitted', s: om != null ? `Overall ${om.toFixed(1)} · ${labelFor(om)}` : '', d: rv.manager.submittedAt, st: 'done' } : { t: 'Manager review', s: step === 3 ? 'In progress' : `${F.date(ph[3].start, 'short')} – ${F.date(ph[3].end, 'short')}`, d: null, st: step === 3 ? 'now' : '' },
        st === 'calibrated' ? { t: 'Calibrated', s: rv.calibrated ? `Final rating ${rv.calibrated.rating.toFixed(1)}` : '', d: null, st: 'done' } : { t: 'Calibration', s: `${F.date(ph[4].start, 'short')} – ${F.date(ph[4].end, 'short')}`, d: null, st: '' },
      ];
      const canReview = c.persona.id !== 'employee' && step >= 2 && p.managerId === me.id;
      return html`${raw(NS.pageHead({ eyebrow: `People · ${NS.esc(p.dept)}`, title: `<span class="head-person">${NS.avatar(p, { size: 'lg' })}<span class="min-w-0">${NS.esc(p.name)}</span></span>`, sub: `${NS.esc(p.title)} · ${D.levelLabel(p.level)} · ${NS.esc(p.team)}`, actions: `${statusBadge(st)}<a class="ns-btn secondary" href="../competency-portal/index.html#/level/${p.level}" target="_blank" rel="noopener">${ic('layers')}Level expectations</a>${canReview ? `<a class="ns-btn primary" href="${NS.link('/review/' + pid)}">${ic('clipboard-check')}Open review</a>` : ''}` }))}
        <div class="ns-grid main-side">
          <div class="grid gap-4">
            <div class="ns-stats stats-4">
              ${raw(NS.stat({ label: 'Self overall', value: os != null ? os.toFixed(1) : '—', unit: os != null ? '/ 5' : '', sub: os != null ? labelFor(os) : 'Not yet rated' }))}
              ${raw(NS.stat({ label: 'Manager overall', value: om != null ? om.toFixed(1) : '—', unit: om != null ? '/ 5' : '', sub: om != null ? `${labelFor(om)} · provisional` : 'Not yet rated' }))}
              ${raw(NS.stat({ label: 'Potential', value: rv.manager.potential ? ['Low', 'Medium', 'High'][rv.manager.potential - 1] : '—', sub: 'Manager’s readiness call' }))}
              ${raw(NS.stat({ label: 'Goal progress', value: Math.round(U.avg(goals, 'progress')), unit: '%', sub: `${goals.filter((g) => g.status === 'risk' || g.status === 'behind').length} at risk or behind` }))}
            </div>
            ${raw(NS.card({ title: 'Goals', sub: `${goals.length} goals · FY26`, bodyCls: 'flush mt-3', body: `<div class="ns-table-wrap" style="border-top:1px solid var(--line)"><table class="ns-table"><thead><tr><th>Goal</th><th>Category</th><th class="num">Weight</th><th>Status</th><th class="num">Progress</th></tr></thead><tbody>${goals.map((g) => `<tr><td><b>${NS.esc(g.title)}</b><div class="xs muted mt-1">Due ${F.date(g.due, 'short')}</div></td><td><span class="ns-badge ${CATS[g.cat]} sq">${g.cat}</span></td><td class="num">${g.weight}%</td><td>${P.goalStatusBadge(g)}</td><td class="num"><div class="flex items-center gap-2 justify-end"><div style="width:72px" class="hide-sm">${P.paceBar(g)}</div><b>${g.progress}%</b></div></td></tr>`).join('')}</tbody></table></div>` }))}
            <div class="ns-grid c2">
              ${raw(NS.card({ title: 'Rating history', sub: `Trend: ${p.trend === 'up' ? 'improving' : p.trend === 'down' ? 'declining' : 'steady'} · ${p.timeInLevel} yrs in level`, body: `<div class="rating-hist">${p.ratings.map((r, i) => `<div><span class="yr">FY${23 + i}</span><span class="v">${r || '—'}</span>${r ? `<span style="justify-self:start">${rateTag(r)}</span>` : '<span class="xs faint">No rating</span>'}</div>`).join('')}</div>` }))}
              ${raw(NS.card({ title: 'Competency profile', sub: 'Self assessment · FY26', body: '<div id="profRadar"></div>' }))}
            </div>
          </div>
          <div class="grid gap-4">
            ${raw(NS.card({ title: 'Details', body: `<dl class="meta-dl"><dt>Employee ID</dt><dd class="mono">${p.id}</dd><dt>Location</dt><dd>${p.city} · ${D.regions[p.region]}</dd><dt>Joined</dt><dd>${F.date(p.hireDate, 'my')} · ${F.tenure(p.tenure)}</dd><dt>Reports to</dt><dd>${mgr ? `<a href="${NS.link('/people/' + mgr.id)}">${NS.esc(mgr.name)}</a>` : '—'}</dd><dt>Email</dt><dd>${p.email.replace('@', '@<wbr>')}</dd><dt>Level</dt><dd>${D.levelLabel(p.level)}</dd></dl>` }))}
            ${raw(NS.card({ title: 'Review activity', sub: D.cycle.name, body: `<div class="ns-timeline">${tl.map((x) => `<div class="ns-tl-item ${x.st}"><span class="pt">${x.st === 'done' ? ic('check') : x.st === 'now' ? ic('circle-dot') : ''}</span><div class="min-w-0"><div class="ttl flex justify-between gap-2"><span>${x.t}</span>${x.d ? `<span class="xs faint nowrap" style="font-weight:500">${F.date(x.d, 'short')}</span>` : ''}</div>${x.s ? `<div class="sub">${NS.esc(x.s)}</div>` : ''}</div></div>`).join('')}</div>` }))}
            ${raw(NS.card({ title: 'Peer feedback themes', sub: `${fb.received.length} response${fb.received.length === 1 ? '' : 's'}`, body: fb.received.length ? `<div class="ns-chips">${U.uniq(fb.received.flatMap((f) => f.tags || [])).map((t) => `<span class="ns-tag">${NS.esc(t)}</span>`).join('')}</div><p class="pn-quote-sm mt-3">“${NS.esc(fb.received[0].strengths)}”</p>` : '<div class="sm muted">No peer feedback collected yet.</div>' }))}
          </div>
        </div>`; },
    mounted: (c, root) => { const rv = S.reviews[c.params.id]; const el = root.querySelector('#profRadar'); if (el && rv) NS.chart.radar(el, { axes: COMPS.map((x) => x.name.split(' ')[0]), series: [{ name: 'Self', values: COMPS.map((x) => (rv.self.comps[x.id] || {}).rating || 0) }], max: 5, size: 260, legend: false }); },
  };

  /* ------------------------------------------------------------------ */
  /* 5. Boot                                                             */
  /* ------------------------------------------------------------------ */
  const store = NS.store('performance-nexus');
  const personas = [
    { ...D.personas.employee, note: 'Self review, goals, feedback' },
    { ...D.personas.manager, note: 'Team reviews & calibration' },
    { ...D.personas.hrbp, note: 'Cycle console & insights' },
  ];
  const participants = () => D.people.filter((p) => p.level !== 'E2');
  const selfSub = () => participants().filter((p) => STATUS[statusOf(p.id)].step >= 2).length;
  // Deep link to a persona: index.html?as=manager#/team (used for demos and review links).
  try { const as = new URLSearchParams(location.search).get('as'); if (as && personas.some((x) => x.id === as)) store.set('persona', as); } catch (e) { }
  const CREATE = {
    employee: { label: 'Propose a new goal', createLabel: 'New goal', run: () => NS.go('/goals', { new: 1 }) },
    manager: { label: 'Request peer feedback', createLabel: 'Request feedback', run: () => NS.go('/feedback', { request: 1 }) },
    hrbp: { label: 'Extend a review deadline', createLabel: 'Extend deadline', run: () => NS.go('/console', { extend: 1 }) },
  };
  NS.app({
    id: 'performance-nexus', name: 'Performance Nexus', sub: 'Northstar Labs', brand: 'indigo', version: '5.0', category: 'The review room',
    get create() { return CREATE[(NS.persona || {}).id] || null; },
    mark: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9.2" cy="12" r="5.6"/><circle cx="14.8" cy="12" r="5.6" stroke-opacity=".6"/></svg>',
    about: { tagline: 'Goals, reviews and calibration that people actually finish.', description: 'A performance-management system designed around the review cycle as it really happens: goals with weighted key results and check-ins, a self review that autosaves and drafts evidence from your own data, a manager review with a live scorecard and a language check, drag-and-drop calibration against a guideline distribution, and a cycle console for the People team.', highlights: [{ icon: 'target', title: 'Weighted goals & KRs', body: 'Categories, weights and check-ins that feed the scorecard.' }, { icon: 'sparkles', title: 'Evidence-based AI drafts', body: 'Drafts anchored to ratings, key results and check-in notes.' }, { icon: 'grid', title: 'Calibration 9-box', body: 'Drag to propose, compare against the guideline curve, lock.' }, { icon: 'shield-check', title: 'Language check', body: 'Flags vague, absolute and coded words in manager comments.' }] },
    personas, defaultPersona: 'employee',
    nav: (persona) => persona.id === 'employee' ? [{ group: 'My cycle', items: [{ id: 'home', label: 'Home', icon: 'home' }, { id: 'goals', label: 'My goals', icon: 'target' }, { id: 'review', label: 'Self review', icon: 'clipboard-check', badge: (() => { const cp = completion('NS-1207'); return cp.pct < 100 ? `${cp.done}/${cp.total}` : ''; })() }, { id: 'feedback', label: 'Feedback', icon: 'message-square', badge: fbFor('NS-1207').toGive.filter((x) => x.status === 'pending').length || '' }] }, { group: 'Me', items: [{ id: 'people', label: 'My profile', icon: 'id-card', route: '/people/NS-1207' }] }]
      : persona.id === 'manager' ? [{ group: 'Team', items: [{ id: 'home', label: 'Home', icon: 'home' }, { id: 'team', label: 'Team reviews', icon: 'clipboard-list', badge: teamOf('NS-1180').filter((p) => statusOf(p.id) === 'self_submitted' || statusOf(p.id) === 'manager_in_progress').length || '' }, { id: 'goals', label: 'Team goals', icon: 'target' }, { id: 'calibration', label: 'Calibration', icon: 'grid' }, { id: 'feedback', label: 'Feedback', icon: 'message-square' }] }, { group: 'Analytics', items: [{ id: 'insights', label: 'Insights', icon: 'bar-chart' }] }]
      : [{ group: 'Cycle operations', items: [{ id: 'home', label: 'Cycle health', icon: 'home' }, { id: 'console', label: 'Cycle console', icon: 'table' }, { id: 'calibration', label: 'Calibration', icon: 'grid' }, { id: 'insights', label: 'Insights', icon: 'bar-chart' }] }, { group: 'Administration', items: [{ id: 'settings', label: 'Cycle settings', icon: 'settings' }] }],
    promo: (persona) => persona.id === 'employee' ? (() => { const cp = completion('NS-1207'); return cp.pct < 100 ? { title: 'Self review open', body: `${cp.done} of ${cp.total} sections complete · closes ${F.date(D.cycle.selfReviewCloses, 'short')}`, progress: cp.pct, action: { label: 'Continue review', route: '/review' } } : null; })() : persona.id === 'manager' ? { title: 'Reviews waiting', body: `${teamOf('NS-1180').filter((p) => statusOf(p.id) === 'self_submitted').length} self reviews are ready for you.`, action: { label: 'Open queue', route: '/team' } } : { title: 'Cycle health', body: `${Math.round(U.pctOf(selfSub(), participants().length))}% of self reviews submitted.`, progress: Math.round(U.pctOf(selfSub(), participants().length)), action: { label: 'Open console', route: '/console' } },
    notifications: [{ icon: 'clipboard-check', title: 'Self review closes in 8 days', body: 'Finish your remaining sections before 2 Oct, 18:00 IST.', time: 'Today', route: '/review' }, { icon: 'message-square', title: 'New peer feedback received', body: '“The clearest ADR I read this year…”', time: 'Yesterday', route: '/feedback' }, { icon: 'target', title: 'Check-in reminder', body: 'No update on “Own the Q3 on-call reliability review” for 9 days.', time: '2 days ago', route: '/goals' }, { icon: 'calendar', title: 'Calibration roundtable scheduled', body: 'Platform org · 22 Oct, 14:00 CET.', time: '3 days ago', route: '/calibration' }],
    routes: R, default: '/home',
    commands: (persona) => [{ label: 'New goal', icon: 'plus', group: 'Actions', run: () => NS.go('/goals', persona.id === 'employee' ? { new: 1 } : undefined) }, { label: 'Request peer feedback', icon: 'user-plus', group: 'Actions', run: () => NS.go('/feedback', persona.id !== 'hrbp' ? { request: 1 } : undefined) }, ...(persona.id !== 'employee' ? [{ label: 'Export cycle status (CSV)', icon: 'download', group: 'Actions', run: () => NS.go('/console') }, { label: 'Nudge everyone not started', icon: 'megaphone', group: 'Actions', run: () => NS.go('/team') }] : [])],
    search: (q) => (q.length < 2 ? [] : D.people.filter((p) => p.name.toLowerCase().includes(q.toLowerCase())).slice(0, 6).map((p) => ({ group: 'People', label: p.name, hint: p.title, avatar: NS.avatar(p, { size: 'xs' }), run: () => NS.go('/people/' + p.id) }))),
    onReset: () => store.clear(),
  });
})();
</script>
</body>
</html>

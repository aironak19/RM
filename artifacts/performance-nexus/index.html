<!doctype html>
<html lang="en" data-brand="indigo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Performance Nexus · Northstar Labs</title>
<meta name="description" content="Performance Nexus — goals, self review, manager review, calibration and cycle operations for Northstar Labs. Concept prototype with illustrative data, designed by Ronak Mehta.">
<meta name="theme-color" content="#4338CA">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%234338CA'/%3E%3Ccircle cx='19' cy='24' r='10' fill='none' stroke='%23fff' stroke-width='3.4'/%3E%3Ccircle cx='29' cy='24' r='10' fill='none' stroke='%23fff' stroke-width='3.4' stroke-opacity='.62'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Inter:opsz,wght@14..32,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400..500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/ns.css">
<script src="../shared/ns.js"></script>
<script src="../shared/ns-data.js"></script>
<style>
  /* Performance Nexus · app layer on Northstar v5. Tokens only; no hard-coded colours. */
  .goal-card{display:grid;gap:12px}
  .goal-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
  .goal-title{font-weight:600;font-size:14.5px;line-height:1.35;color:var(--ink)}
  .goal-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
  .goal-meta svg{vertical-align:-2px}
  .goal-pct{font-size:18px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.2}
  .kr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:12.5px;padding:8px 0;border-top:1px solid var(--line-2)}
  .kr .ns-progress{grid-column:1/-1}
  .kr svg{vertical-align:-2px;color:var(--ink-4)}
  .rate-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .rate-desc{font-size:12.5px;color:var(--ink-3);flex:1;min-width:200px}
  .review-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
  .review-side{position:sticky;top:calc(var(--header-h) + var(--topbar-h) + 8px);display:grid;gap:16px}
  @media (max-width:1100px){.review-layout{grid-template-columns:minmax(0,1fr)}.review-side{position:static}}
  .score-row{display:grid;grid-template-columns:minmax(0,1fr) 56px 64px;gap:8px 12px;align-items:center;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line-2)}
  .score-row:last-of-type{border-bottom:0}
  .score-row b{font-variant-numeric:tabular-nums;text-align:right}
  .score-head{font-size:12px;font-weight:600;color:var(--ink-3);padding-top:0}
  .score-head span{text-align:right}.score-head span:first-child{text-align:left}
  .self-quote{font-size:13px;line-height:1.55;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line-2);border-left:3px solid var(--line-strong);padding:10px 12px;border-radius:var(--r-sm)}
  .wizard-nav{display:grid;gap:2px}
  .wizard-nav button{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);text-align:left;font-size:13px;color:var(--ink-2);width:100%;overflow:hidden;min-width:0}
  .wizard-nav button .truncate{flex:1;min-width:0}
  .wizard-nav button:hover{background:var(--surface-3)}
  .wizard-nav button[aria-current="true"]{background:var(--np-soft);color:var(--np-text);font-weight:600}
  .wizard-nav .st{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-strong);font-size:10.5px;font-weight:600;flex:none;color:var(--ink-3);background:var(--surface)}
  .wizard-nav .st.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
  .wizard-nav .st svg{width:11px;height:11px}
  .savebar{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
  .savebar .grow{text-align:center}
  .dist-bars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end}
  .dist-bars .b{display:grid;align-content:end;justify-items:center;gap:4px;height:100%}
  .dist-bars .b i{width:100%;max-width:40px;border-radius:3px 3px 0 0;background:var(--brand);min-height:2px;transition:height .5s var(--ease)}
  .dist-bars .b span{font-size:11px;color:var(--ink-3);text-align:center}
  .dist-bars .b b{font-size:12.5px;font-variant-numeric:tabular-nums}
  .fb-item{display:grid;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
  .fb-item:last-child{border-bottom:0}
  .fb-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  @media (max-width:720px){.fb-cols{grid-template-columns:minmax(0,1fr)}}
  .fb-lbl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-3);margin-bottom:4px}
  .fb-lbl .ns-dot{width:7px;height:7px}
  .gap-flag{display:inline-flex;align-items:center;height:20px;font-size:11.5px;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:0 7px;border-radius:4px}
  .nb-scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
  .nb-scroll .pn-board{min-width:640px}
  .cal-person{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);font-size:12.5px;cursor:grab;box-shadow:var(--shadow-xs);min-width:0}
  .cal-person:hover{border-color:var(--line-strong)}
  .cal-person .ns-avatar{--sz:22px;font-size:9.5px}
  .cal-person b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .cal-person .sc{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:11.5px}
  .cal-person.dragging{opacity:.5}
  .cal-person.adj{border-color:var(--np-line);background:var(--np-soft)}
  .ns-ninebox .cell .lbl{display:flex;justify-content:space-between;gap:6px;text-transform:none;letter-spacing:0;font-size:12px;font-weight:600;color:var(--ink-2)}
  .ns-ninebox .cell .lbl span{color:var(--ink-4);font-weight:500;font-variant-numeric:tabular-nums}
  .ns-ninebox .ax{text-transform:none;letter-spacing:0;font-size:12px;font-weight:600}
  .guide-list{display:grid}
  .guide-list > div{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2);line-height:1.5}
  .guide-list > div:first-child{padding-top:0}
  .guide-list > div:last-child{border-bottom:0;padding-bottom:0}
  .guide-list svg{width:15px;height:15px;color:var(--warn);flex:none;margin-top:2px}
  .guide-list.ok svg{color:var(--ok)}
  .guide-list b{display:block;color:var(--ink);font-weight:600;font-size:13px}
  .task-list{display:grid}
  .task{display:flex;gap:12px;align-items:flex-start;padding:12px 20px;border-bottom:1px solid var(--line-2);transition:background var(--dur)}
  .task:last-child{border-bottom:0}
  .task:hover{background:var(--surface-2)}
  .task .ns-check{align-items:flex-start;flex:1;min-width:0}
  .task .ns-check input{margin-top:2px}
  .task .t{font-weight:600;font-size:13.5px;color:var(--ink);line-height:1.4}
  .task .s{font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .task.done .t{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-4)}
  .task.done .s,.task.done .ns-btn{opacity:.6}
  .goal-rows{display:grid}
  .goal-row{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:6px 16px;align-items:center;padding:11px 20px;border-bottom:1px solid var(--line-2);text-decoration:none!important;color:inherit;transition:background var(--dur)}
  .goal-row:last-child{border-bottom:0}
  .goal-row:hover{background:var(--surface-2)}
  .goal-row .nm{font-weight:600;font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .goal-row .mt{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-3);margin-top:3px;flex-wrap:wrap}
  .goal-row .pc{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);font-size:13px}
  @media (max-width:720px){.goal-row{grid-template-columns:minmax(0,1fr) 44px}.goal-row .bar{grid-column:1/-1;grid-row:2}}
  .person-goals .gl{display:grid;grid-template-columns:84px minmax(0,1fr) auto 120px 40px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px}
  .person-goals .gl:last-child{border-bottom:0}
  .person-goals .gl .pc{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
  @media (max-width:720px){.person-goals .gl{grid-template-columns:minmax(0,1fr) auto 40px}.person-goals .gl .cat,.person-goals .gl .bar{display:none}}
  .meta-dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 16px;font-size:13px;margin:0}
  .meta-dl dt{color:var(--ink-3)}
  .meta-dl dd{margin:0;color:var(--ink);font-weight:500;min-width:0;overflow-wrap:anywhere}
  .rating-hist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .rating-hist > div{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px;background:var(--surface-2)}
  .rating-hist .yr{font-size:12px;color:var(--ink-3);font-weight:500}
  .rating-hist .v{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.1}
  .settings-sec{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px 32px;padding:20px;border-bottom:1px solid var(--line-2)}
  .settings-sec:last-child{border-bottom:0}
  .settings-sec h3{font-size:14px;font-weight:600}
  .settings-sec > div:first-child p{font-size:12.5px;color:var(--ink-3);margin-top:4px;line-height:1.5}
  @media (max-width:900px){.settings-sec{grid-template-columns:minmax(0,1fr)}}
  .phase-row{display:grid;grid-template-columns:minmax(0,1fr) 150px 150px;gap:8px;align-items:center}
  .phase-row.head{font-size:12px;font-weight:600;color:var(--ink-3)}
  @media (max-width:560px){.phase-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.phase-row > :first-child{grid-column:1/-1}.phase-row.head{display:none}}
  .scale-row{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line-2)}
  .scale-row:first-child{padding-top:0}.scale-row:last-child{border-bottom:0;padding-bottom:0}
  .form-foot{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
  .form-foot .grow{font-size:12.5px;color:var(--ink-3)}
  .filter-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .filter-bar .ns-select{width:auto;min-width:0;max-width:200px}
  .filter-chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 4px 0 8px;border-radius:4px;background:var(--np-soft);color:var(--np-text);font-size:12px;font-weight:550;border:1px solid var(--np-line)}
  .filter-chip button{display:grid;place-items:center;width:18px;height:18px;border-radius:3px;color:inherit}
  .filter-chip button:hover{background:var(--np-soft-2)}
  .filter-chip svg{width:12px;height:12px}
  .bulk-bar{display:flex;align-items:center;gap:8px;margin-left:auto}
  @media (max-width:720px){.ns-toolbar .ns-input-wrap{min-width:0;flex:1 1 100%;max-width:none!important}.bulk-bar{margin-left:0}.filter-bar .ns-select{max-width:none;flex:1 1 140px}}
  .badge-status{white-space:nowrap}
  .ns-stats.stats-4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .ns-stats.stats-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  @media (max-width:720px){.ns-stats.stats-4,.ns-stats.stats-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .head-person{display:flex;align-items:center;gap:12px}

  /* ==================================================================
     PERFORMANCE NEXUS · "The review room"
     Identity layer on Northstar v5. Warm paper, indigo ink, a serif for
     the words people write about each other, Instrument Sans for structure.
     ================================================================== */
  :root{
    --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-display:"Instrument Sans","Inter",-apple-system,BlinkMacSystemFont,sans-serif;
    --font-serif:"Source Serif 4","Source Serif Pro",Georgia,"Times New Roman",serif;
    --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --bg:#FAF9F6;--bg-2:#F3F1EC;
    --surface:#FFFFFF;--surface-2:#FBFAF7;--surface-3:#F3F1EC;--surface-4:#E9E6DF;
    --line:#E6E2D9;--line-2:#EFECE6;--line-strong:#D3CDC1;
    --ink:#1B1A17;--ink-2:#3B3833;--ink-3:#66625A;--ink-4:#77726A;--ink-inverse:#FFFFFF;
    --np:#4338CA;--np-hover:#3730A3;--np-active:#312E81;--np-text:#4338CA;--np-soft:#EFEEFB;--np-soft-2:#E2E0F7;--np-line:#C5C1EF;
    --brand-500:#5A4FC2;--brand-600:#4338CA;--brand-700:#3730A3;
    --brand:#4338CA;--brand-hover:#3730A3;--brand-active:#312E81;--brand-text:#4338CA;--brand-soft:#EFEEFB;--brand-soft-2:#E2E0F7;--brand-line:#C5C1EF;
    --ok:#2F6B4A;--ok-bg:#EAF2EC;--ok-line:#C4DBCB;
    --warn:#8A5A12;--warn-bg:#F8F0E0;--warn-line:#E8D3AA;
    --bad:#A23B33;--bad-bg:#F8E9E6;--bad-line:#E9C3BD;
    --info:#3F5A8A;--info-bg:#ECF0F7;--info-line:#C9D4E8;
    --neutral:#5A564F;--neutral-bg:#F1EFEA;--neutral-line:#DDD8CE;
    --discovery:#4338CA;--discovery-bg:#F3F2FC;
    /* the rating scale: one calm sequential indigo ramp, 1 → 5 */
    --r1:#E4E2F3;--r2:#C4BFEA;--r3:#958DDB;--r4:#5F55C6;--r5:#3A2FA6;
    --r1-ink:#2A2660;--r2-ink:#2A2660;--r3-ink:#1E1A4F;--r4-ink:#FFFFFF;--r5-ink:#FFFFFF;
    --viz-1:#4338CA;--viz-2:#B4632A;--viz-3:#2F7D6D;--viz-4:#A9831C;--viz-5:#9C4F7C;--viz-6:#5E7F3A;--viz-7:#6E6A62;--viz-8:#B5443B;
    --viz-good:#3F8A5F;--viz-warn:#C99A2E;--viz-serious:#C46D3B;--viz-critical:#B5443B;
    --viz-seq-100:#ECEAF8;--viz-seq-200:#CFCAEE;--viz-seq-300:#A9A1E0;--viz-seq-400:#8076D0;--viz-seq-500:#5C51C1;--viz-seq-600:#4338A8;--viz-seq-700:#2C247E;
    --viz-div-neg:#B5443B;--viz-div-mid:#F1EFEA;--viz-div-pos:#4338CA;
    --viz-grid:#EFECE6;--viz-axis:#DCD6CB;
    --shadow-xs:0 1px 1px rgba(40,32,20,.04);
    --shadow-sm:0 1px 2px rgba(40,32,20,.06);
    --shadow:0 2px 6px -1px rgba(40,32,20,.08),0 1px 2px rgba(40,32,20,.04);
    --shadow-lg:0 14px 30px -8px rgba(40,32,20,.18),0 3px 8px -2px rgba(40,32,20,.06);
    --shadow-xl:0 28px 64px -12px rgba(40,32,20,.28),0 6px 14px -4px rgba(40,32,20,.08);
    --glass:rgba(250,249,246,.9);
    --r-xs:4px;--r-sm:6px;--r:8px;--r-lg:12px;--r-xl:16px;
    --sidebar-w:244px;--content-max:1320px;
    --focus:0 0 0 2px var(--surface),0 0 0 4px color-mix(in srgb,var(--np) 60%,transparent);
  }
  :root[data-theme="dark"]{
    --bg:#12110F;--bg-2:#171613;
    --surface:#1A1916;--surface-2:#1E1D1A;--surface-3:#252320;--surface-4:#2F2D29;
    --line:#2E2B27;--line-2:#24221F;--line-strong:#403C36;
    --ink:#EDEAE4;--ink-2:#C8C3B9;--ink-3:#9D978C;--ink-4:#8A847A;--ink-inverse:#12110F;
    --np:#6359D8;--np-hover:#7068E0;--np-active:#554BC9;--np-text:#ABA5F6;--np-soft:rgba(124,116,232,.14);--np-soft-2:rgba(124,116,232,.24);--np-line:rgba(124,116,232,.42);
    --brand:#7C74E8;--brand-hover:#928BF0;--brand-active:#6359D8;--brand-text:#ABA5F6;--brand-soft:rgba(124,116,232,.14);--brand-soft-2:rgba(124,116,232,.24);--brand-line:rgba(124,116,232,.4);
    --ok:#86C39D;--ok-bg:rgba(95,170,125,.13);--ok-line:rgba(95,170,125,.32);
    --warn:#D9B06A;--warn-bg:rgba(217,166,80,.12);--warn-line:rgba(217,166,80,.32);
    --bad:#E38C82;--bad-bg:rgba(220,110,95,.13);--bad-line:rgba(220,110,95,.34);
    --info:#A8BADC;--info-bg:rgba(140,165,215,.12);--info-line:rgba(140,165,215,.3);
    --neutral:#B5AFA4;--neutral-bg:rgba(181,175,164,.1);--neutral-line:rgba(181,175,164,.26);
    --discovery:#ABA5F6;--discovery-bg:rgba(124,116,232,.1);
    --r1:#2C2A40;--r2:#3D3874;--r3:#5A52A8;--r4:#8179DD;--r5:#B7B1F6;
    --r1-ink:#E2DFF8;--r2-ink:#EDEAE4;--r3-ink:#FFFFFF;--r4-ink:#14123A;--r5-ink:#14123A;
    --viz-1:#8B83EC;--viz-2:#D88A55;--viz-3:#5FB3A2;--viz-4:#D2AE4E;--viz-5:#CC7FAA;--viz-6:#8FB46A;--viz-7:#A39E94;--viz-8:#E07A70;
    --viz-good:#6DB88A;--viz-warn:#D9B06A;--viz-serious:#D88A55;--viz-critical:#E07A70;
    --viz-seq-100:#211F33;--viz-seq-200:#2E2A55;--viz-seq-300:#403A7E;--viz-seq-400:#564EA8;--viz-seq-500:#7068D2;--viz-seq-600:#9891EA;--viz-seq-700:#C5C0F7;
    --viz-div-neg:#E07A70;--viz-div-mid:#2A2824;--viz-div-pos:#8B83EC;
    --viz-grid:#24221F;--viz-axis:#3A3631;
    --glass:rgba(18,17,15,.9);
  }

  /* ---------- base type ---------- */
  body{background:var(--bg)}
  h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:-.012em}
  .serif{font-family:var(--font-serif)}
  ::selection{background:color-mix(in srgb,var(--np) 20%,transparent)}

  /* ---------- shell ---------- */
  .ns-gh{background:var(--bg);border-bottom-color:var(--line)}
  .ns-gh-product .ns-brand-name{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:-.01em}
  .ns-brand-mark{background:var(--np);box-shadow:none;border-radius:7px}
  :root[data-theme="dark"] .ns-brand-mark{background:#4F45C9}
  .ns-search-btn{background:var(--surface);border-color:var(--line)}
  .ns-search-btn:hover{border-color:var(--line-strong)}
  .ns-tenant{background:var(--surface)}
  .ns-sidebar{background:var(--bg);border-right-color:var(--line)}
  .ns-brand{padding:16px 16px 12px}
  .ns-brand-name{font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:-.012em}
  .ns-brand-sub{font-family:var(--font-serif);font-style:italic;font-size:13px;font-weight:400;color:var(--ink-3);margin-top:1px}
  .ns-persona-chip{background:var(--surface);border-color:var(--line);border-radius:8px;height:34px}
  .ns-nav{padding:6px 12px 12px}
  .ns-nav-group{font-family:var(--font-display);text-transform:none;letter-spacing:0;font-size:12px;font-weight:600;color:var(--ink-3);padding:18px 10px 6px}
  .ns-nav-item{height:33px;border-radius:7px;color:var(--ink-2);font-size:13.5px}
  .ns-nav-item svg{color:var(--ink-4)}
  .ns-nav-item:hover{background:var(--surface-3)}
  .ns-nav-item[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(40,32,20,.05)}
  .ns-nav-item[aria-current="page"] svg{color:var(--np-text)}
  .ns-nav-item[aria-current="page"]::before{display:none}
  .ns-nav-badge{background:transparent;border:1px solid var(--line-strong);color:var(--ink-3);height:19px}
  .ns-nav-item[aria-current="page"] .ns-nav-badge{background:var(--np-soft);border-color:var(--np-line);color:var(--np-text)}
  .ns-sidebar-foot{border-top-color:var(--line)}
  .ns-sidebar-promo{background:var(--surface);border-color:var(--line);border-radius:10px;padding:12px 12px 13px}
  .ns-sidebar-promo::before{content:"Due next";font-family:var(--font-display);text-transform:none;letter-spacing:0;font-size:11.5px;font-weight:600;color:var(--np-text)}
  .ns-sidebar-promo b{font-family:var(--font-display);font-size:14px}
  .ns-topbar{background:color-mix(in srgb,var(--bg) 90%,transparent)}
  .ns-content{max-width:var(--content-max)}

  /* ---------- page ---------- */
  .ns-page-head{border-bottom:0;padding:14px 0 4px;margin-bottom:22px;align-items:flex-end}
  .ns-page-head h1{font-family:var(--font-display);font-size:30px;line-height:36px;font-weight:600;letter-spacing:-.022em}
  .ns-eyebrow{font-family:var(--font-display);font-size:12.5px;font-weight:600;color:var(--np-text);margin-bottom:8px}
  .ns-page-head p{font-size:14.5px;line-height:1.55;color:var(--ink-3);max-width:68ch}
  .ns-section-title h2{font-family:var(--font-display);font-size:17px}
  .ns-card{border-radius:var(--r-lg);box-shadow:none;border-color:var(--line)}
  .ns-card-head{padding:18px 20px 0}
  .ns-card-head h3{font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:-.01em}
  .ns-card-foot{border-radius:0 0 var(--r-lg) var(--r-lg)}
  /* stats read as one ledger strip, not a row of tiles */
  .ns-stats{gap:0!important;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
  .ns-stats > .ns-stat{border:0;border-radius:0;box-shadow:-1px 0 0 var(--line-2),0 -1px 0 var(--line-2);background:transparent;padding:16px 20px 15px}
  .ns-stat .lbl{font-size:12.5px;color:var(--ink-3)}
  .ns-stat .val{font-family:var(--font-display);font-weight:600;font-size:30px;letter-spacing:-.02em}
  .ns-stat .ic{background:transparent;width:22px;height:22px}
  .ns-stat .spark{height:30px}
  .ns-btn{border-radius:7px;font-weight:550}
  .ns-btn.primary{box-shadow:none}
  .ns-btn.secondary{border-color:var(--line-strong);box-shadow:none}
  .ns-btn.soft{background:var(--np-soft);color:var(--np-text)}
  .ns-badge{font-weight:550;border-radius:5px}
  .ns-chip{height:30px;border-color:var(--line-strong)}
  .ns-tab{font-family:var(--font-display);font-size:14px}
  .ns-table th{background:var(--surface-2);font-size:12px;color:var(--ink-3);font-weight:550}
  .ns-table td{border-bottom-color:var(--line-2)}
  .ns-table-wrap{box-shadow:none;border-radius:var(--r-lg)}
  .ns-input,.ns-select,.ns-textarea{border-color:var(--line-strong);border-radius:7px}
  .ns-progress{background:var(--surface-4);height:5px}
  .ns-progress.xs{height:4px}
  .ns-quote{font-family:var(--font-serif);font-size:17px;line-height:1.5;border-left:2px solid var(--np);color:var(--ink)}
  .ns-ai{background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--np)}
  .ns-ai-head{color:var(--np-text);font-family:var(--font-display);font-size:13px}
  .ns-ai p{font-family:var(--font-serif);font-size:15.5px;line-height:1.6;color:var(--ink-2)}
  .ns-alert{border-radius:10px}
  .ns-tl-item.done .pt{background:var(--np);border-color:var(--np)}
  .ns-icon-box{background:var(--surface-3);color:var(--ink-2)}
  .ns-avatar{font-family:var(--font-display)}
  .ns-countdown div{background:var(--surface);border-color:var(--line);min-width:50px}
  .ns-countdown b{font-family:var(--font-display);font-weight:600}
  .ns-countdown span{letter-spacing:.02em;text-transform:none;font-size:11px;font-weight:500}
  .ns-legend{color:var(--ink-3)}
  kbd,.ns-kbd{border-color:var(--line-strong)}
  .ns-delta.up{color:var(--ok)}

  /* ---------- rating scale: ramp swatches, tags and rubric chips ---------- */
  .r1{--rc:var(--r1);--rc-ink:var(--r1-ink)}.r2{--rc:var(--r2);--rc-ink:var(--r2-ink)}.r3{--rc:var(--r3);--rc-ink:var(--r3-ink)}.r4{--rc:var(--r4);--rc-ink:var(--r4-ink)}.r5{--rc:var(--r5);--rc-ink:var(--r5-ink)}.r0{--rc:var(--surface-4);--rc-ink:var(--ink-2)}
  .pn-rate{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 9px 0 4px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:550;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
  .pn-rate i{display:grid;place-items:center;min-width:18px;height:16px;padding:0 4px;border-radius:4px;background:var(--rc);color:var(--rc-ink);font-style:normal;font-family:var(--font-display);font-size:11.5px;font-weight:650}
  .pn-rate.lg{height:30px;font-size:13.5px;padding:0 11px 0 5px}.pn-rate.lg i{min-width:22px;height:20px;font-size:12.5px}
  .pn-rate.bare{border:0;background:transparent;padding:0}
  .pn-ramp{display:inline-grid;grid-auto-flow:column;gap:2px;vertical-align:middle}
  .pn-ramp b{width:16px;height:6px;border-radius:2px;background:var(--rc)}
  .ns-rating{display:flex;flex-wrap:wrap;gap:6px}
  .ns-rating button{width:auto;height:auto;min-height:40px;padding:6px 12px 6px 6px;display:inline-flex;align-items:center;gap:9px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);text-align:left;color:var(--ink-2);font-weight:500;font-size:13px;transition:border-color var(--dur),background var(--dur),box-shadow var(--dur)}
  .ns-rating button .n{display:grid;place-items:center;width:26px;height:26px;border-radius:6px;background:var(--surface-3);color:var(--ink-2);font-family:var(--font-display);font-weight:650;font-size:13.5px;transition:background var(--dur),color var(--dur)}
  .ns-rating button .n::after{content:"";}
  .ns-rating button:hover{border-color:var(--rc,var(--np));color:var(--ink)}
  .ns-rating button:hover .n{background:color-mix(in srgb,var(--rc,var(--np)) 30%,var(--surface))}
  .ns-rating button[aria-pressed="true"]{border-color:var(--rc);background:color-mix(in srgb,var(--rc) 9%,var(--surface));box-shadow:0 0 0 1px var(--rc);color:var(--ink);font-weight:600}
  .ns-rating button[aria-pressed="true"] .n{background:var(--rc);color:var(--rc-ink)}
  :root[data-theme="dark"] .ns-rating button[aria-pressed="true"]{background:color-mix(in srgb,var(--rc) 16%,var(--surface))}
  .ns-rating button:disabled{opacity:.55;cursor:default}
  .ns-rating.compact{gap:4px}
  .ns-rating.compact button{position:relative;min-height:36px;min-width:46px;padding:4px;justify-content:center;border-radius:8px}
  .ns-rating.compact button .n{width:28px;height:26px;font-size:13px}
  .ns-rating.compact button .l{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .ns-rating.compact + .rate-desc{font-style:normal;font-family:var(--font-display);font-size:13.5px;font-weight:600;color:var(--ink-2);flex:0 1 auto}
  .rate-desc{font-family:var(--font-serif);font-size:14.5px;line-height:1.5;color:var(--ink-3);font-style:italic;min-width:0;flex:1 1 220px}

  /* ---------- the cycle spine (Home signature) ---------- */
  .pn-spine{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px 18px;margin-bottom:20px}
  .pn-spine-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}
  .pn-spine-top .k{font-family:var(--font-display);font-size:12.5px;font-weight:600;color:var(--ink-3)}
  .pn-spine-top h2{font-family:var(--font-display);font-size:19px;font-weight:600;letter-spacing:-.015em;margin-top:2px}
  .pn-spine-top .meta{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .pn-track{position:relative;height:40px;margin:30px 0 4px}
  .pn-track .rail{position:absolute;left:0;right:0;top:10px;height:2px;background:var(--line);border-radius:2px}
  .pn-track .seg{position:absolute;top:5px;height:12px;border-radius:3px;background:var(--surface-4);box-shadow:inset 0 0 0 1px var(--line-strong)}
  .pn-track .seg.done{background:var(--r4);box-shadow:none}
  .pn-track .seg.now{background:var(--np-soft-2);box-shadow:inset 0 0 0 1px var(--np)}
  .pn-track .seg.now i{position:absolute;left:0;top:0;bottom:0;background:var(--np);border-radius:3px 0 0 3px}
  .pn-track .today{position:absolute;top:-2px;height:26px;width:2px;margin-left:-1px;background:var(--ink)}
  .pn-track .today span{position:absolute;bottom:calc(100% + 3px);left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--ink);white-space:nowrap;background:var(--surface);padding:0 4px}
  .pn-track .mo{position:absolute;top:24px;font-size:11px;color:var(--ink-4);transform:translateX(-50%);font-variant-numeric:tabular-nums}
  .pn-phases{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
  .pn-ph{position:relative;border:1px solid var(--line);border-radius:10px;padding:12px 12px 12px;min-width:0;display:grid;align-content:start;gap:4px;background:var(--surface-2)}
  .pn-ph .n{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink-4);font-variant-numeric:tabular-nums}
  .pn-ph .n svg{width:13px;height:13px}
  .pn-ph.done .n{color:var(--ok)}
  .pn-ph b{font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--ink);line-height:1.25}
  .pn-ph .d{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .pn-ph .o{font-size:12px;color:var(--ink-2);margin-top:4px;line-height:1.4}
  .pn-ph.fut{background:transparent;border-style:dashed}
  .pn-ph.now{background:var(--surface);border-color:var(--np);box-shadow:0 0 0 1px var(--np);padding:16px 18px;gap:6px}
  .pn-ph.now .n{color:var(--np-text)}
  .pn-ph.now > b{font-size:18px}
  .pn-ph.now .body{display:grid;gap:14px;margin-top:6px}
  .pn-ph.now .ns-countdown{margin:0}
  .pn-now-row{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap}
  .pn-now-big{font-family:var(--font-display);font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
  .pn-now-big small{font-size:13px;font-weight:500;color:var(--ink-3);letter-spacing:0;margin-left:4px}
  .pn-segs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;min-width:160px;flex:1}
  .pn-segs i{height:8px;border-radius:2px;background:var(--surface-4)}
  .pn-segs i.on{background:var(--np)}
  .pn-faces{display:flex;flex-wrap:wrap;gap:6px}
  .pn-face{position:relative;display:inline-grid}
  .pn-face .ns-avatar{--sz:30px;font-size:11px}
  .pn-face.wait .ns-avatar{opacity:.38;filter:grayscale(1)}
  .pn-face.sub .ns-avatar{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--np)}
  @media (max-width:1100px){.pn-phases{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}.pn-ph.now{grid-column:1/-1;order:-1}}
  @media (max-width:560px){.pn-spine{padding:16px 14px}.pn-track .mo.odd{display:none}.pn-phases{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}.pn-ph.now{grid-template-columns:minmax(0,1fr)}}

  /* ---------- goal & pace ---------- */
  .pn-bar{position:relative;height:6px;border-radius:3px;background:var(--surface-4)}
  .pn-bar > i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--np)}
  .pn-bar.risk > i{background:var(--viz-warn)}.pn-bar.behind > i{background:var(--viz-critical)}.pn-bar.done > i{background:var(--r4)}
  .pn-bar > u{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink-3);border-radius:1px}
  .pn-wmap{display:flex;gap:3px;height:28px;margin-top:2px}
  .pn-wmap > span{position:relative;border-radius:4px;background:color-mix(in srgb,var(--c) 16%,var(--surface));overflow:hidden;min-width:6px}
  .pn-wmap > span > i{position:absolute;left:0;bottom:0;top:0;background:var(--c);opacity:.9}
  .pn-wmap > span > em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:650;color:#fff;font-family:var(--font-display);text-shadow:0 0 3px rgba(0,0,0,.35)}
  .goal-card{gap:14px}
  .goal-title{font-family:var(--font-display);font-size:16px;font-weight:600;letter-spacing:-.01em}
  .goal-card .sm.muted{font-family:var(--font-serif);font-size:14.5px;color:var(--ink-3);line-height:1.5}
  .goal-pct{font-family:var(--font-display);font-size:22px;font-weight:600}
  .goal-row .nm{font-family:var(--font-display);font-size:14px;font-weight:600}

  /* ---------- the review document (self & manager review) ---------- */
  .pn-editor{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
  .pn-rail{display:grid;gap:14px;position:sticky;top:calc(var(--header-h) + var(--topbar-h) + 4px)}
  @media (max-width:1100px){.pn-editor{grid-template-columns:minmax(0,1fr)}.pn-rail{position:static}}
  .pn-doc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:40px 56px 36px;box-shadow:0 1px 0 var(--line-2),0 2px 0 -1px var(--surface),0 3px 0 -1px var(--line-2)}
  .pn-doc + .pn-doc{margin-top:16px}
  .pn-doc.intro{padding:26px 56px 24px;background:transparent;border-style:dashed;box-shadow:none}
  .pn-doc.intro .pn-doc-title{margin-top:6px}
  @media (max-width:720px){.pn-doc{padding:24px 18px 22px;border-radius:12px}.pn-doc.intro{padding:20px 18px}}
  .pn-kicker{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .pn-kicker .sep{width:3px;height:3px;border-radius:50%;background:var(--ink-4)}
  .pn-doc-title{font-family:var(--font-display);font-size:26px;line-height:1.2;font-weight:600;letter-spacing:-.02em;margin-top:10px;color:var(--ink)}
  .pn-lede{font-family:var(--font-serif);font-size:17.5px;line-height:1.55;color:var(--ink-2);margin-top:8px;font-style:italic}
  .pn-facts{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;margin-top:18px;padding:14px 0 0;border-top:1px solid var(--line-2)}
  .pn-facts .lbl{font-size:12px;color:var(--ink-3)}
  .pn-facts .pc{font-family:var(--font-display);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
  .pn-q{margin-top:30px}
  .pn-q-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--font-display);font-size:15.5px;font-weight:600;color:var(--ink)}
  .pn-q-help{font-size:13px;color:var(--ink-3);margin:3px 0 12px}
  .pn-write{display:block;width:100%;min-height:150px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-family:var(--font-serif);font-size:17.5px;line-height:1.65;color:var(--ink);resize:vertical;outline:none;transition:border-color var(--dur),box-shadow var(--dur),background var(--dur)}
  .pn-write::placeholder{color:var(--ink-4);font-style:italic}
  .pn-write:hover{border-color:var(--line-strong)}
  .pn-write:focus{border-color:var(--np);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--np) 14%,transparent)}
  .pn-write:disabled{background:transparent;border-color:transparent;padding-left:0;resize:none;color:var(--ink-2)}
  .pn-write.sm{min-height:76px;font-size:16px}
  .pn-write-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ink-4)}
  .pn-write-foot .wc{margin-left:auto;font-variant-numeric:tabular-nums}
  .pn-said{margin:14px 0 0;padding:2px 0 2px 18px;border-left:2px solid var(--line-strong)}
  .pn-said .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin-bottom:6px}
  .pn-said p{font-family:var(--font-serif);font-size:17px;line-height:1.6;color:var(--ink-2)}
  .pn-said p.empty{font-style:italic;color:var(--ink-4)}
  .pn-comp{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:20px 0;border-top:1px solid var(--line-2)}
  .pn-comp:first-of-type{border-top:0;padding-top:4px}
  .pn-comp-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .pn-comp-h b{font-family:var(--font-display);font-size:15.5px;font-weight:600}
  .pn-comp-h p{font-family:var(--font-serif);font-size:15px;color:var(--ink-3);margin-top:2px;line-height:1.45}
  .pn-doc-sec{font-family:var(--font-display);font-size:12.5px;font-weight:600;color:var(--np-text);margin:0 0 4px}
  .pn-doc hr{margin:30px 0 0;border-top-color:var(--line-2)}
  /* outline + evidence rail */
  .pn-outline{display:grid;gap:1px}
  .pn-outline button{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:center;padding:7px 8px;border-radius:7px;text-align:left;font-size:13px;color:var(--ink-2);width:100%}
  .pn-outline button:hover{background:var(--surface-3)}
  .pn-outline button[aria-current="true"]{background:var(--np-soft);color:var(--np-text);font-weight:600}
  .pn-outline .truncate{min-width:0}
  .wizard-nav .st{width:18px;height:18px;font-size:10px;border-width:1.5px}
  .wizard-nav .st.done{background:var(--np);border-color:var(--np);color:#fff}
  .pn-ev{display:grid;gap:12px}
  .pn-ev-h{font-family:var(--font-display);font-size:12.5px;font-weight:600;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px}
  .pn-ev-kr{display:grid;gap:6px;font-size:12.5px;color:var(--ink-2)}
  .pn-ev-kr .row{display:flex;justify-content:space-between;gap:10px}
  .pn-ev-kr b{font-variant-numeric:tabular-nums;color:var(--ink)}
  .pn-ci{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;font-size:12.5px;padding:8px 0;border-top:1px solid var(--line-2)}
  .pn-ci:first-child{border-top:0;padding-top:0}
  .pn-ci time{color:var(--ink-4);font-variant-numeric:tabular-nums}
  .pn-ci p{color:var(--ink-2);line-height:1.45}
  .pn-pq{font-family:var(--font-serif);font-size:15px;line-height:1.55;color:var(--ink-2);padding:10px 0;border-top:1px solid var(--line-2)}
  .pn-pq:first-child{border-top:0;padding-top:0}
  .pn-pq .t{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
  .pn-pq .t span{font-family:var(--font-sans);font-size:11px;font-weight:550;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
  .savebar{border-radius:12px;box-shadow:var(--shadow);border-color:var(--line);background:var(--surface)}
  .savebar .now{font-family:var(--font-display);font-size:13px;color:var(--ink-3)}
  .score-row b{font-family:var(--font-display);font-size:14.5px}
  .rating-guide{display:grid;gap:8px}
  .rating-guide{gap:12px}.rating-guide > div{display:grid;gap:4px;justify-items:start}
  .rating-guide p{font-size:12px;color:var(--ink-3);line-height:1.45}
  .rating-guide b{font-size:12.5px}
  details.pn-fold > summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;font-family:var(--font-display);font-weight:600;font-size:14px;padding:14px 18px}
  details.pn-fold > summary::-webkit-details-marker{display:none}
  details.pn-fold > summary svg{width:15px;height:15px;color:var(--ink-4);transition:transform var(--dur)}
  details.pn-fold[open] > summary svg{transform:rotate(180deg)}
  details.pn-fold > div{padding:0 18px 16px}
  .gap-flag{border-radius:5px}

  /* ---------- review path (stage track used in queues) ---------- */
  .pn-path{display:inline-flex;align-items:center;gap:3px;vertical-align:middle}

  const pathTrack = (st) => { const step = STATUS[st].step; return `<span class="pn-path" aria-hidden="true">${[1, 2, 3, 4, 5].map((i) => `<i class="${step >= i ? (i === 5 ? 'cal' : 'on') : ''}"></i>`).join('')}</span>`; };
  const statusCell = (st) => `<div class="pn-st"><span>${STATUS[st].label}</span>${pathTrack(st)}</div>`;
  const goalCard = (g, o = {}) => `<div class="ns-card"><div class="ns-card-body goal-card">
      <div class="goal-top"><div><div class="goal-meta"><span class="ns-badge ${CATS[g.cat]} sq">${g.cat}</span><span>Weight ${g.weight}%</span><span>·</span><span>${ic('calendar', { size: 12 })} Due ${F.date(g.due, 'short')}</span></div><div class="goal-title mt-2">${NS.esc(g.title)}</div><p class="sm muted mt-1">${NS.esc(g.desc)}</p></div><div class="right flex-none grid gap-1" style="justify-items:end"><div class="goal-pct">${g.progress}%</div>${goalStatusBadge(g)}</div></div>
      ${paceBar(g)}
      <div>${g.krs.map((k) => `<div class="kr"><span class="ink2">${ic('target', { size: 13 })} ${NS.esc(k.k)}</span><span class="tnum"><b>${NS.esc(k.current)}</b> <span class="faint">${k.current === k.target ? 'target met' : 'toward ' + NS.esc(k.target)}</span></span></div>`).join('')}</div>
      ${o.actions ? `<div class="flex gap-2 wrap">${o.actions}</div>` : ''}
    </div></div>`;
  const cycleStepper = () => { const ph = S.settings.phases; return `<div class="ns-stepper">${ph.map((p) => { const st = new Date(p.end) < TODAY ? 'done' : new Date(p.start) <= TODAY ? 'now' : ''; return `<div class="ns-step ${st}"><span class="pt">${st === 'done' ? ic('check') : ph.indexOf(p) + 1}</span><b>${p.label}</b><span>${F.date(p.start, 'short')} – ${F.date(p.end, 'short')}</span></div>`; }).join('')}</div>`; };
  // Evergreen countdown: remaining time is measured from the pinned demo date, so the demo never "expires".
  const cdTarget = (iso) => Date.now() + Math.max(0, new Date(iso) - TODAY);
  const cdParts = (target) => { const ms = Math.max(0, target - Date.now()); return [Math.floor(ms / 86400000), Math.floor((ms % 86400000) / 3600000), Math.floor((ms % 3600000) / 60000), Math.floor((ms % 60000) / 1000)]; };
  const countdown = (iso) => { const t = cdTarget(iso); const v = cdParts(t); return `<div class="ns-countdown" data-countdown="${t}">${['days', 'hrs', 'min', 'sec'].map((l, i) => `<div><b>${String(v[i]).padStart(2, '0')}</b><span>${l}</span></div>`).join('')}</div>`; };
  let cdTimer; const tickCountdown = (root) => { clearInterval(cdTimer); const el = root.querySelector('[data-countdown]'); if (!el) return; cdTimer = setInterval(() => { if (!el.isConnected) { clearInterval(cdTimer); return; } const v = cdParts(+el.dataset.countdown); el.querySelectorAll('b').forEach((b, i) => b.textContent = String(v[i]).padStart(2, '0')); }, 1000); };
  const personLink = (p, sub) => `<a href="${NS.link('/people/' + p.id)}" class="ns-person" style="text-decoration:none">${NS.avatar(p, { size: 'sm' })}<div class="min-w-0"><div class="nm">${NS.esc(p.name)}</div><div class="sb">${NS.esc(sub || p.title)}</div></div></a>`;
  const scoreCard = (pid, o = {}) => { const gs = goalScore(pid, 'self'), cs = compScore(pid, 'self'), os = overall(pid, 'self'), gm = goalScore(pid, 'manager'), cm = compScore(pid, 'manager'), om = overall(pid, 'manager'); const w = weights(); const f = (v) => (v == null ? '<span class="faint">—</span>' : v.toFixed(1)); return `<div class="ns-card"><div class="ns-card-head"><div><h3>Scorecard</h3><p>Weighted: goals ${w.goals}% · competencies ${w.comps}%</p></div></div><div class="ns-card-body"><div class="score-row score-head"><span>Component</span><span>Self</span><span>${o.who === 'manager' ? 'You' : 'Manager'}</span></div><div class="score-row"><span>Goals (weighted)</span><b>${f(gs)}</b><b>${f(gm)}</b></div><div class="score-row"><span>Competencies</span><b>${f(cs)}</b><b>${f(cm)}</b></div><div class="score-row"><span class="semibold ink">Overall</span><b class="ink">${f(os)}</b><b class="ink">${f(om)}</b></div><div class="mt-3 pt-3 flex items-center justify-between gap-2 wrap" style="border-top:1px solid var(--line);padding-top:12px"><span class="sm muted">Projected rating</span>${om != null ? rateTag(om, { cls: 'lg' }) : os != null ? `<span class="flex items-center gap-2"><span class="xs muted">Self</span>${rateTag(os)}</span>` : rateTag(null, { empty: 'Not yet rated' })}</div>${om != null && os != null && Math.abs(om - os) >= 0.8 ? `<div class="ns-alert warn mt-3">${ic('alert-triangle')}<div><b>Large self–manager gap (${(om - os).toFixed(1)})</b><p>Prepare specific examples for the conversation — gaps this size need evidence, not adjectives.</p></div></div>` : ''}</div></div>`; };

  /* ------------------------------------------------------------------ */
  /* 4. Routes                                                           */
  /* ------------------------------------------------------------------ */
  const R = {};

  /* HOME ------------------------------------------------------------- */
  R['/home'] = { title: 'Home', render: (c) => (c.persona.id === 'employee' ? homeEmployee(c) : c.persona.id === 'manager' ? homeManager(c) : homeHRBP(c)), mounted: (c, root) => { tickCountdown(root); if (c.persona.id === 'employee') { root.querySelectorAll('[data-check]').forEach((cb) => cb.onchange = () => { S.checklist[cb.dataset.check] = cb.checked; save(); cb.closest('label').classList.toggle('done', cb.checked); }); } if (c.persona.id === 'manager') { const nt = root.querySelector('[data-nudge-team]'); if (nt) nt.onclick = () => { const ids = teamOf(c.persona.personId).filter((p) => STATUS[statusOf(p.id)].step < 2).map((p) => p.id); if (ids.length) window.__PN.nudge(ids); else NS.toast('Everyone has submitted', { type: 'info' }); }; const el = root.querySelector('#teamGoalCats'); if (el) { const team = teamOf(c.persona.personId); const cats = Object.keys(CATS); NS.chart.hbars(el, { items: cats.map((cat) => { const gs = team.flatMap((p) => S.goals[p.id]).filter((g) => g.cat === cat); return { label: cat, value: Math.round(U.avg(gs, 'progress')), color: CAT_COLORS[cat] }; }), max: 100, format: (v) => v + '%', valueLabel: 'Avg progress' }); } } if (c.persona.id === 'hrbp') { const el = root.querySelector('#deptCompletion'); if (el) { const depts = D.departments.map((d) => d.name); const vals = depts.map((d) => { const ps = D.dept(d); return Math.round((ps.filter((p) => STATUS[statusOf(p.id)].step >= 2).length / ps.length) * 100); }); NS.chart.hbars(el, { items: depts.map((d, i) => ({ label: d, value: vals[i], sub: `${D.dept(d).length} people` })).sort((a, b) => b.value - a.value), max: 100, format: (v) => v + '%', valueLabel: 'Self reviews submitted' }); } const tl = root.querySelector('#cycleTrend'); if (tl) NS.chart.line(tl, { labels: ['Sep 14', 'Sep 16', 'Sep 18', 'Sep 20', 'Sep 22', 'Sep 24'], series: [{ name: 'Self reviews submitted', values: [4, 14, 27, 38, 49, (() => { const ps = D.people.filter((p) => p.level !== 'E2'); return Math.round(U.pctOf(ps.filter((p) => STATUS[statusOf(p.id)].step >= 2).length, ps.length)); })()] }, { name: 'FY25 same point', values: [3, 9, 18, 26, 33, 41], dashed: true, color: 'var(--ink-4)' }], yFormat: (v) => v + '%', yMin: 0, yMax: 100, height: 200, endLabels: true }); } } };

  const phaseTimeline = () => `<div class="ns-timeline">${S.settings.phases.map((p) => { const st = new Date(p.end) < TODAY ? 'done' : new Date(p.start) <= TODAY ? 'now' : ''; return `<div class="ns-tl-item ${st}"><span class="pt">${st === 'done' ? ic('check') : st === 'now' ? ic('circle-dot') : ''}</span><div><div class="ttl flex items-center gap-2">${p.label}${st === 'now' ? NS.badge('Current', 'info') : ''}</div><div class="sub">${F.date(p.start, 'short')} – ${F.date(p.end)}</div></div></div>`; }).join('')}</div>`;
  const goalRows = (goals, link) => `<div class="goal-rows">${goals.map((g) => `<a href="${link(g)}" class="goal-row"><div class="min-w-0"><div class="nm">${NS.esc(g.title)}</div><div class="mt"><span class="ns-badge ${CATS[g.cat]} sq">${g.cat}</span><span>Weight ${g.weight}%</span><span>Due ${F.date(g.due, 'short')}</span>${goalStatusBadge(g)}</div></div><div class="bar">${paceBar(g)}</div><div class="pc">${g.progress}%</div></a>`).join('')}</div>`;

  /* THE CYCLE SPINE — Home's signature. The track is drawn to scale (phase widths are their real durations);
     the phase row below gives the current phase the room, with what it means for the person looking at it. */
  const cycleSpine = (c) => {
    const ph = S.settings.phases, end = (p) => new Date(p.end + 'T23:59:00');
    const t0 = new Date(ph[0].start), t1 = end(ph[ph.length - 1]), span = t1 - t0;
    const pos = (d) => U.clamp(((new Date(d) - t0) / span) * 100, 0, 100);
    const stOf = (p) => (end(p) < TODAY ? 'done' : new Date(p.start) <= TODAY ? 'now' : 'fut');
    let cur = ph.findIndex((p) => stOf(p) === 'now'); if (cur < 0) cur = Math.max(0, ph.findIndex((p) => stOf(p) === 'fut'));
    const P0 = ph[cur], dTot = Math.round((end(P0) - new Date(P0.start)) / 86400000), dIn = U.clamp(Math.ceil((TODAY - new Date(P0.start)) / 86400000), 0, dTot);
    const months = U.range(10).map((i) => new Date(2026, i + 1, 1)).filter((d) => d > t0 && d < t1);
    const who = c.persona.id, me = meFor(c.persona);
    const team = who === 'manager' ? teamOf(me.id) : [], all = D.people.filter((p) => p.level !== 'E2');
    const mine = who === 'employee' ? S.goals[me.id] : who === 'manager' ? team.flatMap((p) => S.goals[p.id]) : null;
    const outcome = {
      goals: who === 'employee' ? `${mine.length} goals agreed · weights total ${U.sum(mine, 'weight')}%` : who === 'manager' ? `${mine.length} team goals agreed across ${team.length} people` : `${F.int(all.length)} participants with approved goals`,
      midyear: who === 'employee' ? `${mine.filter((g) => g.checkins.length).length} of ${mine.length} goals checked in` : who === 'manager' ? `${team.filter((p) => S.goals[p.id].some((g) => g.checkins.length)).length} of ${team.length} people checked in` : `${Math.round(U.pctOf(all.filter((p) => S.goals[p.id].some((g) => g.checkins.length)).length, all.length))}% of people checked in`,
      manager: who === 'employee' ? `${D.byId(me.managerId).first} rates goals and competencies` : who === 'manager' ? `Your window · ${team.length} reviews to write` : `${D.managers.length} managers write reviews`,
      calibration: who === 'employee' ? 'Ratings compared across peers at your level' : who === 'manager' ? `${team.length} people placed on the 9-box` : `Roundtables by organisation`,
      release: who === 'hrbp' ? 'Letters and increments released' : 'Rating conversation and increments',
      self: '',
    };
    const nowBody = () => {
      if (who === 'employee') { const comp = completion(me.id), secs = selfSections(me.id); return `<div class="pn-now-row"><div class="pn-now-big">${comp.pct}%<small>${comp.done} of ${comp.total} sections</small></div><div class="pn-segs" aria-hidden="true">${secs.map((x) => `<i class="${x.done ? 'on' : ''}" title="${NS.esc(x.label)}"></i>`).join('')}</div></div><div class="pn-now-row"><div><div class="xs muted mb-1">Closes ${F.date(D.cycle.selfReviewCloses, 'long')}, 18:00</div>${countdown(D.cycle.selfReviewCloses)}</div><span class="grow"></span><div class="flex gap-2 wrap"><a class="ns-btn secondary" href="${NS.link('/goals')}">Update goals</a><a class="ns-btn primary" href="${NS.link('/review')}">${ic('pencil')}Continue writing</a></div></div>`; }
      if (who === 'manager') { const sub = team.filter((p) => STATUS[statusOf(p.id)].step >= 2), ready = team.filter((p) => ['self_submitted', 'manager_in_progress'].includes(statusOf(p.id))); const mp = ph.find((p) => p.id === 'manager'); return `<div class="pn-now-row"><div class="pn-now-big">${sub.length}<small>of ${team.length} self reviews in</small></div><div class="pn-faces" role="list" aria-label="Team self-review status">${U.sortBy(team, (p) => -STATUS[statusOf(p.id)].step).map((p) => `<span role="listitem" class="pn-face ${STATUS[statusOf(p.id)].step >= 2 ? 'sub' : 'wait'}" data-tip="${NS.esc(p.first)} · ${STATUS[statusOf(p.id)].label}">${NS.avatar(p)}</span>`).join('')}</div></div><div class="pn-now-row"><p class="sm ink2" style="max-width:52ch">${ready.length} ${ready.length === 1 ? 'review is' : 'reviews are'} ready for you to read. Your manager-review window opens ${F.date(mp.start, 'short')}, in ${F.days(daysLeft(mp.start + 'T09:00:00'))} — reading early is encouraged.</p><span class="grow"></span><div class="flex gap-2 wrap"><button class="ns-btn secondary" data-nudge-team>${ic('bell')}Nudge ${team.length - sub.length}</button><a class="ns-btn primary" href="${NS.link('/team')}">${ic('clipboard-list')}Open review queue</a></div></div>`; }
      const ps = all, sub = ps.filter((p) => STATUS[statusOf(p.id)].step >= 2).length, pct = Math.round(U.pctOf(sub, ps.length)), ns = ps.filter((p) => statusOf(p.id) === 'not_started').length;
      return `<div class="pn-now-row"><div class="pn-now-big">${pct}%<small>${F.int(sub)} of ${F.int(ps.length)} submitted</small></div><div style="flex:1;min-width:180px;max-width:320px"><div class="flex items-center gap-3 xs muted mb-1"><span class="flex items-center gap-1"><i style="width:12px;height:2px;background:var(--np);display:inline-block"></i>FY26</span><span class="flex items-center gap-1"><i style="width:12px;height:0;border-top:2px dashed var(--ink-4);display:inline-block"></i>FY25, same day</span></div>${(() => { const a = [4, 14, 27, 38, 49, pct], b = [3, 9, 18, 26, 33, 41], W = 240, H = 40, pt = (v, i) => `${(i / 5) * W},${H - (v / 100) * H}`; return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:40px;overflow:visible" role="img" aria-label="Self reviews submitted: ${pct}% now versus 41% in FY25 at the same day"><line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--line)"/><polyline points="${b.map(pt).join(' ')}" fill="none" stroke="var(--ink-4)" stroke-width="1.5" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/><polyline points="${a.map(pt).join(' ')}" fill="none" stroke="var(--np)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`; })()}</div></div><div class="pn-now-row"><p class="sm ink2" style="max-width:52ch">${pct - 41} points ahead of FY25 at day ${dIn}. ${F.int(ns)} people haven’t started; an automatic nudge goes out ${F.date('2026-09-26', 'short')}.</p><span class="grow"></span><a class="ns-btn primary" href="${NS.link('/console')}">${ic('table')}Open cycle console</a></div>`;
    };
    const cols = ph.map((p, i) => (i === cur ? 'minmax(0,3fr)' : 'minmax(0,1fr)')).join(' ');
    return `<section class="pn-spine" aria-label="${NS.esc(D.cycle.name)} timeline">
      <div class="pn-spine-top"><div><div class="k">${NS.esc(D.cycle.name)} · phase ${cur + 1} of ${ph.length}</div><h2>${NS.esc(P0.label)} ${stOf(P0) === 'now' ? 'is open' : 'opens next'}</h2></div><div class="meta">${stOf(P0) === 'now' ? `Day ${dIn} of ${dTot} · ${F.days(daysLeft(P0.end + 'T18:00:00'))} left` : `Opens ${F.date(P0.start, 'short')}`}</div></div>
      <div class="pn-track" aria-hidden="true"><span class="rail"></span>${ph.map((p) => { const st = stOf(p), l = pos(p.start), w = Math.max(0.9, pos(end(p)) - l); return `<span class="seg ${st}" style="left:${l}%;width:${w}%" title="${NS.esc(p.label)} · ${F.date(p.start, 'short')} – ${F.date(p.end, 'short')}">${st === 'now' ? `<i style="width:${U.clamp(((TODAY - new Date(p.start)) / (end(p) - new Date(p.start))) * 100, 0, 100)}%"></i>` : ''}</span>`; }).join('')}<span class="today" style="left:${pos(TODAY)}%"><span>Today · ${F.date(TODAY, 'short')}</span></span>${months.map((d, i) => `<span class="mo ${i % 2 ? 'odd' : ''}" style="left:${pos(d)}%">${d.toLocaleDateString('en-GB', { month: 'short' })}</span>`).join('')}</div>
      <ol class="pn-phases" style="grid-template-columns:${cols}">${ph.map((p, i) => { const st = stOf(p); if (i === cur) return `<li class="pn-ph now"><span class="n">${ic('circle-dot')}Phase ${i + 1} · ${F.date(p.start, 'short')} – ${F.date(p.end, 'short')}</span><b>${NS.esc(p.label)}</b><div class="body">${nowBody()}</div></li>`; return `<li class="pn-ph ${st}"><span class="n">${st === 'done' ? ic('check') + 'Done' : 'Phase ' + (i + 1)}</span><b>${NS.esc(p.label)}</b><span class="d">${F.date(p.start, 'short')} – ${F.date(p.end, 'short')}</span><span class="o">${st === 'fut' ? `Opens in ${F.days(daysLeft(p.start + 'T09:00:00'))}${outcome[p.id] ? ' · ' + outcome[p.id] : ''}` : NS.esc(outcome[p.id] || '')}</span></li>`; }).join('')}</ol>
    </section>`;
  };

  const homeEmployee = (c) => {
    const me = meFor(c.persona), pid = me.id, goals = S.goals[pid], comp = completion(pid), fb = S.feedback[pid] || { received: [], requested: [], toGive: [] };
    const wprog = Math.round(U.sum(goals, (g) => g.progress * g.weight) / U.sum(goals, 'weight'));
    const pace = Math.round(YEAR_FRAC * 100);
    const onTrack = goals.filter((g) => g.status === 'on' || g.status === 'done').length;
    const left = daysLeft(D.cycle.selfReviewCloses);
    const checks = [{ id: 'c1', t: 'Finish your self review', s: `${comp.done} of ${comp.total} sections done · closes ${F.date(D.cycle.selfReviewCloses)}`, route: '/review', cta: 'Continue' }, { id: 'c2', t: 'Update key results on “' + goals[5].title + '”', s: 'Last check-in 9 days ago', route: '/goals', cta: 'Update' }, { id: 'c3', t: `Give feedback for ${D.byId(fb.toGive[0].for).first} and ${D.byId(fb.toGive[1].for).first}`, s: `Requested by ${D.byId(fb.toGive[0].for).first} · due ${F.date(fb.toGive[0].due, 'short')}`, route: '/feedback', cta: 'Write' }, { id: 'c4', t: 'Prepare for your 1:1 with Aditya', s: 'Thursday 10:30 · bring one thing you’re stuck on', route: '/home', cta: 'Notes' }];
    const open = checks.filter((x) => !S.checklist[x.id]).length;
    const mgr = D.byId(me.managerId);
    return html`
      ${raw(NS.pageHead({ eyebrow: `${D.cycle.name} · Self review window`, title: `${NS.greeting()}, ${me.first}`, sub: `${F.date(TODAY, 'long')} · ${NS.esc(me.team)}, ${NS.esc(me.city)}. Your self review closes ${F.date(D.cycle.selfReviewCloses, 'long')}, in ${F.days(left)}.`, actions: `<a class="ns-btn ghost" href="${NS.link('/people/' + me.id)}">${ic('id-card')}My profile</a>` }))}
      ${raw(cycleSpine(c))}
      <div class="ns-stats">
        ${raw(NS.stat({ label: 'Weighted goal progress', value: wprog, unit: '%', delta: NS.delta(wprog - pace, { suf: Math.abs(Math.round(wprog - pace)) === 1 ? ' pt' : ' pts', d: 0 }), sub: `${onTrack} of ${goals.length} on track · ${pace}% year-to-date pace`, spark: [22, 31, 38, 47, 55, 61, 68, wprog] }))}
        ${raw(NS.stat({ label: 'Goals checked in', value: goals.filter((g) => g.checkins.length).length, unit: `of ${goals.length}`, icon: 'activity', sub: (() => { const l = goals.flatMap((g) => g.checkins).sort((a, b) => (b.date > a.date ? 1 : -1))[0]; return l ? `Last check-in ${F.date(l.date, 'short')}` : 'No check-ins yet'; })() }))}
        ${raw(NS.stat({ label: 'Peer feedback', value: fb.received.length, unit: `of ${fb.requested.length} received`, icon: 'message-square', sub: `${fb.toGive.filter((x) => x.status === 'pending').length} requests to answer` }))}
        ${raw(NS.stat({ label: 'Last rating (FY25)', value: me.rating || '—', unit: me.rating ? SCALE[me.rating - 1].label : '', icon: 'trending-up', sub: `FY23 → FY25: ${me.ratings.map((r) => r || '–').join(' · ')}` }))}
      </div>
      <div class="ns-grid main-side mt-4">
        <div class="grid gap-4">
          ${raw(NS.card({ title: 'Needs your attention', sub: open ? `${open} of ${checks.length} open · tick a task when it’s done` : 'All caught up', actions: open ? NS.badge(`${open} open`, 'warn') : NS.badge('Done', 'ok'), bodyCls: 'flush mt-3', body: `<div class="task-list" style="border-top:1px solid var(--line-2)">${checks.map((x) => `<label class="task ${S.checklist[x.id] ? 'done' : ''}"><span class="ns-check"><input type="checkbox" data-check="${x.id}" ${S.checklist[x.id] ? 'checked' : ''} aria-label="Mark “${NS.esc(x.t)}” done"><span class="min-w-0"><div class="t">${NS.esc(x.t)}</div><div class="s">${NS.esc(x.s)}</div></span></span><a class="ns-btn sm secondary flex-none" href="${NS.link(x.route)}">${x.cta}</a></label>`).join('')}</div>` }))}
          ${raw(NS.card({ title: 'Your goals', sub: `${goals.length} goals · weighted by importance · select a goal to check in`, actions: `<a class="ns-btn sm secondary" href="${NS.link('/goals')}">View all</a>`, bodyCls: 'flush mt-3', body: `<div style="border-top:1px solid var(--line-2)">${goalRows(goals, (g) => NS.link('/goals', { g: g.id }))}</div>` }))}
        </div>
        <div class="grid gap-4">
          ${raw(NS.card({ title: 'Recent feedback', sub: `${fb.received.length} received from peers`, actions: `<a class="ns-btn xs ghost" href="${NS.link('/feedback')}">View all</a>`, body: fb.received.length ? `<div class="grid gap-4">${fb.received.slice(0, 2).map((f) => { const p = D.byId(f.from); return `<div class="flex gap-3 items-start">${NS.avatar(S.settings.anonymousPeer ? '?' : p, { size: 'sm' })}<div class="min-w-0"><div class="flex justify-between gap-2"><b class="sm">${S.settings.anonymousPeer ? 'Peer (anonymous)' : NS.esc(p.name)}</b><span class="xs faint">${F.date(f.date, 'short')}</span></div><p class="pn-quote-sm mt-1">“${NS.esc(f.strengths)}”</p></div></div>`; }).join('')}</div>` : NS.empty({ icon: 'message-square', title: 'No feedback yet' }) }))}

d performance and potential</span><span class="sw" style="margin-left:8px">${[1, 2, 3, 4, 5].map((r) => `<b class="r${r}" style="background:var(--rc);border:0"></b>`).join('')}</span><span>Rating 1–5</span><span style="margin-left:8px;display:inline-flex;align-items:center;gap:6px"><b style="width:18px;height:10px;border-radius:2px;border:1px dashed var(--np);background:var(--np-soft)"></b>Adjusted on this grid</span><span style="margin-left:auto">Drag a person, or focus one and use the arrow keys</span></div></div></div>

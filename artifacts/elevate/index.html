<style>
/* ==========================================================================
   Brightkey Elevate · Sales-org talent cloud — concept demo by Ronak Mehta
   Identity: quota-driven energy with enterprise polish (Salesforce / HubSpot / Gong).
   Outfit for display and numbers, Inter for UI. Brightkey blue does the work;
   orange is reserved for wins (target hit, #1 on the board, kudos).
   All people, companies and figures are fictional.
   ========================================================================== */
:root{
  --font-sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-display:"Outfit","Inter",ui-sans-serif,system-ui,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --brand:#2F6FBD;--brand-500:#3A7BCB;--brand-600:#255CA3;--brand-700:#1B4A86;--brand-400:#5C93D6;--brand-300:#9CBFE8;
  --brand-text:#1F5BA5;--brand-100:#DCE8F7;--brand-50:#EEF4FB;--brand-line:#B5CDEC;
  --navy:#0D2A4D;--navy-2:#14365F;--navy-line:rgba(255,255,255,.12);
  --accent:#CD4B0D;--accent-400:#E8743A;--accent-text:#B5410A;--accent-50:#FDF0E8;--accent-line:#F1C2A6;
  --ok:#137A3E;--ok-fill:#1F9D55;--ok-50:#E8F5EE;--ok-line:#B5DEC5;
  --warn:#8F5600;--warn-fill:#D99000;--warn-50:#FDF4E2;--warn-line:#EFD39C;
  --bad:#B42318;--bad-fill:#D93A2B;--bad-50:#FDECEA;--bad-line:#F2BDB7;
  --violet:#6D4FD8;--teal:#0E8A85;

  --bg:#F3F5F8;--bg-2:#E8ECF1;
  --surface:#FFFFFF;--surface-2:#F8FAFC;--surface-3:#F1F4F8;--surface-4:#E4E9F0;
  --line:#DEE3EA;--line-2:#EBEEF3;--line-strong:#C7D0DB;
  --ink:#0F1C2E;--ink-2:#334155;--ink-3:#566275;--ink-4:#606C7E;--ink-inverse:#FFFFFF;
  --track:#E7EBF1;--star-off:#CBD3DE;
  --band-1:#D5DCE6;--band-2:#E3E8EF;--band-3:#EFF2F6;

  --shadow-xs:0 1px 1px rgba(15,28,46,.04);
  --shadow-sm:0 1px 2px rgba(15,28,46,.06),0 1px 3px rgba(15,28,46,.04);
  --shadow:0 2px 6px -1px rgba(15,28,46,.08),0 1px 2px rgba(15,28,46,.05);
  --shadow-lg:0 12px 28px -8px rgba(15,28,46,.18),0 2px 6px rgba(15,28,46,.06);
  --shadow-xl:0 24px 60px -16px rgba(15,28,46,.32),0 4px 12px rgba(15,28,46,.08);
  --card-inset:0 0 0 0 transparent;
  --glass-pop:#FFFFFF;

  --r-sm:6px;--r:8px;--r-lg:10px;--r-xl:14px;
  --ease:cubic-bezier(.2,.8,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.4,.64,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --brand:#4F8EDB;--brand-500:#5A95DE;--brand-600:#3D7CC9;--brand-700:#9CC2F0;--brand-400:#7FB0EC;--brand-300:#2C5A93;
  --brand-text:#93BDF0;--brand-100:rgba(79,142,219,.26);--brand-50:rgba(79,142,219,.12);--brand-line:rgba(79,142,219,.45);
  --navy:#060E1A;--navy-2:#0C1B30;--navy-line:rgba(255,255,255,.09);
  --accent:#F07A3E;--accent-400:#F59A6A;--accent-text:#F7A67C;--accent-50:rgba(240,122,62,.14);--accent-line:rgba(240,122,62,.42);
  --ok:#5BD08A;--ok-fill:#2FB36A;--ok-50:rgba(47,179,106,.14);--ok-line:rgba(47,179,106,.4);
  --warn:#F2BE55;--warn-fill:#E2A12B;--warn-50:rgba(226,161,43,.14);--warn-line:rgba(226,161,43,.4);
  --bad:#FF8A7E;--bad-fill:#E5534B;--bad-50:rgba(229,83,75,.15);--bad-line:rgba(229,83,75,.42);
  --violet:#A493F7;--teal:#3CC8BE;

  --bg:#0A1220;--bg-2:#0E1828;
  --surface:#0F1A2B;--surface-2:#132035;--surface-3:#17263E;--surface-4:#1F304C;
  --line:#22324A;--line-2:#1A283D;--line-strong:#30445F;
  --ink:#E8EEF7;--ink-2:#BCC7D7;--ink-3:#93A1B6;--ink-4:#8392A8;--ink-inverse:#0A1220;
  --track:#1C2B43;--star-off:#2E4060;
  --band-1:#2A3C58;--band-2:#22334D;--band-3:#1A2A42;

  --shadow-xs:0 1px 1px rgba(0,0,0,.3);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 2px 8px -2px rgba(0,0,0,.5);
  --shadow-lg:0 14px 34px -8px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.4);
  --shadow-xl:0 30px 70px -16px rgba(0,0,0,.75),0 4px 12px rgba(0,0,0,.5);
  --glass-pop:#12203A;
  color-scheme:dark;
}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--font-sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"cv11","calt";overflow-x:hidden;min-height:100vh}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;font-weight:600;letter-spacing:-.01em;color:var(--ink);text-wrap:balance}
h1{font-size:28px;line-height:1.15;letter-spacing:-.02em}h2{font-size:20px;line-height:1.25}h3{font-size:15px;line-height:1.35}
p{margin:0;text-wrap:pretty}
b,strong{font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;letter-spacing:inherit}
input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--brand-text);text-decoration:none}
.num,.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.disp{font-family:var(--font-display)}
::selection{background:color-mix(in srgb,var(--brand) 24%,transparent)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ink) 18%,transparent);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Boot (once per session) ---------- */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--navy);transition:opacity .45s var(--ease),visibility .45s}
#splash.out{opacity:0;visibility:hidden}
.splash-inner{display:grid;justify-items:center;gap:12px;animation:fade .5s var(--ease-out) both}
.splash-word{font-family:var(--font-display);color:#fff;font-size:24px;font-weight:600;letter-spacing:-.01em}
.splash-sub{color:rgba(255,255,255,.66);font-size:12.5px}
.splash-bar{width:140px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:4px}
.splash-bar i{display:block;height:100%;width:0;background:#fff;animation:load .8s var(--ease) forwards}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes load{to{width:100%}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{transform:scale(1);opacity:1}}

/* ---------- Global header (suite chrome, Elevate-styled) ---------- */
.gh{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;height:52px;padding:0 14px 0 8px;background:var(--navy);color:#fff;border-bottom:1px solid var(--navy-line)}
.gh-btn{width:36px;height:36px;border-radius:var(--r);display:grid;place-items:center;color:rgba(255,255,255,.82);flex:none;transition:background .15s,color .15s}
.gh-btn:hover,.gh-btn[aria-expanded="true"]{background:rgba(255,255,255,.1);color:#fff}
.gh-btn svg{width:18px;height:18px}
.gh-btn:focus-visible,.gh-search:focus-visible,.gh-tenant:focus-visible,.gh-user:focus-visible,.gh-create:focus-visible,.gh-product:focus-visible{outline:2px solid #fff;outline-offset:1px}
.gh-product{display:flex;align-items:center;gap:10px;color:#fff;padding:4px 8px;border-radius:var(--r);white-space:nowrap}
.gh-product .brand-mark{width:28px;height:28px}
.gh-product b{font-family:var(--font-display);font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1}
.gh-product small{display:block;font-size:11.5px;color:rgba(255,255,255,.68);font-weight:500;margin-top:2px;line-height:1}
.gh-sep{width:1px;height:22px;background:var(--navy-line);margin:0 6px;flex:none}
.gh-suite{font-size:12.5px;color:rgba(255,255,255,.66);white-space:nowrap}
.gh-search{flex:1;max-width:480px;margin:0 auto;display:flex;align-items:center;gap:10px;height:34px;padding:0 8px 0 12px;border-radius:var(--r);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.72);font-size:13px;text-align:left;transition:background .15s,border-color .15s}
.gh-search:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22)}
.gh-search svg{width:16px;height:16px;flex:none}
.gh-search span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh-search kbd{font-family:var(--font-sans);font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:rgba(255,255,255,.8)}
.gh-actions{display:flex;align-items:center;gap:2px;margin-left:auto}
.gh-create{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 11px;border-radius:var(--r);background:var(--brand);color:#fff;font-weight:600;font-size:13px;margin-right:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14);transition:background .15s}
:root[data-theme="dark"] .gh-create{background:#2F6FBD}
.gh-create:hover{background:#3A7BCB}
.gh-create svg{width:15px;height:15px}
.gh-btn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--accent-400);box-shadow:0 0 0 2px var(--navy)}
.gh-btn{position:relative}
.gh-tenant{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;margin:0 4px;border-radius:var(--r);border:1px solid rgba(255,255,255,.16);font-size:12.5px;font-weight:550;color:#fff;white-space:nowrap;transition:background .15s}
.gh-tenant:hover{background:rgba(255,255,255,.08)}
.gh-tenant i{width:8px;height:8px;border-radius:2px;background:#5C93D6;flex:none}
.gh-tenant small{font-size:10.5px;font-weight:600;color:#FFD7A8;background:rgba(240,122,62,.2);padding:1px 6px;border-radius:4px}
.gh-user{border-radius:50%;padding:2px;margin-left:2px}
.gh-user:hover{box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.gh-user .avatar{box-shadow:0 0 0 1.5px rgba(255,255,255,.55)}

/* ---------- App navigation (Lightning-style tab bar) ---------- */
.appnav{position:sticky;top:52px;z-index:25;display:flex;align-items:stretch;gap:12px;height:48px;padding:0 20px 0 12px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 1px 2px rgba(15,28,46,.03)}
.appnav-name{display:flex;align-items:center;gap:8px;padding:0 14px 0 8px;margin-right:4px;border-right:1px solid var(--line-2);font-family:var(--font-display);font-weight:600;font-size:15px;white-space:nowrap;color:var(--ink)}
.appnav-name small{font-family:var(--font-sans);font-size:12px;font-weight:500;color:var(--ink-3)}
.appnav-tabs{display:flex;align-items:stretch;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.appnav-tabs::-webkit-scrollbar{display:none}
.appnav-tabs a{position:relative;display:flex;align-items:center;gap:7px;padding:0 12px;color:var(--ink-2);font-size:13.5px;font-weight:500;white-space:nowrap;transition:color .15s,background .15s}
.appnav-tabs a svg{width:16px;height:16px;color:var(--ink-4)}
.appnav-tabs a:hover{color:var(--ink);background:var(--surface-3)}
.appnav-tabs a.active{color:var(--ink);font-weight:600}
.appnav-tabs a.active svg{color:var(--brand)}
.appnav-tabs a.active::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--brand)}
.appnav-tabs a:focus-visible{outline-offset:-3px}
.nav-count{font-size:11px;font-weight:600;color:var(--ink-2);background:var(--surface-4);border-radius:10px;padding:0 6px;line-height:18px;font-variant-numeric:tabular-nums}
.nav-new{font-size:10.5px;font-weight:600;color:var(--ok);background:var(--ok-50);border-radius:10px;padding:0 6px;line-height:18px}
.appnav-right{display:flex;align-items:center;gap:10px;flex:none}
.cycle-pill{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px;border-radius:14px;background:var(--brand-50);color:var(--brand-text);font-size:12px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.cycle-pill i{width:7px;height:7px;border-radius:50%;background:var(--brand)}
.persona-chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 10px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);font-size:12.5px;white-space:nowrap;transition:border-color .15s,background .15s}
.persona-chip:hover{background:var(--surface-3)}
.persona-chip .lbl{color:var(--ink-3)}
.persona-chip b{font-weight:600;color:var(--ink)}
.persona-chip svg{width:14px;height:14px;color:var(--ink-3)}

/* ---------- Page ---------- */
.page{padding:24px 28px 56px;max-width:1440px;width:100%;margin:0 auto;animation:pageIn .35s var(--ease-out)}
@keyframes pageIn{from{opacity:0;transform:translateY(6px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{margin-top:4px}
.page-head p{color:var(--ink-3);margin-top:6px;font-size:14px;max-width:760px}
.page-head .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--brand-text);display:inline-flex;align-items:center;gap:8px}
.label{font-size:12px;font-weight:600;color:var(--ink-3);margin-bottom:8px}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 12px}
.sec-title h2{font-size:17px}

/* ---------- Primitives ---------- */
.grid{display:grid;gap:16px}
.g-12{grid-template-columns:repeat(12,minmax(0,1fr))}
.s-2{grid-column:span 2}.s-3{grid-column:span 3}.s-4{grid-column:span 4}.s-5{grid-column:span 5}.s-6{grid-column:span 6}.s-7{grid-column:span 7}.s-8{grid-column:span 8}.s-9{grid-column:span 9}.s-12{grid-column:span 12}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-xs);padding:18px 20px;position:relative;min-width:0;transition:box-shadow .2s var(--ease),border-color .2s}
.card.hover:hover{box-shadow:var(--shadow);border-color:var(--line-strong)}
.card.flush{padding:0;overflow:hidden}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;min-height:20px}
.card-head h3{font-size:15px}
.card-head p{color:var(--ink-3);font-size:12.5px;margin-top:2px}
.card-head > svg{flex:none;margin-top:1px}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px -20px -18px;padding:10px 20px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--ink-3);background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
.card-foot a,.card-foot button{font-weight:600;color:var(--brand-text)}
.reveal{opacity:0;transform:translateY(8px)}
.reveal.in{animation:revealIn .45s var(--ease-out) forwards}
@keyframes revealIn{from{opacity:0;transform:translateY(8px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border-radius:var(--r);font-weight:600;font-size:13px;white-space:nowrap;border:1px solid transparent;transition:background .15s,border-color .15s,color .15s,box-shadow .15s;position:relative;overflow:hidden}
.btn svg{width:15px;height:15px}
.btn:active{transform:translateY(.5px)}
.btn-primary{background:var(--brand);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 2px rgba(15,28,46,.12)}
.btn-primary:hover{background:var(--brand-600)}
:root[data-theme="dark"] .btn-primary{background:#2F6FBD}
:root[data-theme="dark"] .btn-primary:hover{background:#3A7BCB}
.btn-accent{background:var(--accent);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(15,28,46,.12)}
.btn-accent:hover{background:#B5410A}
:root[data-theme="dark"] .btn-accent{background:#D45614}
.btn-ghost{background:var(--surface);border-color:var(--line-strong);color:var(--ink);box-shadow:var(--shadow-xs)}
.btn-ghost:hover{background:var(--surface-3)}
.btn-light{background:#fff;color:#0F1C2E}
.btn-link{height:auto;padding:0;color:var(--brand-text);font-weight:600}
.btn-link:hover{text-decoration:underline}
.btn-sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:var(--r-sm)}
.ripple{display:none}
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;font-size:11.5px;font-weight:600;padding:0 7px;border-radius:4px;background:var(--surface-4);color:var(--ink-2);white-space:nowrap}
.badge.blue{background:var(--brand-50);color:var(--brand-text);box-shadow:inset 0 0 0 1px var(--brand-line)}
.badge.orange{background:var(--accent-50);color:var(--accent-text);box-shadow:inset 0 0 0 1px var(--accent-line)}
.badge.green{background:var(--ok-50);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok-line)}
.badge.yellow{background:var(--warn-50);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn-line)}
.badge.red{background:var(--bad-50);color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad-line)}
.badge.solid{background:var(--brand);color:#fff}
.badge.outline{background:transparent;box-shadow:inset 0 0 0 1px var(--line-strong)}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.avatar{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none;font-size:12px;position:relative;box-shadow:0 0 0 2px var(--surface)}
.av-stack{display:flex}.av-stack .avatar{margin-left:-8px}.av-stack .avatar:first-child{margin-left:0}
.muted{color:var(--ink-3)}.small{font-size:13px}.xs{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.s-4.stack>.card:only-child,.s-4.stack>.card:last-child{flex:1}
.divider{height:1px;background:var(--line-2);margin:16px 0}
/* Underline tabs (sub-navigation inside a page) */
.tabs{display:inline-flex;gap:4px;position:relative;flex-wrap:nowrap;max-width:100%;overflow-x:auto;scrollbar-width:none;flex:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;z-index:1;height:38px;padding:0 12px;font-weight:500;color:var(--ink-3);font-size:13.5px;white-space:nowrap;flex:none;transition:color .15s}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);font-weight:600}
.tabs .pill{position:absolute;z-index:2;top:auto!important;bottom:-1px!important;height:3px!important;border-radius:3px 3px 0 0;background:var(--brand);transition:left .3s var(--ease-out),width .3s var(--ease-out)}
.tabs.seg{border:1px solid var(--line-strong);border-radius:var(--r);padding:2px;gap:2px;background:var(--surface-3)}
.tabs.seg button{height:26px;padding:0 10px;font-size:12.5px;border-radius:var(--r-sm)}
.tabs.seg .pill{top:2px!important;bottom:2px!important;height:auto!important;border-radius:var(--r-sm);background:var(--surface);box-shadow:var(--shadow-sm);z-index:0}
:root[data-theme="dark"] .tabs.seg .pill{background:var(--surface-4)}
.page-tabs{margin-bottom:18px;display:block;border-bottom:1px solid var(--line)}
.page-tabs .tabs{border-bottom:0}
.progress{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.progress i{display:block;height:100%;border-radius:3px;background:var(--brand);width:0;transition:width 1s var(--ease-out)}
.progress.orange i{background:var(--warn-fill)}
.progress.green i{background:var(--ok-fill)}
.progress.win i{background:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:4px 11px;line-height:1.35;border-radius:16px;border:1px solid var(--line-strong);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink-2);transition:border-color .15s,background .15s,color .15s}
.chip:hover{background:var(--surface-3);color:var(--ink)}
.chip.on{border-color:var(--brand);color:var(--brand-text);background:var(--brand-50);font-weight:600}
.table{width:100%;border-collapse:separate;border-spacing:0}
.table th{font-size:12px;font-weight:600;color:var(--ink-3);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.table td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.table tbody tr:last-child td{border-bottom:0}
.table tbody tr:hover td{background:var(--surface-2)}
.table .r{text-align:right}
.table-wrap{overflow-x:auto;margin:0 -20px -18px;border-top:1px solid var(--line-2)}
.table-wrap .table th:first-child,.table-wrap .table td:first-child{padding-left:20px}
.table-wrap .table th:last-child,.table-wrap .table td:last-child{padding-right:20px}
.kpi .ic{width:30px;height:30px;border-radius:var(--r);display:grid;place-items:center;background:var(--brand-50);color:var(--brand-text);flex:none}
.kpi .ic svg{width:16px;height:16px}
.kpi-l{font-size:13px;color:var(--ink-2);font-weight:600}
.kpi .v{font-family:var(--font-display);font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1;margin-top:12px;font-variant-numeric:tabular-nums}
.kpi .v small{font-family:var(--font-sans);font-size:13px;color:var(--ink-3);font-weight:500;letter-spacing:0}
.trend{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:2px;height:20px;padding:0 6px;border-radius:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.trend svg{width:12px;height:12px}
.trend.up{color:var(--ok);background:var(--ok-50)}.trend.down{color:var(--bad);background:var(--bad-50)}
.spark{width:100%;height:34px;margin-top:10px;overflow:visible;display:block}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.6s var(--ease) forwards}
.fade-area{opacity:0;animation:fade .8s .5s forwards}

/* ---------- Bullet chart (signature: performance vs target) ---------- */
.bullet{position:relative;height:16px;border-radius:2px;overflow:visible}
.bullet .bands{position:absolute;inset:0;display:flex;border-radius:2px;overflow:hidden}
.bullet .bands span{height:100%}
.bullet .bands span:nth-child(1){background:var(--band-1)}
.bullet .bands span:nth-child(2){background:var(--band-2)}
.bullet .bands span:nth-child(3){background:var(--band-3)}
.bullet .bar{position:absolute;left:0;top:50%;height:6px;margin-top:-3px;width:0;background:var(--brand-700);border-radius:0 2px 2px 0;transition:width 1.1s var(--ease-out)}
:root[data-theme="dark"] .bullet .bar{background:var(--brand-400)}
.bullet.hit .bar,:root[data-theme="dark"] .bullet.hit .bar{background:var(--accent)}
.bullet.bad .bar,:root[data-theme="dark"] .bullet.bad .bar{background:var(--bad-fill)}
.bullet.low .bar,:root[data-theme="dark"] .bullet.low .bar{background:var(--warn-fill)}
.bullet .tgt{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px}
.bullet .prev{position:absolute;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 1.5px var(--ink-3)}
.bullet.sm{height:12px}.bullet.sm .bar{height:4px;margin-top:-2px}
.bullet-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:5px;font-variant-numeric:tabular-nums}
.bullet-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-3)}
.bullet-legend span{display:inline-flex;align-items:center;gap:6px}
.bullet-legend .lg-bar{width:14px;height:5px;background:var(--brand-700);border-radius:1px}
:root[data-theme="dark"] .bullet-legend .lg-bar{background:var(--brand-400)}
.bullet-legend .lg-tgt{width:2px;height:12px;background:var(--ink)}
.bullet-legend .lg-win{width:14px;height:5px;background:var(--accent);border-radius:1px}
.bullet-legend .lg-band{width:14px;height:10px;background:linear-gradient(90deg,var(--band-1) 33%,var(--band-2) 33% 66%,var(--band-3) 66%)}

/* KPI scorecard tiles */
.kpi-tile{display:flex;flex-direction:column;gap:0}
.kpi-tile .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi-tile .v{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.kpi-tile .of{font-family:var(--font-sans);font-size:13px;color:var(--ink-3);font-weight:500}
.kpi-tile .bullet{margin-top:14px}
.kpi-tile .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-3);margin-top:8px}
.kpi-tile .meta b{color:var(--ink);font-weight:600}
.kpi-tile .meta .win{color:var(--accent-text);font-weight:600}

/* Empty & loading states */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:32px 20px;color:var(--ink-3)}
.empty .em-ic{width:40px;height:40px;border-radius:var(--r-lg);display:grid;place-items:center;background:var(--surface-3);border:1px solid var(--line);color:var(--ink-3);margin-bottom:6px}
.empty .em-ic svg{width:18px;height:18px}
.empty b{color:var(--ink);font-size:14px;font-weight:600}
.empty p{font-size:12.5px;max-width:320px}
.empty .btn{margin-top:10px}
.skel{display:block;height:10px;border-radius:4px;margin:8px 0;background:linear-gradient(90deg,var(--track) 0%,var(--surface-4) 50%,var(--track) 100%);background-size:200% 100%;animation:shimmer 1.3s linear infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

/* ---------- Home header ---------- */
.home-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 28px;align-items:end;margin-bottom:20px}
.home-head h1{font-size:30px;margin-top:4px}
.home-head p{color:var(--ink-2);margin-top:6px;font-size:14.5px;max-width:720px}
.home-head p b{color:var(--ink)}
.countdown-card{display:flex;align-items:center;gap:16px;padding:12px 14px 12px 16px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-xs)}
.countdown-card .lbl{font-size:12px;color:var(--ink-3);line-height:1.35}
.countdown-card .lbl b{display:block;color:var(--ink);font-size:13px}
.countdown{display:flex;gap:4px}
.countdown div{min-width:44px;text-align:center;padding:4px 4px 3px;border-radius:var(--r-sm);background:var(--surface-3)}
.countdown b{font-family:var(--font-display);font-size:20px;font-weight:600;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.countdown small{font-size:10.5px;color:var(--ink-3)}

/* ---------- Path (Lightning-style stage chevrons for the review cycle) ---------- */
.path{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;padding:1px 0}
.path::-webkit-scrollbar{display:none}
.path .st{flex:1 0 118px;position:relative;min-height:46px;padding:6px 14px 6px 22px;display:flex;flex-direction:column;justify-content:center;background:var(--surface-4);color:var(--ink-2);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%)}
.path .st:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);border-radius:var(--r) 0 0 var(--r);padding-left:14px}
.path .st:last-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,12px 50%);border-radius:0 var(--r) var(--r) 0}
.path .st b{font-size:12.5px;font-weight:600;line-height:1.2;display:flex;align-items:center;gap:5px;white-space:nowrap}
.path .st b svg{width:13px;height:13px;flex:none}
.path .st small{font-size:11.5px;opacity:.85;white-space:nowrap}
.path .st.done{background:var(--brand-100);color:var(--brand-text)}
.path .st.now{background:var(--brand-600);color:#fff}
:root[data-theme="dark"] .path .st.now{background:#2F6FBD}
.path .st.last-win b{color:inherit}
.path-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin-top:10px}
.path-meta b{color:var(--ink)}

/* ---------- Rings / charts ---------- */
.ring{transform:rotate(-90deg)}
.ring .track{stroke:var(--track)}
.ring .val{transition:stroke-dashoffset 1.4s var(--ease-out)}
.ring-wrap{position:relative;display:grid;place-items:center;flex:none}
.ring-wrap .lbl{position:absolute;text-align:center;line-height:1.1}
.ring-wrap .lbl b{font-family:var(--font-display);font-size:22px;font-weight:600;display:block;font-variant-numeric:tabular-nums}
.chart-grid line{stroke:var(--line-2)}
.chart-axis text{fill:var(--ink-3);font-size:11px;font-family:var(--font-sans);font-variant-numeric:tabular-nums}
.bar-anim{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:build .8s var(--ease) forwards}
@keyframes build{to{transform:scaleY(1)}}
.barh-anim{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:buildx .9s var(--ease-out) forwards}
@keyframes buildx{to{transform:scaleX(1)}}
.hbar-track{height:10px;background:var(--track);border-radius:2px;overflow:hidden}
.hbar-track>div{border-radius:0 2px 2px 0!important}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:2px}
.tooltip{position:fixed;z-index:90;pointer-events:none;background:#0F1C2E;color:#fff;padding:7px 10px;border-radius:var(--r-sm);font-size:12px;line-height:1.45;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;max-width:260px}
:root[data-theme="dark"] .tooltip{background:#E8EEF7;color:#0F1C2E}
.tooltip b{font-weight:600}
.tooltip.on{opacity:1;transform:none}

/* ---------- 9-box ---------- */
.ninebox{display:grid;grid-template-columns:24px repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,1fr) 24px;gap:6px;height:440px}
.nb-cell{border-radius:var(--r);padding:10px;position:relative;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;overflow:hidden;transition:box-shadow .15s,border-color .15s,background .15s}
.nb-cell:hover{border-color:var(--line-strong)}
.nb-cell h4{font-family:var(--font-sans);font-size:12px;font-weight:600;padding-right:28px;line-height:1.3}
.nb-cell .cnt{position:absolute;right:10px;top:6px;font-family:var(--font-display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.nb-cell .people{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.nb-cell.drop{outline:2px dashed var(--brand);outline-offset:-4px;background:var(--brand-50)!important}
.nb-axis{display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.nb-axis.y{writing-mode:vertical-rl;transform:rotate(180deg)}
.dragp{cursor:grab;transition:transform .15s var(--ease-out),box-shadow .15s;display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 2px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink);max-width:100%;min-width:0}
.dragp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dragp .avatar{flex:none}
.dragp:hover{transform:translateY(-1px);box-shadow:var(--shadow-xs);z-index:2}
.dragp:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.dragp.moved{box-shadow:0 0 0 2px var(--brand)}
.nb-hint{font-size:12px;color:var(--ink-3)}
.nb-hint kbd{font:600 11px var(--font-sans);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--ink-2);background:var(--surface)}
.dragp.dragging{opacity:.4}

/* ---------- Heatmap ---------- */
.heat{display:grid;gap:3px;font-size:12px}
.heat .hc{height:32px;border-radius:3px;display:grid;place-items:center;font-weight:600;font-variant-numeric:tabular-nums;opacity:0;animation:fade .4s forwards;cursor:default}
.heat .hl{display:flex;align-items:center;font-weight:500;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.heat .hh{font-weight:600;color:var(--ink-3);text-align:center;font-size:11px;line-height:1.25;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}

/* ---------- Kanban ---------- */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kcol{background:var(--surface-3);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:10px;min-height:280px;transition:background .15s,border-color .15s}
:root[data-theme="dark"] .kcol{background:var(--bg-2)}
.kcol.drop{background:var(--brand-50);border-color:var(--brand);border-style:dashed}
.kcol h4{font-family:var(--font-sans);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;margin:2px 4px 10px}
.kcol .kempty{border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:22px 12px;text-align:center;font-size:12px;color:var(--ink-3)}
.kcard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--tc,var(--brand));border-radius:var(--r);padding:11px 12px;margin-bottom:8px;cursor:grab;box-shadow:var(--shadow-xs);transition:box-shadow .15s,border-color .15s;animation:revealIn .35s var(--ease-out) both}
.kcard:hover{box-shadow:var(--shadow)}
.kcard.dragging{opacity:.4}
.kcard b{font-size:13px;font-weight:600;display:block;margin:7px 0 3px;line-height:1.35}

/* ---------- Career graph ---------- */
.cg-wrap{position:relative;border-radius:var(--r-lg);overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-xs)}
.cg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.cg-svg{display:block;width:100%;height:auto}
.cg-node{cursor:pointer}
.cg-node:focus{outline:none}
.cg-node:focus-visible rect.box{stroke:var(--brand);stroke-width:2.5}
.cg-node rect.box{fill:var(--surface);stroke:var(--line-strong);stroke-width:1;transition:stroke .15s,fill .15s}
.cg-node:hover rect.box{stroke:var(--brand)}
.cg-node text{font-size:11px;font-weight:600;fill:var(--ink);font-family:var(--font-sans)}
.cg-node text.sub{font-size:10px;font-weight:400;fill:var(--ink-3)}
.cg-node.current rect.box{fill:var(--brand-600);stroke:var(--brand-600)}
:root[data-theme="dark"] .cg-node.current rect.box{fill:#2F6FBD;stroke:#2F6FBD}
.cg-node.current text{fill:#fff}
.cg-node.current text.sub{fill:rgba(255,255,255,.85)}
.cg-node.target rect.box{stroke:var(--accent);stroke-width:2;fill:var(--accent-50)}
.cg-node.onpath rect.box{stroke:var(--brand);stroke-width:2;fill:var(--brand-50)}
.cg-node.dim{opacity:.35}
.cg-edge{fill:none;stroke:var(--ink-4);stroke-opacity:.6;stroke-width:1.25;transition:opacity .3s}
.cg-edge.lat{stroke-dasharray:4 4}
.cg-edge.dim{opacity:.18}
.cg-flow{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:6 10;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.cg-pulse{fill:none;stroke:var(--brand);stroke-width:1.5;animation:cgp 2.4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes cgp{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.15,1.45)}}
.cg-track-label{font-size:12px;font-weight:600;fill:var(--ink-2);font-family:var(--font-display)}
.cg-level{font-size:10.5px;font-weight:600;fill:var(--ink-3);font-family:var(--font-sans)}
.cg-traveler{fill:var(--accent);stroke:var(--surface);stroke-width:2}

/* ---------- Drawer / modal / palette / menus ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,16,30,.45);z-index:60;opacity:0;animation:fade .2s forwards}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:61;box-shadow:var(--shadow-xl);transform:translateX(100%);animation:slideIn .35s var(--ease-out) forwards;display:flex;flex-direction:column;overflow:hidden}
@keyframes slideIn{to{transform:none}}
.drawer header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface-2)}
.drawer header h3{font-size:17px}
.drawer .body{padding:20px;overflow:auto;flex:1}
.modal{position:fixed;left:50%;top:50%;z-index:61;width:min(560px,calc(100vw - 32px));max-height:86vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-xl);transform:translate(-50%,-48%);opacity:0;animation:modalIn .3s var(--ease-out) forwards}
@keyframes modalIn{to{transform:translate(-50%,-50%);opacity:1}}
.modal header{padding:18px 22px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line-2)}
.modal header h2{font-size:18px}
.modal .body{padding:18px 22px}
.modal footer{padding:12px 22px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line-2);background:var(--surface-2)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.input{min-height:36px;padding:7px 11px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s;width:100%;font-size:13.5px}
.input:hover{border-color:var(--ink-4)}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-100)}
textarea.input{min-height:96px;resize:vertical;line-height:1.55}
:root[data-theme="dark"] .input{background:var(--surface-2)}
.palette{position:fixed;left:50%;top:12vh;transform:translateX(-50%) translateY(-6px);opacity:0;z-index:61;width:min(640px,calc(100vw - 24px));background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow-xl);overflow:hidden;animation:palIn .2s var(--ease-out) forwards;border:1px solid var(--line)}
@keyframes palIn{to{transform:translateX(-50%);opacity:1}}
.palette input{width:100%;border:0;outline:0;padding:16px 18px;font-size:16px;background:transparent;border-bottom:1px solid var(--line)}
.palette input::placeholder{color:var(--ink-4)}
.palette .res{max-height:min(400px,60vh);overflow:auto;padding:6px}
.palette .it{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:var(--r-sm);cursor:pointer;font-size:13.5px}
.palette .it svg{width:16px;height:16px;color:var(--ink-3)}
.palette .it.sel{background:var(--brand-50);color:var(--ink);box-shadow:inset 3px 0 0 var(--brand)}
.palette .it.sel svg{color:var(--brand)}
.palette .grp{font-size:11.5px;font-weight:600;color:var(--ink-3);padding:10px 12px 4px}
.kbd{font-family:var(--font-sans);font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--surface-3);border:1px solid var(--line-strong);color:var(--ink-2)}
.toasts{position:fixed;right:20px;bottom:20px;z-index:95;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 10px;border-radius:var(--r-lg);background:#0F1C2E;color:#fff;box-shadow:var(--shadow-lg);min-width:280px;max-width:420px;animation:toastIn .35s var(--ease-out);border-left:3px solid var(--brand-400)}
:root[data-theme="dark"] .toast{background:#1A2A44;border:1px solid var(--line-strong);border-left:3px solid var(--brand-400)}
.toast.out{animation:toastOut .3s var(--ease) forwards}
.toast .ti{width:26px;height:26px;border-radius:var(--r-sm);display:grid;place-items:center;background:rgba(255,255,255,.1);color:#9CC2F0;flex:none}
.toast .ti svg{width:15px;height:15px}
@keyframes toastIn{from{transform:translateY(12px);opacity:0}}
@keyframes toastOut{to{transform:translateX(24px);opacity:0}}
.menu:focus{outline:none}
.menu{position:fixed;background:var(--glass-pop);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-xl);padding:6px;min-width:260px;max-width:calc(100vw - 16px);z-index:70;animation:menuIn .16s var(--ease-out);color:var(--ink);max-height:calc(100vh - 70px);overflow:auto}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px)}}
.menu-head{padding:8px 10px 4px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.menu button,.menu a.mi{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:var(--r-sm);text-align:left;color:var(--ink);font-size:13px}
.menu button svg,.menu a.mi svg{width:16px;height:16px;color:var(--ink-3);flex:none}
.menu button:hover,.menu a.mi:hover,.menu button:focus-visible,.menu a.mi:focus-visible{background:var(--surface-3);outline:none}
.menu button.on{background:var(--brand-50)}
.menu .sep{height:1px;background:var(--line-2);margin:5px 0}
.menu .sub{font-size:12px;color:var(--ink-3)}
.switcher{width:min(620px,calc(100vw - 16px));padding:0}
.switcher .sw-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px 8px;font-size:12px;font-weight:600;color:var(--ink-3)}
.switcher .sw-head a{font-weight:600;font-size:12px}
.switcher .sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:2px;padding:0 8px 8px}
.switcher .sw-app{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r);color:var(--ink);min-width:0}
.switcher .sw-app:hover,.switcher .sw-app:focus-visible{background:var(--surface-3);outline:none}
.switcher .sw-app[aria-current="true"]{background:var(--brand-50);box-shadow:inset 0 0 0 1px var(--brand-line)}
.switcher .tile{width:32px;height:32px;border-radius:var(--r);display:grid;place-items:center;color:#fff;flex:none}
.switcher .tile svg{width:16px;height:16px}
.switcher .sw-app b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switcher .sw-app span span{display:block;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switcher .sw-cur{margin:0 8px 8px;padding:10px;border-radius:var(--r);border:1px solid var(--brand-line);background:var(--brand-50);display:flex;align-items:center;gap:12px}
.switcher .sw-cur b{font-family:var(--font-display);font-size:15px}
.switcher .sw-foot{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line-2);font-size:12.5px;background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
.notif{width:min(380px,calc(100vw - 16px));padding:0}
.menu .nh .btn{width:auto;display:inline-flex;padding:0 10px}
.notif .nh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.notif .ni{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-2);cursor:pointer;align-items:flex-start;width:100%;text-align:left}
.notif .ni:hover{background:var(--surface-2)}
.notif .ni .ic{width:28px;height:28px;border-radius:var(--r-sm);display:grid;place-items:center;flex:none}
.notif .ni .ic svg{width:15px;height:15px}
.notif .ni.unread{box-shadow:inset 3px 0 0 var(--brand)}
.keys{display:grid;gap:6px}.keys div{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.keys span{display:flex;gap:4px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99}

/* ---------- Misc components ---------- */
.list-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:var(--r);transition:background .15s}
.list-item:hover{background:var(--surface-3)}
button.list-item{width:100%;text-align:left}
.check{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--ink-4);display:grid;place-items:center;flex:none;transition:.2s}
.check.on{background:var(--brand);border-color:var(--brand);color:#fff}
.check svg{width:11px;height:11px;opacity:0;transform:scale(.4);transition:.2s var(--spring)}.check.on svg{opacity:1;transform:none}
.done-text{text-decoration:line-through;color:var(--ink-3)}
.goal{padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-lg);transition:border-color .15s,box-shadow .15s;background:var(--surface);box-shadow:var(--shadow-xs)}
.goal:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.goal[data-goal]{cursor:pointer}
.goal .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink-3);font-size:12px;margin-top:10px}
.goal-pct{font-family:var(--font-display);font-size:22px;font-weight:600}
.kudos{padding:16px 18px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-xs);position:relative}
.tilt{}
.ai{border-radius:var(--r-lg);border:1px solid var(--brand-line);background:var(--brand-50)}
.ai>div{padding:14px 16px}
.ai-head{font-weight:600;font-size:13px;color:var(--brand-text);gap:8px}
.caret{display:inline-block;width:2px;height:15px;background:var(--brand);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.skill-bar{display:grid;grid-template-columns:minmax(0,1fr) 150px 40px;gap:12px;align-items:center;padding:8px 0}
.lvl{display:flex;gap:3px}
.lvl i{flex:1;height:8px;border-radius:2px;background:var(--track);transition:background .3s}
.lvl i.f{background:var(--brand)}
.lvl i.req{box-shadow:inset 0 0 0 2px var(--ink)}
.lvl i.f.req{box-shadow:inset 0 0 0 2px var(--ink)}
.comp-card{padding:16px;border-radius:var(--r-lg);border:1px solid var(--line);cursor:pointer;transition:border-color .15s,box-shadow .15s;background:var(--surface);box-shadow:var(--shadow-xs);border-top:3px solid var(--cc,var(--brand))}
.comp-card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.comp-card b{font-weight:600}
.comp-card .ic{width:30px;height:30px;border-radius:var(--r);display:grid;place-items:center;margin-bottom:10px}
.comp-card .ic svg{width:16px;height:16px}
.mini-stat{padding:10px 12px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line-2)}
:root[data-theme="dark"] .mini-stat{background:var(--surface-3)}
.mini-stat b{font-family:var(--font-display);font-size:20px;font-weight:600;display:block;font-variant-numeric:tabular-nums}
.pyr{display:grid;grid-template-columns:1fr 50px 1fr;gap:6px;align-items:center;font-size:11.5px}
.pyr b{font-weight:600;color:var(--ink-3)}
.pyr .l,.pyr .r{height:16px;border-radius:2px}
.pyr .l{justify-self:end;background:var(--brand)}
.pyr .r{background:var(--teal)}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);transition:border-color .15s,background .15s,color .15s}
.scale button b{font-family:var(--font-display);font-size:17px;font-weight:600;line-height:1.1}
.scale button span{font-size:11px;color:var(--ink-3);white-space:nowrap}
.scale button:hover{background:var(--surface-3)}
.scale button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.scale button.on span{color:rgba(255,255,255,.9)}
.rate{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden}
.rate button{min-width:38px;height:32px;padding:0 8px;font-weight:600;font-size:13px;color:var(--ink-2);border-left:1px solid var(--line-strong);transition:background .15s,color .15s;font-variant-numeric:tabular-nums}
.rate button:first-child{border-left:0}
.rate button:hover{background:var(--surface-3)}
.rate button.on{background:var(--brand);color:#fff}
.rate-l{font-size:12px;color:var(--ink-3);min-width:110px;text-align:right}
.rank{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;font-family:var(--font-display);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--surface-4);color:var(--ink-2);flex:none}
.rank.r1{background:var(--accent);color:#fff}
.rank.r2,.rank.r3{background:var(--brand-100);color:var(--brand-text)}
.rank-n{display:inline-grid;place-items:center;width:26px;font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}

/* Leaderboard (signature) */
.lb-row{display:grid;grid-template-columns:28px 32px minmax(0,1.2fr) minmax(80px,2fr) 72px;gap:12px;align-items:center;padding:8px 10px;border-radius:var(--r)}
.lb-row:hover{background:var(--surface-2)}
.lb-row.me{background:var(--brand-50);box-shadow:inset 3px 0 0 var(--brand)}
.lb-row .nm b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-row .nm span{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.lb-row .val{text-align:right;font-family:var(--font-display);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.lb-row .gap{font-size:11.5px;color:var(--ink-3);font-family:var(--font-sans);font-weight:500;display:block}
.lb-bar{height:10px;background:var(--track);border-radius:2px;overflow:hidden}
.lb-bar>div{height:100%;background:var(--brand-700);border-radius:0 2px 2px 0}
:root[data-theme="dark"] .lb-bar>div{background:var(--brand-400)}
.lb-bar.win>div{background:var(--accent)}
.lb-head{display:grid;grid-template-columns:28px 32px minmax(0,1.2fr) minmax(80px,2fr) 72px;gap:12px;padding:0 10px 6px;font-size:11.5px;font-weight:600;color:var(--ink-3);border-bottom:1px solid var(--line-2);margin-bottom:4px}

/* Recognition feed (signature) */
.feed{display:flex;flex-direction:column}
.feed-item{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:16px 0;border-bottom:1px solid var(--line-2)}
.feed-item:last-child{border-bottom:0}
.feed-item .who{font-size:13.5px;line-height:1.4}
.feed-item .who .muted{font-weight:400}
.feed-item .msg{margin:6px 0 10px;color:var(--ink);font-size:14px;line-height:1.55}
.feed-item .foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.val-chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:4px;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface-3);border:1px solid var(--line)}
.val-chip i{width:8px;height:8px;border-radius:2px;flex:none}
.sum-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.sum-strip>div{background:var(--surface);padding:10px 14px}
.sum-strip span{display:block;font-size:12px;color:var(--ink-3)}
.sum-strip b{font-family:var(--font-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.mini-tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
.mini-tbl th{font-weight:600;color:var(--ink-3);text-align:right;padding:4px 0;border-bottom:1px solid var(--line-2)}
.mini-tbl th:first-child,.mini-tbl td:first-child{text-align:left}
.mini-tbl td{padding:5px 0;text-align:right;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line-2);color:var(--ink-2)}
.mini-tbl tr:last-child td{border-bottom:0}
.priv-note{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--ink-3);margin-top:10px}
.priv-note svg{width:14px;height:14px;flex:none;margin-top:1px}
.like{display:inline-flex;align-items:center;gap:5px;color:var(--ink-3);font-weight:600;font-size:12.5px;height:26px;padding:0 8px;border-radius:var(--r-sm)}
.like:hover{background:var(--surface-3);color:var(--ink)}
.like svg{width:15px;height:15px}
.mini-feed .fi{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.mini-feed .fi:last-child{border-bottom:0;padding-bottom:0}
.mini-feed .fi:first-child{padding-top:0}

/* Performer of the month */
.pom{border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-xs);overflow:hidden}
.pom .pom-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line-2);background:var(--accent-50)}
.pom .pom-top b{color:var(--accent-text);font-size:13px;display:inline-flex;gap:8px;align-items:center}
.pom .pom-top svg{width:16px;height:16px}
.pom .pom-body{padding:20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:center}
.pom h2{font-size:24px}
.pom .stat-row{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:520px){.stat-row{grid-template-columns:repeat(auto-fit,minmax(86px,1fr))}}
.pom .pom-top svg{flex:none}

.footer{padding:18px 28px 26px;color:var(--ink-3);font-size:12px;display:flex;justify-content:space-between;gap:10px 18px;flex-wrap:wrap;border-top:1px solid var(--line);max-width:1440px;margin:0 auto}
.footer a{color:var(--ink-2)}
.footer a:hover{color:var(--ink);text-decoration:underline}
.footer .links{display:flex;gap:16px;flex-wrap:wrap}
.hide-sm{}
noscript{display:block;padding:40px;text-align:center;color:var(--ink-3)}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);color:var(--ink-3);flex:1;min-width:0}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-100)}
.search svg{flex:none}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--ink);font-size:13.5px}
.search input::placeholder{color:var(--ink-4)}
.callout{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line-2);font-size:13px}
.callout svg{width:16px;height:16px;flex:none;margin-top:2px}
.callout.warn{background:var(--warn-50);border-color:var(--warn-line)}
.callout.info{background:var(--brand-50);border-color:var(--brand-line)}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.stat-row>div{background:var(--surface);padding:10px 12px}
.stat-row>div>span{display:block;font-size:12px;color:var(--ink-3)}
.stat-row b{font-family:var(--font-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}

::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}

@media (max-width:1180px){.s-2{grid-column:span 4}.s-3{grid-column:span 6}.s-4{grid-column:span 6}.s-5,.s-7,.s-8,.s-9{grid-column:span 12}.gh-tenant,.gh-suite,.gh-sep{display:none}.cycle-pill{display:none}}
@media (max-width:900px){
  .gh{padding:0 6px 0 4px;gap:2px}
  .gh-product small{display:none}
  .gh-search{flex:0 0 36px;width:36px;height:36px;padding:0;justify-content:center;margin:0 0 0 auto;background:transparent;border-color:transparent;color:rgba(255,255,255,.85)}
  .gh-search span,.gh-search kbd{display:none}
  .gh-search svg{width:18px;height:18px}
  .gh-actions{margin-left:0}
  .gh-create span,.gh-create .chev{display:none}
  .gh-create{width:34px;padding:0;justify-content:center;margin-right:2px}
  .gh-help,.gh-theme{display:none}
  .appnav{padding:0 8px 0 4px;gap:6px}
  .appnav-name{display:none}
  .appnav-tabs a{padding:0 10px}
  .appnav-tabs a svg{display:none}
  .persona-chip .lbl{display:none}
  .page{padding:18px 16px 64px}
  .s-3,.s-4,.s-6{grid-column:span 12}
  .s-2{grid-column:span 6}
  .hide-sm{display:none!important}
  .home-head{grid-template-columns:1fr}
  .home-head h1{font-size:24px}
  .kanban{grid-template-columns:1fr}
  .kcol{min-height:0}
  .ninebox{height:520px;gap:4px;grid-template-columns:18px repeat(3,minmax(0,1fr))}
  .nb-cell{padding:7px}
  .nb-cell .cnt{font-size:16px;right:7px}
  .nb-cell h4{font-size:11px;padding-right:16px}
  .dragp{padding:2px}.dragp span{display:none}
  .kpi .v{font-size:28px}
  h1{font-size:24px}
  .footer{padding:18px 16px 28px}
  .skill-bar{grid-template-columns:minmax(0,1fr) 100px 36px}
  .toasts{left:12px;right:12px;bottom:16px}
  .toast{min-width:0;max-width:none}
  .pom .pom-body{grid-template-columns:1fr}
  .lb-row,.lb-head{grid-template-columns:24px 28px minmax(0,1fr) 64px;gap:10px}
  .lb-row .lb-bar,.lb-head .hb{display:none}
}
@media (max-width:520px){
  .scale button span{font-size:9.5px}
  .gh-tenant{display:none}
  .countdown div{min-width:40px}
  .countdown-card{flex-wrap:wrap}
  .rate-l{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

/* ---------- Motion helpers ---------- */
function countUp(el){const to=parseFloat(el.dataset.count),d=+(el.dataset.dec||0),dur=+(el.dataset.dur||1400),pre=el.dataset.pre||'',suf=el.dataset.suf||'';const t0=performance.now();
  const step=t=>{const k=Math.max(0,Math.min(1,(t-t0)/dur)),e=1-Math.pow(1-k,4);el.textContent=pre+fmt(to*e,d)+suf;if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
/* grow a bar to its value; if the width transition never starts (throttled frames), snap to the value */
function setW(x,ms){setTimeout(()=>{x.style.width=x.dataset.w+'%';setTimeout(()=>{if(x.isConnected&&+x.dataset.w>0&&parseFloat(getComputedStyle(x).width)<1){x.style.transition='none';x.style.width=x.dataset.w+'%'}},1600)},ms)}
function setOff(x,ms){setTimeout(()=>{x.style.strokeDashoffset=x.dataset.off;setTimeout(()=>{if(x.isConnected&&Math.abs(parseFloat(getComputedStyle(x).strokeDashoffset)-parseFloat(x.dataset.off))>1){x.style.transition='none';x.style.strokeDashoffset=x.dataset.off}},1900)},ms)}
function animateIn(root=document){
  const fire=el=>{if(el._f)return;el._f=1;io.unobserve(el);
    if(el.classList.contains('reveal')){el.style.animationDelay=(el.dataset.d||0)+'ms';el.classList.add('in');const fin=ev=>{if(ev.target!==el)return;el.removeEventListener('animationend',fin);el.classList.remove('reveal','in');el.style.animationDelay=''};el.addEventListener('animationend',fin)}
    $$('[data-count]',el).forEach(x=>{if(!x._c){x._c=1;setTimeout(()=>countUp(x),(+el.dataset.d||0))}});
    $$('.progress i[data-w],.bullet i[data-w]',el).forEach(x=>setW(x,120+(+el.dataset.d||0)));
    $$('.ring .val[data-off]',el).forEach(x=>setOff(x,150+(+el.dataset.d||0)));
    $$('[data-radar]',el).forEach(x=>animateRadar(x));
  };
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)fire(e.target)}),{threshold:.08});
  const els=$$('.reveal',root);let i=0;els.forEach(el=>{if(!el.dataset.d){el.dataset.d=Math.min(i*60,600);i++}io.observe(el)});
  /* safety net: if the observer is throttled (background tab, headless, print), never leave content hidden or charts empty */
  setTimeout(()=>{els.forEach(el=>{if(el.isConnected&&!el._f)fire(el)});io.disconnect()},1800);
  $$('[data-count]',root).forEach(x=>{if(!x.closest('.reveal'))countUp(x)});
  $$('.ring .val[data-off]',root).forEach(x=>{if(!x.closest('.reveal'))setOff(x,150)});
  $$('.progress i[data-w],.bullet i[data-w]',root).forEach(x=>{if(!x.closest('.reveal'))setW(x,120)});
}
function ripple(e){const b=e.target.closest('.btn');if(!b)return;const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height);const sp=document.createElement('span');sp.className='ripple';sp.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;b.appendChild(sp);setTimeout(()=>sp.remove(),600)}
function bindTilt(root){$$('.tilt',root).forEach(el=>{el.onmousemove=e=>{const r=el.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.style.transform=`perspective(900px) rotateY(${x*3}deg) rotateX(${-y*3}deg) translateY(-2px)`};el.onmouseleave=()=>el.style.transform=''})}

/* ---------- Charts ---------- */
function ring(v,size=96,sw=10,color='var(--brand)',label='',sub='',max=100){const r=(size-sw)/2,c=2*Math.PI*r,off=c*(1-Math.min(v,max)/max);
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px"><svg class="ring" width="${size}" height="${size}"><circle class="track" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${sw}"/><circle class="val" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${off}"/></svg><div class="lbl">${label}${sub?`<small class="muted xs">${sub}</small>`:''}</div></div>`}
function spark(arr,color='var(--brand)',id){const w=200,h=40,mx=Math.max(...arr),mn=Math.min(...arr);const pts=arr.map((v,i)=>[i*(w/(arr.length-1)),h-4-((v-mn)/(mx-mn||1))*(h-8)]);
  const d=smooth(pts);const gid='sp'+(id||Math.random().toString(36).slice(2));
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".25"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path class="fade-area" d="${d} L${w},${h} L0,${h} Z" fill="url(#${gid})"/><path class="draw" d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
function smooth(p){if(p.length<2)return'';let d=`M${p[0][0]},${p[0][1]}`;for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];d+=` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}return d}
function areaChart(data,{h=220,color='var(--brand)',suffix=''}={}){const w=640,pl=36,pb=26,pt=14,mx=Math.ceil(Math.max(...data.map(d=>d[1]))/250)*250;
  const X=i=>pl+i*((w-pl-10)/(data.length-1)),Y=v=>pt+(h-pt-pb)*(1-v/mx);const pts=data.map((d,i)=>[X(i),Y(d[1])]);const d=smooth(pts);
  let g='';for(let k=0;k<=4;k++){const v=mx*k/4;g+=`<line x1="${pl}" x2="${w-10}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pl-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`}
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="overflow:visible"><defs><linearGradient id="ag" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
  <g class="chart-grid chart-axis">${g}</g>
  <path class="fade-area" d="${d} L${X(data.length-1)},${h-pb} L${pl},${h-pb} Z" fill="url(#ag)"/>
  <path class="draw" d="${d}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round"/>
  ${pts.map((p,i)=>`<g data-tip="<b>${data[i][0]}</b><br>${fmt(data[i][1])}${suffix} employees" style="opacity:0;animation:fade .4s ${0.9+i*.12}s forwards"><circle cx="${p[0]}" cy="${p[1]}" r="12" fill="transparent"/><circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="var(--surface)" stroke="${color}" stroke-width="2.5"/></g>`).join('')}
  <g class="chart-axis">${data.map((d,i)=>`<text x="${X(i)}" y="${h-6}" text-anchor="middle">${d[0]}</text>`).join('')}</g></svg>`}
function donut(segs,size=190,sw=26,center=''){const r=(size-sw)/2,c=2*Math.PI*r,tot=segs.reduce((a,s)=>a+s[1],0);let acc=0;
  const arcs=segs.map((s,i)=>{const len=c*s[1]/tot,gap=segs.length>1?2:0;const el=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${s[2]}" stroke-width="${sw}" stroke-dasharray="0 ${c}" stroke-dashoffset="${-acc}" data-len="${Math.max(len-gap,0)}" data-c="${c}" data-tip="<b>${s[0]}</b><br>${fmt(s[1])} · ${(s[1]/tot*100).toFixed(1)}%" style="transition:stroke-dasharray 1s ${.1+i*.08}s var(--ease),stroke-width .2s;cursor:pointer" onmouseenter="this.style.strokeWidth=${sw+6}" onmouseleave="this.style.strokeWidth=${sw}"/>`;acc+=len;return el}).join('');
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px"><svg class="ring donut" width="${size}" height="${size}" style="overflow:visible">${arcs}</svg><div class="lbl">${center}</div></div>`}
function growDonuts(root){$$('.donut circle[data-len]',root).forEach(c=>requestAnimationFrame(()=>requestAnimationFrame(()=>c.style.strokeDasharray=`${c.dataset.len} ${c.dataset.c}`)))}
function barsH(rows,{color='var(--brand)',max,unit='',labelW=210,dec=0}={}){const mx=max||Math.max(...rows.map(r=>r[1]));
  return `<div class="stack" style="gap:10px">${rows.map((r,i)=>`<div data-tip="<b>${r[0]}</b><br>${fmt(r[1])}${unit}" style="display:grid;grid-template-columns:minmax(80px,min(${labelW}px,42%)) 1fr auto;gap:12px;align-items:center"><span class="small" style="font-weight:550;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r[0]}</span><div class="hbar-track"><div class="barh-anim" style="height:100%;width:${r[1]/mx*100}%;border-radius:6px;background:${r[2]||color};animation-delay:${i*70}ms"></div></div><b class="small num" style="text-align:right;white-space:nowrap">${fmt(r[1],dec)}${unit}</b></div>`).join('')}</div>`}
function radar(axes,series,size=340){const cx=size/2,cy=size/2,R=size/2-58,n=axes.length;const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*R*v/5,cy+Math.sin(a)*R*v/5]};

  const inp=$('input',d),res=$('.res',d);let sel=0,list=[];

    res.innerHTML=list.length?list.map((it,i)=>{const h=it.g!==lg?`<div class="grp">${it.g}</div>`:'';lg=it.g;return h+`<div class="it ${i===sel?'sel':''}" role="option" aria-selected="${i===sel}" data-i="${i}">${it.person?av(it.l,24):icon(it.ic)}<span style="flex:1">${it.l}</span>${it.sub?`<span class="xs muted">${it.sub}</span>`:''}</div>`}).join(''):emptyState('search',`No results for “${esc(inp.value)}”`,'Try a person, role, competency or page name.');

let gPending=0;
addEventListener('keydown',e=>{const typing=/input|textarea|select/i.test(e.target.tagName)||e.target.isContentEditable;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('.palette')?closeOverlay():palette();return}
  if(e.key==='Escape'){closeMenus();closeOverlay();return}

  if(e.key==='g'||e.key==='G'){gPending=Date.now();return}
  if(gPending&&Date.now()-gPending<1200&&/^[1-7]$/.test(e.key)){gPending=0;const k=NAV.flatMap(g=>g.items)[+e.key-1];k&&go(k[0])}});

/* ---------- Signature: bullet chart (actual vs target over qualitative bands) ---------- */
function bullet(v,t,{max,invert=false,prev,cls='',tip='',label=''}={}){
  const mx=max||Math.max(t*1.25,v*1.06,prev||0);const pc=x=>Math.max(0,Math.min(100,x/mx*100));
  const bands=invert?[[0,t,'--band-3'],[t,t*1.15,'--band-2'],[t*1.15,mx,'--band-1']]:[[0,t*.7,'--band-1'],[t*.7,t,'--band-2'],[t,mx,'--band-3']];
  const state=invert?(v>t?'bad':''):(v>=t?'hit':v/t<.7?'low':'');
  const aria=label||`${fmt(v,v%1?1:0)} against a target of ${fmt(t,t%1?1:0)}`;
  return `<div class="bullet ${state} ${cls}" role="img" aria-label="${aria}" ${tip?`data-tip="${tip}"`:''}><div class="bands">${bands.map(([a,b,c])=>`<span style="width:${pc(b)-pc(a)}%;background:var(${c})"></span>`).join('')}</div><i class="bar" data-w="${pc(v)}"></i>${prev!=null?`<span class="prev" style="left:${pc(prev)}%"></span>`:''}<span class="tgt" style="left:${pc(t)}%"></span></div>`}
const bulletLegend=(prev=true)=>`<div class="bullet-legend"><span><i class="lg-bar"></i>Actual</span><span><i class="lg-tgt"></i>Target</span>${prev?'<span><i class="prev" style="position:static;display:inline-block;width:7px;height:7px;border-radius:50%;box-shadow:0 0 0 1.5px var(--ink-3)"></i>Last half</span>':''}<span><i class="lg-win"></i>Target hit</span><span><i class="lg-band"></i>&lt;70% · 70–100% · &gt;100% of target</span></div>`;
function sparkMini(arr,color='var(--brand)'){const w=84,h=26,mx=Math.max(...arr),mn=Math.min(...arr);const pts=arr.map((v,i)=>[i*(w/(arr.length-1)),h-3-((v-mn)/(mx-mn||1))*(h-6)]);const l=pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" style="overflow:visible;flex:none"><path class="draw" d="${smooth(pts)}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${l[0]}" cy="${l[1]}" r="2.6" fill="${color}"/></svg>`}

function bindNineBox(p){const draw=()=>{$$('.nb-cell',p).forEach(c=>{const [pf,pt]=c.dataset.cell.split('-').map(Number);const ppl=TEAM.filter(t=>t.perf===pf&&t.pot===pt);$('.cnt',c).textContent=ppl.length;$('.people',c).innerHTML=ppl.map(t=>`<div class="dragp" draggable="true" tabindex="0" role="button" aria-label="${t.n}, ${t.att}% attainment, in ${NB_LABELS[pf+'-'+pt][0]}. Arrow keys move between boxes, Enter opens profile" data-n="${t.n}" data-tip="<b>${t.n}</b><br>${t.r} · ${t.att}%">${av(t.n,24)}<span>${t.n.split(' ')[0]}</span></div>`).join('')});const cn=$('#calNotes');if(cn)cn.innerHTML=calNotes();

function edgePath(a,b){const A=cgPos(a),B=cgPos(b),h=CG.nh/2,w=CG.nw/2;

 const upward=b.l>a.l;const y1=upward?A.y-h:A.y+h,y2=upward?B.y+h:B.y-h,m=(y1+y2)/2;return `M${A.x},${y1} C${A.x},${m} ${B.x},${m} ${B.x},${y2}`}

function teamStrip(){const n=TEAM.length,avgA=Math.round(TEAM.reduce((a,t)=>a+t.att,0)/n),atq=TEAM.filter(t=>t.att>=100).length,hr=TEAM.filter(t=>t.risk==='High').length,avgR=(TEAM.reduce((a,t)=>a+t.rating,0)/n).toFixed(1),bk=TEAM.reduce((a,t)=>a+t.book,0);
 return `<div class="sum-strip"><div><span>Average attainment</span><b>${avgA}%</b></div><div><span>At or above quota</span><b>${atq}<small class="xs muted" style="font-family:var(--font-sans);font-weight:500"> of ${n}</small></b></div><div><span>Bookings (H1)</span><b>${bk}</b></div><div><span>Average rating</span><b>${avgR}</b></div><div><span>High flight risk</span><b style="color:${hr?'var(--bad)':'var(--ink)'}">${hr}</b></div></div>`}
const FUNC_PAL=['#1B4A86','#5C93D6','#0E8A85','#5FB8B2','#6D4FD8','#A99BEA','#B7791F','#8A97AB'];
PAGES.people=()=>{const O=ORG;const fem=O.age.reduce((a,x)=>a+x[2],0);return `
 <div class="page-head"><div><div class="eyebrow">People insights · Brightkey Homes</div><h1>Workforce at a glance</h1><p>812 people · 14 offices across the Mumbai region · as of Sep 2026 <span class="badge outline" style="margin-left:6px" data-tip="Brightkey Homes is fictional. All workforce figures are invented.">Fictional data</span></p></div>
 <div class="actions"><div class="tabs seg" data-tabs="pplrange" role="group" aria-label="Snapshot year"><button class="on">FY27</button><button>FY26</button><button>FY25</button><span class="pill"></span></div><button class="btn btn-ghost" onclick="toast('Workforce report exported (demo)','download')">${icon('download')}Export</button></div></div>
 <div class="grid g-12">
  ${[['Headcount',812,'','users','var(--brand)','+7% YTD'],['Median age',28,' yrs','calendar','var(--teal)','Young, sales-led'],['Women',32,'%','heart','var(--accent)','+3 pts YoY'],['Median tenure',1.7,' yrs','clock','var(--violet)','41% < 1 yr'],['New joiners',186,'','plus','var(--ok)','H1 · mostly sales'],['eNPS',31,'','star','var(--warn)','Up 5 pts YoY']].map(([l,v,s,ic,c,sub])=>`<div class="card reveal kpi s-2"><div class="row" style="gap:10px;min-width:0"><div class="ic">${icon(ic)}</div><span class="kpi-l" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l}</span></div><div class="v num" style="font-size:28px"><span data-count="${v}" data-dec="${v%1?1:0}">0</span><small>${s}</small></div><div class="xs muted" style="margin-top:8px">${sub}</div></div>`).join('')}
  <div class="card reveal s-7"><div class="card-head"><div><h3>Headcount growth</h3><p>240 in 2019 → 812 today</p></div><span class="badge green">${icon('up','',2.4).replace('<svg','<svg width="12" height="12"')} 3.4× in 7 yrs</span></div>${areaChart(O.growth)}</div>
  <div class="card reveal s-5"><div class="card-head"><div><h3>By function</h3><p>Sales-led organisation</p></div></div>
   <div class="row wrap" style="gap:20px;justify-content:center">${donut(O.functions.map((f,i)=>[f[0],f[1],FUNC_PAL[i]]),180,24,`<b class="num" style="font-size:24px">71%</b><small class="xs muted">sales & pre-sales</small>`)}
   <div class="stack" style="gap:5px;flex:1;min-width:180px">${O.functions.map((f,i)=>`<div class="row between xs"><span class="row" style="gap:6px"><i style="width:9px;height:9px;border-radius:2px;background:${FUNC_PAL[i]}"></i>${f[0]}</span><b class="num">${f[1]}</b></div>`).join('')}</div></div></div>
  <div class="card reveal s-6"><div class="card-head"><div><h3>By location</h3><p>Navi Mumbai HQ cluster is the largest</p></div>${icon('map').replace('<svg','<svg width="18" height="18" style="color:var(--brand)"')}</div>${barsH(O.locations,{labelW:230})}</div>
  <div class="card reveal s-6"><div class="card-head"><div><h3>Age & gender</h3><p>${fmt(812-fem)} men · ${fmt(fem)} women</p></div><div class="legend"><span><i style="background:var(--brand)"></i>Men</span><span><i style="background:var(--teal)"></i>Women</span></div></div>
   <div class="stack" style="gap:7px">${O.age.map(([a,m,f],i)=>`<div class="pyr"><div class="l barh-anim" style="width:${m/200*100}%;transform-origin:right;animation-delay:${i*80}ms" data-tip="${a} · Men: ${m}"></div><b class="num" style="text-align:center">${a}</b><div class="r barh-anim" style="width:${f/200*100}%;animation-delay:${i*80}ms" data-tip="${a} · Women: ${f}"></div></div>`).join('')}</div>
   <div class="divider"></div><div class="row" style="gap:8px">${O.edu.map(([l,v],i)=>`<div style="flex:${v};min-width:0" data-tip="${l}: ${v}%"><div style="height:8px;border-radius:5px;background:${['var(--brand-700)','var(--teal)','var(--brand-300)'][i]}"></div><div class="xs muted" style="margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l} · ${v}%</div></div>`).join('')}</div></div>
  <div class="card reveal s-4"><div class="card-head"><div><h3>Tenure</h3><p>41% joined in the last 12 months</p></div></div>${barsH(O.tenure,{color:'var(--teal)',labelW:80})}</div>
  <div class="card reveal s-4"><div class="card-head"><div><h3>Career levels</h3><p>L1–L9 ladder</p></div></div>${barsH(O.levels,{color:'var(--violet)',labelW:120})}</div>
  <div class="card reveal s-4"><div class="card-head"><div><h3>Attrition by function</h3><p>Annualised · org average 34%</p></div><span class="badge red">2 above ceiling</span></div><div class="stack" style="gap:10px">${O.attrition.map(([f,v])=>`<div style="display:grid;grid-template-columns:96px 1fr 38px;gap:10px;align-items:center"><span class="small" style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f}</span>${bullet(v,30,{max:55,invert:1,cls:'sm',tip:`<b>${f}</b><br>${v}% annualised · ceiling 30%`})}<b class="xs num" style="text-align:right;color:${v>30?'var(--bad)':'var(--ink)'}">${v}%</b></div>`).join('')}</div><div class="xs muted" style="margin-top:8px">Tick = 30% ceiling · red = above ceiling</div>
   <div class="divider"></div><div class="row small" style="align-items:flex-start">${icon('lightbulb').replace('<svg','<svg width="16" height="16" style="color:var(--warn);flex:none;margin-top:2px"')}<span>Inside Sales attrition falls to <b>22%</b> for people with an IDP and a mentor.</span></div></div>
  <div class="card reveal s-12"><div class="card-head wrap"><div><h3>${dirTitle()}</h3><p>${dirSub()}</p></div><div class="search" style="max-width:300px">${icon('search').replace('<svg','<svg width="16" height="16"')}<label class="sr" for="dq">Search the directory</label><input id="dq" placeholder="Search name, role, office…"></div></div>
   ${S.persona==='employee'?'':teamStrip()}<div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Role</th><th>Office</th><th style="min-width:170px">H1 attainment vs quota</th>${S.persona==='employee'?'':'<th class="r">Rating</th><th>9-box</th><th>Flight risk</th>'}</tr></thead><tbody id="dir"></tbody></table></div>${S.persona==='employee'?`<div class="priv-note">${icon('lock')}<span>Attainment is shared on the H1 board. Ratings, 9-box placement and flight risk are visible to managers and the People team only.</span></div>`:''}</div>
 </div>`};
PAGES.people.after=v=>{const draw=q=>{$('#dir',v).innerHTML=TEAM.filter(t=>(t.n+t.r+t.loc).toLowerCase().includes(q)).map(t=>`<tr style="cursor:pointer" data-p="${t.n}" tabindex="0"><td><div class="row">${av(t.n,30)}<b class="small">${t.n}</b></div></td><td class="small">${t.r}</td><td class="small muted">${t.loc}</td><td><div class="row" style="gap:10px"><div style="flex:1">${bullet(t.att,100,{max:125,cls:'sm',tip:`${t.att}% of quota`}).replace('<i class="bar" data-w=','<i class="bar" style="width:'+Math.min(t.att/125*100,100)+'%" data-w=')}</div><b class="xs num" style="width:36px;text-align:right">${t.att}%</b></div></td>${S.persona==='employee'?'':`<td class="num small r"><b>${t.rating.toFixed(1)}</b></td><td><span class="val-chip"><i style="background:${NB_LABELS[t.perf+'-'+t.pot][1]}"></i>${NB_LABELS[t.perf+'-'+t.pot][0]}</span></td><td><span class="badge ${t.risk==='High'?'red':t.risk==='Medium'?'yellow':'green'}"><i></i>${t.risk}</span></td>`}</tr>`).join('')||`<tr><td colspan="7" style="border:0">${emptyState('users',`No one matches “${esc(q)}”`,'Search by name, role or office, e.g. “Thane”.')}</td></tr>`;$$('[data-p]',v).forEach(r=>{r.onclick=()=>personCard(TEAM.find(t=>t.n===r.dataset.p));r.onkeydown=e=>{if(e.key==='Enter')r.click()}})};
 draw('');$('#dq',v).oninput=e=>draw(e.target.value.toLowerCase());
 $$('[data-tabs="pplrange"] button',v).forEach(b=>b.onclick=()=>{$$('[data-tabs="pplrange"] button',v).forEach(x=>x.classList.toggle('on',x===b));placePills(v);toast(`Showing ${b.textContent} snapshot (demo data)`,'calendar')})};

function recMine(){const me=P().name;
 if(S.persona==='employee'){const got=KUDOS.filter(k=>k.to===me),gave=KUDOS.filter(k=>k.from===me),re=got.reduce((a,k)=>a+k.likes,0);
  return `<div class="card-head"><div><h3>Your recognition</h3><p>This week</p></div></div><div class="stat-row"><div><span>Received</span><b>${got.length}</b></div><div><span>Reactions</span><b>${re}</b></div><div><span>Given</span><b>${gave.length}</b></div></div>
  ${got[0]?`<p class="small" style="margin-top:12px;color:var(--ink-2)"><b style="color:var(--ink)">${got[0].from}</b> · ${got[0].val}: “${esc(got[0].msg)}”</p>`:''}
  <div class="card-foot"><span>${gave.length?`You recognised ${[...new Set(gave.map(k=>k.to))].join(', ')}`:'You haven’t given kudos this week'}</span><button onclick="giveKudos()">Give kudos</button></div>`}
 const rec=new Set(KUDOS.map(k=>k.to)),inT=TEAM.filter(t=>rec.has(t.n)),notT=TEAM.filter(t=>!rec.has(t.n)&&t.n!==me).sort((a,b)=>b.att-a.att);
 return `<div class="card-head"><div><h3>${S.persona==='manager'?'Your team this week':'Sample cluster this week'}</h3><p>Who has been recognised · Mumbai West & Navi Mumbai</p></div></div>
  <div class="row between small"><span><b class="disp num" style="font-size:22px">${inT.length}</b> <span class="muted">of ${TEAM.length} recognised</span></span><span class="xs muted">${notT.length} not yet</span></div>
  <div style="display:flex;gap:3px;margin:8px 0 14px" role="img" aria-label="${inT.length} of ${TEAM.length} recognised this week">${TEAM.map(t=>`<span data-tip="<b>${t.n}</b><br>${rec.has(t.n)?'Recognised this week':'Not recognised yet'}" style="flex:1;height:10px;border-radius:2px;background:${rec.has(t.n)?'var(--accent)':'var(--track)'}"></span>`).join('')}</div>
  <div class="xs muted" style="font-weight:600;margin-bottom:4px">Above quota, not yet recognised</div>
  <div class="stack" style="gap:2px">${notT.filter(t=>t.att>=100).slice(0,4).map(t=>`<div class="row" style="gap:10px;padding:5px 0">${av(t.n,26)}<div style="flex:1;min-width:0"><b class="small">${t.n}</b><div class="xs muted">${t.att}% of quota · ${t.loc}</div></div><button class="btn btn-ghost btn-sm" onclick="giveKudos('${t.n}')">Recognise</button></div>`).join('')||'<p class="xs muted">Everyone above quota has been recognised.</p>'}</div>`}
PAGES.recognition=()=>{const imran=TEAM.find(t=>t.n==='Imran Qureshi');const rec=[...KUDOS].sort((a,b)=>b.likes-a.likes).slice(0,4);return `
 <div class="page-head"><div><div class="eyebrow">Recognition · ${KUDOS.length} kudos this week</div><h1>Celebrate great work</h1><p>Every kudos is tied to a Brightkey value and counts toward Performer of the Month.</p></div><div class="actions"><button class="btn btn-accent" onclick="giveKudos()">${icon('award')}Give kudos</button></div></div>
 <div class="grid g-12">
  <div class="s-8 stack" style="gap:16px">
   <section class="pom reveal" aria-label="Performer of the Month"><div class="pom-top"><b>${icon('trophy')}Performer of the Month · August 2026</b><span class="xs muted">Chosen by the People team from bookings, CSAT and kudos</span></div>
    <div class="pom-body"><div><div class="row" style="gap:14px">${av('Imran Qureshi',60)}<div><h2>Imran Qureshi</h2><p class="small muted">${imran.r} · ${imran.loc} · #1 on the H1 board</p></div></div>
     <p style="margin-top:14px;font-size:14.5px;line-height:1.55">₹1.4 Cr booked in August across 5 families, all through end-to-end advisory, with a 4.9 CSAT.</p></div>
     <div><div class="label">H1 attainment vs quota</div><div class="row" style="gap:10px"><div style="flex:1">${bullet(imran.att,100,{max:125,tip:imran.att+'% of quota'})}</div><b class="disp num" style="font-size:20px;color:var(--accent-text)">${imran.att}%</b></div>
      <div class="stat-row" style="margin-top:14px"><div><span>Site visits</span><b>${imran.visits}</b></div><div><span>Bookings</span><b>${imran.book}</b></div><div><span>Rating</span><b>${imran.rating.toFixed(1)}</b></div></div></div></div></section>
   <div class="card reveal"><div class="card-head wrap"><div><h3>Recognition feed</h3><p>Newest first · filter by value</p></div></div>
    <div class="row wrap" id="vf" role="group" aria-label="Filter by value" style="gap:6px;margin-bottom:4px"><button class="chip on" data-v="" aria-pressed="true">All values</button>${VALUES.map(v=>`<button class="chip" data-v="${v.n}" aria-pressed="false"><i style="width:8px;height:8px;border-radius:2px;background:${v.c}"></i>${v.n}</button>`).join('')}</div>
    <div class="feed" id="wall" aria-live="polite"></div></div>
  </div>
  <div class="s-4 stack" style="gap:16px">
   <div class="card reveal" id="recMine">${recMine()}</div>
   <div class="card reveal"><div class="card-head"><div><h3>Values leaderboard</h3><p>Kudos this quarter by value</p></div></div>
    ${barsH(VALUES.map((v,i)=>[v.n,[412,356,301,288,190,164][i],v.c]),{labelW:130})}
    <div class="card-foot"><span>1,711 kudos this quarter</span><button onclick="giveKudos()">Give kudos</button></div></div>
   <div class="card reveal"><div class="card-head"><div><h3>Most celebrated this week</h3><p>By reactions on their kudos</p></div></div>
    <div class="stack" style="gap:2px">${rec.map((k,i)=>`<div class="lb-row" style="grid-template-columns:26px 28px minmax(0,1fr) auto;padding:6px 4px"><span class="rank ${i===0?'r1':''}">${i+1}</span>${av(k.to,28)}<div class="nm"><b>${k.to}</b><span>${k.val}</span></div><span class="val">${k.likes}<small class="xs muted" style="font-family:var(--font-sans);font-weight:500"> reactions</small></span></div>`).join('')}</div></div>
   <div class="card reveal"><div class="card-head" style="margin-bottom:8px"><h3>How kudos count</h3></div><p class="small muted">Each kudos names one Brightkey value. Kudos and reactions feed the monthly Performer of the Month shortlist alongside bookings and CSAT. Orange marks wins.</p></div>
  </div>
 </div>`};
PAGES.recognition.after=v=>{drawWall('');$$('#vf .chip',v).forEach(c=>c.onclick=()=>{$$('#vf .chip',v).forEach(x=>{x.classList.toggle('on',x===c);x.setAttribute('aria-pressed',x===c)});drawWall(c.dataset.v)})};
function drawWall(f){const w=$('#wall');if(!w)return;w.innerHTML=KUDOS.filter(k=>!f||k.val===f).map((k,i)=>`<article class="feed-item" style="animation:revealIn .35s ${i*50}ms var(--ease) both">${av(k.from,38)}<div style="min-width:0"><div class="who"><b>${k.from}</b> <span class="muted">recognised</span> <b>${k.to}</b> <span class="xs muted">· ${k.time}${k.time==='Just now'?'':' ago'}</span></div><p class="msg">${esc(k.msg)}</p><div class="foot"><span class="val-chip"><i style="background:${k.c}"></i>${k.val}</span><button class="like" data-i="${KUDOS.indexOf(k)}" aria-pressed="false" aria-label="React to this kudos, ${k.likes} reactions">${icon('heart')}<span class="num">${k.likes}</span></button></div></div></article>`).join('')||emptyState('award','No kudos for this value yet','Be the first to recognise someone for it.','<button class="btn btn-accent btn-sm" onclick="giveKudos()">Give kudos</button>');
 $$('.like',w).forEach(b=>b.onclick=()=>{const k=KUDOS[b.dataset.i];if(b.dataset.on)return;b.dataset.on=1;k.likes++;b.style.color='var(--accent-text)';b.setAttribute('aria-pressed','true');$('svg',b).setAttribute('fill','currentColor');$('span',b).textContent=k.likes;b.animate([{transform:'scale(1)'},{transform:'scale(1.2)'},{transform:'scale(1)'}],{duration:300,easing:'cubic-bezier(.34,1.56,.64,1)'})})}
function giveKudos(to){let val=VALUES[1].n;modal('Give kudos',`<div class="field"><label>To</label><select class="input" id="kt">${TEAM.filter(t=>t.n!==P().name).map(t=>`<option ${t.n===to?'selected':''}>${t.n}</option>`).join('')}</select></div>
 <div class="field"><label>Which value did they live?</label><div class="grid" style="grid-template-columns:repeat(3,1fr);gap:8px">${VALUES.map(v=>`<button class="chip kv ${v.n===val?'on':''}" data-v="${v.n}" style="flex-direction:column;border-radius:14px;padding:12px 6px;justify-content:center;text-align:center"><span style="color:${v.c}">${icon(v.ic).replace('<svg','<svg width="22" height="22"')}</span><span class="xs">${v.n}</span></button>`).join('')}</div></div>
 <div class="field"><label>Message</label><textarea class="input" id="km" placeholder="What did they do, and why did it matter?"></textarea></div>`,`<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-accent" id="ks">${icon('send')}Send kudos</button>`,'It will appear on the recognition wall');
 $$('.kv').forEach(b=>b.onclick=()=>{val=b.dataset.v;$$('.kv').forEach(x=>x.classList.toggle('on',x===b))});$$('[data-close]').forEach(b=>b.onclick=closeOverlay);
 $('#ks').onclick=()=>{const kt=$('#kt').value;const m=$('#km').value.trim()||'Thank you for going above and beyond this week!';const v=VALUES.find(x=>x.n===val);KUDOS.unshift({from:P().name,to:kt,val,msg:m,time:'Just now',c:v.c,likes:0});closeOverlay();confetti();toast(`Kudos sent to ${kt}`,'award');if(S.route==='recognition'){$$('#vf .chip').forEach(x=>{const on=!x.dataset.v;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});drawWall('');const rm=$('#recMine');if(rm)rm.innerHTML=recMine()}}}

(function boot(){
  shell();route();
  const sp=$('#splash');let first=true;try{first=!sessionStorage.getItem('bk-elevate-boot');sessionStorage.setItem('bk-elevate-boot','1')}catch(_){}
  if(first&&!matchMedia('(prefers-reduced-motion: reduce)').matches){sp.hidden=false;setTimeout(()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),500)},900)}else sp.remove();
})();
</script>
</body>
</html>

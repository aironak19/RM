/* ==========================================================================
   Brightkey Elevate · Talent Suite — concept demo by Ronak Mehta
   Visual language: Northstar v4 (quiet chrome, one accent, depth from light).
   All people, companies and figures are fictional.
   ========================================================================== */
:root{
  --font-sans:"Geist",-apple-system,BlinkMacSystemFont,"Inter",ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-display:"Geist",-apple-system,BlinkMacSystemFont,"Inter",ui-sans-serif,system-ui,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --brand:#2F6FBD;--brand-500:#3C82D6;--brand-600:#255CA3;--brand-700:#1D4A85;--brand-400:#67A4EC;
  --brand-text:#255CA3;--brand-100:rgba(47,111,189,.15);--brand-50:rgba(47,111,189,.075);--brand-line:rgba(47,111,189,.28);
  --accent:#CD4B0D;--accent-400:#EE7A3F;--accent-50:rgba(205,75,13,.08);--accent-line:rgba(205,75,13,.28);
  --ok:#147A3C;--ok-fill:#16A34A;--ok-50:rgba(22,163,74,.09);--ok-line:rgba(22,163,74,.28);
  --warn:#A15C07;--warn-50:rgba(217,119,6,.10);--warn-line:rgba(217,119,6,.30);
  --bad:#B42318;--bad-50:rgba(220,38,38,.08);--bad-line:rgba(220,38,38,.26);
  --violet:#6D4FD8;--teal:#0E8F8A;

  --bg:#F6F6F7;--bg-2:#EFEFF1;
  --surface:#FFFFFF;--surface-2:#FAFAFA;--surface-3:#F4F4F5;--surface-4:#E9E9EC;
  --line:rgba(12,12,18,.08);--line-2:rgba(12,12,18,.055);--line-strong:rgba(12,12,18,.14);
  --ink:#0A0A0C;--ink-2:#3B3B43;--ink-3:#6B6B76;--ink-4:#A0A0AB;--ink-inverse:#FFFFFF;
  --track:rgba(12,12,18,.07);--star-off:rgba(12,12,18,.14);

  --shadow-xs:0 1px 1px rgba(12,12,18,.03),0 1px 2px rgba(12,12,18,.04);
  --shadow-sm:0 1px 2px rgba(12,12,18,.05),0 2px 6px -2px rgba(12,12,18,.06);
  --shadow:0 1px 2px rgba(12,12,18,.04),0 6px 16px -6px rgba(12,12,18,.10);
  --shadow-lg:0 2px 4px rgba(12,12,18,.04),0 18px 40px -12px rgba(12,12,18,.18);
  --shadow-xl:0 4px 8px rgba(12,12,18,.04),0 40px 90px -20px rgba(12,12,18,.32);
  --card-inset:0 0 0 0 transparent;
  --glass:rgba(246,246,247,.76);
  --glass-pop:rgba(255,255,255,.86);

  --r-sm:9px;--r:12px;--r-lg:16px;--r-xl:24px;
  --ease:cubic-bezier(.2,.8,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.4,.64,1);
  --sidebar:256px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --brand:#5A95DE;--brand-500:#5A95DE;--brand-600:#4A84CF;--brand-700:#8DB9EE;--brand-400:#7FB2F0;
  --brand-text:#8DB9EE;--brand-100:rgba(90,149,222,.26);--brand-50:rgba(90,149,222,.14);--brand-line:rgba(90,149,222,.40);
  --accent:#F07A3E;--accent-400:#F59A6A;--accent-50:rgba(240,122,62,.14);--accent-line:rgba(240,122,62,.38);
  --ok:#4ADE80;--ok-fill:#22C55E;--ok-50:rgba(34,197,94,.14);--ok-line:rgba(34,197,94,.35);
  --warn:#FBBF24;--warn-50:rgba(245,158,11,.14);--warn-line:rgba(245,158,11,.35);
  --bad:#F87171;--bad-50:rgba(239,68,68,.14);--bad-line:rgba(239,68,68,.35);
  --violet:#A08CF7;--teal:#2DD4BF;

  --bg:#09090B;--bg-2:#141417;
  --surface:#111113;--surface-2:#151518;--surface-3:#1B1B1F;--surface-4:#242429;
  --line:rgba(255,255,255,.075);--line-2:rgba(255,255,255,.05);--line-strong:rgba(255,255,255,.13);
  --ink:#F4F4F6;--ink-2:#C9C9D1;--ink-3:#8C8C97;--ink-4:#5E5E68;--ink-inverse:#0A0A0C;
  --track:rgba(255,255,255,.08);--star-off:rgba(255,255,255,.16);

  --shadow-xs:0 1px 2px rgba(0,0,0,.4);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.4);
  --shadow:0 2px 4px -2px rgba(0,0,0,.4),0 6px 16px -2px rgba(0,0,0,.45);
  --shadow-lg:0 16px 40px -8px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.4);
  --shadow-xl:0 32px 80px -16px rgba(0,0,0,.75),0 4px 12px rgba(0,0,0,.5);
  --card-inset:inset 0 1px 0 rgba(255,255,255,.035);
  --glass:rgba(9,9,11,.72);
  --glass-pop:rgba(24,24,28,.82);
  color-scheme:dark;
}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--font-sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;letter-spacing:-.003em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-feature-settings:"ss01","cv11","calt";overflow-x:hidden;transition:background .4s var(--ease),color .4s var(--ease)}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;font-weight:600;letter-spacing:-.022em;color:var(--ink);text-wrap:balance}
h1{font-size:28px;line-height:1.15;letter-spacing:-.035em}h2{font-size:19px;line-height:1.25;letter-spacing:-.025em}h3{font-size:14.5px;line-height:1.35;letter-spacing:-.015em}
p{margin:0;text-wrap:pretty}
b,strong{font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;letter-spacing:inherit}
input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--brand-text);text-decoration:none}
.num,.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
::selection{background:color-mix(in srgb,var(--brand) 22%,transparent)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ink) 16%,transparent);border-radius:8px}
:focus-visible{outline:2px solid color-mix(in srgb,var(--brand) 60%,transparent);outline-offset:2px;border-radius:8px}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#09090B;overflow:hidden;isolation:isolate;transition:opacity .7s var(--ease),visibility .7s,filter .7s var(--ease)}
#splash::before{content:"";position:absolute;inset:-20%;z-index:-1;background:radial-gradient(30% 34% at 50% 44%,rgba(60,130,214,.55),transparent 70%),radial-gradient(18% 22% at 60% 58%,rgba(205,75,13,.18),transparent 70%);filter:blur(40px)}
#splash::after{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.2px);background-size:22px 22px;-webkit-mask-image:radial-gradient(40% 50% at 50% 46%,#000,transparent 75%);mask-image:radial-gradient(40% 50% at 50% 46%,#000,transparent 75%);opacity:.5}
#splash.out{opacity:0;visibility:hidden;filter:blur(8px)}
.splash-inner{display:flex;flex-direction:column;align-items:center;gap:20px}
.splash-mark{width:76px;height:76px;filter:drop-shadow(0 16px 40px rgba(47,111,189,.55))}
.splash-mark path,.splash-mark circle{stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1.3s var(--ease) forwards}
.splash-mark .arrow{animation-delay:.55s}
.splash-mark rect{transform-origin:center;animation:pop .7s var(--spring) forwards;transform:scale(.4);opacity:0}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{transform:scale(1);opacity:1}}
.splash-word{font-family:var(--font-display);color:#fff;font-size:32px;font-weight:600;letter-spacing:-.045em;display:flex;overflow:hidden;padding-bottom:2px}
.splash-word span{display:inline-block;transform:translateY(110%);animation:rise .6s var(--ease-out) forwards}
.splash-sub{color:rgba(255,255,255,.5);font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;opacity:0;animation:fade .8s 1s forwards}
.splash-bar{width:160px;height:2px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.splash-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand-400),#fff);animation:load 1.6s .25s var(--ease) forwards}
@keyframes rise{to{transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes load{to{width:100%}}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh;transition:grid-template-columns .35s var(--ease)}
.app.collapsed{--sidebar:76px}
.sidebar{position:sticky;top:0;height:100vh;background:var(--bg);border-right:1px solid var(--line-2);display:flex;flex-direction:column;padding:14px 12px 12px;gap:2px;overflow:hidden;z-index:20}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 14px;white-space:nowrap;color:var(--ink)}
.brand-mark{width:34px;height:34px;flex:none;border-radius:10px;box-shadow:0 1px 2px rgba(12,12,18,.12),0 6px 14px -6px rgba(37,92,163,.8)}
.brand-text b{display:block;font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:-.03em;line-height:1.15;color:var(--ink)}
.brand-text b em{font-style:normal;color:var(--accent)}
.brand-text small{display:block;color:var(--ink-4);font-size:9.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-label{font-size:11.5px;font-weight:500;color:var(--ink-4);letter-spacing:0;padding:16px 10px 6px;white-space:nowrap}
.nav a{position:relative;display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:9px;color:var(--ink-2);font-size:13.5px;font-weight:500;white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s}
.nav a svg{flex:none;width:17px;height:17px;stroke-width:1.8;color:var(--ink-4);transition:color .2s}
.nav a:hover{background:color-mix(in srgb,var(--ink) 4.5%,transparent);color:var(--ink)}
.nav a.active{background:var(--surface);color:var(--ink);font-weight:550;box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(12,12,18,.05),0 2px 6px -2px rgba(12,12,18,.06)}
:root[data-theme="dark"] .nav a.active{background:var(--surface-3);box-shadow:0 0 0 1px var(--line),inset 0 1px 0 rgba(255,255,255,.04)}
.nav a.active svg{color:var(--brand)}
.nav a .badge{margin-left:auto}
.nav-count{margin-left:auto;font-size:12px;font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums;padding:0 4px}
.nav a .badge.new{background:var(--ok-50);color:var(--ok);height:19px;padding:0 7px;font-size:10.5px}
.collapsed .brand-text,.collapsed .nav-label,.collapsed .nav a span,.collapsed .nav a .badge,.collapsed .side-card,.collapsed .side-link span{opacity:0;pointer-events:none}
.brand-text,.nav-label,.nav a span,.side-card,.side-link span{transition:opacity .2s}
.side-card{margin-top:auto;border-radius:14px;padding:14px;background:#0C0C10;color:#fff;position:relative;overflow:hidden;isolation:isolate;min-width:224px;border:1px solid rgba(255,255,255,.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 24px -14px rgba(0,0,0,.5)}
.side-card::after{content:"";position:absolute;right:-40px;top:-60px;width:160px;height:160px;z-index:-1;background:radial-gradient(closest-side,rgba(60,130,214,.6),transparent)}
.side-card b{font-size:13px;font-weight:600;letter-spacing:-.01em;display:block}
.side-card p{font-size:12px;opacity:.62;margin:3px 0 12px}
.side-card .progress{background:rgba(255,255,255,.1)!important}
.side-card .progress i{background:linear-gradient(90deg,var(--brand-400),#fff)!important}
.side-card button{background:#fff;color:#0A0A0C;font-weight:550;font-size:12px;padding:6px 11px;border-radius:8px;box-shadow:0 1px 0 rgba(255,255,255,.4) inset}
.side-links{display:flex;gap:2px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line-2)}
.side-link{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;color:var(--ink-3);font-size:12.5px;font-weight:500;white-space:nowrap;transition:background .2s,color .2s}
.side-link svg{width:15px;height:15px;flex:none}
.side-link:hover{background:color-mix(in srgb,var(--ink) 4.5%,transparent);color:var(--ink)}
.collapsed .side-links{flex-direction:column}
.collapse-btn{display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:9px;color:var(--ink-4);white-space:nowrap}
.collapse-btn:hover{background:color-mix(in srgb,var(--ink) 4.5%,transparent);color:var(--ink-2)}
.collapse-btn svg{width:17px;height:17px;flex:none;transition:transform .3s}
.collapsed .collapse-btn svg{transform:rotate(180deg)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:10px;height:60px;padding:0 28px;background:color-mix(in srgb,var(--bg) 76%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line-2)}
.topbar .mbrand{display:none}.mbrand{gap:9px;color:var(--ink)}.mbrand .brand-mark{width:30px;height:30px;border-radius:9px}.mbrand b{font-size:15px;font-weight:600;letter-spacing:-.03em}.mbrand em{font-style:normal;color:var(--accent)}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:13px;font-weight:500;white-space:nowrap}
.crumbs svg{color:var(--ink-4)}
.crumbs b{color:var(--ink);font-weight:550}
.search{flex:1;max-width:420px;margin:0 auto;display:flex;align-items:center;gap:10px;height:34px;padding:0 10px 0 12px;border-radius:9px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-xs);color:var(--ink-4);font-size:13px;transition:border-color .2s,box-shadow .2s}
.search:hover{border-color:var(--line-strong)}
.search:focus-within{border-color:var(--brand-line);box-shadow:0 0 0 3px var(--brand-50)}
.search input{color:var(--ink);font-size:13px;min-width:0;width:100%}
.search input::placeholder{color:var(--ink-4)}
.search kbd,.kbd{margin-left:auto;font-family:var(--font-sans);font-size:11px;font-weight:500;padding:1px 6px;border-radius:6px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 0 var(--line-strong);color:var(--ink-4)}
.icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3);position:relative;transition:background .2s,color .2s}
.icon-btn:hover{background:color-mix(in srgb,var(--ink) 5%,transparent);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--brand);border:1.5px solid var(--bg)}
.dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--brand);animation:ping 2.4s infinite;opacity:0}
@keyframes ping{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.8);opacity:0}}
.persona{display:flex;align-items:center;gap:10px;height:40px;padding:3px 8px 3px 3px;border-radius:11px;border:1px solid transparent;background:transparent;transition:background .2s;position:relative}
.persona:hover{background:color-mix(in srgb,var(--ink) 4.5%,transparent)}
.persona .who{text-align:left;line-height:1.2}
.persona .who b{font-size:13px;font-weight:550;letter-spacing:-.01em;display:block}
.persona .who small{font-size:11.5px;color:var(--ink-3)}
.demo-pill{position:relative;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--surface);border:1px solid var(--line);padding:3px 8px 3px 20px;border-radius:999px;white-space:nowrap}
.demo-pill::before{content:"";position:absolute;left:8px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 3px var(--warn-50)}

.page{padding:32px 32px 56px;max-width:1440px;width:100%;margin:0 auto;animation:pageIn .7s var(--ease-out)}
@keyframes pageIn{from{opacity:0;transform:translateY(10px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-head h1{margin-top:8px}
.page-head p{color:var(--ink-3);margin-top:6px;font-size:14px}
.eyebrow{font-size:12px;font-weight:500;letter-spacing:0;color:var(--brand-text);display:inline-flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px var(--brand-50);flex:none}
.label{font-size:12px;font-weight:550;color:var(--ink-3);margin-bottom:8px}

/* ---------- Primitives ---------- */
.grid{display:grid;gap:16px}
.g-12{grid-template-columns:repeat(12,minmax(0,1fr))}
.s-2{grid-column:span 2}.s-3{grid-column:span 3}.s-4{grid-column:span 4}.s-5{grid-column:span 5}.s-6{grid-column:span 6}.s-7{grid-column:span 7}.s-8{grid-column:span 8}.s-9{grid-column:span 9}.s-12{grid-column:span 12}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-xs),var(--card-inset);padding:20px;position:relative;min-width:0;transition:box-shadow .3s var(--ease),transform .3s var(--ease-out),border-color .3s}
.card.hover:hover{box-shadow:var(--shadow-lg),var(--card-inset);transform:translateY(-2px)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;min-height:20px}
.card-head h3{font-size:14.5px}
.card-head p{color:var(--ink-3);font-size:12.5px;margin-top:2px}
.card-head > svg{flex:none;margin-top:1px}
.reveal{opacity:0;transform:translateY(12px)}
.reveal.in{animation:revealIn .7s var(--ease-out) forwards}
@keyframes revealIn{from{opacity:0;transform:translateY(12px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;font-weight:550;font-size:13.5px;letter-spacing:-.01em;white-space:nowrap;border:1px solid transparent;transition:background .2s,border-color .2s,color .2s,transform .25s var(--ease-out),box-shadow .2s;position:relative;overflow:hidden}
.btn svg{width:15px;height:15px}
.btn:active{transform:scale(.98)}
.btn-primary,.btn-accent{background:var(--ink);color:var(--ink-inverse);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(12,12,18,.18),0 4px 10px -4px rgba(12,12,18,.3)}
.btn-primary:hover,.btn-accent:hover{background:color-mix(in srgb,var(--ink) 86%,var(--brand))}
:root[data-theme="dark"] .btn-primary,:root[data-theme="dark"] .btn-accent{box-shadow:inset 0 -1px 0 rgba(0,0,0,.12),0 0 0 1px rgba(255,255,255,.1)}
:root[data-theme="dark"] .btn-primary:hover,:root[data-theme="dark"] .btn-accent:hover{background:#fff}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink-2);box-shadow:var(--shadow-xs)}
.btn-ghost:hover{border-color:var(--line-strong);color:var(--ink);box-shadow:var(--shadow-sm)}
:root[data-theme="dark"] .btn-ghost{background:var(--surface-3)}
.btn-light{background:#fff;color:#0A0A0C;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 8px 24px -10px rgba(255,255,255,.35)}
.btn-light:hover{transform:translateY(-1px)}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.16;animation:ripple .6s linear;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}
.badge{display:inline-flex;align-items:center;gap:5px;height:21px;font-size:11.5px;font-weight:550;letter-spacing:-.005em;padding:0 8px;border-radius:999px;background:color-mix(in srgb,var(--ink) 5%,transparent);color:var(--ink-2);white-space:nowrap;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 14%,transparent)}
.badge.blue{background:var(--brand-50);color:var(--brand-text)}
.badge.orange{background:var(--accent-50);color:var(--accent)}
.badge.green{background:var(--ok-50);color:var(--ok)}
.badge.yellow{background:var(--warn-50);color:var(--warn)}
.badge.red{background:var(--bad-50);color:var(--bad)}
.badge.solid{background:var(--brand);color:#fff;box-shadow:none}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.avatar{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;letter-spacing:-.01em;flex:none;font-size:12px;position:relative;box-shadow:0 0 0 2px var(--surface),inset 0 0 0 1px rgba(255,255,255,.14)}
.av-stack{display:flex}.av-stack .avatar{margin-left:-8px}.av-stack .avatar:first-child{margin-left:0}
.muted{color:var(--ink-3)}.small{font-size:12.5px}.xs{font-size:11.5px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.divider{height:1px;background:var(--line-2);margin:16px 0}
.tabs{display:inline-flex;gap:2px;padding:2px;background:color-mix(in srgb,var(--ink) 5%,transparent);border-radius:10px;position:relative;flex-wrap:nowrap;max-width:100%;overflow-x:auto;scrollbar-width:none;flex:none}.tabs::-webkit-scrollbar{display:none}.tabs button{white-space:nowrap;flex:none}
.tabs button{position:relative;z-index:1;height:28px;padding:0 12px;border-radius:8px;font-weight:500;color:var(--ink-3);font-size:13px;transition:color .25s}
.tabs button:hover{color:var(--ink-2)}
.tabs button.on{color:var(--ink);font-weight:550}
.tabs .pill{position:absolute;z-index:0;top:2px;bottom:2px;border-radius:8px;background:var(--surface);box-shadow:0 0 0 .5px var(--line-strong),0 1px 2px rgba(12,12,18,.08),0 2px 6px -2px rgba(12,12,18,.08);transition:left .4s var(--spring),width .4s var(--spring),top .4s var(--spring)}
:root[data-theme="dark"] .tabs .pill{background:var(--surface-4);box-shadow:0 0 0 .5px var(--line-strong),inset 0 1px 0 rgba(255,255,255,.05)}
.progress{height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand-600),var(--brand-400));width:0;transition:width 1.2s var(--ease-out)}
.progress.orange i{background:linear-gradient(90deg,var(--accent),var(--accent-400))}
.progress.green i{background:linear-gradient(90deg,var(--ok-fill),color-mix(in srgb,var(--ok-fill) 60%,#fff))}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:5px 11px;line-height:1.35;border-radius:999px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-xs);font-size:12.5px;font-weight:500;color:var(--ink-2);transition:border-color .2s,background .2s,color .2s,box-shadow .2s}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip.on{border-color:var(--brand-line);color:var(--brand-text);background:var(--brand-50);box-shadow:none}
:root[data-theme="dark"] .chip{background:var(--surface-3)}
:root[data-theme="dark"] .chip.on{background:var(--brand-50)}
.table{width:100%;border-collapse:separate;border-spacing:0}
.table th{font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.table tbody tr:last-child td{border-bottom:0}
.table tr{transition:background .2s}
.table tbody tr:hover td{background:color-mix(in srgb,var(--ink) 2.2%,var(--surface))}
.table-wrap{overflow-x:auto;margin:0 -20px -20px;padding:0 8px 6px}
.kpi .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-3);flex:none}
.kpi .ic svg{width:15px;height:15px}
.kpi-l{font-size:12.5px;color:var(--ink-3);font-weight:500}
.kpi .v{font-family:var(--font-display);font-size:32px;font-weight:600;letter-spacing:-.045em;line-height:1;margin-top:14px;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.kpi .v small{font-size:13px;color:var(--ink-4);font-weight:500;letter-spacing:-.01em}
.trend{font-size:11.5px;font-weight:550;display:inline-flex;align-items:center;gap:3px;height:21px;padding:0 7px;border-radius:999px;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 16%,transparent)}
.trend.up{color:var(--ok);background:var(--ok-50)}.trend.down{color:var(--bad);background:var(--bad-50)}
.spark{width:100%;height:38px;margin-top:14px;overflow:visible}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.8s var(--ease) forwards}
.fade-area{opacity:0;animation:fade 1s .6s forwards}
.empty-note{font-size:11.5px;color:var(--ink-4);display:flex;align-items:center;gap:6px}

/* Empty & loading states */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:36px 20px;color:var(--ink-3)}
.empty .em-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-3);margin-bottom:6px;box-shadow:var(--shadow-xs)}
.empty .em-ic svg{width:18px;height:18px}
.empty b{color:var(--ink);font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.empty p{font-size:12.5px;max-width:320px}
.empty .btn{margin-top:10px}
.skel{display:block;height:10px;border-radius:6px;margin:8px 0;background:linear-gradient(90deg,var(--track) 0%,color-mix(in srgb,var(--ink) 12%,transparent) 50%,var(--track) 100%);background-size:200% 100%;animation:shimmer 1.3s linear infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

/* ---------- Hero (dark spotlight) ---------- */
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:34px 36px;color:#fff;background:#0B0B0F;isolation:isolate;min-height:236px;border:1px solid rgba(255,255,255,.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 1px 2px rgba(12,12,18,.08),0 30px 60px -30px rgba(29,74,133,.6)}
.hero .aurora{position:absolute;inset:-20%;z-index:-2;background:
  radial-gradient(34% 44% at 78% 24%,#3C82D6,transparent 72%),
  radial-gradient(22% 30% at 92% 74%,rgba(103,164,236,.75),transparent 72%),
  radial-gradient(30% 40% at 50% 104%,rgba(37,92,163,.6),transparent 72%),
  radial-gradient(24% 30% at 12% 8%,rgba(29,74,133,.5),transparent 72%),
  radial-gradient(12% 16% at 64% 82%,rgba(205,75,13,.32),transparent 72%);
  opacity:.8;filter:blur(30px) saturate(140%);animation:aurora 18s ease-in-out infinite alternate}
@keyframes aurora{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-4%,3%,0) scale(1.06)}100%{transform:translate3d(3%,-2%,0) scale(1.02)}}
.hero .grain{position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1.2px);background-size:22px 22px;-webkit-mask-image:radial-gradient(70% 90% at 85% 10%,#000 0%,transparent 75%);mask-image:radial-gradient(70% 90% at 85% 10%,#000 0%,transparent 75%);opacity:.55}
.hero h1{color:#fff;font-size:34px;line-height:1.08;letter-spacing:-.04em;font-weight:600;margin:18px 0 10px}
.hero p{color:rgba(255,255,255,.64);font-size:15px;line-height:1.55}
.hero p b{color:#fff;font-weight:550}
.hero .skyline{position:absolute;right:0;bottom:0;height:80%;opacity:.5;mix-blend-mode:screen;z-index:-1;-webkit-mask-image:linear-gradient(90deg,transparent,#000 30%);mask-image:linear-gradient(90deg,transparent,#000 30%)}
.hero .skyline rect{transform-origin:bottom;transform:scaleY(0);animation:build .9s var(--spring) forwards}
@keyframes build{to{transform:scaleY(1)}}
.hero .skyline .win{opacity:0;animation:twinkle 3.4s infinite}
@keyframes twinkle{0%,100%{opacity:.08}50%{opacity:.75}}
.hero-label{font-size:12px;font-weight:500;color:rgba(255,255,255,.55);margin-bottom:8px}
.glass-chip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);font-size:12px;font-weight:500;color:rgba(255,255,255,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.glass-chip svg{opacity:.7}
.countdown{display:flex;gap:8px}
.countdown div{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);border-radius:12px;padding:8px 10px 7px;min-width:58px;text-align:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.countdown b{font-family:var(--font-display);font-size:22px;font-weight:500;letter-spacing:-.02em;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.countdown small{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.5}

/* ---------- Rings / charts ---------- */
.ring{transform:rotate(-90deg)}
.ring .track{stroke:var(--track)}
.ring .val{transition:stroke-dashoffset 1.6s var(--ease-out);stroke-linecap:round}
.ring-wrap{position:relative;display:grid;place-items:center;flex:none}
.ring-wrap .lbl{position:absolute;text-align:center;line-height:1.1}
.ring-wrap .lbl b{font-family:var(--font-display);font-size:21px;font-weight:600;letter-spacing:-.04em;display:block;font-variant-numeric:tabular-nums}
.chart-grid line{stroke:var(--line-2)}
.chart-axis text{fill:var(--ink-4);font-size:11px;font-family:var(--font-sans);font-variant-numeric:tabular-nums}
.bar-anim{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:build .9s var(--ease) forwards}
.barh-anim{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:buildx 1s var(--ease-out) forwards}
@keyframes buildx{to{transform:scaleX(1)}}
.hbar-track{height:8px;background:var(--track);border-radius:6px;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:3px}
.tooltip{position:fixed;z-index:90;pointer-events:none;background:var(--glass-pop);color:var(--ink);padding:8px 11px;border-radius:10px;font-size:12px;line-height:1.45;border:1px solid var(--line);box-shadow:var(--shadow-lg);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;max-width:240px}
.tooltip b{font-weight:600}
.tooltip.on{opacity:1;transform:none}

/* ---------- Timeline stepper ---------- */
.stepper{display:flex;gap:0;position:relative;margin:6px 0 4px}
.step{flex:1;text-align:center;position:relative;padding-top:38px}
.step .node{position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line-strong);color:var(--ink-4);z-index:1;transition:.3s}
.step .node svg{width:13px;height:13px}
.step.done .node{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 1px 2px rgba(12,12,18,.12)}
.step.now .node{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 4px var(--brand-50),0 0 18px -2px color-mix(in srgb,var(--brand) 50%,transparent)}
.step.now .node::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1.5px solid var(--brand);animation:ping 2.4s infinite;opacity:0}
.step::before{content:"";position:absolute;top:12px;left:-50%;right:50%;height:1.5px;background:var(--line-strong)}
.step:first-child::before{display:none}
.step.done::before,.step.now::before{background:var(--brand)}
.step b{display:block;font-size:12.5px;font-weight:550;letter-spacing:-.01em}
.step small{color:var(--ink-3);font-size:11.5px}
.step.now b{color:var(--brand-text)}

/* ---------- 9-box ---------- */
.ninebox{display:grid;grid-template-columns:28px repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,1fr) 28px;gap:8px;height:430px}
.nb-cell{border-radius:12px;padding:10px;position:relative;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;overflow:hidden;transition:transform .25s var(--ease-out),box-shadow .25s,border-color .25s}
.nb-cell:hover{transform:scale(1.012);box-shadow:var(--shadow)}
.nb-cell h4{font-size:12px;font-weight:600;letter-spacing:-.01em;padding-right:24px;line-height:1.3}
.nb-cell .cnt{position:absolute;right:10px;top:7px;font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:-.04em;opacity:.9;font-variant-numeric:tabular-nums}
.nb-cell .people{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.nb-cell.drop{outline:1.5px dashed var(--brand);outline-offset:-4px;border-color:var(--brand-line)}
.nb-axis{display:grid;place-items:center;font-size:11.5px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.nb-axis.y{writing-mode:vertical-rl;transform:rotate(180deg)}
.dragp{cursor:grab;transition:transform .2s var(--ease-out)}
.dragp:hover{transform:scale(1.12);z-index:2}
.dragp.dragging{opacity:.4}

/* ---------- Heatmap ---------- */
.heat{display:grid;gap:4px;font-size:11.5px}
.heat .hc{height:32px;border-radius:7px;display:grid;place-items:center;font-weight:550;font-variant-numeric:tabular-nums;color:#fff;opacity:0;transform:scale(.6);animation:pop .5s var(--spring) forwards;cursor:default}
.heat .hl{display:flex;align-items:center;font-weight:500;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heat .hh{font-weight:500;color:var(--ink-3);text-align:center;font-size:11px;line-height:1.25;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}

/* ---------- Kanban ---------- */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kcol{background:color-mix(in srgb,var(--ink) 2.5%,transparent);border:1px solid var(--line-2);border-radius:14px;padding:10px;min-height:300px;transition:background .2s,border-color .2s}
.kcol.drop{background:var(--brand-50);border-color:var(--brand-line)}
.kcol h4{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;margin:4px 4px 12px}
.kcol .kempty{border:1.5px dashed var(--line-strong);border-radius:12px;padding:22px 12px;text-align:center;font-size:12px;color:var(--ink-4)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:grab;box-shadow:var(--shadow-xs),var(--card-inset);transition:transform .2s var(--ease-out),box-shadow .2s;animation:revealIn .5s var(--ease-out) both}
.kcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kcard.dragging{opacity:.4;transform:scale(.98)}
.kcard b{font-size:13px;font-weight:550;letter-spacing:-.01em;display:block;margin:8px 0 3px}

/* ---------- Career graph ---------- */
.cg-wrap{position:relative;border-radius:var(--r-lg);overflow:hidden;background:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--ink) 10%,transparent) 1px,transparent 0) 0 0/22px 22px,var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-xs),var(--card-inset)}
.cg-svg{display:block;width:100%;height:auto}
.cg-node{cursor:pointer}
.cg-node rect.box{fill:var(--surface);stroke:var(--line-strong);stroke-width:1;transition:stroke .2s,fill .2s;filter:drop-shadow(0 1px 2px rgba(12,12,18,.06))}
.cg-node:hover rect.box{stroke:var(--brand)}
.cg-node text{font-size:11px;font-weight:550;fill:var(--ink);font-family:var(--font-sans);letter-spacing:-.01em}
.cg-node text.sub{font-size:10px;font-weight:400;fill:var(--ink-3)}
.cg-node.current rect.box{fill:var(--brand);stroke:var(--brand)}
.cg-node.current text{fill:#fff}
.cg-node.current text.sub{fill:rgba(255,255,255,.78)}
.cg-node.target rect.box{stroke:var(--accent);stroke-width:1.75;fill:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.cg-node.onpath rect.box{stroke:var(--brand);stroke-width:1.75}
.cg-node.dim{opacity:.32}
.cg-edge{fill:none;stroke:color-mix(in srgb,var(--ink-3) 55%,transparent);stroke-width:1.25;transition:opacity .3s}
.cg-edge.lat{stroke-dasharray:4 4}
.cg-edge.dim{opacity:.2}
.cg-flow{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:6 10;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.cg-pulse{fill:none;stroke:var(--brand);stroke-width:1.5;animation:cgp 2.4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes cgp{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.2,1.5)}}
.cg-track-label{font-size:11.5px;font-weight:500;letter-spacing:0;fill:var(--ink-3);font-family:var(--font-sans)}
.cg-level{font-size:10.5px;font-weight:500;fill:var(--ink-4);font-family:var(--font-mono)}
.cg-traveler{fill:var(--accent);filter:drop-shadow(0 0 6px var(--accent))}

/* ---------- Drawer / modal / palette (frosted) ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.32);backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%);z-index:60;opacity:0;animation:fade .25s forwards}
.drawer{position:fixed;top:8px;right:8px;bottom:8px;width:min(440px,calc(100vw - 16px));background:var(--surface);border:1px solid var(--line);border-radius:18px;z-index:61;box-shadow:var(--shadow-xl);transform:translateX(105%);animation:slideIn .5s var(--ease-out) forwards;display:flex;flex-direction:column;overflow:hidden}
@keyframes slideIn{to{transform:none}}
.drawer header{padding:18px 20px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:12px}
.drawer header h3{font-size:16px;letter-spacing:-.025em}
.drawer .body{padding:20px;overflow:auto;flex:1}
.modal{position:fixed;left:50%;top:50%;z-index:61;width:min(560px,calc(100vw - 32px));max-height:86vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-xl);transform:translate(-50%,-47%) scale(.97);opacity:0;animation:modalIn .4s var(--ease-out) forwards}
@keyframes modalIn{to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.modal header{padding:22px 22px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal header h2{font-size:18px}
.modal .body{padding:18px 22px}
.modal footer{padding:14px 22px 20px;display:flex;justify-content:flex-end;gap:8px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:550;color:var(--ink-2)}
.input{min-height:36px;padding:8px 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);box-shadow:var(--shadow-xs);outline:none;transition:border-color .2s,box-shadow .2s;width:100%;font-size:13.5px}
.input:hover{border-color:color-mix(in srgb,var(--ink) 24%,transparent)}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-100)}
textarea.input{min-height:90px;resize:vertical;line-height:1.55}
:root[data-theme="dark"] .input{background:var(--surface-2)}
.palette{position:fixed;left:50%;top:14vh;transform:translateX(-50%) scale(.97);opacity:0;z-index:61;width:min(620px,calc(100vw - 32px));background:var(--glass-pop);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-radius:16px;box-shadow:var(--shadow-xl);overflow:hidden;animation:palIn .3s var(--ease-out) forwards;border:1px solid var(--line)}
@keyframes palIn{to{transform:translateX(-50%) scale(1);opacity:1}}
.palette input{width:100%;border:0;outline:0;padding:18px 20px;font-size:16px;letter-spacing:-.01em;background:transparent;border-bottom:1px solid var(--line)}
.palette input::placeholder{color:var(--ink-4)}
.palette .res{max-height:380px;overflow:auto;padding:6px}
.palette .it{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13.5px}
.palette .it svg{width:16px;height:16px;color:var(--ink-4)}
.palette .it.sel{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink)}
.palette .it.sel svg{color:var(--brand)}
.palette .grp{font-size:11.5px;font-weight:500;letter-spacing:0;color:var(--ink-4);padding:10px 12px 4px}
.toasts{position:fixed;right:20px;bottom:20px;z-index:95;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 10px;border-radius:14px;background:rgba(14,14,18,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.06),var(--shadow-lg);min-width:280px;animation:toastIn .5s var(--ease-out)}
.toast.out{animation:toastOut .35s var(--ease) forwards}
.toast .ti{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgba(74,222,128,.14);color:#4ADE80;flex:none}
.toast .ti svg{width:15px;height:15px}
@keyframes toastIn{from{transform:translateY(16px) scale(.96);opacity:0}}
@keyframes toastOut{to{transform:translateX(30px);opacity:0}}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--glass-pop);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-xl);padding:6px;min-width:280px;z-index:40;animation:menuIn .25s var(--ease-out);transform-origin:top right}
@keyframes menuIn{from{opacity:0;transform:scale(.96) translateY(-4px)}}
.menu-head{padding:6px 8px 4px;font-size:11.5px;font-weight:500;color:var(--ink-4)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:8px;text-align:left}
.menu button:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.menu button.on{background:color-mix(in srgb,var(--brand) 9%,transparent)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99}

/* ---------- Misc components ---------- */
.list-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:11px;transition:background .2s}
.list-item:hover{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.check{width:18px;height:18px;border-radius:6px;border:1.5px solid color-mix(in srgb,var(--ink) 22%,transparent);display:grid;place-items:center;flex:none;transition:.25s var(--spring)}
.check.on{background:var(--ink);border-color:var(--ink);color:var(--ink-inverse);transform:scale(1.04)}
.check svg{width:11px;height:11px;opacity:0;transform:scale(.4);transition:.25s var(--spring)}.check.on svg{opacity:1;transform:none}
.done-text{text-decoration:line-through;color:var(--ink-4)}
.goal{padding:16px;border:1px solid var(--line);border-radius:14px;transition:border-color .25s,box-shadow .25s,transform .25s var(--ease-out);background:var(--surface);box-shadow:var(--shadow-xs),var(--card-inset)}
.goal:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.goal[data-goal]{cursor:pointer}
.goal .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink-3);font-size:12px;margin-top:10px}
.goal-pct{font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:-.04em}
.kudos{padding:18px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-xs),var(--card-inset);position:relative;overflow:hidden;isolation:isolate;transition:transform .3s var(--ease-out),box-shadow .3s}
.kudos:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.kudos .val{position:absolute;right:-30px;top:-40px;width:120px;height:120px;border-radius:50%;opacity:.16;filter:blur(24px);z-index:-1}
.tilt{transform-style:preserve-3d;transition:transform .25s var(--ease)}
.pom{border-radius:var(--r-xl);padding:28px;color:#fff;position:relative;overflow:hidden;isolation:isolate;background:#0B0B0F;border:1px solid rgba(255,255,255,.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 30px 60px -30px rgba(29,74,133,.6)}
.pom::before{content:"";position:absolute;inset:-20%;z-index:-2;background:radial-gradient(30% 50% at 84% 40%,rgba(234,179,8,.32),transparent 72%),radial-gradient(34% 50% at 70% 0%,#3C82D6,transparent 72%),radial-gradient(28% 40% at 10% 100%,rgba(29,74,133,.6),transparent 72%);filter:blur(30px) saturate(140%);opacity:.8}
.pom::after{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.2px);background-size:22px 22px;-webkit-mask-image:radial-gradient(60% 90% at 90% 20%,#000,transparent 75%);mask-image:radial-gradient(60% 90% at 90% 20%,#000,transparent 75%);opacity:.5}
.pom h2{letter-spacing:-.04em}
.pom p{color:rgba(255,255,255,.66)}
.pom .shine{position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.06) 45%,transparent 60%);transform:translateX(-100%);animation:shine 6s 1s infinite}
@keyframes shine{0%{transform:translateX(-100%)}40%,100%{transform:translateX(100%)}}
.trophy{animation:float 4s ease-in-out infinite}
.trophy-badge{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;color:#FCD9A0;background:radial-gradient(circle at 50% 35%,rgba(252,211,77,.22),rgba(255,255,255,.03) 70%);border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 20px 50px -20px rgba(234,179,8,.5)}
.trophy-badge svg{width:54px;height:54px;filter:drop-shadow(0 4px 12px rgba(234,179,8,.45))}

.ai{border-radius:var(--r-lg);padding:1px;background:linear-gradient(120deg,color-mix(in srgb,var(--brand-400) 75%,transparent),rgba(192,132,252,.55),rgba(34,211,238,.5),color-mix(in srgb,var(--brand-400) 75%,transparent));background-size:300% 300%;animation:grad 10s ease infinite;box-shadow:0 10px 30px -18px color-mix(in srgb,var(--brand) 80%,transparent)}
.ai>div{background:var(--surface);border-radius:calc(var(--r-lg) - 1px);padding:18px}
.ai-head{font-weight:600;font-size:13px;color:var(--violet);letter-spacing:-.01em}
@keyframes grad{50%{background-position:100% 50%}}
.caret{display:inline-block;width:2px;height:15px;background:var(--brand);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.skill-bar{display:grid;grid-template-columns:minmax(0,1fr) 150px 40px;gap:12px;align-items:center;padding:8px 0}
.lvl{display:flex;gap:3px}
.lvl i{flex:1;height:7px;border-radius:3px;background:var(--track);transition:background .3s}
.lvl i.f{background:var(--brand)}
.lvl i.req{box-shadow:inset 0 0 0 1.5px var(--accent)}
.comp-card{padding:16px;border-radius:14px;border:1px solid var(--line);cursor:pointer;transition:border-color .25s,transform .25s var(--ease-out),box-shadow .25s;background:var(--surface);box-shadow:var(--shadow-xs),var(--card-inset)}
.comp-card:hover{border-color:var(--line-strong);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.comp-card b{font-weight:600;letter-spacing:-.015em}

:root[data-theme="dark"] .mini-stat{background:var(--surface-3)}
.mini-stat b{font-family:var(--font-display);font-size:20px;font-weight:600;letter-spacing:-.035em;display:block;font-variant-numeric:tabular-nums}
.pyr{display:grid;grid-template-columns:1fr 50px 1fr;gap:6px;align-items:center;font-size:11.5px}
.pyr b{font-weight:500;color:var(--ink-3)}
.pyr .l,.pyr .r{height:16px;border-radius:5px}
.pyr .l{justify-self:end;background:var(--brand)}
.pyr .r{background:var(--accent-400)}

:root[data-theme="dark"] .scale button{background:var(--surface-3)}
.scale button b{font-family:var(--font-display);font-size:17px;font-weight:600;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.scale button span{font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.scale button:hover{border-color:var(--line-strong)}
.scale button.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px -4px color-mix(in srgb,var(--brand) 70%,transparent)}
.scale button.on span{color:rgba(255,255,255,.8)}
.rank{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.rank.r1{background:rgba(234,179,8,.16);color:#A16207;box-shadow:inset 0 0 0 1px rgba(234,179,8,.4)}

.mobile-nav{display:none}
.hide-sm{}
.orb{display:none}

function countUp(el){const to=parseFloat(el.dataset.count),d=+(el.dataset.dec||0),dur=+(el.dataset.dur||1400),pre=el.dataset.pre||'',suf=el.dataset.suf||'';const t0=performance.now();
  const step=t=>{const k=Math.max(0,Math.min(1,(t-t0)/dur)),e=1-Math.pow(1-k,4);el.textContent=pre+fmt(to*e,d)+suf;if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
function animateIn(root=document){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;io.unobserve(el);
    if(el.classList.contains('reveal')){el.style.animationDelay=(el.dataset.d||0)+'ms';el.classList.add('in');const fin=ev=>{if(ev.target!==el)return;el.removeEventListener('animationend',fin);el.classList.remove('reveal','in');el.style.animationDelay=''};el.addEventListener('animationend',fin)}
    $$('[data-count]',el).forEach(x=>{if(!x._c){x._c=1;setTimeout(()=>countUp(x),(+el.dataset.d||0))}});
    $$('.progress i[data-w]',el).forEach(x=>setTimeout(()=>x.style.width=x.dataset.w+'%',120+(+el.dataset.d||0)));
    $$('.ring .val[data-off]',el).forEach(x=>setTimeout(()=>x.style.strokeDashoffset=x.dataset.off,150+(+el.dataset.d||0)));
    $$('[data-radar]',el).forEach(x=>animateRadar(x));
  }),{threshold:.08});
  let i=0;$$('.reveal',root).forEach(el=>{if(!el.dataset.d){el.dataset.d=Math.min(i*60,600);i++}io.observe(el)});
  $$('[data-count]',root).forEach(x=>{if(!x.closest('.reveal'))countUp(x)});
  $$('.ring .val[data-off]',root).forEach(x=>{if(!x.closest('.reveal'))setTimeout(()=>x.style.strokeDashoffset=x.dataset.off,150)});
  $$('.progress i[data-w]',root).forEach(x=>{if(!x.closest('.reveal'))setTimeout(()=>x.style.width=x.dataset.w+'%',120)});
}

function ring(v,size=96,sw=10,color='var(--brand)',label='',sub='',max=100){const r=(size-sw)/2,c=2*Math.PI*r,off=c*(1-Math.min(v,max)/max);
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px"><svg class="ring" width="${size}" height="${size}"><circle class="track" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${sw}"/><circle class="val" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${off}"/></svg><div class="lbl">${label}${sub?`<small class="muted xs">${sub}</small>`:''}</div></div>`}
function spark(arr,color='var(--brand)',id){const w=200,h=40,mx=Math.max(...arr),mn=Math.min(...arr);const pts=arr.map((v,i)=>[i*(w/(arr.length-1)),h-4-((v-mn)/(mx-mn||1))*(h-8)]);
  const d=smooth(pts);const gid='sp'+(id||Math.random().toString(36).slice(2));
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".25"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path class="fade-area" d="${d} L${w},${h} L0,${h} Z" fill="url(#${gid})"/><path class="draw" d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
function smooth(p){if(p.length<2)return'';let d=`M${p[0][0]},${p[0][1]}`;for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];d+=` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}return d}
function areaChart(data,{h=220,color='var(--brand)',suffix=''}={}){const w=640,pl=36,pb=26,pt=14,mx=Math.ceil(Math.max(...data.map(d=>d[1]))/250)*250;
  const X=i=>pl+i*((w-pl-10)/(data.length-1)),Y=v=>pt+(h-pt-pb)*(1-v/mx);const pts=data.map((d,i)=>[X(i),Y(d[1])]);const d=smooth(pts);
  let g='';for(let k=0;k<=4;k++){const v=mx*k/4;g+=`<line x1="${pl}" x2="${w-10}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pl-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`}
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="overflow:visible"><defs><linearGradient id="ag" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
  <g class="chart-grid chart-axis">${g}</g>
  <path class="fade-area" d="${d} L${X(data.length-1)},${h-pb} L${pl},${h-pb} Z" fill="url(#ag)"/>
  <path class="draw" d="${d}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round"/>
  ${pts.map((p,i)=>`<g data-tip="<b>${data[i][0]}</b><br>${fmt(data[i][1])}${suffix} employees" style="opacity:0;animation:fade .4s ${0.9+i*.12}s forwards"><circle cx="${p[0]}" cy="${p[1]}" r="12" fill="transparent"/><circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="var(--surface)" stroke="${color}" stroke-width="2.5"/></g>`).join('')}
  <g class="chart-axis">${data.map((d,i)=>`<text x="${X(i)}" y="${h-6}" text-anchor="middle">${d[0]}</text>`).join('')}</g></svg>`}
function donut(segs,size=190,sw=26,center=''){const r=(size-sw)/2,c=2*Math.PI*r,tot=segs.reduce((a,s)=>a+s[1],0);let acc=0;
  const arcs=segs.map((s,i)=>{const len=c*s[1]/tot,gap=segs.length>1?2:0;const el=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${s[2]}" stroke-width="${sw}" stroke-dasharray="0 ${c}" stroke-dashoffset="${-acc}" data-len="${Math.max(len-gap,0)}" data-c="${c}" data-tip="<b>${s[0]}</b><br>${fmt(s[1])} · ${(s[1]/tot*100).toFixed(1)}%" style="transition:stroke-dasharray 1s ${.1+i*.08}s var(--ease),stroke-width .2s;cursor:pointer" onmouseenter="this.style.strokeWidth=${sw+6}" onmouseleave="this.style.strokeWidth=${sw}"/>`;acc+=len;return el}).join('');
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px"><svg class="ring donut" width="${size}" height="${size}" style="overflow:visible">${arcs}</svg><div class="lbl">${center}</div></div>`}
function growDonuts(root){$$('.donut circle[data-len]',root).forEach(c=>requestAnimationFrame(()=>requestAnimationFrame(()=>c.style.strokeDasharray=`${c.dataset.len} ${c.dataset.c}`)))}
function barsH(rows,{color='var(--brand)',max,unit='',labelW=210}={}){const mx=max||Math.max(...rows.map(r=>r[1]));
  return `<div class="stack" style="gap:10px">${rows.map((r,i)=>`<div data-tip="<b>${r[0]}</b><br>${fmt(r[1])}${unit}" style="display:grid;grid-template-columns:minmax(80px,min(${labelW}px,42%)) 1fr 48px;gap:12px;align-items:center"><span class="small" style="font-weight:550;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r[0]}</span><div class="hbar-track"><div class="barh-anim" style="height:100%;width:${r[1]/mx*100}%;border-radius:6px;background:${r[2]||color};animation-delay:${i*70}ms"></div></div><b class="small num" style="text-align:right">${fmt(r[1])}${unit}</b></div>`).join('')}</div>`}
function radar(axes,series,size=340){const cx=size/2,cy=size/2,R=size/2-58,n=axes.length;const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*R*v/5,cy+Math.sin(a)*R*v/5]};
  let g='';for(let l=1;l<=5;l++){g+=`<polygon points="${axes.map((_,i)=>pt(i,l).join(',')).join(' ')}" fill="${l%2?'color-mix(in srgb,var(--ink) 2.5%,transparent)':'none'}" stroke="var(--line-strong)"/>`}
  axes.forEach((a,i)=>{const [x,y]=pt(i,5);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;const [lx,ly]=pt(i,6.15);const words=a.replace(' & ',' &\n').split('\n');g+=`<text x="${lx}" y="${ly}" text-anchor="${Math.abs(lx-cx)<8?'middle':lx>cx?'start':'end'}" font-size="10.5" font-weight="500" fill="var(--ink-2)">${words.map((w,k)=>`<tspan x="${lx}" dy="${k?12:(words.length>1?-2:4)}">${esc(w)}</tspan>`).join('')}</text>`});
  const polys=series.map((s,si)=>`<polygon data-radar data-vals="${s.vals.join(',')}" data-n="${n}" data-cx="${cx}" data-cy="${cy}" data-r="${R}" points="${axes.map(()=>`${cx},${cy}`).join(' ')}" fill="${s.fill||s.color}" fill-opacity="${s.op??.18}" stroke="${s.color}" stroke-width="2" ${s.dash?'stroke-dasharray="5 4"':''} style="transition:all .3s"/>`).join('');
  return `<svg viewBox="-70 -6 ${size+140} ${size+12}" width="100%" style="max-width:${size+140}px;overflow:visible;display:block;margin:auto">${g}${polys}</svg>`}
function animateRadar(el){if(el._a)return;el._a=1;const v=el.dataset.vals.split(',').map(Number),n=+el.dataset.n,cx=+el.dataset.cx,cy=+el.dataset.cy,R=+el.dataset.r;const t0=performance.now();
  const f=t=>{const k=Math.max(0,Math.min(1,(t-t0)/1200)),e=k<1?1-Math.pow(2,-10*k)*Math.cos(k*6):1;el.setAttribute('points',v.map((x,i)=>{const a=-Math.PI/2+i*2*Math.PI/n,rr=R*x/5*e;return`${cx+Math.cos(a)*rr},${cy+Math.sin(a)*rr}`}).join(' '));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}

  ];
  const d=overlay(`<input placeholder="Type a command or search…" autofocus/><div class="res"></div><div class="row xs muted" style="padding:10px 16px;border-top:1px solid var(--line);gap:14px"><span><span class="kbd">↑↓</span> navigate</span><span><span class="kbd">↵</span> open</span><span><span class="kbd">esc</span> close</span></div>`,'palette');
  const inp=$('input',d),res=$('.res',d);let sel=0,list=[];
  const draw=()=>{const q=inp.value.toLowerCase().trim();list=items.filter(i=>!q||(i.l+' '+(i.sub||'')).toLowerCase().includes(q)).slice(0,q?40:12);sel=Math.min(sel,list.length-1);let lg='';
    res.innerHTML=list.length?list.map((it,i)=>{const h=it.g!==lg?`<div class="grp">${it.g}</div>`:'';lg=it.g;return h+`<div class="it ${i===sel?'sel':''}" data-i="${i}">${it.person?av(it.l,24):icon(it.ic)}<span style="flex:1">${it.l}</span>${it.sub?`<span class="xs muted">${it.sub}</span>`:''}</div>`}).join(''):emptyState('search',`No results for “${esc(inp.value)}”`,'Try a person, role, competency or page name.');
    $$('.it',res).forEach(el=>{el.onclick=()=>{closeOverlay();list[+el.dataset.i].run()};el.onmousemove=()=>{if(sel!==+el.dataset.i){sel=+el.dataset.i;$$('.it',res).forEach(x=>x.classList.toggle('sel',x===el))}}})};
  inp.oninput=()=>{sel=0;draw()};
  inp.onkeydown=e=>{if(e.key==='ArrowDown'){sel=(sel+1)%list.length;draw();$('.sel',res)?.scrollIntoView({block:'nearest'});e.preventDefault()}if(e.key==='ArrowUp'){sel=(sel-1+list.length)%list.length;draw();$('.sel',res)?.scrollIntoView({block:'nearest'});e.preventDefault()}if(e.key==='Enter'&&list[sel]){closeOverlay();list[sel].run()}};

}

function edgePath(a,b){const A=cgPos(a),B=cgPos(b),h=CG.nh/2,w=CG.nw/2;

  <div class="card reveal s-6"><div class="card-head"><div><h3>Age & gender</h3><p>${fmt(812-fem)} men · ${fmt(fem)} women</p></div><div class="legend"><span><i style="background:var(--brand)"></i>Men</span><span><i style="background:var(--accent-400)"></i>Women</span></div></div>
   <div class="stack" style="gap:7px">${O.age.map(([a,m,f],i)=>`<div class="pyr"><div class="l barh-anim" style="width:${m/200*100}%;transform-origin:right;animation-delay:${i*80}ms" data-tip="${a} · Men: ${m}"></div><b class="num" style="text-align:center">${a}</b><div class="r barh-anim" style="width:${f/200*100}%;animation-delay:${i*80}ms" data-tip="${a} · Women: ${f}"></div></div>`).join('')}</div>
   <div class="divider"></div><div class="row" style="gap:8px">${O.edu.map(([l,v],i)=>`<div style="flex:${v};min-width:0" data-tip="${l}: ${v}%"><div style="height:8px;border-radius:5px;background:${['var(--brand)','var(--accent-400)','var(--brand-400)'][i]}"></div><div class="xs muted" style="margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l} · ${v}%</div></div>`).join('')}</div></div>
  <div class="card reveal s-4"><div class="card-head"><div><h3>Tenure</h3><p>41% joined in the last 12 months</p></div></div>${barsH(O.tenure,{color:'var(--teal)',labelW:80})}</div>
  <div class="card reveal s-4"><div class="card-head"><div><h3>Career levels</h3><p>L1–L9 ladder</p></div></div>${barsH(O.levels,{color:'var(--violet)',labelW:120})}</div>
  <div class="card reveal s-4"><div class="card-head"><div><h3>Attrition by function</h3><p>Annualised · org average 34%</p></div><span class="badge red">Watch</span></div>${barsH(O.attrition.map(a=>[a[0],a[1],a[1]>35?'var(--bad)':a[1]>25?'var(--warn)':'var(--ok)']),{unit:'%',max:60,labelW:100})}
   <div class="divider"></div><div class="row small" style="align-items:flex-start">${icon('lightbulb').replace('<svg','<svg width="16" height="16" style="color:var(--warn);flex:none;margin-top:2px"')}<span>Inside Sales attrition falls to <b>22%</b> for people with an IDP and a mentor.</span></div></div>
  <div class="card reveal s-12"><div class="card-head wrap"><div><h3>People directory</h3><p>Mumbai West & Navi Mumbai cluster</p></div><div class="search" style="margin:0;max-width:280px;background:var(--surface);border-color:var(--line)">${icon('search').replace('<svg','<svg width="16" height="16"')}<input id="dq" placeholder="Search name, role, office…" style="border:0;outline:0;background:transparent;flex:1"></div></div>
   <div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Role</th><th>Office</th><th>H1 attainment</th><th>Rating</th><th>9-box</th><th>Flight risk</th></tr></thead><tbody id="dir"></tbody></table></div></div>
 </div>`};
PAGES.people.after=v=>{const draw=q=>{$('#dir',v).innerHTML=TEAM.filter(t=>(t.n+t.r+t.loc).toLowerCase().includes(q)).map(t=>`<tr style="cursor:pointer" data-p="${t.n}"><td><div class="row">${av(t.n,30)}<b class="small">${t.n}</b></div></td><td class="small">${t.r}</td><td class="small muted">${t.loc}</td><td style="min-width:140px"><div class="row"><div class="progress ${t.att<80?'orange':t.att>=100?'green':''}" style="flex:1;height:6px"><i style="width:${Math.min(t.att,100)}%"></i></div><b class="xs num">${t.att}%</b></div></td><td class="num small"><b>${t.rating.toFixed(1)}</b></td><td><span class="badge" style="color:${NB_LABELS[t.perf+'-'+t.pot][1]};background:color-mix(in srgb,${NB_LABELS[t.perf+'-'+t.pot][1]} 12%,transparent)">${NB_LABELS[t.perf+'-'+t.pot][0]}</span></td><td><span class="badge ${t.risk==='High'?'red':t.risk==='Medium'?'yellow':'green'}"><i></i>${t.risk}</span></td></tr>`).join('')||`<tr><td colspan="7" style="border:0">${emptyState('users',`No one matches “${esc(q)}”`,'Search by name, role or office, e.g. “Thane”.')}</td></tr>`;$$('[data-p]',v).forEach(r=>r.onclick=()=>personCard(TEAM.find(t=>t.n===r.dataset.p)))};
 draw('');$('#dq',v).oninput=e=>draw(e.target.value.toLowerCase());
 $$('[data-tabs="pplrange"] button',v).forEach(b=>b.onclick=()=>{$$('[data-tabs="pplrange"] button',v).forEach(x=>x.classList.toggle('on',x===b));placePills(v);toast(`Showing ${b.textContent} snapshot (demo data)`,'calendar')})};

PAGES.recognition=()=>`
 <div class="page-head"><div><div class="eyebrow">Recognition</div><h1>Celebrate great work</h1><p>Every kudos is tied to a Brightkey value and counts toward Performer of the Month.</p></div><button class="btn btn-accent" onclick="giveKudos()">${icon('award')}Give kudos</button></div>
 <div class="grid g-12">
  <div class="pom reveal s-8"><div class="shine"></div><div class="row between wrap" style="gap:20px;position:relative">
   <div><span class="glass-chip">${icon('trophy').replace('<svg','<svg width="14" height="14"')} Performer of the Month · August 2026</span>
    <div class="row" style="margin-top:18px;gap:16px">${av('Imran Qureshi',72)}<div><h2 style="color:#fff;font-size:28px">Imran Qureshi</h2><p>Sales Manager · Andheri</p></div></div>
    <p style="margin-top:14px;max-width:460px">₹1.4 Cr booked in August across 5 families, all through end-to-end advisory, with a 4.9 CSAT.</p>
    <div class="row wrap" style="gap:8px;margin-top:14px"><span class="glass-chip">118% attainment</span><span class="glass-chip">140 site visits</span><span class="glass-chip">27 kudos</span></div></div>
   <div class="trophy trophy-badge" aria-hidden="true">${icon('trophy','',1.5)}</div></div></div>
  <div class="card reveal s-4"><div class="card-head"><div><h3>Values leaderboard</h3><p>Kudos this quarter</p></div></div>
   ${barsH(VALUES.map((v,i)=>[v.n,[412,356,301,288,190,164][i],v.c]),{labelW:130})}</div>
  <div class="s-12 row wrap" id="vf" style="gap:8px"><button class="chip on" data-v="">All values</button>${VALUES.map(v=>`<button class="chip" data-v="${v.n}"><span style="color:${v.c}">${icon(v.ic).replace('<svg','<svg width="14" height="14"')}</span>${v.n}</button>`).join('')}</div>
  <div class="s-12 grid" id="wall" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px"></div>
 </div>`;
PAGES.recognition.after=v=>{drawWall('');$$('#vf .chip',v).forEach(c=>c.onclick=()=>{$$('#vf .chip',v).forEach(x=>x.classList.toggle('on',x===c));drawWall(c.dataset.v)})};
function drawWall(f){const w=$('#wall');if(!w)return;w.innerHTML=KUDOS.filter(k=>!f||k.val===f).map((k,i)=>`<div class="kudos" style="animation:revealIn .5s ${i*60}ms var(--ease) both"><div class="val" style="background:${k.c}"></div><div class="row">${av(k.from,36)}<div style="flex:1"><div class="small"><b>${k.from}</b></div><div class="xs muted">to <b style="color:var(--ink)">${k.to}</b> · ${k.time}${k.time==='Just now'?'':' ago'}</div></div></div><p class="small" style="margin:12px 0;color:var(--ink-2)">${esc(k.msg)}</p><div class="row between"><span class="badge" style="background:color-mix(in srgb,${k.c} 12%,transparent);color:${k.c}">${k.val}</span><button class="row xs like" data-i="${KUDOS.indexOf(k)}" style="gap:5px;color:var(--ink-3);font-weight:600">${icon('heart').replace('<svg','<svg width="16" height="16"')}<span class="num">${k.likes}</span></button></div></div>`).join('')||emptyState('award','No kudos for this value yet','Be the first to recognise someone for it.','<button class="btn btn-primary btn-sm" onclick="giveKudos()">Give kudos</button>');
 $$('.like',w).forEach(b=>b.onclick=()=>{const k=KUDOS[b.dataset.i];if(b.dataset.on)return;b.dataset.on=1;k.likes++;b.style.color='var(--bad)';$('svg',b).setAttribute('fill','currentColor');$('span',b).textContent=k.likes;b.animate([{transform:'scale(1)'},{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:400,easing:'cubic-bezier(.34,1.56,.64,1)'})})}
function giveKudos(to){let val=VALUES[1].n;modal('Give kudos',`<div class="field"><label>To</label><select class="input" id="kt">${TEAM.filter(t=>t.n!==P().name).map(t=>`<option ${t.n===to?'selected':''}>${t.n}</option>`).join('')}</select></div>
 <div class="field"><label>Which value did they live?</label><div class="grid" style="grid-template-columns:repeat(3,1fr);gap:8px">${VALUES.map(v=>`<button class="chip kv ${v.n===val?'on':''}" data-v="${v.n}" style="flex-direction:column;border-radius:14px;padding:12px 6px;justify-content:center;text-align:center"><span style="color:${v.c}">${icon(v.ic).replace('<svg','<svg width="22" height="22"')}</span><span class="xs">${v.n}</span></button>`).join('')}</div></div>
 <div class="field"><label>Message</label><textarea class="input" id="km" placeholder="What did they do, and why did it matter?"></textarea></div>`,`<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-accent" id="ks">${icon('send')}Send kudos</button>`,'It will appear on the recognition wall');
 $$('.kv').forEach(b=>b.onclick=()=>{val=b.dataset.v;$$('.kv').forEach(x=>x.classList.toggle('on',x===b))});$$('[data-close]').forEach(b=>b.onclick=closeOverlay);
 $('#ks').onclick=()=>{const kt=$('#kt').value;const m=$('#km').value.trim()||'Thank you for going above and beyond this week!';const v=VALUES.find(x=>x.n===val);KUDOS.unshift({from:P().name,to:kt,val,msg:m,time:'Just now',c:v.c,likes:0});closeOverlay();confetti();toast(`Kudos sent to ${kt}`,'award');if(S.route==='recognition'){$$('#vf .chip').forEach(x=>x.classList.toggle('on',!x.dataset.v));drawWall('')}}}

(function boot(){
  shell();route();
  const sp=$('#splash');setTimeout(()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),800)},matchMedia('(prefers-reduced-motion: reduce)').matches?200:1900);
})();
</script>
</body>
</html>

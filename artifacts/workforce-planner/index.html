<script>
(function () {
  'use strict';
  const D = NSData, U = NS.util, F = NS.fmt, raw = NS.raw, ic = NS.ic; const html = (st, ...v) => st.reduce((a, x, i) => a + x + (i < v.length ? (Array.isArray(v[i]) ? v[i].map(NS.str).join('') : NS.str(v[i] == null || v[i] === false ? '' : v[i])) : ''), '');
  const store = NS.store('workforce-planner');
  const esc = NS.esc;
  const TODAY = new Date('2026-09-24T10:00:00');
  const TODAY_ISO = '2026-09-24';
  const PEOPLE = D.people;
  const QS = ['Q1', 'Q2', 'Q3', 'Q4'];
  const DEPTS = ['Engineering', 'Product', 'Design', 'Sales', 'Customer Success', 'Marketing', 'People', 'Finance', 'Legal & Compliance', 'IT & Workplace', 'Executive'];
  const PORTFOLIO = ['Engineering', 'Product', 'Design'];
  const INDIA = new Set(['MUM', 'BLR', 'PUN']);
  const SHORT = { 'Core Services': 'Core Services', 'Infrastructure & SRE': 'Infra & SRE', 'Developer Experience': 'Dev Experience', 'Quality Engineering': 'Quality Eng.', 'Product Management': 'Product Mgmt', 'Product Operations': 'Product Ops', 'Customer Success': 'Cust. Success', 'Legal & Compliance': 'Legal', 'IT & Workplace': 'IT & Workplace', 'Engineering Leadership': 'Eng. leadership', 'Revenue Leadership': 'Revenue leadership' };
  const short = (s) => SHORT[s] || s;
  const m$ = (n, d) => F.money(n, { compact: true, d: d ?? 1 });
  const sgn = (n, f) => (n === 0 || n == null ? (f ? f(0) : '0') : (n > 0 ? '+' : '−') + (f ? f(Math.abs(n)) : F.int(Math.abs(n))));
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const iso = (d) => new Date(d).toISOString().slice(0, 10);
  // largest-remainder allocation: integers that sum exactly to `total`
  const alloc = (total, weights) => {
    const n = weights.length; if (!n) return [];
    const sign = total < 0 ? -1 : 1, T = Math.abs(Math.round(total)), W = U.sum(weights.map((w) => Math.max(0, w)));
    const out = weights.map(() => 0); if (!T) return out; if (!W) { out[0] = T * sign; return out; }
    const r0 = weights.map((w) => (Math.max(0, w) / W) * T), fl = r0.map((v) => Math.floor(v + 1e-9)); let rem = T - U.sum(fl);
    const order = r0.map((v, i) => [v - fl[i], i]).sort((a, b) => b[0] - a[0] || a[1] - b[1]);
    for (let k = 0; k < rem; k++) fl[order[k % n][1]]++;
    return fl.map((v) => v * sign);
  };

  /* ------------------------------------------------------------------ */
  /* 1. Domain — cost model, org units, the FY26 plan                    */
  /* ------------------------------------------------------------------ */
  // function multipliers recovered from the band structure (band mid = level mid × function × location tier)
  const FN = {};
  D.departments.forEach((d) => { const ps = PEOPLE.filter((p) => p.dept === d.name && p.track !== 'E'); FN[d.name] = U.round(U.median(ps.map((p) => p.band.mid / (D.levelMap[p.level].mid * D.locMap[p.location].tier))), 2); });
  FN.Executive = 1;
  const bandMid = (level, dept, loc) => Math.round((D.levelMap[level].mid * (FN[dept] || 0.9) * D.locMap[loc].tier) / 500) * 500;
  const HIRE_MIX = { P1: 0.15, P2: 0.4, P3: 0.35, P4: 0.1 }; // typical level mix of a new role
  const hireMid = (dept, loc) => U.sum(Object.entries(HIRE_MIX).map(([l, w]) => w * bandMid(l, dept, loc)));

  const deptDef = (name) => D.departments.find((d) => d.name === name);
  const UNITS = Object.entries(U.groupBy(PEOPLE, (p) => p.dept + '|' + p.org)).map(([key, ps]) => { const [dept, org] = key.split('|'); return { key, dept, org, people: ps, hc: ps.length, lead: /Leadership$/.test(org) || org === 'Executive' }; });
  const orgIdx = (u) => { if (u.lead) return -1; const d = deptDef(u.dept); return d ? d.orgs.findIndex((o) => o.name === u.org) : 0; };
  UNITS.sort((a, b) => DEPTS.indexOf(a.dept) - DEPTS.indexOf(b.dept) || orgIdx(a) - orgIdx(b));
  const UBY = Object.fromEntries(UNITS.map((u) => [u.key, u]));
  UNITS.forEach((u) => {
    const ps = u.people;
    u.teams = U.uniq(ps.map((p) => p.team)).filter((t) => !/Leadership$|^Office of/.test(t));
    u.locShare = {}; ps.forEach((p) => { u.locShare[p.location] = (u.locShare[p.location] || 0) + 1 / u.hc; });
    u.india = ps.filter((p) => INDIA.has(p.location)).length; u.indiaShare = u.india / u.hc;
    const core = ps.filter((p) => p.track === 'IC' && ['P1', 'P2', 'P3', 'P4'].includes(p.level));
    u.avgIC = core.length ? U.avg(core, 'salary') : U.avg(ps, 'salary');
    u.p3 = (ps.filter((p) => p.level === 'P3')[0] ? U.avg(ps.filter((p) => p.level === 'P3'), 'salary') : u.avgIC);
    u.contractors = ps.filter((p) => p.type === 'Contract').length;
    u.salFTE = U.sum(ps.filter((p) => p.type !== 'Contract'), 'salary'); u.salCon = U.sum(ps.filter((p) => p.type === 'Contract'), 'salary');
    u.mgrs = ps.filter((p) => p.directs > 0);
    const locs = Object.keys(u.locShare);
    const blend = (ls, fb) => { const tot = U.sum(ls.map((l) => u.locShare[l])); return tot ? U.sum(ls.map((l) => (u.locShare[l] / tot) * hireMid(u.dept, l))) : hireMid(u.dept, fb); };
    u.costIN = blend(locs.filter((l) => INDIA.has(l)), 'BLR'); u.costOUT = blend(locs.filter((l) => !INDIA.has(l)), 'AUS');
  });

  // FY26 plan by department: [full-year net adds, YTD planned net (Q1–Q3), YTD actual net]
  const DEPT_PLAN = { Engineering: [96, 50, 44], Product: [9, 5, 5], Design: [6, 2, 3], Sales: [24, 11, 14], 'Customer Success': [14, 8, 8], Marketing: [6, 4, 3], People: [5, 3, 2], Finance: [4, 2, 2], 'Legal & Compliance': [2, 2, 0], 'IT & Workplace': [3, 2, 1], Executive: [0, 0, 0] };
  const ORG_GROWTH = { 'Data & ML': 1.7, Security: 1.35, 'Infrastructure & SRE': 1.1, Platform: 1.0, 'Core Services': 0.75, Frontend: 0.85, Mobile: 0.6, 'Developer Experience': 0.8, 'Quality Engineering': 0.55, 'Product Management': 1.25, 'Product Operations': 0.6 };
  const ORG_EXEC = { 'Data & ML': 1.2, Platform: 0.6, Security: 0.78, 'Core Services': 1.15, 'Quality Engineering': 1.25, Mobile: 0.95, Frontend: 1.02, 'Infrastructure & SRE': 1.0, 'Developer Experience': 1.08 };
  DEPTS.forEach((d) => {
    const us = UNITS.filter((u) => u.dept === d && !u.lead); const [fy, yp, ya] = DEPT_PLAN[d];
    const w = us.map((u) => u.hc * (ORG_GROWTH[u.org] || 1));
    const a1 = alloc(fy, w), a2 = alloc(yp, w), a3 = alloc(ya, us.map((u, i) => w[i] * (ORG_EXEC[u.org] || 1)));
    us.forEach((u, i) => { u.fy = a1[i]; u.ytdPlan = a2[i]; u.ytdAct = a3[i]; });
  });
  UNITS.forEach((u) => { if (u.fy == null) u.fy = u.ytdPlan = u.ytdAct = 0; u.opening = u.hc - u.ytdAct; u.target = u.opening + u.fy; });
  // quarterly split with exact company totals (company actuals match the monthly headcount series)
  const PLAN_Q = [24, 30, 35], ACT_Q = [31, 21, 30];
  const splitQ = (tots, key) => { const rem = UNITS.map((u) => u[key]); const out = UNITS.map(() => []); tots.forEach((T, qi) => { const a = qi === tots.length - 1 ? rem.slice() : alloc(T, rem); a.forEach((v, i) => { out[i][qi] = v; rem[i] -= v; }); }); return out; };
  const pQ = splitQ(PLAN_Q, 'ytdPlan'), aQ = splitQ(ACT_Q, 'ytdAct');
  const rs = NS.rng(2611);
  UNITS.forEach((u, i) => {
    u.plan = []; u.act = []; let hp = u.opening, ha = u.opening;
    for (let q = 0; q < 3; q++) {
      const pn = pQ[i][q], an = aQ[i][q];
      const px = u.lead ? 0 : Math.round(hp * 0.02), pb = Math.round(px * 0.85);
      const ex = u.lead ? 0 : ha * [0.019, 0.022, 0.018][q]; const ax = Math.floor(ex) + (rs() < ex % 1 ? 1 : 0); const ab = Math.max(0, ax - (rs() < 0.22 ? 1 : 0));
      u.plan.push({ h: pn - pb + px, b: pb, x: px }); u.act.push({ h: an - ab + ax, b: ab, x: ax });
      hp += pn; ha += an;
    }
  });
  const netOf = (c) => c.h + c.b - c.x;
  const SETTINGS0 = { attr: 8, merit: 3.5, backfill: 85, lead: 52, basis: 'mid', oncost: 24, margin: 30, mgrShare: 6, fyStart: '2026-01-01', fyEnd: '2026-12-31' };
  // Q4 plan: exits from the attrition assumption, backfills at the company backfill ratio, new roles close the gap to the EOY target
  const deriveQ4 = (st, q4, edited = {}) => {
    const out = q4 ? clone(q4) : {};
    UNITS.forEach((u) => { const c = out[u.key] || (out[u.key] = { h: 0, b: 0, x: 0 }); if (!edited[u.key + ':x']) c.x = u.lead ? 0 : Math.round((u.hc * st.attr) / 400); });
    const free = UNITS.filter((u) => !u.lead && !edited[u.key + ':b']), fixedB = U.sum(UNITS.filter((u) => edited[u.key + ':b']), (u) => out[u.key].b);
    const bT = Math.max(0, Math.round((U.sum(UNITS, (u) => out[u.key].x) * st.backfill) / 100) - fixedB), bA = alloc(bT, free.map((u) => out[u.key].x));
    free.forEach((u, i) => { out[u.key].b = bA[i]; });
    if (!q4) UNITS.forEach((u) => { const c = out[u.key]; c.h = Math.max(0, u.fy - u.ytdAct - c.b + c.x); });
    return out;
  };

  /* people-programs budget (FY26, $3.6M) */
  const PROGRAMS = [
    { id: 'rr', name: 'Rewards & recognition', short: 'Rewards', budget: 1100000, ytd: 790000, fc: 330000, w: [6, 7, 8, 9, 8, 9, 10, 9, 10, 9, 9, 17], owner: 'NS-1930', note: 'Spot awards, service anniversaries and the year-end recognition awards.' },
    { id: 'ld', name: 'Learning & development', short: 'L&D', budget: 900000, ytd: 756000, fc: 190000, w: [5, 7, 9, 10, 11, 10, 8, 11, 13, 8, 8, 4], owner: null, team: 'Learning & Development', note: 'Leadership programme, technical certifications and the learning platform licence.' },
    { id: 'ops', name: 'People Ops & HRIS', short: 'People Ops', budget: 600000, ytd: 462000, fc: 120000, w: [22, 6, 6, 6, 6, 6, 6, 6, 6, 6, 6, 6], owner: 'NS-1910', note: 'HRIS licences (annual, paid in January), payroll integrations and analytics modules.' },
    { id: 'rec', name: 'Recruiting tools & events', short: 'Recruiting', budget: 500000, ytd: 318000, fc: 150000, w: [10, 8, 9, 7, 8, 6, 7, 9, 10, 12, 10, 8], owner: 'NS-1919', note: 'ATS seats, sourcing tools, campus and community events.' },
    { id: 'well', name: 'Wellbeing', short: 'Wellbeing', budget: 300000, ytd: 201000, fc: 96000, w: [9, 8, 8, 8, 8, 8, 8, 8, 9, 8, 8, 8], owner: 'NS-1901', note: 'Employee assistance programme, wellness stipends and mental-health first aiders.' },
    { id: 'cul', name: 'Engagement & culture', short: 'Culture', budget: 200000, ytd: 149000, fc: 60000, w: [5, 5, 6, 8, 7, 12, 7, 6, 10, 6, 6, 18], owner: 'NS-1901', note: 'Offsites, celebrations across 12 offices and the engagement survey platform.' },
  ];
  PROGRAMS.forEach((p) => { const a = alloc(p.ytd / 1000, p.w.slice(0, 9)).map((v) => v * 1000), f = alloc(p.fc / 1000, p.w.slice(9)).map((v) => v * 1000); p.monthly = a.concat(f); if (!p.owner) { const t = D.teams.find((x) => x.name === p.team); p.owner = t ? t.managerId : 'NS-1901'; } });
  const COMMITMENTS = [
    { prog: 'ld', title: 'Leadership programme · cohort 3 (24 managers)', amount: 64000, date: '2026-10-14', status: 'Contracted' },
    { prog: 'rr', title: 'Year-end recognition awards', amount: 185000, date: '2026-12-10', status: 'Planned' },

        inp.addEventListener('blur', () => finish(true));
        active = finish;
      };
      const findCell = (row, k) => root.querySelector(`.pg .ed[data-row="${CSS.escape(row)}"][data-k="${k}"]`);
      const gridEl = root.querySelector('#grid');

      gridEl.addEventListener('mousedown', (e) => { const td = e.target.closest('.ed'); if (!td || e.target.tagName === 'INPUT') return; e.preventDefault(); const row = td.dataset.row, k = td.dataset.k; if (active) active(true); startEdit(findCell(row, k)); });
      gridEl.addEventListener('keydown', (e) => { const td = e.target.closest('.ed'); if (td && e.target === td && (e.key === 'Enter' || e.key === 'F2')) { e.preventDefault(); startEdit(td); } });

      root.querySelector('[data-commit]').onclick = () => {
        const n = changedCells(), last = S.commits[S.commits.length - 1]; if (!n) { NS.toast('Nothing to commit', { desc: `The draft matches v${last.v}.`, type: 'info' }); return; }
        const A = agg(UNITS), diffs = []; UNITS.forEach((u) => ['h', 'b', 'x'].forEach((k) => { const a = S.committed.q4[u.key][k], b = S.q4[u.key][k]; if (a !== b) diffs.push({ u, k, a, b }); }));
        NS.modal({ title: `Commit plan v${last.v + 1}`, sub: 'The committed plan becomes the baseline for variance, scenarios and the board pack.', body: `<div class="cost-box mb-4"><div><span>EOY headcount</span><b>${F.int(A.eoy)}</b></div><div><span>vs target</span><b>${sgn(A.eoy - A.target)}</b></div><div><span>EOY run-rate</span><b>${m$(A.payEoy)}</b></div></div><div class="ns-table-wrap mb-4"><table class="ns-table dense"><thead><tr><th>Org</th><th>Q4 field</th><th class="num">v${last.v}</th><th class="num">Draft</th></tr></thead><tbody>${diffs.slice(0, 8).map((d) => `<tr><td>${esc(d.u.org)} <span class="faint">· ${esc(d.u.dept)}</span></td><td>${K2(d.k)}</td><td class="num">${d.a}</td><td class="num"><b>${d.b}</b></td></tr>`).join('')}${diffs.length > 8 ? `<tr><td colspan="4" class="muted">…and ${diffs.length - 8} more</td></tr>` : ''}</tbody></table></div><label class="ns-field"><span class="ns-label">Change note</span><input class="ns-input" id="cnote" value="Q4 re-plan · ${diffs.length} cells updated"></label>`,
          actions: [{ label: 'Cancel' }, { label: `Commit v${last.v + 1}`, cls: 'primary', onClick: (m) => { const note = m.el.querySelector('#cnote').value.trim() || 'Q4 re-plan'; S.commits.push({ v: last.v + 1, date: TODAY_ISO, by: c.persona.personId, note, eoy: A.eoy }); S.committed = { q4: clone(S.q4), edited: clone(S.edited) }; P.saveNow(); log(`Committed plan v${last.v + 1}`); NS.toast(`Plan v${last.v + 1} committed`, { desc: `EOY ${F.int(A.eoy)} · run-rate ${m$(A.payEoy)}` }); NS.refresh(); } }] });
      };
      redraw(); versions();
      if (c.query.focus) { const tr = root.querySelector(`tr[data-rk="${CSS.escape(c.query.focus)}"]`); if (tr) tr.scrollIntoView({ block: 'center' }); }
    },

<script>
(function () {
  'use strict';
  const P = window.__WP; const S = P.S;

  /* SCENARIOS --------------------------------------------------------- */
  const PARAMS = [

    { k: 'backfill', label: 'Backfill rate', min: 0, max: 130, step: 5, f: (v) => v + '%', help: 'Share of planned backfills executed (115% ≈ every exit replaced).' },
    { k: 'attr', label: 'Attrition (annualised)', min: 4, max: 16, step: 0.5, f: (v) => F.num(v, 1) + '%', help: 'Drives Q4 exits; the plan assumes the rate set in Assumptions.' },
    { k: 'merit', label: 'Merit increase (FY27)', min: 0, max: 6, step: 0.25, f: (v) => F.num(v, 2) + '%', help: 'Applied to the EOY run-rate to get the FY27 opening run-rate.' },
    { k: 'conv', label: 'Contractor conversion', min: 0, max: 100, step: 10, f: (v) => v + '%', help: 'Contractors converted to FTE — removes the agency margin.' },
    { k: 'offshore', label: 'Offshore mix of new hires', min: 0, max: 90, step: 1, f: (v) => v + '%', help: 'Share of Q4 new roles placed in Mumbai, Bengaluru and Pune.' },
    { k: 'span', label: 'Span-of-control target', min: 0, max: 10, step: 1, f: (v) => (v ? String(v) : 'as-is'), help: 'Appoints team leads from within until the average span reaches the target (0 = leave as-is).' },
  ];
  const quarterPath = (us, r) => {
    const A = agg(us), pts = [A.opening]; let h = A.opening; [0, 1, 2].forEach((q) => { h += netOf(A.act[q]); pts.push(h); });
    const qAvg = A.fy / 4, s = r.sc, extraExit = (A.hc * (s.attr - S.settings.attr)) / 400;
    pts.push(r.eoy); const q27 = Math.round((qAvg * s.hire) / 100 - extraExit); pts.push(r.eoy + q27, r.eoy + 2 * q27); return pts;
  };
  const narrative = (r, rb) => {
    const d = r.fy27 - rb.fy27, e = r.eoy - rb.eoy, parts = [];
    parts.push(`<b>${esc(r.sc.name)}</b> ${d < 0 ? 'saves' : 'adds'} <b>${m$(Math.abs(d))}</b> of FY27 run-rate and lands EOY headcount at <b>${F.int(r.eoy)}</b> (${sgn(e)} vs base)`);

  };

      eyebrow: 'Scenario parameters', title: esc(s.name), sub: 'Outputs recompute live from band midpoints × location tiers for every org in scope.', size: 'lg',

      foot: `<button class="ns-btn ghost" data-close>Cancel</button><button class="ns-btn primary" data-save-sc>${NS.icon('check')}Save scenario</button>`,
      mounted: (body, api) => {
        const rb = run(scen(S.baseId), us);
        const prev = () => { const r = run({ ...draft, span: draft.span || null }, us); body.querySelector('#scPrev').innerHTML = [['EOY headcount', F.int(r.eoy), sgn(r.eoy - rb.eoy)], ['Q4 hires · backfills · exits', `${r.N} · ${r.B} · ${r.X}`, ''], ['EOY payroll run-rate', m$(r.eoyPay), sgn(r.eoyPay - rb.eoyPay, (n) => m$(n))], ['FY27 run-rate', m$(r.fy27), sgn(r.fy27 - rb.fy27, (n) => m$(n))], ['Cost per engineer', m$(r.cpe), sgn(Math.round(r.cpe - rb.cpe), (n) => m$(n))], ['Avg span of control', F.num(r.span, 1), r.leads ? `${r.leads} leads` : ''], ['Headcount in India', F.pct(r.india, 1), ''], ['Open reqs left unfilled', r.unfilled, '']].map(([k, v, d]) => `<div class="kv"><span>${k}</span><b>${v}${d ? ` <span class="xs ${/^−/.test(d) ? 'ok-text' : 'muted'}" style="font-weight:500">${d}</span>` : ''}</b></div>`).join(''); };

        prev();
        api.el.querySelector('[data-save-sc]').onclick = () => { Object.assign(s, { name: body.querySelector('#scName').value.trim() || s.name, desc: body.querySelector('#scDesc').value.trim(), hire: draft.hire, backfill: draft.backfill, attr: draft.attr, merit: draft.merit, conv: draft.conv, offshore: draft.offshore, span: draft.span || null }); saveNow(); log(`Updated scenario “${s.name}”`); api.close(); NS.toast('Scenario saved', { desc: `${s.name} · FY27 ${m$(run(s, us).fy27)}` }); onSaved(); };
      },
    });
  };
  R['/scenarios'] = {
    title: 'Scenarios',
    render: (c) => {

        <div class="ns-grid main-side">
          <div class="grid gap-4">
            ${raw(NS.card({ title: 'Workforce drivers', body: `<div class="ns-form-grid">${FIELDS.slice(0, 5).map((f) => `<label class="ns-field"><span class="ns-label">${f.label} <span class="opt">${f.unit}</span></span><input class="ns-input tnum" type="number" data-f="${f.k}" min="${f.min}" max="${f.max}" step="${f.step}" value="${st[f.k]}"><span class="ns-help">${f.help}</span></label>`).join('')}</div>` }))}
            ${raw(NS.card({ title: 'Cost basis', sub: 'New hires are costed at band midpoint × function × location tier', body: `<div class="ns-form-grid"><label class="ns-field"><span class="ns-label">Cost basis</span><select class="ns-select" data-f="basis"><option value="mid" ${st.basis === 'mid' ? 'selected' : ''}>Base salary at band midpoint</option><option value="loaded" ${st.basis === 'loaded' ? 'selected' : ''}>Fully loaded (midpoint + on-costs)</option></select><span class="ns-help">Switches every run-rate figure between base and fully loaded.</span></label>${FIELDS.slice(5).map((f) => `<label class="ns-field"><span class="ns-label">${f.label} <span class="opt">${f.unit}</span></span><input class="ns-input tnum" type="number" data-f="${f.k}" min="${f.min}" max="${f.max}" step="${f.step}" value="${st[f.k]}"><span class="ns-help">${f.help}</span></label>`).join('')}</div><div class="ns-section-title"><h2>Hiring-level mix</h2><p>Used for the cost of a new role</p></div><div class="flex gap-2 wrap">${[['P1', 15], ['P2', 40], ['P3', 35], ['P4', 10]].map(([l, w]) => `<span class="pchip">${esc(D.levelLabel(l))} <b>${w}%</b></span>`).join('')}</div>` }))}
            ${raw(NS.card({ title: 'Fiscal year', body: `<div class="ns-form-grid"><label class="ns-field"><span class="ns-label">FY26 start</span><input class="ns-input" type="date" data-f="fyStart" value="${st.fyStart}"></label><label class="ns-field"><span class="ns-label">FY26 end</span><input class="ns-input" type="date" data-f="fyEnd" value="${st.fyEnd}"></label><div class="ns-field"><span class="ns-label">Last day to open a Q4 req</span><div class="ns-input" style="display:flex;align-items:center" id="lastReq">${F.date(P.reqDeadline())}</div></div></div>` }))}
          </div>
          <div class="grid gap-4">
            ${raw(NS.card({ title: 'Impact preview', sub: 'Before → after saving', body: '<div id="impact"></div>' }))}
            ${raw(NS.card({ title: 'Band midpoints by location', sub: 'Engineering P3 · base', body: `<div>${U.sortBy(D.locations, (l) => -l.tier).map((l) => `<div class="kv"><span>${esc(l.city)} <span class="faint">· ${F.num(l.tier, 2)}×</span></span><b>${m$(bandMid('P3', 'Engineering', l.id))}</b></div>`).join('')}</div>` }))}
          </div>
        </div>`;
    },
    mounted: (c, root) => {
      const read = () => { const st = { ...S.settings }; root.querySelectorAll('[data-f]').forEach((i) => { const k = i.dataset.f; st[k] = i.type === 'number' ? +i.value : i.value; }); FIELDS.forEach((f) => { st[f.k] = U.clamp(+st[f.k] || f.min, f.min, f.max); }); return st; };
      const withSettings = (st, fn) => { const keep = S.settings, q4 = S.q4; S.settings = st; S.q4 = P.deriveQ4(st, q4, S.edited); const r = fn(); S.settings = keep; S.q4 = q4; return r; };
      const snap = () => { const A = agg(UNITS), b = run({ ...scen('base'), attr: S.settings.attr, merit: S.settings.merit }, UNITS); return { x: A.q4.x, bf: A.q4.b, eoy: A.eoy, pay: A.payEoy, fy27: b.fy27, dl: P.reqDeadline() }; };
      const upd = () => { const before = snap(), after = withSettings(read(), snap); const rows = [['Q4 expected exits', before.x, after.x, F.int], ['Q4 backfills', before.bf, after.bf, F.int], ['EOY headcount', before.eoy, after.eoy, F.int], ['EOY payroll run-rate', before.pay, after.pay, (n) => m$(n)], ['FY27 opening run-rate', before.fy27, after.fy27, (n) => m$(n)]]; root.querySelector('#impact').innerHTML = rows.map(([k, a, b, f]) => `<div class="kv"><span>${k}</span><b>${f(a)} → <span class="${a === b ? '' : 'brand-text'}">${f(b)}</span></b></div>`).join('') + `<div class="kv"><span>Last day to open a Q4 req</span><b>${F.date(before.dl, 'short')} → ${F.date(withSettings(read(), () => P.reqDeadline()), 'short')}</b></div><p class="xs muted mt-3">${Object.keys(S.edited).length} hand-edited Q4 cells keep their values.</p>`; root.querySelector('#lastReq').textContent = F.date(withSettings(read(), () => P.reqDeadline())); };
      root.querySelectorAll('[data-f]').forEach((i) => i.addEventListener('input', upd)); upd();
      root.querySelector('[data-save]').onclick = () => { const st = read(), old = S.settings; S.settings = st; S.q4 = P.deriveQ4(st, S.q4, S.edited); const b = scen('base'); b.attr = st.attr; b.merit = st.merit; S.scenarios.forEach((s) => { if (s.id !== 'base' && s.attr === old.attr) s.attr = st.attr; }); saveNow(); log('Updated planning assumptions'); NS.toast('Assumptions saved', { desc: `Attrition ${F.num(st.attr, 1)}% · merit ${F.num(st.merit, 2)}% · ${st.basis === 'loaded' ? 'fully loaded' : 'base'} cost` }); NS.refresh(); };
      root.querySelector('[data-defaults]').onclick = () => { root.querySelectorAll('[data-f]').forEach((i) => { i.value = P.SETTINGS0[i.dataset.f]; }); upd(); NS.toast('Defaults restored in the form', { desc: 'Save to apply.', type: 'info' }); };
    },
  };

  /* BOOT -------------------------------------------------------------- */
  const store = P.store;
  const personas = [
    { ...D.personas.hrbp, note: 'Portfolio plan, requests & org design' },
    { ...D.personas.exec, note: 'Engineering plan, scenarios & approvals' },
    { ...D.personas.cpo, note: 'Company plan, budget & board view' },
    { ...D.personas.rewards, label: 'Finance partner', note: 'Budget, cost model & merit' },
  ];
  R['/home'].nav = (c) => (c.query.view === 'board' ? 'board' : 'home');
  ['/plan', '/scenarios'].forEach((k) => { R[k].personas = ['hrbp', 'exec', 'cpo', 'rewards']; });
  const reqBadge = (pid) => { if (pid === 'exec') return S.requests.filter((q) => q.status === 'Under review' && q.approver === 'NS-1003').length || ''; if (pid === 'cpo') return S.requests.filter((q) => q.status === 'Under review').length || ''; return S.requests.filter((q) => q.status === 'Draft' && PORTFOLIO.includes(q.dept)).length || ''; };
  const A0 = () => agg(UNITS);
  NS.app({
    id: 'workforce-planner', name: 'Workforce Planner', sub: 'Northstar Labs', brand: 'lime', version: '2.0',
    mark: NS.icon('calculator', { size: 20 }),
    about: { tagline: 'Plan the org you can afford — and the one you need.', description: 'One place where People, Finance and leaders plan headcount against budget. A live quarterly planning grid with plan-vs-actual variance, scenario modelling built on band midpoints and location tiers, a headcount-request workflow with business cases and approvals, an org-design analyzer for spans, layers and level mix, a capability gap map, and stewardship of the people-programs budget.', highlights: [{ icon: 'table', title: 'Live planning grid', body: 'Edit Q4 hires, backfills and exits; EOY headcount and run-rate recompute instantly.' }, { icon: 'sliders', title: 'Scenario engine', body: 'Hire rate, attrition, merit, conversion, offshore mix and span targets → cost and shape.' }, { icon: 'network', title: 'Org design rules', body: 'Spans, layers and senior-IC mix checked against target, with actionable fixes.' }, { icon: 'wallet', title: 'Budget stewardship', body: 'Burn vs straight-line, commitments and audited reallocations across six programs.' }] },
    personas, defaultPersona: 'hrbp',
    nav: (persona) => {
      const pid = persona.id, it = (id, label, icon, extra = {}) => ({ id, label, icon, ...extra });
      if (pid === 'hrbp') return [{ group: 'Plan', items: [it('home', 'Home', 'home'), it('plan', 'Planning grid', 'table'), it('scenarios', 'Scenarios', 'sliders')] }, { group: 'Portfolio', items: [it('requests', 'Headcount requests', 'user-plus', { badge: reqBadge(pid) }), it('org', 'Org design', 'network'), it('skills', 'Capability plan', 'puzzle')] }];
      if (pid === 'exec') return [{ group: 'Engineering plan', items: [it('home', 'Home', 'home'), it('plan', 'Planning grid', 'table'), it('scenarios', 'Scenarios', 'sliders')] }, { group: 'Decide', items: [it('requests', 'Approvals', 'inbox', { badge: reqBadge(pid) }), it('org', 'Org design', 'network'), it('skills', 'Capability plan', 'puzzle')] }];
      if (pid === 'cpo') return [{ group: 'Company plan', items: [it('home', 'Home', 'home'), it('board', 'Board view', 'clipboard-list', { route: '/home?view=board' }), it('plan', 'Planning grid', 'table'), it('scenarios', 'Scenarios', 'sliders')] }, { group: 'Money & org', items: [it('budget', 'Budget', 'wallet'), it('requests', 'Headcount requests', 'user-plus', { badge: reqBadge(pid) }), it('org', 'Org design', 'network'), it('skills', 'Capability plan', 'puzzle')] }, { group: 'Administration', items: [it('settings', 'Assumptions', 'settings')] }];
      return [{ group: 'Cost model', items: [it('home', 'Home', 'home'), it('budget', 'Budget', 'wallet'), it('scenarios', 'Cost scenarios', 'sliders'), it('plan', 'Planning grid', 'table'), it('board', 'Board view', 'clipboard-list', { route: '/home?view=board' })] }, { group: 'Administration', items: [it('settings', 'Assumptions', 'settings')] }];
    },
    promo: () => { const A = A0(); return { title: `FY26 plan · ${Math.round(A.attain * 100)}% of net adds landed`, body: `${A.ytdAct} of ${A.ytdPlan} planned net adds through Q3 · Q4 needs ${sgn(A.q4net)} to reach ${F.int(A.target)}.`, progress: Math.round(A.attain * 100), cta: { label: 'Planning grid', route: '/plan' } }; },
    notifications: [
      { icon: 'sliders', title: 'Q4 hiring freeze scenario shared by Elena', body: '“Hiring freeze (Q4)” — only offers already out land; backfills at 50%.', time: 'Yesterday', route: '/scenarios' },
      { icon: 'inbox', title: '3 headcount requests awaiting approval', body: 'ML Platform, Application Security and SRE — all within the Q4 plan.', time: 'Today', route: '/requests?status=Under review' },
      { icon: 'wallet', title: 'L&D budget 84% consumed', body: '$756K of $900K spent with a quarter to run; forecast $46K over.', time: '2 days ago', route: '/budget' },
      { icon: 'git-branch', title: 'Plan v3 committed', body: 'Q3 re-forecast — Q4 net adds set to 87 to hold EOY at 1,138.', time: '2 days ago', route: '/plan' },
    ],
    routes: R, default: '/home',
    commands: (persona) => { const pid = persona.id, out = [{ label: 'Open the planning grid', icon: 'table', group: 'Actions', run: () => NS.go('/plan') }, { label: 'Compare scenarios', icon: 'sliders', group: 'Actions', run: () => NS.go('/scenarios') }]; if (pid === 'hrbp' || pid === 'cpo') out.push({ label: 'New headcount request', icon: 'user-plus', group: 'Actions', run: () => { NS.go('/requests'); setTimeout(() => { const b = document.querySelector('[data-new]'); if (b) b.click(); }, 120); } }); if (pid === 'exec' || pid === 'cpo') out.push({ label: 'Review requests awaiting approval', icon: 'inbox', group: 'Actions', run: () => NS.go('/requests', { status: 'Under review' }) }); if (pid === 'cpo' || pid === 'rewards') out.push({ label: 'Reallocate budget', icon: 'refresh', group: 'Actions', run: () => NS.go('/budget', { realloc: 1 }) }, { label: 'Open board view', icon: 'clipboard-list', group: 'Actions', run: () => NS.go('/home', { view: 'board' }) }); return out; },
    search: (q) => { if (q.length < 2) return []; const s = q.toLowerCase(), pid = NS.persona.id, out = []; UNITS.filter((u) => !u.lead && (u.org.toLowerCase().includes(s) || u.dept.toLowerCase().includes(s))).slice(0, 4).forEach((u) => out.push({ group: 'Plan rows', label: `${u.org} · ${u.dept}`, hint: `${u.hc} people · Q4 ${sgn(netOf(S.q4[u.key]))}`, run: () => NS.go('/plan', { focus: u.key }) })); if (pid !== 'rewards') S.requests.filter((r) => r.id.toLowerCase().includes(s) || r.title.toLowerCase().includes(s) || r.team.toLowerCase().includes(s)).slice(0, 5).forEach((r) => out.push({ group: 'Requests', label: `${r.id} · ${r.title}`, hint: r.status, run: () => NS.go('/requests', { id: r.id }) })); if (pid !== 'rewards') D.managers.filter((p) => p.name.toLowerCase().includes(s)).slice(0, 4).forEach((p) => out.push({ group: 'Managers', label: p.name, hint: `${p.team} · span ${p.directs}`, avatar: NS.avatar(p, { size: 'xs' }), run: () => NS.go('/org', { s: UNITS.find((u) => u.dept === p.dept && u.org === p.org && u.dept === 'Engineering' && !u.lead) ? 'o:' + p.dept + '|' + p.org : (pid === 'exec' ? 'd:Engineering' : 'd:' + p.dept) }) })); return out; },
    onReset: () => store.clear(),
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en" data-brand="lime">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workforce Planner · Northstar Labs</title>
<meta name="description" content="Workforce Planner — headcount, budget and org-design scenarios for Northstar Labs. Concept prototype with illustrative data, designed by Ronak Mehta.">
<meta name="theme-color" content="#4D7C0F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='13' fill='%234D7C0F'/%3E%3Crect x='14' y='11' width='20' height='26' rx='3.5' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Cpath d='M18 17h12' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='19' cy='25' r='1.8' fill='%23fff'/%3E%3Ccircle cx='24' cy='25' r='1.8' fill='%23fff'/%3E%3Ccircle cx='29' cy='25' r='1.8' fill='%23fff'/%3E%3Ccircle cx='19' cy='31' r='1.8' fill='%23fff'/%3E%3Ccircle cx='24' cy='31' r='1.8' fill='%23fff'/%3E%3Ccircle cx='29' cy='31' r='1.8' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Inter:opsz,wght@14..32,400..700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/ns.css">
<script src="../shared/ns.js"></script>
<script src="../shared/ns-data.js"></script>
<style>
  /* =====================================================================
     Workforce Planner · "The planning sheet"
     Identity: spreadsheet-grade modelling. Figtree display, Inter UI,
     Spline Sans Mono for every number (open zero: DM Mono's slashed
     zero turned zero-heavy columns into noise). Sheet greys with visible gridlines, olive
     input/action colour, blue active-cell outline, red/green variance.
     ===================================================================== */
  :root{
    --font-display:"Figtree","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --bg:#F1F2EE;--bg-2:#E8EAE3;
    --surface:#FFFFFF;--surface-2:#F8F9F5;--surface-3:#EFF1EA;--surface-4:#E2E5DC;
    --line:#D8DBD1;--line-2:#E5E7E0;--line-strong:#BCC1B2;
    --ink:#171A14;--ink-2:#353A2F;--ink-3:#565D4D;--ink-4:#6D7466;--ink-inverse:#FFFFFF;
    --np:#4D7C0F;--np-hover:#3F6212;--np-active:#365314;--np-text:#3F6212;--np-soft:#F0F6E3;--np-soft-2:#E0ECC8;--np-line:#B3CD86;
    --on-np:#FFFFFF;
    --sel:#2563EB;--sel-soft:rgba(37,99,235,.07);
    --side:#ECEEE7;
    --input-cell:#F4F8EA;--input-cell-hover:#EAF2D9;
    --ok:#18794E;--ok-bg:#E6F4EC;--ok-line:#A9D9BE;
    --bad:#BF2A30;--bad-bg:#FCECEC;--bad-line:#F0B9BB;
    --warn:#8F5600;--warn-bg:#FFF4DC;--warn-line:#EFCF92;
    --var-up:#16835A;--var-down:#C8323A;--var-cost:#B7791F;
    --viz-1:#4D7C0F;--viz-2:#2F6690;--viz-3:#C0861A;--viz-4:#8A67BC;
    --viz-5:#1E8A86;--viz-6:#B4532D;--viz-7:#6F7D2A;--viz-8:#C2477A;
    --viz-good:#16835A;--viz-warn:#D99A16;--viz-serious:#DD7440;--viz-critical:#C8323A;
    --viz-seq-100:#EDF4DE;--viz-seq-200:#D5E6B3;--viz-seq-300:#B5D17C;--viz-seq-400:#8CB646;--viz-seq-500:#689820;--viz-seq-600:#4D7C0F;--viz-seq-700:#33550A;
    --viz-div-neg:#C8323A;--viz-div-mid:#F1F2ED;--viz-div-pos:#16835A;
    --viz-grid:#EBEDE6;--viz-axis:#C8CCBF;
    --shadow-xs:none;
    --shadow-sm:0 1px 2px rgba(23,26,20,.06);
    --shadow:0 2px 6px -1px rgba(23,26,20,.10),0 1px 2px rgba(23,26,20,.05);
    --shadow-lg:0 12px 28px -6px rgba(23,26,20,.18),0 3px 8px -2px rgba(23,26,20,.07);
    --shadow-xl:0 28px 64px -12px rgba(23,26,20,.30),0 6px 14px -4px rgba(23,26,20,.08);
    --r-xs:2px;--r-sm:4px;--r:5px;--r-lg:6px;--r-xl:8px;
    --header-h:52px;--topbar-h:40px;--sidebar-w:240px;
    --focus:0 0 0 2px var(--surface),0 0 0 4px color-mix(in srgb,var(--sel) 60%,transparent);
  }
  :root[data-theme="dark"]{
    --bg:#0D0F0B;--bg-2:#12140F;
    --surface:#151812;--surface-2:#191C15;--surface-3:#20241B;--surface-4:#2A2F23;
    --line:#2D3227;--line-2:#23271F;--line-strong:#3F4636;
    --ink:#ECEFE6;--ink-2:#C4CAB9;--ink-3:#9AA28D;--ink-4:#858D79;--ink-inverse:#0D0F0B;
    --np:#93C445;--np-hover:#A6D25F;--np-active:#80B132;--np-text:#ADD672;--np-soft:rgba(147,196,69,.12);--np-soft-2:rgba(147,196,69,.22);--np-line:rgba(147,196,69,.42);
    --on-np:#10140A;
    --sel:#5B9BFF;--sel-soft:rgba(91,155,255,.10);
    --side:#111310;
    --input-cell:rgba(147,196,69,.07);--input-cell-hover:rgba(147,196,69,.14);
    --ok:#5BD69A;--ok-bg:rgba(60,190,125,.13);--ok-line:rgba(60,190,125,.34);
    --bad:#FF7E83;--bad-bg:rgba(240,80,86,.14);--bad-line:rgba(240,80,86,.36);
    --warn:#F2B64E;--warn-bg:rgba(242,170,40,.13);--warn-line:rgba(242,170,40,.34);
    --var-up:#3DBB8C;--var-down:#EE6A70;--var-cost:#E0A33E;
    --viz-1:#93C445;--viz-2:#5E9ED6;--viz-3:#DDA53E;--viz-4:#A98CDB;
    --viz-5:#3EB7B1;--viz-6:#DC7D52;--viz-7:#B6C35A;--viz-8:#E07AA6;
    --viz-good:#3DBB8C;--viz-warn:#E5AA2E;--viz-serious:#E8885A;--viz-critical:#EE6A70;
    --viz-seq-100:#1D2611;--viz-seq-200:#2C3E15;--viz-seq-300:#405C1B;--viz-seq-400:#5A8124;--viz-seq-500:#7AA634;--viz-seq-600:#98C657;--viz-seq-700:#C3DF93;
    --viz-div-neg:#E5585F;--viz-div-mid:#262A21;--viz-div-pos:#33B07F;
    --viz-grid:#21251C;--viz-axis:#363C2E;
    --shadow-lg:0 14px 32px -6px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04);
    --shadow-xl:0 30px 70px -12px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.05);
    --glass:rgba(21,24,18,.9);
  }

  /* ---- type ---- */
  body{letter-spacing:-.004em}
  h1,h2,h3,h4,.ns-brand-name,.ns-gh-product .ns-brand-name,.ns-modal-head h2,.ns-drawer-head h2{font-family:var(--font-display);letter-spacing:-.012em}
  h1{font-weight:700;font-size:24px;line-height:30px;letter-spacing:-.022em}
  .tnum,.num,.mono,kbd,.ns-kbd{font-variant-numeric:tabular-nums}
  .tnum,.ns-table td.num,.ns-table td.num b,.ns-stat .val,.wp-num{font-family:var(--font-mono);font-feature-settings:normal;letter-spacing:-.01em}
  .ns-table th,.ns-table th.num{font-family:var(--font-sans)}
  kbd,.ns-kbd{font-family:var(--font-mono);font-weight:500;border-radius:3px}
  ::selection{background:color-mix(in srgb,var(--sel) 22%,transparent)}

  /* ---- buttons, controls: crisp 4px geometry ---- */
  .ns-btn{border-radius:var(--r-sm);height:30px;font-weight:550}
  .ns-btn.primary{background:var(--np);color:var(--on-np);box-shadow:inset 0 -1px 0 rgba(0,0,0,.14)}
  .ns-btn.primary:hover{background:var(--np-hover)}
  .ns-btn.secondary{border-color:var(--line-strong);box-shadow:none}
  .ns-btn.xs{border-radius:3px}
  .ns-badge{border-radius:3px;font-weight:600}
  .ns-chip{border-radius:var(--r-sm);height:28px;padding:0 10px}
  .ns-chip .n{font-family:var(--font-mono);font-weight:500;border-radius:3px}
  .ns-seg{border-radius:var(--r);padding:2px;background:var(--surface-3)}
  .ns-seg button{border-radius:3px;height:24px}
  .ns-input,.ns-select,.ns-textarea{border-radius:var(--r-sm);border-color:var(--line-strong)}
  .ns-input:focus,.ns-select:focus,.ns-textarea:focus{border-color:var(--sel);box-shadow:0 0 0 3px color-mix(in srgb,var(--sel) 16%,transparent)}
  input[type="number"].ns-input,.ns-input.tnum{font-family:var(--font-mono);font-size:13px}
  .ns-range{background:linear-gradient(90deg,var(--np) var(--p,50%),var(--surface-4) var(--p,50%))}
  .ns-tabs{margin-bottom:16px}
  .ns-tab[aria-selected="true"]{color:var(--ink);border-color:var(--np)}
  .ns-pager button[aria-current="page"]{background:var(--np-soft);color:var(--np-text)}
  .ns-icon-box{border-radius:var(--r)}
  .ns-icon-box.sm{border-radius:var(--r-sm)}

  /* ---- shell: global header ---- */
  .ns-gh{background:var(--surface);border-bottom:1px solid var(--line);gap:8px}
  .ns-gh-btn,.ns-icon-btn{border-radius:var(--r-sm)}
  .ns-gh-product{font-family:var(--font-display);font-weight:700;letter-spacing:-.015em;font-size:14.5px}
  .ns-brand-mark,.ns-gh-product .ns-brand-mark{background:var(--np);border-radius:5px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.18)}
  :root[data-theme="dark"] .ns-brand-mark{color:var(--on-np)}
  .ns-search-btn{border-radius:var(--r-sm);background:var(--surface-3);border:1px solid var(--line);height:34px}
  .ns-search-btn:hover{background:var(--surface)}
  .ns-tenant{border-radius:var(--r-sm)}
  .ns-tenant i{background:var(--np);border-radius:1px}

  /* ---- shell: sidebar ---- */
  .ns-sidebar{background:var(--side);border-right:1px solid var(--line)}
  .ns-brand{padding:14px 14px 12px}
  .ns-brand-mark{width:30px;height:30px}
  .ns-brand-name{font-weight:700;font-size:14.5px}
  .ns-brand-sub{font-size:11.5px}
  .ns-persona-chip{border-radius:var(--r-sm);background:var(--surface);margin:0 12px 4px}
  .ns-nav{padding:4px 10px 12px}
  .ns-nav-group{font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink-4);padding:14px 10px 5px}
  .ns-nav-item{height:31px;border-radius:var(--r-sm);font-size:13.25px;color:var(--ink-2)}
  .ns-nav-item:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
  .ns-nav-item[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--line),0 1px 0 rgba(23,26,20,.04)}
  .ns-nav-item[aria-current="page"] svg{color:var(--np)}
  .ns-nav-item[aria-current="page"]::before{background:var(--np);width:3px;left:-10px;top:6px;bottom:6px;border-radius:0 2px 2px 0}
  .ns-nav-badge{font-family:var(--font-mono);font-weight:500;border-radius:3px;background:var(--surface-4)}
  .ns-nav-item[aria-current="page"] .ns-nav-badge{background:var(--np-soft-2);color:var(--np-text)}
  .ns-sidebar-foot{border-top:1px solid var(--line)}
  .ns-sidebar-promo{border-radius:var(--r);background:var(--surface);border:1px solid var(--line);padding:11px 12px}
  .ns-sidebar-promo::before{content:"Plan status";color:var(--np-text);font-family:var(--font-display)}
  .ns-sidebar-promo .ns-progress{height:4px;border-radius:1px}
  .ns-sidebar-promo .ns-progress > i{border-radius:1px;background:var(--np)}
  .ns-side-link,.ns-collapse-btn{border-radius:var(--r-sm)}

  /* ---- shell: context bar + content ---- */
  .ns-topbar{background:var(--surface);border-bottom:1px solid var(--line);backdrop-filter:none;-webkit-backdrop-filter:none;padding:0 28px}
  .ns-crumbs{font-size:12.5px}
  .ns-crumbs b{font-weight:600}
  .ns-topbar-meta i{background:var(--np);box-shadow:0 0 0 3px var(--np-soft)}
  .ns-content{max-width:none;padding:20px 28px 64px}
  .ns-page-head{padding:0 0 16px;margin-bottom:16px;align-items:flex-end}
  .ns-page-head p{font-size:13.5px;margin-top:4px;max-width:78ch}
  .ns-eyebrow{font-size:12px;font-weight:600;color:var(--np-text);margin-bottom:4px}
  .ns-page-head + .ns-tabs{margin-top:-16px}

  /* ---- panels (cards) ---- */
  .ns-card{border-radius:var(--r-lg);box-shadow:none;border-color:var(--line)}
  .ns-card-head{padding:11px 16px;border-bottom:1px solid var(--line-2);align-items:center;min-height:48px}
  .ns-card-head h3{font-size:14px;font-weight:700}
  .ns-card-head p{font-size:12px;margin-top:1px}
  .ns-card-body{padding:14px 16px 16px}
  .ns-card-head{flex-wrap:wrap;row-gap:8px}
  .ns-card-head > div:first-child{min-width:0;flex:1 1 220px}
  .ns-card-head .ns-page-actions{max-width:100%;min-width:0}
  .ns-card-head .ns-seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
  .ns-card-foot{border-radius:0 0 var(--r-lg) var(--r-lg)}
  .ns-card.selected{border-color:var(--np);box-shadow:0 0 0 1px var(--np)}
  .ns-section-title h2{font-size:15px}
  .ns-ai{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--np);border-radius:var(--r-lg)}
  .ns-ai-head{color:var(--ink)!important;font-family:var(--font-display);font-weight:700}
  .ns-ai-head svg{color:var(--np)!important}
  .ns-ai-head .ns-badge{background:var(--surface-3)!important;color:var(--ink-3)!important;border:0}
  .ns-ai p{font-size:13px;line-height:1.55}
  .ns-alert{border-radius:var(--r)}
  .ns-tl-item.done .pt{color:var(--on-np)}
  .ns-modal,.ns-palette{border-radius:var(--r-xl)}
  .ns-modal-foot{border-radius:0 0 var(--r-xl) var(--r-xl)}
  .ns-dropdown{border-radius:var(--r-lg)}
  .ns-viztip{border-radius:var(--r)}
  .ns-viztip .r span:last-child{font-family:var(--font-mono);font-weight:500}
  .ns-viz text{font-family:var(--font-sans);font-size:11px}
  .ns-viz text.lbl{font-size:11.5px}
  .ns-viz.wf text.v{font-family:var(--font-mono);font-size:11px}
  .ns-viz.wf text.cs{font-family:var(--font-mono);font-size:10.5px}
  .ns-viz.wf text.cat{font-family:var(--font-sans);font-size:11.5px}
  .ns-progress{border-radius:1px;height:5px}.ns-progress > i{border-radius:1px}
  .ns-delta{font-family:var(--font-mono);font-weight:500;border-radius:3px}

  /* ---- tables: every table is a sheet (visible gridlines, mono numbers) ---- */
  .ns-table-wrap{border-radius:var(--r-lg);box-shadow:none}
  .ns-table{font-size:13px}
  .ns-table th{background:var(--surface-3);font-size:11.5px;font-weight:600;color:var(--ink-3);padding:7px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line-2)}
  .ns-table td{padding:7px 10px;height:38px;border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2)}
  .ns-table th:last-child,.ns-table td:last-child{border-right:0}
  .ns-table td:first-child,.ns-table th:first-child{padding-left:14px}
  .ns-table .num{font-size:12.5px;color:var(--ink)}
  .ns-table tbody tr:hover td{background:color-mix(in srgb,var(--np) 4%,var(--surface))}
  .ns-table.dense td{height:32px;padding:4px 10px}
  .ns-table th[aria-sort] .si{color:var(--np)}
  .ns-table-foot{padding:6px 14px}
  .ns-table-foot,.ns-pager button{font-variant-numeric:tabular-nums}
  .ns-table tr.tot td{background:var(--surface-3);border-top:1px solid var(--line-strong);color:var(--ink);font-weight:600}
  .ns-table tr.sec td{background:var(--surface-2);font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);height:28px;padding-top:4px;padding-bottom:4px}
  .ns-table tbody tr.has-edit td:first-child{box-shadow:inset 3px 0 0 var(--warn)}

  /* ---- KPI summary row (one sheet row, hairline cells) ---- */
  .wp-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
  .wp-kpis.k6{grid-template-columns:repeat(6,minmax(0,1fr))}
  .wp-kpis > .ns-stat{border:0;border-radius:0;box-shadow:1px 0 0 var(--line-2),0 1px 0 var(--line-2);padding:12px 16px 12px;gap:3px;background:transparent;align-content:start}
  .wp-kpis .ns-stat .lbl{min-height:20px}
  .wp-kpis .ns-stat .lbl{font-size:12px;font-weight:550;color:var(--ink-3)}
  .wp-kpis .ns-stat .val{font-size:23px;font-weight:500;letter-spacing:-.03em;line-height:1.15}
  .wp-kpis .ns-stat .val small{font-family:var(--font-sans);font-size:12px;letter-spacing:0}
  .wp-kpis .ns-stat .sub{font-size:12px;line-height:1.4}
  .wp-kpis .ns-stat .spark{height:26px;margin-top:2px}

  /* ---- the sheet: toolbar, formula bar, grid, scenario tabs ---- */
  .wp-sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;min-width:0}
  .wp-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2)}
  .wp-bar .grow{flex:1}
  .wp-bar .ns-input-wrap{min-width:240px}
  .wp-bar .lab{font-size:11.5px;font-weight:600;color:var(--ink-3);margin-right:-2px}
  .wp-fx{display:grid;grid-template-columns:minmax(150px,240px) 34px minmax(0,1fr);align-items:stretch;border-bottom:1px solid var(--line);font-size:12.5px;min-height:34px;background:var(--surface)}
  .wp-fx .nb{display:flex;align-items:center;gap:6px;padding:0 10px;border-right:1px solid var(--line);font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .wp-fx .nb span{overflow:hidden;text-overflow:ellipsis}
  .wp-fx .fxg{display:grid;place-items:center;border-right:1px solid var(--line);font-family:var(--font-display);font-style:italic;font-weight:700;color:var(--ink-3);font-size:13px}
  .wp-fx .fv{display:flex;align-items:center;gap:10px;padding:5px 12px;min-width:0;font-family:var(--font-mono);color:var(--ink-2);line-height:1.4;flex-wrap:wrap}
  .wp-fx .fv .k{font-family:var(--font-sans);font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
  .wp-fx .fv .eq{color:var(--ink)}
  .wp-fx .fv .tag{font-family:var(--font-sans);font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;background:var(--input-cell);color:var(--np-text);border:1px solid var(--np-line)}
  .wp-fx .fv .tag.ro{background:var(--surface-3);color:var(--ink-3);border-color:var(--line)}
  .wp-fx .fv .hint{font-family:var(--font-sans);color:var(--ink-4);font-size:12px}
  .wp-fx.editing .fv{background:var(--sel-soft)}
  .pg-wrap{max-height:min(68vh,760px);border:0!important;border-radius:0!important}
  .ns-table.pg{font-size:12.5px}
  .ns-table.pg th,.ns-table.pg td{padding:0 10px;border-right:1px solid var(--line-2)}
  .ns-table.pg td{height:32px;border-bottom:1px solid var(--line-2);color:var(--ink-2);font-family:var(--font-mono);font-size:12.5px;white-space:nowrap}
  .ns-table.pg td.unit{font-family:var(--font-sans)}
  .ns-table.pg th{font-size:11.5px;height:30px}
  .ns-table.pg th:last-child,.ns-table.pg td:last-child{border-right:0}
  .ns-table.pg thead tr.grp th{top:0;height:28px;background:var(--surface-3);text-align:center;color:var(--ink-2);font-family:var(--font-display);font-weight:700;font-size:11.5px;letter-spacing:.02em;border-bottom:1px solid var(--line)}
  .ns-table.pg thead tr.grp th.q4{background:color-mix(in srgb,var(--np) 10%,var(--surface-3));color:var(--np-text)}
  .ns-table.pg thead tr.cols th{top:28px;background:var(--surface-2)}
  .ns-table.pg .unit{position:sticky;left:0;z-index:2;background:var(--surface);min-width:224px;max-width:270px;box-shadow:inset -1px 0 0 var(--line-strong)}
  .ns-table.pg thead .unit{z-index:4;background:var(--surface-2)}
  .ns-table.pg thead tr.grp .unit{background:var(--surface-3)}
  .ns-table.pg tbody tr:hover td{background:color-mix(in srgb,var(--sel) 3%,var(--surface))}
  .ns-table.pg tbody tr:hover td.unit{background:color-mix(in srgb,var(--sel) 3%,var(--surface))}
  .ns-table.pg .qs{border-left:1px solid var(--line)}
  .ns-table.pg td.num{cursor:cell}
  .ns-table.pg tbody td.ed{background:var(--input-cell);color:var(--ink);font-weight:500;position:relative;outline:none}
  .ns-table.pg tbody td.ed:hover{background:var(--input-cell-hover)}
  .ns-table.pg tbody td.ed.edited{background:var(--warn-bg);font-weight:500}
  .ns-table.pg tbody td.ed.edited::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 7px 7px 0;border-color:transparent var(--warn) transparent transparent}
  .ns-table.pg tbody td.sel,.ns-table.pg tbody td.ed:focus-visible{box-shadow:inset 0 0 0 2px var(--sel)!important;background:color-mix(in srgb,var(--sel) 6%,var(--surface));border-radius:0}
  .ns-table.pg tbody td.ed:has(input){padding:0 3px;box-shadow:inset 0 0 0 2px var(--sel)!important;background:var(--surface)}
  .ns-table.pg td.ed input{width:100%;min-width:52px;height:28px;text-align:right;font-family:var(--font-mono);font-size:12.5px;font-weight:500;border:0;background:transparent;color:var(--ink);padding:0 7px;outline:none}
  .ns-table.pg tr.child td.unit{padding-left:38px;position:sticky}
  .ns-table.pg tr.child td.unit::before{content:"";position:absolute;left:23px;top:0;bottom:0;width:1px;background:var(--line)}
  .ns-table.pg tr.child td.unit::after{content:"";position:absolute;left:23px;top:50%;width:9px;height:1px;background:var(--line)}
  .ns-table.pg tr.tot td{position:sticky;bottom:0;z-index:1;font-weight:500;color:var(--ink);background:var(--surface-3);border-top:1px solid var(--line-strong);box-shadow:0 -1px 0 var(--line-strong)}
  .ns-table.pg tr.tot td.unit{z-index:3;background:var(--surface-3)}
  .ns-table.pg tr.is-focus td,.ns-table.pg tr.is-focus td.unit{background:var(--np-soft)}
  .ns-table.pg tr.is-focus td.unit{box-shadow:inset 3px 0 0 var(--np),inset -1px 0 0 var(--line-strong)}
  .pg .sub{display:block;font-size:10.5px;color:var(--ink-4);font-weight:400;line-height:1.15;margin-top:1px}
  .pg td.num.two{height:38px;line-height:1.15}
  .pg .rowlab{line-height:1.2}
  .pg .rowlab .xs{font-size:11px}
  .pg .xb{width:20px;height:20px;border-radius:3px;display:inline-grid;place-items:center;color:var(--ink-3);margin-right:6px;flex:none}
  .pg .xb:hover{background:var(--surface-4);color:var(--ink)}
  .pg .xb svg{width:13px;height:13px;transition:transform var(--dur)}
  .pg .xb[aria-expanded="true"] svg{transform:rotate(90deg)}
  .pg .lk{color:var(--ink-4)}
  .pg .vp,.vp,.ns-table.pg td.vp{color:var(--var-up);font-weight:500}.pg .vn,.vn,.ns-table.pg td.vn{color:var(--var-down);font-weight:500}
  .ns-table td.bad-text{color:var(--bad)}.ns-table td.ok-text{color:var(--ok)}
  .wp-tabsbar{display:flex;align-items:stretch;gap:12px;justify-content:space-between;border-top:1px solid var(--line);background:var(--surface-3);min-height:36px;flex-wrap:wrap}
  .wp-stabs{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1 1 auto;padding-left:8px}
  .wp-stabs::-webkit-scrollbar{display:none}
  .wp-stab{display:inline-flex;align-items:center;gap:6px;padding:0 14px;height:34px;margin-top:-1px;font-size:12.5px;font-weight:550;color:var(--ink-3);border:1px solid transparent;border-top:0;white-space:nowrap;text-decoration:none!important;border-radius:0 0 var(--r-sm) var(--r-sm)}
  .wp-stab svg{width:13px;height:13px;color:var(--ink-4)}
  .wp-stab:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 4%,transparent)}
  .wp-stab[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:650;border-color:var(--line);box-shadow:inset 0 2px 0 var(--np)}
  .wp-stab[aria-selected="true"] svg{color:var(--np)}
  .wp-stab.add{padding:0 10px;color:var(--ink-3)}
  .wp-legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--ink-3);padding:6px 12px}
  .legend-sq{display:inline-block;width:10px;height:10px;border-radius:1px;vertical-align:-1px;margin-right:5px}
  .wp-hint{font-size:12px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
  .wp-foot-note{font-size:12px;color:var(--ink-3);margin-top:8px}
  .wp-foot-note code{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2)}

  /* ---- plan top: bridge + run-rate cells ---- */
  .wp-top{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:stretch}
  .wp-top .wp-kpis{grid-template-columns:1fr 1fr;height:100%}
  .wp-top .wp-kpis > .ns-stat{padding:14px 16px;align-content:center}
  .wp-top .wp-kpis .ns-stat .val{font-size:28px}

  /* ---- waterfall (signature) ---- */
  .wf svg{display:block}
  .wf .bar{shape-rendering:crispEdges}
  .wf .col{cursor:default}
  .wf .col:hover .bar{filter:brightness(.94)}
  .wf .v{font-family:var(--font-mono);font-size:11px;font-weight:500;fill:var(--ink)}
  .wf .v.up{fill:var(--var-up)}.wf .v.down{fill:var(--var-down)}.wf .v.cost{fill:var(--var-cost)}
  .wf .cat{font-family:var(--font-sans);font-size:11.5px;font-weight:550;fill:var(--ink-2)}
  .wf .cs{font-family:var(--font-mono);font-size:10.5px;fill:var(--ink-4)}
  .wf .conn{stroke:var(--ink-4);stroke-width:1;stroke-dasharray:2 2}
  .wf .plan{stroke:var(--ink);stroke-width:2}
  .wf .tgt{stroke:var(--ink-2);stroke-width:1.25;stroke-dasharray:4 3}
  .wf .tgtl{font-family:var(--font-mono);font-size:10.5px;fill:var(--ink-2)}
  .wf .brk{stroke:var(--surface);stroke-width:3}
  .wf-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin:0 0 6px}
  .wf-legend i{display:inline-block;width:10px;height:10px;border-radius:1px;margin-right:5px;vertical-align:-1px}
  .wf-legend i.tick{height:2px;width:12px;background:var(--ink);vertical-align:3px}
  .wf-legend i.dash{height:0;width:14px;border-top:1.5px dashed var(--ink-2);vertical-align:3px;border-radius:0}

  /* ---- scenario sheet ---- */
  .wp-scs th.sch{vertical-align:top;white-space:normal;padding:10px 12px;min-width:210px;background:var(--surface-2);text-align:left}
  .wp-scs th.sch.base{background:color-mix(in srgb,var(--np) 7%,var(--surface-2));box-shadow:inset 0 2px 0 var(--np)}
  .wp-scs th:first-child{min-width:190px;vertical-align:bottom}
  .sch .nm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
  .sch .mt{font-size:11px;font-weight:500;color:var(--ink-4);margin-top:2px}
  .wp-freeze tr.sec td:first-child{box-shadow:none}
  .sch .ds{font-size:11.5px;font-weight:400;color:var(--ink-3);line-height:1.4;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px}
  .sch .acts{display:flex;gap:2px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .wp-scs td.in{background:var(--input-cell);cursor:pointer}
  .wp-scs td.in:hover{background:var(--input-cell-hover);box-shadow:inset 0 0 0 1px var(--np-line)}
  .wp-scs td.is-base{background:color-mix(in srgb,var(--np) 4%,var(--surface))}
  .wp-scs td.in.is-base{background:var(--input-cell)}
  .wp-scs td .d{display:block;font-size:11px;color:var(--ink-3);font-weight:400}
  .wp-scs td .d.up{color:var(--var-up)}.wp-scs td .d.down{color:var(--var-down)}
  .wp-freeze th:first-child,.wp-freeze td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);box-shadow:inset -1px 0 0 var(--line-strong)}
  .wp-freeze thead th:first-child{z-index:2;background:var(--surface-3)}
  .wp-freeze tr.sec td:first-child{background:var(--surface-2)}
  .wp-freeze tr.tot td:first-child{background:var(--surface-3)}
  .wp-freeze td:first-child{font-family:var(--font-sans)}
  .pchip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;height:22px;padding:0 7px;border-radius:3px;background:var(--surface-3);color:var(--ink-3);white-space:nowrap;border:1px solid var(--line-2)}
  .pchip b{color:var(--ink);font-weight:500;font-family:var(--font-mono)}
  .sl{display:grid;gap:7px;padding:12px 0;border-bottom:1px solid var(--line-2)}
  .sl .row{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-2);font-weight:500}
  .sl output{font-family:var(--font-mono);font-weight:500;color:var(--ink)}
  .sl p{font-size:12px;color:var(--ink-3)}

  /* ---- spans × layers (org design analyzer) ---- */
  .sxl{display:grid;gap:0;font-size:12px;min-width:560px}
  .sxl-row{display:grid;grid-template-columns:62px minmax(150px,1fr) repeat(4,minmax(52px,64px)) 62px;align-items:stretch;border-bottom:1px solid var(--line-2)}
  .sxl-row:last-child{border-bottom:0}
  .sxl-row.h{border-bottom:1px solid var(--line);color:var(--ink-3);font-size:11px;font-weight:600}
  .sxl-row.h > div{padding:0 6px 6px;align-self:end;text-align:center}
  .sxl-row.h > div:first-child,.sxl-row.h > div:nth-child(2){text-align:left}
  .sxl-row.t{border-top:1px solid var(--line-strong);border-bottom:0}
  .sxl .ly{display:flex;align-items:center;font-family:var(--font-mono);font-weight:500;color:var(--ink-2);padding:0 6px}
  .sxl .sil{position:relative;display:flex;align-items:center;justify-content:center;height:30px;padding:0 44px 0 8px}
  .sxl .sil i{display:block;height:16px;background:var(--viz-seq-400);border-radius:1px;min-width:2px}
  .sxl .sil span{position:absolute;right:8px;font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
  .sxl .c{display:grid;place-items:center;font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--ink);border-left:1px solid var(--surface);margin:2px 0;border-radius:2px}
  .sxl .c.z{color:var(--ink-4);font-weight:400}
  .sxl button.c{cursor:pointer}
  .sxl button.c:hover{box-shadow:inset 0 0 0 2px var(--sel)}
  .sxl button.c[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--sel)}
  .sxl .av{display:flex;align-items:center;justify-content:flex-end;padding:0 6px;font-family:var(--font-mono);color:var(--ink-2)}
  .sxl .av.off{color:var(--var-down)}
  .sxl .hist{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:58px;padding:6px 4px 4px;font-family:var(--font-mono);font-size:11px;color:var(--ink-2)}
  .sxl .hist i{display:block;width:60%;border-radius:1px 1px 0 0;min-height:2px}
  .sxl-key{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin-top:10px}
  .sxl-key i{display:inline-block;width:10px;height:10px;border-radius:1px;margin-right:5px;vertical-align:-1px}
  .wp-filter-chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 4px 0 8px;border-radius:3px;background:var(--sel-soft);border:1px solid color-mix(in srgb,var(--sel) 40%,transparent);color:var(--ink);font-size:12px;font-weight:550}
  .wp-filter-chip button{width:18px;height:18px;border-radius:2px;display:grid;place-items:center;color:var(--ink-3)}
  .wp-filter-chip button:hover{background:var(--surface-3);color:var(--ink)}
  .wp-filter-chip svg{width:12px;height:12px}

  /* ---- driver sheet (assumptions) ---- */
  .wp-drv{display:grid}
  .wp-drv-row{display:grid;grid-template-columns:minmax(0,1fr) 168px;gap:16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2)}
  .wp-drv-row:first-child{padding-top:0}
  .wp-drv-row:last-child{border-bottom:0;padding-bottom:0}
  .wp-drv-row .k b{display:block;font-size:13px;font-weight:600;color:var(--ink)}
  .wp-drv-row .k small{display:block;font-size:12px;color:var(--ink-3);line-height:1.4;margin-top:1px}
  .wp-drv-row .v{display:flex;align-items:center;gap:0;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--input-cell);overflow:hidden}
  .wp-drv-row .v:focus-within{border-color:var(--sel);box-shadow:0 0 0 3px color-mix(in srgb,var(--sel) 16%,transparent)}
  .wp-drv-row .v input,.wp-drv-row .v select{flex:1;min-width:0;height:30px;border:0;background:transparent;text-align:right;font-family:var(--font-mono);font-size:13px;color:var(--ink);padding:0 8px;outline:none}
  .wp-drv-row .v select{text-align:left;font-family:var(--font-sans);appearance:auto}

  .wp-drv-row .v.ro{background:var(--surface-3)}

  .wp-drv-row.wide{grid-template-columns:minmax(0,1fr) 260px}
  .imp{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:baseline;font-size:12.5px}
  .imp > span{color:var(--ink-3);padding:6px 0;border-bottom:1px solid var(--line-2)}
  .imp > b{font-family:var(--font-mono);font-weight:500;text-align:right;padding:6px 0;border-bottom:1px solid var(--line-2);color:var(--ink-3)}
  .imp > b.to{color:var(--ink)}
  .imp > b.to.chg{color:var(--sel)}

  .ls{display:none}
  .dec-clip .dec:nth-child(n+7){display:none}
  .dec-more{margin-top:8px;width:100%;justify-content:center}
  .ns-viz.wf svg.tight text.v{font-size:9.5px;letter-spacing:-.04em}
  .ns-viz.wf svg.tight text.tgtl{font-size:9.5px}

  /* ---- program burn rows (home) ---- */
  .pb{display:grid;gap:4px}
  .pb-row{display:grid;grid-template-columns:minmax(96px,30%) minmax(0,1fr) 58px;gap:12px;align-items:center;font-size:12.5px;padding:5px 6px;margin:0 -6px;border-radius:var(--r-sm);color:inherit;text-decoration:none!important}
  .pb-row:hover{background:var(--surface-2)}
  .pb-track{position:relative;height:12px;background:var(--surface-3);border-radius:1px}
  .pb-track i{position:absolute;top:0;bottom:0;left:0}
  .pb-track i.s{background:var(--np)}.pb-track i.f{background:var(--viz-seq-300)}.pb-track i.o{background:var(--var-down)}
  .pb-track b{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink)}
  .pb-v{text-align:right;font-family:var(--font-mono);font-size:12px}
  .pb-scale{grid-template-columns:minmax(96px,30%) minmax(0,1fr) 58px}
  .pb-scale div{padding-right:calc(100% * 12 / 112 - 18px)}
  .pb-scale .tr{text-align:right}

  /* ---- shared blocks ---- */
  .dv{display:grid;gap:8px}
  .dv-row{display:grid;grid-template-columns:minmax(96px,30%) minmax(0,1fr) 46px;gap:12px;align-items:center;font-size:12.5px;border-radius:var(--r-sm)}
  .dv-row.pointer:hover{background:var(--surface-2)}
  .dv-track{position:relative;height:14px}
  .dv-axis{position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--viz-axis)}
  .dv-track i{position:absolute;top:2px;height:10px}
  .dv-track i.pos{left:50%;background:var(--viz-div-pos);border-radius:0 2px 2px 0}
  .dv-track i.neg{right:50%;background:var(--viz-div-neg);border-radius:2px 0 0 2px}
  .dv-v{text-align:right;font-family:var(--font-mono);font-weight:500;color:var(--ink)}
  .dv-scale{display:grid;grid-template-columns:minmax(96px,30%) minmax(0,1fr) 46px;gap:12px;font-size:10.5px;font-family:var(--font-mono);color:var(--ink-4);margin-top:6px}
  .dv-scale div{display:flex;justify-content:space-between}
  .pyr{display:grid;gap:5px}
  .pyr-row{display:grid;grid-template-columns:minmax(0,1fr) 104px minmax(0,1fr);gap:8px;align-items:center;font-size:11.5px}
  .pyr-row .l{display:flex;justify-content:flex-end;align-items:center;gap:6px;color:var(--ink-3);font-family:var(--font-mono)}
  .pyr-row .r{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-family:var(--font-mono)}
  .pyr-row.xs .l,.pyr-row.xs .r{font-family:var(--font-sans)}
  .pyr-row i{height:14px;display:block;min-width:2px}
  .pyr-row .l i{background:var(--viz-1);border-radius:1px 0 0 1px}.pyr-row .r i{background:var(--viz-2);border-radius:0 1px 1px 0}
  .pyr-row .mid{text-align:center;color:var(--ink-2);font-weight:600}
  .dec{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line-2)}
  .dec:last-child{border-bottom:0;padding-bottom:0}.dec:first-child{padding-top:0}
  .dec .t{font-weight:600;font-size:13px;color:var(--ink);line-height:1.35}.dec .s{font-size:12px;color:var(--ink-3);margin-top:2px;line-height:1.4}
  .dec .s .m{font-family:var(--font-mono);font-size:11.5px}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line-2)}
  .kv:last-child{border-bottom:0}.kv span{color:var(--ink-3)}.kv b{font-family:var(--font-mono);font-weight:500;color:var(--ink);text-align:right;font-size:12.5px}
  .kv.total{border-top:1px solid var(--line-strong);border-bottom:0;margin-top:2px;padding-top:9px}
  .rule{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px}
  .rule:last-child{border-bottom:0}.rule:first-child{padding-top:0}
  .rule b{font-family:var(--font-mono);font-weight:500}
  .gap-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line-2);align-items:center}
  .gap-row:last-child{border-bottom:0}
  .cost-box{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .cost-box div{padding:9px 12px;background:var(--surface-2);min-width:0}
  .cost-box div + div{border-left:1px solid var(--line)}
  .cost-box span{display:block;font-size:11.5px;color:var(--ink-3)}.cost-box b{display:block;font-family:var(--font-mono);font-size:16px;font-weight:500;margin-top:2px;color:var(--ink);letter-spacing:-.02em}
  .case{font-size:13px;line-height:1.5;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--np);border-radius:var(--r-sm);padding:10px 12px}
  .case b{color:var(--ink)}
  .wp-dl{grid-template-columns:120px minmax(0,1fr);font-size:13px;gap:7px 16px}
  .wp-formbar{position:sticky;bottom:12px;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-lg);box-shadow:var(--shadow)}
  .ns-heat{gap:2px}
  .ns-heat .cell{border-radius:2px;font-family:var(--font-mono);font-weight:500;font-size:11.5px;min-height:34px}
  .ns-heat .cell:hover{transform:none;box-shadow:inset 0 0 0 2px var(--sel)}
  .ns-heat .hc{text-transform:none;letter-spacing:0;font-size:11px;font-weight:600}

<script>
(function () {
  'use strict';
  const D = NSData, U = NS.util, F = NS.fmt, raw = NS.raw, ic = NS.ic; const html = (st, ...v) => st.reduce((a, x, i) => a + x + (i < v.length ? (Array.isArray(v[i]) ? v[i].map(NS.str).join('') : NS.str(v[i] == null || v[i] === false ? '' : v[i])) : ''), '');

  // compact money: millions keep fixed decimals ($6.0M, not $6M) so run-rate columns read as one scale; thousands drop a bare .0 ($22K)
  const m$ = (n, d) => { if (n == null || isNaN(n)) return '—'; const a = Math.abs(n), k = d ?? 1, v = a >= 1e9 ? (a / 1e9).toFixed(k) + 'B' : a >= 1e6 ? (a / 1e6).toFixed(k) + 'M' : a >= 1e3 ? (a / 1e3).toFixed(a >= 1e5 ? 0 : k).replace(/\.0+$/, '') + 'K' : String(Math.round(a)); return (n < 0 && v !== '0' ? '−' : '') + '$' + v; };
  const mM = (n) => (n < 0 ? '−' : '') + '$' + (Math.abs(n) / 1e6).toFixed(1) + 'M'; // one unit for a whole column
  const lvlLabel = (code) => (code === 'P2' ? 'P2 · Mid-level' : D.levelLabel(code)); // shared short name for P2 is 'Engineer' — wrong for non-engineering roles

  const clone = (o) => JSON.parse(JSON.stringify(o));
  const iso = (d) => new Date(d).toISOString().slice(0, 10);

  /* ------------------------------------------------------------------ */
  /* 1. Domain — cost model, org units, the FY26 plan                    */
  /* ------------------------------------------------------------------ */

  const HIRE_MIX = { P1: 0.15, P2: 0.4, P3: 0.35, P4: 0.1 }; // typical level mix of a new role
  const hireMid = (dept, loc) => U.sum(Object.entries(HIRE_MIX).map(([l, w]) => w * bandMid(l, dept, loc)));

  const deptDef = (name) => D.departments.find((d) => d.name === name);
  const UNITS = Object.entries(U.groupBy(PEOPLE, (p) => p.dept + '|' + p.org)).map(([key, ps]) => { const [dept, org] = key.split('|'); return { key, dept, org, people: ps, hc: ps.length, lead: /Leadership$/.test(org) || org === 'Executive' }; });
  const orgIdx = (u) => { if (u.lead) return -1; const d = deptDef(u.dept); return d ? d.orgs.findIndex((o) => o.name === u.org) : 0; };
  UNITS.sort((a, b) => DEPTS.indexOf(a.dept) - DEPTS.indexOf(b.dept) || orgIdx(a) - orgIdx(b));
  const UBY = Object.fromEntries(UNITS.map((u) => [u.key, u]));
  UNITS.forEach((u) => {
    const ps = u.people;
    u.teams = U.uniq(ps.map((p) => p.team)).filter((t) => !/Leadership$|^Office of/.test(t));
    u.locShare = {}; ps.forEach((p) => { u.locShare[p.location] = (u.locShare[p.location] || 0) + 1 / u.hc; });

    u.mgrs = ps.filter((p) => p.directs > 0);
    const locs = Object.keys(u.locShare);
    const blend = (ls, fb) => { const tot = U.sum(ls.map((l) => u.locShare[l])); return tot ? U.sum(ls.map((l) => (u.locShare[l] / tot) * hireMid(u.dept, l))) : hireMid(u.dept, fb); };
    u.costIN = blend(locs.filter((l) => INDIA.has(l)), 'BLR'); u.costOUT = blend(locs.filter((l) => !INDIA.has(l)), 'AUS');
  });

  // FY26 plan by department: [full-year net adds, YTD planned net (Q1–Q3), YTD actual net]
  const DEPT_PLAN = { Engineering: [96, 50, 44], Product: [9, 5, 5], Design: [6, 2, 3], Sales: [24, 11, 14], 'Customer Success': [14, 8, 8], Marketing: [6, 4, 3], People: [5, 3, 2], Finance: [4, 2, 2], 'Legal & Compliance': [2, 2, 0], 'IT & Workplace': [3, 2, 1], Executive: [0, 0, 0] };
  const ORG_GROWTH = { 'Data & ML': 1.7, Security: 1.35, 'Infrastructure & SRE': 1.1, Platform: 1.0, 'Core Services': 0.75, Frontend: 0.85, Mobile: 0.6, 'Developer Experience': 0.8, 'Quality Engineering': 0.55, 'Product Management': 1.25, 'Product Operations': 0.6 };
  const ORG_EXEC = { 'Data & ML': 1.2, Platform: 0.6, Security: 0.78, 'Core Services': 1.15, 'Quality Engineering': 1.25, Mobile: 0.95, Frontend: 1.02, 'Infrastructure & SRE': 1.0, 'Developer Experience': 1.08 };
  DEPTS.forEach((d) => {
    const us = UNITS.filter((u) => u.dept === d && !u.lead); const [fy, yp, ya] = DEPT_PLAN[d];
    const w = us.map((u) => u.hc * (ORG_GROWTH[u.org] || 1));
    const a1 = alloc(fy, w), a2 = alloc(yp, w), a3 = alloc(ya, us.map((u, i) => w[i] * (ORG_EXEC[u.org] || 1)));
    us.forEach((u, i) => { u.fy = a1[i]; u.ytdPlan = a2[i]; u.ytdAct = a3[i]; });
  });
  UNITS.forEach((u) => { if (u.fy == null) u.fy = u.ytdPlan = u.ytdAct = 0; u.opening = u.hc - u.ytdAct; u.target = u.opening + u.fy; });
  // quarterly split with exact company totals (company actuals match the monthly headcount series)
  const PLAN_Q = [24, 30, 35], ACT_Q = [31, 21, 30];
  const splitQ = (tots, key) => { const rem = UNITS.map((u) => u[key]); const out = UNITS.map(() => []); tots.forEach((T, qi) => { const a = qi === tots.length - 1 ? rem.slice() : alloc(T, rem); a.forEach((v, i) => { out[i][qi] = v; rem[i] -= v; }); }); return out; };
  const pQ = splitQ(PLAN_Q, 'ytdPlan'), aQ = splitQ(ACT_Q, 'ytdAct');
  const rs = NS.rng(2611);
  UNITS.forEach((u, i) => {
    u.plan = []; u.act = []; let hp = u.opening, ha = u.opening;
    for (let q = 0; q < 3; q++) {
      const pn = pQ[i][q], an = aQ[i][q];
      const px = u.lead ? 0 : Math.round(hp * 0.02), pb = Math.round(px * 0.85);
      const ex = u.lead ? 0 : ha * [0.019, 0.022, 0.018][q]; const ax = Math.floor(ex) + (rs() < ex % 1 ? 1 : 0); const ab = Math.max(0, ax - (rs() < 0.22 ? 1 : 0));
      u.plan.push({ h: pn - pb + px, b: pb, x: px }); u.act.push({ h: an - ab + ax, b: ab, x: ax });

  const netOf = (c) => c.h + c.b - c.x;
  const SETTINGS0 = { attr: 8, merit: 3.5, backfill: 85, lead: 52, basis: 'mid', oncost: 24, margin: 30, mgrShare: 6, fyStart: '2026-01-01', fyEnd: '2026-12-31' };

    const out = q4 ? clone(q4) : {};

    const free = UNITS.filter((u) => !u.lead && !edited[u.key + ':b']), fixedB = U.sum(UNITS.filter((u) => edited[u.key + ':b']), (u) => out[u.key].b);
    const bT = Math.max(0, Math.round((U.sum(UNITS, (u) => out[u.key].x) * st.backfill) / 100) - fixedB), bA = alloc(bT, free.map((u) => out[u.key].x));

    if (!q4) UNITS.forEach((u) => { const c = out[u.key]; c.h = Math.max(0, u.fy - u.ytdAct - c.b + c.x); });

  };

  /* people-programs budget (FY26, $3.6M) */
  const PROGRAMS = [
    { id: 'rr', name: 'Rewards & recognition', short: 'Rewards', budget: 1100000, ytd: 790000, fc: 330000, w: [6, 7, 8, 9, 8, 9, 10, 9, 10, 9, 9, 17], owner: 'NS-1930', note: 'Spot awards, service anniversaries and the year-end recognition awards.' },

    { id: 'ops', name: 'People Ops & HRIS', short: 'People Ops', budget: 600000, ytd: 462000, fc: 120000, w: [22, 6, 6, 6, 6, 6, 6, 6, 6, 6, 6, 6], owner: 'NS-1910', note: 'HRIS licences (annual, paid in January), payroll integrations and analytics modules.' },

  ];
  PROGRAMS.forEach((p) => { const a = alloc(p.ytd / 1000, p.w.slice(0, 9)).map((v) => v * 1000), f = alloc(p.fc / 1000, p.w.slice(9)).map((v) => v * 1000); p.monthly = a.concat(f); if (!p.owner) { const t = D.teams.find((x) => x.name === p.team); p.owner = t ? t.managerId : 'NS-1901'; } });
  const COMMITMENTS = [
    { prog: 'ld', title: 'Leadership programme · cohort 3 (24 managers)', amount: 64000, date: '2026-10-14', status: 'Contracted' },

  /* headcount requests (seeded; approved + unfilled = open requisitions) */
  const RSTAT = { Draft: 'neutral', 'Under review': 'warn', Approved: 'brand', Declined: 'bad', Filled: 'ok' };
  const ENG_ROLE = { backend: 'Backend Engineer', data: 'Data Engineer', frontend: 'Frontend Engineer', mobile: 'Mobile Engineer', infra: 'Site Reliability Engineer', security: 'Security Engineer', devex: 'Developer Productivity Engineer', qa: 'QA Automation Engineer' };
  const CASES = {
    backend: ['Second on-call pod for {t}; the team runs a 1-in-4 pager rotation with 38% more API traffic than in January.', 'Own multi-region failover for {t} ahead of the FY27 enterprise SLA (99.95%).'],
    data: ['Scale {t} for the Applied AI launch — nightly batch windows already use 92% of the budget.', 'Data-quality ownership for tier-1 tables in {t}; three incidents this quarter traced to schema drift.'],
    frontend: ['{t} carries the console redesign and the onboarding revamp in the same quarter with one engineer per surface.', 'WCAG 2.2 AA conformance for {t} before the public-sector tender in FY27 Q1.'],
    mobile: ['Offline sync for {t} slipped a quarter; a second senior engineer de-risks the FY27 Q1 release.', '{t} release trains move to weekly and need a dedicated release owner.'],
    infra: ['{t} supports 42 services with 9 engineers; toil is 46% of sprint capacity.', 'Cost engineering for {t}: cloud spend grew 22% against 11% revenue growth.'],
    security: ['SOC 2 Type II scope now covers EU data residency; {t} needs a control owner.', '{t} has 11 tier-1 services without a current threat model.'],
    devex: ['{t}: median CI time is 31 minutes against a 15-minute FY27 target.', 'Ephemeral preview environments on every PR — {t} has no owner for the preview stack.'],
    qa: ['{t} automates the remaining 40% of critical journeys before release trains go weekly.', 'Performance testing for the FY27 Q1 scale event is unstaffed in {t}.'],
    product: ['{t} has one PM across three squads; discovery dropped to four interviews a quarter.', 'FY27 pricing & packaging needs a dedicated owner in {t}.'],
    design: ['{t} supports 11 squads with 7 designers; research requests wait five weeks.', 'Design-system adoption has stalled at 71% — {t} needs a systems designer.'],
    sales: ['{t} carries 38 named accounts per AE against a target of 25; pipeline coverage is 2.4×.', 'New territory for {t} after the partner launch — 60 qualified accounts are unassigned.'],
    cs: ['{t} book size is 31 accounts per CSM against a target of 22, with two at-risk Q4 renewals.', 'Follow-the-sun coverage for {t}; APAC first response is 7.5 hours.'],
    marketing: ['{t} runs three launches in Q4 with one owner; enablement assets slipped twice.', 'Pipeline attribution in {t} is manual — needs a marketing-ops analyst.'],

    ta: ['{t} carries 28 open reqs with 9 recruiters; time to fill is 52 days against 45.'],
    finance: ['Month-end close in {t} takes 9 days; the FY27 target is 5.', 'Revenue recognition for multi-year deals needs a specialist in {t}.'],

  };
  const teamInfo = (name) => D.teams.find((t) => t.name === name);
  const roleTitle = (level, dept, team) => { const t = teamInfo(team); if (dept === 'Engineering' && t) { if (level.startsWith('M')) return `Engineering Manager, ${team}`; const pre = { P1: 'Associate ', P2: '', P3: 'Senior ', P4: 'Principal ', P5: 'Staff ' }[level] ?? ''; return pre + (ENG_ROLE[t.skillKey] || 'Software Engineer'); } return D.titleFor(level, dept, team); };
  const approverFor = (dept) => (dept === 'Engineering' ? 'NS-1003' : 'NS-1006');
  const seedRequests = (q4) => {
    const r = NS.rng(8842), out = [];
    const plannable = UNITS.filter((u) => !u.lead && u.teams.length);
    const mk = (o) => { const ti = teamInfo(o.team); const u = UBY[ti.dept + '|' + ti.org]; return { dept: ti.dept, org: ti.org, unit: u.key, requester: o.requester || ti.managerId, approver: approverFor(ti.dept), trail: [], type: 'New role', title: o.title || roleTitle(o.level, ti.dept, o.team), ...o }; };
    const lvl = () => { const x = r(); return x < 0.07 ? 'P1' : x < 0.42 ? 'P2' : x < 0.82 ? 'P3' : x < 0.97 ? 'P4' : 'M3'; };
    const locIn = (team) => { const ps = PEOPLE.filter((p) => p.team === team && p.track === 'IC'); return ps.length ? ps[Math.floor(r() * ps.length)].location : 'AUS'; };
    const add = (status, u, created) => { const team = u.teams[Math.floor(r() * u.teams.length)]; const level = lvl(); const ti = teamInfo(team); const cs = CASES[ti.skillKey] || CASES.backend; return mk({ status, team, level, loc: locIn(team), created, type: r() < 0.24 ? 'Backfill' : 'New role', summary: cs[Math.floor(r() * cs.length)].replace('{t}', team) }); };
    const stages = []; [['Offer accepted', 5], ['Offer out', 4], ['Interviewing', 11], ['Sourcing', 8]].forEach(([s, n]) => { for (let i = 0; i < n; i++) stages.push(s); });

    const ap = alloc(28, plannable.map((u) => q4[u.key].h)); let si = 0;
    plannable.forEach((u, i) => { for (let k = 0; k < ap[i]; k++) { const q = add('Approved', u, iso(U.addDays('2026-07-01', Math.floor(r() * 68)))); q.stage = stages[si++]; q.candidates = { Sourcing: 6 + Math.floor(r() * 10), Interviewing: 3 + Math.floor(r() * 5), 'Offer out': 1, 'Offer accepted': 1 }[q.stage]; out.push(q); } });

      const mx = Math.max(4, ...vals.flat().filter((x) => x != null).map(Math.abs));

        onCell: (ri, ci) => { const cell = dd.cells[ri], [k, name] = dd.fams[ci], g = cell.sup[k] - cell.dem[k], ppl = cell.u.people.filter((p) => (p.skills || []).some((s) => FAM[FAM.findIndex((f) => f[0] === k)][2].includes(s))); const ac = g < 0 ? actionFor(cell, k, g) : null; NS.drawer({ eyebrow: esc(name), title: esc(cell.u.org), sub: `Supply ${cell.sup[k]} · demand ${cell.dem[k]} · gap ${sgn(g)}`, body: `<div class="cost-box mb-4"><div><span>Today</span><b>${cell.cur[k]}</b></div><div><span>After Q4 plan</span><b>${cell.sup[k]}</b></div><div><span>FY27 demand</span><b>${cell.dem[k]}</b></div></div>${ac ? `<div class="case mb-4"><b>${ac.a}.</b> ${esc(ac.why)}</div>` : `<div class="case mb-4">${g > 0 ? `Surplus of ${g} — candidates for internal mobility into shortage families.` : 'Balanced against FY27 demand.'}</div>`}<div class="ns-section-title" style="margin-top:0"><h2>People with these skills</h2><p>${ppl.length}</p></div><div class="ns-list">${ppl.slice(0, 10).map((p) => `<div class="ns-row">${NS.person(p, { sub: `${lvlLabel(p.level)} · ${p.team}` })}<span class="grow"></span><span class="xs muted">${esc((p.skills || []).filter((s) => FAM.find((f) => f[0] === k)[2].includes(s)).join(', '))}</span></div>`).join('')}${ppl.length > 10 ? `<p class="xs muted mt-2">…and ${ppl.length - 10} more</p>` : ''}</div>` }); } });
      NS.chart.hbars(root.querySelector('#famBars'), { items: dd.fams.map(([k, name]) => ({ label: name, value: U.sum(dd.cells, (cell) => cell.sup[k] - cell.dem[k]) })).filter((x) => x.value !== 0).sort((a, b) => a.value - b.value).map((x) => ({ ...x, color: x.value < 0 ? 'var(--viz-div-neg)' : 'var(--viz-div-pos)', value: Math.abs(x.value), sub: x.value < 0 ? 'shortage' : 'surplus' })), format: F.int, valueLabel: 'People' });
      root.querySelectorAll('[data-acc]').forEach((b) => { b.onclick = () => { S.skillActions[b.dataset.acc] = b.dataset.a; saveNow(); log(`Accepted ${b.dataset.a} for ${b.dataset.acc}`); NS.toast(`${b.dataset.a} planned`, { desc: b.dataset.acc.split(':')[0].split('|').pop() + ' · added to the capability plan' }); NS.refresh(); }; });
      root.querySelector('[data-export]').onclick = () => downloadCsv(`capability-plan-${v}.csv`, [['Unit', 'Family', 'Supply today', 'Supply after plan', 'FY27 demand', 'Gap'], ...dd.cells.flatMap((cell) => dd.fams.map(([k, name]) => [cell.u.org, name, cell.cur[k], cell.sup[k], cell.dem[k], cell.sup[k] - cell.dem[k]]))]);
    },
  };

  /* ASSUMPTIONS ------------------------------------------------------- */
  const FIELDS = [
    { k: 'attr', label: 'Attrition (annualised)', unit: '%', min: 4, max: 16, step: 0.5, help: 'Drives expected Q4 exits for every org. FY26 actual is running at 7.4%.' },
    { k: 'backfill', label: 'Backfill ratio', unit: '%', min: 50, max: 100, step: 5, help: 'Share of exits replaced like-for-like in the plan.' },
    { k: 'merit', label: 'Merit budget (FY27)', unit: '%', min: 0, max: 6, step: 0.25, help: 'Applied to the EOY run-rate for the FY27 opening run-rate.' },
    { k: 'lead', label: 'Hiring lead time', unit: 'days', min: 20, max: 120, step: 1, help: 'Req opened → start date. Sets the last day a Q4 req can land in FY26.' },
    { k: 'mgrShare', label: 'Managers in new hiring', unit: '%', min: 0, max: 15, step: 1, help: 'Share of new roles that are people managers (affects span of control).' },
    { k: 'oncost', label: 'On-costs for fully loaded cost', unit: '%', min: 10, max: 40, step: 1, help: 'Benefits, payroll taxes and equipment on top of base.' },
    { k: 'margin', label: 'Contractor agency margin', unit: '%', min: 10, max: 60, step: 1, help: 'Removed when a contractor converts to FTE.' },
  ];
  const drv = (f) => `<label class="wp-drv-row"><span class="k"><b>${f.label}</b><small>${f.help}</small></span><span class="v"><input type="number" data-f="${f.k}" min="${f.min}" max="${f.max}" step="${f.step}" value="${S.settings[f.k]}" aria-label="${esc(f.label)}"><em>${f.unit}</em></span></label>`;
  R['/settings'] = {
    title: 'Assumptions', personas: ['cpo', 'rewards'],
    render: (c) => {
      const st = S.settings, A = agg(UNITS);
      return html`${raw(NS.pageHead({ eyebrow: 'Planning assumptions · FY26', title: 'Assumptions', sub: 'The drivers behind every number in Workforce Planner. Changes re-derive the Q4 exits and backfills you haven’t edited by hand, and flow into costs, scenarios and the board pack.' }))}
        <div class="ns-grid main-side">
          <div class="grid gap-4">
            ${raw(NS.card({ title: 'Workforce drivers', sub: 'Exits, backfills, timing and manager mix · tinted cells are inputs', body: `<div class="wp-drv">${FIELDS.slice(0, 5).map(drv).join('')}</div>` }))}
            ${raw(NS.card({ title: 'Cost basis', sub: 'New hires are costed at band midpoint × function × location tier', body: `<div class="wp-drv"><label class="wp-drv-row wide"><span class="k"><b>Cost basis</b><small>Switches every run-rate figure between base and fully loaded.</small></span><span class="v"><select data-f="basis" aria-label="Cost basis"><option value="mid" ${st.basis === 'mid' ? 'selected' : ''}>Base salary at band midpoint</option><option value="loaded" ${st.basis === 'loaded' ? 'selected' : ''}>Fully loaded (midpoint + on-costs)</option></select></span></label>${FIELDS.slice(5).map(drv).join('')}</div><div class="ns-section-title" style="margin-top:20px"><h2>Hiring-level mix</h2><p>Used for the cost of a new role</p></div><div class="flex gap-2 wrap">${[['P1', 15], ['P2', 40], ['P3', 35], ['P4', 10]].map(([l, w]) => `<span class="pchip">${esc(lvlLabel(l))} <b>${w}%</b></span>`).join('')}</div>` }))}
            ${raw(NS.card({ title: 'Fiscal year', sub: 'Sets the requisition cut-off for FY26 starts', body: `<div class="wp-drv"><label class="wp-drv-row"><span class="k"><b>FY26 start</b></span><span class="v"><input type="date" data-f="fyStart" value="${st.fyStart}" aria-label="FY26 start"></span></label><label class="wp-drv-row"><span class="k"><b>FY26 end</b></span><span class="v"><input type="date" data-f="fyEnd" value="${st.fyEnd}" aria-label="FY26 end"></span></label><div class="wp-drv-row"><span class="k"><b>Last day to open a Q4 req</b><small>= FY26 end − hiring lead time</small></span><span class="v ro"><output id="lastReq">${F.date(P.reqDeadline())}</output></span></div></div>` }))}
            <div class="wp-formbar"><span class="sm muted grow">Changes apply to every persona’s view after saving.</span><button class="ns-btn ghost" data-defaults>${ic('undo')}Restore defaults</button><button class="ns-btn primary" data-save>${ic('save')}Save assumptions</button></div>
          </div>
          <div class="grid gap-4">
            ${raw(NS.card({ title: 'Impact preview', sub: 'Current → after saving · company-wide', body: '<div id="impact"></div>' }))}
            ${raw(NS.card({ title: 'Band midpoints by location', sub: 'Engineering P3 · base', body: `<div>${U.sortBy(D.locations, (l) => -l.tier).map((l) => `<div class="kv"><span>${esc(l.city)} <span class="faint">· ${F.num(l.tier, 2)}×</span></span><b>${m$(bandMid('P3', 'Engineering', l.id))}</b></div>`).join('')}</div>` }))}
          </div>
        </div>`;
    },
    mounted: (c, root) => {
      const read = () => { const st = { ...S.settings }; root.querySelectorAll('[data-f]').forEach((i) => { const k = i.dataset.f; st[k] = i.type === 'number' ? +i.value : i.value; }); FIELDS.forEach((f) => { st[f.k] = U.clamp(+st[f.k] || f.min, f.min, f.max); }); return st; };
      const withSettings = (st, fn) => { const keep = S.settings, q4 = S.q4; S.settings = st; S.q4 = P.deriveQ4(st, q4, S.edited); const r = fn(); S.settings = keep; S.q4 = q4; return r; };
      const snap = () => { const A = agg(UNITS), b = run({ ...scen('base'), attr: S.settings.attr, merit: S.settings.merit }, UNITS); return { x: A.q4.x, bf: A.q4.b, eoy: A.eoy, pay: A.payEoy, fy27: b.fy27, dl: P.reqDeadline() }; };
      const upd = () => { const before = snap(), after = withSettings(read(), snap); const rows = [['Q4 expected exits', before.x, after.x, F.int], ['Q4 backfills', before.bf, after.bf, F.int], ['EOY headcount', before.eoy, after.eoy, F.int], ['EOY payroll run-rate', before.pay, after.pay, (n) => m$(n)], ['FY27 opening run-rate', before.fy27, after.fy27, (n) => m$(n)]]; const dl2 = withSettings(read(), () => P.reqDeadline()); root.querySelector('#impact').innerHTML = `<div class="imp"><span class="xs semibold">Output</span><b class="xs" style="font-family:var(--font-sans);font-weight:600">Now</b><b class="xs" style="font-family:var(--font-sans);font-weight:600">After save</b>${rows.map(([k, a, b, f]) => `<span>${k}</span><b>${f(a)}</b><b class="to ${a === b ? '' : 'chg'}">${f(b)}</b>`).join('')}<span>Last day to open a Q4 req</span><b>${F.date(before.dl, 'short')}</b><b class="to ${+new Date(before.dl) === +new Date(dl2) ? '' : 'chg'}">${F.date(dl2, 'short')}</b></div><p class="xs muted mt-3">${Object.keys(S.edited).length} hand-edited Q4 cells keep their values. Changed outputs are highlighted.</p>`; root.querySelector('#lastReq').textContent = F.date(withSettings(read(), () => P.reqDeadline())); };
      root.querySelectorAll('[data-f]').forEach((i) => i.addEventListener('input', upd)); upd();
      root.querySelector('[data-save]').onclick = () => { const st = read(), old = S.settings; S.settings = st; S.q4 = P.deriveQ4(st, S.q4, S.edited); const b = scen('base'); b.attr = st.attr; b.merit = st.merit; S.scenarios.forEach((s) => { if (s.id !== 'base' && s.attr === old.attr) s.attr = st.attr; }); saveNow(); log('Updated planning assumptions'); NS.toast('Assumptions saved', { desc: `Attrition ${F.num(st.attr, 1)}% · merit ${F.num(st.merit, 2)}% · ${st.basis === 'loaded' ? 'fully loaded' : 'base'} cost` }); NS.refresh(); };
      root.querySelector('[data-defaults]').onclick = () => { root.querySelectorAll('[data-f]').forEach((i) => { i.value = P.SETTINGS0[i.dataset.f]; }); upd(); NS.toast('Defaults restored in the form', { desc: 'Save to apply.', type: 'info' }); };
    },
  };

  /* BOOT -------------------------------------------------------------- */
  const store = P.store;
  const personas = [
    { ...D.personas.hrbp, note: 'Portfolio plan, requests & org design' },
    { ...D.personas.exec, note: 'Engineering plan, scenarios & approvals' },
    { ...D.personas.cpo, note: 'Company plan, budget & board view' },
    { ...D.personas.rewards, label: 'Finance partner', note: 'Budget, cost model & merit' },
  ];
  R['/home'].nav = (c) => (c.query.view === 'board' ? 'board' : 'home');
  ['/plan', '/scenarios'].forEach((k) => { R[k].personas = ['hrbp', 'exec', 'cpo', 'rewards']; });
  const reqBadge = (pid) => { if (pid === 'exec') return S.requests.filter((q) => q.status === 'Under review' && q.approver === 'NS-1003').length || ''; if (pid === 'cpo') return S.requests.filter((q) => q.status === 'Under review').length || ''; return S.requests.filter((q) => q.status === 'Draft' && PORTFOLIO.includes(q.dept)).length || ''; };
  const A0 = () => agg(UNITS);
  NS.app({
    id: 'workforce-planner', name: 'Workforce Planner', sub: 'Northstar Labs', brand: 'lime', version: '2.0',
    mark: NS.icon('calculator', { size: 20 }),
    category: 'Headcount & budget planning',
    get create() { const pid = NS.persona && NS.persona.id, open = (route, sel) => { NS.go(route); setTimeout(() => { const b = document.querySelector(sel); if (b) b.click(); }, 120); }; return pid === 'exec' || pid === 'rewards' ? { label: 'New scenario', createLabel: 'New scenario', run: () => open('/scenarios', '[data-new]') } : { label: 'New headcount request', createLabel: 'New request', run: () => open('/requests', '[data-new]') }; },
    about: { tagline: 'Plan the org you can afford — and the one you need.', description: 'One place where People, Finance and leaders plan headcount against budget. A live quarterly planning grid with plan-vs-actual variance, scenario modelling built on band midpoints and location tiers, a headcount-request workflow with business cases and approvals, an org-design analyzer for spans, layers and level mix, a capability gap map, and stewardship of the people-programs budget.', highlights: [{ icon: 'table', title: 'Live planning grid', body: 'Edit Q4 hires, backfills and exits; EOY headcount and run-rate recompute instantly.' }, { icon: 'sliders', title: 'Scenario engine', body: 'Hire rate, attrition, merit, conversion, offshore mix and span targets → cost and shape.' }, { icon: 'network', title: 'Org design rules', body: 'Spans, layers and senior-IC mix checked against target, with actionable fixes.' }, { icon: 'wallet', title: 'Budget stewardship', body: 'Burn vs straight-line, commitments and audited reallocations across six programs.' }] },
    personas, defaultPersona: 'hrbp',
    nav: (persona) => {
      const pid = persona.id, it = (id, label, icon, extra = {}) => ({ id, label, icon, ...extra });
      if (pid === 'hrbp') return [{ group: 'Plan', items: [it('home', 'Home', 'home'), it('plan', 'Planning grid', 'table'), it('scenarios', 'Scenarios', 'sliders')] }, { group: 'Portfolio', items: [it('requests', 'Headcount requests', 'user-plus', { badge: reqBadge(pid) }), it('org', 'Org design', 'network'), it('skills', 'Capability plan', 'puzzle')] }];
      if (pid === 'exec') return [{ group: 'Engineering plan', items: [it('home', 'Home', 'home'), it('plan', 'Planning grid', 'table'), it('scenarios', 'Scenarios', 'sliders')] }, { group: 'Decide', items: [it('requests', 'Approvals', 'inbox', { badge: reqBadge(pid) }), it('org', 'Org design', 'network'), it('skills', 'Capability plan', 'puzzle')] }];
      if (pid === 'cpo') return [{ group: 'Company plan', items: [it('home', 'Home', 'home'), it('board', 'Board view', 'clipboard-list', { route: '/home?view=board' }), it('plan', 'Planning grid', 'table'), it('scenarios', 'Scenarios', 'sliders')] }, { group: 'Money & org', items: [it('budget', 'Budget', 'wallet'), it('requests', 'Headcount requests', 'user-plus', { badge: reqBadge(pid) }), it('org', 'Org design', 'network'), it('skills', 'Capability plan', 'puzzle')] }, { group: 'Administration', items: [it('settings', 'Assumptions', 'settings')] }];
      return [{ group: 'Cost model', items: [it('home', 'Home', 'home'), it('budget', 'Budget', 'wallet'), it('scenarios', 'Cost scenarios', 'sliders'), it('plan', 'Planning grid', 'table'), it('board', 'Board view', 'clipboard-list', { route: '/home?view=board' })] }, { group: 'Administration', items: [it('settings', 'Assumptions', 'settings')] }];
    },
    promo: () => { const A = A0(); return { title: `FY26 plan · ${Math.round(A.attain * 100)}% of net adds landed`, body: `${A.ytdAct} of ${A.ytdPlan} planned net adds through Q3 · Q4 needs ${sgn(A.q4net)} to reach ${F.int(A.target)}.`, progress: Math.round(A.attain * 100), cta: { label: 'Planning grid', route: '/plan' } }; },
    notifications: [
      { icon: 'sliders', title: 'Q4 hiring freeze scenario shared by Elena', body: '“Hiring freeze (Q4)” — only offers already out land; backfills at 50%.', time: 'Yesterday', route: '/scenarios' },
      { icon: 'inbox', title: '3 headcount requests awaiting approval', body: 'ML Platform, Application Security and SRE — all within the Q4 plan.', time: 'Today', route: '/requests?status=Under review' },
      { icon: 'wallet', title: 'L&D budget 84% consumed', body: '$756K of $900K spent with a quarter to run; forecast $46K over.', time: '2 days ago', route: '/budget' },
      { icon: 'git-branch', title: 'Plan v3 committed', body: 'Q3 re-forecast — Q4 net adds set to 87 to hold EOY at 1,138.', time: '2 days ago', route: '/plan' },
    ],
    routes: R, default: '/home',
    commands: (persona) => { const pid = persona.id, out = [{ label: 'Open the planning grid', icon: 'table', group: 'Actions', run: () => NS.go('/plan') }, { label: 'Compare scenarios', icon: 'sliders', group: 'Actions', run: () => NS.go('/scenarios') }]; if (pid === 'hrbp' || pid === 'cpo') out.push({ label: 'New headcount request', icon: 'user-plus', group: 'Actions', run: () => { NS.go('/requests'); setTimeout(() => { const b = document.querySelector('[data-new]'); if (b) b.click(); }, 120); } }); if (pid === 'exec' || pid === 'cpo') out.push({ label: 'Review requests awaiting approval', icon: 'inbox', group: 'Actions', run: () => NS.go('/requests', { status: 'Under review' }) }); if (pid === 'cpo' || pid === 'rewards') out.push({ label: 'Reallocate budget', icon: 'refresh', group: 'Actions', run: () => NS.go('/budget', { realloc: 1 }) }, { label: 'Open board view', icon: 'clipboard-list', group: 'Actions', run: () => NS.go('/home', { view: 'board' }) }); return out; },
    search: (q) => { if (q.length < 2) return []; const s = q.toLowerCase(), pid = NS.persona.id, out = []; UNITS.filter((u) => !u.lead && (u.org.toLowerCase().includes(s) || u.dept.toLowerCase().includes(s))).slice(0, 4).forEach((u) => out.push({ group: 'Plan rows', label: `${u.org} · ${u.dept}`, hint: `${u.hc} people · Q4 ${sgn(netOf(S.q4[u.key]))}`, run: () => NS.go('/plan', { focus: u.key }) })); if (pid !== 'rewards') S.requests.filter((r) => r.id.toLowerCase().includes(s) || r.title.toLowerCase().includes(s) || r.team.toLowerCase().includes(s)).slice(0, 5).forEach((r) => out.push({ group: 'Requests', label: `${r.id} · ${r.title}`, hint: r.status, run: () => NS.go('/requests', { id: r.id }) })); if (pid !== 'rewards') D.managers.filter((p) => p.name.toLowerCase().includes(s)).slice(0, 4).forEach((p) => out.push({ group: 'Managers', label: p.name, hint: `${p.team} · span ${p.directs}`, avatar: NS.avatar(p, { size: 'xs' }), run: () => NS.go('/org', { s: UNITS.find((u) => u.dept === p.dept && u.org === p.org && u.dept === 'Engineering' && !u.lead) ? 'o:' + p.dept + '|' + p.org : (pid === 'exec' ? 'd:Engineering' : 'd:' + p.dept) }) })); return out; },
    onReset: () => store.clear(),
  });
})();
</script>
</body>
</html>

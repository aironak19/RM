<script>
(function () {
  'use strict';

  const store = NS.store('compintel-pro');
  const TODAY = new Date('2026-09-24T10:00:00');
  const P = D.people, LOC = D.locMap, LVL = D.levelMap;

  /* ------------------------------------------------------------------ */

  const EXP = [{ id: '0-2', label: '0–2 yrs', levels: 'P0–P1' }, { id: '2-5', label: '2–5 yrs', levels: 'P2' }, { id: '5-8', label: '5–8 yrs', levels: 'P3' }, { id: '8+', label: '8+ yrs', levels: 'P4+' }];
  const expIdx = (p) => (p.level === 'P0' || p.level === 'P1' ? 0 : p.level === 'P2' ? 1 : p.level === 'P3' ? 2 : 3);
  // External benchmarks: P50 base salary, USD, US tier (1.00). Aggregated survey data — illustrative. Scaled by NSData location tier.
  const MARKET = { Backend: [98000, 131000, 167000, 210000], 'Data/ML': [104000, 148000, 192000, 256000], Frontend: [94000, 126000, 160000, 200000], Mobile: [96000, 130000, 165000, 205000], 'Infra/SRE': [100000, 136000, 172000, 218000], Security: [100000, 138000, 178000, 224000], Product: [96000, 127000, 160000, 202000] };
  const MOVEMENT = { Backend: 3, 'Data/ML': 9, Frontend: 2, Mobile: 2, 'Infra/SRE': 4, Security: 7, Product: 3 }; // 12-month P50 movement, %
  const MARKET_META = { asOf: 'Q3 2026', p25: 0.88, p75: 1.14, source: 'Aggregated compensation-survey data (illustrative) · base salary · P50 · US tier = 1.00, scaled by location tier' };
  const GAP_RULES = { urgent: -15, watch: -5, above: 10 };
  const gapStatus = (g) => (g == null ? null : g * 100 <= GAP_RULES.urgent ? { id: 'urgent', label: 'Urgent', cls: 'bad' } : g * 100 <= GAP_RULES.watch ? { id: 'watch', label: 'Watch', cls: 'warn' } : g * 100 >= GAP_RULES.above ? { id: 'above', label: 'Above market', cls: 'info' } : { id: 'parity', label: 'Parity', cls: 'ok' });
  const MATRIX_DEFAULT = { 5: [8, 6.5, 5, 3.5], 4: [6, 5, 4, 2.5], 3: [4, 3.5, 2.5, 1.5], 2: [2, 1, 0, 0], 1: [0, 0, 0, 0] };
  const QUARTILES = [{ label: '< 0.90', sub: 'Well below mid' }, { label: '0.90 – 1.00', sub: 'Below mid' }, { label: '1.00 – 1.10', sub: 'Above mid' }, { label: '> 1.10', sub: 'Well above mid' }];
  const qIdx = (c) => (c < 0.9 ? 0 : c < 1.0 ? 1 : c < 1.1 ? 2 : 3);
  const SETTINGS_DEFAULT = { under: 0.85, over: 1.15, critRisk: 80, critCompa: 0.90, budgetPct: 3.2, currency: 'USD', spread: 20, lockDate: '2026-10-23', effective: '2026-12-01' };
  const CUR = { USD: { sym: '$', rate: 1, label: 'US dollar' }, EUR: { sym: '€', rate: 0.92, label: 'Euro' }, GBP: { sym: '£', rate: 0.79, label: 'Pound sterling' }, INR: { sym: '₹', rate: 83.5, label: 'Indian rupee' }, SGD: { sym: 'S$', rate: 1.35, label: 'Singapore dollar' } };
  const BANDS = [
    { id: 'under', label: 'Underpaid', cls: 'bad', color: 'var(--viz-critical)' },
    { id: 'below', label: 'Below mid', cls: 'warn', color: 'var(--viz-seq-300)' },

  const ORGS = U.uniq(P.map((p) => p.org));

  const tierOf = (p) => LOC[p.location].tier;

  const histFor = (p) => {

  const bindRange = (root, o) => root.querySelectorAll('[data-rp] .rp-row').forEach((row) => { const r = o.rows[+row.dataset.i]; row.addEventListener('mouseenter', () => { const b = row.getBoundingClientRect(); NS.viztip.show(`<b>${NS.esc(r.label)}</b>${r.sub ? `<div class="faint xs">${NS.esc(r.sub)}</div>` : ''}<div class="r"><span>P10</span><span>${o.fmt(r.p10)}</span></div><div class="r"><span>P25</span><span>${o.fmt(r.p25)}</span></div><div class="r"><span>Median</span><span>${o.fmt(r.p50)}</span></div><div class="r"><span>P75</span><span>${o.fmt(r.p75)}</span></div><div class="r"><span>P90</span><span>${o.fmt(r.p90)}</span></div>`, b.left + b.width / 2, b.top); }); row.addEventListener('mouseleave', NS.viztip.hide); if (o.rowLink) row.addEventListener('click', () => o.rowLink(r)); });

    },

      const rows = groupsOf(pool, key).map((g) => { const elig = g.people.filter((p) => p.rating); const cost = U.sum(g.people, (p) => meritFor(p).amt); const pc = U.sum(proposalsFor(g.people).filter((x) => x.status !== 'declined'), (x) => x.to - x.from); const bc = U.sum(batches, (b) => batchCost(b, g.people)); return { key: g.key, n: g.people.length, elig: elig.length, payroll: U.sum(g.people, 'salary'), cost, pc, bc, total: cost + pc + bc, avgPct: elig.length ? (cost / U.sum(elig, 'salary')) * 100 : 0 }; });

      const lk = root.querySelector('[data-lock]'); if (lk) lk.onclick = async () => { const al = allocation(pool); const pend = S.proposals.filter((x) => x.status === 'proposed').length; if (await NS.confirm({ title: 'Lock FY26 merit proposals?', body: `${pend} pending proposal${pend === 1 ? '' : 's'} and ${S.batches.filter((b) => b.status === 'draft').length} draft batch${S.batches.filter((b) => b.status === 'draft').length === 1 ? '' : 'es'} will be approved as they stand, the matrix becomes read-only and managers see final numbers. Total plan: ${money(al.total)} — ${F.pct(al.used * 100, 0)} of the pool.`, confirmLabel: 'Lock proposals' })) { S.locked = true; S.lockedAt = new Date().toISOString(); S.proposals.forEach((x) => { if (x.status === 'proposed') { x.status = 'approved'; x.decidedBy = c.persona.name; x.decidedAt = S.lockedAt; } }); S.batches.forEach((b) => { if (b.status === 'draft') b.status = 'approved'; }); saveNow(); log('Locked FY26 merit proposals'); syncNav(); NS.toast('Proposals locked', { desc: `${money(al.total)} released to payroll for ${F.date(S.settings.effective)}.` }); NS.refresh(); } };
      const ul = root.querySelector('[data-unlock]'); if (ul) ul.onclick = async () => { if (await NS.confirm({ title: 'Unlock the cycle?', body: 'Approved items stay approved; the matrix and new proposals reopen.', confirmLabel: 'Unlock', danger: true })) { S.locked = false; saveNow(); log('Unlocked FY26 merit cycle'); NS.toast('Cycle unlocked', { type: 'info' }); NS.refresh(); } };

  /* COMPGPT (INSIGHTS) ------------------------------------------------------ */
  const promptsFor = (persona) => (persona.id === 'exec' ? [['Who is underpaid in Data & ML?', 'users'], ['What is the gender pay gap in Platform?', 'scale'], ['What would it cost to bring everyone to 0.85 compa?', 'calculator'], ['Show the top 10 overpaid', 'trending-up'], ['What is the market gap for Security engineers?', 'globe'], ['Who are the critical retention priorities?', 'flame'], ['How is the merit budget allocated by org?', 'pie-chart'], ['Which levels have the most people outside band?', 'layers']] : [['Who is underpaid in Data & ML?', 'users'], ['What is the gender pay gap in Sales?', 'scale'], ['What would it cost to bring everyone to 0.85 compa?', 'calculator'], ['Show the top 10 overpaid', 'trending-up'], ['What is the market gap for Security engineers?', 'globe'], ['Who are the critical retention priorities?', 'flame'], ['How is the merit budget allocated by department?', 'pie-chart'], ['Which levels have the most people outside band?', 'layers']]);
  const ALIASES = [[/data\s*(&|and|\/)?\s*ml\b|machine learning|data science|data (team|org)/i, 'org', 'Data & ML'], [/core services/i, 'org', 'Core Services'], [/\bplatform\b(?! product)/i, 'org', 'Platform'], [/front-?end/i, 'org', 'Frontend'], [/\bmobile\b/i, 'org', 'Mobile'], [/infra|\bsre\b|reliability/i, 'org', 'Infrastructure & SRE'], [/security|appsec/i, 'org', 'Security'], [/developer experience|dev ?ex\b/i, 'org', 'Developer Experience'], [/quality|\bqa\b/i, 'org', 'Quality Engineering'], [/product management|product managers?|\bpms?\b/i, 'dept', 'Product'], [/\bdesign(ers)?\b/i, 'dept', 'Design'], [/people team|\bhr\b|people ops|people partners/i, 'dept', 'People'], [/finance/i, 'dept', 'Finance'], [/\bsales\b/i, 'dept', 'Sales'], [/customer success|\bsupport\b|\bcs\b|\bcsms?\b/i, 'dept', 'Customer Success'], [/marketing/i, 'dept', 'Marketing'], [/legal|compliance/i, 'dept', 'Legal & Compliance'], [/it & workplace|it team|corporate it|\bin it\b|workplace/i, 'dept', 'IT & Workplace'], [/\bproduct\b/i, 'dept', 'Product'], [/engineering|engineers?\b|\beng\b/i, 'dept', 'Engineering']];
  const FAM_RX = [[/back-?end/i, 'Backend'], [/data|\bml\b|machine learning/i, 'Data/ML'], [/front-?end/i, 'Frontend'], [/mobile|ios|android/i, 'Mobile'], [/infra|sre|devops|platform eng/i, 'Infra/SRE'], [/security|appsec/i, 'Security'], [/product/i, 'Product']];
  const parseScope = (q, base, persona, o = {}) => {
    let pool = base; let unit = null, lv = null, g = null, where = null;
    for (const [rx, type, val] of ALIASES) { if (rx.test(q)) { const next = pool.filter((p) => p[type] === val); if (next.length) { pool = next; unit = val; } break; } }
    const lvm = q.match(/\bP[0-6](?:\.5)?\b|\bM[1-6](?:\.5)?\b/i); if (lvm) { lv = lvm[0].toUpperCase(); pool = pool.filter((p) => p.level === lv); } else if (/\bseniors?\b/i.test(q) && !/senior (manager|director)/i.test(q)) { lv = 'P3'; pool = pool.filter((p) => p.level === 'P3'); } else if (/\bprincipal/i.test(q)) { lv = 'P4'; pool = pool.filter((p) => p.level === 'P4'); } else if (/\bmanagers?\b/i.test(q) && !/product manager|hiring manager/i.test(q)) { lv = 'managers'; pool = pool.filter((p) => p.track === 'M'); }
    if (!o.noGender) { if (/female|women|woman/i.test(q)) { g = 'women'; pool = pool.filter((p) => p.gender === 'F'); } else if (/\bmen\b|\bmale\b|\bman\b/i.test(q)) { g = 'men'; pool = pool.filter((p) => p.gender === 'M'); } }
    const loc = D.locations.find((l) => new RegExp('\\b' + l.city.split(' ')[0] + '\\b', 'i').test(q)); if (loc) { where = loc.city; pool = pool.filter((p) => p.location === loc.id); } else if (/\bindia\b/i.test(q)) { where = 'India'; pool = pool.filter((p) => p.country === 'India'); } else if (/europe|\bemea\b|\beu\b/i.test(q)) { where = 'Europe'; pool = pool.filter((p) => p.region === 'EU'); } else if (/apac|asia/i.test(q)) { where = 'Asia-Pacific'; pool = pool.filter((p) => p.region === 'APAC'); } else if (/north america|\bus\b|united states|\busa\b/i.test(q)) { where = 'North America'; pool = pool.filter((p) => p.region === 'NA'); }
    const parts = [unit, lv, g, where].filter(Boolean); const narrowed = parts.length > 0;
    const noun = lv === 'managers' ? (g ? `${g} managers` : 'managers') : g || 'people';
    const who = narrowed ? [noun, lv && lv !== 'managers' ? `at ${lv}` : '', unit ? `in ${unit}` : '', where ? `in ${where}` : ''].filter(Boolean).join(' ') : `people in ${scopeLabel(persona)}`;
    const label = narrowed ? parts.map((x) => x.charAt(0).toUpperCase() + x.slice(1)).join(' · ') : scopeLabel(persona);
    return { pool, label, who, narrowed, unit };
  };
  const miniTable = (heads, rows) => `<table class="mini-table"><thead><tr>${heads.map((h, i) => `<th class="${i ? 'num' : ''}">${NS.esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((v, i) => `<td class="${i ? 'num' : ''}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  const peopleTable = (list, extra) => miniTable(['Person', 'Level', 'Salary', 'Compa', extra ? extra[0] : 'Risk'], list.map((p) => [personLink(p, `${p.team} · ${p.city}`), p.level, money(p.salary), compaBadge(p.compa), extra ? extra[1](p) : riskBadge(p)]));
  const answer = (q, persona) => {
    const base = scopeOf(persona); const s = S.settings; const key = groupKey(persona);
    const isMarket = /market|benchmark|p50|external|survey/i.test(q); const isGap = /gender|pay gap|\bgap\b|equity|women vs|men vs/i.test(q) && !isMarket && !/cost|bring|fix|remediat|lift|floor/i.test(q);
    const sc = parseScope(q, base, persona, { noGender: isGap }); const pool = sc.pool;
    if (!pool.length) return { title: 'No one matches that scope', text: `I could not find anyone matching “${q}” in ${scopeLabel(persona)}. Try a department, org, level, location or gender — for example “women in Sales” or “P3 in Mumbai”.` };
    const numM = q.match(/(0\.\d{2})|(\b[6-9]\d)\s*%/); const th = numM ? (numM[1] ? +numM[1] : +numM[2] / 100) : null;

            ${NS.card({ title: 'Retention watch', sub: 'Reports where pay and risk both matter', body: (() => { const w = team.filter((p) => p.riskBand !== 'Low' || p.compa < 0.9).sort((a, b) => b.risk - a.risk); return w.length ? `<div class="grid gap-3">${w.map((p) => { const a = advice(p); return `<div class="flex gap-3 items-start">${NS.avatar(p, { size: 'sm' })}<div class="min-w-0"><div class="flex items-center gap-2 wrap"><b class="sm">${NS.esc(p.name)}</b>${riskBadge(p)}${compaBadge(p.compa)}</div><div class="xs ink2 mt-1">${NS.esc(a.title)}.</div><div class="flex gap-1 wrap mt-1">${drvChips(p, 2)}</div></div></div>`; }).join('')}</div>` : '<div class="sm muted">Nobody on the team is flagged.</div>'; })() })}
            ${NS.card({ title: 'Your proposals', bodyCls: 'flush', body: props.length ? `<div style="padding:4px 20px">${props.map((pr) => proposalRow(pr, { remove: true })).join('')}</div>` : `<div class="p-5">${NS.empty({ icon: 'inbox', title: 'No proposals yet', body: 'Use “Propose” on a report to send one to Total Rewards.' })}</div>` })}
            ${NS.card({ title: 'How proposals work', body: `<div class="grid gap-2 sm ink2"><div class="flex gap-2"><span class="ns-badge brand sq">1</span><span>Model the change — the band, compa and market position update live.</span></div><div class="flex gap-2"><span class="ns-badge brand sq">2</span><span>Add a note with the evidence: scope, market signal, retention risk.</span></div><div class="flex gap-2"><span class="ns-badge brand sq">3</span><span>Total Rewards approves or declines before the ${F.date(S.settings.lockDate, 'short')} lock; approved changes are effective ${F.date(S.settings.effective, 'short')}.</span></div></div>` })}
          </div>
        </div>`;
    },
    mounted: (c, root) => {
      const me = meFor(c.persona), team = D.reports(me.id);
      NS.table(root.querySelector('#teamTable'), { rows: team, rowKey: 'id', paginate: false, pageSize: 500, sort: { key: 'level', dir: -1 }, onRow: (p) => openProfileDrawer(p, c.persona), columns: [
        { key: 'name', label: 'Person', render: (p) => personLink(p, `${p.title} · ${p.city}`), sort: (p) => p.name },
        { key: 'level', label: 'Level', render: (p) => `<span class="ns-badge outline sq" data-tip="${NS.esc(LVL[p.level].title)}">${p.level}</span>`, sort: (p) => LEVEL_ORDER.indexOf(p.level) },
        { key: 'salary', label: 'Salary', align: 'right', render: (p) => `<b class="tnum">${money(p.salary)}</b>`, sort: (p) => p.salary },
        { key: 'pos', label: 'Band position', render: (p) => bandMini(p), sort: (p) => cx(p).pos, width: '132px' },
        { key: 'compa', label: 'Compa', align: 'right', render: (p) => compaBadge(p.compa, { tip: true }), sort: (p) => p.compa },
        { key: 'last', label: 'Last increase', render: (p) => { const li = lastIncrease(p); return li ? `<div class="sm">+${li.pct.toFixed(1)}%</div><div class="xs muted">${F.date(li.date, 'my')} · ${li.type}</div>` : '<span class="faint xs">None yet</span>'; }, sort: (p) => (lastIncrease(p) ? lastIncrease(p).date : '') },
        { key: 'rating', label: 'Rating', render: (p) => rdots(p.rating), sort: (p) => p.rating || 0 },
        { key: 'risk', label: 'Risk', render: (p) => riskBadge(p), sort: (p) => p.risk },
        { key: 'act', label: '', sort: false, align: 'right', render: (p) => { const pr = S.proposals.find((x) => x.pid === p.id && x.status !== 'declined'); return pr ? `<span class="ns-badge ${pr.status === 'approved' ? 'ok' : 'warn'}">${pr.status === 'approved' ? 'Approved' : 'Pending'} +${pr.pct}%</span>` : `<button class="ns-btn xs soft" data-propose="${p.id}" ${S.locked ? 'disabled' : ''}>Propose</button>`; } },
      ] });
      root.querySelectorAll('[data-propose]').forEach((b) => b.onclick = () => { const p = D.byId(b.dataset.propose); NS.modal({ title: `Propose an adjustment · ${p.first}`, sub: `${money(p.salary)} today · compa ${cr(p.compa)} · band ${money(cx(p).min)} – ${money(cx(p).max)}`, size: 'lg', body: `<div class="grid gap-4">${bandBar(p)}${adjustForm(p)}</div>`, mounted: (body, api) => bindAdjust(body, p, c.persona.name, () => { api.close(); NS.refresh(); }) }); });
      bindProposalActions(root, c.persona.name);
      root.querySelector('[data-export]').onclick = () => downloadCsv(`${me.team.replace(/\s+/g, '-').toLowerCase()}-compensation.csv`, [['Employee ID', 'Name', 'Title', 'Level', 'Location', 'Salary (USD)', 'Band min', 'Band mid', 'Band max', 'Band position %', 'Compa', 'Rating', 'Risk', 'Last increase %', 'Last increase date', 'Matrix %', 'Matrix amount'], ...team.map((p) => { const x = cx(p), li = lastIncrease(p), m = meritFor(p); return [p.id, p.name, p.title, p.level, p.city, p.salary, x.min, x.mid, x.max, Math.round(x.pos * 100), p.compa, p.rating || '', p.risk, li ? li.pct : '', li ? li.date : '', p.rating ? U.round(m.pct, 2) : '', m.amt]; })]);
    },
  };

  /* ABOUT ------------------------------------------------------------------- */
  R['/about'] = {
    title: 'About',
    render: (c) => html`${NS.pageHead({ eyebrow: 'About', title: 'CompIntel Pro', sub: 'Pay decisions with the evidence attached.' })}
      <div class="ns-grid main-side">
        <div class="grid gap-4">
          ${NS.card({ title: 'What this is', body: `<p class="md ink2">A compensation intelligence workspace built around the questions a rewards team actually gets asked: who sits where in their band, how the structure compares with the market, whether pay is equitable once level and location are taken into account, and what the merit cycle costs before it is locked. Every number on every page is computed from the shared Northstar Labs organisation — compa-ratios from salary and band midpoint, flight risk from explainable drivers, gaps from like-for-like medians.</p><div class="ns-grid c2 mt-4" style="gap:10px">${[['banknote', 'Computed compa & bands', 'Band position, compa band and critical priority follow one policy set in Settings.'], ['scale', 'Unadjusted vs adjusted equity', 'Both gaps shown side by side with the composition effect explained in plain words.'], ['globe', 'Market by role family', 'Seven families × four experience bands, tier-scaled, with urgent / watch thresholds.'], ['calculator', 'Live merit matrix', 'Editable rating × compa matrix, scenario floors and caps, proposals and a lock.']].map(([i, t, b]) => `<div class="flex gap-3 items-start" style="padding:12px;border:1px solid var(--line);border-radius:12px"><span class="ns-icon-box sm">${ic(i)}</span><div><b class="md">${t}</b><p class="sm muted">${b}</p></div></div>`).join('')}</div>` })}
          ${NS.card({ title: c.persona.id === 'manager' ? 'What you can do here' : 'Who sees what', body: c.persona.id === 'manager' ? `<div class="grid gap-2 sm ink2"><div class="flex gap-2"><span class="ns-badge brand sq">Team</span><span>See each report’s band position, compa-ratio, rating, risk and last increase.</span></div><div class="flex gap-2"><span class="ns-badge brand sq">Profile</span><span>Open a full comp profile with pay history and market comparison.</span></div><div class="flex gap-2"><span class="ns-badge brand sq">Propose</span><span>Model an adjustment and send it to Total Rewards with your evidence.</span></div></div>` : `<div class="grid gap-2 sm ink2"><div class="flex gap-2"><span class="ns-badge brand sq">Rewards</span><span>Everything, including settings and the merit-cycle lock.</span></div><div class="flex gap-2"><span class="ns-badge brand sq">HRBP</span><span>Everything except the lock.</span></div><div class="flex gap-2"><span class="ns-badge brand sq">Exec</span><span>Scoped to their organisation.</span></div><div class="flex gap-2"><span class="ns-badge brand sq">Manager</span><span>Their own team and proposals only.</span></div></div>` })}
        </div>
        <div class="grid gap-4">
          <div class="ns-alert info">${ic('info')}<div><b>Concept prototype with illustrative data</b><p>Northstar Labs is a fictional tenant. People, salaries, benchmarks and events are generated for demonstration and describe no real company or person.</p></div></div>
          ${NS.card({ title: 'Policy in force', body: `<div class="kv"><span class="muted">Underpaid below</span><b>${S.settings.under.toFixed(2)}</b></div><div class="kv"><span class="muted">Overpaid above</span><b>${S.settings.over.toFixed(2)}</b></div><div class="kv"><span class="muted">Critical priority</span><b>risk ≥ ${S.settings.critRisk} & compa < ${S.settings.critCompa.toFixed(2)}</b></div><div class="kv"><span class="muted">Band spread</span><b>±${S.settings.spread}%</b></div><div class="kv"><span class="muted">Merit pool</span><b>${S.settings.budgetPct}% of payroll</b></div>` })}
          <button class="ns-btn secondary" data-about>${ic('info')}Open the About dialog</button>
        </div>
      </div>`,
    mounted: (c, root) => { root.querySelector('[data-about]').onclick = () => NS.about(); },
  };

  /* SETTINGS (REWARDS) ----------------------------------------------------- */
  R['/settings'] = {
    title: 'Settings', personas: ['rewards'],
    render: (c) => { const s = S.settings; const sample = D.byId('NS-1207'); const sp = s.spread / 100; return html`${NS.pageHead({ eyebrow: 'Administration', title: 'Compensation policy', sub: 'Thresholds, budget and display settings. Every page recomputes from these — change the underpaid line and the explorer, equity and CompGPT all follow.', actions: `<button class="ns-btn secondary" data-defaults>${ic('undo')}Restore defaults</button><button class="ns-btn primary" data-save-settings>${ic('save')}Save changes</button>` })}
      <div class="ns-grid c2">
        ${NS.card({ title: 'Compa-ratio thresholds', sub: 'One band policy for the whole product', body: `<div class="grid gap-4"><label class="ns-field"><span class="ns-label">Underpaid below <b data-v="under">${s.under.toFixed(2)}</b></span><input type="range" class="ns-range" data-s="under" min="0.75" max="0.95" step="0.01" value="${s.under}" style="--p:${((s.under - 0.75) / 0.2) * 100}%"></label><label class="ns-field"><span class="ns-label">Overpaid above <b data-v="over">${s.over.toFixed(2)}</b></span><input type="range" class="ns-range" data-s="over" min="1.05" max="1.30" step="0.01" value="${s.over}" style="--p:${((s.over - 1.05) / 0.25) * 100}%"></label><div class="ns-alert info">${ic('info')}<div><b>Live preview</b><p data-prev-th>${P.filter((p) => p.compa < s.under).length} people underpaid · ${P.filter((p) => p.compa > s.over).length} overpaid company-wide</p></div></div></div>` })}
        ${NS.card({ title: 'Critical priority rule', sub: 'Both conditions must hold', body: `<div class="grid gap-4"><label class="ns-field"><span class="ns-label">Flight risk at or above <b data-v="critRisk">${s.critRisk}</b></span><input type="range" class="ns-range" data-s="critRisk" min="50" max="95" step="1" value="${s.critRisk}" style="--p:${((s.critRisk - 50) / 45) * 100}%"></label><label class="ns-field"><span class="ns-label">Compa-ratio below <b data-v="critCompa">${s.critCompa.toFixed(2)}</b></span><input type="range" class="ns-range" data-s="critCompa" min="0.80" max="1.00" step="0.01" value="${s.critCompa}" style="--p:${((s.critCompa - 0.8) / 0.2) * 100}%"></label><div class="ns-alert warn">${ic('flame')}<div><b>Live preview</b><p data-prev-crit>${P.filter((p) => p.risk >= s.critRisk && p.compa < s.critCompa).length} critical priorities company-wide</p></div></div></div>` })}
        ${NS.card({ title: 'Merit budget & dates', body: `<div class="grid gap-4"><label class="ns-field"><span class="ns-label">Pool as % of base payroll <b data-v="budgetPct">${s.budgetPct.toFixed(1)}%</b></span><input type="range" class="ns-range" data-s="budgetPct" min="1" max="6" step="0.1" value="${s.budgetPct}" style="--p:${((s.budgetPct - 1) / 5) * 100}%"></label><div class="ns-alert brand">${ic('calculator')}<div><b>Pool</b><p data-prev-budget>${money((U.sum(P, 'salary') * s.budgetPct) / 100)} on ${mk(U.sum(P, 'salary'))} payroll</p></div></div><div class="ns-form-grid"><label class="ns-field"><span class="ns-label">Proposals lock</span><input type="date" class="ns-input" data-s="lockDate" value="${s.lockDate}"></label><label class="ns-field"><span class="ns-label">New pay effective</span><input type="date" class="ns-input" data-s="effective" value="${s.effective}"></label></div></div>` })}
        ${NS.card({ title: 'Display currency', sub: 'Salaries are held in USD; other currencies use fixed illustrative rates', body: `<div class="grid gap-3"><select class="ns-select" data-s="currency">${Object.entries(CUR).map(([k, v]) => `<option value="${k}" ${k === s.currency ? 'selected' : ''}>${k} · ${v.label} (${v.sym})</option>`).join('')}</select><table class="fx-table"><tbody>${Object.entries(CUR).map(([k, v]) => `<tr><td>1 USD → ${k}</td><td>${v.sym}${v.rate}</td></tr>`).join('')}</tbody></table></div>` })}
        ${NS.card({ title: 'Band spread', sub: 'Minimum and maximum as a percentage of the midpoint', body: `<div class="grid gap-4"><label class="ns-field"><span class="ns-label">Spread ± <b data-v="spread">${s.spread}%</b></span><input type="range" class="ns-range" data-s="spread" min="10" max="30" step="1" value="${s.spread}" style="--p:${((s.spread - 10) / 20) * 100}%"></label><div class="ns-alert info">${ic('layers')}<div><b>Example · ${NS.esc(sample.title)} · ${NS.esc(sample.city)}</b><p data-prev-spread>${money(Math.round(sample.band.mid * (1 - sp)))} – ${money(sample.band.mid)} – ${money(Math.round(sample.band.mid * (1 + sp)))} · ${P.filter((p) => p.compa < 1 - sp || p.compa > 1 + sp).length} people outside band</p></div></div></div>` })}
        ${NS.card({ title: 'Activity log', sub: 'Recent actions in this prototype', body: S.activity.length ? `<div class="grid gap-2">${S.activity.slice(0, 12).map((a) => `<div class="flex justify-between gap-3 sm"><span class="ink2">${NS.esc(a.msg)}</span><span class="xs faint nowrap">${F.rel(a.t)}</span></div>`).join('')}</div>` : '<div class="sm muted">No activity yet.</div>' })}
      </div>`; },
    mounted: (c, root) => {
      const read = () => { const o = { ...S.settings }; root.querySelectorAll('[data-s]').forEach((i) => { const k = i.dataset.s; o[k] = i.type === 'range' ? +i.value : i.value; }); return o; };
      const preview = () => { const o = read(); root.querySelectorAll('[data-v]').forEach((b) => { const k = b.dataset.v; b.textContent = k === 'budgetPct' ? o[k].toFixed(1) + '%' : k === 'spread' ? o[k] + '%' : k === 'critRisk' ? o[k] : o[k].toFixed(2); }); root.querySelectorAll('input[type=range][data-s]').forEach((r) => r.style.setProperty('--p', ((+r.value - +r.min) / (+r.max - +r.min)) * 100 + '%')); const sp = o.spread / 100, sample = D.byId('NS-1207'); root.querySelector('[data-prev-th]').textContent = `${P.filter((p) => p.compa < o.under).length} people underpaid · ${P.filter((p) => p.compa > o.over).length} overpaid company-wide`; root.querySelector('[data-prev-crit]').textContent = `${P.filter((p) => p.risk >= o.critRisk && p.compa < o.critCompa).length} critical priorities company-wide`; root.querySelector('[data-prev-budget]').textContent = `${money((U.sum(P, 'salary') * o.budgetPct) / 100)} on ${mk(U.sum(P, 'salary'))} payroll`; root.querySelector('[data-prev-spread]').textContent = `${money(Math.round(sample.band.mid * (1 - sp)))} – ${money(sample.band.mid)} – ${money(Math.round(sample.band.mid * (1 + sp)))} · ${P.filter((p) => p.compa < 1 - sp || p.compa > 1 + sp).length} people outside band`; };
      root.querySelectorAll('[data-s]').forEach((i) => { i.oninput = preview; i.onchange = preview; });
      root.querySelector('[data-save-settings]').onclick = () => { S.settings = read(); if (S.settings.under >= 0.95) S.settings.under = 0.94; derive(); saveNow(); log('Updated compensation policy'); NS.toast('Policy saved', { desc: `Underpaid < ${S.settings.under.toFixed(2)} · overpaid > ${S.settings.over.toFixed(2)} · critical risk ≥ ${S.settings.critRisk} & compa < ${S.settings.critCompa.toFixed(2)} · pool ${S.settings.budgetPct}%` }); NS.refresh(); };
      root.querySelector('[data-defaults]').onclick = async () => { if (await NS.confirm({ title: 'Restore default policy?', body: 'Thresholds, budget, currency and spread return to the seeded values. Proposals and the matrix are not touched.', confirmLabel: 'Restore' })) { S.settings = { ...SETTINGS_DEFAULT }; derive(); saveNow(); log('Restored default policy'); NS.toast('Defaults restored', { type: 'info' }); NS.refresh(); } };
    },
  };

  /* ------------------------------------------------------------------ */
  /* 6. Boot                                                              */
  /* ------------------------------------------------------------------ */
  const store = NS.store('compintel-pro');
  const personas = [
    { ...D.personas.rewards, note: 'Full access · locks the cycle' },
    { ...D.personas.hrbp, note: 'Everything except the lock' },
    { ...D.personas.exec, note: 'Scoped to Engineering' },
    { ...D.personas.manager, note: 'Team pay & proposals' },
  ];
  const mainNav = (persona) => [{ group: 'Compensation', items: [{ id: 'home', label: 'Overview', icon: 'home' }, { id: 'people', label: 'People explorer', icon: 'users' }, { id: 'bands', label: 'Pay structure', icon: 'layers' }, { id: 'equity', label: 'Pay equity', icon: 'scale' }, { id: 'market', label: 'Market intelligence', icon: 'globe' }] }, { group: 'Planning', items: [{ id: 'cycle', label: 'Merit cycle', icon: 'calculator', badge: pendingCount() || '' }, { id: 'insights', label: 'CompGPT', icon: 'sparkles' }] }, ...(persona.id === 'rewards' ? [{ group: 'Administration', items: [{ id: 'settings', label: 'Settings', icon: 'settings' }] }] : [])];
  NS.app({
    id: 'compintel-pro', name: 'CompIntel Pro', sub: 'Northstar Labs', brand: 'emerald', version: '3.0',
    mark: ic('banknote', { size: 20 }),
    about: { tagline: 'Pay decisions with the evidence attached.', description: 'A compensation intelligence workspace built around the questions a rewards team actually gets asked: who sits where in their band, how the structure compares with the market, whether pay is equitable once level and location are taken into account, and what the merit cycle costs before it is locked. Every number is computed from the shared Northstar organisation — compa-ratios from salary and band midpoint, flight risk from explainable drivers, gaps from like-for-like medians.', highlights: [{ icon: 'banknote', title: 'Computed compa & bands', body: 'Band position, compa band and the critical-priority rule follow one policy set in Settings.' }, { icon: 'scale', title: 'Unadjusted vs adjusted equity', body: 'Both gaps side by side, with the composition effect explained in plain words and a remediation calculator.' }, { icon: 'globe', title: 'Market by role family', body: 'Seven families × four experience bands, tier-scaled, with urgent / watch / parity thresholds.' }, { icon: 'calculator', title: 'Live merit matrix', body: 'Editable rating × compa matrix, scenario floors and caps, proposals from any profile, and a lock.' }] },
    personas, defaultPersona: 'rewards',
    nav: (persona) => (persona.id === 'manager' ? [{ group: 'My team', items: [{ id: 'team', label: 'My team', icon: 'users', badge: proposalsFor(D.reports(persona.personId)).filter((x) => x.status === 'proposed').length || '' }, { id: 'about', label: 'About CompIntel', icon: 'info' }] }] : mainNav(persona)),
    promo: (persona) => { if (persona.id === 'manager') { const n = proposalsFor(D.reports(persona.personId)).filter((x) => x.status === 'proposed').length; return { title: 'Proposals', body: n ? `${n} proposal${n === 1 ? '' : 's'} waiting for Total Rewards · lock ${F.date(S.settings.lockDate, 'short')}` : `No open proposals · lock ${F.date(S.settings.lockDate, 'short')}`, cta: { label: 'Team', route: '/team' } }; } const al = allocation(scopeOf(persona)); return { title: S.locked ? 'Cycle locked' : 'Merit budget', body: `${F.pct(al.used * 100, 0)} of the ${mk(al.budget)} pool allocated${S.locked ? '' : ` · lock ${F.date(S.settings.lockDate, 'short')}`}`, progress: Math.min(100, al.used * 100), cta: { label: 'Open cycle', route: '/cycle' } }; },
    notifications: [{ icon: 'layers', title: 'Band review due · Data/ML', body: 'Structure proposal for Data/ML P2–P4 midpoints (+6%) is waiting for review before the increments window.', time: 'Today', route: '/bands' }, { icon: 'trending-up', title: 'Hot-role alert · Security +7%', body: 'Security P50 moved 7% in twelve months; internal midpoints now sit 7–9% under market at 2–8 years.', time: 'Yesterday', route: '/market' }, { icon: 'check-circle', title: 'Proposal approved', body: 'Kavya Nair · +5.0% retention adjustment approved by Yuki Nakamura.', time: '4 days ago', route: '/cycle' }, { icon: 'scale', title: 'Equity review reminder', body: 'Adjusted gap in Product is above the 3% tolerance — build a remediation batch before the lock.', time: '5 days ago', route: '/equity' }],
    routes: R, default: '/home',
    commands: (persona) => (persona.id === 'manager' ? [{ label: 'Export team compensation (CSV)', icon: 'download', group: 'Actions', run: () => NS.go('/team') }] : [{ label: 'Ask CompGPT', icon: 'sparkles', group: 'Actions', run: () => NS.go('/insights') }, { label: 'Export people (CSV)', icon: 'download', group: 'Actions', run: () => NS.go('/people') }, { label: 'Refresh market benchmark', icon: 'refresh', group: 'Actions', run: () => NS.go('/market') }, { label: 'Propose a band update', icon: 'pencil', group: 'Actions', run: () => NS.go('/bands') }, { label: 'Show critical priorities', icon: 'flame', group: 'Actions', run: () => NS.go('/people', { crit: '1' }) }, ...(persona.id === 'rewards' ? [{ label: 'Lock merit proposals', icon: 'lock', group: 'Actions', run: () => NS.go('/cycle') }] : [])]),
    search: (q) => (q.length < 2 ? [] : scopeOf(NS.persona).filter((p) => p.name.toLowerCase().includes(q.toLowerCase())).slice(0, 6).map((p) => ({ group: 'People', label: p.name, hint: `${p.title} · compa ${cr(p.compa)}`, avatar: NS.avatar(p, { size: 'xs' }), run: () => NS.go('/people/' + p.id) }))),
    onReset: () => store.clear(),
  });
})();
</script>
</body>
</html>

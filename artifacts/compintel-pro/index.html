<!doctype html>
<html lang="en" data-brand="emerald">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CompIntel Pro · Northstar Labs</title>
<meta name="description" content="CompIntel Pro — compensation intelligence for Northstar Labs: band positioning, pay equity, market benchmarks and merit-cycle planning. Concept prototype with illustrative data, designed by Ronak Mehta.">
<meta name="theme-color" content="#0B1F17">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='13' fill='%23059669'/%3E%3Crect x='10' y='15' width='28' height='18' rx='4' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Ccircle cx='24' cy='24' r='4.5' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Cpath d='M15 20v8M33 20v8' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/ns.css">
<script src="../shared/ns.js"></script>
<script src="../shared/ns-data.js"></script>
<style>
  /* =====================================================================
     CompIntel Pro · "The comp terminal"
     Identity: IBM Plex Sans UI, IBM Plex Mono for every figure, deep
     green-black chrome, white ledger canvas, emerald for action and
     at-midpoint, red/amber reserved for out-of-band pay.
     ===================================================================== */
  :root{
    --font-sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-display:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ci-chrome:#0B1F17;--ci-chrome-2:#10291F;--ci-chrome-3:#163428;--ci-chrome-line:rgba(255,255,255,.085);
    --ci-chrome-ink:#E6EFEA;--ci-chrome-ink-2:#A9BFB4;--ci-chrome-ink-3:#7F978C;
    --ci-em:#0E9F6E;--ci-em-hi:#10B981;--ci-em-glow:#6EE7B7;
    --bg:#FFFFFF;--bg-2:#F5F8F6;
    --surface:#FFFFFF;--surface-2:#F7F9F8;--surface-3:#EEF3F0;--surface-4:#E1E8E4;
    --line:#DCE3DF;--line-2:#EAEFEC;--line-strong:#C1CCC6;
    --ink:#0B1F17;--ink-2:#2B3D35;--ink-3:#52635B;--ink-4:#64746D;--ink-inverse:#FFFFFF;
    --np:#087A54;--np-hover:#066A49;--np-active:#055A3E;--np-text:#047857;--np-soft:#E8F6F0;--np-soft-2:#D2ECDF;--np-line:#A6D8C0;
    --ok:#047857;--ok-bg:#E8F6F0;--ok-line:#A6D8C0;
    --warn:#9A5800;--warn-bg:#FEF4E1;--warn-line:#EFCF95;
    --bad:#B42318;--bad-bg:#FDEEEC;--bad-line:#F2BFB8;
    --info:#3B5873;--info-bg:#EEF2F6;--info-line:#C5D1DD;
    --neutral:#45564E;--neutral-bg:#EEF2F0;--neutral-line:#D2DBD6;
    --discovery:#047857;--discovery-bg:#EEF7F2;
    --brand:#0E9F6E;--brand-hover:#087A54;--brand-active:#066A49;--brand-text:#047857;--brand-soft:#E8F6F0;--brand-soft-2:#CDEADB;--brand-line:#A6D8C0;--on-brand:#FFFFFF;
    --viz-1:#0E9F6E;--viz-2:#3B5873;--viz-3:#B5832A;--viz-4:#6F63A8;--viz-5:#B8506F;--viz-6:#2F86A6;--viz-7:#8A9891;--viz-8:#9C4A2F;
    --viz-good:#0E9F6E;--viz-warn:#D18A12;--viz-serious:#C9681E;--viz-critical:#C8372D;
    --viz-seq-100:#DCF2E7;--viz-seq-200:#B4E3CC;--viz-seq-300:#7FCBA8;--viz-seq-400:#3FB184;--viz-seq-500:#0E9F6E;--viz-seq-600:#087A54;--viz-seq-700:#06563C;
    --viz-div-neg:#C8372D;--viz-div-mid:#F1F4F2;--viz-div-pos:#3B6E8F;
    --viz-grid:#ECF0EE;--viz-axis:#C9D3CE;
    /* compa bands: grey in band, emerald at midpoint, red/amber only out of policy */
    --cb-under:#C8372D;--cb-below:#A9BAB2;--cb-at:#0E9F6E;--cb-above:#9DB0C1;--cb-over:#D18A12;
    --shadow-xs:none;--shadow-sm:0 1px 2px rgba(11,31,23,.06);
    --shadow:0 2px 6px -1px rgba(11,31,23,.08),0 1px 2px rgba(11,31,23,.05);
    --shadow-lg:0 12px 28px -6px rgba(11,31,23,.18),0 3px 8px -2px rgba(11,31,23,.07);
    --shadow-xl:0 28px 64px -12px rgba(11,31,23,.3),0 6px 14px -4px rgba(11,31,23,.08);
    --glass:rgba(255,255,255,.9);
    --r-xs:2px;--r-sm:3px;--r:4px;--r-lg:5px;--r-xl:8px;
    --header-h:48px;--topbar-h:40px;--sidebar-w:236px;--content-max:1480px;
    --focus:0 0 0 2px var(--surface),0 0 0 4px color-mix(in srgb,var(--ci-em) 65%,transparent);
  }
  :root[data-theme="dark"]{
    --ci-chrome:#050E0A;--ci-chrome-2:#0A1712;--ci-chrome-3:#10231B;--ci-chrome-line:rgba(255,255,255,.07);
    --bg:#08130F;--bg-2:#0B1813;
    --surface:#0C1A14;--surface-2:#0F1F18;--surface-3:#13271F;--surface-4:#1A3127;
    --line:#1C3128;--line-2:#152820;--line-strong:#2A4337;
    --ink:#E4EEE9;--ink-2:#B9CAC2;--ink-3:#8EA59B;--ink-4:#7B9388;--ink-inverse:#08130F;
    --np:#10B981;--np-hover:#34D399;--np-active:#0E9F6E;--np-text:#4ADE9F;--np-soft:rgba(16,185,129,.13);--np-soft-2:rgba(16,185,129,.22);--np-line:rgba(16,185,129,.4);
    --ok:#4ADE9F;--ok-bg:rgba(16,185,129,.13);--ok-line:rgba(16,185,129,.36);
    --warn:#F5B547;--warn-bg:rgba(245,166,35,.12);--warn-line:rgba(245,166,35,.34);
    --bad:#FF8A80;--bad-bg:rgba(240,80,68,.13);--bad-line:rgba(240,80,68,.36);
    --info:#A3BCD3;--info-bg:rgba(120,155,190,.13);--info-line:rgba(120,155,190,.32);
    --neutral:#B3C3BB;--neutral-bg:rgba(150,180,165,.1);--neutral-line:rgba(150,180,165,.26);
    --discovery:#4ADE9F;--discovery-bg:rgba(16,185,129,.08);
    --brand:#10B981;--brand-hover:#34D399;--brand-active:#0E9F6E;--brand-text:#4ADE9F;--brand-soft:rgba(16,185,129,.13);--brand-soft-2:rgba(16,185,129,.22);--brand-line:rgba(16,185,129,.38);--on-brand:#04140D;
    --viz-1:#10B981;--viz-2:#7C9CBC;--viz-3:#D3A34A;--viz-4:#9A8FD6;--viz-5:#D9789A;--viz-6:#4FB2D3;--viz-7:#7E8F87;--viz-8:#D27556;
    --viz-good:#10B981;--viz-warn:#E8A23A;--viz-serious:#E28248;--viz-critical:#EF5B4F;
    --viz-seq-100:#0F2A1F;--viz-seq-200:#0F4430;--viz-seq-300:#0E6345;--viz-seq-400:#0E8A5F;--viz-seq-500:#10B981;--viz-seq-600:#4ADE9F;--viz-seq-700:#A7F3D0;
    --viz-div-neg:#E5534A;--viz-div-mid:#16261F;--viz-div-pos:#5B8DB5;
    --viz-grid:#14271F;--viz-axis:#2A4337;
    --cb-under:#EF5B4F;--cb-below:#3E5A4D;--cb-at:#10B981;--cb-above:#4A6378;--cb-over:#E8A23A;
    --shadow-xs:none;--shadow-sm:0 1px 2px rgba(0,0,0,.5);--shadow:0 2px 8px -1px rgba(0,0,0,.55);
    --shadow-lg:0 14px 32px -6px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.04);
    --shadow-xl:0 30px 70px -12px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.05);
    --glass:rgba(12,26,20,.92);
    --focus:0 0 0 2px var(--surface),0 0 0 4px color-mix(in srgb,var(--ci-em-hi) 70%,transparent);
  }
  body{font-size:13.5px;letter-spacing:0;font-feature-settings:"kern","liga"}
  h1,h2,h3,h4{letter-spacing:-.01em}
  h1{font-size:22px;line-height:30px;font-weight:600;letter-spacing:-.015em}
  ::selection{background:color-mix(in srgb,var(--ci-em) 26%,transparent)}
  /* every figure is set in Plex Mono, tabular */
  .fig,.tnum,.num,.ns-table td.num,.ns-stat .val,.kv b,.adj-grid b,.mini-table .num,.rp-val,.bc-val b,.dv-val,.split .v,.mx-cell input,.mx-cell .ro,.mx-cell span,.fx-table td:last-child,.gap-explain .big,.ns-heat .cell,.ns-countdown b,.ns-nav-badge,.ns-viz text,.ns-viztip .r span:last-child,.ldg .v,.ns-ring .c b,.ns-meter .row b,.ns-progress + .fig{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .ns-viz text{font-size:10.5px}

  /* ---------- SHELL: green-black chrome ---------- */
  .ns-gh{background:var(--ci-chrome);border-bottom:1px solid var(--ci-chrome-line);color:var(--ci-chrome-ink);gap:8px}
  .ns-gh-btn,.ns-gh .ns-icon-btn{color:var(--ci-chrome-ink-2);width:34px;height:34px;border-radius:var(--r-sm)}
  .ns-gh-btn:hover,.ns-gh-btn[aria-expanded="true"],.ns-gh .ns-icon-btn:hover,.ns-gh .ns-icon-btn[aria-expanded="true"]{background:rgba(255,255,255,.08);color:#fff}
  .ns-gh .ns-icon-btn .dot{border-color:var(--ci-chrome);background:#F97066}
  .ns-gh-logo{color:var(--ci-chrome-ink)!important;font-size:14px;font-weight:600;letter-spacing:-.01em}
  .ns-gh-logo:hover,.ns-gh-product:hover{background:rgba(255,255,255,.07)}
  .ns-np-mark{background:var(--ci-chrome-ink);color:var(--ci-chrome);border-radius:4px;width:22px;height:22px}
  .ns-gh-sep{background:rgba(255,255,255,.14);height:20px}
  .ns-gh-product{color:#fff!important;font-weight:600;font-size:13.5px}
  .ns-gh-product .ns-brand-mark{width:22px;height:22px;border-radius:4px}
  .ns-gh .ns-search-btn{height:32px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--ci-chrome-ink-2);border-radius:var(--r);font-size:13px}
  .ns-gh .ns-search-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18)}
  .ns-gh kbd{background:transparent;border-color:rgba(255,255,255,.2);color:var(--ci-chrome-ink-2);font-family:var(--font-mono)}
  .ns-gh .ns-create{background:var(--ci-em-hi);color:#03140C;border-radius:var(--r-sm);font-weight:600;box-shadow:none;height:28px}
  .ns-gh .ns-create:hover{background:#34D399}
  .ns-tenant{border-color:rgba(255,255,255,.14);color:var(--ci-chrome-ink-2);height:30px;border-radius:var(--r-sm)}
  .ns-tenant:hover{background:rgba(255,255,255,.07)}
  .ns-tenant small{background:rgba(245,181,71,.14);color:#F5C46A;font-family:var(--font-mono);letter-spacing:.06em}
  .ns-user-btn:hover{background:rgba(255,255,255,.08)}
  .ns-brand-mark{background:var(--ci-em);box-shadow:none;border-radius:5px;color:#fff}
  .ns-brand-mark svg{width:20px;height:20px}

  .ns-sidebar{background:var(--ci-chrome);border-right:1px solid var(--ci-chrome-line);color:var(--ci-chrome-ink)}
  .ns-brand{padding:14px 14px 12px}
  .ns-brand .ns-brand-mark{width:30px;height:30px}
  .ns-brand-name{color:#fff;font-size:14px;font-weight:600}
  .ns-brand-sub{color:var(--ci-chrome-ink-3);font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
  .ns-persona-chip{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.1);color:var(--ci-chrome-ink-2);border-radius:var(--r-sm)}
  .ns-persona-chip:hover{border-color:rgba(255,255,255,.22)}
  .ns-persona-chip .lbl{color:var(--ci-chrome-ink-3)}
  .ns-persona-chip b{color:#fff}
  .ns-persona-chip svg{color:var(--ci-chrome-ink-3)}
  .ns-nav-group{color:var(--ci-chrome-ink-3);font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;padding:18px 10px 6px}
  .ns-nav-item{height:32px;color:var(--ci-chrome-ink-2);font-size:13px;font-weight:450;border-radius:var(--r-sm)}
  .ns-nav-item svg{color:var(--ci-chrome-ink-3);width:16px;height:16px}
  .ns-nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
  .ns-nav-item:hover svg{color:var(--ci-chrome-ink)}
  .ns-nav-item[aria-current="page"]{background:rgba(16,185,129,.13);color:var(--ci-em-glow);font-weight:550}
  .ns-nav-item[aria-current="page"] svg{color:var(--ci-em-glow)}
  .ns-nav-item[aria-current="page"]::before{background:var(--ci-em-hi);border-radius:0 2px 2px 0}
  .ns-nav-badge{background:rgba(245,181,71,.16);color:#F5C46A;border-radius:3px;font-size:11px}
  .ns-nav-item[aria-current="page"] .ns-nav-badge{background:rgba(245,181,71,.2);color:#F5C46A}
  .ns-sidebar-foot{border-top-color:var(--ci-chrome-line)}
  .ns-side-link,.ns-collapse-btn{color:var(--ci-chrome-ink-2);font-size:12.5px}
  .ns-side-link:hover,.ns-collapse-btn:hover{background:rgba(255,255,255,.06);color:#fff}
  .ns-sidebar-promo{background:rgba(255,255,255,.035);border:1px solid var(--ci-chrome-line);border-radius:var(--r);gap:7px}
  .ns-sidebar-promo::before{content:"FY26 merit cycle";color:var(--ci-em-glow);font-family:var(--font-mono);font-weight:500;letter-spacing:.08em}
  .ns-sidebar-promo b{color:#fff}
  .ns-sidebar-promo p{color:var(--ci-chrome-ink-2);font-family:var(--font-mono);font-size:11.5px}
  .ns-sidebar-promo .ns-progress{background:rgba(255,255,255,.1)}
  .ns-sidebar-promo .ns-progress > i{background:var(--ci-em-hi)}
  .ns-sidebar-promo .ns-btn.secondary{background:transparent;border-color:rgba(255,255,255,.2);color:var(--ci-chrome-ink)}
  .ns-sidebar-promo .ns-btn.secondary:hover{background:rgba(255,255,255,.08)}
  @media (max-width:960px){.ns-sidebar{background:var(--ci-chrome)}.ns-gh{gap:0;padding:0 6px}.ns-gh-btn,.ns-gh .ns-icon-btn{width:32px}.ns-gh-logo{padding:6px 5px}.ns-gh-product{padding:6px 4px;gap:6px}.ns-gh .ns-search-btn{flex:0 0 32px;width:32px;border:0;background:transparent}.ns-gh .ns-create{margin-right:2px;width:30px}.ns-user-btn{padding:0 2px}}
  :root[data-theme="dark"] .ns-btn.primary{color:#03140C}
  :root[data-theme="dark"] .ns-btn.primary:hover{color:#03140C}

  .ns-topbar{background:color-mix(in srgb,var(--bg) 94%,transparent);border-bottom:1px solid var(--line-2);padding:0 28px}
  .ns-crumbs{font-size:12.5px}
  .ns-topbar-meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);letter-spacing:.02em}
  .ns-topbar-meta i{background:var(--ci-em);box-shadow:0 0 0 3px var(--np-soft)}
  .ns-content{padding:20px 28px 72px}
  @media (max-width:960px){.ns-topbar{padding:0 14px}.ns-content{padding:14px 14px 56px}}

  /* ---------- PAGE ---------- */
  .ns-page-head{padding:2px 0 16px;margin-bottom:16px;border-bottom:1px solid var(--line);align-items:flex-end}
  .ns-eyebrow{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-text);margin-bottom:6px}
  .ns-page-head p{font-size:13.5px;max-width:84ch}
  .ns-section-title{margin:28px 0 10px}

  /* ---------- COMPONENTS ---------- */
  .ns-card{border-radius:var(--r-lg);box-shadow:none;border-color:var(--line)}
  .ns-card-head{padding:12px 16px 11px;border-bottom:1px solid var(--line-2);align-items:center;gap:12px}
  .ns-card-head h3{font-size:13.5px;font-weight:600;letter-spacing:-.005em}
  .ns-card-head p{font-size:12px;margin-top:1px}
  .ns-card-body{padding:14px 16px 16px}
  .ns-card-foot{border-radius:0 0 var(--r-lg) var(--r-lg)}
  .ns-btn{height:30px;border-radius:var(--r-sm);font-weight:500;font-size:13px}
  .ns-btn.primary{box-shadow:none}
  .ns-btn.secondary{box-shadow:none}
  .ns-btn.sm{height:26px;font-size:12.5px}
  .ns-btn.xs{height:22px;border-radius:var(--r-xs);font-size:11.5px}
  .ns-badge{border-radius:var(--r-xs);height:19px;font-size:11px;padding:0 6px}
  .ns-badge.sq.tnum,.ns-badge.tnum{font-family:var(--font-mono);font-weight:500;letter-spacing:-.01em}
  .ns-badge.tone-lo{background:var(--neutral-bg);color:var(--neutral)}
  .ns-badge.tone-hi{background:var(--info-bg);color:var(--info)}
  .ns-badge.brand{background:var(--brand-soft);color:var(--brand-text)}
  .ns-chip{border-radius:var(--r-sm);height:28px;font-size:12.5px}
  .ns-input,.ns-select,.ns-textarea{border-radius:var(--r-sm);font-size:13px}
  .ns-palette-input input:focus,.ns-palette-input input:focus-visible{outline:none;box-shadow:none}
  .ns-palette-input:focus-within{border-bottom-color:var(--ci-em);box-shadow:inset 0 -1px 0 var(--ci-em)}
  .ns-input:focus,.ns-select:focus,.ns-textarea:focus{border-color:var(--ci-em);box-shadow:0 0 0 3px color-mix(in srgb,var(--ci-em) 20%,transparent)}
  .ns-range{background:linear-gradient(90deg,var(--ci-em) var(--p,50%),var(--surface-4) var(--p,50%))}
  .ns-range::-webkit-slider-thumb{border-color:var(--ci-em);border-radius:3px;width:12px;height:18px}
  .ns-range::-moz-range-thumb{border-color:var(--ci-em);border-radius:3px}
  .ns-switch input:checked + i{background:var(--ci-em)}
  .ns-seg{border-radius:var(--r);padding:2px}
  .ns-seg button{border-radius:var(--r-sm)}
  .ns-alert{border-radius:var(--r);border-left-width:3px}
  .ns-alert p{font-size:12.5px}
  .ns-progress{height:5px;border-radius:1px}
  .ns-progress > i{border-radius:1px;background:var(--ci-em)}
  .ns-icon-box{border-radius:var(--r)}
  .ns-icon-box.sm{border-radius:var(--r-sm)}
  .ns-tl-item.done .pt{background:var(--ci-em);border-color:var(--ci-em)}
  .ns-tl-item.now .pt{border-color:var(--ci-em);color:var(--ci-em)}
  .ns-avatar{font-family:var(--font-sans);font-weight:600}
  .pf-prop+.pf-prop{border-top:1px solid var(--line-2);padding-top:12px}
  .ns-avatar.h6{background:#B4481A}.ns-avatar.h9{background:#4E7612}
  .ns-person .nm{font-size:13px}
  .ns-dropdown,.ns-palette,.ns-modal{border-radius:var(--r-xl)}
  .ns-drawer-head{padding:16px 24px 14px}
  .ns-modal-foot{border-radius:0 0 var(--r-xl) var(--r-xl)}
  .ns-viztip{border-radius:var(--r);font-size:11.5px}
  .ns-heat .cell{border-radius:2px;font-weight:500;min-height:34px}
  .ns-heat .hc{font-family:var(--font-mono);font-weight:500;letter-spacing:.04em}
  .ns-legend,.legend-cats{font-size:11.5px}
  .ns-toast{border-radius:var(--r)}

  /* KPI ledger strip: one ruled row of figures instead of floating cards */
  .ns-stats{gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  .ns-stat{border:0;border-radius:0;box-shadow:none;padding:12px 16px 12px;gap:4px;background:var(--surface)}
  .ns-stat .lbl{font-size:10.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-family:var(--font-mono)}
  .ns-stat .ic{display:none}
  .ns-stat .val{font-size:22px;font-weight:500;letter-spacing:-.03em;line-height:1.15}
  .ns-stat .sub{font-size:11.5px}
  @media (max-width:720px){.ns-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.ns-stats > :last-child:nth-child(odd){grid-column:span 2}.ns-stat .val{font-size:19px}}

  /* Tables: hairline ledger */
  .ns-table{font-size:13px}
  .ns-table th{font-size:10.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;font-family:var(--font-mono);color:var(--ink-3);padding:8px 12px;background:var(--surface-2)}
  .ns-table td{padding:6px 12px;height:38px;border-bottom-color:var(--line-2)}
  .ns-table td.num,.ns-table th.num{text-align:right}
  .ns-table td.num{font-size:12.5px;color:var(--ink)}
  .ns-table.dense td{height:32px;padding:4px 10px}
  .ns-table tbody tr:hover td{background:color-mix(in srgb,var(--ci-em) 4%,var(--surface))}
  .ns-table th[aria-sort] .si{color:var(--ci-em)}
  .ns-table-foot{font-family:var(--font-mono);font-size:11.5px}
  .ns-pager button[aria-current="page"]{background:var(--np-soft);color:var(--np-text)}
  .ns-viz-toggle{font-family:var(--font-mono);font-size:11px}

  /* Analyst note (replaces the generic AI block) */
  .ns-ai{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ci-em);border-radius:var(--r)}
  .ns-ai-head{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-text)}
  .ns-ai-head .ns-badge{font-family:var(--font-mono);letter-spacing:.02em;text-transform:none}
  .ns-ai p{font-size:13px;line-height:1.6}

  /* ---------- SIGNATURE 1 · band-position whisker (tables) ---------- */
  .bp{display:grid;grid-template-columns:minmax(84px,1fr) 36px;gap:8px;align-items:center;min-width:128px}
  .bp-t{position:relative;height:14px}
  .bp-t::before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:repeating-linear-gradient(90deg,var(--line-strong) 0 2px,transparent 2px 4px)}
  .bp-t .rng{position:absolute;top:5px;height:4px;background:var(--surface-4);border-left:1.5px solid var(--ink-4);border-right:1.5px solid var(--ink-4)}
  .bp-t .z{position:absolute;top:5px;height:4px;background:color-mix(in srgb,var(--ci-em) 30%,transparent)}
  .bp-t .m{position:absolute;top:2px;height:10px;width:1.5px;background:var(--ink-3);transform:translateX(-50%)}
  .bp-t b{position:absolute;top:7px;width:9px;height:9px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px var(--surface);transform:translate(-50%,-50%)}
  .bp-t b.lo{background:var(--cb-under)}.bp-t b.hi{background:var(--cb-over)}.bp-t b.at{background:var(--ci-em)}
  .bp > span{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);text-align:right}
  .bp > span.lo{color:var(--bad)}.bp > span.hi{color:var(--warn)}

  /* ---------- SIGNATURE 1b · band-position bar (drawer / profile / modals) ---------- */
  .bb{display:grid;gap:4px;padding-top:30px;font-size:11.5px}
  .bb-row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center}
  .bb-row > span{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
  .bb-tr{position:relative;height:22px}
  .bb-tr::before{content:"";position:absolute;left:0;right:0;top:10px;height:2px;background:repeating-linear-gradient(90deg,var(--line-strong) 0 3px,transparent 3px 6px)}
  .bb-tr .band{position:absolute;top:5px;height:12px;background:var(--surface-3);border:1px solid var(--line-strong);border-left:2px solid var(--ink-3);border-right:2px solid var(--ink-3)}
  .bb-tr .zone{position:absolute;top:6px;height:10px;background:color-mix(in srgb,var(--ci-em) 28%,transparent)}
  .bb-tr .tick{position:absolute;top:1px;height:20px;width:2px;background:var(--ink);transform:translateX(-50%)}
  .bb-tr .peer{position:absolute;top:3px;height:16px;width:0;border-left:1.5px dashed var(--ink-3);transform:translateX(-50%)}
  .bb-tr .dot{position:absolute;top:11px;width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--ink);transform:translate(-50%,-50%);z-index:2;transition:left .18s var(--ease)}
  .bb-tr .dot.lo{background:var(--cb-under);box-shadow:0 0 0 1px var(--cb-under)}.bb-tr .dot.hi{background:var(--cb-over);box-shadow:0 0 0 1px var(--cb-over)}
  .bb-tr .dot.ghost{background:var(--surface);border:2px dashed var(--ci-em);box-shadow:none;z-index:3;width:18px;height:18px}
  .bb-tr .dot.ghost[hidden]{display:none}
  .bb-tr .lbl{position:absolute;bottom:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;font-family:var(--font-mono);font-size:11.5px;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:2px 7px;z-index:3}
  .bb-tr .lbl.ghost{border-color:var(--ci-em);color:var(--brand-text)}
  .bb-tr .mk{position:absolute;top:6px;height:10px;background:color-mix(in srgb,var(--viz-2) 22%,transparent);border-left:2px solid var(--viz-2);border-right:2px solid var(--viz-2)}
  .bb-tr .mk50{position:absolute;top:2px;height:18px;width:2px;background:var(--viz-2);transform:translateX(-50%)}
  .bb-sc{position:relative;height:30px;margin-left:76px}
  .bb-sc span{position:absolute;top:2px;transform:translateX(-50%);text-align:center;white-space:nowrap;font-size:10.5px;color:var(--ink-3);line-height:1.3;text-transform:uppercase;letter-spacing:.05em;font-family:var(--font-mono)}
  .bb-sc span b{display:block;color:var(--ink);font-size:12px;font-weight:500;text-transform:none;letter-spacing:-.01em}
  .bb-leg{display:flex;gap:14px;flex-wrap:wrap;margin:2px 0 0 76px;font-size:11.5px;color:var(--ink-3)}
  .bb-leg i{display:inline-block;width:12px;height:8px;margin-right:6px;vertical-align:0}
  @media (max-width:560px){.bb-row{grid-template-columns:minmax(0,1fr)}.bb-row > span{display:none}.bb-sc,.bb-leg{margin-left:0}}

  /* ---------- SIGNATURE 2 · merit budget tracker ---------- */
  .bt{display:grid;gap:12px}
  .bt-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .bt-top .big{font-family:var(--font-mono);font-size:26px;font-weight:500;letter-spacing:-.03em;line-height:1;color:var(--ink)}
  .bt-top .big small{font-size:13px;color:var(--ink-3);letter-spacing:0;margin-left:6px}
  .bt-top .of{font-size:12px;color:var(--ink-3);text-align:right}
  .bt-top .of b{font-family:var(--font-mono);font-weight:500;color:var(--ink)}
  .bt-bar{position:relative;height:22px;display:flex;background:repeating-linear-gradient(135deg,var(--surface-3) 0 5px,var(--surface-2) 5px 10px);border:1px solid var(--line);border-radius:2px;overflow:visible}
  .bt-bar > i{display:block;height:100%;min-width:0;border-right:1px solid var(--surface)}
  .bt-bar > i:last-of-type{border-right:0}
  .bt-bar .s-matrix{background:var(--ci-em)}
  .bt-bar .s-prop{background:var(--viz-seq-700)}
  .bt-bar .s-batch{background:var(--viz-3)}
  .bt-bar .s-over{background:repeating-linear-gradient(135deg,var(--viz-critical) 0 4px,color-mix(in srgb,var(--viz-critical) 70%,transparent) 4px 8px)}
  .bt-bar .cap{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);transform:translateX(-50%)}
  .bt-bar .cap::after{content:attr(data-l);position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-family:var(--font-mono);font-size:10px;color:var(--ink-3);white-space:nowrap;letter-spacing:.04em}
  .bt-scale{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-4);margin-top:-6px}
  .ldg{display:grid;font-size:12.5px}
  .ldg-r{display:grid;grid-template-columns:auto minmax(12px,1fr) auto;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-2)}
  .ldg-r:last-child{border-bottom:0}
  .ldg-r .k{color:var(--ink-2);display:flex;align-items:center;gap:8px;min-width:0}
  .ldg-r .k i{width:10px;height:10px;border-radius:1px;flex:none}
  .ldg-r .k small{color:var(--ink-4);font-size:11.5px}
  .ldg-r .lead{border-bottom:1px dotted var(--line-strong);transform:translateY(-3px)}
  .ldg-r .v{color:var(--ink);font-weight:500;text-align:right;white-space:nowrap}
  .ldg-r .v small{color:var(--ink-3);font-weight:400;margin-left:6px;font-size:11.5px}
  .ldg-r.total{border-top:1px solid var(--ink-3);border-bottom:3px double var(--ink-3);margin-top:2px;font-weight:600}
  .ldg-r.total .k{color:var(--ink);font-weight:600}
  .ldg-r.neg .v{color:var(--bad)}
  .ldg-r.sub .k{padding-left:18px;color:var(--ink-3)}

  /* ---------- SIGNATURE 3 · compa-ratio distribution ---------- */
  .ch{display:grid;gap:6px}
  .ch-plot{position:relative;height:var(--ch-h,200px);margin-top:16px}
  .ch-zone{position:absolute;top:0;bottom:0;pointer-events:none}
  .ch-zone.under{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--cb-under) 7%,transparent) 0 5px,transparent 5px 10px)}
  .ch-zone.over{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--cb-over) 9%,transparent) 0 5px,transparent 5px 10px)}
  .ch-zone.mid{background:color-mix(in srgb,var(--ci-em) 6%,transparent)}
  .ch-ref{position:absolute;top:-16px;bottom:0;width:0;border-left:1px dashed var(--ink-4);pointer-events:none}
  .ch-ref.mid{border-left:1.5px solid var(--ink-2)}
  .ch-ref span{position:absolute;top:0;left:4px;font-style:normal;font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;color:var(--ink-3);white-space:nowrap;text-transform:uppercase}
  .ch-ref.right span{left:auto;right:4px}
  .ch-grid{position:absolute;left:0;right:0;border-top:1px solid var(--viz-grid);pointer-events:none}
  .ch-cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:3px;align-items:end;border-bottom:1px solid var(--ink-3)}
  .ch-col{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;border-radius:0;cursor:pointer}
  .ch-col i{display:block;height:var(--h);min-height:1px;background:var(--c);transition:filter var(--dur),height .5s var(--ease-out)}
  .ch-col .n{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-2);text-align:center;margin-bottom:3px;white-space:nowrap}
  .ch-col:hover i,.ch-col:focus-visible i{filter:brightness(.88)}
  :root[data-theme="dark"] .ch-col:hover i{filter:brightness(1.2)}
  .ch-col:focus-visible{box-shadow:var(--focus);border-radius:2px}
  .ch-axis{position:relative;height:16px}
  .ch-axis span{position:absolute;transform:translateX(-50%);font-family:var(--font-mono);font-size:10px;color:var(--ink-3)}
  .ch-sum{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:8px}
  .ch-sum a{background:var(--surface);padding:8px 10px;color:inherit;text-decoration:none!important;display:grid;gap:2px;border-top:3px solid var(--c)}
  .ch-sum a:hover{background:var(--surface-2)}
  .ch-sum .k{font-size:11px;color:var(--ink-3)}
  .ch-sum .v{font-family:var(--font-mono);font-size:15px;font-weight:500;color:var(--ink)}
  .ch-sum .v small{font-size:11px;color:var(--ink-3);margin-left:4px}
  @media (max-width:720px){.ch-sum{grid-template-columns:repeat(2,minmax(0,1fr))}.ch-sum a:last-child{grid-column:span 2}.ch-col .n{font-size:9px}.ch-axis span:nth-child(even){display:none}.ch-ref span{display:none}}

  /* ---------- band ladder (pay structure) ---------- */
  .lad{display:grid;gap:0;font-size:12px}
  .lad-head,.lad-row{display:grid;grid-template-columns:118px minmax(0,1fr) 92px;gap:12px;align-items:center}
  .lad-head{height:22px;border-bottom:1px solid var(--line)}
  .lad-ax{position:relative;height:100%}
  .lad-ax span{position:absolute;bottom:4px;transform:translateX(-50%);font-family:var(--font-mono);font-size:10px;color:var(--ink-3)}
  .lad-row{min-height:34px;border-bottom:1px solid var(--line-2);cursor:pointer}
  .lad-row:hover{background:var(--surface-2)}
  .lad-row:focus-visible{box-shadow:var(--focus)}
  .lad-row.sep{border-top:1px solid var(--line-strong)}
  .lad-lbl b{font-family:var(--font-mono);font-weight:500;color:var(--ink)}
  .lad-lbl span{color:var(--ink-3);margin-left:6px}
  .lad-tr{position:relative;height:34px}
  .lad-tr .gl{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--viz-grid)}
  .lad-tr .band{position:absolute;top:11px;height:12px;background:var(--surface-3);border:1px solid var(--line-strong);border-left:2px solid var(--ink-3);border-right:2px solid var(--ink-3)}
  .lad-tr .zone{position:absolute;top:12px;height:10px;background:color-mix(in srgb,var(--ci-em) 26%,transparent)}
  .lad-tr .mid{position:absolute;top:8px;height:18px;width:2px;background:var(--ink);transform:translateX(-50%)}
  .lad-tr .pp{position:absolute;top:17px;width:6px;height:6px;border-radius:50%;background:var(--ci-em);opacity:.85;transform:translate(-50%,-50%);box-shadow:0 0 0 1px var(--surface)}
  .lad-tr .pp.lo{background:var(--cb-under)}.lad-tr .pp.hi{background:var(--cb-over)}
  .lad-v{text-align:right;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);line-height:1.3}
  .lad-v b{color:var(--ink);font-weight:500}
  @media (max-width:720px){.lad-head,.lad-row{grid-template-columns:64px minmax(0,1fr) 56px;gap:8px}.lad-lbl span{display:none}}

  /* blotter (needs attention) */
  .blot{display:grid}
  .blot-r{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line-2);color:inherit;text-decoration:none!important}
  .blot-r:last-child{border-bottom:0}
  .blot-r:hover{background:var(--surface-2)}
  .blot-r:hover .ttl{color:var(--np-text)}
  .blot-r .ttl{font-size:13px;font-weight:550;color:var(--ink)}
  .blot-r .sub{font-size:12px;color:var(--ink-3);margin-top:1px}
  .blot-r .amt{font-family:var(--font-mono);font-size:12.5px;color:var(--ink);text-align:right;white-space:nowrap}
  .tag{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;height:18px;padding:0 5px;border-radius:2px;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.06em;background:var(--neutral-bg);color:var(--neutral);border:1px solid var(--neutral-line)}
  .tag.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-line)}
  .tag.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
  .tag.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
  .tag.info{background:var(--info-bg);color:var(--info);border-color:var(--info-line)}
  @media (max-width:720px){.blot-r{grid-template-columns:44px minmax(0,1fr) auto;padding:9px 12px;row-gap:2px}.blot-r:has(.amt)>.tag{grid-row:1/span 2}.blot-r .amt{grid-column:2;grid-row:2;text-align:left;font-size:12px;color:var(--ink-2)}.blot-r>.ns-btn{grid-column:3;grid-row:1/span 2}}

  /* movement ticker rows (market) */
  .mv{display:grid;grid-template-columns:minmax(0,1fr) 64px 72px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:12.5px}
  .mv:last-child{border-bottom:0}
  .mv .f{color:var(--ink);font-weight:550}
  .mv .f small{display:block;color:var(--ink-3);font-weight:400;font-size:11.5px}
  .mv .d{font-family:var(--font-mono);text-align:right;font-weight:500}
  .mv .d.up{color:var(--ink);font-weight:600}
  .mv .g{font-family:var(--font-mono);text-align:right}
  .mv .bar{height:4px;background:var(--surface-3);position:relative;grid-column:1/-1;margin-top:-2px}
  .mv .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--viz-2)}
  .mv .bar i.hot{background:var(--ink-2)}

  /* ---------- carried-over pieces, restyled ---------- */
  .rp{display:grid;gap:0;font-size:12.5px}
  .rp-head,.rp-row{display:grid;grid-template-columns:minmax(96px,22%) 1fr 52px;gap:12px;align-items:center}
  .rp-axis{position:relative;height:30px}
  .rp-line{position:absolute;bottom:2px;transform:translateX(-50%);font-family:var(--font-mono);font-size:10px;color:var(--ink-3);white-space:nowrap;text-align:center;line-height:1.25;letter-spacing:.02em}
  .rp-line b{display:block;font-weight:500;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-size:9.5px}
  .rp-line.mid b{color:var(--brand-text)}
  .rp-tick{position:absolute;bottom:0;transform:translateX(-50%);font-size:10.5px;color:var(--ink-4)}
  .rp-row{padding:2px 0;border-bottom:1px solid var(--line-2);cursor:default}
  .rp-row:last-of-type{border-bottom:0}
  .rp-row:hover{background:var(--surface-2)}
  .rp-lbl b{display:block;font-size:12.5px;font-weight:550;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rp-lbl span{font-size:11px;color:var(--ink-3)}
  .rp-track{position:relative;height:28px}
  .rp-vline{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--line-strong)}
  .rp-vline.mid{border-left:1.5px solid var(--ink-3)}
  .rp-track svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .rp-track .wh{stroke:var(--ink-3);stroke-width:1.25}
  .rp-track .box{fill:var(--ci-em);fill-opacity:.22;stroke:var(--ci-em);stroke-width:1}
  .rp-track .med{fill:var(--ink);stroke:var(--surface);stroke-width:2}
  .rp-val{text-align:right;font-weight:500;color:var(--ink);font-size:12px}
  @media (max-width:720px){.rp-line b{display:none}.rp-head,.rp-row{grid-template-columns:minmax(70px,28%) 1fr 40px;gap:8px}}
  .bc{display:grid;gap:0;font-size:12.5px}
  .bc-row,.bc-head{display:grid;grid-template-columns:minmax(110px,22%) 1fr 128px;gap:12px;align-items:center}
  .bc-head{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-bottom:4px;border-bottom:1px solid var(--line)}
  .bc-row{padding:2px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
  .bc-row:hover{background:var(--surface-2)}
  .bc-row:focus-visible{box-shadow:var(--focus)}
  .bc-lbl b{display:block;font-size:12.5px;font-weight:550;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bc-lbl span{font-size:11px;color:var(--ink-3)}
  .bc-track{position:relative;height:46px}
  .bc-track svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .bc-track .band{fill:var(--surface-3);stroke:var(--line-strong)}
  .bc-track .zone{fill:var(--ci-em);fill-opacity:.2}
  .bc-track .bin{fill:var(--cb-below)}
  .bc-track .bin.at{fill:var(--ci-em)}
  .bc-track .bin.out{fill:var(--cb-under)}
  .bc-track .bin.outhi{fill:var(--cb-over)}
  .bc-track .midl{stroke:var(--ink);stroke-width:1.5}
  .bc-track .med{fill:var(--ink);stroke:var(--surface);stroke-width:2}
  .bc-axis{position:relative;height:16px}
  .bc-axis span{position:absolute;transform:translateX(-50%);font-size:10px;color:var(--ink-3);white-space:nowrap}
  .bc-val{text-align:right;font-size:11.5px;color:var(--ink-3);line-height:1.35}
  .bc-val b{color:var(--ink);font-weight:500}
  @media (max-width:720px){.bc-row,.bc-head{grid-template-columns:minmax(64px,26%) 1fr 70px;gap:8px}}
  .dv{display:grid;gap:0;font-size:12.5px}
  .dv-row,.dv-head{display:grid;grid-template-columns:minmax(110px,30%) 1fr 58px;gap:12px;align-items:center}
  .dv-head{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-bottom:6px;border-bottom:1px solid var(--line)}
  .dv-axis{display:flex;justify-content:space-between}
  .dv-row{padding:4px 0;border-bottom:1px solid var(--line-2);cursor:default}
  .dv-row:last-child{border-bottom:0}
  .dv-row:hover{background:var(--surface-2)}
  .dv-lbl b{display:block;color:var(--ink);font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dv-lbl span{font-size:11px;color:var(--ink-3)}
  .dv-track{position:relative;height:16px}
  .dv-track .zero{position:absolute;left:50%;top:-4px;bottom:-4px;width:1.5px;background:var(--ink-3)}
  .dv-track .tol{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ci-em) 9%,transparent)}
  .dv-track .bar{position:absolute;top:3px;height:10px}

  /* PAY STRUCTURE (BANDS) ------------------------------------------------ */
  const structureLevels = (dept) => LEVEL_ORDER.filter((l) => l !== 'E2' && (LVL[l].track !== 'E' || P.some((p) => p.dept === dept && p.level === l)));
  const bandChart = (dept, pool, spread) => {
    const rows = LEVEL_ORDER.map((code) => ({ code, ps: pool.filter((p) => p.level === code) })).filter((x) => x.ps.length >= 3);
    const lo = 0.6, hi = 1.4; const X = (v) => ((v - lo) / (hi - lo)) * 100; const bins = 16, bw = (hi - lo) / bins;
    return `<div class="bc"><div class="bc-head"><span>Level</span><span class="bc-axis">${[0.7, 0.8, 0.9, 1.0, 1.1, 1.2, 1.3].map((t) => `<span style="left:${X(t)}%">${t.toFixed(1)}×</span>`).join('')}</span><span class="right">People · median</span></div>${rows.map((r) => { const counts = new Array(bins).fill(0); r.ps.forEach((p) => counts[U.clamp(Math.floor((p.compa - lo) / bw), 0, bins - 1)]++); const mx = Math.max(...counts); const m = med(r.ps, 'compa'); const below = r.ps.filter((p) => p.compa < 1 - spread).length, above = r.ps.filter((p) => p.compa > 1 + spread).length; return `<div class="bc-row" data-code="${r.code}"><div class="bc-lbl"><b>${r.code} · ${NS.esc(LVL[r.code].short)}</b><span>${NS.esc(LVL[r.code].title)}</span></div><div class="bc-track"><svg aria-hidden="true"><rect class="band" x="${X(1 - spread).toFixed(2)}%" width="${(X(1 + spread) - X(1 - spread)).toFixed(2)}%" y="30" height="10" rx="3"/><rect class="zone" x="${X(0.95).toFixed(2)}%" width="${(X(1.05) - X(0.95)).toFixed(2)}%" y="30" height="10"/><line class="midl" x1="${X(1).toFixed(2)}%" x2="${X(1).toFixed(2)}%" y1="26" y2="44"/>${counts.map((n, i) => n ? `<rect class="bin ${lo + (i + 0.5) * bw < 1 - spread ? 'out' : lo + (i + 0.5) * bw > 1 + spread ? 'outhi' : Math.abs(lo + (i + 0.5) * bw - 1) <= 0.05 ? 'at' : ''}" x="${(X(lo + i * bw) + 0.15).toFixed(2)}%" width="${(X(lo + bw) - X(lo) - 0.3).toFixed(2)}%" y="${(26 - (n / mx) * 22).toFixed(1)}" height="${((n / mx) * 22).toFixed(1)}" rx="1.5"><title>${(lo + i * bw).toFixed(2)}–${(lo + (i + 1) * bw).toFixed(2)} × mid · ${n} people</title></rect>` : '').join('')}<circle class="med" cx="${X(m).toFixed(2)}%" cy="35" r="4.5"/></svg></div><div class="bc-val"><b>${r.ps.length}</b> · <b>${cr(m)}</b><br>${below ? `<span class="bad-text">${below} below</span>` : ''}${below && above ? ' · ' : ''}${above ? `<span class="warn-text">${above} above</span>` : ''}${!below && !above ? '<span class="ok-text">all in band</span>' : ''}</div></div>`; }).join('')}<div class="legend-cats" style="margin-top:8px"><span><i style="background:var(--surface-3);border:1px solid var(--line-strong)"></i>Band (min → max)</span><span><i style="background:var(--ci-em);opacity:.25"></i>±5% of midpoint</span><span><i style="background:var(--cb-below)"></i>People per 0.05</span><span><i style="background:var(--ci-em)"></i>At midpoint</span><span><i style="background:var(--cb-under)"></i>Below min</span><span><i style="background:var(--cb-over)"></i>Above max</span><span><i style="background:var(--ink);border-radius:50%"></i>Median</span></div></div>`;
  };
  const niceStep = (span, n) => { const raw = span / n, mag = 10 ** Math.floor(Math.log10(raw)), r = raw / mag; return (r >= 5 ? 10 : r >= 2.5 ? 5 : r >= 2 ? 2.5 : r >= 1 ? 2 : 1) * mag; };

  const mainNav = (persona) => [{ group: 'Compensation', items: [{ id: 'home', label: 'Overview', icon: 'home' }, { id: 'people', label: 'People explorer', icon: 'users' }, { id: 'bands', label: 'Pay structure', icon: 'layers' }, { id: 'equity', label: 'Pay equity', icon: 'scale' }, { id: 'market', label: 'Market intelligence', icon: 'globe' }] }, { group: 'Planning', items: [{ id: 'cycle', label: 'Merit cycle', icon: 'calculator', badge: pendingCount() || '' }, { id: 'insights', label: 'CompGPT', icon: 'sparkles' }] }, ...(persona.id === 'rewards' ? [{ group: 'Administration', items: [{ id: 'settings', label: 'Settings', icon: 'settings' }] }] : [])];
  const openNewAdjustment = () => {
    const persona = NS.persona; const pool = scopeOf(persona);
    NS.modal({ title: 'Propose a pay adjustment', sub: persona.id === 'manager' ? 'Choose one of your direct reports' : `Choose anyone in ${scopeLabel(persona)}`, size: 'lg',
      body: `<div class="grid gap-4"><label class="ns-field"><span class="ns-label">Employee</span><div class="ns-input-wrap">${ic('search')}<input class="ns-input" id="naQ" list="naList" placeholder="Type a name…" autocomplete="off"></div><span class="ns-help">${F.int(pool.length)} people in scope. The band, compa-ratio and market position update as you model the change.</span></label><datalist id="naList">${pool.slice(0, 1200).map((p) => `<option value="${NS.esc(p.name)}">${NS.esc(p.title)} · ${NS.esc(p.city)}</option>`).join('')}</datalist><div id="naOut"></div></div>`,
      mounted: (body, api) => { const inp = body.querySelector('#naQ'), out = body.querySelector('#naOut'); const pick = () => { const p = pool.find((x) => x.name.toLowerCase() === inp.value.trim().toLowerCase()); if (!p) { out.innerHTML = inp.value.trim().length > 2 ? `<div class="sm muted">Pick a name from the list.</div>` : ''; return; } out.innerHTML = `<div class="grid gap-4"><div class="flex items-center justify-between gap-2 wrap">${personLink(p, `${D.levelLabel(p.level)} · ${p.team} · ${p.city}`)}<div class="lozenges">${compaBadge(p.compa)}${riskBadge(p)}</div></div>${bandBar(p)}${adjustForm(p)}</div>`; bindAdjust(out, p, persona.name, () => { api.close(); NS.refresh(); }); }; inp.oninput = pick; inp.onchange = pick; setTimeout(() => inp.focus(), 50); } });
  };
  // ?as=<persona> deep-links a persona (handy for review links); the switcher still owns the choice afterwards
  try { const as = new URLSearchParams(location.search).get('as'); if (as && personas.some((x) => x.id === as)) store.set('persona', as); } catch (e) { /* ignore */ }
  // Product mark: the band-position bar itself — min and max caps, the midpoint, and a person's dot
  const MARK = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8v8M20 8v8M4 12h16"/><path d="M12 9v6" stroke-width="1.5" opacity=".7"/><circle cx="9" cy="12" r="2.6" fill="currentColor" stroke="none"/></svg>';
  NS.app({
    id: 'compintel-pro', name: 'CompIntel Pro', sub: 'Northstar Labs', brand: 'emerald', version: '5.0', category: 'Compensation',
    create: { label: 'Propose a pay adjustment', createLabel: 'New adjustment', run: () => openNewAdjustment() },
    mark: MARK, syncedLabel: `payroll 24 Sep 06:00 · benchmark ${C.MARKET_META.asOf}`,
    about: { tagline: 'Pay decisions with the evidence attached.', description: 'A compensation intelligence workspace built around the questions a rewards team actually gets asked: who sits where in their band, how the structure compares with the market, whether pay is equitable once level and location are taken into account, and what the merit cycle costs before it is locked. Every number is computed from the shared Northstar organisation — compa-ratios from salary and band midpoint, flight risk from explainable drivers, gaps from like-for-like medians.', highlights: [{ icon: 'banknote', title: 'Computed compa & bands', body: 'Band position, compa band and the critical-priority rule follow one policy set in Settings.' }, { icon: 'scale', title: 'Unadjusted vs adjusted equity', body: 'Both gaps side by side, with the composition effect explained in plain words and a remediation calculator.' }, { icon: 'globe', title: 'Market by role family', body: 'Seven families × four experience bands, tier-scaled, with urgent / watch / parity thresholds.' }, { icon: 'calculator', title: 'Live merit matrix', body: 'Editable rating × compa matrix, scenario floors and caps, proposals from any profile, and a lock.' }] },
    personas, defaultPersona: 'rewards',
    nav: (persona) => (persona.id === 'manager' ? [{ group: 'My team', items: [{ id: 'team', label: 'My team', icon: 'users', badge: proposalsFor(D.reports(persona.personId)).filter((x) => x.status === 'proposed').length || '' }, { id: 'about', label: 'About CompIntel', icon: 'info' }] }] : mainNav(persona)),
    promo: (persona) => { if (persona.id === 'manager') { const n = proposalsFor(D.reports(persona.personId)).filter((x) => x.status === 'proposed').length; return { title: 'Proposals', body: n ? `${n} proposal${n === 1 ? '' : 's'} waiting for Total Rewards · lock ${F.date(S.settings.lockDate, 'short')}` : `No open proposals · lock ${F.date(S.settings.lockDate, 'short')}`, action: { label: 'Open my team', route: '/team' } }; } const al = allocation(scopeOf(persona)); return { title: S.locked ? 'Cycle locked' : 'Merit budget', body: `${F.pct(al.used * 100, 0)} of the ${mk(al.budget)} pool allocated${S.locked ? '' : ` · lock ${F.date(S.settings.lockDate, 'short')}`}`, progress: Math.min(100, al.used * 100), action: { label: 'Open merit cycle', route: '/cycle' } }; },
    notifications: [{ icon: 'layers', title: 'Band review due · Data/ML', body: 'Structure proposal for Data/ML P2–P4 midpoints (+6%) is waiting for review before the increments window.', time: 'Today', route: '/bands' }, { icon: 'trending-up', title: 'Hot-role alert · Security +7%', body: 'Security P50 moved 7% in twelve months; internal midpoints now sit 7–9% under market at 2–8 years.', time: 'Yesterday', route: '/market' }, { icon: 'check-circle', title: 'Proposal approved', body: 'Kavya Nair · +5.0% retention adjustment approved by Yuki Nakamura.', time: '4 days ago', route: '/cycle' }, { icon: 'scale', title: 'Equity review reminder', body: 'Engineering women are paid 5.0% less than men like-for-like, outside the 2% tolerance — build a remediation batch before the lock.', time: '5 days ago', route: '/equity' }],
    routes: R, default: '/home',
    commands: (persona) => (persona.id === 'manager' ? [{ label: 'Export team compensation (CSV)', icon: 'download', group: 'Actions', run: () => NS.go('/team') }] : [{ label: 'Ask CompGPT', icon: 'sparkles', group: 'Actions', run: () => NS.go('/insights') }, { label: 'Export people (CSV)', icon: 'download', group: 'Actions', run: () => NS.go('/people') }, { label: 'Refresh market benchmark', icon: 'refresh', group: 'Actions', run: () => NS.go('/market') }, { label: 'Propose a band update', icon: 'pencil', group: 'Actions', run: () => NS.go('/bands') }, { label: 'Show critical priorities', icon: 'flame', group: 'Actions', run: () => NS.go('/people', { crit: '1' }) }, ...(persona.id === 'rewards' ? [{ label: 'Lock merit proposals', icon: 'lock', group: 'Actions', run: () => NS.go('/cycle') }] : [])]),
    search: (q) => (q.length < 2 ? [] : scopeOf(NS.persona).filter((p) => p.name.toLowerCase().includes(q.toLowerCase())).slice(0, 6).map((p) => ({ group: 'People', label: p.name, hint: `${p.title} · compa ${cr(p.compa)}`, avatar: NS.avatar(p, { size: 'xs' }), run: () => NS.go('/people/' + p.id) }))),
    onReset: () => store.clear(),
  });
})();
</script>
</body>

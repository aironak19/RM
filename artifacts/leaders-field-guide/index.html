<!doctype html>
<html lang="en" data-brand="amber">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Leader’s Field Guide · Northstar Labs</title>
<meta name="description" content="The Leader’s Field Guide — the operating manual for Northstar Labs managers: a quarterly playbook, a 1:1 runner, conversation scripts, culture KPIs and the Crucible leadership test. Concept prototype with illustrative data.">
<meta name="theme-color" content="#D97706">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='13' fill='%23D97706'/%3E%3Ccircle cx='24' cy='24' r='13' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Cpath d='M30 18l-4 8-8 4 4-8z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/ns.css">
<script src="../shared/ns.js"></script>
<script src="../shared/ns-data.js"></script>
<style>
  /* ---------- shared bits ---------- */
  .ns-brand-name{font-size:13.5px;letter-spacing:-.02em}
  .ns-overlay.center{text-align:start} /* shared runtime: the .center utility (text-align) leaks into modals */
  .ns-grid.main-side,.ns-grid.side-main{align-items:start}
  .lfg-side{position:sticky;top:calc(var(--topbar-h) + 20px);display:grid;gap:16px}
  @media (max-width:1200px){.lfg-side{position:static}}
  .qcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  @media (max-width:1100px){.qcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:520px){.qcards{grid-template-columns:minmax(0,1fr)}}
  .qcard{display:grid;gap:8px;padding:16px 16px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:inherit;position:relative;transition:transform var(--dur),box-shadow var(--dur),border-color var(--dur);min-width:0}
  .qcard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--brand-line)}
  .qcard .q{font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:-.03em;color:var(--brand-text);line-height:1}
  .qcard .nm{font-weight:700;font-size:15px;color:var(--ink)}
  .qcard p{font-size:12.5px;color:var(--ink-3);line-height:1.45;margin:0}
  .qcard.now{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .qcard .tag{position:absolute;top:12px;right:12px}
  .qcard .done{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ok);font-weight:600}
  .qcard .done svg{width:12px;height:12px}
  .week-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-2)}
  .week-item:last-child{border-bottom:0}
  .week-item .t{font-weight:600;font-size:13.5px;color:var(--ink)}
  .week-item .s{font-size:12px;color:var(--ink-3);margin-top:1px}
  .week-item .act{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .tool-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
  .tool{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:inherit;transition:background var(--dur),border-color var(--dur);min-width:0}
  .tool:hover{background:var(--surface-2);border-color:var(--brand-line)}
  .tool b{font-size:13px;display:block;color:var(--ink)}
  .tool span{font-size:11.5px;color:var(--ink-3)}
  .tool .ns-icon-box{width:32px;height:32px;border-radius:9px}.tool .ns-icon-box svg{width:15px;height:15px}
  .quote-week{font-family:var(--font-display);font-size:19px;line-height:1.4;letter-spacing:-.01em;color:var(--ink);font-weight:700}
  .quote-week::before{content:"“";color:var(--brand);font-size:38px;line-height:0;vertical-align:-14px;margin-right:2px}
  .read-list{display:grid;gap:6px}
  .read-list a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;font-size:13px;color:var(--ink-2);text-decoration:none}
  .read-list a:hover{background:var(--surface-2)}
  .read-list .st{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;flex:none;color:var(--ink-4);font-size:10px}
  .read-list .st.done{background:var(--ok);border-color:var(--ok);color:#fff}
  .read-list .st svg{width:11px;height:11px}
  .kpi-mini{display:grid;gap:8px}
  .kpi-mini .row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;font-size:13px}
  .kpi-mini .row b{font-variant-numeric:tabular-nums}

  /* ---------- playbook (long-form) ---------- */
  .pb{display:grid;grid-template-columns:224px minmax(0,1fr);gap:44px;align-items:start;max-width:1080px;margin:0 auto}
  .prose .qcards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prose .qcard p{font-size:13px;margin:0;line-height:1.45}
  .pb-toc{position:sticky;top:calc(var(--topbar-h) + 20px);display:grid;gap:2px}
  .pb-toc .h{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);padding:0 12px 8px}
  .pb-toc a{display:block;padding:7px 12px;border-left:2px solid var(--line);font-size:13px;color:var(--ink-3);text-decoration:none;line-height:1.35;transition:color var(--dur),border-color var(--dur)}
  .pb-toc a:hover{color:var(--ink)}
  .pb-toc a[aria-current="true"]{border-color:var(--brand);color:var(--brand-text);font-weight:600}
  .pb-toc .toc-foot{margin-top:14px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;gap:8px}
  .pb-body{max-width:72ch;min-width:0}
  .pb-head{padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .pb-head h1{font-family:var(--font-display);font-size:36px;letter-spacing:-.03em;line-height:1.1;margin:8px 0 12px;color:var(--ink)}
  .pb-head .lede{font-size:17px;line-height:1.6;color:var(--ink-2);max-width:60ch}
  .pb-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px;font-size:12.5px;color:var(--ink-3)}
  .pb-phil{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin:26px 0 0;padding:18px 20px;border-radius:16px;background:linear-gradient(135deg,var(--brand-soft),var(--surface));border:1px solid var(--brand-line)}
  .pb-phil .k{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-text)}
  .pb-phil .v{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.3;color:var(--ink)}
  .prose h2{font-family:var(--font-display);font-size:25px;letter-spacing:-.02em;line-height:1.2;margin:46px 0 12px;color:var(--ink);scroll-margin-top:calc(var(--topbar-h) + 20px)}
  .prose h2 .num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--brand-soft);color:var(--brand-text);font-size:13px;font-weight:800;vertical-align:6px;margin-right:10px;letter-spacing:0}
  .prose h3{font-size:16.5px;font-weight:700;margin:28px 0 10px;color:var(--ink)}
  .prose h3 .sub{font-weight:500;color:var(--ink-3);font-size:14px}
  .prose p{font-size:15.5px;line-height:1.72;color:var(--ink-2);margin:0 0 14px}
  .prose p.small{font-size:13.5px;color:var(--ink-3)}
  .prose > *:last-child{margin-bottom:0}
  .pullq{margin:26px 0;padding:6px 0 6px 22px;border-left:3px solid var(--brand);font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.4;color:var(--ink)}
  .pullq small{display:block;font-family:var(--font-sans);font-weight:500;font-size:12.5px;color:var(--ink-3);letter-spacing:0;margin-top:8px}
  .steps{display:grid;margin:8px 0 22px}
  .step{display:grid;grid-template-columns:40px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line-2)}
  .step:last-child{border-bottom:0}
  .step .n{width:36px;height:36px;border-radius:50%;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:14px}
  .step .n.ic svg{width:16px;height:16px}
  .step b{display:block;font-size:15px;color:var(--ink);line-height:1.35}
  .step b .when{font-weight:500;color:var(--ink-3);font-size:13px;margin-left:6px}
  .step p{font-size:14.5px;margin:4px 0 0;line-height:1.6}
  .std-table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:10px 0 22px;background:var(--surface)}
  .std-table th{background:var(--surface-2);text-transform:uppercase;font-size:11.5px;letter-spacing:.08em;color:var(--ink-3);padding:11px 14px;text-align:left;font-weight:700}
  .std-table td{padding:12px 14px;border-top:1px solid var(--line-2);vertical-align:top;line-height:1.55;color:var(--ink-2)}
  .std-table td:first-child{font-weight:600;color:var(--ink);white-space:nowrap}
  .std-table td.leak{color:var(--bad)}.std-table td.fixed{color:var(--ok);font-weight:600}
  .lit{display:grid;gap:8px;margin:10px 0 22px}
  .lit label{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14.5px;color:var(--ink-2);cursor:pointer;transition:background var(--dur)}
  .lit label:hover{background:var(--surface-2)}
  .lit label.on{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ink)}
  .traps{display:grid;gap:10px;margin:10px 0 22px}
  .trap{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px 16px;border-radius:14px;background:var(--bad-bg);border:1px solid var(--bad-line)}
  .trap .ns-icon-box{width:32px;height:32px;border-radius:9px;background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
  .trap .ns-icon-box svg{width:15px;height:15px}
  .trap b{display:block;color:var(--bad);font-size:14.5px}
  .trap p{margin:2px 0 0;font-size:14px;color:var(--ink-2);line-height:1.55}
  .script{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 18px}
  @media (max-width:640px){.script{grid-template-columns:minmax(0,1fr)}}
  .script > div{padding:16px 18px;border-radius:14px;position:relative;min-width:0}
  .script .dont{background:var(--bad-bg);border:1px solid var(--bad-line)}
  .script .say{background:var(--ok-bg);border:1px solid var(--ok-line)}
  .script .lbl{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
  .script .lbl svg{width:13px;height:13px}
  .script .dont .lbl{color:var(--bad)}.script .say .lbl{color:var(--ok)}
  .script q{display:block;font-size:14.5px;line-height:1.6;color:var(--ink);font-style:italic;quotes:"“" "”"}
  .script .cp{position:absolute;top:10px;right:10px}
  .email{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);margin:10px 0 22px;box-shadow:var(--shadow-xs)}
  .email-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-3);flex-wrap:wrap}
  .email-head b{color:var(--ink);font-weight:600}
  .email-body{padding:18px 20px;font-size:14.5px;line-height:1.7;color:var(--ink-2)}
  .email-body p{margin:0 0 12px;font-size:14.5px}.email-body p:last-child{margin:0}
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 22px}
  @media (max-width:640px){.compare{grid-template-columns:minmax(0,1fr)}}
  .compare > div{border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:16px 18px;border-top-width:3px}
  .compare .bad{border-top-color:var(--bad)}.compare .good{border-top-color:var(--ok)}
  .compare b{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);margin-bottom:10px}
  .compare .bad b{color:var(--bad)}.compare .good b{color:var(--ok)}
  .compare ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
  .compare li{display:flex;gap:8px;font-size:14px;color:var(--ink-2);line-height:1.5}
  .compare li svg{width:14px;height:14px;flex:none;margin-top:3px}
  .compare .bad li svg{color:var(--bad)}.compare .good li svg{color:var(--ok)}
  .ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end;margin:10px 0 22px}
  @media (max-width:640px){.ladder{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .rung{padding:16px 14px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-width:0;display:grid;gap:4px;align-content:start}
  .rung.l1{padding-top:16px}.rung.l2{padding-top:30px}.rung.l3{padding-top:44px}.rung.l4{padding-top:58px}
  @media (max-width:640px){.rung{padding-top:16px!important}}
  .rung .lv{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--brand-text)}
  .rung .nm{font-family:var(--font-display);font-size:18px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
  .rung p{font-size:13px;color:var(--ink-3);margin:0;line-height:1.45}
  .rung .map{font-size:11.5px;color:var(--ink-4);margin-top:6px}
  .lv-actions{display:grid;gap:8px;margin:10px 0 22px}
  .lv-action{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
  @media (max-width:520px){.lv-action{grid-template-columns:minmax(0,1fr)}}
  .lv-action .lv{font-family:var(--font-display);font-weight:800;font-size:13px;letter-spacing:.06em;color:var(--brand-text)}
  .lv-action .lv small{display:block;font-family:var(--font-sans);font-weight:500;letter-spacing:0;color:var(--ink-3);font-size:11.5px}
  .lv-action p{margin:0;font-size:14px;color:var(--ink-2)}
  .blueprint{display:grid;gap:10px;margin:10px 0 22px}
  .bp-block{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
  .bp-block .tm{font-family:var(--font-display);font-weight:800;font-size:15px;color:var(--brand-text);line-height:1.1}
  .bp-block .tm small{display:block;font-family:var(--font-sans);font-weight:500;font-size:11px;color:var(--ink-4);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
  .bp-block b{display:block;font-size:15px;color:var(--ink)}
  .bp-block .core{font-size:14.5px;color:var(--ink-2);font-style:italic;margin-top:4px;line-height:1.55}
  .bp-block .alts{margin-top:8px;display:grid;gap:4px}
  .bp-block .alts span{font-size:13px;color:var(--ink-3);padding-left:14px;position:relative}
  .bp-block .alts span::before{content:"→";position:absolute;left:0;color:var(--brand)}
  .guard{display:grid;gap:8px;margin:10px 0 22px}
  .guard div{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14.5px;color:var(--ink);font-weight:500}
  .guard svg{width:18px;height:18px;color:var(--bad);flex:none}
  .starters{display:grid;gap:6px;margin:10px 0 22px}
  .starters div{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:12px;background:var(--brand-soft);font-size:14.5px;color:var(--ink);font-style:italic;line-height:1.5}
  .starters svg{width:16px;height:16px;color:var(--brand-text);flex:none;margin-top:3px}
  .rhythm{display:grid;gap:8px;margin:10px 0 22px}
  .rhythm > div{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
  .rhythm .day{font-family:var(--font-display);font-weight:800;font-size:12px;letter-spacing:.1em;color:var(--on-brand);background:var(--brand);border-radius:8px;padding:6px 0;text-align:center}
  .rhythm b{font-size:14.5px;color:var(--ink)}.rhythm b small{font-weight:500;color:var(--ink-3);margin-left:6px;font-size:12.5px}
  .rhythm p{margin:3px 0 0;font-size:14px}
  .board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0 22px}
  @media (max-width:640px){.board{grid-template-columns:minmax(0,1fr)}}
  .board > div{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;gap:8px;align-content:start;min-width:0}
  .board .k{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4)}
  .board .v{font-family:var(--font-display);font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
  .board .v.ok{color:var(--ok)}.board .v.warn{color:var(--warn)}
  .vision{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0 22px}
  @media (max-width:640px){.vision{grid-template-columns:minmax(0,1fr)}}
  .vision > div{padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;gap:6px;align-content:start;position:relative;overflow:hidden}
  .vision > div::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand)}
  .vision .k{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-text)}
  .vision b{font-family:var(--font-display);font-size:16px;color:var(--ink)}
  .vision p{margin:0;font-size:13.5px;line-height:1.5}
  .nb{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:6px;margin:10px 0 10px}
  .nb .ax{display:grid;place-items:center;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);padding:4px}
  .nb .ax.y{writing-mode:vertical-rl;transform:rotate(180deg)}
  .nb button{min-height:78px;border-radius:12px;border:1px dashed var(--line-strong);background:var(--surface-2);padding:10px;font-weight:600;font-size:13px;color:var(--ink-2);text-align:left;display:grid;align-content:end;gap:4px;transition:all var(--dur);min-width:0}
  .nb button small{font-size:10.5px;font-weight:600;color:var(--ink-4);letter-spacing:.06em;text-transform:uppercase}
  .nb button:hover{border-color:var(--brand);color:var(--ink)}
  .nb button.on{background:var(--brand);border-color:var(--brand);border-style:solid;color:var(--on-brand);box-shadow:0 8px 20px -10px var(--brand)}
  .nb button.on small{color:var(--on-brand);opacity:.8}
  .nb-note{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--brand-soft);border:1px solid var(--brand-line);font-size:14px;color:var(--ink-2);margin:0 0 22px}
  .nb-note b{color:var(--brand-text)}
  .pb-foot{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
  @media (max-width:520px){.pb-foot{grid-template-columns:minmax(0,1fr)}}
  .pb-foot a{display:grid;gap:4px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:inherit;transition:border-color var(--dur),background var(--dur)}
  .pb-foot a:hover{border-color:var(--brand-line);background:var(--surface-2)}
  .pb-foot a.next{text-align:right}
  .pb-foot small{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4)}
  .pb-foot b{font-size:15px;color:var(--ink)}
  .pb-done{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:34px;padding:16px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
  .pb-done.on{background:var(--ok-bg);border-color:var(--ok-line)}

  const board = () => `<div class="board"><div style="grid-column:1/-1;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end"><div><div class="k">Project Alpha · sprint 6 of 8</div><div class="v">75%</div></div><span class="xs faint">Start → Launch</span><div style="grid-column:1/-1">${NS.progress(75)}</div></div><div><div class="k">Morale</div><div class="v ok">High</div><span class="xs faint">Friday pulse · 8.6 / 10</span></div><div><div class="k">Bugs</div><div class="v ok">Low <small class="sm muted">(3)</small></div><span class="xs faint">All P3 or lower</span></div><div><div class="k">Blockers</div><div class="v warn">Needs action <small class="sm muted">(1)</small></div><span class="xs faint">Vendor API key · owner: you</span></div></div>`;
  const vision = (items) => `<div class="vision">${items.map(([k, t, b]) => `<div><div class="k">${k}</div><b>${t}</b><p>${b}</p></div>`).join('')}</div>`;

  const quote = (b) => `<div class="pullq">${b.text}${b.by ? `<small>— ${b.by}</small>` : ''}</div>`;
  const renderBlock = (b, c) => {

      case 'traps': return traps(b.items);

      case 'board': return board();
      case 'vision': return vision(b.items);

  };
  const resolveCopy = (key) => { const [kind, id] = key.split(':'); if (kind === 'email') { const e = emailById(id); return [`Subject: ${e.subject}\n\n${plain(e.body)}`, `Email · ${e.subject}`]; } const s = SCRIPTS.find((x) => x.id === id); if (kind === 'say') return [s.say, 'Script · say this']; if (kind === 'after') return [s.after.text, `Script · ${s.after.name}`]; return ['', '']; };
  const bindCopy = (root) => root.querySelectorAll('[data-copy]').forEach((b) => b.onclick = () => { const [text, what] = resolveCopy(b.dataset.copy); copyText(text, what); });

  const renderChapter = (ch, c) => {
    const pr = progressOf(c.persona); const read = !!pr.read[ch.id]; const idx = CH.indexOf(ch); const prev = CH[idx - 1], next = CH[idx + 1]; const st = readingStats(c.persona);
    return html`<div class="pb">
      <aside class="pb-toc" id="toc"><div class="h">In this chapter</div>${ch.sections.map((s, i) => `<a href="${NS.link('/playbook/' + ch.id)}" data-sec="${s.id}" aria-current="${i === 0}">${s.title}</a>`).join('')}<div class="toc-foot"><div class="flex justify-between xs muted"><span>Playbook</span><b class="ink">${st.read}/${st.chapters} read</b></div>${NS.progress(Math.round(U.pctOf(st.read, st.chapters)), { cls: 'xs' })}<button class="ns-btn xs ${read ? 'soft' : 'primary'} block" data-mark>${read ? ic('check') + 'Read · mark unread' : ic('check') + 'Mark chapter read'}</button></div></aside>

          <div class="pb-phil"><div><div class="k">${ch.phil[0]}</div><div class="v">${ch.phil[1]}</div></div>${ch.goal ? `<div class="right"><div class="k">${ch.goal[0]}</div><div class="v" style="font-size:16px">${ch.goal[1]}</div></div>` : ''}</div>
        </header>
        <div class="prose">${ch.sections.map((s, i) => `<h2 id="sec-${s.id}" data-sec-h="${s.id}"><span class="num">${ch.num}.${i + 1}</span>${s.title}</h2>${s.blocks.map((b) => renderBlock(b, c)).join('')}`).join('')}</div>
        <div class="pb-done ${read ? 'on' : ''}"><div class="flex gap-3 items-center"><span class="ns-icon-box ${read ? 'ok' : ''}">${ic(read ? 'check-circle' : 'book-open')}</span><div><b class="md">${read ? 'You marked this chapter as read' : 'Finished the chapter?'}</b><div class="sm muted">${read ? 'It counts toward your progress ring on Home.' : 'Marking it read updates your progress and the People team’s adoption view.'}</div></div></div><div class="flex gap-2 wrap"><button class="ns-btn ${read ? 'secondary' : 'primary'}" data-mark>${read ? 'Mark as unread' : ic('check') + 'Mark chapter read'}</button>${next ? `<a class="ns-btn secondary" href="${NS.link('/playbook/' + next.id)}">Next · ${next.label} ${ic('arrow-right')}</a>` : `<a class="ns-btn secondary" href="${NS.link('/crucible')}">Take the Crucible ${ic('arrow-right')}</a>`}</div></div>
        <div class="pb-foot">${prev ? `<a href="${NS.link('/playbook/' + prev.id)}"><small>${ic('arrow-left', { size: 11 })} Previous</small><b>${prev.label}</b><span class="sm muted">${prev.title}</span></a>` : `<a href="${NS.link('/home')}"><small>${ic('arrow-left', { size: 11 })} Back</small><b>Home</b><span class="sm muted">Your week as a leader</span></a>`}${next ? `<a class="next" href="${NS.link('/playbook/' + next.id)}"><small>Next ${ic('arrow-right', { size: 11 })}</small><b>${next.label}</b><span class="sm muted">${next.title}</span></a>` : `<a class="next" href="${NS.link('/crucible')}"><small>Next ${ic('arrow-right', { size: 11 })}</small><b>The Crucible</b><span class="sm muted">Find your leadership archetype</span></a>`}</div>

      on('[data-view]', () => { QUIZ.phase = 'result'; NS.refresh(); });
      on('[data-quit]', () => { QUIZ.phase = 'intro'; NS.refresh(); });
      root.querySelectorAll('[data-opt]').forEach((b) => b.onclick = () => { QUIZ.answers[QUIZ.i] = +b.dataset.opt; root.querySelectorAll('[data-opt]').forEach((x) => x.setAttribute('aria-pressed', x === b)); const nx = root.querySelector('[data-next]'); nx.disabled = false; const hint = root.querySelector('#cruHint'); if (hint) hint.textContent = 'You can change your answer before moving on.'; root.querySelector('.ns-progress i').style.width = `${((QUIZ.i + 1) / DILEMMAS.length) * 100}%`; });
      on('[data-back]', () => { if (QUIZ.i > 0) { QUIZ.i--; NS.refresh(); } });
      on('[data-next]', () => { if (QUIZ.answers[QUIZ.i] == null) return; if (QUIZ.i < DILEMMAS.length - 1) { QUIZ.i++; NS.refresh(); window.scrollTo({ top: 0 }); return; } QUIZ.phase = 'loading'; NS.refresh(); setTimeout(() => { const r = scoreAnswers(QUIZ.answers); S.crucible = { answers: QUIZ.answers.slice(), scores: r.scores, archetype: r.archetype, at: new Date().toISOString(), persona: c.persona.id }; saveNow(); log(`Completed the Crucible · ${ARCHETYPES[r.archetype].name}`); QUIZ.phase = 'result'; NS.refresh(); NS.toast(`Analysis complete · ${ARCHETYPES[r.archetype].name}`, { desc: 'Your result is saved on this device.' }); }, 1700); });
      on('[data-retake]', () => { QUIZ.phase = 'quiz'; QUIZ.i = 0; QUIZ.answers = []; NS.refresh(); });
      on('[data-cal]', () => NS.toast('Friday block added', { desc: '“Strategy Reflection” · Friday 16:00–16:30 · private', type: 'info' }));
      on('[data-copy-res]', () => { const r = S.crucible, a = ARCHETYPES[r.archetype]; copyText(`The Crucible · ${a.name}\n${a.desc}\n\nScores: ${DIMS.map(([k, l]) => `${l} ${r.scores[k]}`).join(' · ')}\nStrengths: ${a.strengths.map((s) => s[0]).join(', ')}\nBlind spots: ${a.risks.map((s) => s[0]).join(', ')}\nRecommended chapters: ${a.chapters.map((id) => chapterById(id).label).join(', ')}`, 'Crucible summary'); });
      const el = root.querySelector('#cruRadar'); if (el && S.crucible) { const sc = S.crucible.scores; const mx = Math.max(6, ...Object.values(sc)); NS.chart.radar(el, { axes: DIMS.map((d) => d[1]), series: [{ name: 'Your pattern', values: DIMS.map((d) => sc[d[0]]), color: 'var(--viz-4)' }], max: mx, rings: 3, size: 300, legend: false }); }
    },
  };

  /* ------------------------------------------------------------------ */
  /* Adoption (HRBP)                                                     */
  /* ------------------------------------------------------------------ */
  const adoptStatus = (a) => (!a.enrolled ? { label: 'Not enrolled', cls: 'neutral' } : a.lastActive <= 7 ? { label: 'Active', cls: 'ok' } : a.lastActive <= 21 ? { label: 'Quiet', cls: 'warn' } : { label: 'Lapsed', cls: 'bad' });
  R['/adoption'] = {
    title: 'Adoption', personas: ['hrbp'],
    render: (c) => {
      const ad = MANAGERS.map(adoptionOf); const en = ad.filter((a) => a.enrolled); const active = en.filter((a) => a.lastActive <= 7).length;
      const cohorts = ['New-manager cohort', 'Q3 reset cohort', 'Self-serve'].map((name) => { const ms = ad.filter((a) => a.cohort === name); const enr = ms.filter((a) => a.enrolled); return { name, n: ms.length, enrolled: enr.length, pct: ms.length ? Math.round(U.avg(ms, (a) => a.read) / 5 * 100) : 0, desc: name === 'New-manager cohort' ? 'Managers under 18 months in role · guided by L&D' : name === 'Q3 reset cohort' ? '1:1 cadence score under 75% · reset session booked' : 'Everyone else · reads at their own pace' }; });
      return html`${NS.pageHead({ eyebrow: 'People team', title: 'Guide adoption', sub: `Who is using the Field Guide, how far they have read, and whether it shows up in their 1:1 cadence. ${MANAGERS.length} people managers with three or more reports.`, actions: `<button class="ns-btn secondary" data-export>${ic('download')}Export CSV</button><button class="ns-btn primary" data-nudge-lapsed>${ic('megaphone')}Nudge lapsed managers</button>` })}
        <div class="ns-stats mb-4">
          ${NS.stat({ label: 'Enrolled', value: en.length, unit: `of ${MANAGERS.length}`, icon: 'book-open', sub: `${Math.round(U.pctOf(en.length, MANAGERS.length))}% of people managers`, spark: [22, 31, 38, 44, 51, 57, 62, en.length] })}
          ${NS.stat({ label: 'Active this week', value: active, icon: 'activity', sub: `${Math.round(U.pctOf(active, en.length))}% of enrolled` })}
          ${NS.stat({ label: 'Avg chapters read', value: U.avg(en, 'read').toFixed(1), unit: 'of 5', icon: 'list-checks', sub: `${en.filter((a) => a.read === 5).length} finished the playbook` })}
          ${NS.stat({ label: 'Crucible completions', value: en.filter((a) => a.crucible).length, icon: 'flame', sub: (() => { const cb = U.countBy(en.filter((a) => a.crucible), 'crucible'); const top = U.sortBy(Object.entries(cb), (x) => -x[1])[0]; return top ? `Most common: ${top[0]}` : 'None yet'; })() })}
        </div>
        <div class="ns-grid c2">
          ${NS.card({ title: 'Weekly active managers', sub: 'Last eight weeks · chapters marked read per week', body: '<div id="adoptLine"></div>' })}
          ${NS.card({ title: 'Chapter completion', sub: 'Share of enrolled managers who have read each chapter', body: '<div id="adoptChapters"></div>' })}
        </div>
        <div class="ns-grid c3 mt-4">${cohorts.map((co) => `<div class="ns-card"><div class="ns-card-body cohort">${NS.ring({ value: co.pct / 100, size: 76, thickness: 8, label: co.pct + '%', color: co.pct >= 60 ? 'var(--viz-3)' : 'var(--viz-4)' })}<div class="min-w-0"><b>${co.name}</b><span>${co.n} managers · ${co.enrolled} enrolled</span><div class="xs muted mt-1">${co.desc}</div></div></div></div>`).join('')}</div>
        <div class="ns-toolbar mt-4"><div class="ns-input-wrap grow" style="max-width:340px">${ic('search')}<input class="ns-input" id="aq" value="${NS.esc(c.query.q || '')}" placeholder="Search managers, teams…"></div><select class="ns-select" style="width:auto" id="aDept"><option value="">All departments</option>${D.departments.map((d) => `<option>${d.name}</option>`).join('')}</select><div class="ns-chips" id="aStatus">${[['', 'All'], ['Active', 'Active'], ['Quiet', 'Quiet'], ['Lapsed', 'Lapsed'], ['Not enrolled', 'Not enrolled']].map(([v, l]) => `<button class="ns-chip" data-st="${v}" aria-pressed="${!v}">${l}</button>`).join('')}</div></div>
        <div id="adoptTable"></div>`;
    },
    mounted: (c, root) => {
      markTool(c.persona, 'adoption');
      const ad = MANAGERS.map(adoptionOf); const en = ad.filter((a) => a.enrolled); const active = en.filter((a) => a.lastActive <= 7).length;
      NS.chart.line(root.querySelector('#adoptLine'), { labels: ['Aug 3', 'Aug 10', 'Aug 17', 'Aug 24', 'Aug 31', 'Sep 7', 'Sep 14', 'Sep 21'], series: [{ name: 'Active managers', values: [31, 34, 38, 41, 45, 47, 52, active] }, { name: 'Chapters marked read', values: [40, 52, 61, 58, 70, 74, 81, 77] }], height: 220, yMin: 0, endLabels: true });
      NS.chart.hbars(root.querySelector('#adoptChapters'), { items: CH.map((ch, i) => ({ label: ch.label, value: Math.round(U.pctOf(en.filter((a) => a.read > i).length, en.length)), sub: `${en.filter((a) => a.read > i).length} managers` })), max: 100, format: (v) => v + '%', valueLabel: 'Read' });
      const tbl = NS.table(root.querySelector('#adoptTable'), { rows: ad, rowKey: 'id', pageSize: 12, sort: { key: 'score' }, searchKeys: [(a) => a.m.name, (a) => a.m.team, (a) => a.m.dept], search: c.query.q || '', columns: [
        { key: 'name', label: 'Manager', render: (a) => personLink(a.m, `${a.m.team} · ${a.m.dept} · ${a.team} reports`, NS.link('/kpis')), sort: (a) => a.m.name },
        { key: 'read', label: 'Chapters', render: (a) => `<div style="min-width:96px"><div class="flex justify-between xs muted"><span>${a.read}/5</span><span>${a.tools} tools</span></div>${NS.progress((a.read / 5) * 100, { cls: 'xs mt-1' })}</div>`, sort: (a) => a.read },
        { key: 'score', label: '1:1 cadence', align: 'right', render: (a) => `<b class="${a.score >= 75 ? 'ok-text' : a.score >= 50 ? 'warn-text' : 'bad-text'}" data-tip="${a.weekly}% of reports weekly">${a.score}%</b>`, sort: (a) => a.score },
        { key: 'crucible', label: 'Crucible', render: (a) => (a.crucible ? `<span class="ns-badge brand sq">${a.crucible.replace('The ', '')}</span>` : '<span class="faint">—</span>'), sort: (a) => a.crucible || '' },
        { key: 'last', label: 'Last active', render: (a) => (a.lastActive == null ? '<span class="faint">—</span>' : a.lastActive === 0 ? 'Today' : `${a.lastActive}d ago`), sort: (a) => (a.lastActive == null ? 999 : a.lastActive) },
        { key: 'status', label: 'Status', render: (a) => { const s = adoptStatus(a); return NS.badge(s.label, s.cls, true); }, sort: (a) => ['Active', 'Quiet', 'Lapsed', 'Not enrolled'].indexOf(adoptStatus(a).label) },
        { key: 'act', label: '', sort: false, align: 'right', render: (a) => `<button class="ns-btn xs ${adoptStatus(a).cls === 'ok' ? 'ghost' : 'secondary'}" data-nudge="${a.m.id}" data-tip="Nudge ${NS.esc(a.m.first)}">${ic('bell')}${S.nudges[a.m.id] ? S.nudges[a.m.id] : ''}</button>` },
      ], dense: true, empty: { icon: 'search', title: 'No managers match', body: 'Try another department or status.' } });
      let st = '', dept = '';
      const apply = () => tbl.setFilter((a) => (!dept || a.m.dept === dept) && (!st || adoptStatus(a).label === st));
      root.querySelector('#aq').oninput = (e) => tbl.setSearch(e.target.value);
      root.querySelector('#aDept').onchange = (e) => { dept = e.target.value; apply(); };
      root.querySelectorAll('#aStatus .ns-chip').forEach((ch) => ch.onclick = () => { st = ch.dataset.st; root.querySelectorAll('#aStatus .ns-chip').forEach((x) => x.setAttribute('aria-pressed', x === ch)); apply(); });
      root.addEventListener('click', (e) => { const b = e.target.closest('[data-nudge]'); if (b) nudge(b.dataset.nudge); });
      root.querySelector('[data-export]').onclick = () => downloadCsv('field-guide-adoption.csv', [['Manager', 'Team', 'Department', 'Reports', 'Chapters read', 'Tools used', '1:1 cadence score', 'Weekly 1:1 %', 'Crucible', 'Last active (days)', 'Status'], ...tbl.rows().map((a) => [a.m.name, a.m.team, a.m.dept, a.team, a.read, a.tools, a.score, a.weekly, a.crucible || '', a.lastActive == null ? '' : a.lastActive, adoptStatus(a).label])]);
      root.querySelector('[data-nudge-lapsed]').onclick = async () => { const ids = ad.filter((a) => adoptStatus(a).label === 'Lapsed').map((a) => a.m.id); if (!ids.length) { NS.toast('Nobody is lapsed', { type: 'info' }); return; } if (await NS.confirm({ title: `Nudge ${ids.length} lapsed managers?`, body: 'One digest each with their unread chapters, their team’s 1:1 cadence and a link to the Q3 reset session.', confirmLabel: 'Send nudges' })) { ids.forEach((id) => S.nudges[id] = (S.nudges[id] || 0) + 1); saveNow(); log(`Nudged ${ids.length} lapsed managers`); NS.toast(`Nudges sent to ${ids.length} managers`, { type: 'info' }); tbl.refresh(); } };
    },
  };

  /* ------------------------------------------------------------------ */
  /* Boot                                                                */
  /* ------------------------------------------------------------------ */
  const personas = [
    { ...D.personas.manager, note: 'Playbook + tools for your team' },
    { ...D.personas.hrbp, note: 'Playbook + adoption analytics' },
    { ...D.personas.exec, note: 'Playbook + org-level KPIs' },
  ];
  const dueCount = () => weekList(MGR_ID).ones.length;
  NS.app({
    id: 'leaders-field-guide', name: 'The Leader’s Field Guide', sub: 'Northstar Labs', brand: 'amber', version: '3.0',
    mark: ic('compass', { size: 20 }),
    about: { tagline: 'The operating manual for managers who want a high-performance team without the stress.', description: 'A manager playbook organised around the year — Q1 strategy, Q2 execution, Q3 review, Q4 planning — with the tools wrapped around it: a 30-minute 1:1 runner that saves notes per report, a script library with copy-paste emails, six culture KPIs computed from the team, a career ladder mapped to Northstar levels, the Crucible leadership test and, for the People team, adoption analytics across every manager.', highlights: [{ icon: 'book-open', title: 'Five readable chapters', body: 'Tables, traps, scripts and emails from the guide, in a long-form layout with progress tracking.' }, { icon: 'timer', title: '1:1 Runner', body: 'Three 10-minute blocks, data-aware prompts, notes and history per report.' }, { icon: 'bar-chart', title: 'Culture KPIs', body: 'Six targets computed for a team, a department or the company — plus a managers × KPIs heatmap.' }, { icon: 'flame', title: 'The Crucible', body: 'Seven dilemmas, four archetypes, every option scored.' }] },
    personas, defaultPersona: 'manager',
    nav: (persona) => {
      const pr = progressOf(persona);
      const playbook = { group: 'Playbook', items: CH.map((ch) => ({ id: 'pb-' + ch.id, label: ch.label, icon: ch.id === 'overview' ? 'book-open' : QUARTERS.find((q) => q.id === ch.id).icon, route: '/playbook/' + ch.id, badge: pr.read[ch.id] ? '✓' : '' })) };
      const tools = persona.id === 'manager' ? [{ id: 'one-on-one', label: '1:1 Runner', icon: 'timer', badge: dueCount() || '' }, { id: 'scripts', label: 'Script library', icon: 'message-square' }, { id: 'kpis', label: 'Culture KPIs', icon: 'bar-chart' }, { id: 'ladder', label: 'Career ladder', icon: 'layers' }]
        : [{ id: 'kpis', label: 'Culture KPIs', icon: 'bar-chart' }, { id: 'scripts', label: 'Script library', icon: 'message-square' }, { id: 'ladder', label: 'Career ladder', icon: 'layers' }];
      const out = [{ group: '', items: [{ id: 'home', label: 'Home', icon: 'home' }] }, playbook, { group: 'Tools', items: tools }, { group: 'Leadership lab', items: [{ id: 'crucible', label: 'The Crucible', icon: 'flame', badge: S.crucible ? 'Done' : '' }] }];
      if (persona.id === 'hrbp') out.push({ group: 'People team', items: [{ id: 'adoption', label: 'Adoption', icon: 'activity', badge: MANAGERS.map(adoptionOf).filter((a) => adoptStatus(a).label === 'Lapsed').length || '' }] });
      return out;
    },
    promo: (persona) => { const st = readingStats(persona); return { title: st.next ? 'Keep reading' : 'Playbook complete', body: st.next ? `${st.read} of ${st.chapters} chapters read · next up: ${st.next.label}` : `All ${st.chapters} chapters read · ${st.used} of ${st.tools} tools used`, progress: st.pct, cta: st.next ? { label: 'Continue', route: '/playbook/' + st.next.id } : { label: 'Take the Crucible', route: '/crucible' } }; },
    notifications: [{ icon: 'calendar', title: 'Q3 calibration prep starts Oct 5', body: 'Manager reviews open on 5 Oct — read the Q4 chapter on the 9-box and rating scripts first.', time: 'Today', route: '/playbook/q4' }, { icon: 'timer', title: '1:1 with Kavya overdue', body: 'Last held 3 Sep · weekly cadence. Reschedule, never cancel.', time: 'Today', route: '/one-on-one?r=NS-1209' }, { icon: 'message-square', title: 'New script added: mid-year reset', body: 'The Mid-Year Reset email and the Drifter → Builder script are in the library.', time: 'Yesterday', route: '/scripts?f=reset' }],
    routes: R, default: '/home',
    commands: (persona) => [
      ...(persona.id === 'manager' ? [{ label: 'Start a 1:1', icon: 'timer', group: 'Actions', run: () => { const w = weekList(MGR_ID); NS.go('/one-on-one', { r: w.ones[0] ? w.ones[0].p.id : '' }); } }] : []),
      { label: 'Take the Crucible', icon: 'flame', group: 'Actions', run: () => { QUIZ.phase = 'quiz'; QUIZ.i = 0; QUIZ.answers = []; NS.go('/crucible'); } },
      { label: 'Copy the “Quick update on how we work” email', icon: 'copy', group: 'Actions', run: () => { const e = EMAILS[0]; copyText(`Subject: ${e.subject}\n\n${plain(e.body)}`, `Email · ${e.subject}`); } },
      { label: 'Export the KPI scorecard', icon: 'download', group: 'Actions', run: () => NS.go('/kpis') },
      { label: 'Mark all chapters read', icon: 'check-circle', group: 'Playbook', run: () => { const pr = progressOf(persona); CH.forEach((ch) => pr.read[ch.id] = 1); saveNow(); NS.toast('All chapters marked read'); NS.refresh(); } },
      { label: 'Reset my reading progress', icon: 'undo', group: 'Playbook', run: () => { S.progress[persona.id] = { read: {}, tools: {} }; saveNow(); NS.toast('Reading progress reset', { type: 'info' }); NS.refresh(); } },
    ],
    search: (q) => { if (q.length < 2) return []; const ql = q.toLowerCase(); const out = []; CH.forEach((ch) => ch.sections.forEach((s) => { if (s.title.toLowerCase().includes(ql) || ch.title.toLowerCase().includes(ql)) out.push({ group: 'Playbook', label: s.title, hint: ch.label, run: () => NS.go('/playbook/' + ch.id, { s: s.id }) }); })); P.SCRIPTS.forEach((s) => { const txt = `${s.title || ''} ${s.dont || ''} ${s.say || ''} ${s.before ? s.before.name + ' ' + s.after.name : ''}`.toLowerCase(); if (txt.includes(ql)) out.push({ group: 'Scripts', label: s.title || `${s.before.name} → ${s.after.name}`, hint: 'Script library', run: () => NS.go('/scripts', { q }) }); }); EMAILS.forEach((e) => { if (e.subject.toLowerCase().includes(ql)) out.push({ group: 'Scripts', label: e.subject, hint: 'Email', run: () => NS.go('/scripts', { f: 'emails', q }) }); }); const ppl = NS.persona.id === 'manager' ? teamOf(MGR_ID) : MANAGERS; ppl.filter((p) => p.name.toLowerCase().includes(ql)).slice(0, 5).forEach((p) => out.push({ group: 'People', label: p.name, hint: p.title, avatar: NS.avatar(p, { size: 'xs' }), run: () => (NS.persona.id === 'manager' ? NS.go('/one-on-one', { r: p.id }) : NS.persona.id === 'hrbp' ? NS.go('/adoption', { q: p.name }) : NS.go('/kpis')) })); return out.slice(0, 10); },
    onReset: () => P.store.clear(),
  });
})();
</script>
</body>
</html>

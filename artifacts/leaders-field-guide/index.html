<!doctype html>
<html lang="en" data-brand="amber">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Leader’s Field Guide · Northstar Labs</title>
<meta name="description" content="The Leader’s Field Guide — the operating manual for Northstar Labs managers: a quarterly playbook, a 1:1 runner, conversation scripts, culture KPIs and the Crucible leadership test. Concept prototype with illustrative data.">
<meta name="theme-color" content="#FAF7F0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%231F1A14'/%3E%3Cpath d='M14 12h20v24H17a3 3 0 0 1-3-3z' fill='none' stroke='%23FAF7F0' stroke-width='3' stroke-linejoin='round'/%3E%3Cpath d='M26 12h6v13l-3-2.2-3 2.2z' fill='%23E0A04A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/ns.css">
<script src="../shared/ns.js"></script>
<script src="../shared/ns-data.js"></script>
<style>
  /* ======================================================================
     The Leader's Field Guide · "The manager's handbook"
     Identity layer on Northstar v5. An editorial playbook: warm paper,
     ink type, Newsreader for everything you read, Inter for everything you
     operate, amber for "you are here", and one muted colour per chapter
     (the thumb index) that follows a quarter everywhere it appears.
     ====================================================================== */
  :root{
    --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-display:"Newsreader","Iowan Old Style","Georgia",serif;
    --font-serif:"Newsreader","Iowan Old Style","Georgia",serif;
    --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

    --bg:#FAF7F0;--bg-2:#F3EEE3;
    --surface:#FFFDF9;--surface-2:#F7F3EA;--surface-3:#F0EADD;--surface-4:#E5DDCC;
    --line:#E4DCCB;--line-2:#EDE7DA;--line-strong:#CFC3AC;
    --ink:#1F1A14;--ink-2:#433A2F;--ink-3:#685C4D;--ink-4:#7A6E5E;--ink-inverse:#FAF7F0;

    --np:#B45309;--np-hover:#92400E;--np-active:#78350F;--np-text:#9A4A0B;--np-soft:#FBF1E1;--np-soft-2:#F5E2C4;--np-line:#E8C38E;
    --brand:#B45309;--brand-hover:#92400E;--brand-text:#92400E;--brand-soft:#FBF1E1;--brand-soft-2:#F5E2C4;--brand-line:#EBCB9B;

    --ok:#3F6B3A;--ok-bg:#EAF0E3;--ok-line:#C7D6BB;
    --warn:#94600A;--warn-bg:#FAF0DA;--warn-line:#EBD3A1;
    --bad:#A63A2B;--bad-bg:#F8E7E2;--bad-line:#EBC2B8;
    --info:#3B5F80;--info-bg:#E8EEF3;--info-line:#C2D1DE;
    --neutral:#5E5446;--neutral-bg:#F0EBE1;--neutral-line:#DDD4C4;
    --discovery:#6A4E86;--discovery-bg:#F2EDF5;

    /* chapter colours — the thumb index */
    --ch-overview:#5B4E3E;--ch-q1:#3E6283;--ch-q2:#4E7445;--ch-q3:#A4482E;--ch-q4:#6E4A7E;
    --ch-overview-soft:#EFE9DF;--ch-q1-soft:#E8EEF4;--ch-q2-soft:#EAF0E5;--ch-q3-soft:#F6E8E2;--ch-q4-soft:#F0EAF3;

    --viz-1:#3E6283;--viz-2:#A4482E;--viz-3:#4E7445;--viz-4:#C08A1E;--viz-5:#A65473;--viz-6:#6B7A2A;--viz-7:#6E4A7E;--viz-8:#B03A2E;
    --viz-good:#4E7445;--viz-warn:#C9971F;--viz-serious:#C8693F;--viz-critical:#B03A2E;
    --viz-seq-100:#F6EAD2;--viz-seq-200:#EDD5A8;--viz-seq-300:#E0B874;--viz-seq-400:#CC9347;--viz-seq-500:#B0702A;--viz-seq-600:#8A541B;--viz-seq-700:#5F3A12;
    --viz-div-neg:#B03A2E;--viz-div-mid:#F2EDE3;--viz-div-pos:#3E6283;
    --viz-grid:#EEE8DC;--viz-axis:#D9CFBD;

    --shadow-xs:0 1px 0 rgba(60,42,16,.03);
    --shadow-sm:0 1px 2px rgba(60,42,16,.06);
    --shadow:0 2px 6px -1px rgba(60,42,16,.08),0 1px 2px rgba(60,42,16,.05);
    --shadow-lg:0 14px 30px -8px rgba(60,42,16,.18),0 3px 8px -2px rgba(60,42,16,.06);
    --shadow-xl:0 28px 64px -12px rgba(40,28,10,.30),0 6px 14px -4px rgba(40,28,10,.08);
    --glass:rgba(250,247,240,.9);

    --r-xs:3px;--r-sm:4px;--r:6px;--r-lg:8px;--r-xl:10px;
    --btn-ink:#1F1A14;--btn-ink-hover:#3A3127;--btn-on-ink:#FAF7F0;
    --focus:0 0 0 2px var(--bg),0 0 0 4px color-mix(in srgb,var(--np) 60%,transparent);
    --measure:68ch;
  }
  :root[data-theme="dark"]{
    --bg:#17140F;--bg-2:#1B1712;
    --surface:#1E1A14;--surface-2:#221E17;--surface-3:#2A251D;--surface-4:#352F25;
    --line:#342D23;--line-2:#2A251D;--line-strong:#4A4134;
    --ink:#F1EADC;--ink-2:#D3C8B5;--ink-3:#A99D89;--ink-4:#8C8070;--ink-inverse:#17140F;
    --np:#E0A04A;--np-hover:#EBB063;--np-active:#D08E35;--np-text:#F0B566;--np-soft:rgba(224,160,74,.13);--np-soft-2:rgba(224,160,74,.22);--np-line:rgba(224,160,74,.42);
    --brand:#E0A04A;--brand-hover:#EBB063;--brand-text:#F0B566;--brand-soft:rgba(224,160,74,.13);--brand-soft-2:rgba(224,160,74,.22);--brand-line:rgba(224,160,74,.4);
    --ok:#9CC18D;--ok-bg:rgba(130,175,110,.13);--ok-line:rgba(130,175,110,.34);
    --warn:#E5B55A;--warn-bg:rgba(229,181,90,.12);--warn-line:rgba(229,181,90,.32);
    --bad:#E58A78;--bad-bg:rgba(229,138,120,.13);--bad-line:rgba(229,138,120,.34);
    --info:#8FB2D3;--info-bg:rgba(143,178,211,.12);--info-line:rgba(143,178,211,.32);
    --neutral:#BDB2A1;--neutral-bg:rgba(189,178,161,.1);--neutral-line:rgba(189,178,161,.26);
    --discovery:#C3A8DB;--discovery-bg:rgba(195,168,219,.12);
    --ch-overview:#BBAA90;--ch-q1:#8FB0CF;--ch-q2:#97B98A;--ch-q3:#E0937A;--ch-q4:#BC9FCC;
    --ch-overview-soft:rgba(187,170,144,.12);--ch-q1-soft:rgba(143,176,207,.12);--ch-q2-soft:rgba(151,185,138,.12);--ch-q3-soft:rgba(224,147,122,.12);--ch-q4-soft:rgba(188,159,204,.12);
    --viz-1:#7FA3C6;--viz-2:#D9805F;--viz-3:#8DB37F;--viz-4:#D9A53F;--viz-5:#D08AA6;--viz-6:#A9B865;--viz-7:#AE8FC2;--viz-8:#E07A6C;
    --viz-good:#8DB37F;--viz-warn:#D9A53F;--viz-serious:#D9805F;--viz-critical:#E07A6C;
    --viz-seq-100:#3A2A14;--viz-seq-200:#5A3F18;--viz-seq-300:#7C561E;--viz-seq-400:#A06F27;--viz-seq-500:#C68C3A;--viz-seq-600:#E0AE62;--viz-seq-700:#F4D9A8;
    --viz-div-neg:#E07A6C;--viz-div-mid:#2E2820;--viz-div-pos:#7FA3C6;
    --viz-grid:#2A251D;--viz-axis:#3E362A;
    --shadow-xs:0 1px 0 rgba(0,0,0,.3);--shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 2px 8px -1px rgba(0,0,0,.5);
    --shadow-lg:0 14px 32px -6px rgba(0,0,0,.6),0 0 0 1px rgba(241,234,220,.04);
    --shadow-xl:0 30px 70px -12px rgba(0,0,0,.75),0 0 0 1px rgba(241,234,220,.05);
    --glass:rgba(23,20,15,.9);
    --btn-ink:#F1EADC;--btn-ink-hover:#FFFFFF;--btn-on-ink:#17140F;
    --on-brand:#17140F;
  }

  /* ---------- base ---------- */
  body{background:var(--bg);font-feature-settings:"cv11","ss03","calt"}
  ::selection{background:color-mix(in srgb,var(--np) 26%,transparent)}
  .serif{font-family:var(--font-serif)}
  .ns-overlay.center{text-align:start}
  .ns-grid.main-side,.ns-grid.side-main{align-items:start}
  h1,h2,h3{font-family:var(--font-serif);font-weight:560;letter-spacing:-.01em}
  .ns-viz svg{font-family:var(--font-sans)}

  /* ---------- global header ---------- */
  .ns-gh{background:var(--bg);border-bottom:1px solid var(--line)}
  .ns-gh-btn:hover,.ns-icon-btn:hover,.ns-gh-logo:hover,.ns-gh-product:hover{background:var(--surface-3)}
  .ns-np-mark{border-radius:5px}
  .ns-gh-product .ns-brand-name{font-family:var(--font-serif);font-size:17px;font-weight:600;letter-spacing:-.01em}
  .ns-brand-mark{background:var(--ink);color:var(--bg);box-shadow:none;border-radius:5px}
  .ns-brand-mark .rib{fill:var(--np);stroke:none}
  .ns-gh-product .ns-brand-mark{width:26px;height:26px;border-radius:5px}
  .ns-gh-product .ns-brand-mark svg{width:16px;height:16px}
  .ns-search-btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
  .ns-search-btn:hover{border-color:var(--line-strong);background:var(--surface)}
  .ns-tenant{border-color:var(--line);background:var(--surface)}
  .ns-tenant i{background:var(--np);border-radius:50%}
  .ns-tenant small{background:var(--np-soft);color:var(--np-text)}
  .ns-icon-btn .dot{background:var(--np);border-color:var(--bg)}
  kbd,.ns-kbd{background:var(--surface);border-color:var(--line-strong)}

  /* ---------- buttons, badges, chips ---------- */
  .ns-btn{border-radius:var(--r-sm);font-weight:550}
  .ns-btn.primary{background:var(--btn-ink);color:var(--btn-on-ink);box-shadow:none}
  .ns-btn.primary:hover{background:var(--btn-ink-hover)}
  .ns-btn.primary:active{background:var(--btn-ink)}
  .ns-btn.secondary{background:var(--surface);border-color:var(--line-strong);box-shadow:none}
  .ns-btn.secondary:hover{background:var(--surface-3)}
  .ns-btn.ghost:hover{background:var(--surface-3)}
  .ns-btn.amber{background:var(--np);color:#fff}.ns-btn.amber:hover{background:var(--np-hover)}
  :root[data-theme="dark"] .ns-btn.amber{color:#17140F}
  .ns-badge{border-radius:3px}
  .ns-badge.brand{background:var(--np-soft);color:var(--np-text)}
  .ns-tag{border-radius:3px;background:transparent;border-color:var(--line-strong);color:var(--ink-3);font-size:11.5px}
  .ns-chip[aria-pressed="true"],.ns-chip.on{background:var(--np-soft);border-color:var(--np-line);color:var(--np-text)}
  .ns-progress{height:4px;border-radius:2px;background:var(--surface-4)}
  .ns-progress > i{background:var(--np);border-radius:2px}
  .ns-progress.lg{height:6px}
  .ns-check input:checked{background:var(--ink);border-color:var(--ink)}
  :root[data-theme="dark"] .ns-check input:checked::after{filter:invert(1)}
  .ns-input,.ns-select,.ns-textarea{background:var(--surface);border-color:var(--line-strong);border-radius:var(--r-sm)}
  .ns-input:focus,.ns-select:focus,.ns-textarea:focus{border-color:var(--np);box-shadow:0 0 0 3px color-mix(in srgb,var(--np) 16%,transparent)}
  [data-tip]::after{background:var(--ink);color:var(--bg)}
  .ns-toast{background:#1F1A14;color:#FAF7F0}
  .ns-toast .act{color:#F0B566}
  .ns-avatar.h0{background:#4D5B8C}.ns-avatar.h1{background:#3E6E7A}.ns-avatar.h2{background:#4E7445}.ns-avatar.h3{background:#8E611A}.ns-avatar.h4{background:#9B4E66}.ns-avatar.h5{background:#6E5A8E}.ns-avatar.h6{background:#A4552E}.ns-avatar.h7{background:#3E6283}.ns-avatar.h8{background:#3F7A6E}.ns-avatar.h9{background:#66742A}

  /* ---------- sidebar: a table of contents with a thumb index ---------- */
  .ns-sidebar{background:var(--bg-2);border-right:1px solid var(--line)}
  .ns-brand{padding:16px 16px 12px}
  .ns-brand .ns-brand-name{font-family:var(--font-serif);font-size:17px;font-weight:600;letter-spacing:-.01em}
  .ns-brand-sub{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .ns-persona-chip{background:var(--surface);border-color:var(--line);border-radius:var(--r-sm)}
  .ns-nav-group{font-family:var(--font-serif);font-style:italic;font-size:13.5px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-3);padding:16px 10px 4px}
  .ns-nav-item,.ns-nav-group{flex:none}
  @media (max-height:960px) and (min-width:961px){.ns-sidebar-promo{display:none}}
  .ns-nav-item{height:33px;border-radius:var(--r-sm);color:var(--ink-2)}
  .ns-nav-item:hover{background:color-mix(in srgb,var(--surface) 70%,transparent)}
  .ns-nav-item[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
  .ns-nav-item[aria-current="page"] svg{color:var(--np-text)}
  .ns-nav-item[aria-current="page"]::before{background:var(--np)}
  .ns-nav-badge{background:transparent;color:var(--ink-3);border:1px solid var(--line-strong);height:18px}
  .ns-nav-item[aria-current="page"] .ns-nav-badge{background:var(--np-soft);color:var(--np-text);border-color:var(--np-line)}
  .ns-nav-item[data-nav^="pb-"]{--chc:var(--ch-overview)}
  .ns-nav-item[data-nav="pb-q1"]{--chc:var(--ch-q1)}.ns-nav-item[data-nav="pb-q2"]{--chc:var(--ch-q2)}.ns-nav-item[data-nav="pb-q3"]{--chc:var(--ch-q3)}.ns-nav-item[data-nav="pb-q4"]{--chc:var(--ch-q4)}
  .ns-nav-item[data-nav^="pb-"] svg{display:none}
  .ns-nav-item[data-nav^="pb-"] .ns-nav-label::before{display:inline-block;width:17px;margin-right:10px;font-family:var(--font-serif);font-size:15px;font-weight:600;color:var(--chc);text-align:center;font-variant-numeric:lining-nums}
  .ns-nav-item[data-nav="pb-overview"] .ns-nav-label::before{content:"1"}.ns-nav-item[data-nav="pb-q1"] .ns-nav-label::before{content:"2"}.ns-nav-item[data-nav="pb-q2"] .ns-nav-label::before{content:"3"}.ns-nav-item[data-nav="pb-q3"] .ns-nav-label::before{content:"4"}.ns-nav-item[data-nav="pb-q4"] .ns-nav-label::before{content:"5"}
  .ns-nav-item[data-nav^="pb-"]::after{content:"";position:absolute;right:-10px;top:5px;bottom:5px;width:4px;border-radius:2px 0 0 2px;background:var(--chc)}
  .ns-nav-item[data-nav^="pb-"] .ns-nav-label{margin-left:-10px}
  .ns-nav-item[data-nav^="pb-"] .ns-nav-badge{border:0;color:var(--ok);font-weight:700;padding:0;min-width:16px}
  .ns-app[data-collapsed="1"] .ns-nav-item[data-nav^="pb-"] svg{display:block;color:var(--chc)}
  .ns-sidebar-promo{background:var(--surface);border-color:var(--line);border-radius:var(--r);border-top:3px solid var(--np)}
  .ns-sidebar-promo::before{content:"Bookmark";color:var(--np-text);letter-spacing:.08em}
  .ns-sidebar-promo b{font-family:var(--font-serif);font-size:15px;font-weight:600}
  .ns-sidebar-foot{border-top-color:var(--line)}

  /* ---------- context bar + content ---------- */
  .ns-topbar{background:color-mix(in srgb,var(--bg) 92%,transparent)}
  .ns-crumbs{font-size:12.5px}
  .ns-topbar-meta i{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
  .ns-content{max-width:1360px}

  /* ---------- page head: a title page, not a dashboard banner ---------- */
  .ns-page-head{padding:10px 0 22px;margin-bottom:24px;border-bottom:3px double var(--line-strong);align-items:flex-end}
  .ns-page-head > div:first-child{max-width:780px}
  .ns-eyebrow{font-family:var(--font-sans);font-size:11.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--np-text);margin-bottom:10px}
  .ns-page-head h1{font-family:var(--font-serif);font-size:38px;line-height:1.08;font-weight:500;letter-spacing:-.018em}
  .ns-page-head p{font-family:var(--font-serif);font-size:17.5px;line-height:1.5;color:var(--ink-2);margin-top:10px;max-width:64ch}
  .ns-page-head p b{color:var(--ink);font-weight:600}
  .ns-page-head + .ns-tabs{margin-top:-24px}

  /* ---------- cards & tables ---------- */
  .ns-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:none}
  .ns-card-head{padding:16px 20px 0}
  .ns-card-head h3{font-family:var(--font-serif);font-size:19px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
  .ns-card-head p{font-size:12.5px;color:var(--ink-3);margin-top:3px}
  .ns-card-foot{background:transparent;border-top:1px solid var(--line-2)}
  .ns-card-foot a{font-weight:550}
  .ns-table-wrap{background:var(--surface);border-color:var(--line);box-shadow:none;border-radius:var(--r-lg)}
  .ns-table th{background:var(--surface);font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line-strong)}
  .ns-table tbody tr:hover td{background:var(--surface-2)}
  .ns-table-foot{background:transparent}
  .ns-tabs{border-bottom-color:var(--line)}
  .ns-tab{font-weight:500}
  .ns-tab[aria-selected="true"]{color:var(--ink);border-color:var(--np)}
  .ns-tab[aria-selected="true"] .n{background:var(--np-soft);color:var(--np-text)}
  .ns-seg{background:var(--surface-3);border-color:var(--line)}
  .ns-seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
  .ns-dropdown,.ns-palette,.ns-modal{border-color:var(--line);border-radius:var(--r-xl)}
  .ns-modal-head h2,.ns-drawer-head h2{font-family:var(--font-serif);font-size:22px;font-weight:600}
  .ns-modal-foot,.ns-drawer-foot{background:var(--surface-2)}
  .ns-alert{border-radius:var(--r)}
  .ns-ai{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--discovery)}
  .ns-empty b{font-family:var(--font-serif);font-size:18px;font-weight:600}
  .ns-icon-box{background:var(--np-soft);color:var(--np-text)}
  .ns-icon-box.neutral{background:var(--surface-3);color:var(--ink-3)}

  /* ledger: stat tiles become one ruled strip with serif figures */
  .ns-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
  .ns-stat{align-content:start;border:0;border-radius:0;background:transparent;box-shadow:-1px 0 0 var(--line-2),0 -1px 0 var(--line-2);padding:16px 20px 16px}
  .ns-stat .ic{display:none}
  .ns-stat .lbl{font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
  .ns-stat .val{font-family:var(--font-serif);font-weight:500;font-size:38px;letter-spacing:-.02em;line-height:1;margin-top:4px}
  .ns-stat .val small{font-family:var(--font-sans);font-size:13px}
  .ns-stat .sub{font-size:12.5px}
  @media (max-width:1000px){.ns-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .ns-ring .c b{font-family:var(--font-serif);font-weight:600}

  /* ---------- shared bits ---------- */
  .lfg-side{position:sticky;top:calc(var(--header-h) + var(--topbar-h) + 12px);display:grid;gap:16px}
  @media (max-width:1200px){.lfg-side{position:static}}
  .lfg-label.mt-2{margin-top:8px}.lfg-label.mt-3{margin-top:12px}.lfg-label.mt-4{margin-top:18px}
  .lfg-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
  .lfg-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;font-size:12.5px;color:var(--ink-3)}
  .lfg-meta b{color:var(--ink);font-weight:600}
  .lfg-meta > span{display:inline-flex;align-items:center;gap:5px}
  .lfg-meta svg{width:14px;height:14px;color:var(--ink-4)}
  .lfg-list{display:grid}
  .lfg-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2);min-width:0}
  .lfg-item:last-child{border-bottom:0}
  .lfg-item .t{font-weight:600;font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lfg-item .s{font-size:12.5px;color:var(--ink-3);margin-top:1px}
  .lfg-item .r{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}

  /* ---------- the year: four chapters on one ruled line ---------- */

  .yq .ft svg{width:12px;height:12px}
  .yq.now{background:color-mix(in srgb,var(--np) 4%,var(--surface))}
  .year-today{position:absolute;top:-6px;height:12px;width:0;border-left:2px solid var(--np);pointer-events:none;z-index:2}
  .year-today span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--surface);background:var(--np);padding:2px 6px;border-radius:3px}

  /* ---------- home ---------- */
  .home-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
  @media (max-width:1200px){.home-grid{grid-template-columns:minmax(0,1fr)}}
  .sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px}

  .tool-list{display:grid}

  .focus-steps p{font-size:12.5px;color:var(--ink-3);line-height:1.45;margin:1px 0 0}

  /* ---------- KPI bullets (current vs target) ---------- */
  .bullets{display:grid}

  /* ---------- chapter: opener, TOC, prose ---------- */
  .ch-open{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 28px;align-items:end;padding:12px 0 26px;margin-bottom:28px;border-bottom:3px double var(--line-strong)}

  @media (max-width:1000px){.ch-open{grid-template-columns:auto minmax(0,1fr)}.ch-acts{grid-column:1/-1;align-items:flex-start}.ch-acts .lfg-meta{justify-content:flex-start}}
  @media (max-width:520px){.ch-open{display:block}.ch-num{float:left;font-size:66px;margin:4px 14px 0 0}.ch-open .lede{clear:left;padding-top:10px}.ch-acts{margin-top:14px}}
  @media (max-width:640px){.ch-num{font-size:72px}.ch-open h1{font-size:30px}.ch-open .lede{font-size:17px}.ch-open{gap:6px 16px}}
  .pb{display:grid;grid-template-columns:220px minmax(0,1fr);gap:48px;align-items:start}

  .pb-body{max-width:740px;min-width:0}
  .pb-meta{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(2,minmax(0,1fr));gap:0;border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line)}

  .pb-meta .v{font-family:var(--font-serif);font-size:17px;color:var(--ink);margin-top:3px;line-height:1.35}
  .pb-meta .v.it{font-style:italic}
  @media (max-width:640px){.pb-meta{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.pb-meta > div:first-child{grid-column:1/-1;border-bottom:1px solid var(--line-2)}.pb-meta > div:nth-child(2){padding-left:0;border-left:0}}
  .prose{counter-reset:none}
  .prose h2{font-size:28px;font-weight:500;letter-spacing:-.015em;line-height:1.2;margin:48px 0 14px;color:var(--ink);scroll-margin-top:calc(var(--header-h) + var(--topbar-h) + 16px);display:grid;gap:6px}

  .prose h3{font-size:20px;font-weight:600;margin:28px 0 10px;color:var(--ink)}
  .prose h3 .sub{font-family:var(--font-sans);font-weight:400;color:var(--ink-3);font-size:13.5px;letter-spacing:0}
  .prose p{font-family:var(--font-serif);font-size:18.5px;line-height:1.62;color:var(--ink-2);margin:0 0 16px;max-width:var(--measure)}
  .prose .yq p,.prose .golden p,.prose .ns-alert p{font-family:var(--font-sans);font-size:13.5px;line-height:1.5;margin:0;max-width:none}.prose .yq p{font-size:12.5px;color:var(--ink-3)}.prose .golden p{font-size:14px;color:var(--ink-2)}.prose .ns-alert p{color:var(--ink-2)}
  .prose p.small{font-family:var(--font-sans);font-size:13px;color:var(--ink-3)}
  .prose > *:last-child{margin-bottom:0}
  .pullq{margin:24px 0;padding:2px 0 2px 20px;border-left:2px solid var(--chc,var(--np));font-family:var(--font-serif);font-style:italic;font-size:23px;line-height:1.42;color:var(--ink);max-width:56ch}

  .prose .step p,.step p{font-family:var(--font-sans);font-size:14px;margin:3px 0 0;line-height:1.55;color:var(--ink-2)}
  .lfg-table{margin:10px 0 24px;border:0!important;border-radius:0!important;background:transparent!important;border-top:2px solid var(--ink)!important;border-bottom:1px solid var(--ink)!important}

  .lfg-table td{vertical-align:top;line-height:1.5;font-size:14px}
  .lfg-table td:first-child{font-weight:600;color:var(--ink);white-space:nowrap}
  .lfg-table td.leak{color:var(--bad)}.lfg-table td.fixed{color:var(--ok);font-weight:600}
  .lfg-boxlist{display:grid;margin:10px 0 24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .lfg-boxlist > *{border-top:1px solid var(--line-2)}

  .lit label{display:flex;gap:12px;align-items:center;padding:12px 4px;font-family:var(--font-serif);font-size:17px;color:var(--ink-2);cursor:pointer;transition:background var(--dur)}

  .starters > div{font-family:var(--font-serif);font-style:italic;font-size:17.5px;color:var(--ink)}
  .starters .qn{font-family:var(--font-serif);font-style:normal;font-weight:600;color:var(--chc,var(--np));font-size:15px}
  .rhythm > div{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:baseline;padding:12px 0}
  .rhythm .day{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--chc,var(--ink-2))}
  .rhythm b{font-family:var(--font-serif);font-size:18px;color:var(--ink);font-weight:600}.rhythm b small{font-family:var(--font-sans);font-weight:500;color:var(--ink-3);margin-left:8px;font-size:12px}
  .rhythm p,.prose .rhythm p{font-family:var(--font-sans);margin:2px 0 0;font-size:14px;line-height:1.5}
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:10px 0 24px;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}

  .board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:10px 0 24px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}

      return html`${NS.pageHead({ eyebrow: 'Tools · The weekly engine', title: '1:1 Runner', sub: 'Thirty minutes, three blocks, one action item. Pick a report, start the clock and let the prompts do the asking. Notes save as you type.', actions: `<span class="ns-badge ${wk.ones.length ? 'warn' : 'ok'} lg">${ic('timer', { size: 12 })} ${wk.ones.length} due this week · ${wk.ones.filter((x) => x.d.overdue).length} overdue</span><a class="ns-btn secondary lfg-sess-hide" href="${NS.link('/scripts')}">${ic('message-square')}Script library</a><button class="ns-btn secondary" data-focus aria-pressed="${focusOn}" data-tip="Hide navigation for the conversation · Esc to exit">${focusOn ? `${ic('x')}Exit focus` : `${ic('maximize')}Focus mode`}</button>` })}

        ${other ? `<div class="ns-alert warn mb-4">${ic('timer')}<div><b>A 1:1 with ${NS.esc(other.name)} is still running (${fmtT(RUN.elapsed)})</b><p>Go back to finish it, or discard the timer. Notes are already saved.</p></div><div class="flex gap-2 ml-auto"><a class="ns-btn xs primary" href="${NS.link('/one-on-one', { r: other.id })}">Back to ${NS.esc(other.first)}</a><button class="ns-btn xs secondary" data-discard>Discard</button></div></div>` : ''}
        <div class="session" data-runner-pid="${pid}">
          <aside class="sess-clock" aria-label="Session clock and agenda">
            <div><div class="who">1:1 with <b>${NS.esc(p.first)}</b> · ${F.date(TODAY, 'short')}</div><div class="big mt-2" id="tBig" role="timer" aria-live="off">${fmtT(RUN.pid === pid ? RUN.elapsed : 0)}<small>/ 30:00</small></div><div class="sess-state mt-2" id="tState"><i></i><span>Ready when you are</span></div></div>
            <div class="sess-btns"><button class="ns-btn primary" data-run>${ic('play')} Start 1:1</button><button class="ns-btn secondary sm" data-skip data-tip="Jump to the next 10-minute block" aria-label="Next block">${ic('chevrons-right')}<span class="lab">Next block</span></button><button class="ns-btn secondary sm" data-reset aria-label="Reset timer">${ic('undo')}<span class="lab">Reset</span></button><button class="ns-btn secondary sm" data-finish style="grid-column:1/-1" aria-label="Finish and save">${ic('check-circle')}<span class="lab">Finish & save</span></button></div>
            <div class="ag-wrap"><div class="lfg-label">Agenda</div><div class="agenda">${BLOCKS.map((b, i) => `<button type="button" class="ag" data-goto="${i}" aria-label="Go to block ${b.n}: ${b.title}"><span class="t">${b.time}</span><b>${b.title}</b><span class="fill" aria-hidden="true"><i></i></span></button>`).join('')}</div></div>
            <div class="sess-rule"><span class="pct">90/10</span><span>Listen 90%, talk 10%. ${NS.esc(p.first)} should talk for 27 of the 30 minutes.</span></div>
          </aside>
          <div class="sess-main">
            <section class="dossier" aria-label="${NS.esc(p.first)} at a glance">${NS.avatar(p, { size: 'lg' })}<div class="min-w-0"><div class="flex items-center gap-2 wrap"><h2>${NS.esc(p.name)}</h2>${cadBadge(p)}${d.overdue ? NS.badge(d.label, 'bad', true) : NS.badge(d.label, 'ok', true)}</div><div class="sm muted mt-1">${NS.esc(p.title)} · ${D.levelLabel(p.level)} · ${p.city}${p.remote ? ' · remote' : ''} · ${F.tenure(p.tenure)} tenure</div><div class="lfg-meta mt-3"><span><span class="muted">Last 1:1</span> <b>${d.last ? F.date(d.last) : '—'}</b></span><span><span class="muted">Engagement</span> <b>${p.engagement}</b></span><span><span class="muted">Flight risk</span> ${NS.badge(p.riskBand, p.riskBand === 'High' ? 'bad' : p.riskBand === 'Medium' ? 'warn' : 'ok')}</span><span><span class="muted">Ladder</span> <b>${rung.id} ${rung.name}</b></span><span><span class="muted">1:1s logged</span> <b>${hist.length}</b></span></div></div><div class="rep-pulse"><div class="lfg-label" style="margin-bottom:4px">Pulse · 6 months</div>${NS.spark(p.pulse, { color: pulseDrop(p) <= -8 ? 'var(--viz-critical)' : 'var(--viz-3)', height: 36 })}<div class="xs muted mt-1">${p.pulse[0]} → <b class="ink">${p.pulse[5]}</b>${pulseDrop(p) <= -8 ? ` · <span class="bad-text semibold">${pulseDrop(p)} pts</span>` : ''}</div></div><div class="goal"><span class="lfg-label" style="margin:0">Q3 goal</span><span class="t">${NS.esc(g.title)}</span>${goalBadge(g)}<span class="gbar">${NS.progress(g.progress, { cls: g.status === 'behind' ? 'bad' : g.status === 'risk' ? 'warn' : 'ok' })}</span><b class="tnum">${g.progress}%</b></div></section>
            ${BLOCKS.map((b, i) => `<section class="block" id="blk-${i}"><div class="block-head"><span class="n">${b.n}</span><div class="min-w-0"><b>${b.title} <span>· ${b.alias}</span></b><span class="s">“${b.line}”</span></div><span class="tm">${b.time} MIN</span></div><div class="block-body"><button type="button" class="prompt core" data-use="${NS.esc(b.core)}">${ic('message-circle')}<span>“${b.core}”</span><span class="pk hide-sm">Core question</span></button>${b.alts.map((a) => `<button type="button" class="prompt alt" data-use="${NS.esc(a)}">${ic('arrow-right')}<span>${a}</span><span class="pk hide-sm">Alternative</span></button>`).join('')}${sug[i].map((s) => `<button type="button" class="prompt data" data-use="${NS.esc(s)}">${ic('sparkles')}<span>${NS.esc(s)}</span><span class="pk hide-sm">From ${NS.esc(p.first)}’s data</span></button>`).join('')}<label class="ns-field mt-2"><span class="ns-label">Notes <span class="opt">· saved automatically · click a prompt to add it</span></span><textarea class="ns-textarea" data-note="${i}" placeholder="${['How are they really? Energy, sleep, what’s draining them…', 'Rocks moved, pebbles in the shoe, where they are waiting on you…', 'One skill, one piece of feedback, one thing to improve next week…'][i]}">${NS.esc(draft.blocks[i] || '')}</textarea></label></div></section>`).join('')}
            <section class="ns-card"><div class="ns-card-body"><label class="ns-field"><span class="ns-label">One action item</span><input class="ns-input" data-action value="${NS.esc(draft.action || '')}" placeholder="e.g. Get Kavya’s decision on the audit write by Friday"><span class="ns-help">What you will unblock before the next 1:1. Saved automatically; Finish & save logs it with the notes.</span></label></div></section>
          </div>
          <aside class="sess-ctx grid gap-4">
            ${NS.card({ title: `History with ${NS.esc(p.first)}`, sub: hist.length ? `${hist.length} logged · ${CADENCE_LABEL[p.oneOnOnes].toLowerCase()} cadence` : 'No notes logged yet', body: hist.length ? `<div class="hist">${hist.slice(0, 4).map((h, i) => `<button type="button" class="hist-item" data-hist="${i}"><span class="d"><b>${F.date(h.date)}</b><span>${Math.round(h.dur / 60)} min</span></span>${h.action ? `<p><b>Action</b>${NS.esc(h.action)}</p>` : ''}<p><b>Growth</b>${NS.esc((h.blocks[2] || '').slice(0, 110))}${(h.blocks[2] || '').length > 110 ? '…' : ''}</p></button>`).join('')}</div>` : `<div class="sm muted">Finish this 1:1 and the notes will show up here.</div>` })}
            ${NS.card({ title: 'Guardrails', sub: 'The rules of the 30 minutes', body: `${guardrails()}<div class="lfg-label mt-3">Do not do</div>${dontsCard()}` })}
            ${NS.card({ title: 'Team cadence', sub: 'Who is due when', body: `${ordered.map((x) => { const di = dueInfo(x); return `<a class="cad-row ${x.id === pid ? 'cur' : ''}" href="${NS.link('/one-on-one', { r: x.id })}">${NS.avatar(x, { size: 'xs' })}<span class="min-w-0"><span class="nm">${NS.esc(x.first)} ${NS.esc(x.last)}</span><br><span class="sb">${CADENCE_LABEL[x.oneOnOnes]}</span></span><span class="xs ${di.overdue ? 'bad-text semibold' : 'muted'}">${di.label}</span></a>`; }).join('')}` })}
          </aside>
        </div>`;
    },
    mounted: (c, root) => {
      const me = meFor(c.persona); const wrap = root.querySelector('[data-runner-pid]'); const pid = wrap.dataset.runnerPid; const p = D.byId(pid); const draft = draftFor(pid);
      if (RUN.pid !== pid && !RUN.running) { RUN.pid = pid; RUN.elapsed = 0; RUN.notified = {}; }
      paint();
      root.querySelector('[data-focus]').onclick = () => setFocus(!document.documentElement.dataset.session);
      root.querySelector('[data-run]').onclick = () => { if (RUN.pid !== pid) { if (RUN.running) { NS.toast(`Finish or discard the 1:1 with ${D.byId(RUN.pid).first} first`, { type: 'warn' }); return; } RUN.pid = pid; RUN.elapsed = 0; RUN.notified = {}; } const fresh = !RUN.running && RUN.elapsed === 0; RUN.running = !RUN.running; RUN.last = Date.now(); if (RUN.running && fresh) { if (!draft.started) { draft.started = new Date().toISOString(); save(); markTool(c.persona, 'oneOnOne'); log(`Started a 1:1 with ${p.name}`); } setFocus(true); NS.toast(`1:1 with ${p.first} started`, { desc: 'Focus mode on — Esc to exit. Block 1 · Personal check-in. Listen 90%.', type: 'info' }); } paint(); };
      root.querySelector('[data-skip]').onclick = () => { if (RUN.pid !== pid) return; RUN.elapsed = Math.min(TOTAL, (blockIdx(RUN.elapsed) + 1) * 600); RUN.last = Date.now(); const bi = blockIdx(RUN.elapsed); if (RUN.elapsed < TOTAL) NS.toast(`Block ${bi + 1} · ${BLOCKS[bi].title}`, { desc: BLOCKS[bi].line, type: 'info' }); paint(); };
      root.querySelector('[data-reset]').onclick = () => { RUN.elapsed = 0; RUN.running = false; RUN.notified = {}; paint(); NS.toast('Timer reset', { type: 'info' }); };
      root.querySelectorAll('[data-goto]').forEach((b) => b.onclick = () => { const el = root.querySelector('#blk-' + b.dataset.goto); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); const ta = el.querySelector('textarea'); if (ta) setTimeout(() => ta.focus({ preventScroll: true }), 350); } });
      const dis = root.querySelector('[data-discard]'); if (dis) dis.onclick = () => { RUN.running = false; RUN.elapsed = 0; RUN.pid = pid; RUN.notified = {}; NS.refresh(); };
      root.querySelectorAll('[data-note]').forEach((t) => t.oninput = () => { draft.blocks[+t.dataset.note] = t.value; save(); });
      const act = root.querySelector('[data-action]'); act.oninput = () => { draft.action = act.value; save(); };
      root.querySelectorAll('[data-use]').forEach((pr) => pr.onclick = () => { const ta = pr.closest('.block-body').querySelector('textarea'); const q = pr.dataset.use; if (!ta.value.includes(q)) { ta.value = (ta.value ? ta.value.replace(/\s+$/, '') + '\n\n' : '') + `Q: ${q}\n`; ta.dispatchEvent(new Event('input')); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } });
      root.querySelectorAll('[data-hist]').forEach((h) => h.onclick = () => { const e = (S.history[pid] || [])[+h.dataset.hist]; NS.drawer({ eyebrow: `1:1 · ${F.date(e.date, 'full')}`, title: p.name, sub: `${Math.round(e.dur / 60)} minutes · ${CADENCE_LABEL[p.oneOnOnes]} cadence`, body: `<div class="grid gap-4">${BLOCKS.map((b, i) => `<div><div class="lfg-label">${b.n}. ${b.title}</div><p class="serif ink" style="font-size:17px;line-height:1.55">${NS.esc(e.blocks[i] || '—')}</p></div>`).join('')}${e.action ? `<div class="ns-alert brand">${ic('check-circle')}<div><b>Action item</b><p>${NS.esc(e.action)}</p></div></div>` : ''}</div>` }); });
      root.querySelector('[data-finish]').onclick = () => {
        const dur = RUN.pid === pid ? Math.round(RUN.elapsed) : 0; const filled = draft.blocks.filter((b) => b && b.trim()).length;
        if (!dur && !filled) { NS.toast('Nothing to save yet', { desc: 'Start the timer or write a note first.', type: 'warn' }); return; }
        const next = ISO(U.addDays(TODAY, CADENCE_DAYS[p.oneOnOnes] || 14));
        NS.modal({ title: `Finish 1:1 with ${p.first}?`, sub: `${dur ? Math.max(1, Math.round(dur / 60)) + ' minutes on the clock' : 'No timer'} · ${filled} of 3 blocks have notes`, size: 'lg', body: `<div class="grid gap-3">${BLOCKS.map((b, i) => `<div class="flex gap-3 items-start"><span class="ns-badge ${draft.blocks[i] && draft.blocks[i].trim() ? 'ok' : 'neutral'} sq" style="min-width:26px;justify-content:center">${b.n}</span><div class="min-w-0"><b class="sm">${b.title}</b><p class="serif ink2" style="white-space:pre-wrap;font-size:15.5px;line-height:1.5">${NS.esc(draft.blocks[i] && draft.blocks[i].trim() ? draft.blocks[i] : 'No notes')}</p></div></div>`).join('')}<div class="ns-alert ${draft.action ? 'brand' : 'warn'}">${ic(draft.action ? 'check-circle' : 'alert-triangle')}<div><b>${draft.action ? 'Action item' : 'No action item yet'}</b><p>${draft.action ? NS.esc(draft.action) : 'The guide’s rule: never leave without one thing you will unblock. You can still save.'}</p></div></div><div class="sm muted">Saving logs today’s 1:1, resets ${p.first}’s cadence and books the follow-up for <b class="ink">${F.date(next, 'long')}</b>.</div></div>`, actions: [{ label: 'Keep going' }, { label: 'Save & schedule follow-up', cls: 'primary', icon: 'calendar', onClick: () => { (S.history[pid] = S.history[pid] || []).unshift({ date: TODAY_ISO, dur: dur || 1500, blocks: draft.blocks.slice(), action: draft.action || '' }); S.last[pid] = TODAY_ISO; delete S.drafts[pid]; RUN.running = false; RUN.elapsed = 0; RUN.notified = {}; saveNow(); log(`Finished a 1:1 with ${p.name}`); setFocus(false); NS.toast(`Follow-up with ${p.first} scheduled`, { desc: `${F.date(next, 'long')} · 30 min · recurring ${CADENCE_LABEL[p.oneOnOnes].toLowerCase()}`, action: { label: 'Next due', onClick: () => { const w = weekList(me.id); NS.go('/one-on-one', { r: w.ones[0] ? w.ones[0].p.id : pid }); } } }); NS.refresh(); } }] });
      };
    },
  };

  /* ------------------------------------------------------------------ */
  /* Culture KPIs — a scorecard you can read top to bottom               */
  /* ------------------------------------------------------------------ */
  const kpiDetail = (k, kv) => { const x = kv.extra[k.id]; switch (k.id) { case 'clarity': return `${x.have} of ${F.int(x.n)} roles mapped`; case 'alignment': return `<span class="qmarks">${x.q.map((v, i) => `<i class="${i === 2 && v < 100 ? 'pend' : ''}" data-tip="Q${i + 1} · ${v}%">Q${i + 1}</i>`).join('')}</span> <span class="muted">Q3 ${x.have} of ${F.int(x.n)} set</span>`; case 'comms': return `${x.weekly} of ${F.int(x.n)} weekly · ${x.cad.biweekly || 0} bi-weekly · ${(x.cad.monthly || 0) + (x.cad.rare || 0)} monthly or rarer`; case 'retention': return `${x.hp} high performers · ${x.exits} regretted exit${x.exits === 1 ? '' : 's'} in 12 months${x.hp <= 10 ? ` <span class="dots" data-tip="${x.hp} kept · ${x.exits} lost">${U.range(x.hp).map(() => '<i></i>').join('')}${U.range(x.exits).map(() => '<i class="off"></i>').join('')}</span>` : ''}`; case 'enps': return `${x.pr} promoters · ${x.de} detractor${x.de === 1 ? '' : 's'} · ${F.int(x.n)} responses${x.n < 15 ? ' · small sample, treat as directional' : ''}`; case 'growth': return `${x.internal} of ${x.filled} leadership roles filled internally · org-wide, trailing 12 months`; default: return ''; } };
  const kpiColor = (st) => (st.cls === 'ok' ? 'var(--viz-good)' : st.cls === 'warn' ? 'var(--viz-warn)' : 'var(--viz-critical)');
  const kpiRow = (k, kv, seedKey) => { const v = kv.v[k.id], st = kpiStatus(k, v), ch = chapterById(k.chapter); return `<div class="sc-row"><div class="sc-name"><div class="k">${ic(k.icon, { size: 13 })}${k.short}${k.orgOnly ? ' · org-level' : ''}</div><h3>${k.name}</h3><div class="def">${k.def}</div><div class="why">${k.why}</div></div><div class="sc-val"><div class="top"><span class="val">${fmtKpi(k, v)}${k.id === 'enps' ? '<small>eNPS</small>' : ''}</span>${NS.badge(st.label, st.cls, true)}</div><div class="tgt">Target ${k.targetLabel} · ${Math.round(U.clamp(st.a, 0, 9.99) * 100)}% of target</div><div class="bar-t" style="--c:${kpiColor(st)}" role="img" aria-label="${k.name}: ${fmtKpi(k, v)} against a target of ${k.targetLabel}"><i style="width:${U.clamp(v, 0, 100)}%"></i><b style="left:calc(${k.target}% - 1px)"></b></div><div class="det">${kpiDetail(k, kv)}</div></div><div class="sc-trend"><div class="lfg-label" style="margin:0">Six quarters</div>${NS.spark(kpiTrend(k, v, seedKey), { color: kpiColor(st), height: 44, area: false })}<div class="xs muted">Q2 ’25 → Q3 ’26</div></div><div class="sc-tip"><span class="h">How to move it</span><span>${k.tip} <a href="${NS.link('/playbook/' + ch.id)}">Chapter ${ch.num} · ${ch.label}</a></span></div></div>`; };
  R['/kpis'] = {
    title: 'Culture KPIs',
    render: (c) => {
      const isHR = c.persona.id === 'hrbp'; const dept = isHR ? (c.query.dept || '') : ''; const sc = scopeFor(c.persona, dept || undefined); const kv = kpiValues(sc);
      const seedKey = sc.label; const on = KPIS.filter((k) => kpiStatus(k, kv.v[k.id]).cls === 'ok').length;
      return html`${NS.pageHead({ eyebrow: 'Tools · Performance-driven culture blueprint', title: 'Culture KPIs', sub: `What gets measured, gets managed. Six numbers, each with a target, a definition and the chapter that moves it, computed for <b>${NS.esc(sc.label)}</b> (${F.int(sc.people.length)} people${sc.managers.length > 1 ? ` · ${sc.managers.length} managers` : ''}). ${on} of ${KPIS.length} on target.`, actions: `${isHR ? `<label class="sr-only" for="deptSel">Scope</label><select class="ns-select" style="width:auto" id="deptSel"><option value="">Whole company</option>${D.departments.map((d) => `<option ${d.name === dept ? 'selected' : ''}>${d.name}</option>`).join('')}</select>` : ''}<button class="ns-btn secondary" data-export>${ic('download')}Export scorecard</button>` })}
        <div class="pillars">${PILLARS.map(([t, b]) => `<div class="pillar"><b>${t}</b><span>${b}</span></div>`).join('')}</div>
        <div class="score">${KPIS.map((k) => kpiRow(k, kv, seedKey)).join('')}</div>
        <div class="ns-grid c2 mt-4">
          ${NS.card({ title: 'Current vs target', sub: 'Percentages and eNPS points share one 0–100 scale · grey is the target', body: '<div id="kpiBars"></div>' })}
          ${NS.card({ title: 'Definitions', sub: 'The blueprint, verbatim', bodyCls: 'flush', body: `<div class="ns-table-wrap"><table class="ns-table dense"><thead><tr><th>KPI</th><th>Target</th><th>Definition</th></tr></thead><tbody>${KPIS.map((k) => `<tr><td><b>${k.name}</b></td><td class="nowrap">${k.targetLabel}</td><td class="sm">${k.def}</td></tr>`).join('')}</tbody></table></div>` })}
        </div>
        ${c.persona.id !== 'manager' ? `<div class="ns-card mt-4"><div class="ns-card-head"><div><h3>Managers × KPIs</h3><p>Attainment against target for the ${Math.min(14, sc.managers.filter((m) => D.reports(m.id).length >= 5).length)} largest teams in ${NS.esc(sc.label)} · darker is closer to target · click a cell for the detail · Career Growth is measured at org level only</p></div></div><div class="ns-card-body heat-compact"><div id="kpiHeat"></div></div></div>` : `<div class="ns-ai mt-4"><div><div class="ns-ai-head">${ic('sparkles')} Where to spend your next 1:1 <span class="ns-badge">Rule-based summary</span></div><p class="serif" style="font-size:16.5px;line-height:1.55;color:var(--ink)">${kpiNarrative(kv, sc)}</p></div></div>`}`;
    },
    mounted: (c, root) => {
      markTool(c.persona, 'kpis');
      const isHR = c.persona.id === 'hrbp'; const dept = isHR ? (c.query.dept || '') : ''; const sc = scopeFor(c.persona, dept || undefined); const kv = kpiValues(sc);
      NS.chart.bars(root.querySelector('#kpiBars'), { labels: KPIS.map((k) => k.short), series: [{ name: 'Current', values: KPIS.map((k) => Math.round(kv.v[k.id])), color: 'var(--np)' }, { name: 'Target', values: KPIS.map((k) => k.target), color: 'var(--surface-4)' }], height: 240, yMax: 100, showValues: 'all', yFormat: (v) => String(v) });

        </div>
        <div class="sec-title"><div><h2>Cohorts</h2><p>Average share of the five chapters read, per cohort.</p></div></div>
        <div class="cohorts">${cohorts.map((co) => `<div class="cohort">${NS.ring({ value: co.pct / 100, size: 72, thickness: 7, label: co.pct + '%', color: co.pct >= 60 ? 'var(--viz-good)' : 'var(--np)' })}<div class="min-w-0"><b>${co.name}</b><span>${co.n} managers · ${co.enrolled} enrolled</span><div class="xs muted mt-1">${co.desc}</div></div></div>`).join('')}</div>
        <div class="ns-card mt-4"><div class="ns-card-head"><div><h3>Managers</h3><p>Click a row for the manager’s reading, cadence and nudge history · active = opened the guide in the last 7 days</p></div></div><div class="ns-card-body tight" style="padding-bottom:0"><div class="ns-toolbar"><div class="ns-input-wrap grow" style="max-width:320px">${ic('search')}<input class="ns-input" id="aq" value="${NS.esc(c.query.q || '')}" placeholder="Search managers or teams" aria-label="Search managers or teams"></div><select class="ns-select" style="width:auto" id="aDept" aria-label="Department"><option value="">All departments</option>${D.departments.map((d) => `<option>${d.name}</option>`).join('')}</select><div class="ns-seg" id="aStatus" role="group" aria-label="Status">${[['', 'All'], ['Active', 'Active'], ['Quiet', 'Quiet'], ['Lapsed', 'Lapsed'], ['Not enrolled', 'Not enrolled']].map(([v, l]) => `<button data-st="${v}" aria-pressed="${!v}">${l}<span class="xs faint tnum">${v ? ad.filter((a) => adoptStatus(a).label === v).length : ad.length}</span></button>`).join('')}</div></div></div><div id="adoptTable"></div></div>`;
    },
    mounted: (c, root) => {
      markTool(c.persona, 'adoption');
      const ad = MANAGERS.map(adoptionOf); const en = ad.filter((a) => a.enrolled); const active = en.filter((a) => a.lastActive <= 7).length;
      NS.chart.line(root.querySelector('#adoptLine'), { labels: ['Aug 3', 'Aug 10', 'Aug 17', 'Aug 24', 'Aug 31', 'Sep 7', 'Sep 14', 'Sep 21'], series: [{ name: 'Active managers', values: [31, 34, 38, 41, 45, 47, 52, active], color: 'var(--np)' }, { name: 'Chapters marked read', values: [40, 52, 61, 58, 70, 74, 81, 77], color: 'var(--viz-1)' }], height: 220, yMin: 0, endLabels: true });
      NS.chart.hbars(root.querySelector('#adoptChapters'), { items: CH.map((ch, i) => ({ label: ch.label, value: Math.round(U.pctOf(en.filter((a) => a.read > i).length, en.length)), sub: `${en.filter((a) => a.read > i).length} managers`, color: `var(--ch-${ch.id})` })), max: 100, format: (v) => v + '%', valueLabel: 'Read' });
      const tbl = NS.table(root.querySelector('#adoptTable'), { rows: ad.map((a) => ({ ...a, id: a.m.id })), rowKey: 'id', pageSize: 12, onRow: (a) => adoptDrawer(a), sort: { key: 'score' }, searchKeys: [(a) => a.m.name, (a) => a.m.team, (a) => a.m.dept], search: c.query.q || '', columns: [
        { key: 'name', label: 'Manager', render: (a) => personLink(a.m, `${a.m.team} · ${a.m.dept} · ${a.team} reports`, NS.link('/kpis')), sort: (a) => a.m.name },
        { key: 'read', label: 'Chapters read', render: (a) => `<div style="min-width:110px"><div class="flex justify-between xs muted"><span>${a.read}/5</span><span>${a.tools} tools</span></div><div class="shelf" style="height:6px;margin:4px 0 0">${CH.map((ch, i) => `<i class="chc-${ch.id} ${i < a.read ? 'read' : ''}" style="flex:1"></i>`).join('')}</div></div>`, sort: (a) => a.read },
        { key: 'score', label: '1:1 cadence', align: 'right', render: (a) => `<b class="${a.score >= 75 ? 'ok-text' : a.score >= 50 ? 'warn-text' : 'bad-text'}" data-tip="${a.weekly}% of reports weekly">${a.score}%</b>`, sort: (a) => a.score },
        { key: 'crucible', label: 'Crucible', render: (a) => (a.crucible ? `<span class="ns-badge brand sq">${a.crucible.replace('The ', '')}</span>` : '<span class="faint">—</span>'), sort: (a) => a.crucible || '' },
        { key: 'last', label: 'Last active', render: (a) => (a.lastActive == null ? '<span class="faint">—</span>' : a.lastActive === 0 ? 'Today' : `${a.lastActive}d ago`), sort: (a) => (a.lastActive == null ? 999 : a.lastActive) },
        { key: 'status', label: 'Status', render: (a) => { const s = adoptStatus(a); return NS.badge(s.label, s.cls, true); }, sort: (a) => ['Active', 'Quiet', 'Lapsed', 'Not enrolled'].indexOf(adoptStatus(a).label) },
        { key: 'act', label: 'Actions', sort: false, align: 'right', render: (a) => `<button class="ns-btn xs ${adoptStatus(a).cls === 'ok' ? 'ghost' : 'secondary'}" data-nudge="${a.m.id}" aria-label="Nudge ${NS.esc(a.m.first)}" data-tip="Nudge ${NS.esc(a.m.first)}">${ic('bell')}Nudge${S.nudges[a.m.id] ? ` · ${S.nudges[a.m.id]}` : ''}</button>` },
      ], dense: true, empty: { icon: 'search', title: 'No managers match', body: 'Try another department or status.' } });
      let st = '', dept = '';
      const apply = () => tbl.setFilter((a) => (!dept || a.m.dept === dept) && (!st || adoptStatus(a).label === st));
      root.querySelector('#aq').oninput = (e) => tbl.setSearch(e.target.value);
      root.querySelector('#aDept').onchange = (e) => { dept = e.target.value; apply(); };
      root.querySelectorAll('#aStatus button').forEach((ch) => ch.onclick = () => { st = ch.dataset.st; root.querySelectorAll('#aStatus button').forEach((x) => x.setAttribute('aria-pressed', x === ch)); apply(); });
      root.addEventListener('click', (e) => { const b = e.target.closest('[data-nudge]'); if (b) { e.stopPropagation(); nudge(b.dataset.nudge); } });
      root.querySelector('[data-export]').onclick = () => downloadCsv('field-guide-adoption.csv', [['Manager', 'Team', 'Department', 'Reports', 'Chapters read', 'Tools used', '1:1 cadence score', 'Weekly 1:1 %', 'Crucible', 'Last active (days)', 'Status'], ...tbl.rows().map((a) => [a.m.name, a.m.team, a.m.dept, a.team, a.read, a.tools, a.score, a.weekly, a.crucible || '', a.lastActive == null ? '' : a.lastActive, adoptStatus(a).label])]);
      root.querySelector('[data-nudge-lapsed]').onclick = async () => { const ids = ad.filter((a) => adoptStatus(a).label === 'Lapsed').map((a) => a.m.id); if (!ids.length) { NS.toast('Nobody is lapsed', { type: 'info' }); return; } if (await NS.confirm({ title: `Nudge ${ids.length} lapsed managers?`, body: 'One digest each with their unread chapters, their team’s 1:1 cadence and a link to the Q3 reset session.', confirmLabel: 'Send nudges' })) { ids.forEach((id) => S.nudges[id] = (S.nudges[id] || 0) + 1); saveNow(); log(`Nudged ${ids.length} lapsed managers`); NS.toast(`Nudges sent to ${ids.length} managers`, { type: 'info' }); tbl.refresh(); } };
    },
  };

  /* ------------------------------------------------------------------ */
  /* Boot                                                                */
  /* ------------------------------------------------------------------ */
  const personas = [
    { ...D.personas.manager, note: 'Playbook + tools for your team' },
    { ...D.personas.hrbp, note: 'Playbook + adoption analytics' },
    { ...D.personas.exec, note: 'Playbook + org-level KPIs' },
  ];
  const dueCount = () => weekList(MGR_ID).ones.length;
  const MARK = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H18v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H18v-3"/><path class="rib" d="M13 3h3.2v7.2l-1.6-1.2-1.6 1.2z"/></svg>';
  NS.app({
    id: 'leaders-field-guide', name: 'The Leader’s Field Guide', sub: 'Northstar Labs', category: 'The manager’s handbook', brand: 'amber', version: '4.0',
    get create() { const pid = NS.persona ? NS.persona.id : 'manager'; if (pid === 'manager') return { label: 'Start a 1:1 with the next report due', createLabel: 'Start a 1:1', run: () => { const w = weekList(MGR_ID); NS.go('/one-on-one', { r: w.ones[0] ? w.ones[0].p.id : '' }); } }; if (pid === 'hrbp') return { label: 'Nudge managers under the 75% cadence line', createLabel: 'Nudge managers', run: () => NS.go('/adoption') }; return { label: 'Open the culture KPI scorecard', createLabel: 'KPI scorecard', run: () => NS.go('/kpis') }; },
    mark: MARK,
    searchHint: 'chapters, scripts, people and actions',
    about: { tagline: 'The manager’s handbook: a high-performance team without the stress.', description: 'A manager playbook organised around the year — Q1 strategy, Q2 execution, Q3 review, Q4 planning — with the tools wrapped around it: a 30-minute 1:1 runner with a focus mode that saves notes per report, a script library with copy-paste emails, six culture KPIs computed from the team, a career ladder mapped to Northstar levels, the Crucible leadership test and, for the People team, adoption analytics across every manager.', highlights: [{ icon: 'book-open', title: 'Five readable chapters', body: 'Tables, traps, scripts and emails from the guide, set for reading, with a thumb index and progress tracking.' }, { icon: 'timer', title: '1:1 Runner', body: 'Three 10-minute blocks, a session clock, data-aware prompts, notes and history per report.' }, { icon: 'bar-chart', title: 'Culture KPIs', body: 'Six targets computed for a team, a department or the company — plus a managers × KPIs heatmap.' }, { icon: 'flame', title: 'The Crucible', body: 'Seven dilemmas, four archetypes, every option scored. Keyboardable.' }] },
    personas, defaultPersona: 'manager',
    nav: (persona) => {
      const pr = progressOf(persona);
      const playbook = { group: 'Contents', items: CH.map((ch) => ({ id: 'pb-' + ch.id, label: ch.label, icon: ch.id === 'overview' ? 'book-open' : QUARTERS.find((q) => q.id === ch.id).icon, route: '/playbook/' + ch.id, badge: pr.read[ch.id] ? '✓' : '' })) };
      const tools = persona.id === 'manager' ? [{ id: 'one-on-one', label: '1:1 Runner', icon: 'timer', badge: dueCount() || '' }, { id: 'scripts', label: 'Script library', icon: 'message-square' }, { id: 'kpis', label: 'Culture KPIs', icon: 'bar-chart' }, { id: 'ladder', label: 'Career ladder', icon: 'layers' }]
        : [{ id: 'kpis', label: 'Culture KPIs', icon: 'bar-chart' }, { id: 'scripts', label: 'Script library', icon: 'message-square' }, { id: 'ladder', label: 'Career ladder', icon: 'layers' }];
      const out = [{ group: '', items: [{ id: 'home', label: persona.id === 'hrbp' ? 'Home' : 'This week', icon: 'home' }] }, playbook, { group: 'Tools', items: tools }, { group: 'Leadership lab', items: [{ id: 'crucible', label: 'The Crucible', icon: 'flame', badge: S.crucible ? 'Done' : '' }] }];
      if (persona.id === 'hrbp') out.push({ group: 'People team', items: [{ id: 'adoption', label: 'Adoption', icon: 'activity', badge: MANAGERS.map(adoptionOf).filter((a) => adoptStatus(a).label === 'Lapsed').length || '' }] });
      return out;
    },
    promo: (persona) => { const st = readingStats(persona); return { title: st.next ? `Next: ${st.next.label}` : 'Playbook complete', body: st.next ? `${st.read} of ${st.chapters} chapters read · ${readMinutesOf(st.next)} min to finish the next one` : `All ${st.chapters} chapters read · ${st.used} of ${st.tools} tools used`, progress: st.pct, action: st.next ? { label: 'Continue reading', route: '/playbook/' + st.next.id } : { label: 'Take the Crucible', route: '/crucible' } }; },
    notifications: [{ icon: 'calendar', title: 'Q3 calibration prep starts Oct 5', body: 'Manager reviews open on 5 Oct — read the Q4 chapter on the 9-box and rating scripts first.', time: 'Today', route: '/playbook/q4' }, { icon: 'timer', title: '1:1 with Kavya overdue', body: 'Last held 3 Sep · weekly cadence. Reschedule, never cancel.', time: 'Today', route: '/one-on-one?r=NS-1209' }, { icon: 'message-square', title: 'New script added: mid-year reset', body: 'The Mid-Year Reset email and the Drifter → Builder script are in the library.', time: 'Yesterday', route: '/scripts?f=reset' }],
    routes: R, default: '/home',
    onRoute: (ctx) => { if (ctx.route.path !== '/one-on-one' && document.documentElement.dataset.session) setFocus(false); },
    commands: (persona) => [
      ...(persona.id === 'manager' ? [{ label: 'Start a 1:1', icon: 'timer', group: 'Actions', run: () => { const w = weekList(MGR_ID); NS.go('/one-on-one', { r: w.ones[0] ? w.ones[0].p.id : '' }); } }] : []),
      { label: 'Take the Crucible', icon: 'flame', group: 'Actions', run: () => { QUIZ.phase = 'quiz'; QUIZ.i = 0; QUIZ.answers = []; NS.go('/crucible'); } },
      { label: 'Copy the “Quick update on how we work” email', icon: 'copy', group: 'Actions', run: () => { const e = EMAILS[0]; copyText(`Subject: ${e.subject}\n\n${plain(e.body)}`, `Email · ${e.subject}`); } },
      { label: 'Export the KPI scorecard', icon: 'download', group: 'Actions', run: () => NS.go('/kpis') },
      { label: 'Mark all chapters read', icon: 'check-circle', group: 'Playbook', run: () => { const pr = progressOf(persona); CH.forEach((ch) => pr.read[ch.id] = 1); saveNow(); NS.toast('All chapters marked read'); NS.refresh(); } },
      { label: 'Reset my reading progress', icon: 'undo', group: 'Playbook', run: () => { S.progress[persona.id] = { read: {}, tools: {} }; saveNow(); NS.toast('Reading progress reset', { type: 'info' }); NS.refresh(); } },
    ],
    search: (q) => { if (q.length < 2) return []; const ql = q.toLowerCase(); const out = []; CH.forEach((ch) => ch.sections.forEach((s) => { if (s.title.toLowerCase().includes(ql) || ch.title.toLowerCase().includes(ql)) out.push({ group: 'Playbook', label: s.title, hint: ch.label, run: () => NS.go('/playbook/' + ch.id, { s: s.id }) }); })); P.SCRIPTS.forEach((s) => { const txt = `${s.title || ''} ${s.dont || ''} ${s.say || ''} ${s.before ? s.before.name + ' ' + s.after.name : ''}`.toLowerCase(); if (txt.includes(ql)) out.push({ group: 'Scripts', label: s.title || `${s.before.name} → ${s.after.name}`, hint: 'Script library', run: () => NS.go('/scripts', { q }) }); }); EMAILS.forEach((e) => { if (e.subject.toLowerCase().includes(ql)) out.push({ group: 'Scripts', label: e.subject, hint: 'Email', run: () => NS.go('/scripts', { f: 'emails', q }) }); }); const ppl = NS.persona.id === 'manager' ? teamOf(MGR_ID) : MANAGERS; ppl.filter((p) => p.name.toLowerCase().includes(ql)).slice(0, 5).forEach((p) => out.push({ group: 'People', label: p.name, hint: p.title, avatar: NS.avatar(p, { size: 'xs' }), run: () => (NS.persona.id === 'manager' ? NS.go('/one-on-one', { r: p.id }) : NS.persona.id === 'hrbp' ? NS.go('/adoption', { q: p.name }) : NS.go('/kpis')) })); return out.slice(0, 10); },
    onReset: () => P.store.clear(),
  });
})();
</script>
</body>
</html>

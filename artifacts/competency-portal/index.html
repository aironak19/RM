<!doctype html>
<html lang="en" data-brand="violet">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Competency Portal · Northstar Labs</title>
<meta name="description" content="Competency Portal — the Northstar Labs engineering career framework: 16 levels across the individual-contributor and management tracks, competency descriptors, promotion criteria, self-assessment, development plans and team readiness. Concept prototype with illustrative data, designed by Ronak Mehta.">
<meta name="theme-color" content="#7C3AED">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='13' fill='%237C3AED'/%3E%3Cpath d='M24 11 10 18l14 7 14-7z' fill='%23fff'/%3E%3Cpath d='M10 25l14 7 14-7M10 32l14 7 14-7' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/ns.css">
<script src="../shared/ns.js"></script>
<script src="../shared/ns-data.js"></script>
<style>
  /* ---------- level chips (consistent everywhere) ---------- */
  .lv{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 9px 0 6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink-2);text-decoration:none;white-space:nowrap;max-width:100%}
  .lv code{font-family:var(--font-mono);font-size:11.5px;font-weight:500;padding:1px 5px;border-radius:5px;background:var(--brand-soft);color:var(--brand-text);letter-spacing:.01em}
  .lv.m code{background:var(--info-bg);color:var(--info)}
  .lv.sm{height:22px;font-size:11.5px;gap:5px;padding:0 7px 0 4px}.lv.sm code{font-size:10.5px}
  .lv.lg{height:32px;font-size:13.5px;gap:8px;padding:0 12px 0 7px;border-radius:10px}.lv.lg code{font-size:12.5px;padding:2px 7px}
  a.lv:hover{border-color:var(--brand);color:var(--ink)}
  .lv.me{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .code-big{font-family:var(--font-mono);font-size:34px;font-weight:500;letter-spacing:-.02em;color:var(--brand-text);line-height:1}
  .track-pill{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  /* ---------- ladders on home ---------- */
  .ladders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  @media (max-width:900px){.ladders{grid-template-columns:minmax(0,1fr)}}
  .ladder{display:grid;gap:6px;position:relative;padding:4px 0}
  .ladder,.mini-ladder{grid-template-columns:minmax(0,1fr)}
  .ladder .step{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);text-decoration:none;color:inherit;margin-left:calc(var(--i) * 4.2%);width:calc(100% - var(--i) * 4.2%);box-sizing:border-box;transition:border-color var(--dur),transform var(--dur),box-shadow var(--dur);position:relative}
  .ladder .step:hover{border-color:var(--brand);transform:translateX(2px);box-shadow:var(--shadow-sm)}
  .ladder .step.me{border-color:var(--brand);background:var(--brand-soft)}
  .ladder .step.next{border-style:dashed;border-color:var(--brand-400)}
  .ladder .step .t{font-weight:600;font-size:13.5px;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ladder .step .t small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-3);white-space:normal;line-height:1.3}
  .ladder .step .n{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none;text-align:right}
  .ladder .step .n i{display:block;height:3px;border-radius:2px;background:var(--brand-300,var(--brand-200));margin-top:4px;margin-left:auto;min-width:2px}
  .ladder .step .tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-text);position:absolute;top:-8px;right:12px;background:var(--surface);padding:0 6px;border-radius:99px;border:1px solid var(--brand-line)}
  @media (max-width:560px){.ladder .step{margin-left:calc(var(--i) * 2%);width:calc(100% - var(--i) * 2%)}}
  /* ---------- competency cards ---------- */
  .comp-card{display:grid;grid-template-columns:38px 1fr;gap:12px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);min-width:0}
  .comp-card h4{font-size:14px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .comp-card h4 .alias{font-size:11px;font-weight:500;color:var(--ink-4)}
  .comp-card p{font-size:13px;color:var(--ink-2);line-height:1.55}
  .comp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  @media (max-width:900px){.comp-grid{grid-template-columns:minmax(0,1fr)}}
  /* ---------- criteria checklist ---------- */
  .crit{display:grid;gap:8px}
  .crit label{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-radius:12px;border:1px solid var(--line-2);cursor:pointer;transition:background var(--dur)}
  .crit label:hover{background:var(--surface-2)}
  .crit label.done{background:var(--ok-bg);border-color:transparent}
  .crit label.done .t{text-decoration:line-through;color:var(--ink-3)}
  .crit .t{font-size:13.5px;font-weight:500;line-height:1.45}
  .crit .s{font-size:12px;color:var(--ink-3);margin-top:2px}
  .quote{position:relative;padding:18px 22px 18px 26px;border-radius:14px;background:var(--brand-soft);font-family:var(--font-display);font-size:17px;font-weight:600;line-height:1.45;color:var(--ink);letter-spacing:-.01em}
  .quote::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:4px;background:var(--brand)}
  .bul{display:grid;gap:8px}
  .bul div{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2)}
  .bul div svg{width:15px;height:15px;color:var(--brand);flex:none;margin-top:2px}
  .path{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  @media (max-width:1100px){.path{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:560px){.path{grid-template-columns:minmax(0,1fr)}}
  .path .pc{display:grid;gap:10px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);align-content:start}
  .path .pc .k{font-family:var(--font-mono);font-size:11px;color:var(--brand-text)}
  .path .pc b{font-size:14px;line-height:1.3}
  .path .pc p{font-size:12.5px;color:var(--ink-3);line-height:1.5}
  .lvl-nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .avatars{display:flex}.avatars .ns-avatar{margin-left:-8px;box-shadow:0 0 0 2px var(--surface)}.avatars .ns-avatar:first-child{margin-left:0}
  .mini-ladder{display:grid;gap:3px}
  .mini-ladder a{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;font-size:12px;text-decoration:none;color:var(--ink-2)}
  .mini-ladder a:hover{background:var(--surface-2)}
  .mini-ladder a[aria-current="true"]{background:var(--brand-soft);color:var(--brand-text);font-weight:600}
  .mini-ladder code{font-family:var(--font-mono);font-size:11px;width:34px;flex:none}
  /* ---------- compare ---------- */
  .cmp-row{display:grid;grid-template-columns:150px 1fr 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--line-2);align-items:start}
  .cmp-row:first-child{border-top:0}
  .cmp-row .h{display:flex;gap:10px;align-items:flex-start}
  .cmp-row .h b{font-size:13.5px;line-height:1.3}
  .cmp-row .h .alias{display:block;font-size:11px;color:var(--ink-4);font-weight:400;margin-top:2px}
  .cmp-row p{font-size:13.5px;line-height:1.6;color:var(--ink-2)}
  .cmp-row p.none{color:var(--ink-4);font-style:italic}
  .cmp-row mark{background:var(--brand-soft);color:var(--brand-text);font-weight:600;padding:0 1px;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  @media (max-width:900px){.cmp-row{grid-template-columns:minmax(0,1fr)}.cmp-row p::before{content:attr(data-side);display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);margin-bottom:4px}}
  .cmp-pick{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end}
  @media (max-width:720px){.cmp-pick{grid-template-columns:1fr 1fr}.cmp-pick .swap{grid-column:1/-1;justify-self:center}}
  .chg{display:flex;gap:8px;flex-wrap:wrap}
  .chg span{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:99px;font-size:12.5px;font-weight:500;border:1px solid var(--line)}
  .chg span.add{background:var(--ok-bg);color:var(--ok);border-color:transparent}.chg span.drop{background:var(--warn-bg);color:var(--warn);border-color:transparent}.chg span.mod{background:var(--brand-soft);color:var(--brand-text);border-color:transparent}
  /* ---------- matrix ---------- */
  .mx-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
  .mx{border-collapse:separate;border-spacing:0;min-width:100%;font-size:12.5px}
  .mx th,.mx td{border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);vertical-align:top;padding:10px 12px;min-width:190px;max-width:230px}
  .mx th{position:sticky;top:0;background:var(--surface-2);z-index:2;text-align:left;font-weight:600;font-size:12px}
  .mx th:first-child,.mx td:first-child{position:sticky;left:0;background:var(--surface);z-index:3;min-width:170px;max-width:170px;font-weight:600;box-shadow:1px 0 0 var(--line)}
  .mx th:first-child{z-index:4;background:var(--surface-2)}
  .mx td .cell{display:block;width:100%;text-align:left;color:var(--ink-2);line-height:1.5;border-radius:8px;padding:4px 6px;margin:-4px -6px;cursor:pointer;transition:background var(--dur)}
  .mx td .cell:hover{background:var(--brand-soft);color:var(--ink)}
  .mx td .cell .alias{display:block;font-size:10.5px;color:var(--ink-4);margin-top:3px}
  .mx td .none{color:var(--ink-4);font-style:italic}
  .mx td.hl{background:var(--brand-soft)}
  .mx tr:last-child td{border-bottom:0}
  .mx .first{display:flex;align-items:center;gap:8px}.mx .first svg{width:15px;height:15px;color:var(--brand)}
  /* ---------- assess ---------- */
  .rate-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;padding:18px 0;border-top:1px solid var(--line-2)}
  .rate-row:first-child{border-top:0;padding-top:4px}
  @media (max-width:900px){.rate-row{grid-template-columns:minmax(0,1fr)}}
  .rate-row .d{font-size:13px;color:var(--ink-2);line-height:1.55;margin-top:6px}
  .rate-row h4{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
  .rate-row textarea{min-height:76px;height:auto;padding:9px 12px;resize:vertical;line-height:1.5;font-size:13px}
  .rate-row .ns-rating button{width:34px;height:34px}
  .rate-lbl{font-size:12px;color:var(--ink-3);min-height:16px;margin-top:6px}
  .gap-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px}
  .gap-item:last-child{border-bottom:0}
  .gap-item .sc{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
  .rings{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  .plan-group{display:grid;gap:6px}
  .plan-item{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;border:1px solid var(--line-2)}
  .plan-item:hover{background:var(--surface-2)}
  .plan-item.done .t{text-decoration:line-through;color:var(--ink-3)}
  .plan-item .t{font-size:13.5px;line-height:1.45;font-weight:500}
  .plan-item .s{font-size:12px;color:var(--ink-3);margin-top:2px}
  .plan-item .act{margin-left:auto;display:flex;gap:2px;flex:none;opacity:.55}
  .plan-item:hover .act{opacity:1}
  /* ---------- team ---------- */
  .ready-ok{color:var(--ok)}.ready-dev{color:var(--warn)}.ready-early{color:var(--ink-3)}
  .dist{display:grid;gap:6px}
  /* ---------- misc ---------- */
  .steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  @media (max-width:900px){.steps3{grid-template-columns:minmax(0,1fr)}}
  .steps3 .st{display:grid;gap:8px;padding:14px;border-radius:14px;background:var(--surface-2)}
  .steps3 .st .no{width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:12px;font-weight:700}
  .steps3 .st b{font-size:14px}.steps3 .st p{font-size:12.5px;color:var(--ink-3);line-height:1.5}
  .search-res{display:grid;gap:4px;margin-top:10px}
  .search-res a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;color:inherit;font-size:13px}
  .search-res a:hover{background:var(--surface-2)}
  .search-res a .hint{margin-left:auto;font-size:11.5px;color:var(--ink-4);white-space:nowrap}
  .log-item{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
  .log-item:last-child{border-bottom:0}
  .log-item .v{font-family:var(--font-mono);font-size:12px;color:var(--brand-text);min-width:44px}
  .log-item b{font-size:13.5px}.log-item p{font-size:12.5px;color:var(--ink-3);margin-top:2px;line-height:1.5}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:13px}
  .kv span{color:var(--ink-3)}
  .hero-lv{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:5px 10px;font-size:13px;font-weight:600}
  .hero-lv code{font-family:var(--font-mono);font-weight:500;font-size:12.5px;opacity:.9}
  .ns-tag{height:auto;min-height:24px;padding:3px 9px;white-space:normal;line-height:1.3}.ns-tag svg{width:12px;height:12px;margin-right:5px;flex:none}
  .ns-hero .hero-chips .ns-badge{background:rgba(255,255,255,.16);color:#fff;border-color:transparent}
  @media print{.ns-sidebar,.ns-topbar,.ns-backdrop,.no-print,.ns-toast-wrap{display:none!important}.ns-main{margin:0!important}.ns-content{padding:0!important;max-width:none!important}.ns-card{break-inside:avoid;box-shadow:none}body{background:#fff}}
</style>

<script>
/* ==========================================================================
   Competency Portal · framework content (window.CP_LEVELS)
   The complete 16-level engineering ladder — transcribed faithfully from the
   Engineering Competency Framework v2.0 and corrected where the source was
   defective (P0 criteria duplicated its artifacts; P4.5 Team Influence was
   missing a noun; ticket-tracker vendor name generalised).
   Each competency carries: id (canonical Northstar competency), name (the
   label this level uses) and text (the descriptor). `sustain` appends the
   standard line "Consistent demonstration of all current-level competencies
   over a sustained period." to the promotion criteria.
   ========================================================================== */
window.CP_LEVELS = [
  { code: 'P0', track: 'IC', title: 'Intern', sub: 'Learning-first role focused on skill development',
    scope: 'Completes small tasks under guidance; learns product, codebase and tooling. Typical duration: 3–6 months.',
    comps: [
      { id: 'tech', name: 'Technical Excellence', text: 'Writes simple, correct code; runs tests; follows style and CI guidelines; asks for help early when blocked.' },
      { id: 'design', name: 'System Design', text: 'Understands small functions/modules; reads and comprehends design documentation.' },
      { id: 'delivery', name: 'Delivery & Execution', text: 'Completes assigned tickets from the ticket tracker; follows branch/PR workflow consistently.' },
      { id: 'impact', name: 'Product Impact', text: 'Understands product basics and how features map to user needs.' },
      { id: 'ownership', name: 'Ownership', text: 'Takes ownership of small bug fixes and documentation tasks end-to-end.' },
      { id: 'comms', name: 'Communication', text: 'Communicates blockers effectively; participates actively in standups.' },
    ],
    criteria: ['Demonstrated capabilities in select higher-level competencies.'], sustain: true,
    artifacts: ['Completed task logs', 'Learning journal', 'Mentor feedback'],
    interview: 'Tell me about a small coding task you’ve completed. What did you learn?',
    focus: ['Basic coding skills', 'Learning attitude', 'Communication', 'Problem-solving basics'],
    learning: ['Intro to programming', 'Version control basics', 'Testing fundamentals', 'Team collaboration'] },

  { code: 'P1', track: 'IC', title: 'Associate Engineer', aka: 'Associate', sub: 'Independent delivery of small features with peer review',
    scope: 'Delivers small features independently with peer review; begins contributing to design discussions.',
    comps: [
      { id: 'tech', name: 'Technical Excellence', text: 'Demonstrates foundational proficiency in writing clean, maintainable, production-quality code with comprehensive tests; fixes moderate-complexity bugs; follows established coding guidelines and seeks feedback.' },
      { id: 'design', name: 'System Design', text: 'Proposes reasonable component-level solutions; identifies trade-offs; basic understanding of microservices and cloud-native principles.' },
      { id: 'delivery', name: 'Delivery & Execution', text: 'Delivers single-sprint features reliably with minimal rework; participates in CI/CD pipelines for small projects.' },
      { id: 'ownership', name: 'Ownership', text: 'Owns small services/modules; follows SLIs/SLOs; basic awareness of cost optimization and security best practices like IAM roles.' },
    ],
    criteria: ['Delivers small features independently with peer review.', 'Begins contributing to design discussions.'], sustain: true,
    artifacts: ['PRs with 80%+ approval rate', 'Bug fixes reducing defects by 20%', 'User story acceptance tests'],
    interview: 'Walk me through a recent bug you fixed. What was your debugging process?',
    focus: ['Understanding of basic debugging techniques', 'Code reading and comprehension skills', 'Learning ability and curiosity', 'Communication of technical concepts'],
    learning: ['Codebase fundamentals', 'Testing best practices', 'Code review process', 'Development workflow'] },

  { code: 'P2', track: 'IC', title: 'Software Engineer I / II', aka: 'SE1 · SE2', sub: 'Independent contributor owning moderately complex features across teams',
    scope: 'Owns moderately complex features across services; participates effectively in cross-team work.',
    comps: [
      { id: 'tech', name: 'Technical Excellence', text: 'Demonstrates proficiency in writing clean, maintainable, and scalable code across services; optimizes queries and implements basic algorithms; writes well-tested code.' },
      { id: 'design', name: 'System Design', text: 'Designs subsystems effectively; documents APIs/contracts; considers operational aspects like basic cloud cost models and security risks.' },
      { id: 'delivery', name: 'Delivery & Execution', text: 'Owns complete feature lifecycle; coordinates effectively with QA/product teams; implements basic cost-saving measures like reserved instances.' },
      { id: 'impact', name: 'Product Impact', text: 'Measures feature impact using metrics, A/B testing, or telemetry analysis; identifies cost-saving opportunities in deployments.' },
      { id: 'ownership', name: 'Ownership', text: 'Handles incidents reliably; performs on-call; experience with basic security measures in cloud environments.' },
      { id: 'leadership', name: 'Influence', text: 'Creates clear PRs/documentation; mentors P1 engineers effectively; contributes to code reviews identifying basic issues.' },
    ],
    criteria: ['Owns moderately complex features across services.', 'Participates effectively in cross-team work.'], sustain: true,
    artifacts: ['Feature launches with post-mortems', 'On-call rotations with <5% escalation', 'Mentorship sessions logged'],
    interview: 'Show me a PR you recently wrote. What trade-offs did you consider?',
    focus: ['Code quality and structure', 'Understanding of trade-offs', 'Testing approach', 'Documentation quality'],
    learning: ['System design basics', 'Database fundamentals', 'API design', 'Production monitoring'] },

  { code: 'P3', track: 'IC', title: 'Senior Software Engineer I / II', aka: 'SSE1 · SSE2', sub: 'Technical leader delivering high-complexity projects',
    scope: 'Delivers high-complexity projects; leads small initiatives; mentors team members. Technical lead on medium projects.',
    comps: [
      { id: 'tech', name: 'Technical Excellence', text: 'Demonstrates advanced proficiency in writing clean, maintainable, and scalable code; drives code and test quality standards at team level; advanced algorithms and refactoring for performance.' },
      { id: 'design', name: 'System Design', text: 'Designs moderate-to-large systems; writes clear, comprehensive design docs; owns API versioning; ensures adherence to coding standards.' },
      { id: 'delivery', name: 'Delivery & Execution', text: 'Leads 1–2 person-month projects/rollback strategies; ensures reliable shipping; conducts thorough code reviews for complex issues.' },
      { id: 'impact', name: 'Product Impact', text: 'Collaborates with PMs on prioritization; quantifies/communicates outcomes; proficiency in designing cost-effective cloud solutions.' },
      { id: 'ownership', name: 'Ownership', text: 'Proactively reduces technical debt; improves team SLIs/operational excellence; implements advanced security controls and threat mitigation.' },
      { id: 'leadership', name: 'Influence', text: 'Reviews/approves significant PRs; provides structured mentorship; contributes to hiring; leads code reviews for smaller projects.' },
    ],
    criteria: ['Delivers high-complexity projects.', 'Leads small initiatives; mentors team members.'], sustain: true,
    artifacts: ['Project retrospectives showing 90% on-time delivery', 'Tech talks on design patterns', 'Hiring interview contributions'],
    interview: 'Design a simple feature end-to-end (API, database schema, tests, deployment).',
    focus: ['End-to-end thinking', 'Database design skills', 'API contract design', 'Testing strategy', 'Operational concerns'],
    learning: ['Microservices architecture', 'Performance optimization', 'Security best practices', 'Cross-team collaboration'] },

  { code: 'P4', track: 'IC', title: 'Principal / Senior Principal Engineer', aka: 'Principal · Sr. Principal', sub: 'Domain expert shaping technical strategy across multiple teams',
    scope: 'Leads large technical initiatives; influences architecture decisions; mentors senior engineers.',
    comps: [
      { id: 'tech', name: 'Technical Excellence', text: 'Establishes organization-wide coding standards; drives innovation in tools and processes; expert in performance optimization and scalability.' },
      { id: 'design', name: 'System Design', text: 'Architects complex, distributed systems; evaluates emerging technologies; leads design reviews for major projects.' },
      { id: 'delivery', name: 'Delivery & Execution', text: 'Orchestrates multi-team projects; mitigates risks in high-stakes deliveries; optimizes CI/CD pipelines at scale.' },
      { id: 'impact', name: 'Product Impact', text: 'Drives product architecture aligning with business goals; conducts impact analyses for major features.' },

  const changeSummary = (A, B) => { const a = compsById(A), b = compsById(B); const added = COMPS.filter((c) => b[c.id] && !a[c.id]), dropped = COMPS.filter((c) => a[c.id] && !b[c.id]); const changed = COMPS.filter((c) => a[c.id] && b[c.id] && a[c.id].map((x) => x.text).join(' ') !== b[c.id].map((x) => x.text).join(' ')); const newClauses = U.sum(COMPS.filter((c) => b[c.id]), (c) => { const A2 = new Set((a[c.id] || []).flatMap((x) => clauses(x.text)).map(norm)); return b[c.id].flatMap((x) => clauses(x.text)).filter((cl) => !A2.has(norm(cl))).length; }); return { added, dropped, changed, newClauses }; };

      const cs = critPct(c.persona.id, L.code), st = critState(c.persona.id, L.code);

      root.querySelector('[data-export]').onclick = () => downloadCsv(`competency-matrix-${track}.csv`, [['Competency', ...TRACK[track].map((L) => `${L.code} ${L.title}`)], ...COMPS.map((x) => [x.name, ...TRACK[track].map((L) => (compsById(L)[x.id] || []).map((y) => `${y.name}: ${y.text}`).join(' | '))])]);

  };

  /* ASSESS + PLAN ----------------------------------------------------- */
  const subjectFor = (c) => { const me = meFor(c.persona); if (c.persona.id === 'employee') return me; const pool = c.persona.id === 'manager' ? teamFor(c.persona) : teamFor(c.persona, c.query.org); const pick = c.query.p ? D.byId(c.query.p) : null; if (pick && onLadder(pick)) return pick; if (S.mgrPicks[c.persona.id] && D.byId(S.mgrPicks[c.persona.id]) && !c.query.p) return D.byId(S.mgrPicks[c.persona.id]); return pool.find((p) => p.id === 'NS-1207') || pool[0] || me; };
  const radarFor = (pid, code, who) => { const L = LMAP[code]; if (!L) return COMPS.map(() => 0); const a = getAssess(pid, code, who); const m = compsById(L); return COMPS.map((x) => (m[x.id] ? U.avg(m[x.id].map((y) => (a[y.idx] && a[y.idx].r) || 0)) : 0)); };
  const planProgress = (plan) => { const d = plan.items.filter((i) => i.done).length; return { d, n: plan.items.length, pct: plan.items.length ? Math.round((d / plan.items.length) * 100) : 0 }; };
  R['/assess'] = {
    title: (c) => (c.query.tab === 'plan' ? 'Development plan' : c.persona.id === 'employee' || c.query.p === c.persona.personId ? 'Self-assessment' : 'Assessment'),
    nav: (c) => (c.query.tab === 'plan' ? 'plan' : 'assess'),
    render: (c) => {

      const { cur, next } = personLevels(sub); const lvlKey = c.query.lvl === 'cur' || !next ? 'cur' : 'next'; const code = lvlKey === 'cur' ? cur : next; const L = LMAP[code];
      const tab = c.query.tab === 'plan' ? 'plan' : 'rate';
      const rc = readiness(sub.id, cur, who), rn = next ? readiness(sub.id, next, who) : null; const a = getAssess(sub.id, code, who); const selfA = self ? null : getAssess(sub.id, code, 'self');
      const gaps = next ? gapsFor(sub.id, next, who) : []; const plan = S.plans[sub.id];
      const picker = c.persona.id === 'employee' ? '' : `<div class="flex gap-2 wrap items-end">${c.persona.id === 'hrbp' ? `<label class="ns-field"><span class="ns-label">Org</span><select class="ns-select sm" id="orgSel" style="width:auto">${ORGS.map((o) => `<option ${o === (c.query.org || 'Platform') ? 'selected' : ''}>${NS.esc(o)}</option>`).join('')}</select></label>` : ''}<label class="ns-field"><span class="ns-label">${c.persona.id === 'manager' ? 'Report' : 'Person'}</span><select class="ns-select sm" id="pSel" style="width:auto;max-width:260px"><option value="${me.id}" ${sub.id === me.id ? 'selected' : ''}>Myself · ${me.level}</option>${(c.persona.id === 'manager' ? teamFor(c.persona) : teamFor(c.persona, c.query.org)).filter((p) => p.id !== me.id).map((p) => `<option value="${p.id}" ${p.id === sub.id ? 'selected' : ''}>${NS.esc(p.name)} · ${p.level}</option>`).join('')}</select></label></div>`;
      const head = NS.pageHead({ eyebrow: self ? 'My growth' : `Manager assessment · ${sub.team}`, title: tab === 'plan' ? (self ? 'Development plan' : `${NS.esc(sub.first)}’s development plan`) : self ? 'Self-assessment' : `Assess ${NS.esc(sub.first)} against ${next || cur}`, sub: tab === 'plan' ? `Built from the ${next || cur} learning path, the artifacts a promotion packet needs and the lowest-rated competencies. Tick, edit and add items — it is saved as you go.` : self ? `Rate the evidence you can point to for each competency at your level (${cur}) and the next (${next || '—'}). Ratings and notes save as you type; nothing is shared until you choose to.` : `Your independent view of ${sub.first}’s evidence. ${sub.first}’s own ratings are shown for reference — gaps between the two are where the promotion conversation lives.`, actions: `${picker}<button class="ns-btn secondary no-print" data-export-a>${ic('download')}Export</button><button class="ns-btn secondary no-print" data-print>${ic('printer')}Print</button>${next ? `<button class="ns-btn primary no-print" data-gen>${ic('wand')}${plan ? 'Regenerate plan' : 'Generate development plan'}</button>` : ''}` });
      const tabs = NS.tabs([{ id: 'rate', label: 'Rate evidence', icon: 'clipboard-check', n: `${rc.rated + (rn ? rn.rated : 0)}/${rc.total + (rn ? rn.total : 0)}` }, { id: 'plan', label: 'Development plan', icon: 'route', n: plan ? `${planProgress(plan).d}/${planProgress(plan).n}` : '0' }], tab);
      const top = `<div class="ns-card mb-4"><div class="ns-card-body"><div class="ns-grid c3" style="align-items:center"><div>${ringCard('Current level', rc, { chip: chip(cur, { full: true }) })}</div><div>${next ? ringCard('Next level', rn, { chip: chip(next, { full: true }) }) : `<div class="sm muted">${cur} is the top of its track.</div>`}</div><div id="assessRadar"></div></div></div></div>`;
      let body;
      if (tab === 'rate') {
        body = `<div class="ns-grid main-side"><div>${NS.card({ title: `Evidence against ${code} · ${NS.esc(L.title)}`, sub: `${L.comps.length} dimensions · ${who === 'self' ? 'your rating' : 'your rating as manager'} 1–5 with a note on the proof`, actions: next ? `<div class="ns-seg sm"><button data-lvl="cur" aria-pressed="${lvlKey === 'cur'}">Current ${cur}</button><button data-lvl="next" aria-pressed="${lvlKey === 'next'}">Next ${next}</button></div>` : '', body: L.comps.map((x, i) => { const v = (a[i] && a[i].r) || 0; const sv = selfA ? (selfA[i] && selfA[i].r) || 0 : 0; return `<div class="rate-row"><div><h4><span class="ns-icon-box sm">${ic(iconFor(x))}</span>${NS.esc(x.name)}</h4><div class="d">${NS.esc(x.text)}</div></div><div><div class="flex items-center gap-3 wrap"><div class="ns-rating" data-rate="${i}">${[1, 2, 3, 4, 5].map((n) => `<button data-v="${n}" ${v === n ? 'aria-pressed="true"' : ''} data-tip="${NS.esc(RLBL[n])}">${n}</button>`).join('')}</div>${selfA ? `<span class="sm muted">${sub.first}: <b class="ink">${sv ? sv + '/5' : '—'}</b></span>` : ''}</div><div class="rate-lbl">${v ? RLBL[v] : 'Not rated yet'}</div><textarea class="ns-textarea mt-2" data-ev="${i}" placeholder="${self ? 'Which project, review or decision proves this? Be specific.' : 'What have you observed? Cite the artifact.'}">${NS.esc((a[i] && a[i].e) || '')}</textarea></div></div>`; }).join('') })}</div>
          <div class="grid gap-4">
            ${NS.card({ title: next ? `Gaps toward ${next}` : 'Gaps', sub: gaps.length ? `${gaps.length} dimension${gaps.length === 1 ? '' : 's'} rated 3 or below` : 'Nothing rated 3 or below', body: gaps.length ? gaps.map((g) => `<div class="gap-item"><span class="ns-icon-box sm ${g.r <= 2 ? 'warn' : ''}">${ic(iconFor(g))}</span><span class="min-w-0"><div class="truncate semibold">${NS.esc(g.name)}</div><div class="xs muted truncate">${NS.esc(snippet(g.text, 46))}</div></span><span class="sc">${g.r ? g.r + '/5' : 'unrated'}</span></div>`).join('') : `<div class="sm muted">Rate the next level’s dimensions to see where the plan should focus.</div>` })}
            ${NS.card({ title: 'What counts as evidence', body: `<div class="bul"><div>${ic('check-circle')}<span><b>Specific.</b> A named project, PR, doc or incident — not “I always…”.</span></div><div>${ic('check-circle')}<span><b>Recent.</b> Within the last two review cycles.</span></div><div>${ic('check-circle')}<span><b>Verifiable.</b> Someone else could confirm it: a reviewer, a metric, a retro.</span></div><div>${ic('check-circle')}<span><b>At the level.</b> Compare against the ${next || cur} descriptor, not against peers.</span></div></div>` })}
          </div></div>`;

        body = NS.card({ body: NS.empty({ icon: 'route', title: next ? `No development plan for ${self ? 'you' : sub.first} yet` : 'Top of the ladder', body: next ? `Generate one from the ${next} learning path, the required artifacts and the lowest-rated competencies. You can edit, add and tick items afterwards.` : 'There is no next level on this track to plan toward.', action: next ? `<button class="ns-btn primary" data-gen>${ic('wand')}Generate development plan</button>` : '' }) });

        body = `<div class="ns-grid main-side"><div class="grid gap-4">${['gap', 'learn', 'artifact', 'checkin'].filter((k) => groups[k]).map((k) => NS.card({ title: KIND[k].label, sub: `${groups[k].filter((i) => i.done).length} of ${groups[k].length} done`, body: `<div class="plan-group">${groups[k].map((it) => `<div class="plan-item ${it.done ? 'done' : ''}"><span class="ns-check" style="align-items:flex-start;margin-top:2px"><input type="checkbox" data-done="${it.id}" ${it.done ? 'checked' : ''}></span><div class="min-w-0"><div class="t">${NS.esc(it.text)}</div><div class="s">${NS.esc(it.sub || '')}${it.due ? ` · <b>${NS.esc(it.due)}</b>` : ''}</div></div><div class="act no-print"><button class="ns-btn xs ghost icon" data-edit="${it.id}" data-tip="Edit">${ic('pencil')}</button><button class="ns-btn xs ghost icon" data-del="${it.id}" data-tip="Remove">${ic('trash')}</button></div></div>`).join('')}</div>` })).join('')}
            ${NS.card({ title: 'Add an item', bodyCls: 'tight', body: `<div class="flex gap-2 wrap no-print"><select class="ns-select sm" id="newKind" style="width:auto">${Object.entries(KIND).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('')}</select><input class="ns-input sm grow" id="newText" placeholder="e.g. Lead the design review for the Q1 authz migration" style="min-width:200px"><input class="ns-input sm" id="newDue" placeholder="Q1 FY27" style="width:110px"><button class="ns-btn sm primary" id="addItem">${ic('plus')}Add</button></div>` })}</div>
          <div class="grid gap-4">
            ${NS.card({ title: 'Plan summary', body: `<div class="flex items-center gap-4">${NS.ring({ value: pp.pct / 100, size: 84, thickness: 8, label: pp.pct + '%', sub: 'done', color: pp.pct === 100 ? 'var(--viz-good)' : 'var(--brand)' })}<div class="grid gap-1 sm"><div class="flex items-center gap-2 wrap"><span class="muted">Toward</span>${chip(plan.target, { size: 'sm' })}</div><div><span class="muted">Created</span> <b>${F.date(plan.createdAt, 'med')}</b></div><div><span class="muted">Items</span> <b>${pp.d} of ${pp.n} done</b></div></div></div><div class="flex gap-2 wrap mt-4 no-print"><button class="ns-btn sm secondary" data-export-p>${ic('download')}CSV</button><button class="ns-btn sm secondary" data-print>${ic('printer')}Print</button><button class="ns-btn sm ghost" data-clear-plan>${ic('trash')}Delete plan</button></div>` })}
            ${NS.card({ title: 'Review rhythm', body: `<div class="ns-timeline"><div class="ns-tl-item now"><span class="pt">${ic('circle-dot')}</span><div><div class="ttl">This week</div><div class="sub">Share the plan in your 1:1${D.byId(sub.managerId) ? ` with ${NS.esc(D.byId(sub.managerId).first)}` : ''}</div></div></div><div class="ns-tl-item"><span class="pt"></span><div><div class="ttl">Monthly</div><div class="sub">Tick items, re-rate the competency, add evidence</div></div></div><div class="ns-tl-item"><span class="pt"></span><div><div class="ttl">Oct 19 – Oct 30</div><div class="sub">FY26 calibration — nominations with evidence</div></div></div><div class="ns-tl-item"><span class="pt"></span><div><div class="ttl">${F.date(S.settings.nextReview, 'my')}</div><div class="sub">Next framework review</div></div></div></div>` })}
          </div></div>`;

    },
    mounted: (c, root) => {
      const me = meFor(c.persona); const sub = subjectFor(c); const self = sub.id === me.id; const who = self ? 'self' : 'mgr'; const { cur, next } = personLevels(sub); const lvlKey = c.query.lvl === 'cur' || !next ? 'cur' : 'next'; const code = lvlKey === 'cur' ? cur : next;
      const radar = root.querySelector('#assessRadar'); if (radar) NS.chart.radar(radar, { axes: COMPS.map((x) => x.name.split(' ')[0].replace('&', '')), series: [{ name: `${who === 'mgr' ? 'You · ' : ''}at ${cur}`, values: radarFor(sub.id, cur, who) }, ...(next ? [{ name: `${who === 'mgr' ? 'You · ' : ''}at ${next}`, values: radarFor(sub.id, next, who) }] : []), ...(who === 'mgr' && next ? [{ name: `${sub.first} · self at ${next}`, values: radarFor(sub.id, next, 'self'), dashed: true }] : [])], max: 5, size: 220, legend: true });
      const pSel = root.querySelector('#pSel'); if (pSel) pSel.onchange = () => { S.mgrPicks[c.persona.id] = pSel.value; save(); NS.go('/assess', { ...c.query, p: pSel.value }); };

      root.querySelectorAll('[data-lvl]').forEach((b) => b.onclick = () => NS.go('/assess', { ...c.query, lvl: b.dataset.lvl }));
      root.querySelectorAll('[data-rate]').forEach((g) => g.querySelectorAll('button').forEach((b) => b.onclick = () => { const i = +g.dataset.rate, v = +b.dataset.v; setAssess(sub.id, code, i, { r: v }, who); const lbl = g.closest('.rate-row').querySelector('.rate-lbl'); g.querySelectorAll('button').forEach((x) => x.toggleAttribute('aria-pressed', x === b)); lbl.textContent = RLBL[v]; NS.toast(`${LMAP[code].comps[i].name} rated ${v}/5`, { desc: RLBL[v], type: 'info', duration: 1600 }); setTimeout(() => NS.refresh(), 700); }));
      root.querySelectorAll('[data-ev]').forEach((t) => { const fn = U.debounce(() => { setAssess(sub.id, code, +t.dataset.ev, { e: t.value }, who); }, 300); t.oninput = fn; });
      const gen = () => { const plan = buildPlan(sub.id); if (!plan) return; const doIt = () => { S.plans[sub.id] = plan; log(`Generated development plan for ${sub.first} toward ${plan.target}`); NS.toast(`Development plan ready · ${plan.items.length} items`, { desc: `Built from the ${plan.target} learning path, required artifacts and ${plan.items.filter((i) => i.kind === 'gap').length} gap competencies.`, type: 'ok' }); NS.go('/assess', { ...c.query, tab: 'plan' }); }; if (S.plans[sub.id]) NS.confirm({ title: 'Regenerate the plan?', body: 'Ticked items and edits will be replaced by a fresh plan built from the current ratings.', confirmLabel: 'Regenerate', danger: true }).then((ok) => ok && doIt()); else doIt(); };
      root.querySelectorAll('[data-gen]').forEach((b) => b.onclick = gen);
      root.querySelectorAll('[data-print]').forEach((b) => b.onclick = () => window.print());
      const ex = root.querySelector('[data-export-a]'); if (ex) ex.onclick = () => downloadCsv(`assessment-${sub.id}.csv`, [['Person', 'Level', 'Dimension', 'Maps to', 'Rating', 'Evidence'], ...[cur, next].filter(Boolean).flatMap((cd) => { const a = getAssess(sub.id, cd, who); return LMAP[cd].comps.map((x, i) => [sub.name, cd, x.name, CMAP[x.id].name, (a[i] && a[i].r) || '', (a[i] && a[i].e) || '']); })]);
      const plan = S.plans[sub.id];
      if (plan) {
        root.querySelectorAll('[data-done]').forEach((cb) => cb.onchange = () => { const it = plan.items.find((i) => i.id === cb.dataset.done); it.done = cb.checked; save(); cb.closest('.plan-item').classList.toggle('done', cb.checked); if (cb.checked) NS.toast('Nice — item done', { desc: it.text, type: 'ok', duration: 1800 }); setTimeout(() => NS.refresh(), 500); });
        root.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => { plan.items = plan.items.filter((i) => i.id !== b.dataset.del); save(); NS.refresh(); });
        root.querySelectorAll('[data-edit]').forEach((b) => b.onclick = () => { const it = plan.items.find((i) => i.id === b.dataset.edit); NS.modal({ title: 'Edit plan item', size: 'sm', body: `<div class="grid gap-3"><label class="ns-field"><span class="ns-label">Item</span><input class="ns-input" id="eT" value="${NS.esc(it.text)}"></label><label class="ns-field"><span class="ns-label">Note</span><input class="ns-input" id="eS" value="${NS.esc(it.sub || '')}"></label><label class="ns-field"><span class="ns-label">Due</span><input class="ns-input" id="eD" value="${NS.esc(it.due || '')}"></label></div>`, actions: [{ label: 'Cancel' }, { label: 'Save', cls: 'primary', onClick: (m) => { const t = m.el.querySelector('#eT').value.trim(); if (!t) return false; it.text = t; it.sub = m.el.querySelector('#eS').value.trim(); it.due = m.el.querySelector('#eD').value.trim(); save(); NS.refresh(); } }] }); });
        const add = root.querySelector('#addItem'); if (add) add.onclick = () => { const t = root.querySelector('#newText').value.trim(); if (!t) { NS.toast('Write the item first', { type: 'warn' }); return; } plan.items.push({ id: 'x' + U.uid(), kind: root.querySelector('#newKind').value, text: t, sub: 'Added by ' + (self ? 'you' : me.first), due: root.querySelector('#newDue').value.trim(), done: false }); save(); NS.toast('Added to plan', { desc: t, type: 'ok' }); NS.refresh(); };
        const exp = root.querySelector('[data-export-p]'); if (exp) exp.onclick = () => downloadCsv(`development-plan-${sub.id}.csv`, [['Person', 'Target level', 'Group', 'Item', 'Note', 'Due', 'Done'], ...plan.items.map((i) => [sub.name, plan.target, KIND[i.kind].label, i.text, i.sub || '', i.due || '', i.done ? 'yes' : 'no'])]);
        const clr = root.querySelector('[data-clear-plan]'); if (clr) clr.onclick = () => NS.confirm({ title: 'Delete this plan?', body: 'All items and progress are removed. You can generate a new plan at any time.', confirmLabel: 'Delete', danger: true }).then((ok) => { if (ok) { delete S.plans[sub.id]; save(); NS.toast('Plan deleted', { type: 'info' }); NS.refresh(); } });
      }
    },
  };

  /* TEAM READINESS ---------------------------------------------------- */
  const rowsFor = (people) => people.map((p) => { const next = nextOf(p.level); const r = next ? readiness(p.id, next) : { pct: 0, rated: 0, total: 0, band: 'none', coverage: 0 }; return { ...p, next, r, nom: nominated(p.id) }; });
  const nominate = (p, byName) => { const next = nextOf(p.level); S.nominations[p.id] = { at: TODAY.toISOString(), by: byName, target: next }; log(`${p.first} nominated for ${next} review`); NS.toast(`${p.first} nominated for ${next} review`, { desc: 'Added to the FY26 calibration packet. Attach evidence before Oct 19.', type: 'ok' }); };

  R['/team'] = {

><b>${U.sum(LEVELS, (l) => criteriaOf(l).length)}</b><span>Artifacts</span><b>${U.sum(LEVELS, (l) => l.artifacts.length)}</b><span>Learning modules</span><b>${U.sum(LEVELS, (l) => l.learning.length)}</b><span>People mapped</span><b>${F.int(D.people.filter(onLadder).length)} of ${F.int(D.people.length)}</b></div>` })}${NS.card({ title: 'Naming schemes', sub: 'Levels do not all use the same dimensions', body: `<div class="grid gap-3">${schemes().map(([name, ls]) => `<div><div class="sm semibold">${name}</div><div class="ns-chips mt-1">${ls.map((L) => chip(L.code, { size: 'sm' })).join('')}</div></div>`).join('')}</div>` })}</div></div><div class="mt-4">${NS.card({ title: 'Descriptors per competency', sub: 'How often each Northstar competency is named across the 16 levels', body: '<div id="compBars"></div>' })}</div>`;

    mark: ic('layers', { size: 20 }),
    searchHint: 'levels, competencies, people',
    about: { tagline: 'What great looks like at every level — and what changes at the next one.', description: 'The engineering career framework as a product rather than a spreadsheet: sixteen linkable levels across the individual-contributor and management tracks, every competency descriptor mapped onto the seven Northstar competencies, side-by-side comparison that highlights exactly which expectations are new, a self-assessment that turns evidence into a readiness score and a development plan, and a readiness view for managers and people partners feeding the calibration cycle.', highlights: [{ icon: 'layers', title: '16 levels, one ladder', body: 'P0–P6 and M1–M6 with scope, descriptors, criteria, artifacts, interview question and learning path.' }, { icon: 'columns', title: 'Compare with diff', body: 'Clauses that are new at the next level are highlighted — no more guessing what “more senior” means.' }, { icon: 'clipboard-check', title: 'Evidence-based readiness', body: 'Rate 1–5 with written proof; readiness and gaps feed a persisted, editable development plan.' }, { icon: 'users', title: 'Team & org readiness', body: 'Who is ready, who is developing, who is nominated — with the gap heatmap behind it.' }] },
    personas, defaultPersona: 'employee',
    nav: (persona) => [
      { group: 'Framework', items: [{ id: 'home', label: 'Overview', icon: 'home' }, { id: 'compare', label: 'Compare levels', icon: 'columns' }, { id: 'matrix', label: 'Matrix', icon: 'table' }] },
      ...(persona.id === 'employee' ? [{ group: 'My growth', items: [...meNav(persona), { id: 'assess', label: 'Self-assessment', icon: 'clipboard-check', badge: assessBadge(persona) }, { id: 'plan', label: 'Development plan', icon: 'route', route: '/assess?tab=plan', badge: S.plans[persona.personId] ? `${planProgress(S.plans[persona.personId]).d}/${planProgress(S.plans[persona.personId]).n}` : '' }] }]
        : persona.id === 'manager' ? [{ group: 'Team', items: [{ id: 'team', label: 'Team readiness', icon: 'users', badge: readyCount(persona) || '' }, { id: 'assess', label: 'Assess a report', icon: 'clipboard-check' }] }, { group: 'Me', items: meNav(persona) }]
        : [{ group: 'People partner', items: [{ id: 'team', label: 'Org readiness', icon: 'users' }, { id: 'assess', label: 'Assess', icon: 'clipboard-check' }] }, { group: 'Administration', items: [{ id: 'settings', label: 'Framework settings', icon: 'settings' }] }, { group: 'Me', items: meNav(persona) }]),
    ],
    promo: (persona) => { const me = meFor(persona); const next = nextOf(me.level); if (persona.id === 'employee') { const r = readiness(me.id, next); return { title: `Readiness for ${next}`, body: `${r.rated} of ${r.total} dimensions rated · ${r.pct}% on your own evidence`, progress: r.pct, cta: { label: 'Continue', route: '/assess' } }; } if (persona.id === 'manager') { const t = teamFor(persona); return { title: 'Calibration opens Oct 19', body: `${readyCount(persona)} of ${t.length} reports look ready for a next-level review.`, cta: { label: 'Team readiness', route: '/team' } }; } return { title: 'Framework v3.0', body: `${S.settings.cadence} review · next ${F.date(S.settings.nextReview, 'my')}`, cta: { label: 'Settings', route: '/settings' } }; },
    notifications: [{ icon: 'user-check', title: 'Priya nominated for P4 review', body: 'Aditya Kulkarni added Priya Raman to the FY26 calibration packet.', time: 'Today', route: '/team' }, { icon: 'clipboard-check', title: 'Self-assessment reminder', body: 'Rate your evidence before manager reviews open on Oct 5.', time: 'Yesterday', route: '/assess' }, { icon: 'layers', title: 'Framework v3.0 published', body: 'Every level is linkable; comparison and self-assessment are built in.', time: 'Sep 12', route: '/settings?tab=log' }, { icon: 'graduation-cap', title: 'New module: Writing effective ADRs', body: 'Added to the P5 learning path.', time: 'Sep 9', route: '/level/P5?tab=growth' }],
    routes: R, default: '/home',
    commands: (persona) => { const me = meFor(persona); const { cur, next } = personLevels(me); return [{ label: `Compare ${cur} with ${next || cur}`, icon: 'columns', group: 'Actions', run: () => NS.go('/compare', { a: cur, b: next || cur }) }, { label: 'Generate development plan', icon: 'wand', group: 'Actions', run: () => NS.go('/assess', { tab: 'plan' }) }, { label: 'Export the competency matrix (CSV)', icon: 'download', group: 'Actions', run: () => NS.go('/matrix') }, ...(persona.id !== 'employee' ? [{ label: 'Nominate someone for promotion', icon: 'user-check', group: 'Actions', run: () => NS.go('/team') }] : []), ...(persona.id === 'hrbp' ? [{ label: 'Propose a framework change', icon: 'pencil', group: 'Actions', run: () => NS.go('/settings') }] : [])]; },
    search: (q) => { const fw = searchFramework(q).map((it) => ({ group: it.kind === 'Level' ? 'Levels' : 'Framework', label: it.label, hint: it.hint, icon: it.icon, run: () => NS.go(it.route, it.query) })); const ppl = q.length < 2 ? [] : D.people.filter((p) => onLadder(p) && p.name.toLowerCase().includes(q.toLowerCase())).slice(0, 5).map((p) => ({ group: 'People', label: p.name, hint: `${label(p.level)} · ${p.team}`, avatar: NS.avatar(p, { size: 'xs' }), run: () => (NS.persona.id === 'employee' ? NS.go('/level/' + p.level) : NS.go('/assess', { p: p.id, org: p.org })) })); return [...fw, ...ppl]; },
    onReset: () => store.clear(),
  });
})();
</script>

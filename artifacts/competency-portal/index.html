<!doctype html>
<html lang="en" data-brand="violet">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Competency Portal · Northstar Labs</title>
<meta name="description" content="Competency Portal — the career atlas for Northstar Labs engineering: 16 levels across the individual-contributor and management tracks aligned on one seniority scale, competency descriptors, level-to-level diffs, self-assessment, readiness checklists, development plans and team readiness. Concept prototype with illustrative data, designed by Ronak Mehta.">
<meta name="theme-color" content="#6D28D9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='9' fill='%236D28D9'/%3E%3Cpath d='M16 10v28M32 10v28' stroke='%23fff' stroke-width='3.4' stroke-linecap='round'/%3E%3Cpath d='M16 17h16M16 24h16' stroke='%23fff' stroke-opacity='.55' stroke-width='3.4' stroke-linecap='round'/%3E%3Cpath d='M16 31h16' stroke='%23fff' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Space+Grotesk:wght@400..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/ns.css">
<script src="../shared/ns.js"></script>
<script src="../shared/ns-data.js"></script>
<style>
/* ==========================================================================
   Competency Portal · "The career atlas"
   Identity: architectural and transparent. Space Grotesk for structure and
   level codes, Inter for reading, Space Mono for drawing labels. Cool white
   canvas, violet ink (#6D28D9), a sequential level ramp (P0 pale → P6 deep,
   M1 pale → M6 deep in cerulean), and a faint blueprint grid only behind the
   visuals whose job is to show structure (the ladder, the matrix, the diff).
   ========================================================================== */
:root{
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-display:"Space Grotesk","Inter",-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#F4F5FA;--bg-2:#ECEDF5;
  --surface:#FFFFFF;--surface-2:#F9F9FC;--surface-3:#F1F1F7;--surface-4:#E5E5EF;
  --line:#DFDFEA;--line-2:#ECECF3;--line-strong:#C6C5D7;
  --ink:#16132B;--ink-2:#3A3754;--ink-3:#5A5776;--ink-4:#73708D;--ink-inverse:#FFFFFF;
  --np:#6D28D9;--np-hover:#5B21B6;--np-active:#4C1D95;--np-text:#6527CC;--np-soft:#F3EFFE;--np-soft-2:#E7DEFC;--np-line:#CBBAF6;
  --brand:#6D28D9;--brand-hover:#5B21B6;--brand-active:#4C1D95;--brand-text:#6527CC;--brand-soft:#F3EFFE;--brand-soft-2:#E7DEFC;--brand-line:#D3C6F8;
  --info:#0B6A9E;--info-bg:#E7F2F9;--info-line:#B3D7EC;
  --discovery:#6D28D9;--discovery-bg:#F3EFFE;
  --viz-1:#6D28D9;--viz-2:#0B84C6;--viz-3:#0F9D74;--viz-4:#D08A00;
  --viz-seq-100:#EEE8FD;--viz-seq-200:#D9CBFA;--viz-seq-300:#BBA2F4;--viz-seq-400:#9873EA;--viz-seq-500:#7748DC;--viz-seq-600:#5A28B9;--viz-seq-700:#3C1581;
  --viz-grid:#ECECF3;--viz-axis:#D5D4E2;
  --bp:rgba(109,40,217,.05);--bp-2:rgba(109,40,217,.085);
  --add:#0C6E3D;--add-bg:#E5F4EA;--add-line:#A6D9B8;--del:#AF1F31;--del-bg:#FCEBEE;--del-line:#F0B9C1;
  --ic-h:293;--mg-h:236;--ic-ink:#6527CC;--mg-ink:#0B6A9E;
  --r-xs:3px;--r-sm:4px;--r:6px;--r-lg:8px;--r-xl:10px;
  --shadow-xs:0 0 0 0 transparent;--shadow-sm:0 1px 2px rgba(22,19,43,.06);
  --shadow:0 2px 6px -1px rgba(22,19,43,.08),0 1px 2px rgba(22,19,43,.04);
  --shadow-lg:0 14px 30px -8px rgba(22,19,43,.18),0 3px 8px -2px rgba(22,19,43,.06);
  --shadow-xl:0 28px 60px -14px rgba(22,19,43,.28),0 6px 14px -4px rgba(22,19,43,.08);
  --focus:0 0 0 2px var(--surface),0 0 0 4px rgba(109,40,217,.55);
  --content-max:1380px;
}
:root[data-theme="dark"]{
  --bg:#0B0A13;--bg-2:#100F1B;
  --surface:#13121D;--surface-2:#171623;--surface-3:#1D1C2C;--surface-4:#272538;
  --line:#2A2840;--line-2:#201F31;--line-strong:#3C3A57;
  --ink:#EFEEF7;--ink-2:#C7C4DC;--ink-3:#A09CBA;--ink-4:#8A86A6;--ink-inverse:#0B0A13;
  --np:#7C3AED;--np-hover:#6D28D9;--np-active:#5B21B6;--np-text:#C1ADFF;--np-soft:rgba(139,92,246,.16);--np-soft-2:rgba(139,92,246,.26);--np-line:rgba(139,92,246,.48);
  --brand:#8B5CF6;--brand-hover:#A78BFA;--brand-active:#7C3AED;--brand-text:#C1ADFF;--brand-soft:rgba(139,92,246,.15);--brand-soft-2:rgba(139,92,246,.25);--brand-line:rgba(139,92,246,.42);
  --info:#86CBF2;--info-bg:rgba(56,160,220,.14);--info-line:rgba(56,160,220,.36);
  --discovery:#C1ADFF;--discovery-bg:rgba(139,92,246,.15);
  --viz-1:#A78BFA;--viz-2:#4FB8EE;--viz-3:#34C79A;--viz-4:#E6A93A;
  --viz-seq-100:#1F1A39;--viz-seq-200:#2E2260;--viz-seq-300:#45308C;--viz-seq-400:#6247B8;--viz-seq-500:#8467DA;--viz-seq-600:#AA93F0;--viz-seq-700:#D8CCFF;
  --viz-grid:#22213A;--viz-axis:#34324D;
  --bp:rgba(167,139,250,.05);--bp-2:rgba(167,139,250,.09);
  --add:#68D9A0;--add-bg:rgba(52,199,120,.12);--add-line:rgba(52,199,120,.32);--del:#FF94A0;--del-bg:rgba(240,70,90,.13);--del-line:rgba(240,70,90,.34);
  --ic-ink:#C1ADFF;--mg-ink:#86CBF2;
  --shadow-sm:0 1px 2px rgba(0,0,0,.45);--shadow:0 2px 8px -1px rgba(0,0,0,.5);
  --shadow-lg:0 16px 34px -8px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.04);
  --shadow-xl:0 30px 70px -12px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.05);
  --focus:0 0 0 2px var(--surface),0 0 0 4px rgba(167,139,250,.7);
}

/* ---------- base type ---------- */
body{background:var(--bg)}
h1,h2,h3,.ns-card-head h3,.ns-modal-head h2,.ns-drawer-head h2,.ns-drawer-head h3{font-family:var(--font-display);letter-spacing:-.018em}
.ns-viz text{font-family:var(--font-sans)}
::selection{background:rgba(109,40,217,.18)}

/* ---------- shell ---------- */
.ns-gh{background:var(--surface);border-bottom:1px solid var(--line)}
.ns-np-mark{border-radius:5px}
.ns-gh-product .ns-brand-name{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:-.015em}
.ns-brand-mark{background:var(--np);border-radius:6px;box-shadow:none;color:#fff}
.ns-gh-product .ns-brand-mark{border-radius:5px}
.ns-search-btn{background:var(--bg);border:1px solid var(--line);border-radius:var(--r)}
.ns-search-btn:hover{border-color:var(--np-line);background:var(--surface)}
@media (max-width:960px){.ns-gh .ns-search-btn{margin-right:0;border-color:transparent;background:transparent;color:var(--ink-3)}.ns-gh .ns-search-btn:hover{background:var(--surface-3);color:var(--ink)}}
.ns-tenant{border-radius:var(--r-sm)}
.ns-sidebar{background:var(--bg);border-right:1px solid var(--line)}
.ns-brand{padding:16px 16px 12px}
.ns-brand-name{font-family:var(--font-display);font-size:15.5px;font-weight:600;letter-spacing:-.02em}
.ns-brand-sub{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.ns-persona-chip{margin:0 12px 8px;border-radius:var(--r);background:var(--surface);padding:7px 9px}
.ns-persona-chip{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 8px;align-items:center}.ns-persona-chip .lbl{grid-column:1;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ns-nav{padding:6px 12px 12px}
.ns-nav-group{font-family:var(--font-mono);font-size:10px;font-weight:400;letter-spacing:.12em;color:var(--ink-3);padding:18px 10px 6px;display:flex;align-items:center;gap:8px}
.ns-nav-group::after{content:"";flex:1;height:1px;background:var(--line)}
.ns-nav-item{height:33px;border:1px solid transparent;font-size:13.5px;color:var(--ink-2)}
.ns-nav-item:hover{background:var(--surface-3)}
.ns-nav-item[aria-current="page"]{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:600}
.ns-nav-item[aria-current="page"] svg{color:var(--np)}
.ns-nav-item[aria-current="page"]::before{left:-13px;top:6px;bottom:6px;width:3px;border-radius:0 2px 2px 0;background:var(--np)}
.ns-nav-badge{font-family:var(--font-display);font-weight:600;border-radius:4px;background:var(--surface-4)}
.ns-nav-item[aria-current="page"] .ns-nav-badge{background:var(--np-soft);color:var(--np-text)}
.ns-sidebar-foot{border-top:1px solid var(--line)}
.ns-sidebar-promo{border-radius:var(--r-lg);background:var(--surface)}
.ns-sidebar-promo::before{content:"Up next";font-family:var(--font-mono);font-weight:400;font-size:9.5px;letter-spacing:.12em;color:var(--np-text)}
.ns-sidebar-promo b{font-family:var(--font-display);font-size:14px;font-weight:600}
.ns-sidebar-promo .ns-progress{height:5px;border-radius:2px}.ns-sidebar-promo .ns-progress > i{border-radius:2px;background:var(--np)}
.ns-topbar{background:color-mix(in srgb,var(--bg) 90%,transparent)}
.ns-crumbs b{font-weight:600}
.ns-content{max-width:var(--content-max)}

/* ---------- page head ---------- */
.ns-page-head{padding:12px 0 22px;margin-bottom:22px;border-bottom:1px solid var(--line);align-items:flex-end}
.ns-page-head h1{font-size:30px;line-height:36px;font-weight:600;letter-spacing:-.028em}
.ns-page-head p{font-size:14px;color:var(--ink-3);margin-top:8px}
.ns-eyebrow{font-family:var(--font-mono);font-size:10.5px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--np-text);margin-bottom:10px}
.ns-page-head + .ns-tabs{margin-top:-22px}

/* ---------- components ---------- */
.ns-card{border-radius:var(--r-lg);box-shadow:none}
.ns-card-head{padding:16px 20px 0}
.ns-card-head h3{font-size:15px;font-weight:600}
.ns-card-head p{font-size:12.5px}
.ns-card-foot{background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
.ns-stat{box-shadow:none;border-radius:var(--r-lg)}
.ns-stat .val{font-family:var(--font-display);font-weight:600;letter-spacing:-.03em}
.ns-ring .c b{font-family:var(--font-display);font-weight:600}
.ns-btn{border-radius:5px;font-weight:550}
.ns-btn.secondary{box-shadow:none}
.ns-btn.primary{box-shadow:none}
.ns-btn-group{border-radius:5px;box-shadow:none}
.ns-badge{border-radius:3px}
.ns-tag{border-radius:3px}
.ns-tabs{gap:4px}
.ns-tab{font-weight:550;padding:11px 12px}
.ns-tab[aria-selected="true"]{color:var(--ink);border-color:var(--np)}
.ns-tab[aria-selected="true"] svg{color:var(--np)}
.ns-tab .n{font-family:var(--font-display);border-radius:4px}
.ns-seg{border-radius:var(--r);background:var(--surface-3)}
.ns-seg button{border-radius:4px}
.ns-seg button[aria-pressed="true"]{box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(22,19,43,.06)}
.ns-table th{font-family:var(--font-mono);font-size:10px;font-weight:400;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.ns-table td{height:48px}
.ns-input,.ns-select,.ns-textarea{border-radius:5px}
.ns-alert{border-radius:var(--r)}
.ns-drawer-head{padding:20px 24px 16px}
.ns-icon-box{border-radius:var(--r)}
.ns-icon-box.sm{border-radius:5px}
.flip svg,svg.flip{transform:scaleX(-1)}

/* ---------- shared atlas primitives ---------- */
.mono-k{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:400}
.disp{font-family:var(--font-display);letter-spacing:-.02em}
.tnum{font-variant-numeric:tabular-nums}
.bp{background-color:var(--surface);background-image:linear-gradient(var(--bp) 1px,transparent 1px),linear-gradient(90deg,var(--bp) 1px,transparent 1px),linear-gradient(var(--bp-2) 1px,transparent 1px),linear-gradient(90deg,var(--bp-2) 1px,transparent 1px);background-size:14px 14px,14px 14px,70px 70px,70px 70px;background-position:-1px -1px}
/* level tile: the sequential ramp. --l/--c (light) and --ld/--cd (dark) come from JS so every level keeps its exact step */
.rp{--h:var(--ic-h);display:inline-grid;place-items:center;min-width:36px;height:22px;padding:0 6px;border-radius:var(--r-xs);font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1;background:oklch(var(--l) var(--c) var(--h));color:var(--fg);flex:none;white-space:nowrap}
.rp.m{--h:var(--mg-h)}
:root[data-theme="dark"] .rp{background:oklch(var(--ld) var(--cd) var(--h));color:var(--fgd)}
.rp.lg{min-width:48px;height:30px;font-size:15px;border-radius:var(--r-sm);padding:0 8px}
.rp.xl{min-width:64px;height:44px;font-size:22px;border-radius:var(--r);padding:0 10px;letter-spacing:-.03em}
.rp.ghost{background:transparent;color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line-strong)}
.rpf{--h:var(--ic-h);background:oklch(var(--l) var(--c) var(--h))}
.rpf.m{--h:var(--mg-h)}
:root[data-theme="dark"] .rpf{background:oklch(var(--ld) var(--cd) var(--h))}
/* level chip */
.lv{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 9px 0 2px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:550;color:var(--ink-2);text-decoration:none!important;white-space:nowrap;max-width:100%;vertical-align:middle}
.lv > span:last-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.lv .rp{height:20px;min-width:32px;font-size:11.5px}
.lv.sm{height:24px;font-size:12px;gap:6px;padding:0 8px 0 2px}.lv.sm .rp{height:18px;min-width:30px;font-size:11px}
.lv.lg{height:32px;font-size:13.5px;gap:8px;padding:0 11px 0 3px}.lv.lg .rp{height:24px;min-width:40px;font-size:13px}
a.lv:hover{border-color:var(--np-line);color:var(--ink)}
.lv.me{border-color:var(--np-line);box-shadow:0 0 0 1px var(--np-line)}
.lv-code{font-family:var(--font-display);font-weight:600;color:var(--np-text)}
/* dot rating */
.dots{display:inline-flex;gap:3px;align-items:center;vertical-align:middle}
.dots i{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line-strong);background:transparent}
.dots i.on{background:var(--np);box-shadow:none}
.dots i.half{background:linear-gradient(90deg,var(--np) 50%,transparent 50%);box-shadow:inset 0 0 0 1.5px var(--np)}
.dots.warn i.on{background:var(--warn)}.dots.warn i.half{background:linear-gradient(90deg,var(--warn) 50%,transparent 50%);box-shadow:inset 0 0 0 1.5px var(--warn)}
.dots.lg i{width:10px;height:10px}
/* dimension strip — one column per dimension, height = rating */
.dstrip{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px;height:34px;align-items:end}
.dstrip .ds{height:100%;border-radius:2px;background:var(--surface-3);display:flex;align-items:flex-end;overflow:hidden;position:relative}
.dstrip .ds i{display:block;width:100%;background:var(--np);border-radius:2px 2px 0 0}
.dstrip .ds.v1 i,.dstrip .ds.v2 i{background:var(--warn)}
.dstrip .ds.v0{background:repeating-linear-gradient(135deg,var(--surface-3) 0 4px,var(--surface-4) 4px 5px)}
.dstrip.sm{height:22px;gap:2px}
/* readiness meter with the "ready" threshold (avg 4 = 75%) */
.rmeter .bar{position:relative;height:10px;border-radius:2px;background:var(--surface-4);overflow:visible}
.rmeter .bar > i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--np)}
.rmeter .bar > i.ready{background:var(--ok)}.rmeter .bar > i.early,.rmeter .bar > i.none{background:var(--ink-4)}
.rmeter .thr{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.rmeter .lg{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--ink-3)}
.rmeter .lg b{font-family:var(--font-display);font-size:13px;color:var(--ink)}
/* checklist */
.chk-h{display:flex;align-items:center;gap:10px;padding-bottom:12px;margin-bottom:4px;border-bottom:1px solid var(--line-2)}
.chk-h b{font-family:var(--font-display);font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.chk-h > span:not(.seg){font-size:12.5px;color:var(--ink-3)}
.chk-h .seg{margin-left:auto;display:flex;gap:3px}
.chk-h .seg i{width:18px;height:6px;border-radius:1px;background:var(--surface-4)}
.chk-h .seg i.on{background:var(--ok)}
.chk-row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line-2)}
.chk-row:last-child{border-bottom:0;padding-bottom:2px}
.chk-row .box{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;border:1.5px solid var(--line-strong);color:var(--ink-3);margin-top:1px}
.chk-row .box .no{font-family:var(--font-mono);font-size:10px}
.chk-row.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
:root[data-theme="dark"] .chk-row.done .box{color:#0B0A13}
.chk-row .t{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.35}
.chk-row.done .t{color:var(--ink-2)}
.chk-row .s{font-size:12.5px;color:var(--ink-3);margin-top:2px;line-height:1.45}
.chk-row .fr{font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--ink-2);white-space:nowrap;padding-top:1px;font-variant-numeric:tabular-nums}
.chk-row .fr a{font-family:var(--font-sans);font-size:12.5px}
.chk-row.done .fr{color:var(--ok)}

/* ---------- HOME: the atlas (two-track ladder on one seniority scale) ---------- */
.atlas{display:grid;grid-template-columns:minmax(0,1fr) 316px;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.atlas-map{padding:18px 22px 16px;min-width:0;border-right:1px solid var(--line)}
.atlas-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px}
.atlas-top h2{font-size:17px;font-weight:600}
.atlas-top p{font-size:12.5px;color:var(--ink-3);margin-top:3px;max-width:62ch}
.pyr{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(40px,.5fr) 56px 28px 56px minmax(40px,.5fr) minmax(0,1fr);align-items:center}
.pyr .hd{font-family:var(--font-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:0 0 10px}
.pyr .hd.l{text-align:right;grid-column:1/3;padding-right:10px}.pyr .hd.c{grid-column:3/6;text-align:center}.pyr .hd.r{grid-column:6/8;padding-left:10px}
.pyr .hd b{display:block;font-family:var(--font-display);font-size:13px;font-weight:600;letter-spacing:-.01em;text-transform:none;color:var(--ink);margin-bottom:1px}
.pyr .row{display:contents}
.pyr .cell{height:36px;display:flex;align-items:center;min-width:0;position:relative}
.pyr .ti{justify-content:flex-end;gap:6px;padding-right:10px;text-align:right}
.pyr .ti.r{justify-content:flex-start;padding:0 0 0 10px;text-align:left}
.pyr .ti a{font-size:12.5px;font-weight:550;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;text-decoration:none}
.pyr .ti a:hover{color:var(--np-text)}
.pyr .bar{gap:6px}
.pyr .bar.l{justify-content:flex-end;flex-direction:row}
.pyr .bar i{display:block;height:12px;border-radius:2px;background:color-mix(in srgb,var(--ink-3) 30%,transparent);flex:none}
.pyr .bar.l i{border-radius:2px 0 0 2px}.pyr .bar.r i{border-radius:0 2px 2px 0}

.pyr .me-band{background:linear-gradient(90deg,transparent,var(--np-soft) 30%)}

/* inline validation */

/* route panel */

/* unified diff */
.ud{font-size:13px}

.pyr .spine i{position:absolute;top:50%;height:2px;margin-top:-1px;background:var(--line-strong);width:auto}

      chipsEl.onclick = (e) => { const b = e.target.closest('[data-clear]'); if (!b) return; const k = b.dataset.clear; if (k === 'q' || k === 'all') { fQ.value = ''; tbl.setSearch(''); } if (k === 'level' || k === 'all') fL.value = ''; if (k === 'band' || k === 'all') fB.value = ''; if (k === 'nom' || k === 'all') fN.checked = false; apply(); };
      root.addEventListener('click', (e) => { const b = e.target.closest('[data-nom]'); if (b) { e.stopPropagation(); nominate(D.byId(b.dataset.nom), meFor(c.persona).name); NS.refresh(); } });
      root.querySelector('[data-export]').onclick = () => downloadCsv(`readiness-${(c.persona.id === 'manager' ? meFor(c.persona).team : org).replace(/\W+/g, '-')}.csv`, [['ID', 'Name', 'Title', 'Team', 'Level', 'Time in level (yrs)', 'Last rating', 'Next level', 'Dimensions rated', 'Readiness %', 'Readiness', 'Nominated'], ...tbl.rows().map((r) => [r.id, r.name, r.title, r.team, r.level, r.timeInLevel, r.rating || '', r.next || '', `${r.r.rated}/${r.r.total}`, r.r.rated ? r.r.pct : '', BAND[r.r.band].label, r.nom ? 'yes' : 'no'])]);
      const heat = root.querySelector('#gapHeat'); if (heat) { const hs = U.sortBy(rows.filter((r) => r.next), (r) => -r.r.pct).slice(0, 14); NS.chart.heatmap(heat, { rows: hs.map((r) => `${r.name} · ${r.level}→${r.next}`), cols: COMPS.map((x) => x.name.split(' ')[0].replace('&', '')), values: hs.map((r) => radarFor(r.id, r.next, 'self').map((v) => (v ? Math.round(v * 10) / 10 : null))), format: (v) => (v ? v.toFixed(1) : '–'), min: 1, max: 5, valueLabel: 'Self-rating', labelWidth: 'minmax(170px,auto)', colWidth: 64, onCell: (ri) => personDrawer(c, hs[ri]) }); }
    },
  };

  /* SETTINGS (HRBP) --------------------------------------------------- */
  const schemes = () => { const g = U.groupBy(LEVELS, (L) => (L.scheme === 'lead-architect' ? 'Nine-dimension lead / architect scheme' : L.scheme === 'fellow' ? 'Six-dimension Fellow scheme' : L.comps.length === 4 ? 'Four-dimension Associate scheme' : 'Core seven-competency scheme')); return Object.entries(g).sort((a, b) => b[1].length - a[1].length); };
  const presence = (id) => { const cell = (L) => { const on = L.comps.some((y) => y.id === id); return on ? `<a class="rpf ${isM(L.code) ? 'm' : ''}" style="${rampVars(L.code)}" href="${NS.link('/level/' + L.code)}" title="${L.code} · ${NS.esc(L.title)} — named">${L.code}</a>` : `<a class="off" href="${NS.link('/level/' + L.code)}" title="${L.code} · ${NS.esc(L.title)} — not named">${L.code}</a>`; }; return `<div class="presence">${TRACK.IC.map(cell).join('')}<span class="sep"></span>${TRACK.M.map(cell).join('')}</div>`; };
  R['/settings'] = {
    title: 'Framework settings', personas: ['hrbp'],
    render: (c) => {
      const tab = ['library', 'log'].includes(c.query.tab) ? c.query.tab : 'overview'; const st = S.settings;
      const tabs = NS.tabs([{ id: 'overview', label: 'Framework', icon: 'settings' }, { id: 'library', label: 'Competency library', icon: 'grid', n: COMPS.length }, { id: 'log', label: 'Change log', icon: 'history', n: CHANGELOG.length + S.notes.length }], tab);
      let body;
      if (tab === 'overview') body = `<div class="ns-grid main-side">${NS.card({ title: 'Framework metadata', sub: 'Shown in the About dialog and on every level page', body: `<div class="grid gap-4"><div class="ns-grid c2" style="gap:16px 20px"><label class="ns-field"><span class="ns-label">Version</span><input class="ns-input" value="3.0" disabled style="background:var(--surface-3);color:var(--ink-3)"><span class="ns-help">Set when a release is published.</span></label><label class="ns-field"><span class="ns-label">Status</span><select class="ns-select" id="sStatus">${['Published', 'Draft for review', 'Deprecated'].map((s) => `<option ${s === st.status ? 'selected' : ''}>${s}</option>`).join('')}</select><span class="ns-help">Draft hides the framework from employees.</span></label><label class="ns-field"><span class="ns-label">Owner</span><input class="ns-input" id="sOwner" value="${NS.esc(st.owner)}"><span class="ns-help">Accountable for wording and calibration.</span></label><label class="ns-field"><span class="ns-label">Review cadence</span><select class="ns-select" id="sCadence">${['Quarterly', 'Semi-annual', 'Annual'].map((s) => `<option ${s === st.cadence ? 'selected' : ''}>${s}</option>`).join('')}</select><span class="ns-help">How often the framework itself is reviewed.</span></label><label class="ns-field"><span class="ns-label">Next review</span><input class="ns-input" type="date" id="sNext" value="${st.nextReview}"><span class="ns-help">Proposals queue for this date.</span></label><div class="ns-field"><span class="ns-label">Change proposals</span><label class="ns-switch" style="height:32px"><input type="checkbox" id="sProp" ${st.proposals ? 'checked' : ''}><i></i><span>Anyone can propose wording changes</span></label><span class="ns-help">Otherwise only the owner can.</span></div></div><div class="flex gap-2 justify-end wrap" style="border-top:1px solid var(--line);padding-top:16px"><button class="ns-btn secondary" data-propose>${ic('pencil')}Propose a change</button><button class="ns-btn primary" data-save-settings>${ic('save')}Save settings</button></div></div>` })}<div class="grid gap-4">${NS.card({ title: 'Coverage', sub: 'Live from the people directory', body: `<dl class="spec"><dt>Levels</dt><dd><span class="num">${LEVELS.length}</span> <span class="muted">· ${TRACK.IC.length} IC · ${TRACK.M.length} M</span></dd><dt>Occupied levels</dt><dd><span class="num">${LEVELS.filter((L) => atLevel(L.code).length).length}</span> <span class="muted">· empty: ${LEVELS.filter((L) => !atLevel(L.code).length).map((L) => L.code).join(', ') || 'none'}</span></dd><dt>Descriptors</dt><dd><span class="num">${DESCRIPTORS}</span></dd><dt>Criteria</dt><dd><span class="num">${U.sum(LEVELS, (l) => criteriaOf(l).length)}</span></dd><dt>Artifacts</dt><dd><span class="num">${U.sum(LEVELS, (l) => l.artifacts.length)}</span></dd><dt>Learning modules</dt><dd><span class="num">${U.sum(LEVELS, (l) => l.learning.length)}</span></dd><dt>People mapped</dt><dd><span class="num">${F.int(D.people.filter(onLadder).length)}</span> <span class="muted">of ${F.int(D.people.length)}</span></dd></dl>` })}${NS.card({ title: 'Naming schemes', sub: 'Levels do not all use the same dimensions', body: `<div class="grid gap-4">${schemes().map(([name, ls]) => `<div><div class="sm semibold ink">${name}</div><div class="flex gap-1 wrap mt-2">${ls.map((L) => `<a href="${NS.link('/level/' + L.code)}" title="${NS.esc(L.title)}" style="text-decoration:none">${tile(L.code)}</a>`).join('')}</div></div>`).join('')}</div>` })}</div></div><div class="mt-4">${NS.card({ title: 'Descriptors per competency', sub: 'How often each Northstar competency is named across the 16 levels', body: '<div id="compBars"></div>' })}</div>`;
      else if (tab === 'library') body = `<div class="ns-grid c2">${COMPS.map((x) => { const ls = LEVELS.filter((L) => L.comps.some((y) => y.id === x.id)); const aliases = U.uniq(LEVELS.flatMap((L) => L.comps.filter((y) => y.id === x.id).map((y) => y.name))).filter((n) => n !== x.name); return NS.card({ title: `<span class="flex items-center gap-2"><span class="ns-icon-box sm neutral">${ic(x.icon)}</span>${NS.esc(x.name)}</span>`, sub: x.desc, actions: `<a class="ns-btn xs secondary" href="${NS.link('/matrix', { c: x.id })}">Matrix</a>`, body: `<div class="flex items-center justify-between gap-2"><span class="mono-k">Named at ${ls.length} of ${LEVELS.length} levels</span><span class="mono-k">IC · M</span></div>${presence(x.id)}<dl class="spec left mt-3"><dt>Missing at</dt><dd>${LEVELS.filter((L) => !ls.includes(L)).map((L) => L.code).join(', ') || '—'}</dd><dt>Labels used</dt><dd><span class="ns-chips">${aliases.length ? aliases.map((a) => `<span class="ns-tag">${NS.esc(a)}</span>`).join('') : '<span class="muted">Only the canonical name</span>'}</span></dd></dl>` }); }).join('')}</div>`;
      else body = `<div class="ns-grid main-side">${NS.card({ title: 'Change log', sub: 'Releases and notes, newest first', actions: `<button class="ns-btn xs secondary" data-add-note>${ic('plus')}Add note</button>`, body: `<div>${[...S.notes.map((n) => ({ ...n, v: n.kind === 'proposal' ? 'prop' : 'note' })), ...CHANGELOG].map((e) => `<div class="log-item"><span class="v">${e.v === 'note' ? 'note' : e.v === 'prop' ? 'prop' : 'v' + e.v}</span><div><div class="flex items-center gap-2 wrap"><b>${NS.esc(e.title)}</b>${e.v === 'prop' ? NS.badge('Proposal', 'warn') : e.v === 'note' ? NS.badge('Note', 'info') : ''}</div><p>${NS.esc(e.body)}</p><div class="xs faint mt-1">${F.date(e.date, 'med')}${e.by ? ` · ${NS.esc(e.by)}` : ''}</div></div></div>`).join('')}</div>` })}${NS.card({ title: 'Recent activity', sub: 'In this prototype session', body: S.log.length ? `<div class="grid gap-2">${S.log.slice(0, 10).map((l) => `<div class="sm flex gap-2"><span class="faint nowrap">${F.date(l.t, 'short')}</span><span class="ink2">${NS.esc(l.msg)}</span></div>`).join('')}</div>` : NS.empty({ icon: 'history', title: 'No activity yet', body: 'Nominations, plans and settings changes appear here.' }) })}</div>`;
      return html`${NS.pageHead({ eyebrow: 'Atlas / Administration / Engineering career framework', title: 'Framework settings', sub: 'Version, ownership and review cadence, the competency library the levels map onto, and the change history.', actions: `<a class="ns-btn secondary" href="${NS.link('/matrix')}">${ic('table')}Open matrix</a>` })}${tabs}${body}`;
    },
    mounted: (c, root) => {
      const bars = root.querySelector('#compBars'); if (bars) NS.chart.hbars(bars, { items: COMPS.map((x) => ({ label: x.name, value: U.sum(LEVELS, (L) => L.comps.filter((y) => y.id === x.id).length), sub: `${LEVELS.filter((L) => L.comps.some((y) => y.id === x.id)).length} levels`, color: 'var(--np)' })).sort((a, b) => b.value - a.value), max: 20, format: (v) => v + ' descriptors', valueLabel: 'Descriptors' });
      const sv = root.querySelector('[data-save-settings]'); if (sv) sv.onclick = () => { S.settings = { ...S.settings, status: root.querySelector('#sStatus').value, owner: root.querySelector('#sOwner').value.trim() || S.settings.owner, cadence: root.querySelector('#sCadence').value, nextReview: root.querySelector('#sNext').value || S.settings.nextReview, proposals: root.querySelector('#sProp').checked }; log('Framework settings saved'); save(); NS.toast('Settings saved', { desc: `${S.settings.cadence} review · next ${F.date(S.settings.nextReview, 'med')}`, type: 'ok' }); };
      const pr = root.querySelector('[data-propose]'); if (pr) pr.onclick = () => NS.modal({ title: 'Propose a wording change', mounted: (b) => setTimeout(() => b.querySelector('#ppT').focus(), 60), sub: 'Proposals are reviewed at the next framework review.', body: `<div class="grid gap-3"><label class="ns-field"><span class="ns-label">Level</span>${levelSelect('ppL', 'P3')}</label><label class="ns-field"><span class="ns-label">Proposal</span><textarea class="ns-textarea" id="ppT" style="height:96px;padding:9px 12px" placeholder="e.g. P3 Delivery: replace “1–2 person-month projects” with “projects of one to two quarters”"></textarea></label></div>`, actions: [{ label: 'Cancel' }, { label: 'Submit proposal', cls: 'primary', onClick: (m) => { const t = m.el.querySelector('#ppT').value.trim(); if (!t) return fieldErr(m.el, '#ppT', 'Describe the wording change before submitting.'); const lv = m.el.querySelector('#ppL').value; S.notes.unshift({ kind: 'proposal', date: TODAY.toISOString().slice(0, 10), title: `Proposal for ${lv}`, body: t, by: meFor(c.persona).name }); log(`Proposed a wording change for ${lv}`); save(); NS.toast('Proposal submitted', { desc: `${lv} · queued for the ${F.date(S.settings.nextReview, 'my')} review`, type: 'ok' }); NS.go('/settings', { tab: 'log' }); } }] });
      const an = root.querySelector('[data-add-note]'); if (an) an.onclick = () => NS.modal({ title: 'Add a change-log note', size: 'sm', mounted: (b) => setTimeout(() => b.querySelector('#nT').focus(), 60), body: `<div class="grid gap-3"><label class="ns-field"><span class="ns-label">Title</span><input class="ns-input" id="nT" placeholder="e.g. Clarified M3 Ownership wording"></label><label class="ns-field"><span class="ns-label">Details</span><textarea class="ns-textarea" id="nB" style="height:90px;padding:9px 12px"></textarea></label></div>`, actions: [{ label: 'Cancel' }, { label: 'Add note', cls: 'primary', onClick: (m) => { const t = m.el.querySelector('#nT').value.trim(); if (!t) return fieldErr(m.el, '#nT', 'Give the note a title.'); S.notes.unshift({ kind: 'note', date: TODAY.toISOString().slice(0, 10), title: t, body: m.el.querySelector('#nB').value.trim(), by: meFor(c.persona).name }); log(`Added change-log note “${t}”`); save(); NS.toast('Note added', { type: 'ok' }); NS.refresh(); } }] });
    },
  };

  /* ------------------------------------------------------------------ */
  /* 5. Boot                                                             */
  /* ------------------------------------------------------------------ */
  const personas = [
    { ...D.personas.employee, note: 'My level, next level, self-assessment' },
    { ...D.personas.manager, note: 'Everything + team readiness' },
    { ...D.personas.hrbp, note: 'Any org + framework settings' },
  ];
  const meNav = (persona) => { const me = meFor(persona); const { cur, next } = personLevels(me); return [{ id: 'mylevel', label: `My level · ${cur}`, icon: 'layers', route: '/level/' + cur }, ...(next ? [{ id: 'nextlevel', label: `Next level · ${next}`, icon: 'arrow-up-right', route: '/level/' + next }] : [])]; };
  const assessBadge = (persona) => { const me = meFor(persona); const { cur, next } = personLevels(me); const a = readiness(me.id, cur).rated + (next ? readiness(me.id, next).rated : 0), t = readiness(me.id, cur).total + (next ? readiness(me.id, next).total : 0); return a < t ? `${a}/${t}` : ''; };
  const readyCount = (persona) => teamFor(persona).filter((p) => nextOf(p.level) && readiness(p.id, nextOf(p.level)).band === 'ready').length;
  const LADDER_MARK = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M7.5 3.5v17M16.5 3.5v17"/><path d="M7.5 8h9M7.5 12.5h9" opacity=".55"/><path d="M7.5 17h9"/></svg>';
  NS.app({
    id: 'competency-portal', name: 'Competency Portal', sub: 'Northstar Labs', brand: 'violet', version: '3.0',
    mark: LADDER_MARK,
    searchHint: 'levels, competencies, people',
    category: 'The career atlas',
    create: { label: 'Create a development plan', createLabel: 'New plan', run: () => NS.go('/assess', { tab: 'plan' }) },
    about: { tagline: 'What great looks like at every level — and exactly what changes at the next one.', description: 'The engineering career framework as a product rather than a spreadsheet: sixteen linkable levels across the individual-contributor and management tracks drawn on one seniority scale, every competency descriptor mapped onto the seven Northstar competencies, a level-to-level diff that marks exactly which expectations are new, a self-assessment that turns evidence into a readiness checklist and a development plan, and a readiness view for managers and people partners feeding the calibration cycle.', highlights: [{ icon: 'layers', title: 'One atlas, two tracks', body: 'P0–P6 and M1–M6 on a shared seniority axis, with headcount per rung and your position marked.' }, { icon: 'columns', title: 'Levels diffed like code', body: 'Split or unified view; green lines are new at the next level, red lines are wording it no longer carries.' }, { icon: 'clipboard-check', title: 'Readiness as a checklist', body: 'Rate 1–5 with written proof; coverage, average, evidence, plan and nomination become clear checks.' }, { icon: 'users', title: 'Team & org readiness', body: 'Who is ready, who is developing, who is nominated — with the gap heatmap behind it.' }] },
    personas, defaultPersona: 'employee',
    nav: (persona) => [
      { group: 'Framework', items: [{ id: 'home', label: 'Career ladder', icon: 'home' }, { id: 'compare', label: 'Compare levels', icon: 'columns' }, { id: 'matrix', label: 'Matrix', icon: 'table' }] },
      ...(persona.id === 'employee' ? [{ group: 'My growth', items: [...meNav(persona), { id: 'assess', label: 'Self-assessment', icon: 'clipboard-check', badge: assessBadge(persona) }, { id: 'plan', label: 'Development plan', icon: 'route', route: '/assess?tab=plan', badge: S.plans[persona.personId] ? `${planProgress(S.plans[persona.personId]).d}/${planProgress(S.plans[persona.personId]).n}` : '' }] }]
        : persona.id === 'manager' ? [{ group: 'Team', items: [{ id: 'team', label: 'Team readiness', icon: 'users', badge: readyCount(persona) || '' }, { id: 'assess', label: 'Assess a report', icon: 'clipboard-check' }] }, { group: 'Me', items: meNav(persona) }]
        : [{ group: 'People partner', items: [{ id: 'team', label: 'Org readiness', icon: 'users' }, { id: 'assess', label: 'Assess', icon: 'clipboard-check' }] }, { group: 'Administration', items: [{ id: 'settings', label: 'Framework settings', icon: 'settings' }] }, { group: 'Me', items: meNav(persona) }]),
    ],
    promo: (persona) => { const me = meFor(persona); const next = nextOf(me.level); if (persona.id === 'employee') { const r = readiness(me.id, next); return { title: `${me.level} → ${next} · ${r.pct}%`, body: `${r.rated} of ${r.total} ${next} dimensions rated on your own evidence. Ready line is 75%.`, progress: r.pct, cta: { label: 'Continue', route: '/assess' }, action: { label: 'Continue self-assessment', route: '/assess' } }; } if (persona.id === 'manager') { const t = teamFor(persona); return { title: 'Calibration opens Oct 19', body: `${readyCount(persona)} of ${t.length} reports look ready for a next-level review.`, cta: { label: 'Team readiness', route: '/team' }, action: { label: 'Team readiness', route: '/team' } }; } return { title: 'Framework v3.0', body: `${S.settings.cadence} review · next ${F.date(S.settings.nextReview, 'my')}`, cta: { label: 'Settings', route: '/settings' }, action: { label: 'Framework settings', route: '/settings' } }; },
    notifications: [{ icon: 'user-check', title: 'Priya nominated for P4 review', body: 'Aditya Kulkarni added Priya Raman to the FY26 calibration packet.', time: 'Today', route: '/team' }, { icon: 'clipboard-check', title: 'Self-assessment reminder', body: 'Rate your evidence before manager reviews open on Oct 5.', time: 'Yesterday', route: '/assess' }, { icon: 'layers', title: 'Framework v3.0 published', body: 'Every level is linkable; comparison and self-assessment are built in.', time: 'Sep 12', route: '/settings?tab=log' }, { icon: 'graduation-cap', title: 'New module: Writing effective ADRs', body: 'Added to the P5 learning path.', time: 'Sep 9', route: '/level/P5?tab=growth' }],
    onRoute: (ctx) => { const p = ctx.persona; const set = (id, val) => { const a = document.querySelector(`.ns-nav-item[data-nav="${id}"]`); if (!a) return; let b = a.querySelector('.ns-nav-badge'); if (val === '' || val == null || val === 0) { if (b) b.remove(); return; } if (!b) { b = document.createElement('span'); b.className = 'ns-nav-badge'; a.appendChild(b); } b.textContent = String(val); }; if (p.id === 'employee') { const pl = S.plans[p.personId]; set('assess', assessBadge(p)); set('plan', pl ? `${planProgress(pl).d}/${planProgress(pl).n}` : ''); } else if (p.id === 'manager') set('team', readyCount(p) || ''); },
    routes: R, default: '/home',
    commands: (persona) => { const me = meFor(persona); const { cur, next } = personLevels(me); return [{ label: `Diff ${cur} with ${next || cur}`, icon: 'columns', group: 'Actions', run: () => NS.go('/compare', { a: cur, b: next || cur }) }, { label: `Unified diff ${cur} → ${next || cur}`, icon: 'list', group: 'Actions', run: () => NS.go('/compare', { a: cur, b: next || cur, view: 'unified' }) }, { label: 'Generate development plan', icon: 'wand', group: 'Actions', run: () => NS.go('/assess', { tab: 'plan' }) }, { label: 'Export the competency matrix (CSV)', icon: 'download', group: 'Actions', run: () => NS.go('/matrix') }, ...(persona.id !== 'employee' ? [{ label: 'Nominate someone for promotion', icon: 'user-check', group: 'Actions', run: () => NS.go('/team') }] : []), ...(persona.id === 'hrbp' ? [{ label: 'Propose a framework change', icon: 'pencil', group: 'Actions', run: () => NS.go('/settings') }] : [])]; },
    search: (q) => { const fw = searchFramework(q).map((it) => ({ group: it.kind === 'Level' ? 'Levels' : 'Framework', label: it.label, hint: it.hint, icon: it.icon, run: () => NS.go(it.route, it.query) })); const ppl = q.length < 2 ? [] : D.people.filter((p) => onLadder(p) && p.name.toLowerCase().includes(q.toLowerCase())).slice(0, 5).map((p) => ({ group: 'People', label: p.name, hint: `${label(p.level)} · ${p.team}`, avatar: NS.avatar(p, { size: 'xs' }), run: () => (NS.persona.id === 'employee' ? NS.go('/level/' + p.level) : NS.go('/assess', { p: p.id, org: p.org })) })); return [...fw, ...ppl]; },
    onReset: () => store.clear(),
  });
})();
</script>
</body>
</html>

<script>
(function () {
  'use strict';

  const store = NS.store('retention-radar');
  // The shared model adds +9 for the tenure window but labels the driver 7; align the displayed driver with the points actually applied.
  D.people.forEach((p) => p.riskDrivers.forEach((d) => { if (d.k === 'tenure') d.w = 9; }));
  const TODAY = new Date('2026-09-24T10:00:00');

  const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);

  /* ------------------------------------------------------------------ */
  /* 1. Domain                                                           */
  /* ------------------------------------------------------------------ */
  const BAND = { High: { cls: 'bad', color: 'var(--viz-critical)', min: 65 }, Medium: { cls: 'warn', color: 'var(--viz-warn)', min: 40 }, Low: { cls: 'ok', color: 'var(--viz-good)', min: 0 } };
  const BANDS = ['High', 'Medium', 'Low'];
  const bandOf = (r) => (r >= 65 ? 'High' : r >= 40 ? 'Medium' : 'Low');
  const TYPES = ['Stay interview', 'Compensation review', 'Growth conversation', 'Manager coaching', 'Workload reset', 'Recognition', 'Internal mobility'];
  const TYPE_ICON = { 'Stay interview': 'message-square', 'Compensation review': 'banknote', 'Growth conversation': 'trending-up', 'Manager coaching': 'users', 'Workload reset': 'sliders', 'Recognition': 'award', 'Internal mobility': 'route' };
  const FACTOR = {
    pay: { icon: 'banknote', action: 'Compensation review', why: 'Pay sits under the band midpoint — the single most common exit reason at Northstar.' },
    growth: { icon: 'trending-up', action: 'Growth conversation', alt: 'Internal mobility', why: 'Long time in level; make the path to the next level explicit or open a rotation.' },
    engagement: { icon: 'heart-pulse', action: 'Stay interview', why: 'Engagement is soft — ask what would make them stay before someone else asks what would make them leave.' },
    manager: { icon: 'users', action: 'Manager coaching', why: 'Team-level manager signal is weak; coaching the manager lifts the whole team.' },
    change: { icon: 'git-branch', action: 'Stay interview', why: 'A new manager resets trust; a structured conversation shortens the dip.' },
    tenure: { icon: 'hourglass', action: 'Recognition', why: 'The 18–42 month window is where Northstar historically loses people who feel unseen.' },
    market: { icon: 'globe', action: 'Compensation review', why: 'In-demand skills get recruited — check market position before an offer arrives.' },
    pulse: { icon: 'activity', action: 'Stay interview', why: 'A sharp pulse drop usually has a specific cause; find it.' },
    protect: { icon: 'shield-check', action: null, why: 'Protective factor — reduces the score.' },
  };
  // Model weights as implemented in the shared risk model (ns-data). Tenure adds +9 to the score although its driver label carries 7 — we show the effective +9.
  const MODEL = [
    { k: 'pay', w: 18, alt: 12, rule: 'compa < 0.90 → +18 · 0.90–0.95 and rating ≥ 4 → +12' },
    { k: 'engagement', w: 20, alt: 9, rule: 'engagement < 64 → +20 · 64–71 → +9' },
    { k: 'growth', w: 15, rule: 'IC at P3 or below and > 3 yrs in level → +15' },
    { k: 'manager', w: 10, rule: 'manager-effectiveness signal < 0.65 → +10' },
    { k: 'pulse', w: 10, rule: 'pulse fell 8+ pts over the last quarter → +10' },
    { k: 'tenure', w: 9, rule: 'tenure between 18 and 42 months → +9' },
    { k: 'change', w: 8, rule: 'manager changed in the last 6 months → +8' },
    { k: 'market', w: 6, rule: 'holds an in-demand skill set → +6' },
    { k: 'protect', w: -8, alt: -12, rule: 'rating ≥ 4 and compa ≥ 1.05 → −8 · promoted in the last 12 months → −12' },
  ];
  const REASONS = [['Compensation', 21, 'var(--viz-1)'], ['Growth', 17, 'var(--viz-2)'], ['Better offer', 9, 'var(--viz-3)'], ['Manager', 10, 'var(--viz-4)'], ['Burnout', 8, 'var(--viz-5)'], ['Relocation', 7, 'var(--viz-6)'], ['Other', 3, 'var(--viz-7)']];
  const THEMES = [['Pay below market', 24], ['No visible path to the next level', 19], ['Faster promotion elsewhere', 14], ['Manager turnover', 11], ['On-call and after-hours load', 9], ['Wanted fully remote', 8], ['Equity refresh missing', 7], ['Relocation for family', 7], ['Team re-org fatigue', 6], ['Recognition felt uneven', 5]];
  const HIGH_HIST = [46, 44, 41, 43, 39, 37, 38, 35, 36, 33, 34]; // trailing 11 months; the 12th point is live
  const REPLACEMENT_FACTOR = 0.75; // replacement cost assumption: 0.75 × annual salary (recruiting, ramp, lost output)
  const PULSE_LABELS = D.series.last12.slice(-6);
  const LEVEL_BANDS = [['early', 'Early career (P0–P2)', (p) => p.track === 'IC' && D.levelMap[p.level].order <= 2], ['senior', 'Senior (P3–P4)', (p) => p.track === 'IC' && D.levelMap[p.level].order > 2 && D.levelMap[p.level].order <= 4], ['staff', 'Staff+ (P4.5+)', (p) => p.track === 'IC' && D.levelMap[p.level].order > 4], ['mgr', 'Managers (M)', (p) => p.track === 'M'], ['exec', 'Executives (E)', (p) => p.track === 'E']];
  const TENURE_BANDS = [['lt1', '< 1 yr', (p) => p.tenure < 1], ['1-3', '1–3 yrs', (p) => p.tenure >= 1 && p.tenure < 3], ['3-6', '3–6 yrs', (p) => p.tenure >= 3 && p.tenure < 6], ['6+', '6+ yrs', (p) => p.tenure >= 6]];
  const tenureBand = (t) => (t < 1 ? '< 1 yr' : t < 3 ? '1–3 yrs' : t < 6 ? '3–6 yrs' : '6+ yrs');

  /* scope per persona */
  const HRBP = 'NS-1902', MGR = 'NS-1180', PRIYA = 'NS-1207', REWARDS = 'NS-1930', LAURA = 'NS-1901';
  const scopeOf = (persona) => (persona.id === 'manager' ? D.reports(persona.personId) : persona.id === 'exec' ? D.dept('Engineering') : D.people);
  const scopeName = (persona) => (persona.id === 'manager' ? 'Identity & Access' : persona.id === 'exec' ? 'Engineering' : 'Northstar Labs');
  const inScope = (persona, pid) => scopeOf(persona).some((p) => p.id === pid);
  const meFor = (persona) => D.byId(persona.personId);

  /* ------------------------------------------------------------------ */
  /* 2. Scoring — the documented model, re-implemented for what-if       */
  /* ------------------------------------------------------------------ */
  const featuresOf = (p) => ({ compa: p.compa, engagement: p.engagement, rating: p.rating || 0, timeInLevel: p.timeInLevel, ic: p.track === 'IC', order: D.levelMap[p.level].order, tenure: p.tenure, lowManager: p.riskDrivers.some((d) => d.k === 'manager'), managerChanged: p.managerChanged, hot: p.riskDrivers.some((d) => d.k === 'market'), pulseDrop: p.pulse[5] < p.pulse[2] - 8, promoted: !!(p.lastPromo && p.timeInLevel < 1) });
  const contributions = (f) => {
    const c = [];
    if (f.compa < 0.9) c.push({ k: 'pay', w: 18, label: 'Paid below 90% of band midpoint' }); else if (f.compa < 0.95 && f.rating >= 4) c.push({ k: 'pay', w: 12, label: 'High performer under midpoint' });
    if (f.timeInLevel > 3 && f.ic && f.order <= 3) c.push({ k: 'growth', w: 15, label: `${f.timeInLevel.toFixed(1)} yrs since last promotion` });
    if (f.engagement < 64) c.push({ k: 'engagement', w: 20, label: `Engagement ${Math.round(f.engagement)} (below 64)` }); else if (f.engagement < 72) c.push({ k: 'engagement', w: 9, label: `Engagement ${Math.round(f.engagement)} (soft)` });
    if (f.lowManager) c.push({ k: 'manager', w: 10, label: 'Low manager-effectiveness signal' });
    if (f.managerChanged) c.push({ k: 'change', w: 8, label: 'Manager changed in last 6 months' });
    if (f.tenure > 1.5 && f.tenure < 3.5) c.push({ k: 'tenure', w: 9, label: 'Tenure in the 18–42 month window' });

        </div>

          ${NS.card({ title: 'Actions for your team', actions: `<a class="ns-btn xs ghost" href="${NS.link('/actions')}">Queue</a>`, body: openActs.length ? `<div class="act-hist">${openActs.map((a) => { const p = D.byId(a.pid), o = D.byId(a.owner); return `<div class="it">${NS.avatar(p, { size: 'xs' })}<div class="min-w-0"><b>${a.type}</b> <span class="muted">· ${NS.esc(p.first)}</span><div class="xs muted">${o ? NS.esc(o.first) : '—'} · due ${F.date(a.due, 'short')}</div></div>${statusBadge(a)}</div>`; }).join('')}</div>` : `<div class="sm muted">Nothing open. ${hero ? `Start with ${NS.esc(hero.first)}.` : ''}</div>` })}

})();

<script>
(function () {
  'use strict';
  const P = window.__RR, D = NSData, U = NS.util, F = NS.fmt, ic = NS.ic; const html = P.html;
  const { S, save, log, TODAY, iso, BAND, BANDS, bandOf, FACTOR, TYPE_ICON, LEVEL_BANDS, TENURE_BANDS, tenureBand, scopeOf, scopeName, inScope, meFor, riskOf, bandOfP, actionsFor, openActionsFor, lastActionFor, isOverdue, saveFor, replacementCost, recommended, bandCounts, bandBadge, scoreBar, driverChip, driverBars, personLink, cadence, compPos, statusBadge, downloadCsv, logAction, markSaved, openProfile, teamPulse, baselineOf, R } = P;

  /* shared filter helpers (state lives in the URL) */

  const applyFilters = (people, q) => people.filter((p) => (!q.dept || p.dept === q.dept) && (!q.org || p.org === q.org) && (!q.loc || p.city === q.loc) && (!q.region || p.region === q.region) && (!q.band || bandOfP(p) === q.band) && (!q.lvl || LEVEL_BANDS.find((l) => l[0] === q.lvl)[2](p)) && (!q.ten || TENURE_BANDS.find((t) => t[0] === q.ten)[2](p)) && (!q.driver || p.riskDrivers.some((d) => d.k === q.driver && d.w > 0)) && (!q.act || (q.act === 'open' ? openActionsFor(p.id).length > 0 : q.act === 'none' ? !openActionsFor(p.id).length : q.act === 'saved' ? !!saveFor(p.id) : true)));

        <div class="ns-grid main-side">

          </div>
          <div class="rr-side">
            ${NS.card({ title: 'High risk', sub: highs.length ? `${highs.length} ${highs.length === 1 ? 'person' : 'people'} · ${highs.filter((p) => !openActionsFor(p.id).length).length} without an action` : 'Nobody in this view', bodyCls: 'flush', body: highs.length ? `<div class="hi-list" style="padding:4px 20px;max-height:720px;overflow:auto">${highs.map((p) => `<div class="hi-item"><span class="score-pill High">${riskOf(p)}</span><div class="min-w-0"><div class="hi-top"><button class="ns-person" style="text-align:left;min-width:0;padding:0" data-open="${p.id}"><div class="min-w-0"><div class="nm truncate">${NS.esc(p.name)}</div><div class="sb truncate">${NS.esc(p.team)} · ${D.levelLabel(p.level)}</div></div></button>${openActionsFor(p.id).length ? `<span class="ns-badge info flex-none" data-tip="${NS.esc(openActionsFor(p.id)[0].type)}">${ic('check', { size: 11 })}Action</span>` : `<button class="ns-btn xs primary flex-none" data-log="${p.id}">Log</button>`}</div><div class="chips">${p.riskDrivers.filter((d) => d.w > 0).slice(0, 3).map((d) => driverChip(d, { short: true })).join('')}</div></div></div>`).join('')}</div>` : NS.empty({ icon: 'check-circle', title: 'No High-risk people here', body: 'Widen the filters or switch band.' }) })}

      return html`${NS.pageHead({ eyebrow: `${scopeName(persona)} · explorer`, title: persona.id === 'manager' ? 'Your people' : 'People', sub: `Every score is explainable — open a row for the drivers, the pulse trend and the recommended action. ${F.int(rows.length)} people in view: ${cnt.High} High, ${cnt.Medium} Medium, ${cnt.Low} Low.`, actions: `${clearLink('/people', q)}<button class="ns-btn secondary" data-export>${ic('download')}Export CSV</button>` })}

        { key: 'name', label: 'Person', render: (p) => `<div class="ns-person">${NS.avatar(p, { size: 'sm' })}<div class="min-w-0"><div class="nm">${NS.esc(p.name)}</div><div class="sb truncate" style="max-width:165px">${NS.esc(p.title)} · ${p.level}</div></div></div>` },

        { key: 'compa', label: 'Compa', align: 'right', render: (p) => `<span class="sm tnum ${p.compa < 0.9 ? 'bad-text' : ''}">${p.compa.toFixed(2)}</span>` },

      root.querySelector('#q').oninput = U.debounce((e) => tbl.setSearch(e.target.value), 120);

  R['/people/:id'] = {

        { key: 'date', label: 'Left', render: (x) => `<span class="sm tnum nowrap">${F.date(x.date, 'short')}</span>` },

        { key: 'regretted', label: 'Regretted', render: (x) => (x.regretted && x.voluntary ? NS.badge('Regretted', 'bad', true) : '<span class="faint xs">—</span>'), sort: (x) => (x.regretted ? 1 : 0) },
        { key: 'predicted', label: 'Radar said', cls: 'hide-sm', render: (x) => (x.voluntary ? bandBadge(x.predicted) : '<span class="faint xs">n/a</span>'), sort: (x) => BANDS.indexOf(x.predicted) },
        { key: 'rev', label: 'Council', render: (x) => (S.exitReviews[x.id] ? `<span class="ok-text flex items-center gap-1 sm nowrap">${ic('check-circle', { size: 14 })}Reviewed</span>` : '<span class="faint xs">Pending</span>'), sort: (x) => (S.exitReviews[x.id] ? 1 : 0) },
      ] });
      root.querySelector('#xq').oninput = U.debounce((e) => tbl.setSearch(e.target.value), 120);
      root.querySelector('[data-export]').onclick = () => downloadCsv(`exits-last-12-months-${iso(TODAY)}.csv`, [['Record', 'Name', 'Department', 'Org', 'Team', 'Level', 'Location', 'Region', 'Tenure', 'Left', 'Voluntary', 'Reason', 'Regretted', 'Radar band before exit', 'Themes', 'Council reviewed'], ...tbl.rows().map((x) => [x.id, x.name, x.dept, x.org, x.team, x.level, x.city, x.region, x.tenure, x.date, x.voluntary ? 'Yes' : 'No', x.reason, x.regretted && x.voluntary ? 'Yes' : 'No', x.voluntary ? x.predicted : '', themesOf(x).join('; '), S.exitReviews[x.id] ? 'Yes' : 'No'])]);
    },
  };

  /* ================================================================== */
  /* MODEL — transparency, backtest, calibration, what-if               */
  /* ================================================================== */
  const BACKTEST = { cohort: 'FY25 cohort · Oct ’24 – Sep ’25', rows: [['High', 64, 124], ['Medium', 11, 301], ['Low', 4, 508]] }; // left, stayed
  const CAL = { labels: ['0–9', '10–19', '20–29', '30–39', '40–49', '50–59', '60–69', '70–79', '80–89', '90+'], pred: [0.4, 0.7, 1.1, 1.9, 3.3, 5.6, 14.2, 29.5, 44.8, 61.0], obs: [0.3, 0.9, 1.0, 2.2, 3.0, 6.3, 12.6, 31.7, 41.4, 66.7] };
  const PROTECT = { k: 'protect', label: 'Protective factors', desc: 'Recognised strong performer paid above midpoint, or promoted in the last twelve months.' };
  const factorRows = () => [...D.risk.factors, PROTECT].map((f) => ({ ...f, m: MODEL.find((x) => x.k === f.k) }));
  const importance = (people) => { const pts = {}; people.forEach((p) => contributions(featuresOf(p)).forEach((c) => { pts[c.k] = (pts[c.k] || 0) + Math.abs(c.w); })); const tot = U.sum(Object.values(pts)) || 1; return Object.keys(pts).map((k) => ({ k, share: U.round((pts[k] / tot) * 100, 1), n: people.filter((p) => contributions(featuresOf(p)).some((c) => c.k === k)).length })).sort((a, b) => b.share - a.share); };
  const simFeatures = (p, st) => { const f = featuresOf(p); return { ...f, compa: st.compa, engagement: st.eng, promoted: st.promo || f.promoted, timeInLevel: st.promo ? 0 : f.timeInLevel, lowManager: st.mgr ? false : f.lowManager }; };
  const simDefault = (p) => ({ pid: p.id, compa: U.round(p.compa, 2), eng: p.engagement, promo: false, mgr: false });

  R['/model'] = {
    title: 'Model', personas: ['hrbp', 'exec', 'cpo'],
    render: (c) => {
      const persona = c.persona, scope = scopeOf(persona), q = c.query;
      const tot = BACKTEST.rows.reduce((a, r) => ({ left: a.left + r[1], stayed: a.stayed + r[2] }), { left: 0, stayed: 0 });
      const hi = BACKTEST.rows[0], recall = pct(hi[1], tot.left), precision = pct(hi[1], hi[1] + hi[2]);
      const live = exitsIn(persona).filter((x) => x.voluntary), liveRecall = pct(live.filter((x) => x.predicted === 'High').length, live.length);
      const cands = scope.filter((p) => riskOf(p) >= 40 || p.id === q.p).sort((a, b) => riskOf(b) - riskOf(a));
      let st = S.sim && cands.some((p) => p.id === S.sim.pid) ? S.sim : null;
      if (q.p && cands.some((p) => p.id === q.p) && (!st || st.pid !== q.p)) st = simDefault(D.byId(q.p));
      if (!st) st = simDefault(D.byId(cands.some((p) => p.id === PRIYA) ? PRIYA : cands[0].id));
      S.sim = st; const sp = D.byId(st.pid);
      const scen = S.scenarios.filter((s) => inScope(persona, s.pid));
      return html`${NS.pageHead({ eyebrow: 'Model transparency · v2.0', title: 'How the score works', sub: 'The flight-risk score is a points model, not a black box: nine documented factors add or subtract points from a baseline, and every person’s drivers are shown wherever their score is. Below: the weights, how the model performed on last year’s leavers, and a simulator to test what would move a score.', actions: `<span class="ns-badge">${ic('refresh', { size: 12 })} Retrained ${F.date('2026-09-14', 'med')}</span><button class="ns-btn secondary" data-card>${ic('download')}Model card</button>` })}
        <div class="ns-stats mb-4">
          ${NS.stat({ label: 'Recall · backtest', value: recall, unit: '%', icon: 'radar', sub: `${hi[1]} of ${tot.left} FY25 leavers were flagged High` })}
          ${NS.stat({ label: 'Precision · backtest', value: precision, unit: '%', icon: 'target', sub: `${hi[1]} of ${hi[1] + hi[2]} flagged High actually left` })}
          ${NS.stat({ label: 'Live recall · last 12 months', value: liveRecall, unit: '%', icon: 'activity', sub: `${live.filter((x) => x.predicted === 'High').length} of ${live.length} voluntary leavers${persona.id === 'exec' ? ' in Engineering' : ''}` })}
          ${NS.stat({ label: 'Discrimination (AUC)', value: '0.84', icon: 'bar-chart', sub: 'Ranking quality on the FY25 holdout' })}
        </div>
        <div class="ns-alert brand mb-4">${ic('info')}<div><b>Tuned for recall, on purpose</b><p>A missed resignation costs about ${REPLACEMENT_FACTOR}× salary; an unnecessary stay interview costs thirty minutes. The High threshold (65) is set so that roughly four in five leavers are flagged in advance — which means about two in three people flagged High would have stayed anyway. Treat High as “worth a conversation”, never as a verdict.</p></div></div>
        <div class="ns-grid c2">
          ${NS.card({ title: 'Factors and weights', sub: 'Points added to (or subtracted from) the baseline · rules as implemented', body: `<div>${factorRows().map((f) => `<div class="factor"><span class="ns-icon-box sm ${f.k === 'protect' ? 'ok' : ''}">${ic(FACTOR[f.k].icon)}</span><div class="min-w-0"><b class="sm">${NS.esc(f.label)}</b><div class="xs muted">${NS.esc(f.desc)}</div><div class="rule">${NS.esc(f.m.rule)}</div></div><span class="w ${f.m.w < 0 ? 'neg' : ''}">${f.m.w > 0 ? '+' : '−'}${Math.abs(f.m.w)}${f.m.alt ? ` / ${f.m.alt > 0 ? '+' : '−'}${Math.abs(f.m.alt)}` : ''}</span></div>`).join('')}</div>` })}
          <div class="grid gap-4">
            ${NS.card({ title: 'Feature importance', sub: `Share of all risk points across ${scopeName(persona)} (${F.int(scope.length)} people)`, body: '<div id="impBars"></div>' })}
            ${NS.card({ title: 'Model governance', body: `<dl class="ns-dl"><dt>Version</dt><dd>v2.0 · points model, 9 factors</dd><dt>Last trained</dt><dd>${F.date('2026-09-14', 'long')}</dd><dt>Training data</dt><dd>Oct ’21 – Sep ’25 · 312 voluntary exits</dd><dt>Scoring</dt><dd>Nightly · ${F.int(D.people.length)} people</dd><dt>Never used</dt><dd>Gender, age, ethnicity, nationality, leave or health records</dd><dt>Who sees scores</dt><dd>Manager (own reports), HR partner, leadership. Never the employee; never an input to ratings or pay decisions.</dd><dt>Next review</dt><dd>Dec 2026 retrain · fairness audit</dd></dl>` })}
          </div>
          ${NS.card({ title: 'Backtest · predicted band vs actual exits', sub: `${BACKTEST.cohort} · band at start of year vs voluntary exit within 12 months`, body: `<div class="bt-wrap"><table class="bt-table"><thead><tr><th>Predicted band</th><th>Left</th><th>Stayed</th><th>Total</th><th>Exit rate</th></tr></thead><tbody>${BACKTEST.rows.map(([b, l, s]) => `<tr><td><span class="flex items-center gap-2"><i class="band-dot" style="background:${BAND[b].color}"></i>${b}</span></td><td class="${b === 'High' ? 'hit' : ''}">${l}</td><td>${s}</td><td>${l + s}</td><td>${F.num(pct(l, l + s, 1), 1)}%</td></tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td>${tot.left}</td><td>${tot.stayed}</td><td>${F.int(tot.left + tot.stayed)}</td><td>${F.num(pct(tot.left, tot.left + tot.stayed, 1), 1)}%</td></tr></tfoot></table></div><div class="mstat-row mt-4"><div class="mini-stat"><span>Recall (High)</span><b>${recall}%</b></div><div class="mini-stat"><span>Precision (High)</span><b>${precision}%</b></div><div class="mini-stat"><span>Recall (Medium+)</span><b>${pct(hi[1] + BACKTEST.rows[1][1], tot.left)}%</b></div></div><div id="btBars" class="mt-4"></div>` })}
          ${NS.card({ title: 'Calibration', sub: 'Predicted exit probability vs observed exit rate, by score decile · FY25', body: '<div id="calLine"></div><div class="xs muted mt-2">Close lines mean the probabilities can be taken at face value. The model slightly over-predicts in the 80–89 decile, which is acceptable for a recall-tuned score.</div>' })}
        </div>
        <div class="ns-card mt-4" id="simCard"><div class="ns-card-head"><div><h3>What-if simulator</h3><p>Move the inputs and the score recomputes with the documented weights above. Nothing here changes a real record until you log an action.</p></div></div><div class="ns-card-body">
          <div class="sim">
            <div class="grid gap-4">
              <label class="ns-field"><span class="ns-label">Person <span class="opt">Medium and High risk in ${NS.esc(scopeName(persona))}</span></span><select class="ns-select" id="simP">${cands.map((p) => `<option value="${p.id}" ${p.id === sp.id ? 'selected' : ''}>${NS.esc(p.name)} · ${NS.esc(p.team)} · ${riskOf(p)}</option>`).join('')}</select></label>
              <div class="sim-ctl"><span class="ns-label">Compa-ratio <span><s>now ${sp.compa.toFixed(2)}</s><b id="vCompa">${st.compa.toFixed(2)}</b></span></span><input type="range" class="ns-range" id="sCompa" min="0.75" max="1.3" step="0.01" value="${st.compa}" style="--p:${((st.compa - 0.75) / 0.55) * 100}%"><div class="comp-scale"><span>0.75</span><span>0.90 · pay flag</span><span>1.00 midpoint</span><span>1.30</span></div></div>
              <div class="sim-ctl"><span class="ns-label">Engagement <span><s>now ${sp.engagement}</s><b id="vEng">${st.eng}</b></span></span><input type="range" class="ns-range" id="sEng" min="30" max="100" step="1" value="${st.eng}" style="--p:${((st.eng - 30) / 70) * 100}%"><div class="comp-scale"><span>30</span><span>64 · strong flag</span><span>72 · soft</span><span>100</span></div></div>
              <div class="flex gap-5 wrap"><label class="ns-switch"><input type="checkbox" id="tPromo" ${st.promo ? 'checked' : ''}><i></i><span><b class="sm">Promote this cycle</b><div class="xs muted">Adds the −12 protective factor</div></span></label><label class="ns-switch"><input type="checkbox" id="tMgr" ${st.mgr ? 'checked' : ''}><i></i><span><b class="sm">Resolve manager signal</b><div class="xs muted">Coaching lifts it above 0.65</div></span></label></div>
              <div><div class="flex items-center justify-between mb-2"><span class="ns-label" style="margin:0">Drivers in this scenario</span><span class="xs muted" id="simBase"></span></div><div id="simDrv"></div></div>
            </div>
            <div class="sim-out"><div id="simRing"></div><div id="simBand"></div><div class="sim-delta" id="simDelta"></div><div class="cost" id="simCost"></div><button class="ns-btn primary" data-sim-save>${ic('save')}Save scenario</button><button class="ns-btn secondary" data-sim-log>${ic('plus')}Log as action</button><button class="ns-btn ghost" data-sim-reset>${ic('undo')}Reset to today</button></div>
          </div></div></div>
        <div class="ns-grid c2 mt-4">
          ${NS.card({ title: 'Saved scenarios', sub: scen.length ? `${scen.length} saved · shared with your HR partner` : 'Save a scenario to compare options before a comp or growth conversation', body: scen.length ? `<div>${scen.map((s) => { const p = D.byId(s.pid); return `<div class="sc-row">${NS.avatar(p, { size: 'sm' })}<div class="min-w-0"><b class="truncate" style="display:block">${NS.esc(p.name)}</b><div class="xs muted truncate">compa ${s.fromCompa.toFixed(2)} → ${s.compa.toFixed(2)} · engagement ${s.fromEng} → ${s.eng}${s.promo ? ' · promoted' : ''}${s.mgr ? ' · manager signal fixed' : ''}</div></div><span class="flex items-center gap-2 nowrap"><span class="kscore ${bandOf(s.from)}">${s.from}</span>${ic('arrow-right', { size: 12 })}<span class="kscore ${bandOf(s.risk)}">${s.risk}</span></span><span class="flex gap-1 hide-row"><button class="ns-btn xs ghost" data-sc-load="${s.id}">Load</button><button class="ns-btn xs ghost" data-sc-del="${s.id}" aria-label="Delete scenario">${ic('trash')}</button></span></div>`; }).join('')}</div>` : NS.empty({ icon: 'sliders', title: 'No scenarios yet', body: 'Try Priya Raman at compa 0.95 — the pay driver drops out and she leaves the High band.' }) })}
          ${NS.card({ title: 'Fairness check', sub: 'Average risk score by group · no protected attribute is a model input', body: '<div id="fairBars"></div><div class="xs muted mt-3">Audit rule: any group more than 5 points from the population mean triggers a review of the factor rules.</div>' })}
        </div>`;
    },
    mounted: (c, root) => {
      const persona = c.persona, scope = scopeOf(persona);
      const el = (id) => root.querySelector('#' + id);
      const imp = importance(scope);
      NS.chart.hbars(el('impBars'), { items: imp.map((x) => ({ label: x.k === 'protect' ? 'Protective factors' : D.risk.factors.find((f) => f.k === x.k).label, value: x.share, color: x.k === 'protect' ? 'var(--viz-good)' : 'var(--brand)', sub: `${F.int(x.n)} people carry it` })), format: (v) => F.num(v, 1) + '%', valueLabel: 'Share of points' });
      NS.chart.hbars(el('btBars'), { items: BACKTEST.rows.map(([b, l, s]) => ({ label: `${b} band`, value: U.round((l / (l + s)) * 100, 1), color: BAND[b].color, sub: `${l} of ${l + s} left` })), format: (v) => F.num(v, 1) + '%', valueLabel: 'Exit rate', max: 40 });
      NS.chart.line(el('calLine'), { labels: CAL.labels, series: [{ name: 'Observed exit rate', values: CAL.obs, color: 'var(--brand)' }, { name: 'Predicted probability', values: CAL.pred, color: 'var(--ink-4)', dashed: true }], yFormat: (v) => v + '%', yMin: 0, yMax: 70, height: 260, legend: 'bottom', markers: [{ i: 6, label: 'High ≥ 65' }], area: false });
      const groups = [...[['F', 'Women'], ['M', 'Men'], ['X', 'Non-binary']].map(([g, l]) => ({ l, ps: scope.filter((p) => p.gender === g) })), ...Object.entries(D.regions).map(([r, l]) => ({ l, ps: scope.filter((p) => p.region === r) }))].filter((g) => g.ps.length >= 10);
      const mean = U.avg(scope, riskOf);
      NS.chart.hbars(el('fairBars'), { items: groups.map((g) => { const v = U.round(U.avg(g.ps, riskOf), 1); return { label: g.l, value: v, sub: `${F.int(g.ps.length)} people · ${v - mean >= 0 ? '+' : '−'}${F.num(Math.abs(v - mean), 1)} vs mean`, color: Math.abs(v - mean) > 5 ? 'var(--viz-warn)' : 'var(--viz-1)' }; }), format: (v) => F.num(v, 1), valueLabel: 'Average risk', max: 60 });

      /* simulator */
      const st = S.sim, p = D.byId(st.pid), cur = riskOf(p);
      const draw = () => {
        const res = scoreWith(p, simFeatures(p, st)), b = bandOf(res.risk), d = res.risk - cur;
        el('simRing').innerHTML = NS.ring({ value: res.risk / 100, size: 132, thickness: 12, label: String(res.risk), sub: 'what-if score', color: BAND[b].color });
        el('simBand').innerHTML = bandBadge(b);
        el('simDelta').innerHTML = d === 0 ? '<span class="muted">No change from today</span>' : `<span class="${d < 0 ? 'ok-text' : 'bad-text'}">${d < 0 ? '▼' : '▲'} ${Math.abs(d)} pts vs today (${cur})</span>`;
        const raise = Math.max(0, Math.round((st.compa - p.compa) * p.band.mid)), rc = replacementCost(p);
        el('simCost').innerHTML = raise ? `Pay move costs about <b class="ink">${F.money(raise, { compact: true })}/yr</b> — ${pct(raise, rc)}% of the ${F.money(rc, { compact: true })} it would cost to replace ${NS.esc(p.first)}.` : `Replacing ${NS.esc(p.first)} would cost about <b class="ink">${F.money(rc, { compact: true })}</b> (${REPLACEMENT_FACTOR}× salary).`;
        el('simDrv').innerHTML = driverBars(res.contributions);
        el('simBase').textContent = `Baseline ${Math.round(baselineOf(p))} + ${U.sum(res.contributions, 'w')} from drivers`;

      };
      draw();
      const persist = U.debounce(() => save(), 300);
      const sC = el('sCompa'), sE = el('sEng');
      sC.oninput = () => { st.compa = +(+sC.value).toFixed(2); el('vCompa').textContent = st.compa.toFixed(2); sC.style.setProperty('--p', ((st.compa - 0.75) / 0.55) * 100 + '%'); draw(); persist(); };
      sE.oninput = () => { st.eng = +sE.value; el('vEng').textContent = st.eng; sE.style.setProperty('--p', ((st.eng - 30) / 70) * 100 + '%'); draw(); persist(); };

      el('tMgr').onchange = (e) => { st.mgr = e.target.checked; draw(); persist(); };
      el('simP').onchange = (e) => { S.sim = simDefault(D.byId(e.target.value)); save(); NS.go('/model', { p: e.target.value }); };
      root.querySelector('[data-sim-reset]').onclick = () => { S.sim = simDefault(p); save(); NS.refresh(); };
      root.querySelector('[data-sim-save]').onclick = () => { const res = draw(); S.scenarios.unshift({ id: 'SC-' + Date.now(), pid: p.id, compa: st.compa, eng: st.eng, promo: st.promo, mgr: st.mgr, risk: res.risk, from: cur, fromCompa: p.compa, fromEng: p.engagement, at: iso(TODAY) }); S.scenarios = S.scenarios.slice(0, 12); log(`Saved what-if for ${p.name} (${cur} → ${res.risk})`); save(); NS.toast('Scenario saved', { desc: `${p.name} · ${cur} → ${res.risk} (${bandOf(res.risk)})` }); NS.refresh(); };

      root.querySelector('[data-card]').onclick = () => downloadCsv('retention-radar-model-card-v2.0.csv', [['Factor', 'Weight', 'Alternate weight', 'Rule', 'Description', 'Share of points'], ...factorRows().map((f) => [f.label, f.m.w, f.m.alt || '', f.m.rule, f.desc, ((imp.find((x) => x.k === f.k) || {}).share || 0) + '%']), [], ['Backtest', BACKTEST.cohort], ['Band', 'Left', 'Stayed'], ...BACKTEST.rows, [], ['Replacement cost assumption', `${REPLACEMENT_FACTOR}x annual salary`]]);
    },
  };

  /* ================================================================== */
  /* BOOT                                                                */
  /* ================================================================== */
  const personas = [
    { ...D.personas.hrbp, note: 'Whole company · owns the action queue' },
    { ...D.personas.manager, note: 'Your team only · 9 people' },
    { ...D.personas.exec, note: 'Engineering org · executive summary' },
    { ...D.personas.cpo, note: 'Whole company · board framing' },
  ];
  const overdueIn = (persona) => scopeActs(persona).filter(isOverdue).length;
  const item = (id, label, icon, extra = {}) => ({ id, label, icon, ...extra });
  const actionsItem = (persona) => item('actions', 'Action queue', 'kanban', { badge: highNoAction(scopeOf(persona)).length || '' });
  NS.app({
    id: 'retention-radar', name: 'Retention Radar', sub: 'Northstar Labs', brand: 'cyan', version: '2.0',
    mark: ic('radar', { size: 20 }),
    about: { tagline: 'See who’s drifting before they resign — and what to do about it.', description: 'Predictive attrition and flight-risk analytics for Northstar Labs. Every person gets a nightly, explainable risk score built from nine documented factors — pay position, time in level, engagement, manager signal, re-orgs, the tenure window, external demand and pulse trajectory. The radar shows where risk concentrates, the action queue makes sure every High-risk person has an owner and a date, and the cohort and model views keep the whole thing honest: who actually left, why, and how often the model saw it coming.', highlights: [{ icon: 'radar', title: 'Explainable scores', body: 'Every score shows its drivers and weights — no black box.' }, { icon: 'kanban', title: 'Action queue', body: 'Drag-and-drop retention actions with owners, dates and save tracking.' }, { icon: 'users', title: 'Attrition cohorts', body: 'Exits by quarter, reason, region, tenure and department.' }, { icon: 'sliders', title: 'What-if simulator', body: 'Move pay or engagement and watch the score recompute.' }] },

      : persona.id === 'cpo'
        ? [{ group: 'Board view', items: [item('home', 'Overview', 'home'), item('cohorts', 'Attrition cohorts', 'bar-chart'), item('model', 'Model & what-if', 'sliders')] }, { group: 'Operate', items: [item('radar', 'Radar', 'radar'), item('people', 'People', 'users'), actionsItem(persona)] }]
        : [{ group: persona.id === 'exec' ? 'Engineering' : 'Retention', items: [item('home', persona.id === 'exec' ? 'Summary' : 'Overview', 'home'), item('radar', 'Radar', 'radar'), item('people', 'People', 'users'), actionsItem(persona)] }, { group: 'Insight', items: [item('cohorts', 'Attrition cohorts', 'bar-chart'), item('model', 'Model & what-if', 'sliders')] }],
    promo: (persona) => { const scope = scopeOf(persona), highs = scope.filter((p) => bandOfP(p) === 'High'), gap = highNoAction(scope); if (!highs.length) return { title: 'No High-risk people', body: 'Keep the 1:1 cadence going — the radar re-scores nightly.', cta: { label: 'Team radar', route: '/radar' } }; return gap.length ? { title: `${gap.length} High-risk ${gap.length === 1 ? 'person' : 'people'} without an action`, body: persona.id === 'manager' ? `${gap[0].first} is at ${riskOf(gap[0])} — log a stay conversation or comp review this week.` : `${highs.length - gap.length} of ${highs.length} High-risk people have an owner and a date.`, progress: Math.round(((highs.length - gap.length) / highs.length) * 100), cta: { label: 'Assign owners', route: '/actions' } } : { title: 'Every High-risk person is covered', body: `${overdueIn(persona)} action${overdueIn(persona) === 1 ? ' is' : 's are'} overdue.`, progress: 100, cta: { label: 'Open queue', route: '/actions' } }; },
    notifications: [
      { icon: 'alert-triangle', title: 'Priya Raman moved to High risk (71)', body: 'Paid below 90% of midpoint after an Exceeds rating · Identity & Access', time: 'Today', route: '/people/NS-1207' },
      { icon: 'clock', title: `${S.actions.filter(isOverdue).length} actions overdue`, body: 'Oldest is a stay interview nine days past due.', time: 'Today', route: '/actions?due=overdue' },
      { icon: 'file-text', title: 'Q3 attrition report ready', body: `TTM voluntary attrition ${D.series.attrition[D.series.attrition.length - 1]}% · under the 10% ceiling`, time: 'Yesterday', route: '/cohorts' },
      { icon: 'refresh', title: 'Model v2.0 retrained', body: 'Backtest recall 81% · precision 34% on the FY25 cohort', time: 'Sep 14', route: '/model' },
    ],
    routes: R, default: '/home',
    commands: (persona) => {
      const scope = scopeOf(persona), top = highNoAction(scope).sort((a, b) => riskOf(b) - riskOf(a))[0];
      return [
        { label: 'Log a retention action', icon: 'plus', group: 'Actions', run: () => newActionPicker(persona) },
        ...(top ? [{ label: `Log an action for ${top.name} (${riskOf(top)})`, icon: 'user-plus', group: 'Actions', run: () => logAction(top.id) }] : []),
        { label: 'High risk without an action', icon: 'alert-triangle', group: 'Views', run: () => NS.go('/people', { band: 'High', act: 'none' }) },
        { label: 'Radar · High band only', icon: 'radar', group: 'Views', run: () => NS.go('/radar', { band: 'High' }) },
        { label: 'Overdue actions', icon: 'clock', group: 'Views', run: () => NS.go('/actions', { due: 'overdue' }) },
        ...(persona.id !== 'manager' ? [{ label: 'What-if simulator', icon: 'sliders', group: 'Views', run: () => NS.go('/model') }, { label: 'Recent exits', icon: 'user-minus', group: 'Views', run: () => NS.go('/cohorts') }] : []),
        { label: 'Export people and risk (CSV)', icon: 'download', group: 'Actions', run: () => NS.go('/people') },
      ];
    },
    search: (q) => { if (q.length < 2) return []; const s = q.toLowerCase(); return scopeOf(NS.persona).filter((p) => p.name.toLowerCase().includes(s) || p.team.toLowerCase().includes(s) || p.title.toLowerCase().includes(s)).sort((a, b) => riskOf(b) - riskOf(a)).slice(0, 7).map((p) => ({ group: 'People', label: p.name, hint: `${p.title} · risk ${riskOf(p)} ${bandOfP(p)}`, avatar: NS.avatar(p, { size: 'xs' }), run: () => NS.go('/people/' + p.id) })); },
    onReset: () => store.clear(),
  });
})();
</script>
</body>
</html>
